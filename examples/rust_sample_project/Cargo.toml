# NOT-A-TEST-CRATE: a sample project shipped as documentation of what a Rust
# project under CodeTracer looks like. Its #[cfg(test)] module is part of the
# sample's content, not a test of this repository.

[package]
name = "rust_sample_project"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust_sample_project"
path = "src/main.rs"

[lib]
name = "rust_sample_project_lib"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
