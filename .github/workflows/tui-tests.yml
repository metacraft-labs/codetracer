name: TUI tests
# Called from codetracer.yml (job `tui-tests`), which keeps the trigger, the
# concurrency group and ci-verdict's `needs:`. Split out because codetracer.yml
# reached GitHub's 512,000-byte limit (ci/test/workflow-file-size-test.sh).
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  tui-tests:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; same label as `viewmodel-tests` and `gpui-window-captures`
    # NEW, NO SAMPLE YET, and no local timing either: the host this job was
    # written on could not materialise the dev shell within its free disk.
    # So this bound is structural. The body is Nix and sibling provisioning,
    # `just build-once` (a job whose work is mostly that, `cross-process-
    # linux`, is bounded at 45m), isonim-gpui's shim and `build-gpui` (one
    # cargo build and one front-end compile), `build-tui`, and then ~197 Nim programs
    # compiled and run ONE AT A TIME -- at an ASSUMED 20-30s per
    # compile-and-run of a program importing isonim-tui (an estimate, not a
    # measurement), 65-100m on its own. 180m clears the sum of those upper ends by about a third and stays
    # half of GitHub's 360m default. Tighten it from the first green runs.
    #
    # MEASURED since, on cold GARM runners (PR #903): provisioning, which first
    # realises the dev shell, took 77 to 104 minutes, and `just build-once`
    # ran 85 minutes in one run and to completion in 218 in another (job
    # 127706075383, on a host at load ~100). That is most of the old 180m
    # before a single TUI test. Setup plus the estimate above comes to about
    # 430m on such a host, more than ci/verdict/job-timeouts.py allows (a
    # bound must be tighter than GitHub's 360m default), so this is that
    # ceiling: 355m. It fits a host at ordinary load; tighten it once the job
    # has run on a warm cache.
    timeout-minutes: 355
    # Eight shards: Tier 1 and Tier 2 compile ~225 Nim files one by one (1-6
    # min each), which one job could not finish inside 355 minutes (run
    # 43859070538, cancelled in Tier 1). Each shard runs every 8th file of both
    # lanes (NIM_TEST_LANE_SHARD, ci/test/nim-test-lane-shard-test.sh) and its
    # slice of the terminal scenario lane (SCENARIO_LANE_SHARD; shard 1's slice
    # is the lighter one, since shard 1 also runs the whole-lane checks and
    # CTF-P1b).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: TUI tests (Tier 1 + Tier 2) (${{ matrix.shard }}/8)
    # WHY THIS JOB EXISTS. `just test-tui` and `just test-tui-real-terminal` are
    # the only routes to the `tui` and `tui-real-terminal` lanes of
    # `ci/lib/run-nim-test-lane.sh` -- 133 and 64 files -- and until this job no
    # workflow called either (codetracer-pm issues/2026-11-01-no-ci-lane-calls-
    # the-test-tui-recipes.md). CodeTracer-TUI.md §7.1.6 asserts the TUI's
    # Tier-1 content "fast, per-PR" and makes Tier 2 the terminal-peer check, so
    # both run here, on every push and pull request this workflow runs on.
    # `ci/test/ci-reached-recipes-test.sh` fails if either recipe stops being
    # reached by a workflow lane.
    #
    # WHY ITS OWN JOB AND NOT TWO STEPS OF `viewmodel-tests`. That job is
    # already at its 75-minute bound with no green sample, and these lanes
    # compile ~197 Nim programs serially. Added there, they would either push
    # it past its bound or be cut off by it, and its token (one mint per job,
    # 60-minute life) could not cover a longer job's clones anyway -- here every
    # authenticated clone happens in the first steps.
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        # Recursive: `tui-prereqs` builds the grammar archive the TUI links from
        # the `libs/tree-sitter-*` submodules.
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      # EVERY AUTHENTICATED CLONE IS IN THIS BLOCK, at the top of the job: the
      # installation token minted above expires an hour after it is minted (see
      # `viewmodel-tests`), and this job's bound is longer than that.
      - name: Setup db-backend siblings and the launcher
        # The db-backend siblings are what `just build-once` needs to build
        # `replay-server` (see `gpui-window-captures`). The extra one,
        # `codetracer-launcher`, is the real `ct` two suites execute (see "Build
        # the launcher" below), and its source is what `test_caps_file_shape.nim`
        # imports. It is in this repo's committed `repro.lock`, so it is named
        # BARE and clones at the revision that lock pins -- not at a branch tip.
        # The Tier-2 lane's terminal harness (TermAssert, TermAssertClient,
        # nim-libvterm) comes from the test lock with the scenario siblings, in
        # "Provision dependency siblings from repro.lock" below.
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          extra-siblings: |
            codetracer-launcher

      - name: Clone runquota sibling
        # `just build-once` compiles `ct`, which imports `runquota_process`
        # (see `cross-process-linux`).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-pm sibling
        # Tier 1's spec-reading suites (test_capability_resolution et al.) read
        # ../codetracer-pm and fail without it; cloned at `latest`, as lint-nim.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-pm
          ref: latest
          path: ${{ github.workspace }}/../codetracer-pm
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Provision dependency siblings from repro.lock
        # isonim, isonim-tui, nim-pty, nim-termctl et al., which every TUI suite
        # compiles against through codetracer's top-level `config.nims`. After
        # the step above, which installed Nix: this action reaches `repro`
        # through the dev shell. The token is required: one build input,
        # codetracer-image-diff, is private.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # From the test lock, ci/test/siblings/repro.lock. The scenario lane
          # builds its runner and backend from the first two (ci/test/scenarios.sh);
          # `ci/lib/test-lane-files.sh` compiles every `tui-real-terminal` file with
          # `--path:../TermAssert/src`, `../TermAssertClient/src` and
          # `../nim-libvterm/src`.
          test-siblings: DemoVideoScript,DemoVideoScript-TermAssert,TermAssert,TermAssertClient,nim-libvterm

      - name: Restore ct and replay-server from the ct-build job
        # `test_fixture_corpus.nim` (Tier 1) opens real recorded traces through
        # a real `replay-server`, and on a cold `test-logs/tui-fixtures/` cache
        # records them with `ct`; a missing `replay-server` fails that file by
        # design. ct-build.yml runs build-once once per run (this job `needs:`
        # it), where each of the 8 shards would otherwise rebuild the tree.
        id: ct
        uses: actions/download-artifact@v4
        with:
          name: ct-build-products
          path: ${{ runner.temp }}/ct-build

      - name: Unpack them beside the siblings
        run: tar -xzf "${RUNNER_TEMP}/ct-build/ct-build-products.tar.gz" -C ..

      - name: Build the GPUI front-end the cross-front-end suites drive
        # Four files in these lanes hold the terminal to the same answers as
        # the GPUI front-end and run the SHIPPED `build/bin/codetracer-gpui`
        # over the same recording (`test_plat68_diff13.nim`,
        # `test_plat45_three_media.nim`, `test_plat41_parity.nim`,
        # `real_terminal/test_plat42_diff11.nim`); a missing binary is a
        # failure naming `just build-gpui`, not a skip. The binary dlopens
        # isonim-gpui's featureless shim from `../isonim-gpui/rust/target/debug`,
        # which is built in isonim-gpui's OWN dev shell, as
        # `ci/test/gpui-window-captures.sh` builds it. `../isonim-gpui` is the
        # checkout `provision-repro-lock-siblings` made, at the lock's revision.
        run: |
          (cd ../isonim-gpui && nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/isonim-gpui-shell" --command bash -c 'cd rust && cargo build')
          nix develop .#devShells.x86_64-linux.default --command just build-gpui

      - name: Build the launcher the CTUI-12 suites execute
        # `src/tests/launcher/test_launcher_routes_tui.nim` (Tier 1) and
        # `real_terminal/test_real_launcher_exec.nim` (Tier 2) execute
        # `../codetracer-launcher/out/launcher`, the real `ct`, and fail when it
        # is missing. Nothing in this job used to build it: the suites passed on
        # a persistent runner that kept a launcher from an earlier job, of
        # whatever revision that job had, and failed on an ephemeral one
        # (codetracer-pm issues/2026-11-09-tui-job-runs-launcher-suites-
        # without-building-the-launcher.md). It is built here from the checkout
        # cloned above at this commit's `repro.lock` pin, as `ct` and the GPUI
        # front-end are built from this commit, and in the launcher's OWN dev
        # shell, which provides the Nim and zig its `build.sh` links with -- as
        # isonim-gpui's shim is built in its own shell above.
        # `ci/test/launcher-suites-build-launcher-test.py` fails when a job runs
        # a launcher suite without cloning and building the launcher first.
        run: (cd ../codetracer-launcher && nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-launcher-shell" --command just build)

      - name: TUI Tier 1 — the suites that need no terminal
        # NOT the Tier-1 suites that open an rr recording of a native program
        # (those importing `fixtures/native_recording`, PLAT-60's among them):
        # they are the `tui-native` lane, which `test-ui-tests-rr` runs, because
        # rr does not work on the hosts this job runs on and nothing here builds
        # `ct-native-replay` -- in this lane they skipped every case and failed
        # it (codetracer-pm issues/2026-11-09-tui-job-runs-plat60-and-plat65-
        # without-their-prerequisites.md).
        env:
          NIM_TEST_LANE_SHARD: ${{ matrix.shard }}/8
        run: nix develop .#devShells.x86_64-linux.default --command just test-tui

      - name: TUI Tier 2 — the real binary in a real pty
        # `!cancelled()`, so a Tier-1 failure does not hide whether Tier 2 holds.
        # The recipe builds `build/bin/codetracer-tui` itself (`build-tui`).
        if: ${{ !cancelled() && steps.ct.outcome == 'success' }}
        env:
          NIM_TEST_LANE_SHARD: ${{ matrix.shard }}/8
        run: nix develop .#devShells.x86_64-linux.default --command just test-tui-real-terminal

      - name: Does this shard's scenario slice need the visual replay player?
        # Decided from the slice itself, not a shard number, so a rebalance of
        # the shards moves the player with its scenarios
        # (ci/test/scenario-slice-uses-stage-test.sh).
        id: player
        run: bash ci/test/scenario-slice-uses-stage.sh terminal "${{ matrix.shard }}/8" visual-recording >> "$GITHUB_OUTPUT"

      - name: Build the visual replay player for this shard's visual-recording scenarios
        # terminal/visual-replay-video-player opens a visual recording, which
        # needs ct_gfx_player, ct-native-replay's test licence and ct-mcr; no
        # step built them and the scenario failed with "the visual replay
        # player (ct_gfx_player) is not installed" (run 43996043232, shard 6).
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && steps.player.outputs.needed == 'true' }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash ci/test/visual-replay-tools.sh "$RUNNER_TEMP/visual-replay.env"
          # shellcheck disable=SC1091
          ( . "$RUNNER_TEMP/visual-replay.env"; env | grep -E '^(CODETRACER_|CT_)' ) >> "$GITHUB_ENV"

      - name: Scenarios — the linter, the inventory and the terminal lane
        # CodeTracer's scenario pack (src/tests/scenarios): every scenario
        # against the pack (no step may reach application code), the inventory
        # of the UI tests and their port against the tree, the terminal lane
        # (the shipped binary in a real pty, fast and realistic), the check that
        # a failed run's recording names the failing step, and the
        # documentation's captures against what their scenarios produce now.
        # DemoVideoScript and DemoVideoScript-TermAssert are siblings at
        # repro.lock's pins (provisioned above).
        if: ${{ !cancelled() && steps.ct.outcome == 'success' }}
        env:
          SCENARIO_LANE_SHARD: ${{ matrix.shard }}/8
        # The linter, the inventory, the broken-run check and the docs captures
        # are whole-lane checks: shard 1 runs them, every shard its slice.
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c '
            set -e
            just scenario-build dvs stage terminal
            if [ "${SCENARIO_LANE_SHARD%%/*}" = 1 ]; then just scenario-lint; just scenario-inventory; fi
            just scenario-lane terminal
            if [ "${SCENARIO_LANE_SHARD%%/*}" = 1 ]; then bash ci/test/scenario-broken-run.sh terminal; just docs-captures --check; fi'

      - name: Upload the failed scenario runs (terminal)
        # The recording of every failed run: manifest, per-step stills and
        # state, the failure's screen, the cast. How to read one:
        # .agents/codebase-insights.txt, "Scenario run recordings".
        if: ${{ failure() }}
        uses: metacraft-labs/DemoVideoScript/.github/actions/upload-failed-runs@028ea4f6704fc5377e2c6b7021a9e048c15c9f92
        with:
          build-dir: build
          name: scenario-runs-terminal-${{ matrix.shard }}

      - name: CTF-P1b's Agent Harbor stories on a real terminal, as captures
        # The `tui-real-terminal` suite `test_ctf_p1b_tui_views_cover_web_states`
        # again (Tier 2 above ran it too), now writing every story, theme and
        # size as a picture of the terminal's screen (`build/ctf-p1b/tui/`),
        # the input of the visual review; it fails as the suite does.
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && matrix.shard == 1 }}
        run: nix develop .#devShells.x86_64-linux.default --command just ctf-p1b-tui-captures

      - name: Upload the terminal captures
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: ctf-p1b-tui-captures
          path: build/ctf-p1b/tui/
          retention-days: 7

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-test-logs-${{ matrix.shard }}
          path: test-logs/
          retention-days: 30
