# =============================================================================
# Launcher <-> recorder end-to-end compatibility gate -- REUSABLE WORKFLOW.
#
# WHAT THIS IS
#   The single CI implementation of the bidirectional three-repo gate designed
#   in codetracer-specs/Testing/Launcher-Recorder-Compatibility-Tests.md
#   (milestone LRC-3, design section 6 "CI wiring: three trigger edges, one
#   reusable workflow").  It builds the real launcher, the real desktop core
#   and the real recorder, then runs
#
#       ci/test/launcher-recorder-e2e.sh <recorder-repo> <lang>
#
#   which routes `ct record <sample>` through the LAUNCHER binary and validates
#   the produced CTFS trace with `ct-print` from codetracer-trace-format-nim.
#
# WHY IT LIVES HERE
#   The design's Open Questions record the provisional decision "driver in
#   `codetracer`, reusable workflow calling it".  This repo owns the driver
#   (ci/test/launcher-recorder-e2e.sh), the desktop-core build, the LRC-0
#   component-bundle producer and the scripts/{build,detect}-siblings.sh
#   tooling the driver reuses, so a workflow that only orchestrates them
#   belongs beside them.  `codetracer` is a PUBLIC repository, which is what
#   makes this workflow callable from the private `codetracer-launcher` as well
#   as from the public `codetracer-python-recorder`.
#
# THE THREE EDGES (design section 6 table).  Each caller is a thin
# `workflow_call`; WHICH repo is under test is not something a caller has to
# say, because it is the repo that triggered the run:
#
#   | Trigger repo                | Pinned to github.sha  | Others           |
#   |-----------------------------|-----------------------|------------------|
#   | codetracer-launcher         | the primary checkout  | the workspace    |
#   | codetracer-<lang>-recorder  | the primary checkout  | lock published   |
#   | codetracer (desktop)        | the primary checkout  | for that commit  |
#
#   Callers:
#     codetracer-launcher/.github/workflows/launcher-recorder-e2e.yml
#     codetracer-python-recorder/.github/workflows/launcher-recorder-e2e.yml
#     codetracer/.github/workflows/launcher-recorder-e2e-desktop-edge.yml
#
# WORKSPACE LAYOUT -- WHY THE TRIGGERING REPO IS THE PRIMARY CHECKOUT
#   The runner's working directory is `.../_work/<triggering-repo>/<triggering-
#   repo>` and `clone-siblings` places every sibling at
#   `$GITHUB_WORKSPACE/../<name>`.  Those two facts together mean
#   `$GITHUB_WORKSPACE/../<triggering-repo>` IS `$GITHUB_WORKSPACE`: a repo
#   cannot be cloned as a sibling of its own checkout.  `authenticated-clone.sh`
#   starts with `rm -rf "$DEST"`, so listing the triggering repo among the
#   siblings deletes the primary checkout mid-run.
#
#   So the layout is the one every other cross-repo workflow in this org uses
#   and documents (codetracer-{cairo,beam,evm,flow,fuel}-recorder's
#   cross-repo-tests.yml all carry the same "Workspace layout" header):
#
#     $GITHUB_WORKSPACE/../
#       <triggering repo>/            <-- actions/checkout, at github.sha
#       codetracer/                   <-- this repo: driver + desktop core
#       codetracer-launcher/          <-- hop 1
#       codetracer-<lang>-recorder/   <-- hop 3 + the contract fixture
#       codetracer-trace-format-nim/  <-- ct-print, the trace oracle
#
#   The "Plan the workspace layout" step below derives, from
#   `github.repository`, which of the four the trigger is, drops it from the
#   `siblings:` list, and publishes `ct-dir` -- the path of the codetracer
#   checkout, which is `$GITHUB_WORKSPACE` on the desktop edge and
#   `$GITHUB_WORKSPACE/../codetracer` on the other two.  Every subsequent step
#   runs with that as its working directory, so the driver and
#   scripts/{build,detect}-siblings.sh resolve `../<name>` exactly as they do
#   in a developer's workspace.  That step re-asserts the invariant it exists
#   to keep -- no emitted sibling may equal the triggering repo -- rather than
#   relying on the filter above it having been written correctly, and
#   ci/test/launcher-recorder-e2e-workflow-test.sh RUNS that step's script
#   under each of the five callers' `github.repository` values to prove it.
#
#   On the two edges where codetracer is a sibling it is cloned by
#   `clone-siblings` (shallow, `--submodules-optional`, on the scoped App
#   credential).  That is the same materialisation
#   codetracer-{cairo,beam,evm}-recorder's cross-repo-tests.yml already build
#   `nix build ".?submodules=1#codetracer"` from today, private
#   `libs/tree-sitter-nim` submodule included.
#
# SIBLING PINNING -- codetracer's committed locks (2026-11-24, replacing LRC-6)
#   Every repository this gate clones is pinned by codetracer, at the
#   codetracer revision under test, exactly as for every other codetracer CI
#   job (codetracer-specs Testing/Cross-Repo-CI-Integration.md, "Where sibling
#   pins live"; reprobuild-pm Unified-Locking-And-Hooks.md §14, owner-decided
#   2026-09-30: a commit's committed lock records its develop set, and a record
#   store is consulted only on opt-in):
#
#     * the codetracer revision is `github.sha` when codetracer calls the gate,
#       else what the caller's committed repro.lock pins for codetracer, else
#       the `codetracer-revision` input -- never a branch tip;
#     * public siblings: codetracer's repro.lock (every solved build input,
#       which `provision-repro-lock-siblings` clones) or the test lock
#       ci/test/siblings/repro.lock (named in its `test-siblings`);
#     * private siblings (the launcher, the native backend and recorder): their
#       one home, flake.lock's locked.rev or ci/toolchain.pin's
#       PRIVATE_SIBLING_<NAME>, cloned as `<name>=<rev>`;
#     * a planned sibling none of those pins fails the job by name
#       (ci/launcher-recorder-e2e-resolve-siblings.sh).
#
#   The calling repo is never cloned or reset: it is the primary checkout at
#   `github.sha`, and it is excluded from provisioning.
#
#   WHAT THIS REPLACED. LRC-6 cloned bare names resolved against the per-commit
#   WORKSPACE lock in metacraft-manifests, plus hand-written `=<sha>` pins for
#   isonim, isonim-tui, runquota and the io-mon family. Publication of those
#   lock records stopped once the record store became opt-in (2026-09-30), so a
#   bare name resolved against the caller's own lock, which does not record
#   codetracer's develop set, and the hand pins drifted from the codetracer
#   being built (isonim 196dfe18 against a lock expecting 38ace5de).
#
# THE TWO PREREQUISITE BLOCKS THE DRIVER DELIBERATELY DOES NOT PROVIDE
#   (inherited from LRC-2's step-2 deviation; see the milestones file)
#
#   1. THE DESKTOP CORE.  The driver RESOLVES an already-built core and exits 1
#      with "Build it with: just build-once" when there is none -- a tens-of-
#      minutes build inside the gate would make a core-build break read as a
#      launcher/recorder incompatibility.  So this workflow builds it, in its
#      own visible step, before invoking the driver.  That step gates on BOTH
#      the exit code of `just build-once` AND the artifacts.
#
#      It used to gate on the artifact alone, on the reasoning that build-once
#      "currently exits 1 on a later tree-sitter-nim cargo job AFTER emitting a
#      working bin/ct".  That tolerance is gone, and the step's own comment
#      records why it should never have been written: the exit-1 had TWO
#      independent causes rather than the one named, and a core that failed
#      part-way had no `bin/replay-server`, no frontend bundle and no
#      runtime-asset check.  Both causes are fixed (nix/shells/ci-base.nix,
#      scripts/build-once.sh); the exit code is the gate.
#
#   2. RUNNER PREREQUISITES, each a hard failure in the driver rather than a
#      skip, so a missing one is a red gate and never a silent green:
#        * a musl toolchain or `zig` for codetracer-launcher/build.sh (without
#          either it falls back to `cc` and fails the link on -ldl/-lc).
#          Provisioned explicitly below instead of being left to the driver's
#          on-demand `nixpkgs#zig` fetch, so the cost is visible in the log and
#          attributable to its own step.
#
#          PROVISIONING IT IS NOT THE SAME AS IT BEING USED, and on this repo's
#          NixOS runners it was not.  codetracer-launcher/build.sh's own header
#          documents the probe order as `$ZIG` first, but its code probes
#          musl-gcc, then `find /nix/store ... -name
#          x86_64-unknown-linux-musl-gcc | head -1`, and only THEN `$ZIG`.  No
#          musl-gcc is on PATH here, so the unpinned scavenge outranked the zig
#          this step deliberately materialised; a nixpkgs cc-wrapper added its
#          default hardening and the launcher weighed 54,304 bytes against a
#          51,200 cap -- `FAIL: over 50 KB cap by 3104 bytes`, on all three
#          arms of runs 33983224255 and 33991455608.  THE REPAIR IS IN
#          codetracer-launcher/build.sh, not here, and raising the cap is not
#          it: on the shipping musl-tools toolchain the launcher measures
#          50,328 bytes with 872 to spare, so the cap is doing its job.  Note
#          also that this gate resolves the launcher through the WORKSPACE
#          LOCK, so a fix landing on the launcher's `dev` does not reach this
#          gate until a lock is published for a codetracer commit that pins it.
#        * `ct-print` from codetracer-trace-format-nim -- the design section 5.4
#          trace-validation oracle -- built through
#          scripts/build-siblings.sh --only codetracer-trace-format-nim/ct-print.
#        * the recorder sibling's own build, which the driver drives through
#          scripts/build-siblings.sh --only <key>.  That needs `direnv` on PATH
#          (declared in nix/shells/ci-base.nix) AND each freshly cloned sibling
#          `.envrc` whitelisted -- a fresh clone's .envrc is in direnv's
#          "blocked" state and `direnv exec` refuses to run it.  Both are done
#          below.
#
# LANDING ORDER -- a real precondition, not a formality
#   Two of the three edges reference this file by ref
#   (`...launcher-recorder-e2e.yml@dev`) and check `codetracer` out at its
#   mainline branch, so nothing can go green until the LRC-0/1/2 work this gate
#   consumes is ON that branch:
#     * codetracer@dev must carry ci/test/launcher-recorder-e2e.sh, the
#       `just test-launcher-recorder-e2e` recipe, scripts/build-desktop-component.sh,
#       the reconciled resources/codetracer-desktop-capabilities, and the two new
#       scripts/build-siblings.sh entries;
#     * codetracer-python-recorder@dev must carry cross-repo/launcher-compat.yml
#       and its samples -- the driver hard-fails without the fixture rather than
#       skipping;
#     * this file itself must be on codetracer@dev for `@dev` to resolve.
#   Until then the two remote callers fail at workflow resolution, and the local
#   desktop-edge caller fails inside the driver with "contract fixture not
#   found".  Both are loud failures, which is the intended behaviour.  `dev` is
#   the mainline branch for product repos per
#   metacraft-dev-guidelines/policies/branching-policy.md, and the `@dev` in the
#   two remote callers is the last place this workflow still names a branch.
#
#   SINCE LRC-6 THE SIBLING REVISIONS ARE THE LOCK'S, NOT `dev`'s, so "on the
#   mainline branch" is no longer sufficient: the lock published for the commit
#   under test must PIN a revision of each sibling that carries what this gate
#   needs -- in particular `<recorder>/cross-repo/launcher-compat.yml`, without
#   which the driver hard-fails.  The lock currently published for
#   codetracer@23d3965b pins recorder revisions from 2026-07-13/2026-07-31,
#   which predate that fixture; codetracer's lock has to be refreshed from a
#   workspace whose recorder checkouts carry it.  The workspace-shape step
#   below now names that failure explicitly instead of leaving it to the
#   driver's later "contract fixture not found".
#
# RELATIONSHIP TO THE SHALLOW SMOKE WORKFLOWS
#   codetracer-launcher/.github/workflows/cross-repo-recorder-packaging.yml and
#   each recorder's launcher-integration.yml are RETAINED as a fast pre-check.
#   They assert only `ct --version` and never run `ct record`, so they are
#   explicitly NON-AUTHORITATIVE for the record contract; this workflow is the
#   authority.  See the header comments in those two files.
# =============================================================================

name: launcher-recorder-e2e (reusable)

on:
  workflow_call:
    inputs:
      edge:
        description: >
          Human-readable label for the trigger edge under test, e.g.
          "codetracer-launcher@github.sha -> python".  Used for the job name
          and echoed into the log so a run is self-describing.
        required: true
        type: string
      recorder-repo:
        description: >
          The recorder sibling repo directory name, e.g.
          codetracer-python-recorder.  Must match `recorder.repo` in that
          repo's cross-repo/launcher-compat.yml -- the driver refuses to run
          when they disagree.
        required: true
        type: string
      recorder-lang:
        description: >
          The `ct` language key, e.g. `python`.  Must match `recorder.lang` in
          the contract fixture.
        required: true
        type: string
      extra-siblings:
        description: >
          Newline-separated BARE repo names to clone beside the four this gate
          always spans, for an edge whose recording toolchain is larger than
          one recorder.  Empty for every edge but the native one.


          WHY IT EXISTS.  `ct record <extension-less binary>` does not reach
          codetracer-native-recorder directly: the desktop core asks
          `ct-native-replay recognize --format=json` what the target is and
          then runs `ct-native-replay record --backend mcr`, and THAT spawns
          `ct-mcr`.  `ct-native-replay` is built from codetracer-native-backend,
          so the native edge spans five repos rather than four and cannot be
          expressed by `recorder-repo` alone.  The alternative -- hardcoding a
          `if recorder == native` branch in the planner -- would put a fact
          about one recorder inside the shared workflow, which is the thing
          this gate's fixture design exists to avoid.


          Entries are BARE names for the same reason every other sibling is:
          the revision comes from codetracer's locks.  The planner
          refuses an entry carrying `=<ref>`, and refuses one naming the
          triggering repo, exactly as it does for the fixed four.
        required: false
        default: ""
        type: string
      codetracer-revision:
        description: >
          The codetracer commit (40-hex) to build and test against, used ONLY
          when the calling repo's committed repro.lock does not pin codetracer.
          The lock wins when it does, and codetracer calling this gate always
          tests itself at github.sha. Never a branch: with neither the lock
          nor this input the gate fails rather than build a tip. This is the
          "explicit workflow input override" codetracer-specs
          Testing/Cross-Repo-CI-Integration.md allows; every other sibling
          revision comes from codetracer's locks at that commit.
        required: false
        default: ""
        type: string
      # No other `*-ref` inputs. The triggering repo is `github.sha`, and every
      # sibling is pinned by codetracer at the codetracer revision under test
      # (see "Resolve every gate sibling" below): repro.lock and
      # ci/test/siblings/repro.lock for public repositories, flake.lock or
      # ci/toolchain.pin PRIVATE_SIBLING_* for private ones. LRC-6 took these
      # revisions from the per-commit WORKSPACE lock; reprobuild retired that
      # as CI's source on 2026-09-30 (reprobuild-pm Unified-Locking-And-Hooks
      # §14), and a bare name here then resolved against the caller's own lock,
      # which does not record codetracer's develop set.
    secrets:
      CI_TOKEN_PROVIDER_APP_ID:
        # Optional because some repos carry the App ID as a repository/org
        # VARIABLE rather than a secret (see
        # codetracer-specs/Testing/Cross-Repo-CI-Integration.md, "CI
        # Authentication Setup"); the step below falls back to
        # vars.CI_TOKEN_PROVIDER_APP_ID, which resolves against the CALLING
        # repository.  Callers pass `secrets: inherit`.
        required: false
      CI_TOKEN_PROVIDER_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  launcher-recorder-e2e:
    # Self-hosted per org policy, and the same label every other nix job in
    # these repos uses (codetracer/.github/workflows/cross-repo-tests.yml,
    # codetracer-launcher/.github/workflows/cross-repo-recorder-packaging.yml,
    # codetracer-python-recorder/.github/workflows/launcher-integration.yml).
    # H4: routed to gpu-server-002. Note this reusable workflow is called three
    # times concurrently by launcher-recorder-e2e-desktop-edge.yml (python /
    # ruby / js), so it lands 3 of -g2's 4 slots at once; -g2 carries the
    # lighter share of codetracer.yml's build wave to leave room for it.
    runs-on: [self-hosted, linux, x64] # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    name: ${{ inputs.edge }}
    timeout-minutes: 180

    steps:
      - name: Plan the workspace layout
        # See "WORKSPACE LAYOUT" in this file's header.  The triggering repo is
        # the primary checkout, because `clone-siblings` cannot clone a repo
        # into a directory that already is `$GITHUB_WORKSPACE`.  This step
        # decides, from `github.repository` (which in a reusable workflow is
        # always the CALLER), which of the four repos that is, and emits:
        #
        #   self       -- the triggering repo's directory name
        #   siblings   -- the remaining three, as BARE clone-siblings entries
        #                 (no `=ref`: the revision comes from the workspace
        #                 lock -- see "SIBLING PINNING" in this file's header);
        #                 the triggering repo is DROPPED
        #   ct-dir     -- the codetracer checkout every later step runs in
        #
        # There is no `self-ref` any more: the primary checkout is pinned to
        # `${{ github.sha }}` directly, which is the caller's commit.
        #
        # A repo that is none of the four is refused here, loudly, rather than
        # silently producing a workspace with no codetracer in it.
        #
        # Inputs reach every `run:` step in this workflow through `env:`, never
        # by direct `${{ }}` interpolation into the script body: an interpolated
        # value is spliced in as shell TEXT, so a quote or a `;` in it would be
        # parsed as syntax.  These inputs come from workflow files under org
        # control, but the safe spelling costs nothing and keeps the steps
        # copy-pasteable.
        id: plan
        shell: bash
        env:
          EDGE: ${{ inputs.edge }}
          RECORDER_REPO: ${{ inputs.recorder-repo }}
          RECORDER_LANG: ${{ inputs.recorder-lang }}
          EXTRA_SIBLINGS: ${{ inputs.extra-siblings }}
          SELF_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SELF="${GITHUB_REPOSITORY##*/}"
          case "${SELF}" in
            codetracer | codetracer-launcher | "${RECORDER_REPO}") ;;
            *)
              echo "::error::launcher-recorder-e2e was called from '${GITHUB_REPOSITORY}', which is neither codetracer, codetracer-launcher nor the recorder under test (${RECORDER_REPO}). This gate's workspace layout puts the TRIGGERING repo at \$GITHUB_WORKSPACE and clones the other three beside it, so a fourth caller has no defined place in it. Add the edge deliberately rather than by calling this workflow."
              exit 1
              ;;
          esac

          PARENT="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
          if [ "${SELF}" = "codetracer" ]; then
            CT_DIR="${GITHUB_WORKSPACE}"
          else
            CT_DIR="${PARENT}/codetracer"
          fi

          # The four repos this gate spans, minus whichever one is the primary
          # checkout, by NAME only. Each one's revision comes from codetracer's
          # locks or its private home at the codetracer revision under test
          # (ci/launcher-recorder-e2e-resolve-siblings.sh); a `name=<ref>`
          # entry here would bypass that -- see "SIBLING PINNING" above.
          SIB_NAMES=(codetracer codetracer-launcher "${RECORDER_REPO}" codetracer-trace-format-nim)
          SIB_ENTRIES=()
          for n in "${SIB_NAMES[@]}"; do
            if [ "${n}" != "${SELF}" ]; then
              SIB_ENTRIES+=("${n}")
            fi
          done
          if [ "${#SIB_ENTRIES[@]}" -ne 3 ]; then
            echo "::error::expected exactly 3 siblings beside '${SELF}' from the four fixed repos, got ${#SIB_ENTRIES[@]}. recorder-repo='${RECORDER_REPO}' probably collides with one of the fixed names."
            exit 1
          fi

          # Extra siblings for an edge whose recording toolchain is larger than
          # one recorder (today: the native edge's codetracer-native-backend).
          # Appended AFTER the count check above, so that check keeps meaning
          # what it means -- "the four fixed repos minus the trigger" -- and a
          # recorder-repo colliding with a fixed name is still caught.  Every
          # invariant below applies to these entries too; nothing about them is
          # exempt.
          while IFS= read -r extra; do
            extra="$(printf '%s' "${extra}" | tr -d '[:space:]')"
            [ -n "${extra}" ] || continue
            for existing in "${SIB_ENTRIES[@]}"; do
              if [ "${existing}" = "${extra}" ]; then
                echo "::error::extra-siblings entry '${extra}' is already one of this gate's four fixed repos. clone-siblings would clone it twice; drop it from extra-siblings."
                exit 1
              fi
            done
            SIB_ENTRIES+=("${extra}")
          done <<EXTRA_SIBLINGS_EOF
          ${EXTRA_SIBLINGS}
          EXTRA_SIBLINGS_EOF

          # THE INVARIANT, RE-ASSERTED RATHER THAN ASSUMED. The filter above is
          # what keeps the triggering repo out of the sibling list, and the
          # cost of it being wrong is not a failed test: the runner workspace
          # is `.../_work/<repo>/<repo>`, `clone-siblings` clones to
          # `$GITHUB_WORKSPACE/../<name>`, and `authenticated-clone.sh` opens
          # with `rm -rf "$DEST"` -- so a triggering repo listed as its own
          # sibling DELETES THE PRIMARY CHECKOUT mid-run. That defect was live
          # once (see "WORKSPACE LAYOUT" above); this makes its return a named
          # error in the first step instead.
          #
          # The `=` check is the migration's own invariant: no entry may carry
          # an explicit revision, because revisions come from the lock.
          for e in "${SIB_ENTRIES[@]}"; do
            if [ "${e}" = "${SELF}" ]; then
              echo "::error::sibling entry '${e}' IS the triggering repo. clone-siblings would clone it to \$GITHUB_WORKSPACE/../${e}, which is \$GITHUB_WORKSPACE itself, and authenticated-clone.sh starts by 'rm -rf'-ing its destination -- deleting the primary checkout mid-run."
              exit 1
            fi
            case "${e}" in
              *=*)
                echo "::error::sibling entry '${e}' carries an explicit '=<ref>'. Sibling revisions come from codetracer's locks at the codetracer revision under test; an override pins nothing and makes the run unreproducible. Declare the repository in codetracer's repro.nim or ci/test/siblings/repro.nim instead."
                exit 1
                ;;
            esac
          done

          echo "edge:                         ${EDGE}"
          echo "triggering repo (primary):    ${SELF} @ ${SELF_SHA}"
          echo "recorder:                     ${RECORDER_REPO} (lang: ${RECORDER_LANG})"
          echo "codetracer checkout will be:  ${CT_DIR}"
          echo "siblings to clone beside it (revisions from codetracer's locks):"
          for e in "${SIB_ENTRIES[@]}"; do echo "  ${e}"; done

          {
            echo "self=${SELF}"
            echo "ct-dir=${CT_DIR}"
            echo "siblings<<LRC6_SIBLINGS_EOF"
            for e in "${SIB_ENTRIES[@]}"; do echo "${e}"; done
            echo "LRC6_SIBLINGS_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Mint installation token for cross-repo sibling access
        # GitHub's free plan restricts org-level secrets with visibility ALL
        # from being readable inside private repos, so every workflow in this
        # org mints a per-run installation token from the CI Token Provider
        # GitHub App.  `secrets.*` arrives via the callers' `secrets: inherit`;
        # `vars.*` is the fallback for repos that hold the App ID as a variable
        # (both spellings exist across this org today).
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout the triggering repository (the workspace root)
        # The PRIMARY checkout is the repo that triggered the run -- see
        # "WORKSPACE LAYOUT" in this file's header for why it cannot be
        # anything else.  It is pinned to `github.sha`, which inside a reusable
        # workflow is the CALLING repository's commit under test: on a push
        # that is the pushed commit, on a pull_request the merge commit the
        # checks run against.  This is THE repo-under-test pin, and it needs no
        # input from the caller (LRC-6 removed the four `*-ref` inputs; before
        # that, each caller passed `<self>-ref: ${{ github.sha }}` and this step
        # read it back, which is the same value by a longer route).
        #
        # `submodules: recursive` matters on the desktop edge: the core build
        # needs libs/tree-sitter-nim, a PRIVATE submodule of this public repo,
        # which is why this step needs the App token.  On the other two edges
        # it is a no-op for repos that have no submodules.
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Resolve the codetracer revision under test
        # SIBLING PINNING (2026-11-24). Every repo this gate clones is pinned by
        # codetracer: its `repro.lock` and the test lock
        # `ci/test/siblings/repro.lock` for public repos, and for the private
        # ones their one home, `flake.lock` or `ci/toolchain.pin`
        # `PRIVATE_SIBLING_*` (codetracer-specs Testing/Cross-Repo-CI-Integration.md,
        # "Where sibling pins live"; reprobuild Unified-Locking-And-Hooks §14).
        # Those are read at the codetracer revision under test, so the siblings
        # always match the codetracer that is built. That revision is:
        #   * the commit under test, when codetracer is the caller;
        #   * otherwise the revision the CALLER's committed repro.lock pins for
        #     codetracer;
        #   * otherwise the `codetracer-revision` input (40-hex).
        # Never a branch tip; with none of the three, the gate fails here.
        id: ct_rev
        shell: bash
        env:
          SELF: ${{ steps.plan.outputs.self }}
          SELF_SHA: ${{ github.sha }}
          INPUT_REV: ${{ inputs.codetracer-revision }}
        run: |
          set -euo pipefail
          rev="" source=""
          if [ "${SELF}" = codetracer ]; then
            rev="${SELF_SHA}" source="the commit under test"
          else
            if [ -f "${GITHUB_WORKSPACE}/repro.lock" ]; then
              # One `deps` entry per `{ ... }`; take the one named exactly
              # "codetracer" and its 40-hex revision.
              while IFS= read -r entry; do
                if [[ "${entry}" =~ name\ =\ \"codetracer\" ]] && [[ "${entry}" =~ revision\ =\ \"([0-9a-f]{40})\" ]]; then
                  rev="${BASH_REMATCH[1]}"
                fi
              done < <(grep '^deps' "${GITHUB_WORKSPACE}/repro.lock" | tr '{' '\n')
              [ -z "${rev}" ] || source="${SELF}'s committed repro.lock"
            fi
            if [ -z "${rev}" ] && [ -n "${INPUT_REV}" ]; then
              rev="${INPUT_REV}" source="the codetracer-revision input"
            fi
          fi
          if ! [[ "${rev}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::no codetracer revision to test against: ${SELF}'s committed repro.lock does not pin codetracer, and the caller passed no 40-hex codetracer-revision input (got '${rev}'). This gate never builds a branch tip."
            exit 1
          fi
          echo "codetracer revision under test: ${rev} (from ${source})"
          echo "- codetracer revision under test: \`${rev}\` (from ${source})" >>"${GITHUB_STEP_SUMMARY}"
          echo "rev=${rev}" >>"${GITHUB_OUTPUT}"

      - name: Clone codetracer at that revision
        if: steps.plan.outputs.self != 'codetracer'
        uses: metacraft-labs/metacraft-github-actions/git-auth@a190f3a8b37c5a239d88b8c964b6d13f64fbaa0d
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}
          working-directory: ${{ github.workspace }}
          run: |
            set -euo pipefail
            ct_dir="${{ steps.plan.outputs.ct-dir }}"
            rm -rf "${ct_dir}"
            git init -q "${ct_dir}"
            git -C "${ct_dir}" remote add origin https://github.com/metacraft-labs/codetracer
            git -C "${ct_dir}" fetch -q --depth 1 origin "${{ steps.ct_rev.outputs.rev }}"
            git -C "${ct_dir}" -c advice.detachedHead=false checkout -q FETCH_HEAD
            git -C "${ct_dir}" submodule update -q --init --recursive --depth 1
            echo "codetracer at $(git -C "${ct_dir}" rev-parse HEAD)"

      - name: Resolve every gate sibling from codetracer's locks and homes
        # Each name the planner emits (except codetracer and the calling repo)
        # is either PRIVATE -- cloned below as `<name>=<rev>` from its one home
        # at this codetracer revision -- or PUBLIC, cloned by
        # provision-repro-lock-siblings from codetracer's repro.lock or test
        # lock. A name in none of them FAILS here by name: that is the negative
        # control ci/test/launcher-recorder-e2e-workflow-test.sh drives.
        id: resolve
        shell: bash
        env:
          SELF: ${{ steps.plan.outputs.self }}
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          PLANNED: ${{ steps.plan.outputs.siblings }}
        run: |
          set -euo pipefail
          bash "${CT_DIR}/ci/launcher-recorder-e2e-resolve-siblings.sh" \
            --ct-dir "${CT_DIR}" --self "${SELF}" --planned "${PLANNED}" \
            --out "${GITHUB_OUTPUT}"

      - name: Setup dev env + clone the private gate siblings
        # Only the PRIVATE gate siblings go through here, each as an explicit
        # `<name>=<rev>` read from its one home at the codetracer revision
        # under test. The calling repo is listed too: clone-siblings skips an
        # entry naming the triggering repository, so it is a no-op that keeps
        # the list non-empty (an empty list would fall back to the caller's own
        # .github/sibling-repos).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev

        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          # THE NIX CREDENTIAL MUST OUTLIVE THE HOUR, BECAUSE THIS JOB DOES.
          # With the App's id and key, setup-dev-env starts its job credential
          # broker, which re-mints the Nix GitHub credential before it expires
          # and rewrites the job's credential files in place, so every later
          # `nix` and `repro exec` reads a live token on its next fetch.
          # Without them the broker step is skipped and nix keeps presenting
          # `gh-token` after it expires.  Ruby-recorder PR #146, job
          # 131497234823: token minted 22:29:44; at 00:03:05 the shared
          # preparation's `repro exec` evaluated tools/ruby-sdk/default.nix,
          # whose `builtins.fetchTree` of the PUBLIC nixpkgs tarball got
          # `HTTP error 401 "Bad credentials"`.  The prefetch step below
          # cannot cover that: it fetches flake inputs, not what a non-flake
          # expression fetches during a later evaluation.  The broker mints
          # its own `contents: read` tokens through its own channel, so this
          # job still has exactly one mint step.  The id takes the same
          # secret-or-variable spelling as the `ci_token` mint above, and both
          # arrive through the callers' `secrets: inherit`.
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          app-private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            ${{ steps.plan.outputs.self }}
            ${{ steps.resolve.outputs.private }}

      - name: Stage codetracer's provisioning action at the revision under test
        # `uses:` cannot take an expression, so the action is copied from the
        # codetracer checkout into this workspace and used from there: the
        # action that provisions the siblings is the one at the codetracer
        # revision whose locks it reads.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: |
          set -euo pipefail
          src="${CT_DIR}/.github/actions/provision-repro-lock-siblings/action.yml"
          if ! grep -q '^  codetracer-dir:' "${src}"; then
            echo "::error::codetracer $(git -C "${CT_DIR}" rev-parse HEAD) predates provision-repro-lock-siblings' codetracer-dir input, so this gate cannot provision from it. Test against a codetracer revision that carries it."
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/.lrc-actions/provision-repro-lock-siblings"
          cp "${src}" "${GITHUB_WORKSPACE}/.lrc-actions/provision-repro-lock-siblings/action.yml"

      - name: Clone the public gate siblings from codetracer's locks
        uses: ./.lrc-actions/provision-repro-lock-siblings
        with:
          codetracer-dir: ${{ steps.plan.outputs.ct-dir }}
          exclude: ${{ steps.plan.outputs.self }}
          test-siblings: ${{ steps.resolve.outputs.test-siblings }}
          root-default-shell: "false"
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID || vars.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Check the workspace has the shape the driver expects
        # Cheap, and it turns the one class of failure a local rehearsal cannot
        # reproduce -- a sibling that did not land where the driver looks for
        # it -- into a named error at the top of the log instead of a confusing
        # one thirty minutes in.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          RECORDER_REPO: ${{ inputs.recorder-repo }}
        run: |
          set -euo pipefail
          missing=""
          for d in "${CT_DIR}" "${CT_DIR}/../codetracer-launcher" \
                   "${CT_DIR}/../${RECORDER_REPO}" \
                   "${CT_DIR}/../codetracer-trace-format-nim"; do
            if [ -d "${d}" ]; then
              echo "  OK   ${d}"
            else
              echo "  MISSING ${d}"
              missing="${missing} ${d}"
            fi
          done
          if [ ! -f "${CT_DIR}/ci/test/launcher-recorder-e2e.sh" ]; then
            missing="${missing} ${CT_DIR}/ci/test/launcher-recorder-e2e.sh"
            echo "  MISSING ${CT_DIR}/ci/test/launcher-recorder-e2e.sh"
          fi
          if [ -n "${missing}" ]; then
            echo "::error::the workspace is not laid out the way the gate needs:${missing}. Every repo this gate spans must sit beside the codetracer checkout (\$GITHUB_WORKSPACE/../<name>). If ci/test/launcher-recorder-e2e.sh is what is missing, the codetracer revision this run resolved does not carry the driver yet."
            exit 1
          fi

          # THE SCRIPTS LATER STEPS RUN, CHECKED AGAINST THE REVISION THEY WILL
          # RUN FROM. This file is resolved at `@dev` by every remote caller,
          # but the codetracer checkout it drives is the codetracer revision
          # under test (the caller's lock or the codetracer-revision input) --
          # two different revisions of one repo. When a step here starts
          # running a script that an older codetracer does not have, every edge
          # whose lock pins that older codetracer dies in that step, after the
          # ten-minute core build, as `bash: <script>: No such file or
          # directory` / exit 127. That is not hypothetical: `Check the gate's
          # decoded-trace reasoning` landed with its script in e705fbad5
          # (2026-09-19), and python run 35503672483 and js run 35503680304,
          # pinned to codetracer e42e4855 / ac0cec46 (2026-09-09 / -10), both
          # ended exactly that way. Name it here, in seconds, with the remedy.
          #
          # Every repo-relative `bash <path>.sh` a step of this workflow runs
          # from CT_DIR belongs in this list (the driver itself is checked
          # above, and the `just` recipes that reach it landed with it in
          # 521b3d71a); ci/test/launcher-recorder-e2e-workflow-test.sh derives
          # that set from this file and fails when one is missing, so a new
          # step cannot quietly reintroduce the skew.
          for script in scripts/build-siblings.sh ci/build/bounded-build-once.sh ci/test/launcher-recorder-decode-test.sh; do
            if [ ! -f "${CT_DIR}/${script}" ]; then
              echo "  MISSING ${CT_DIR}/${script}"
              echo "::error::the codetracer revision under test ($(git -C "${CT_DIR}" rev-parse HEAD 2>/dev/null || echo unknown)) predates ${script}, which a later step of this workflow runs. This workflow is taken from codetracer@dev, the checkout it drives is taken from the lock, and the lock published for the commit under test pins a codetracer that is too old for it. Test against a codetracer revision that carries ${script}: move the codetracer pin in the caller's repro.lock (or the codetracer-revision input) forward."
              exit 1
            fi
            echo "  OK   ${CT_DIR}/${script}"
          done

          # THE REVISION, NOT JUST THE DIRECTORY (added by LRC-6).  Sibling
          # revisions come from codetracer's locks, so "the recorder is
          # checked out" no longer implies "the recorder is checked out at a
          # revision this gate can use": a lock written before the contract
          # fixture landed pins a revision that has no
          # cross-repo/launcher-compat.yml, and the driver would fail forty
          # minutes later with "contract fixture not found" and no hint as to
          # why.  Name it here instead, with the remedy.
          FIXTURE="${CT_DIR}/../${RECORDER_REPO}/cross-repo/launcher-compat.yml"
          if [ ! -f "${FIXTURE}" ]; then
            echo "::error::${RECORDER_REPO} is checked out but carries no cross-repo/launcher-compat.yml. Its revision came from codetracer's lock at the codetracer revision under test, which pins a revision that PREDATES the contract fixture. Refresh codetracer's repro.lock from a workspace whose ${RECORDER_REPO} checkout carries the fixture; do NOT pin it in this workflow."
            exit 1
          fi
          echo "  OK   ${FIXTURE}"

      - name: Fetch every flake input later steps evaluate, while the token is valid
        # THE JOB'S ONE GITHUB CREDENTIAL DIES 60 MINUTES AFTER IT IS MINTED,
        # AND THIS JOB OUTLIVES IT.  `setup-dev-env` hands the installation
        # token minted above to nix as `access-tokens = github.com=<token>`
        # (and to its netrc).  GitHub installation tokens "expire one hour
        # from the time you create them", and this job may mint only one
        # (metacraft-dev-guidelines/policies/ci-workflow-standards.md, "Two
        # token-mint steps in one job"; ci/test/sibling-provisioning-test.sh
        # enforces it).  After that hour nix still presents the dead token on
        # every github.com fetch it has not already cached, and GitHub answers
        # `401 Bad credentials` -- for PUBLIC repos as well as private ones.
        #
        # Desktop-edge run 36407231861 is what that costs.  Two arms died in
        # `Build ct-print`, which is the first step that evaluates the
        # codetracer-trace-format-nim flake (through `repro exec`):
        #
        #   ruby  mcl-003  minted 10:39:59  ct-print's fetch ~12:05 (+85 min)
        #     unable to download 'https://api.github.com/repos/metacraft-labs/
        #     nix-codetracer-toolchains/tarball/8e48d78a...': HTTP error 401
        #     "message": "Bad credentials"
        #   beam  garm     minted 10:54:44  ct-print step 12:17  (+83 min)
        #     build-siblings.sh: ERROR: required toolchain lookup failed
        #
        # "Bad credentials", not "Not Found", is the tell: nix sent a token and
        # GitHub rejected it; a missing credential gets a 404 for a private
        # repo.  The two arms that passed reached the same fetch inside the
        # hour (python, mcl-004: ct-print done 17 min after its mint) or had
        # that revision cached from an earlier job on a persistent host (js,
        # mcl-005, whose ct-print ran past its expiry and still passed).  So
        # whether an arm survives depends on the host's cache and load, not
        # on the commit under test.
        #
        # THE ORG'S ANSWER IS TO DO EVERY AUTHENTICATED FETCH NEAR THE TOP OF
        # THE JOB (codetracer.yml's "THE THREE SIBLING CLONES ... ARE
        # DELIBERATELY ADJACENT" is the git-clone instance of it), and this is
        # the nix instance.  Each dev shell a later step enters is EVALUATED
        # here -- evaluation is what fetches flake inputs, and builds do not
        # use this token -- so every input lands in the store and in nix's
        # fetcher cache (under this job's $HOME, which repro's nix inherits:
        # the 401 above proves it read the same nix.conf) while the token is
        # good.  A later evaluation of the same locked revision is answered
        # from that cache instead of GitHub -- which is exactly how the js arm
        # survived its expiry on a host that had fetched it before:
        #
        #   codetracer                  #ci      every `nix develop` below
        #   codetracer                  default  build-siblings' toolchain lookup
        #                                        (`repro exec` on codetracer)
        #   codetracer-trace-format-nim default  `Build ct-print`
        #   <recorder>                  default  the gate's recorder build
        #
        # `.?submodules=1` and `--no-write-lock-file` are how both `nix develop`
        # below and repro's `useFlakeDevShell()` spell the flake, so the lock
        # resolution here is the one those steps repeat.  Evaluation only: no
        # dev shell is built, so the work the later steps do is not moved or
        # duplicated.  A sibling with no flake.nix has nothing for a later step
        # to evaluate and is skipped.
        #
        # REPRO'S OWN TOOL PROVISIONING IS A FETCH NO DEV SHELL EVALUATES, so
        # it is fetched here FIRST, explicitly.  `repro exec` (the shared
        # preparation below, build-siblings' toolchain lookup, and every
        # sibling build after them) realizes the tools a repo's `repro.nim`
        # declares from reprobuild's package catalog, and every `nixpkgs#`
        # entry there resolves against ONE nixpkgs revision,
        # `CanonicalNixpkgsRev` in reprobuild's
        # libs/repro_dsl_stdlib/src/repro_dsl_stdlib/nixpkgs_pin.nim.  repro
        # fetches it itself, as `github:NixOS/nixpkgs/<rev>?narHash=<hash>`,
        # and no flake evaluated below reaches that ref.  Launcher run
        # 40412127662's beam arm died on exactly it, ~2 h after the mint:
        #
        #   unable to download 'https://api.github.com/repos/NixOS/nixpkgs/
        #   tarball/addf7cf5f383...': HTTP error 401 "Bad credentials"
        #
        # The shared preparation below does not reach this fetch in time on
        # its own.  It enters codetracer's `ci` shell before it runs `repro
        # exec`, and realizing that shell is the longest wait in the job when
        # the binary cache is slow.  Ruby-recorder run 42982584550 (garm):
        # token minted 07:51; this step took 51 min and the preparation 72;
        # repro's fetch of nixpkgs addf7cf5 inside the preparation got the
        # same 401 at 09:57.
        #
        # This is a FETCH, not a preparation.  It puts the tree repro will
        # ask for into the store and nix's fetcher cache while the token is
        # good, and nothing else: it selects no package, realizes no tool and
        # does not stand in for the shared preparation, which still activates
        # every environment through the SDK.  The revision is READ, never
        # restated: the reprobuild that provides `repro` to this job is
        # codetracer's `reprobuild` flake input (nix/shells/ci-base.nix:
        # `inputs'.reprobuild.packages`, and REPROBUILD_SOURCE_ROOT for the
        # stdlib the provider compiles against), so the pin file is read out
        # of THAT input at the revision this checkout's flake.lock locks, and
        # the exact ref repro will ask for is fetched.  A codetracer whose
        # flake has no direct `reprobuild` input gets repro from elsewhere and
        # is skipped; a pin file that no longer reads is an error naming it,
        # because skipping it silently would reopen the 401 above.
        #
        # NO CREDENTIAL IS HANDLED HERE.  nix reads the token from the
        # user-level nix.conf `setup-nix` wrote (mode 600); this step never
        # names it, and nix's diagnostics carry the URL, never the header.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          RECORDER_REPO: ${{ inputs.recorder-repo }}
        run: |
          set -euo pipefail
          PIN_FILE="libs/repro_dsl_stdlib/src/repro_dsl_stdlib/nixpkgs_pin.nim"
          rb_node=""
          if [ -f "${CT_DIR}/flake.lock" ]; then
            rb_node="$(jq -r '.nodes.root.inputs.reprobuild // "" | if type == "string" then . else "" end' "${CT_DIR}/flake.lock")"
          fi
          if [ -z "${rb_node}" ]; then
            echo "no direct reprobuild input in ${CT_DIR}/flake.lock (repro's tool-provisioning nixpkgs is not this flake's to name)"
          else
            rb_ref="$(jq -r --arg n "${rb_node}" '.nodes[$n].locked | if .type == "github" then "github:\(.owner)/\(.repo)/\(.rev)?narHash=\(.narHash | @uri)" else "" end' "${CT_DIR}/flake.lock")"
            if [ -z "${rb_ref}" ]; then
              echo "::error::codetracer's reprobuild flake input is not a locked github input, so this step cannot read the nixpkgs revision repro provisions tools from. Teach this step the input's type; skipping it would leave that fetch to after the token expires."
              exit 1
            fi
            if ! rb_json="$(nix flake prefetch --json "${rb_ref}")"; then
              echo "::error::could not fetch ${rb_ref} (codetracer's reprobuild input, which names the nixpkgs repro provisions tools from) while this job's GitHub token is still valid; nix's own diagnostic is above this line."
              exit 1
            fi
            rb_src="$(jq -r '.storePath // ""' <<<"${rb_json}" 2>/dev/null || true)"
            pin="${rb_src}/${PIN_FILE}"
            np_rev=""
            np_nar=""
            if [ -n "${rb_src}" ] && [ -f "${pin}" ]; then
              np_rev="$(sed -n -E 's|^[[:space:]]*CanonicalNixpkgsRev\*?[[:space:]]*=[[:space:]]*"([0-9a-f]{40})".*|\1|p' "${pin}")"
              np_nar="$(sed -n -E 's|^[[:space:]]*CanonicalNixpkgsNarHash\*?[[:space:]]*=[[:space:]]*"(sha256-[A-Za-z0-9+/=]+)".*|\1|p' "${pin}")"
            fi
            if [ -z "${np_rev}" ] || [ -z "${np_nar}" ]; then
              echo "::error::could not read CanonicalNixpkgsRev / CanonicalNixpkgsNarHash from ${PIN_FILE} in ${rb_ref}. That pair names the nixpkgs repro realizes every catalog tool from; this step must fetch it while the token is valid. If reprobuild moved or renamed it, update this step."
              exit 1
            fi
            np_nar_q="${np_nar//+/%2B}"
            np_nar_q="${np_nar_q//\//%2F}"
            np_nar_q="${np_nar_q//=/%3D}"
            np_ref="github:NixOS/nixpkgs/${np_rev}?narHash=${np_nar_q}"
            started="${SECONDS}"
            if ! nix flake prefetch "${np_ref}" >/dev/null; then
              echo "::error::could not fetch ${np_ref} (the nixpkgs repro provisions tools from) while this job's GitHub token is still valid; nix's own diagnostic is above this line."
              exit 1
            fi
            echo "fetched: ${np_ref} (repro tool provisioning; ${rb_ref}) ($((SECONDS - started))s)"
          fi

          SYSTEM="$(nix eval --impure --raw --expr builtins.currentSystem)"
          PARENT="$(cd "${CT_DIR}/.." && pwd)"
          dirs=("${CT_DIR}" "${CT_DIR}" "${PARENT}/codetracer-trace-format-nim" "${PARENT}/${RECORDER_REPO}")
          shells=(ci default default default)
          for i in "${!dirs[@]}"; do
            dir="${dirs[$i]}"
            attr="devShells.${SYSTEM}.${shells[$i]}"
            if [ ! -f "${dir}/flake.nix" ]; then
              echo "no flake.nix in ${dir} (nothing a later step evaluates there)"
              continue
            fi
            started="${SECONDS}"
            if ! (cd "${dir}" && nix eval --raw --no-write-lock-file ".?submodules=1#${attr}.drvPath" >/dev/null); then
              echo "::error::could not evaluate ${attr} of ${dir} while this job's GitHub token is still valid; nix's own diagnostic is above this line and names the input. A later step evaluates exactly this, after the token has expired, so it would fail the same way or worse. An 'HTTP error 401' or '404' here means the CI Token Provider installation cannot read that input's repository."
              exit 1
            fi
            echo "fetched: ${dir} #${attr} ($((SECONDS - started))s)"
          done

      - name: Prepare selected Repro toolchains before long running gates
        # Same SDK shell and roots as build-siblings.sh and the driver.
        # Provisioning refusals are infrastructure, before any decoder verdict.
        uses: metacraft-labs/metacraft-github-actions/prepare-repro-envs@80542fb7298e274fd739d06c6f626f227ace308a
        with:
          working-directory: ${{ steps.plan.outputs.ct-dir }}
          nix-shell: .?submodules=1#ci
          projects: |
            ${{ steps.plan.outputs.ct-dir }}
            ${{ steps.plan.outputs.ct-dir }}/../codetracer-trace-format-nim
            ${{ steps.plan.outputs.ct-dir }}/../${{ inputs.recorder-repo }}

      - name: Provision the musl/zig toolchain for the launcher link
        # INHERITED LRC-3 DELIVERABLE (runner prerequisites).
        #
        # codetracer-launcher/build.sh links a FULLY STATIC musl binary.  It
        # probes musl-gcc -> a /nix/store musl wrapper -> zig, and a dev shell
        # with none of them makes it fall back to `cc`, which then fails the
        # link on -ldl/-lc.  Neither codetracer's `ci` nor its `default` dev
        # shell declares zig or a musl toolchain, so one has to be provided.
        #
        # The driver can materialise `nixpkgs#zig` on demand, but doing it here
        # is better on an ephemeral runner: the nix-cache fetch becomes its own
        # timed, named step instead of being hidden inside the gate, and a
        # cache/network outage fails with a diagnostic about zig rather than
        # about the launcher's linker.  The fetch itself is already routine on
        # this runner class -- both retained smoke workflows shell out to
        # `nix shell nixpkgs#zig` / `nix-shell -p zig` on eph-linux-x64 today.
        #
        # A musl toolchain in the dev shell would remove the fetch entirely,
        # but that means editing codetracer's flake, which is a separate,
        # announced change (it widens the closure for every CI job in the repo).
        # No working directory of its own: `nixpkgs#zig` is a registry flake
        # reference, not a path, so this step is independent of the checkout.
        shell: bash
        run: |
          set -euo pipefail
          ZIG_OUT="$(nix build --no-link --print-out-paths nixpkgs#zig)"
          if [ -z "${ZIG_OUT}" ] || [ ! -x "${ZIG_OUT}/bin/zig" ]; then
            echo "::error::could not materialise nixpkgs#zig; codetracer-launcher/build.sh would fall back to 'cc' and fail the static musl link on -ldl/-lc."
            exit 1
          fi
          "${ZIG_OUT}/bin/zig" version
          echo "${ZIG_OUT}/bin" >> "${GITHUB_PATH}"
          echo "zig provisioned at ${ZIG_OUT}/bin"

      - name: Allow direnv in the freshly cloned siblings
        # INHERITED LRC-3 DELIVERABLE (runner prerequisites).
        #
        # scripts/build-siblings.sh runs every sibling build as
        # `direnv exec <repo> <cmd>` so each repo's own flake pins its
        # toolchain.  A FRESH clone's .envrc is in direnv's "blocked" state and
        # direnv refuses to run it -- the same failure
        # cross-repo-tests.yml already works around for
        # codetracer-native-recorder.  Whitelist each sibling that has one.
        #
        # `direnv` itself is declared in nix/shells/ci-base.nix, so it is on
        # PATH inside the shell used here; the check below turns a future
        # removal into a named failure instead of a bare "direnv: not found"
        # exit 127 deep inside the driver.
        #
        # THE TWO FAILURE MODES ARE SEPARATED ON PURPOSE, and the reason is a
        # real misdiagnosis this step produced. `nix develop <shell> --command
        # <probe>` exits non-zero for two unrelated reasons: the shell did not
        # BUILD, or it built and the probe failed. A single `|| { echo direnv
        # is not on PATH; }` reports the second for both.
        #
        # In run 33021054045 the `ci` shell failed to build — reprobuild would
        # not compile against the runquota revision this repo pinned — and this
        # step announced "direnv is not on PATH in the codetracer ci dev shell"
        # while nix's own `Error: undeclared identifier: 'ExtensionCellWire'`
        # scrolled past above it. The claim was not merely unhelpful, it was
        # FALSE, and provably so from this file: the comment four lines up
        # states direnv is declared in ci-base.nix, and it is. Anyone trusting
        # the error would have gone looking for a missing package in a shell
        # that never existed.
        #
        # So the shell is built first, on its own, and a failure there is
        # reported as what it is. Only a shell that exists is then asked
        # whether it has direnv.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          RECORDER_REPO: ${{ inputs.recorder-repo }}
        run: |
          set -euo pipefail
          cd "${CT_DIR}"
          if ! nix develop '.?submodules=1#ci' --command true; then
            echo "::error::the codetracer 'ci' dev shell FAILED TO BUILD (nix develop '.?submodules=1#ci'); nix's own diagnostic is above this line and names the derivation that failed. Nothing about direnv or the siblings has been established -- this step got no shell to look inside. Fix the shell first."
            exit 1
          fi
          nix develop '.?submodules=1#ci' --command bash -c 'command -v direnv' \
            || { echo "::error::the codetracer 'ci' dev shell builds, but direnv is not on PATH inside it; scripts/build-siblings.sh cannot build any sibling without it. direnv is declared in nix/shells/ci-base.nix -- check whether that declaration was removed."; exit 1; }
          for sib in "codetracer-launcher" "${RECORDER_REPO}" "codetracer-trace-format-nim"; do
            dir="$(cd .. && pwd)/${sib}"
            if [ -f "${dir}/.envrc" ]; then
              nix develop '.?submodules=1#ci' --command direnv allow "${dir}"
              echo "direnv allow: ${dir}"
            else
              echo "no .envrc in ${dir} (nothing to allow)"
            fi
          done

      - name: Build the codetracer-desktop core
        # INHERITED LRC-3 DELIVERABLE #1.  See this file's header.
        #
        # THE EXIT CODE OF `just build-once` IS THE GATE.  An earlier version
        # of this step tolerated a non-zero exit as long as `bin/ct` had been
        # emitted, which was wrong: the build stops at its first failing action,
        # so a failure means the later steps (the frontend bundle, the
        # runtime-asset check) did not run and `bin/ct` alone says nothing about
        # them.  The build is `repro build` (Reprobuild is the only build
        # system), which fails as a whole when an action fails.
        #
        # Two independent defects in one cargo invocation used to be named here
        # as one: the tree-sitter-nim `src/parser.c` that is not tracked in the
        # submodule (nix/shells/ci-base.nix and scripts/build-once.sh generate
        # it), and the db-backend build script's `direnv exec` on a
        # codetracer-native-recorder clone whose `.envrc` was never allowed
        # (scripts/build-once.sh sets CODETRACER_DB_BACKEND_SKIP_DIRENV).
        #
        # The artifact check stays — it is worth having on its own — and
        # asserts `bin/replay-server` as well as `bin/ct`, so a repeat of either
        # root fails HERE, naming the artifact, rather than surfacing later as a
        # replay that cannot start.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          # Every build-input sibling must sit at the revision codetracer's
          # repro.lock pins, except the calling repo, which is the commit
          # under test. build-once prints that one override (name, lock
          # revision, actual revision) to the log and the job summary, and
          # fails on any other disagreement (ci/sibling-lock-agreement.sh).
          CODETRACER_REQUIRE_LOCKED_SIBLINGS: "1"
          CODETRACER_OFF_LOCK_SIBLING: ${{ steps.resolve.outputs.off-lock }}
        run: |
          set -euo pipefail
          cd "${CT_DIR}"
          # The way codetracer's own ct-build job builds (ct-build.yml): bounded,
          # and without the repro daemon (FIRST_MINUTES=0). With the daemon,
          # build-once handed its actions to whatever repro daemon the host
          # already ran, and they failed with `clang: not found` and compiled
          # print_trace.nim against a store copy of codetracer-trace-format-nim
          # that lacks forEachMarkerEvent (native-recorder run 45315757263).
          nix develop '.?submodules=1#ci' --command \
            bash ci/build/bounded-build-once.sh "${RUNNER_TEMP}/build-once-diagnostics" 0 90
          CT_BIN="src/build-debug-repro/bin/ct"
          if [ ! -x "${CT_BIN}" ]; then
            echo "::error::the desktop core was not built: no executable at ${CT_BIN}. The launcher<->recorder gate cannot run without hop 2; this is deliberately a hard failure and never a skip."
            exit 1
          fi
          # The db-backend cargo job is the one both of the roots above killed,
          # and `bin/replay-server` is what it copies out. Asserting it is what
          # makes a repeat of either root fail HERE, naming the artifact,
          # rather than surfacing later as a replay that cannot start.
          RS_BIN="src/build-debug-repro/bin/replay-server"
          if [ ! -x "${RS_BIN}" ]; then
            echo "::error::the desktop core is incomplete: no executable at ${RS_BIN}. That binary is produced by the db-backend cargo action that the tree-sitter-nim parser.c and the replay-server direnv defects each killed; its absence means that action failed again."
            exit 1
          fi
          ls -l "${CT_BIN}" "${RS_BIN}"
          nix develop '.?submodules=1#ci' --command "./${CT_BIN}" --version
          echo "desktop core artifact check: OK"

      - name: Upload the build-once stall diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: launcher-recorder-e2e-build-once-diagnostics
          path: ${{ runner.temp }}/build-once-diagnostics
          if-no-files-found: ignore

      - name: Build ct-print (the trace-validation oracle)
        # INHERITED LRC-3 DELIVERABLE (runner prerequisites).
        #
        # design section 5.4: every assertion about a produced trace goes
        # through codetracer-trace-format-nim's `ct-print`.  The driver treats a
        # missing ct-print as a hard failure (never a skip), so build it here.
        # `codetracer-trace-format-nim/ct-print` is the second logical key
        # LRC-2 added to scripts/build-siblings.sh; the repo builds it at its
        # own root because downstream tests resolve it at the fixed sibling
        # path ../codetracer-trace-format-nim/ct-print.
        #
        # BOUNDED AND VISIBLE.  The step used to have no limit of its own, so a
        # stall in it held a runner slot until the job's 180-minute limit, and
        # its log said nothing while it did: build-siblings.sh captured the
        # toolchain lookup and the build into files, and the step printed only
        # what came before them (codetracer-pm issue 2026-11-06-launcher-
        # recorder-e2e-build-ct-print-hangs-silently-until-the-job-timeout.md).
        # The timeout below covers the `nix develop` shell entry as well as the
        # build.  BUILD_SIBLINGS_VERBOSE streams the build's own output into
        # this log, and build-siblings.sh bounds its toolchain lookup
        # (BUILD_SIBLINGS_TOOLCHAIN_TIMEOUT, 20 minutes by default) and names
        # that stage before it starts, so a stall shows which one it is in.
        timeout-minutes: 60
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          BUILD_SIBLINGS_VERBOSE: "1"
        run: |
          set -euo pipefail
          cd "${CT_DIR}"
          nix develop '.?submodules=1#ci' --command \
            bash scripts/build-siblings.sh --only codetracer-trace-format-nim/ct-print
          CT_PRINT="$(cd .. && pwd)/codetracer-trace-format-nim/ct-print"
          if [ ! -x "${CT_PRINT}" ]; then
            echo "::error::codetracer-trace-format-nim/ct-print was not produced. It is the gate's only trace decoder (design section 5.4); without it the test could assert no more than 'some bytes appeared'."
            exit 1
          fi
          ls -l "${CT_PRINT}"

      - name: Check the gate's decoded-trace reasoning
        # Runs HERE, and not in codetracer.yml's bash-only verdict lane, for one
        # reason: it asserts against codetracer-trace-format-nim's real ct-print
        # goldens rather than against documents it writes itself, and this is
        # the workflow that has that sibling checked out.  A skip when the
        # sibling is absent is exactly the vacuous pass this initiative exists
        # to prevent, so the suite hard-fails instead -- which would make it a
        # permanent red in a lane that provisions nothing.
        #
        # It is cheap (stock bash, no build) and it runs BEFORE the gate, so a
        # break in the shape discrimination, the empty-recording guard, the
        # functions/event-type lookups or the recorded-payload search is
        # reported as itself rather than as a mysterious assertion failure
        # forty minutes into a recording.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
        run: |
          set -euo pipefail
          cd "${CT_DIR}"
          bash ci/test/launcher-recorder-decode-test.sh

      - name: Run the launcher <-> recorder end-to-end gate
        # The recorder sibling itself is built by the driver's step 3
        # (scripts/build-siblings.sh --only <key>, with the key read from the
        # recorder's own cross-repo/launcher-compat.yml), which is why the
        # direnv step above exists.
        #
        # LAUNCHER_RECORDER_E2E_ALLOW_MISSING is deliberately NOT set: design
        # section 5.5 makes a missing sibling a hard failure, and that escape
        # hatch is documented as local-iteration only, never for a required
        # gate.  The driver's own zero-test guard fails the run if fewer
        # scenarios execute than the fixture declares.
        shell: bash
        env:
          CT_DIR: ${{ steps.plan.outputs.ct-dir }}
          RECORDER_REPO: ${{ inputs.recorder-repo }}
          RECORDER_LANG: ${{ inputs.recorder-lang }}
        run: |
          set -euo pipefail
          cd "${CT_DIR}"
          nix develop '.?submodules=1#ci' --command \
            just test-launcher-recorder-e2e "${RECORDER_REPO}" "${RECORDER_LANG}"
