name: Build the visual replay tools for the shards
on:
  workflow_call:

# ct-native-replay (with its test licence's verifying key), ct_gfx_player and
# ct-mcr, built ONCE per run, in parallel with ct-build, for the shards whose
# work opens a visual recording: GPUI shard 1 (plat59) and the TUI shard whose
# scenario slice uses the `visual-recording` stage. GPUI shard 1 used to build
# them itself, about 22 of its 73 capture minutes in run 44269676398 (ct-mcr
# alone), and ran into its 90-minute limit. The shards restore them; where the
# artifact is missing or short they build as before (ci/test/visual-replay-
# tools.sh), so this job failing costs time, never a result.

permissions:
  contents: read
  id-token: write

jobs:
  visual-replay-tools:
    runs-on: [self-hosted, linux, x64]
    # Cold, the build is most of it: 50 minutes in run 45822112077, 40 of them
    # ct_cli's release compile, and on a loaded host that compile alone ran
    # past 64 minutes and the job past its old 150 (run 45959049981, after 36
    # of provisioning). A warm job restores the products from the cache below
    # and builds nothing.
    timeout-minutes: 210
    name: Build the visual replay tools (once per run)
    steps:
      - name: Record when the job started
        # For the cache push at the end, whose budget is what the job's time
        # limit leaves.
        run: echo "CT_JOB_STARTED_AT=$(date +%s)" >>"$GITHUB_ENV"

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Clone runquota sibling
        # `just build-once` compiles `ct`, which imports `runquota_process`
        # (see `cross-process-linux`).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # From the test lock, ci/test/siblings/repro.lock: the scenario lane builds
          # its runner and backend from these (ci/test/scenarios.sh).
          test-siblings: DemoVideoScript,DemoVideoScript-GuiAssert,GuiAssert

      - name: Read the private siblings' pins
        # The four repos the tools build from are private, so the public
        # repro.lock cannot pin them and provisioning does not clone them
        # (bbf7dbed4a6). native-backend, native-recorder and visual-replay take
        # flake.lock's revisions; snapshot-codecs, which visual-replay's
        # config.nims puts on the Nim path, has no flake input and takes
        # ci/toolchain.pin's.
        id: private_pins
        run: |
          set -euo pipefail
          flake_rev() { jq -er --arg r "$1" '[.nodes[] | .locked? | select(.owner? == "metacraft-labs" and .repo? == $r) | .rev] | unique | if length == 1 then .[0] else error("\($r): \(length) revisions in flake.lock") end' flake.lock; }
          {
            echo "native_backend=$(flake_rev codetracer-native-backend)"
            echo "native_recorder=$(flake_rev codetracer-native-recorder)"
            echo "visual_replay=$(flake_rev codetracer-visual-replay)"
            echo "snapshot_codecs=$(sed -n 's/^PRIVATE_SIBLING_CODETRACER_SNAPSHOT_CODECS=\([0-9a-f]\{40\}\)$/\1/p' ci/toolchain.pin)"
            echo "isonim_gpui=$(grep -o '{ name = "isonim-gpui"[^}]*' repro.lock | sed -n 's/.*revision = "\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1)"
          } | tee -a "$GITHUB_OUTPUT"
          grep -q '^snapshot_codecs=[0-9a-f]\{40\}$' "$GITHUB_OUTPUT"
          grep -q '^isonim_gpui=[0-9a-f]\{40\}$' "$GITHUB_OUTPUT"

      - name: Restore the products built from these revisions
        # What the build below makes is decided by these revisions and by the
        # scripts that build and pack it, so a job whose key was built before
        # skips the build. Inside the checkout: a cache's path is part of its
        # key, and runners differ in RUNNER_TEMP.
        id: vrt_cache
        uses: actions/cache/restore@v4
        with:
          path: vrt-cache/visual-replay-tools.tar.gz
          key: visual-replay-tools-v1-${{ steps.private_pins.outputs.native_backend }}-${{ steps.private_pins.outputs.native_recorder }}-${{ steps.private_pins.outputs.visual_replay }}-${{ steps.private_pins.outputs.snapshot_codecs }}-${{ steps.private_pins.outputs.isonim_gpui }}-${{ hashFiles('ci/test/visual-replay-tools.sh', 'ci/build/record-runtime-closure.sh', '.github/workflows/visual-replay-tools.yml') }}

      - name: Mint a token for the clones below
        # An installation token lives an hour, and these clones come after
        # 'Provision dependency siblings from repro.lock', which can take most
        # of one on a cold runner: hand them a token minted here, not the
        # job's first (ci/test/late-clone-token-test.py).
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone codetracer-native-backend
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-backend
          ref: ${{ steps.private_pins.outputs.native_backend }}
          path: ${{ github.workspace }}/../codetracer-native-backend
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'true'

      - name: Clone codetracer-native-recorder
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-recorder
          ref: ${{ steps.private_pins.outputs.native_recorder }}
          path: ${{ github.workspace }}/../codetracer-native-recorder
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-visual-replay
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-visual-replay
          ref: ${{ steps.private_pins.outputs.visual_replay }}
          path: ${{ github.workspace }}/../codetracer-visual-replay
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-snapshot-codecs
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-snapshot-codecs
          ref: ${{ steps.private_pins.outputs.snapshot_codecs }}
          path: ${{ github.workspace }}/../codetracer-snapshot-codecs
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Build ct-native-replay, ct_gfx_player and ct-mcr
        id: tools
        if: ${{ steps.vrt_cache.outputs.cache-hit != 'true' }}
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/test/visual-replay-tools.sh "${RUNNER_TEMP}/visual-replay.env"

      - name: Build isonim-gpui's featureless shim
        if: ${{ steps.vrt_cache.outputs.cache-hit != 'true' }}
        # For GPUI shard 1's plat45, which links `just build-gpui` against it:
        # built there, it cost the shard about 9.5 minutes of isonim-gpui's dev
        # shell and cargo (run 44384977215), before its first capture. Only the
        # shim travels; `just build-gpui` stays in the shard, whose checkout
        # path the binary is built for.
        run: |
          cd ../isonim-gpui
          nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/isonim-gpui-shell" --command bash -c "cd rust && cargo build"
          ls -la rust/target/debug/libgpui_nim_shim.so

      - name: Pack them
        id: pack
        if: ${{ steps.vrt_cache.outputs.cache-hit != 'true' }}
        # Paths relative to the workspace's parent, as ct-build packs its
        # products, so a shard restores them beside its own siblings. The
        # licence is not packed: it is generated per job from ct-native-replay.
        run: |
          cd ..
          files=(
            codetracer-native-backend/target/debug/ct-native-replay
            codetracer-visual-replay/ct_gfx_player
            codetracer-native-recorder/ct_cli/ct_cli
            isonim-gpui/rust/target/debug/libgpui_nim_shim.so
          )
          [ ! -e codetracer-visual-replay/ct-native-replay ] || files+=(codetracer-visual-replay/ct-native-replay)
          # What `just build-ct-mcr` puts beside ct_cli, and the static-binary
          # loader it leaves in ct_interpose: ct-mcr loads them at run time, and
          # without them every recording it makes fails ("could not load
          # libct_license_ffi.so", the scenario lanes of run 45822112077). The
          # player's own shared libraries likewise, if it has any.
          shopt -s nullglob
          for f in codetracer-native-recorder/ct_cli/*.so codetracer-native-recorder/ct_interpose/*.so \
            codetracer-native-recorder/ct_cli/ct-clr-fields codetracer-native-recorder/ct_cli/ct-dwarf-paths \
            codetracer-native-recorder/ct_cli/race-calibration/RaceCalibration.* codetracer-visual-replay/*.so; do
            files+=("$f")
          done
          shopt -u nullglob
          printf 'packing %s\n' "${files[@]}"
          # The store paths these run against (glibc-2.40-224, lldb,
          # vulkan-loader, ...), which a shard realises after unpacking.
          (cd codetracer && nix develop .#devShells.x86_64-linux.default --command bash ci/build/record-runtime-closure.sh \
            ../codetracer-visual-replay/nix-runtime-closure.txt "${files[@]/#/../}")
          files+=(codetracer-visual-replay/nix-runtime-closure.txt)
          tar -czf "${RUNNER_TEMP}/visual-replay-tools.tar.gz" "${files[@]}"
          ls -la "${RUNNER_TEMP}/visual-replay-tools.tar.gz"
          mkdir -p "${GITHUB_WORKSPACE}/vrt-cache"
          cp "${RUNNER_TEMP}/visual-replay-tools.tar.gz" "${GITHUB_WORKSPACE}/vrt-cache/"

      - name: Save them for the next job with these revisions
        if: ${{ steps.pack.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: vrt-cache/visual-replay-tools.tar.gz
          key: ${{ steps.vrt_cache.outputs.cache-primary-key }}

      - name: Use the restored products
        if: ${{ steps.vrt_cache.outputs.cache-hit == 'true' }}
        run: cp vrt-cache/visual-replay-tools.tar.gz "${RUNNER_TEMP}/visual-replay-tools.tar.gz"

      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: visual-replay-tools
          path: ${{ runner.temp }}/visual-replay-tools.tar.gz
          retention-days: 2
          compression-level: 0

      - name: Push the dev shells this job realised to the cache
        # The `.#ci` and default shells this job provisioned, so the shards
        # substitute them. The only other push of them is at the end of TUI
        # shard 1, which does not always get there: in run 44384977215 it was
        # killed during provisioning, and GPUI shard 1 then fetched the sway,
        # miden-vm, agave and sui sources and built their packages (about 10
        # minutes) and cargo-build-sbf (11 minutes) itself. This job is no
        # `needs` of anything, so the push holds no one back. After the upload,
        # so the shards' tools are not delayed by it. Best effort (a 15-minute
        # budget capped at what the job's limit leaves, exit 0 on any failure,
        # continue-on-error), and only dev and agents write the shared cache
        # (ci/test/push-built-closure-test.sh).
        if: ${{ !cancelled() && (github.ref_name == 'dev' || github.ref_name == 'agents') }}
        continue-on-error: true
        timeout-minutes: 20
        env:
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          CT_JOB_TIMEOUT_MINUTES: 210
        # CT_JOB_TIMEOUT_MINUTES is this job's timeout-minutes (held equal by
        # push-built-closure-test.sh).
        run: bash ci/deploy/push-built-closure.sh --gcroots "${CT_GCROOT_DIR:-$RUNNER_TEMP/ct-gcroots}" --flake-inputs
