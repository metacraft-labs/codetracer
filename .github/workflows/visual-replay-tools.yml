name: Build the visual replay tools for the shards
on:
  workflow_call:

# ct-native-replay (with its test licence's verifying key), ct_gfx_player and
# ct-mcr, built ONCE per run, in parallel with ct-build, for the shards whose
# work opens a visual recording: GPUI shard 1 (plat59) and the TUI shard whose
# scenario slice uses the `visual-recording` stage. GPUI shard 1 used to build
# them itself, about 22 of its 73 capture minutes in run 44269676398 (ct-mcr
# alone), and ran into its 90-minute limit. The shards restore them; where the
# artifact is missing or short they build as before (ci/test/visual-replay-
# tools.sh), so this job failing costs time, never a result.

permissions:
  contents: read
  id-token: write

jobs:
  ct-build:
    runs-on: [self-hosted, linux, x64]
    # First sized at 120 from run 43935388749's slowest cold garm shard:
    # provisioning 1768 s, build-once 2557 s, the windowed shim and front-end
    # 830 s (86 min), plus packing and the upload. Run 44048043714 then spent
    # 94 minutes provisioning on a slow runner and was cancelled at 120 minutes
    # in the shim build, and every GPUI and TUI shard waits on this job, so it
    # skipped both matrices. 180 is headroom for a slow fleet, not a target.
    # Revisit once infra finds the slow host: metacraft-pm issue
    # 2026-11-17-one-garm-runner-ran-the-same-dev-shell-provisioning-eight-to-
    # fifteen-times-slower-than-its-siblings.md (recorded at 4ffa812).
    timeout-minutes: 180
    name: Build ct and the windowed GPUI shim (once per run)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Clone runquota sibling
        # `just build-once` compiles `ct`, which imports `runquota_process`
        # (see `cross-process-linux`).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # From the test lock, ci/test/siblings/repro.lock: the scenario lane builds
          # its runner and backend from these (ci/test/scenarios.sh).
          test-siblings: DemoVideoScript,DemoVideoScript-GuiAssert,GuiAssert

      - name: Build ct-native-replay, ct_gfx_player and ct-mcr
        id: tools
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/test/visual-replay-tools.sh "${RUNNER_TEMP}/visual-replay.env"

      - name: Pack them
        # Paths relative to the workspace's parent, as ct-build packs its
        # products, so a shard restores them beside its own siblings. The
        # licence is not packed: it is generated per job from ct-native-replay.
        run: |
          cd ..
          files=(
            codetracer-native-backend/target/debug/ct-native-replay
            codetracer-visual-replay/ct_gfx_player
            codetracer-native-recorder/ct_cli/ct_cli
          )
          [ ! -e codetracer-visual-replay/ct-native-replay ] || files+=(codetracer-visual-replay/ct-native-replay)
          tar -czf "${RUNNER_TEMP}/visual-replay-tools.tar.gz" "${files[@]}"
          ls -la "${RUNNER_TEMP}/visual-replay-tools.tar.gz"

      - name: Upload them
        uses: actions/upload-artifact@v4
        with:
          name: visual-replay-tools
          path: ${{ runner.temp }}/visual-replay-tools.tar.gz
          retention-days: 2
          compression-level: 0
