name: Deploy ide.codetracer.com

# ---------------------------------------------------------------------------
# Publishes the browser CodeTracer replay bundle (the "Embed SDK": db-backend
# WASM + JS glue + replay worker) to the `web-codetracer` Cloudflare Pages
# project. That project serves the in-browser Cloud IDE at
# https://ide.codetracer.com (a stable custom domain) and at
# https://web-codetracer.pages.dev — the identical bundle on both.
#
# NAMES (2026-08-29): the hosted CodeTracer web product's domain is
# https://ide.codetracer.com. An earlier plan put it on `web.codetracer.com` and
# a later note here described `web.` as a separate authenticated application that
# had to keep working; both are superseded — `ide.` is the product's one domain,
# and `web.codetracer.com` is not a name this repo targets any more. Unchanged by
# that decision: the Cloudflare Pages PROJECT is still named `web-codetracer`,
# this workflow file is still `deploy-web-codetracer.yml`, and the preview host is
# still `web-codetracer.pages.dev` — those are infrastructure identifiers, not the
# hostname, and renaming them is an infrastructure change, not a docs change.
# codetracer-ci is moving separately to https://ci.codetracer.com.
#
# WHAT IS PUBLISHED — TWO PRODUCTS, ONE FILE TREE
#
#   1. NOIR STUDIO, the hosted product, at `/`. `ci/test/web-bundle-assets.sh`
#      assembles { index.html, ui.js, assets/wasm-worker.js,
#      assets/noir_wasm.wasm, assets/noir_tracer_wasm.wasm, _headers,
#      _redirects }. Until 2026-08-31 NOTHING PUBLISHED THIS AT ALL: CI proved
#      the bundle compiled and booted and no workflow shipped it, so the
#      product existed only as a green check.
#
#   2. THE BROWSER REPLAY ENGINE (the "Embed SDK"), at the exact paths it has
#      always occupied. browser-replay/build-dist.sh assembles
#      { worker.js, gateway-client.js, transport-test.html, pkg/db_backend.js,
#        pkg/db_backend_bg.wasm, serve.conf } plus an index.html.
#
# WHY BOTH LIVE IN ONE PAGES PROJECT, AND WHY THAT IS NOT A COMPROMISE
#
#   A Cloudflare Pages project serves ONE file tree, and a project's custom
#   domain always serves that project's production deployment. So "two
#   products on ide.codetracer.com" and "two Pages projects" are mutually
#   exclusive, and a second workflow deploying the same project would not add
#   a second tree — it would RACE this one, last upload winning, with which
#   product is live decided by scheduling. One project, one tree, one workflow.
#
#   Splitting the engine onto its own project was the alternative. It was
#   rejected because it is not free: it needs a new hostname, a manual
#   Cloudflare custom-domain + DNS action, and it would break
#   metacraft-labs/blocktracer, whose `client/hydrate/fetch-engine.sh` fetches
#   `/worker.js`, `/pkg/db_backend.js` and `/pkg/db_backend_bg.wasm` from
#   `https://web-codetracer.pages.dev` BY ABSOLUTE PATH, cross-origin, on
#   every one of its deploys.
#
#   Hence the one collision, handled explicitly below: both products want
#   `index.html`. The product's home goes to the product — Noir Studio takes
#   `/` — and the engine's index.html, which is a manual DAP test harness that
#   nothing fetches programmatically, moves to `/replay-demo.html`. Every path
#   BlockTracer actually consumes is byte-identical to before.
#
#   The engine's dist ships a Cloudflare Pages `_headers` with permissive CORS +
#   Cross-Origin-Resource-Policy for the JS/wasm (generated by build-dist.sh),
#   because it is loaded CROSS-ORIGIN by blocktracer.org's Debug button. Noir
#   Studio's `_headers` carries its cache classes. Cloudflare applies EVERY
#   matching rule, so the two are concatenated rather than one replacing the
#   other — see the staging step.
#
# WHY THE BUILD NEEDS SIBLINGS (the crux — see the deploy recon report)
#   build-dist.sh wraps src/db-backend/build_wasm.sh, which HARD-ERRORS unless
#   the PRIVATE sibling codetracer-native-recorder/ct_emulator/build_wasm_api.sh
#   exists: the MCR emulator's Nim sources are cross-compiled to wasm32 C and
#   linked into db-backend by its build.rs. This mirrors cross-repo-tests.yml,
#   which already clones codetracer-native-recorder=dev, `direnv allow`s it and
#   resolves its ct_emulator nimble deps before building db-backend. The wasm
#   toolchain (rust wasm32-unknown-unknown, wasm-pack, clang/llvm, nim/nimble)
#   all lives in the flake `.#ci` shell (nix/shells/ci-base.nix) — no emscripten
#   is required for the browser-transport build (the emulator uses Nim's C
#   backend + clang --target=wasm32-unknown-unknown).
#
# ONE ENVIRONMENT / ONE PROJECT
#   The `web-codetracer` Pages project's PRODUCTION branch is `cloud`. Merging
#   to `cloud` publishes a production deployment served on ide.codetracer.com
#   (and web-codetracer.pages.dev).
#   (Cloudflare decides production-vs-preview by comparing the deployed branch
#   to the project's configured production branch — see metacraft-labs/web-site
#   DEPLOY.md.) Create the project once with wrangler before the first run; this
#   workflow does not create it.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [cloud]
  workflow_dispatch:

# One in-flight deploy; cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    name: Build bundle + deploy to Cloudflare Pages
    runs-on: eph-linux-x64  # CIP-5: nix job (setup-dev-env) → eph-linux-x64
    environment:
      name: cloud
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Mint installation token for cross-repo sibling access
        # Same mechanism as cross-repo-tests.yml: mint a per-run installation
        # token from the repo-local CI_TOKEN_PROVIDER_APP_ID +
        # CI_TOKEN_PROVIDER_PRIVATE_KEY secrets so the private sibling
        # codetracer-native-recorder can be cloned.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout codetracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # Installs Nix (with the Attic substituter/keys) and clones the
        # cross-repo siblings adjacent to this checkout at their pinned `dev`
        # refs. The browser-replay WASM build needs:
        #   * codetracer-native-recorder   — ct_emulator/build_wasm_api.sh
        #     (the private emulator WASM C generator build_wasm.sh requires),
        #   * codetracer-trace-format-nim  — build_wasm_api.sh's `nim c` adds
        #     ../codetracer-trace-format-nim/src to its --path search,
        #   * codetracer-trace-format      — the matched half of that FFI pair.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            codetracer-native-recorder=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            # THE ISONIM FAMILY, pinned to explicit commits.
            #
            # Needed because this is the first workflow that compiles the
            # RENDERER: `src/frontend/ui_js.nim` reaches `isonim/dsl/tailwind`,
            # and codetracer's `config.nims` puts each of these on the Nim
            # search path.
            #
            # PINNED BY SHA RATHER THAN `=dev`, for two independent reasons and
            # both were measured rather than assumed:
            #
            #  1. `.github/actions/setup-isonim-siblings` is the normal way in,
            #     and it cannot be used here. Four of its nine entries are BARE,
            #     which resolves them from the per-commit workspace lock — and
            #     `cloud` is a merge branch whose commits carry no lock, so the
            #     action fails outright: "No workspace lock for codetracer
            #     (candidates: ...)". That is not a thing this workflow can fix;
            #     it is a property of deploying from a branch the lock tooling
            #     does not publish for.
            #
            #  2. `=dev` would work and would make things worse.
            #     `ci/test/sibling-provisioning-test.sh` counts branch-tip pins
            #     against a ceiling that "is lowered as blocks are converted and
            #     is never raised"; `dev` already sits at 70 against a ceiling of
            #     59, and nine more would take it to 79. An explicit 40-hex SHA
            #     is what that gate asks for instead, and it is the better answer
            #     on its own terms: a re-run of this deploy builds against the
            #     same siblings it built against the first time, which `=dev`
            #     cannot promise.
            #
            # TO REFRESH: `git ls-remote https://github.com/metacraft-labs/<repo>
            # refs/heads/dev`. Resolved 2026-08-31.
            isonim=2a24d9549543c2a894525f65c4e608f9881b7373
            isonim-tui=229cf0e5fa3e1276a4f7259ef3b7032069bb2ce8
            isonim-gpui=010b175d67333575385bd472425530238f89edd7
            nim-everywhere=f15e23f02cd0d715a32877f77d97318397232117
            nim-termctl=2600f444535e278aab564fd59400fcb6d19f2ccf
            nim-pty=4efd335466dc28015445d78c134b97ff245e1c74
            nim-acp=bb5b8a2c5c3805946847270c9eea39d718747c5e
            nim-agent-harbor=0a1e06125daa5e33e09e1bab98edb6b811179a4e
            nim-agents=31f88a36a8e65e0846e62b15515d3686bd78de5a

      - name: Allow direnv in this checkout and the recorder sibling
        # build-dist.sh runs `direnv exec <repo> bash build_wasm.sh`, which in
        # turn runs `direnv exec <recorder> bash ct_emulator/build_wasm_api.sh`.
        # A fresh clone's .envrc is "blocked" until whitelisted. direnv itself
        # is provided by the `.#ci` shell (nix/shells/ci-base.nix).
        run: |
          nix develop .#ci --command bash -c '
            direnv allow "$(pwd)"
            direnv allow "$(pwd)/../codetracer-native-recorder"
          '

      - name: Resolve ct_emulator nimble dependencies
        # build_wasm_api.sh's `nim c ... emulator_wasm_api.nim` needs the
        # `results` nimble package declared in ct_emulator.nimble; without it
        # the generator aborts with `cannot open file: results` and db-backend's
        # build.rs panics. Mirrors the equivalent step in cross-repo-tests.yml.
        run: |
          RECORDER_DIR="$(pwd)/../codetracer-native-recorder"
          nix develop .#ci --command \
            direnv exec "$RECORDER_DIR" \
              bash -c "cd '$RECORDER_DIR/ct_emulator' && nimble install --depsOnly -y"

      - name: Build browser-replay bundle
        # Produces browser-replay/dist/. build-dist.sh internally re-enters the
        # repo + recorder dev shells via `direnv exec`, so run it under `.#ci`
        # (which provides direnv, wasm-pack, the rust wasm32 target, clang/llvm
        # and nim). This is the exact command validated locally end-to-end
        # (wasm-pack ~11–35s warm, a few minutes cold; ~18 MB db_backend_bg.wasm).
        run: |
          nix develop .#ci --command bash -c '
            direnv exec "$(pwd)" bash browser-replay/build-dist.sh
          '

      - name: Verify bundle contents
        # Fail loudly if the WASM or an app asset is missing before we deploy a
        # broken bundle.
        run: |
          set -euo pipefail
          dist=browser-replay/dist
          for f in index.html worker.js gateway-client.js pkg/db_backend.js \
                   pkg/db_backend_bg.wasm _headers; do
            test -s "$dist/$f" || { echo "missing/empty: $dist/$f" >&2; exit 1; }
          done
          echo "wasm bytes: $(wc -c <"$dist/pkg/db_backend_bg.wasm")"

      - name: Build the two Noir wasm modules
        # THE DEPLOYMENT DECISION THAT HAD BEEN OPEN, implemented. The modules
        # are ~16 MB and ~4.6 MB, are not in the repository, and until now no
        # CI job produced them: both gates that need them
        # (`noir-wasm-worker-e2e.sh`, `web-bundle-assets.sh`) read env vars and
        # skipped loudly when unset, and nothing ever set one.
        #
        # Built here from a PINNED revision of the `noir` fork
        # (ci/deploy/noir-wasm.pin) into a fresh clone, and vendored into the
        # publish directory. `ci/deploy/build-noir-wasm.sh`'s header records
        # why this beats committing them or fetching them cross-origin at run
        # time; the short version is that a cross-origin module forfeits the
        # same-origin immutable caching the fetched design was chosen FOR, and
        # adds a second origin that must be up for the product to compile.
        #
        # Cost, measured: ~100s from a cold cargo cache, and near zero with the
        # cache below on any deploy that does not bump the pin.
        id: noir_wasm
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source ci/deploy/noir-wasm.pin
          echo "rev=$NOIR_REV" >> "$GITHUB_OUTPUT"
          echo "short_rev=${NOIR_REV:0:10}" >> "$GITHUB_OUTPUT"
          echo "Building Noir wasm modules at $NOIR_REV"

      - name: Cache the Noir wasm build
        # Keyed on the PINNED revision, so the ~100s is paid once per bump and
        # not once per deploy. A cache miss is not a failure — the build step
        # below simply runs cold.
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            noir-wasm-work/target
          key: noir-wasm-${{ runner.os }}-${{ steps.noir_wasm.outputs.rev }}

      - name: Build Noir wasm modules from the pinned ref
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            bash ci/deploy/build-noir-wasm.sh "$(pwd)/noir-wasm-out" "$(pwd)/noir-wasm-work"
          '
          ls -l noir-wasm-out

      - name: Prove the modules RUN before publishing them
        # `ci/test/noir-wasm-worker-e2e.sh` compiles and traces a real Noir
        # package twice — in-process, and through the worker protocol the
        # browser uses — and compares the two traces by digest AND for
        # non-triviality. Both assertions are needed and catch different
        # things: compiling without instrumentation produces a one-event trace
        # whose digests still MATCH, because both paths agree on nothing.
        #
        # It has never run in CI. Its own header says why — "this SKIPS LOUDLY"
        # without the two modules, "and no CI job delivers them" — and this is
        # the first job that has them, because it just built them. Running it
        # here means the bytes about to be uploaded are known to produce a real
        # trace, not merely known to be 16 MB and to start with the wasm magic.
        #
        # This is the difference between "the artifact was published" and "the
        # artifact works", and publishing the second is the entire point.
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            export CT_NOIR_WASM_COMPILER="$(pwd)/noir-wasm-out/noir_wasm.wasm"
            export CT_NOIR_WASM_TRACER="$(pwd)/noir-wasm-out/noir_tracer_wasm.wasm"
            direnv exec "$(pwd)" bash ci/test/noir-wasm-worker-e2e.sh
          '

      - name: Seed isonim's tailwind-styles.json
        # `src/frontend/ui_js.nim` reaches `isonim/dsl/tailwind`, which
        # `staticRead`s this file at COMPILE time. Nim cannot catch a failing
        # `staticRead`, so without it the renderer build dies several minutes in
        # with an error naming neither this workflow nor the file's purpose —
        # the trap `ci/test/renderer-browser-build.sh` documents and pre-checks.
        # A `{}` placeholder is what `.github/actions/setup-isonim-siblings`
        # seeds for every other job that compiles Nim outside the Nix sandbox;
        # `isonim/dsl/tailwind.nim` falls through to its own `{}` fallback.
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/../isonim/build"
          if [ ! -f "${{ github.workspace }}/../isonim/build/tailwind-styles.json" ]; then
            echo '{}' > "${{ github.workspace }}/../isonim/build/tailwind-styles.json"
          fi
          ls -l "${{ github.workspace }}/../isonim/build/tailwind-styles.json"

      - name: Assemble the Noir Studio bundle
        # ONE assembly step, and it is the SAME script the `web-bundle-assets`
        # gate runs on every push — so what CI checks and what this uploads are
        # produced by one recipe rather than by two that drift. It builds the
        # renderer and the loop arm for a browser, places the worker script and
        # the two wasm modules, and renders index.html / _headers / _redirects
        # from `platform/web_deployment.nim`.
        #
        # CT_NOIR_WASM_REF is what becomes the page's provenance string. A
        # module without one is DROPPED by `registrableModules`, so an unset
        # value here would publish 20 MB the tab refuses to register — which
        # the assembly step fails on rather than shipping.
        #
        # CT_WEB_LANGUAGE_ORIGINS declares which HOSTS are language entry
        # points. `noirstudio.dev` is meant to be the Noir entry point the way
        # `ide.codetracer.com/noir` is — one Pages project, one tree, two
        # custom domains, no redirect, and the visitor stays on the domain they
        # typed. The map travels in the entry document and the page reads it
        # out of its own DOM, so this costs no request and
        # `ci/test/noir-studio-signed-out.sh` still reports zero egress on the
        # development loop.
        #
        # DECLARING A DOMAIN THAT DOES NOT RESOLVE YET IS HARMLESS AND IS THE
        # RIGHT ORDER. The map is consulted only by a page already loaded on
        # that origin, so shipping the declaration first means the domain works
        # the moment it is added to the Pages project — no redeploy and no
        # second artifact. Adding the domain itself is a Cloudflare dashboard
        # action plus a DNS change, and is NOT done by this workflow.
        env:
          CT_WEB_ORIGIN: https://ide.codetracer.com
          CT_WEB_LANGUAGE_ORIGINS: https://noirstudio.dev=noir,https://www.noirstudio.dev=noir
          CT_NOIR_WASM_REF: ${{ steps.noir_wasm.outputs.short_rev }}
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            export CT_NOIR_WASM_COMPILER="$(pwd)/noir-wasm-out/noir_wasm.wasm"
            export CT_NOIR_WASM_TRACER="$(pwd)/noir-wasm-out/noir_tracer_wasm.wasm"
            # THE ENGINE, from the browser-replay build two steps up. The
            # Studio declares its own copies under /assets/ rather than
            # pointing at the /pkg/ tree staged for BlockTracer: /pkg/ is a
            # cross-origin contract another repository fetches and is served
            # with the entry documents cache class, and a 60-second TTL on an
            # 18 MB module is the failure the fetched-not-bundled decision
            # exists to avoid. Without this the assembly step SKIPS the engine
            # loudly and the bundle is exactly what it is today.
            export CT_REPLAY_ENGINE_DIR="$(pwd)/browser-replay/dist/pkg"
            export CT_WEB_BUNDLE_DIR="$(pwd)/studio-bundle"
            export CT_WEB_REVISION="${GITHUB_SHA:0:8}"
            direnv exec "$(pwd)" bash ci/test/web-bundle-assets.sh
          '

      - name: Prove the bundle MOUNTS before publishing it
        # The acceptance criterion the previous deploy did not have, and the
        # reason it shipped a blank page while reporting success at every step.
        #
        # The step above proves the bundle CARRIES a renderer. This loads it in
        # a real browser and asserts that the renderer RUNS: the product's own
        # `.welcome-screen-root` is mounted, its start options and panels are
        # rendered, and there are zero uncaught page errors. On 2026-08-31 the
        # first four were true and the fifth was not — `ui.js` died on
        # `ReferenceError: monaco is not defined` — and nothing noticed.
        #
        # It runs the mutation arms too, which is deliberate at deploy time
        # rather than wasteful: an assertion that cannot fail is the thing that
        # let this through, so the deploy re-establishes that this one can.
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            export CT_WEB_BUNDLE_DIR="$(pwd)/studio-bundle"
            export CT_PROBE_SCREENSHOT_DIR="$(pwd)/mount-shots"
            direnv exec "$(pwd)" bash ci/test/web-renderer-mounts.sh
          '

      - name: Upload what the pre-publish browser saw
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-publish-mount-screenshots
          path: mount-shots/
          if-no-files-found: ignore

      - name: Stage the publish directory
        # Both products into one tree. The engine keeps every path BlockTracer
        # fetches; Noir Studio takes `/`; the engine's manual test harness
        # moves aside; the two `_headers` are concatenated because Cloudflare
        # applies every matching rule and a plain copy would have silently
        # dropped the engine's CORS — breaking a different repository's deploy
        # from this one.
        run: |
          set -euo pipefail
          rm -rf site && mkdir -p site

          # 1. The engine, exactly as it is published today.
          cp -rL browser-replay/dist/. site/
          mv site/index.html site/replay-demo.html
          engine_headers="$(cat site/_headers)"

          # 2. Noir Studio at the root.
          cp -rL studio-bundle/. site/
          chmod -R u+w site

          # 3. The merged header table: the engine's CORS rules first, then the
          #    Studio's cache classes -- MINUS the `/*` catch-all.
          #
          # WHY THE CATCH-ALL IS DROPPED, measured on the live deployment
          # rather than reasoned about. Cloudflare Pages does not pick the
          # most specific matching `_headers` rule; it applies EVERY matching
          # rule and concatenates the values. With the generated table's `/*`
          # row present, a 16 MB wasm module came back as:
          #
          #   cache-control: public, max-age=60, must-revalidate,
          #                  public, max-age=31536000, immutable
          #
          # -- two max-ages in one header, the 60-second one first, on the
          # asset whose year-long `immutable` caching is the entire reason the
          # Noir modules are FETCHED instead of bundled. The delivery decision
          # was being silently undone by the header table meant to implement it.
          #
          # `renderCacheConfig` is not wrong: `/*` last is correct for a host
          # that takes the first match, which is what `_redirects`-style files
          # do and what the §1b.4 contract describes. It is wrong FOR THIS HOST,
          # so the adaptation happens here, at the point where the file is
          # written for Cloudflare, and not by changing a contract that other
          # hosts read correctly.
          #
          # Dropping the row costs nothing and is strictly safer: Pages serves
          # HTML it has no rule for as `public, max-age=0, must-revalidate`,
          # which is MORE conservative than the 60 seconds the row asked for.
          # The specific rows -- /assets/*, /s/*, /p/*/current.json -- do not
          # overlap each other and are unaffected.
          python3 - studio-bundle/_headers > site/_studio_headers <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          out, skip = [], False
          for line in lines:
              if line.startswith('/'):
                  skip = (line.strip() == '/*')
                  if skip:
                      out.append('# `/*` intentionally omitted: Cloudflare Pages merges every')
                      out.append('# matching rule, so a catch-all Cache-Control prepends a 60s')
                      out.append('# max-age onto /assets/* and defeats `immutable`.')
                      continue
              elif skip:
                  continue
              out.append(line)
          print('\n'.join(out))
          PY
          {
            printf '%s\n\n' "$engine_headers"
            cat site/_studio_headers
          } > site/_headers
          rm -f site/_studio_headers
          echo "--- merged _headers ---"; cat site/_headers

          echo "staged $(find site -type f | wc -l) files, $(du -sh site | cut -f1)"
          find site -type f | sort | sed 's/^/  /'

      - name: Guard the bytes about to be uploaded
        # THE CHECK THAT WOULD HAVE STOPPED THE SIBLING CAMPAIGN'S DEFECT, run
        # on the publish directory rather than on a build. It fails in BOTH
        # directions: a page referencing an asset the tree lacks, and an asset
        # in the tree no page can reach — the second being exactly how an 18 MB
        # replay engine was built, deployed, served, and never loaded.
        #
        # Verified against real mutations before landing: a declared module
        # deleted, a published module undeclared, a document from a different
        # build, a missing bundle, and a stripped descriptor each go red with a
        # distinct sentence, and a legitimate deployment that ships no wasm
        # modules stays green.
        run: |
          set -euo pipefail
          nix develop .#ci --command bash -c '
            nim c --hints:off --warnings:off \
              --nimcache:"$(pwd)/.guard-cache" -o:"$(pwd)/.web-deploy-guard" \
              ci/test/web_deploy_guard.nim
            "$(pwd)/.web-deploy-guard" "$(pwd)/site"
          '
          rm -f .web-deploy-guard

      - name: Deploy to Cloudflare Pages
        id: deploy
        # The eph-* runners have no preinstalled node/npx, so wrangler is run
        # from the flake-pinned `.#ci` shell (wrangler 4.x, pinned by
        # flake.lock — nix/shells/ci-base.nix). wrangler authenticates from
        # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in the environment.
        # The `web-codetracer` project's production branch is `cloud`, so a push
        # to `cloud` publishes a production deployment on ide.codetracer.com
        # (and web-codetracer.pages.dev).
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # wrangler 4.62 (pinned in .#ci) writes its cache to
          # node_modules/.cache/wrangler via a find-up from cwd. The repo's
          # node_modules is a READ-ONLY nix-store symlink (yarn-nix), so running
          # wrangler from the repo root fails ("Read-only file system"). Stage the
          # bundle into a writable temp dir and run wrangler from $RUNNER_TEMP, so
          # the cache find-up lands on a writable location. (nix develop .#ci is
          # still invoked from the repo root so the flake resolves; the inner
          # shell then cd's out.)
          export WRANGLER_SEND_METRICS=false
          staged="$RUNNER_TEMP/webct-dist"
          # `site`, not `browser-replay/dist`: the publish directory is now the
          # merged tree staged and guarded above, carrying both products.
          rm -rf "$staged"; cp -rL site "$staged"
          log="$RUNNER_TEMP/wrangler-deploy.log"
          STAGED="$staged" nix develop .#ci --command bash -c '
            cd "$RUNNER_TEMP"
            wrangler pages deploy "$STAGED" \
              --project-name=web-codetracer \
              --branch=cloud \
              --commit-dirty=true
          ' | tee "$log"
          url="$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' "$log" | tail -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $url"

      - name: Verify the DEPLOYED artifact, not the green workflow
        # A green build that served a cached store path reached production in
        # the sibling campaign, so "the workflow succeeded" is not evidence
        # that the right bytes are being served. This fetches what Cloudflare
        # now returns and compares it, by size, against what was uploaded.
        #
        # Both hosts are checked. `web-codetracer.pages.dev` is what
        # BlockTracer fetches cross-origin; `ide.codetracer.com` is what a user
        # types.
        #
        # THEY LAG EACH OTHER, AND NOT ALWAYS IN THE SAME DIRECTION. This step
        # used to treat the custom domain as the one that might be stale and
        # the `pages.dev` alias as authoritative. On 2026-09-01 the reverse
        # happened: `ide.codetracer.com/ui.js` served the new 14711748 bytes
        # while `web-codetracer.pages.dev/ui.js` was still on the previous
        # deployment at 14708792, and the step failed a deploy whose bytes were
        # correct. Both hosts agreed within seconds.
        #
        # So the fix is not to demote either host — a real mismatch on either
        # is a real defect — but to stop reading a propagation window as a
        # verdict. Each URL is now POLLED until it matches or a deadline
        # passes, and the time it took to converge is printed, so a widening
        # window shows up as a number rather than as a flake. `curl --retry`
        # cannot do this: it retries transport and HTTP errors, and a stale
        # edge answers 200 with the wrong body.
        shell: bash
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          fail=0
          # 120 seconds is a bound on Cloudflare's propagation window, not on
          # anybody's patience: a deployment that has not converged in two
          # minutes has a real problem, and this still fails on it.
          deadline_s=120
          interval_s=5
          check() {
            local base="$1" path="$2" expect="$3" required="$4"
            local got waited=0
            while : ; do
              got="$(curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
                       -o /dev/null -w '%{size_download}' "$base$path" || echo 0)"
              [ "$got" = "$expect" ] && break
              [ "$waited" -ge "$deadline_s" ] && break
              sleep "$interval_s"
              waited=$((waited + interval_s))
            done
            if [ "$got" = "$expect" ]; then
              if [ "$waited" -eq 0 ]; then
                echo "  ok: $base$path -> $got bytes (matches what was uploaded)"
              else
                # Printed rather than swallowed: the window is a fact about the
                # CDN worth watching, and a step that hid it would turn a
                # widening lag into a sudden failure one day.
                echo "  ok: $base$path -> $got bytes (matched after ${waited}s of propagation)"
              fi
            elif [ "$required" = "required" ]; then
              echo "  MISMATCH: $base$path served $got bytes, uploaded $expect after ${waited}s" >&2
              fail=1
            else
              echo "  note: $base$path served $got bytes, uploaded $expect (advisory, ${waited}s)"
            fi
          }
          size() { wc -c <"site/$1" | tr -d ' '; }

          # EVERY PUBLISHED FILE, not a hand-written subset.
          #
          # This list used to name seven paths. The deploy stages 535, so the
          # gate covered 1.3% of what it publishes, and the 528 it skipped
          # included `public/dist/frontend_bundle.js` — the third-party bundle
          # whose absence is why a deployed page once painted nothing at all
          # (`index.html`'s own load-order comment records it). A stale or
          # truncated copy of THAT file is invisible to a seven-path check and
          # fatal to the product.
          #
          # The 2026-09-01 staleness was caught only because
          # `assets/wasm-worker.js` happened to be one of the seven. That is
          # not a property a gate should have.
          #
          # Two passes, because 535 files x 2 hosts sequentially at the poll
          # interval would dominate the job: a fast parallel sweep finds the
          # disagreements, then only those are polled against the propagation
          # deadline. A converged deploy pays one parallel sweep.
          manifest="$RUNNER_TEMP/publish-manifest.tsv"
          # `_headers` and `_redirects` are consumed by Pages as configuration
          # and are not served back; `serve.conf` is the local nginx helper.
          # Everything else in the tree is a URL a user or a sibling repo can
          # fetch, so everything else is checked.
          ( cd site && find . -type f \
              ! -name '_headers' ! -name '_redirects' ! -name 'serve.conf' \
              -printf '%P\t%s\n' ) | sort > "$manifest"
          echo "verifying $(wc -l <"$manifest") published files on each host"

          # EVERY WORKER REPORTS A VERDICT, and the number of verdicts is
          # asserted against the number of files.
          #
          # The first version of this sweep printed only disagreements, which
          # made silence mean success — and silence is also what a worker that
          # never ran produces. That is not hypothetical: a NUL-separator bug
          # (below) made every worker fail with `Could not resolve host`, and
          # the sweep reported zero disagreements over four files. A gate whose
          # pass condition is "nothing was printed" cannot tell a clean
          # deployment from a broken instrument.
          #
          # So each worker prints `OK <path>` or `BAD <path> <expected> <got>`,
          # and the count of lines must equal the count of manifest entries.
          check_one() {
            local base="$1" rel="$2" expect="$3" got
            got="$(curl -fsSL --retry 2 --retry-delay 1 --retry-all-errors \
                     -o /dev/null -w '%{size_download}' "$base/$rel" || echo 0)"
            if [ "$got" = "$expect" ]; then
              printf 'OK\t%s\n' "$rel"
            else
              printf 'BAD\t%s\t%s\t%s\n' "$rel" "$expect" "$got"
            fi
          }
          export -f check_one

          sweep() {
            # One host, every file, in parallel.
            #
            # NUL-separated triples rather than a re-lookup per file: the
            # manifest is TSV, and a path with a space or a glob character in
            # it must not become two arguments. `-n 3` hands each worker its
            # own (base, path, expected-size).
            #
            # `printf "%c", 0` and NOT `ORS="\0"`: a NUL terminates awk's C
            # string, so `ORS="\0"` is silently the EMPTY separator and every
            # field runs into the next.
            local base="$1"
            awk -F'\t' -v b="$base" \
              '{printf "%s%c%s%c%s%c", b, 0, $1, 0, $2, 0}' "$manifest" \
              | xargs -0 -P 16 -n 3 bash -c 'check_one "$0" "$1" "$2"'
          }

          expected_files="$(wc -l <"$manifest" | tr -d ' ')"
          for base in "https://web-codetracer.pages.dev" "https://ide.codetracer.com"; do
            # Both hosts are REQUIRED now. The asymmetry existed to absorb a
            # propagation window, and the polling above absorbs it properly —
            # demoting a host instead meant a genuinely broken custom domain
            # would have been a `note:` line in a green run.
            required=required
            echo "== $base =="
            results="$RUNNER_TEMP/sweep-results.tsv"
            sweep "$base" > "$results"
            verdicts="$(wc -l <"$results" | tr -d ' ')"
            if [ "$verdicts" -ne "$expected_files" ]; then
              echo "  the sweep returned $verdicts verdicts for $expected_files files — the instrument did not run over every file" >&2
              fail=1
            fi
            disagreed="$(awk -F'\t' '$1=="BAD"{print $2}' "$results" | sort -u)"
            if [ -z "$disagreed" ]; then
              echo "  ok: $verdicts/$expected_files published files match what was uploaded"
            else
              echo "  $(printf '%s\n' "$disagreed" | wc -l | tr -d ' ') of $expected_files file(s) disagreed on the first sweep; polling those"
              while IFS= read -r rel; do
                [ -n "$rel" ] || continue
                check "$base" "/$rel" "$(size "$rel")" "$required"
              done <<<"$disagreed"
            fi
          done

          # THE CAUSE, asserted at the deployment rather than in a unit test.
          #
          # `immutable` tells a cache the bytes at a URL never change. On a
          # stable filename that is false, and the CDN is entitled to believe
          # it for the full max-age: after deploy 2fb3afa6 both custom domains
          # served a 36-hour-old `assets/wasm-worker.js` (`cf-cache-status:
          # HIT`, `age: 131292`) while the pages.dev origin served the new one,
          # and it was still stale an hour later. `web_deployment.nim` now
          # derives the `/assets/*` class from whether the published names
          # carry digests; this checks that what the CDN actually returns
          # agrees, because the header table is merged with the engine's at
          # staging time and a merge is another place for it to go wrong.
          echo "== no stable-named asset is served immutable =="
          while IFS= read -r rel; do
            case "$rel" in assets/*) ;; *) continue ;; esac
            # A digest in the name is the only thing that makes `immutable`
            # true. Mirrors `assetIsContentAddressed` in web_deployment.nim.
            base_name="${rel##*/}"
            if printf '%s' "$base_name" | grep -qE '\.[0-9a-fA-F]{6,}\.'; then
              continue
            fi
            for base in "https://web-codetracer.pages.dev" "https://ide.codetracer.com"; do
              cc="$(curl -fsSI --retry 3 --retry-delay 2 --retry-all-errors \
                      "$base/$rel" | tr -d '\r' \
                    | grep -i '^cache-control:' | cut -d' ' -f2- || true)"
              if printf '%s' "$cc" | grep -qi 'immutable'; then
                echo "  $base/$rel is served '$cc' but its name carries no digest — a deploy cannot dislodge it" >&2
                fail=1
              else
                echo "  ok: $base/$rel -> ${cc:-<none>}"
              fi
            done
          done < <(cut -f1 "$manifest")

          echo "== the served page declares what was served =="
          # Not "it returned 200". The descriptor is what makes the toolchain
          # reachable, so the acceptance is that the LIVE document names the
          # modules and that each named module is fetchable at the size it
          # claims — the deployed equivalent of the guard that ran on the
          # bytes before upload.
          doc="$(curl -fsSL --retry 5 --retry-delay 4 --retry-all-errors \
                   https://web-codetracer.pages.dev/ || true)"
          if printf '%s' "$doc" | grep -q 'id="codetracer-deployment"'; then
            echo "  ok: the served page carries its deployment descriptor"
            printf '%s' "$doc" | grep -o '"id":"[^"]*","url":"[^"]*"' | sed 's/^/    /'
          else
            echo "  the served page carries NO descriptor — it would report no toolchain" >&2
            fail=1
          fi
          # EXACTLY ONE NIM BUNDLE, asserted as a count in both directions.
          #
          # The first clause is the old check's job: a page referencing no Nim
          # bundle can never boot. The second is NS9's: `/web.js` reappearing
          # means the two-program split is back, and that failure is SILENT —
          # both files would be 200, both the right size, and the boot line
          # would still say `ok`, because the loop arm really did boot. Only a
          # Build button would ever have known, which is how 19 MB of working
          # compiler stayed unreachable through a fully green deploy.
          nim_bundles=0
          printf '%s' "$doc" | grep -q 'src="/ui.js"' && nim_bundles=$((nim_bundles + 1))
          printf '%s' "$doc" | grep -q 'src="/web.js"' && nim_bundles=$((nim_bundles + 1))
          if [ "$nim_bundles" -eq 1 ] && printf '%s' "$doc" | grep -q 'src="/ui.js"'; then
            echo "  ok: the served page references exactly one Nim bundle, and it is /ui.js"
          elif [ "$nim_bundles" -eq 0 ]; then
            echo "  the served page references no Nim bundle — it can never boot" >&2
            fail=1
          else
            echo "  the served page references a second Nim bundle (/web.js) — the renderer cannot see the platform it boots" >&2
            fail=1
          fi

          [ "$fail" -eq 0 ] || { echo "the deployed artifact is not what was built" >&2; exit 1; }
          echo "the deployed bytes are the bytes that were built."

      - name: Load the DEPLOYED pages in a browser and assert the product is on them
        # The last and least substitutable check. Everything above this line
        # reasons about bytes: the right files, the right sizes, the right
        # descriptor. A deployment can satisfy all of it and still paint
        # nothing — that is not hypothetical, it is what a previous deploy
        # did, and the step above it passed at the time.
        #
        # So the final acceptance is a browser on the real hostname, asserting
        # the DOM. Not "boot reported ok": the surface the ROUTE calls for,
        # rendered, and zero uncaught page errors.
        #
        # TWO ROUTES, and the second is the one this step was missing.
        # Until 2026-09-01 it loaded `$base/` and only `$base/`, so a build
        # that ignored the URL entirely passed it — which is exactly what
        # shipped: `https://ide.codetracer.com/noir` opened the welcome screen
        # instead of the Noir template, and every gate stayed green because no
        # gate ever asked for that address. `/` and `/noir` must show
        # DIFFERENT surfaces (Noir-Studio.md §1b.0 rule 0), and asserting
        # either alone is satisfied by a product that mounts one thing
        # everywhere.
        #
        # THE HTTP STATUS IS CHECKED SEPARATELY FROM THE DOM, because the
        # browser hides the difference. `/noir` was answered `308 -> /` by
        # Cloudflare Pages — the rewrite target was `/index.html`, which Pages
        # normalises — so the tab ended up at `/`, correctly rendered the
        # language-neutral root, and a DOM-only check would have called that a
        # pass while the address bar showed the user the wrong page. §1b.4
        # requires the entry document "served 200 rather than 302"; this is
        # that clause, measured on the deployment.
        #
        # `web-codetracer.pages.dev` is REQUIRED and `ide.codetracer.com` is
        # advisory, for the same propagation reason the size checks above draw
        # that line: the two are one deployment and the custom domain has been
        # observed to lag.
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p deployed-shots
          fail=0
          # base|required|route:want,route:want
          #
          # THE THIRD ROW IS THE SECOND DOMAIN. On `noirstudio.dev` the ROOT is
          # the Noir entry point — that is the whole of what "landing there is
          # equivalent to /noir" means — and `/noir` still works there, because
          # rule 0 makes `/noir` a spelling of an entry point rather than a
          # namespace, and links get pasted between hosts by people who do not
          # know there are two.
          #
          # It is `skippable`: until the domain is added to the Pages project
          # and DNS points at it there is nothing to load, and a check that
          # cannot reach its subject must SAY so rather than fail as though the
          # product were broken. The moment the domain resolves this becomes a
          # real assertion with no further change here.
          for row in \
            "https://web-codetracer.pages.dev|required|/:welcome,/noir:template" \
            "https://ide.codetracer.com|advisory|/:welcome,/noir:template" \
            "https://noirstudio.dev|skippable|/:template,/noir:template"; do
            base="${row%%|*}"
            rest="${row#*|}"
            required="${rest%%|*}"
            routes="${rest#*|}"
            echo "== $base =="
            if [ "$required" = skippable ]; then
              if ! curl -sf -o /dev/null --max-time 15 "$base/" 2>/dev/null; then
                echo "  SKIPPED — $base does not resolve or does not serve yet."
                echo "  A human must add it to the web-codetracer Pages project"
                echo "  (Custom domains) and point DNS at it. The bundle already"
                echo "  DECLARES it: see CT_WEB_LANGUAGE_ORIGINS above, and the"
                echo "  languageOrigins entry in the served index.html. No"
                echo "  redeploy is needed once the domain is attached."
                continue
              fi
              required=advisory
            fi

            # (1) The hosting contract, at HTTP level. Every entry prefix must
            #     answer 200 with no redirect. `--max-redirs 0` rather than
            #     following: a 308 that lands on a working page is still the
            #     defect, because the URL the user typed is gone.
            for path in /noir /noir/new /projects /s/probe /p/probe; do
              code="$(curl -s -o /dev/null --max-redirs 0 \
                        -w '%{http_code}' "$base$path" || echo 000)"
              if [ "$code" = "200" ]; then
                echo "  [OK]   $path -> $code"
              else
                echo "  [FAIL] $path -> $code (want 200; a 3xx means the rewrite" \
                     "became a redirect and the address the user typed is lost)"
                [ "$required" = required ] && fail=1
              fi
            done

            # (2) The DOM, per route.
            for route in ${routes//,/ }; do
              path="${route%%:*}"
              want="${route##*:}"
              label="$(echo "$base$path" | tr -c 'a-zA-Z0-9' '-')"
              report="deployed-shots/${label}.json"
              CT_PROBE_SCREENSHOT="deployed-shots/${label}.png" \
                nix develop .#ci --command \
                  node ci/test/web_renderer_probe.mjs "$base$path" 12000 >"$report" || true
              if [ ! -s "$report" ]; then
                echo "  the probe produced no report for $base$path" >&2
                [ "$required" = required ] && fail=1
                continue
              fi
              verdict="$(CT_WANT="$want" python3 - "$report" <<'PY'
          import json, os, sys
          d = json.load(open(sys.argv[1]))
          dom = d.get("dom", {})
          want = os.environ["CT_WANT"]
          roots = dom.get("welcomeScreenRoots", 0)
          opts = dom.get("startOptions", 0)
          panels = dom.get("filesystemPanels", 0)
          labels = dom.get("entryLabels") or []
          errs = d.get("pageErrors", [])
          pt = dom.get("paintedText") or {}
          shown = " ".join(pt.get("shown", []))
          problems = []
          # WHAT A USER CAN ACTUALLY READ. `innerText` counts text that is laid
          # out and then painted over: on the deployed /noir it reported 425
          # characters where 46 were readable, the rest being the boot
          # diagnostic under #menu. So the acceptance reads painted text, and
          # refuses a page whose readable content is a status line.
          if "codetracer-web-boot" in shown or "codetracer-web-renderer" in shown:
              problems.append("a status line is PAINTED: " + shown[:120])
          if not dom.get("domRootPresent"):
              # Non-vacuity: every count below is 0 on a page the probe never
              # reached, which would read identically to a wrong surface.
              problems.append("no #dom-root — the probe did not reach the application")
          elif want == "welcome":
              # Rule 0: the language-neutral root names no language, so there is
              # no template to select and this is the correct surface for it.
              if roots != 1:
                  problems.append(f"{roots} .welcome-screen-root (want 1)")
              if opts < 5:
                  problems.append(f"{opts} start options rendered (want >= 5)")
              if panels != 0:
                  problems.append(f"{panels} filesystem panel(s) on the welcome route (want 0)")
          else:
              # §1b.0 rule 5, first row: the bundled hello-world template.
              if roots != 0:
                  problems.append(f"{roots} .welcome-screen-root on the template route "
                                  "(want 0 — this is the reported defect)")
              if panels != 1:
                  problems.append(f"{panels} filesystem panel(s) (want 1)")
              for name in ("main.nr", "Nargo.toml"):
                  if name not in labels:
                      problems.append(f"no {name} in the tree (labels: {labels})")
          if errs:
              problems.append("uncaught page errors: " + " | ".join(errs))
          print("OK" if not problems else "FAIL: " + "; ".join(problems))
          print("  painted text:  %d chars: %s" % (pt.get("painted", -1), shown[:160]))
          print("  renderer said: " + (d.get("rendererLine") or "(nothing)"))
          print("  boot said:     " + (d.get("bootLine") or "(nothing)"))
          print("  tree:          " + ", ".join(labels) if labels else "  tree:          (none)")
          print("  on screen:     " + (dom.get("visibleText") or "")[:200].replace("\n", " / "))
          PY
          )"
              echo "  -- $path (expecting the $want surface)"
              echo "$verdict" | sed 's/^/     /'
              case "$verdict" in
                OK*) : ;;
                *) [ "$required" = required ] && fail=1 ;;
              esac
            done
          done
          [ "$fail" -eq 0 ] || {
            echo "the deployed pages do not show the product the URL calls for" >&2
            exit 1
          }
          echo "a browser loaded each reachable host's entry routes on the"
          echo "deployed site and found the product the URL calls for on each."

      - name: Upload what the browser saw on the deployed page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-page-evidence
          path: deployed-shots/
          if-no-files-found: ignore
