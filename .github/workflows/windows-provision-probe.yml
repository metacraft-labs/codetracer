# A SINGLE-JOB PROBE OF THE FULL WINDOWS `env.ps1` PROVISION.
#
# WHY THIS EXISTS.
#
# `windows-rust-components` in `codetracer.yml` is the lane that provisions the
# Windows toolchain, and it is the lane whose provisioning cost and install-root
# size everything else is sized against. Those numbers can only be produced by a
# run that actually provisions, so they cannot be obtained locally at all.
#
# Dispatching `codetracer.yml` to get them is a poor trade: it has no dispatch
# inputs, so it starts the widest matrix in this repository, several jobs of
# which contend for the same scarce `eph-win-x64` runners. This workflow runs
# ONE job on ONE Windows runner and carries the provisioning prefix of
# `windows-rust-components` verbatim -- same bootstrap, same checkout, same
# `setup-dev-env` inputs, same `env.ps1`, NO `WINDOWS_DIY_ONLY` and NO
# `WINDOWS_DIY_SKIP_*`. It is narrower in what runs AFTER provisioning, not in
# the provisioning itself; a probe that provisioned less would answer a
# different question than the one being asked.
#
# WHY IT IS NOT `workflow_dispatch`-ONLY. `workflow_dispatch` only registers for
# a workflow present on the repository's DEFAULT branch, which here is `stable`.
# A dispatch-only workflow added on a feature branch is therefore not
# dispatchable at all -- the API returns 404 for it. A `push` filter naming this
# branch is the only trigger that reaches a Windows runner from here. Every
# other push-triggered workflow in this repository filters to
# `main`/`dev`/`stable`/`cloud`, so a push to this branch starts this job and
# nothing else.
#
# ci-mainline-exempt: a single-purpose provisioning probe on its own branch; it must not run on a mainline push
#
# The `branches:` filter below deliberately names no mainline. This job exists
# to consume one contended Windows slot on request, and adding it to `dev` would
# make every mainline push pay for it.
name: Windows provision probe

on:
  push:
    branches:
      - ci/windows-provision-probe
  workflow_dispatch:

concurrency:
  group: windows-provision-probe-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-provision:
    runs-on: eph-win-x64  # DIY-Windows (env.ps1) -> eph-win-x64
    # RAISED FROM 75 AFTER THE FIRST PROBE RUN (34026964163), and the number is
    # derived from that run's own step timings rather than guessed.
    #
    # That run was killed by the 75-minute cap having provisioned 7 of the 22
    # components. Its budget went:
    #
    #   checkout (submodules)     37.8 min   <- not provisioning at all
    #   job setup + git + token    3.3 min
    #   the two bound/gate checks   2.2 min
    #   sibling clone              1.5 min
    #   env.ps1                   29.6 min   <- the only part being measured
    #
    # So HALF the cap was spent on a recursive submodule checkout that
    # `env.ps1` does not read (it contains no `submodule` reference, and no
    # `ensure-*.ps1` reads anything under `libs/`). Moving that fetch below the
    # measurement returns ~35 min to provisioning at no extra slot cost, which
    # is why this cap rises by much less than the shortfall would suggest.
    #
    # 120 = ~10 min of measured non-provisioning overhead, plus the provisioning
    # tail, plus headroom. It is a BACKSTOP rather than the primary bound: every
    # download now carries a total budget and a stall bound, so this job can no
    # longer sit silently for hours the way an unbounded transfer allowed.
    # If it fires again it will do so having measured 20+ components, and the
    # next value can be arithmetic instead of an estimate.
    timeout-minutes: 120
    steps:
      # Verbatim from `windows-rust-components`: `actions/checkout` needs a real
      # git on PATH on these guests, and `submodules: recursive` cannot be
      # honoured through its REST fallback.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      # NO SUBMODULES HERE, DELIBERATELY, AND IT DOES NOT NARROW THE PROBE.
      #
      # On run 34026964163 the recursive submodule checkout cost 37.8 minutes of
      # a 75-minute cap -- 30.2 min fetching 33 submodules, plus ~4 min of
      # per-submodule `git config` in "Setting up auth" and 1.4 min persisting
      # their credentials. That is half the budget spent before the step under
      # measurement starts.
      #
      # None of it is an input to what is being measured. `env.ps1` contains no
      # reference to submodules, and no `ensure-*.ps1` reads anything under
      # `libs/` -- `ensure-nargo.ps1` wants `flake.lock` and
      # `non-nix-build/windows/`, both tracked in this repo proper. So the
      # provisioning cost this job exists to record is bit-for-bit unaffected by
      # whether the submodules are present, and fetching them AFTER the
      # measurement changes the measurement not at all.
      #
      # The build-evidence steps at the bottom DO need them; they get their own
      # fetch below, once the decomposition is safely uploaded.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          token: ${{ steps.ci_token.outputs.token }}

      # It pins the claim the decomposition below depends on:
      # that every gated component in `env.ps1` really goes through the
      # instrumented wrapper, so the table cannot silently omit one.
      - name: Validate the component-decomposition coverage gate
        shell: pwsh
        timeout-minutes: 10
        run: pwsh -File ci/test/bootstrap-decomposition.ps1

      - name: Setup dev env
        # Byte-identical to `windows-rust-components`' step: same action ref,
        # same flavor, same siblings at the same refs. This is the step under
        # test and the step the measurement comes from.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            codetracer-native-recorder=dev

      - name: Upload env.ps1 component decomposition
        # `if: always()` so a run that dies mid-bootstrap still publishes what
        # it measured.
        #
        # THE `if: always()` IS NOT SUFFICIENT ON ITS OWN, and run 34026964163
        # proved it: both this step and the summary below ran and succeeded, and
        # yet no artifact was produced, because there was no file to upload. The
        # report was emitted from a `finally` inside `env.ps1`, and a `finally`
        # does not run when the process is KILLED -- which is exactly what the
        # job cap does. `env.ps1` now flushes the table after every component,
        # so the file exists from the first component onward and a capped run
        # yields real timings instead of nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-env-decomposition
          path: .tmp/windows-diy/windows-env-decomposition.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Summarise the decomposition
        # The report is already printed to the bootstrap log, but that log is
        # long and this makes the two numbers that matter -- per-component wall
        # clock and the install-root total -- readable without downloading an
        # artifact. `if: always()` for the same reason as the upload above.
        if: always()
        shell: pwsh
        run: |
          $path = ".tmp/windows-diy/windows-env-decomposition.json"
          if (-not (Test-Path -LiteralPath $path)) {
            Write-Host "No decomposition written: the bootstrap did not reach the report."
            return
          }
          $report = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
          # A partial (the bootstrap was killed before it finished) carries
          # timings but NO sizes. Saying so explicitly matters: this table is
          # what downstream sizing is read off, and a partial quoted as a
          # complete provision would understate it by however many components
          # never ran.
          $isPartial = ($report.phase -eq "partial")
          $lines = @()
          if ($isPartial) {
            $lines += "**PARTIAL** - the bootstrap did not finish. Timings below are real for the"
            $lines += "components listed; components not listed never ran, and NO size was measured."
            $lines += ""
          }
          $lines += "| component | status | seconds | MB | class | note |"
          $lines += "|---|---|---:|---:|---|---|"
          foreach ($c in ($report.components | Sort-Object -Property seconds -Descending)) {
            $note = if ($c.error) { $c.error } elseif ($c.skip_reason) { $c.skip_reason } else { "" }
            $mb = if ($null -eq $c.bytes) { "n/a" } else { "{0:N1}" -f ($c.bytes / 1MB) }
            $lines += ("| {0} | {1} | {2:N1} | {3} | {4} | {5} |" -f `
              $c.step, $c.status, $c.seconds, $mb, $c.relocatability, $note)
          }
          $lines += ""
          $lines += ("components measured: {0} of 22" -f @($report.components).Count)
          if ($null -eq $report.install_root_bytes) {
            $lines += "install_root_bytes: NOT MEASURED (partial run)"
          } else {
            $lines += ("install_root_bytes: {0} ({1:N1} MB in {2:N0} files)" -f `
              $report.install_root_bytes, ($report.install_root_bytes / 1MB), $report.install_root_files)
          }
          $lines += ("total_seconds: {0}   complete: {1}   phase: {2}" -f `
            $report.total_seconds, $report.complete, $report.phase)
          $lines += ("skipped: [{0}]  failed: [{1}]" -f `
            ($report.skipped_steps -join ","), ($report.failed_steps -join ","))
          $text = $lines -join "`n"
          Write-Host $text
          if ($env:GITHUB_STEP_SUMMARY) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $text
          }

      # RUNS AFTER THE DELIVERABLE IS SAFE, AND IS STILL A HARD GATE.
      #
      # This runs the download/native-command bounds' own NEGATIVE tests on a
      # real Windows host rather than only on Linux pwsh, which is worth
      # knowing. It used to run FIRST, before provisioning, and that ordering
      # cost two runs on a two-slot lane -- both times in its POSITIVE case,
      # and both times because of a defect in its own loopback test server
      # rather than in any bound it asserts. Those defects are fixed, but the
      # ordering that converted them into a total loss is the thing worth
      # correcting: a check whose subject is HOST behaviour should not stand
      # between the run and the measurement the run exists to take.
      #
      # It is NOT weakened to earn the move. Every assertion keeps its full
      # strength and a failure still turns this job red; it simply can no
      # longer cost the decomposition, which by this point is uploaded and
      # summarised. Nor does moving it blunt the gate, because this is not
      # where the gate has its teeth: the same script runs as a hard,
      # first-class, blocking step in `windows-bootstrap-smoke`
      # (`codetracer.yml`) and in `windows-msys2-provision-check`, both of
      # which gate the mainline. Here it is a second opinion from a
      # provisioning host, and second opinions go after the evidence.
      #
      # 15 rather than 10: the step was measured taking ~4 minutes to reach its
      # fourth group on this runner class, most of it `Start-Job` spawn, so a
      # 10-minute cap left too little headroom on a contended guest -- and a
      # cap that fires reports a timeout rather than a finding.
      - name: Validate download and native-command bounds on this host
        shell: pwsh
        timeout-minutes: 15
        run: pwsh -File ci/test/download-stall-bound.ps1

      # From here down: enough of `windows-rust-components` to establish that
      # provisioning really did leave the runner able to start a build. The bar
      # is REACHING the first build step, not the build passing -- a
      # pre-existing build failure is a different question and must not be
      # imported into this one, which is why the build below is
      # `continue-on-error`.

      # The submodules the checkout above deliberately skipped. They are inputs
      # to the build-evidence steps only, never to provisioning, so they are
      # fetched here -- after the measurement has been taken AND uploaded.
      # Ordered this way, a slow submodule fetch can cost the build evidence but
      # can no longer cost the decomposition, which is this job's actual
      # deliverable.
      #
      # `continue-on-error` for the same reason: losing the build evidence is a
      # far smaller loss than losing the measurement, and it must not turn a run
      # that produced the measurement red.
      #
      # The token goes in via `git -c url.<authed>.insteadOf`, not by re-running
      # `actions/checkout`: a second checkout would `git clean -ffdx` the
      # working tree, and `env.ps1` has by then created junctions inside it.
      # `git -c` is exported as GIT_CONFIG_PARAMETERS, which git propagates to
      # the child processes that clone each submodule -- so one command
      # authenticates the whole recursive walk without writing the token to any
      # config file.
      - name: Fetch submodules for the build-evidence steps
        continue-on-error: true
        shell: bash
        env:
          CI_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          git -c "url.https://x-access-token:${CI_TOKEN}@github.com/.insteadOf=https://github.com/" \
            submodule update --init --recursive --depth=1

      - name: Remove WSL bash stub from System32
        shell: pwsh
        run: |
          $wslStub = "$env:SystemRoot\System32\bash.exe"
          if (Test-Path $wslStub) {
            takeown /f $wslStub | Out-Null
            icacls $wslStub /grant "Administrators:(F)" | Out-Null
            Remove-Item -Force $wslStub
          }
          $gitForWindowsBin = "C:\Program Files\Git\bin"
          if (Test-Path -LiteralPath $gitForWindowsBin -PathType Container) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitForWindowsBin
          }
          $bash = Get-Command bash -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $bash) {
            throw "No bash on PATH after provisioning; every build step below needs it."
          }
          Write-Host "Using bash from $($bash.Source)"

      - name: Generate tree-sitter-nim parser
        shell: pwsh
        run: |
          npm install -g tree-sitter-cli
          cd libs/tree-sitter-nim
          tree-sitter generate

      - name: Build db-backend (reached-the-build-step evidence only)
        continue-on-error: true
        working-directory: src/db-backend
        shell: bash
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: dev-exec cargo build
