name: Cross-Repo Integration Tests

on:
  pull_request:
    branches-ignore: [agents]
    paths:
      - 'src/db-backend/**'
      - 'scripts/resolve-sibling-rev.sh'
      - 'scripts/run-cross-repo-tests.sh'
      - 'ci/test/build-recorder-siblings.sh'
      - '.github/workflows/cross-repo-tests.yml'
  push:
    branches: [main, dev, stable]
    paths:
      - 'src/db-backend/**'
      - 'scripts/resolve-sibling-rev.sh'
      - 'scripts/run-cross-repo-tests.sh'
      - 'ci/test/build-recorder-siblings.sh'
      - '.github/workflows/cross-repo-tests.yml'
  workflow_dispatch:
    inputs:
      rr_backend_ref:
        description: 'rr-backend git ref to test against (default: dev)'
        required: false
        default: ''
      shell_recorders_ref:
        description: 'shell-recorders git ref to test against (default: dev)'
        required: false
        default: ''

# Collapse superseded pull-request runs only.
#
# `github.head_ref` is set on `pull_request` and empty everywhere else, so PR
# runs group per source branch and a new push cancels the run it superseded.
# Pushes to `main`/`dev`/`stable` and manual dispatches fall through to
# `github.run_id`, which is unique per run: each gets its own group and is
# never cancelled, so the per-commit history on the mainlines stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  rr-backend-tests:
    # ROUTED to the GPU hosts (H4), reversing the hold that was placed here for
    # the same wrong reason as codetracer.yml's `test-ui-tests-rr`: rr does not
    # run "unpinned" on a hybrid part. Its default bind mode is
    # BindCPU::PREFER_PERF_CORE (rr RecordCommand.cc:214), choose_cpu() filters
    # the candidate set down to CPUGroup::P_CORE before picking
    # (util.cc:2166 -> util.cc:2075), and truly unbound recording is refused
    # outright on multi-PMU systems (PerfCounters.cc:325). See the longer note
    # on test-ui-tests-rr in codetracer.yml.
    #
    # This job additionally pins on its own: codetracer-native-backend's
    # `just test-hw` reads /sys/bus/event_source/devices, and when it finds
    # cpu_core + cpu_atom it taskset's the suite onto the high-base-frequency
    # cores. So on a 12900K the tracee is confined to CPUs 0-15 twice over.
    #
    # Placed on -g1 rather than -g2 to balance the split; see the routing
    # commit for the runtime figures.
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout codetracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones the cross-repo siblings adjacent to this checkout at their
        # pinned `dev` refs (recursive submodules), replacing
        # the former Checkout-manifests / Resolve-lock / per-sibling
        # clone-repo machinery. The rr_backend_ref workflow_dispatch input
        # overrides codetracer-native-backend's ref (empty => `dev`).
        # The native-backend submodule unfold below is still bespoke
        # because the path:-flake-input visibility fix is specific to this
        # repo's flake.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            codetracer-native-backend=${{ github.event.inputs.rr_backend_ref || 'dev' }}
            # codetracer-trace-format{,-nim} BY COMMIT, not `=dev`: the two halves of
            # the FFI pair are `/agents` inputs in flake.nix, and trace-format's `dev`
            # tip (051a298, 2026-09-30) predates the FileTable / PathTableKind API that
            # src/db-backend's ctfs_trace_reader has called since 2026-10-03, so a
            # sibling cloned at `dev` fails to compile. Full account and the refresh
            # rule: .github/actions/setup-db-backend-siblings/action.yml.
            codetracer-trace-format=3fada0b03c3d1a0cbc7c35f278aa639028d702c5
            codetracer-trace-format-nim=051efd22b00ec3b88676fb07755a65c5a4ca8fde
            codetracer-native-recorder=dev

      - name: Unfold native-backend submodules into parent index
        # codetracer-native-backend's flake.nix has
        # ``rr-soft.url = "path:libs/rr"`` and ``delve-patched.url =
        # "path:libs/delve"``.  Nix's path: flake-input resolver decides which
        # files are visible with ``git ls-files``, and a submodule contributes
        # only a gitlink to its parent's index, so ``nix develop
        # <native-backend>`` aborts with ``Path 'libs/rr/flake.nix' ... is not
        # tracked by Git``.
        #
        # The two paths named here are exactly the two ``path:`` inputs that
        # flake.nix declares.  Naming them turns "the unfold was incomplete"
        # into a failure HERE, with a diagnostic, instead of a Nix evaluation
        # stack trace four steps further on -- which is how this job failed on
        # every run of `dev` before this.
        #
        # The logic moved to a script so it could be tested:
        # ci/test/unfold-submodules-test.sh runs it against real repositories
        # with real submodules, including the uninitialised-submodule state
        # this job kept hitting.
        shell: bash
        run: |
          ./ci/unfold-submodules.sh \
            "$(pwd)/../codetracer-native-backend" \
            libs/rr/flake.nix \
            libs/delve/flake.nix

      - name: Allow direnv in cloned codetracer-native-recorder
        # db-backend's build.rs (and the integration tests that build
        # it transitively) invoke ``direnv exec <recorder> bash
        # ct_emulator/build_native_api.sh`` to materialise generated C
        # sources.  A fresh clone's .envrc is in the "blocked" state,
        # so direnv refuses to run.  ``direnv allow`` whitelists it.
        #
        # THE HOST SHELL IS OURS, NOT THE SIBLING'S.  This ran
        # ``nix develop "$CLONE_DIR"`` -- codetracer-native-backend's shell --
        # which declares no direnv, so it died with ``exec: direnv: not found``
        # and exit 127 (run 32489213400, the one run in months that got past
        # the submodule unfold and reached this step at all).  direnv is a
        # declared package of THIS repo's shell, in nix/shells/ci-base.nix,
        # precisely because build.rs needs it; a sibling's flake is not ours to
        # fix.  ci/test/direnv-provenance-test.sh keeps every direnv call site
        # on a dev shell this repo defines.
        run: |
          nix develop .#devShells.x86_64-linux.default --command \
            direnv allow "$(pwd)/../codetracer-native-recorder"

      - name: Resolve ct_emulator nimble dependencies
        # build_native_api.sh's ``nim c ... ct_emulator.nim`` requires
        # the ``results`` nimble package (declared in ct_emulator.nimble);
        # without ``nimble install --depsOnly`` the script aborts with
        # ``cannot open file: results`` and db-backend's build.rs
        # panics during the cross-repo integration test cargo runs.
        #
        # The outer shell only has to supply direnv (see the step above); nim
        # and nimble come from the RECORDER's own flake, which is what
        # ``direnv exec "$RECORDER_DIR"`` loads.
        run: |
          RECORDER_DIR="$(pwd)/../codetracer-native-recorder"
          nix develop .#devShells.x86_64-linux.default --command \
            direnv exec "$RECORDER_DIR" \
              bash -c "cd '$RECORDER_DIR/ct_emulator' && nimble install --depsOnly -y"

      - name: Build ct-native-replay
        run: |
          # Cargo's default libgit2 transport does NOT read gitconfig, so the
          # private `lldb-sys.rs` dependency fails to authenticate and the
          # build dies with:
          #
          #   failed to load source for dependency `lldb-sys`
          #   failed to authenticate when downloading repository
          #   attempted to find username/password via git's `credential.helper`
          #
          # Forcing the git CLI makes cargo use the credential `Setup dev env`
          # has ALREADY installed job-wide: that step runs the shared
          # `setup-nix`, which exports
          #
          #   GIT_CONFIG_KEY_0=http.https://github.com/metacraft-labs/.extraHeader
          #
          # through $GITHUB_ENV. So nothing is configured here — the one
          # missing piece was the transport. This mirrors the identical
          # single-line fix on codetracer.yml's `just build-ct-mcr` step, which
          # fetches this same dependency.
          #
          # Deliberately NOT the `git config --global url.…insteadOf` form:
          # that was removed from this repo on purpose because `--global` IS
          # inherited by `git clone`, putting the token into argv, into the
          # `.git/config` of every clone it touches, and into git's own error
          # messages — for nixpkgs and every third-party fetch too, none of
          # which the token is for. The scoped extraHeader avoids all of that.
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          CLONE_DIR="$(pwd)/../codetracer-native-backend"
          # The runner exports its own CARGO_TARGET_DIR (/build/cargo/<runner>),
          # so a bare `cargo build` put the binary there and never at the
          # target/debug/ct-native-replay the test step hands over. The script
          # then found nothing, rebuilt outside this repo's LLDB shell, and died
          # with "unable to locate shared library of liblldb" (run 35707046571).
          # Build where the next step looks, and check it is there.
          nix develop "$CLONE_DIR" --command \
            bash -c "cd '$CLONE_DIR' && CARGO_TARGET_DIR='$CLONE_DIR/target' cargo build"
          if [ ! -x "$CLONE_DIR/target/debug/ct-native-replay" ]; then
            echo "::error::cargo build succeeded but $CLONE_DIR/target/debug/ct-native-replay is missing"
            exit 1
          fi

      - name: Resolve rr-backend environment paths
        id: rr-libs
        run: |
          CLONE_DIR="$(pwd)/../codetracer-native-backend"
          # Use markers to extract paths cleanly (nix develop may print banners)
          RAW="$(nix develop "$CLONE_DIR" --command bash -c \
            'echo "___LD_PATH_START___"; echo "$LD_LIBRARY_PATH"; echo "___LD_PATH_END___";
             echo "___PATH_START___"; echo "$PATH"; echo "___PATH_END___"')"
          RR_LD="$(echo "$RAW" | sed -n '/___LD_PATH_START___/{n;p;}')"
          RR_PATH="$(echo "$RAW" | sed -n '/___PATH_START___/{n;p;}')"
          echo "ld_library_path=$RR_LD" >> "$GITHUB_OUTPUT"
          echo "extra_path=$RR_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved rr-backend LD_LIBRARY_PATH: $RR_LD"
          echo "Resolved rr-backend PATH (first 200 chars): ${RR_PATH:0:200}..."

      - name: Run cross-repo integration tests
        # Graceful skipping OFF: this lane provisions the tools its tests need,
        # so a missing one is a failure here, not a skip that passes.
        env:
          CODETRACER_ALLOW_GRACEFUL_TEST_SKIPPING: "false"
        run: |
          CT_NATIVE_REPLAY="$(pwd)/../codetracer-native-backend/target/debug/ct-native-replay"
          echo "Using ct-native-replay: $CT_NATIVE_REPLAY"
          RR_EXTRA_PATH="${{ steps.rr-libs.outputs.extra_path }}"
          RR_LD="${{ steps.rr-libs.outputs.ld_library_path }}"
          nix develop .#devShells.x86_64-linux.default --command \
            bash -c "
              export PATH=\"${RR_EXTRA_PATH}:\$PATH\"
              export CT_NATIVE_REPLAY_PATH=\"${CT_NATIVE_REPLAY}\"
              export CT_NATIVE_REPLAY_LD_LIBRARY_PATH=\"${RR_LD}\"
              export CODETRACER_RR_SOFT_MODE=1
              ./scripts/run-cross-repo-tests.sh --soft all
            "

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rr-backend-test-logs
          path: target/cross-test-logs/
          retention-days: 14
          if-no-files-found: ignore

  # The db-backend tests that record through a SIBLING recorder that
  # codetracer's dev shell does not ship: Bash and Zsh, PHP, the value-origin
  # tests for Aiken, Cairo, Circom, Leo, Solana and Sway (plus the Cairo GLI
  # decode regression), and the flow / calltrace tests of the blockchain
  # recorders (Aiken, Cadence, Cairo, Circom, EVM / Solidity, Leo, MASM, Move,
  # PolkaVM, Solana, Sway, Tolk). `test-non-gui` excludes them by name
  # (ci/test/non-gui-not-provided.linux.txt names this job as where they run).
  #
  # WHY HERE AND NOT IN `test-non-gui`. The recorders are thirteen separate
  # Rust / C builds. `test-non-gui` runs on every Codetracer CI trigger, docs and
  # frontend changes included; this workflow is path-filtered to the db-backend
  # sources and the scripts that build and run these tests.
  # Building them here costs runner time only when it can find something, and
  # reuses the db-backend test build this job already did for the shell
  # recorders instead of adding a job (and a Linux x64 queue slot) of its own.
  recorder-tests:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # The thirteen recorder builds dominate; most of their dependency trees are
    # large (cairo-lang, fuel-vm, solana sbpf, aiken, sui, miden, revm). Bounded
    # so a hung build frees the runner.
    timeout-minutes: 210

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout codetracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # THE SIBLING SET THIS JOB NEEDS IS NOT THE SHELL RECORDERS' SIBLING
        # SET. The test command below runs `cargo test` from inside
        # `src/db-backend`, so this job builds the db-backend crate and needs
        # every sibling THAT build resolves by relative path -- which is what
        # `.github/actions/setup-db-backend-siblings` names, in one place, for
        # the eight jobs that build it.
        #
        # This job used to call `setup-dev-env` directly with a hand-derived
        # list, reasoning only about the shell recorders' own path
        # dependencies. That list was right about those and silently omitted
        # `codetracer-native-recorder`, which no shell recorder needs but
        # `src/db-backend/build.rs` requires unconditionally: it compiles and
        # links the recorder's Nim MCR emulator, and `src/lib.rs` exports
        # `emulator_ffi` / `emulator_origin` / `emulator_session` / `data_watch`
        # whether or not anything calls them. The job compiled the whole
        # tree-sitter tree and then panicked at build.rs:170 --
        #
        #   db-backend requires the sibling `codetracer-native-recorder`
        #   checkout, and it was not found.
        #
        # -- in run 32995543471 and in every run before it back to 2026-08-04.
        # `ci/test/sibling-provisioning-test.sh` now fails when a job that runs
        # cargo against `src/db-backend` does not provision it.
        #
        # `extra-siblings` carries the ONE sibling that is genuinely this job's
        # own: the shell recorders under test. codetracer-trace-format /
        # codetracer-trace-format-nim were in the hand-rolled list for the
        # shell recorders' sake (`crates/ct-shell-trace-writer` path-depends on
        # `codetracer_trace_types` and on `codetracer_trace_writer_nim`, whose
        # build.rs resolves the Nim FFI entry point as a sibling of the Rust
        # half) and the composite provisions both anyway -- db-backend needs
        # the same matched pair for the same reason.
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          extra-siblings: |
            codetracer-shell-recorders=${{ github.event.inputs.shell_recorders_ref || 'dev' }}

      - name: Build shell trace writer
        run: |
          CLONE_DIR="$(pwd)/../codetracer-shell-recorders"
          nix develop .#devShells.x86_64-linux.default --command \
            bash -c "cd '$CLONE_DIR' && cargo build"

      - name: Allow direnv in cloned codetracer-native-recorder
        # `src/db-backend/build.rs` shells out to ``direnv exec <recorder-root>
        # bash ct_emulator/build_native_api.sh`` to materialise the generated C
        # sources before the Rust build. A fresh clone's `.envrc` is in the
        # "blocked" state, so direnv refuses to run it and build.rs fails with
        # ``build_native_api.sh exited with status exit status: 1``.
        # `direnv allow` is idempotent and only writes this runner's local
        # direnv state dir. Same step, same reason, as the `rr-backend-tests`
        # job above and the six db-backend jobs in `codetracer.yml`; the
        # composite action deliberately leaves it to the caller because only
        # the jobs that actually compile build.rs need it.
        run: |
          nix develop .#devShells.x86_64-linux.default --command \
            direnv allow "${{ github.workspace }}/../codetracer-native-recorder"

      - name: Resolve ct_emulator nimble dependencies
        # `build_native_api.sh` runs ``nim c ... ct_emulator.nim``, whose
        # `.nimble` declares ``requires "results"``. A fresh nim install has no
        # global `results` package, so the script aborts with ``cannot open
        # file: results``. Resolve them once, inside the RECORDER's own direnv
        # environment so nim/nimble come from the recorder's flake.
        run: |
          RECORDER_DIR="${{ github.workspace }}/../codetracer-native-recorder"
          nix develop .#devShells.x86_64-linux.default --command \
            direnv exec "$RECORDER_DIR" \
              bash -c "cd '$RECORDER_DIR/ct_emulator' && nimble install --depsOnly -y"

      # The recorder siblings, cloned with `clone-repo` rather than added to the
      # `extra-siblings` block above: those entries are `=dev` branch tips, and
      # ci/test/sibling-provisioning-test.sh's branch-tip ceiling is lowered,
      # never raised. Same shape `test-non-gui` uses for the js recorder.
      - name: Clone codetracer-cairo-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-cairo-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-cairo-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-circom-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-circom-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-circom-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-leo-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-leo-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-leo-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-cardano-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-cardano-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-cardano-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-solana-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-solana-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-solana-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-fuel-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-fuel-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-fuel-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-php-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-php-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-php-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-evm-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-evm-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-evm-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-flow-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-flow-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-flow-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-miden-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-miden-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-miden-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-move-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-move-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-move-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-polkavm-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-polkavm-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-polkavm-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-ton-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-ton-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-ton-recorder
          submodules: "false"
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Build recorder siblings
        # Each recorder is built in its own dev shell with its own `just`
        # targets; codetracer's shell only supplies direnv and just.
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: nix develop .#devShells.x86_64-linux.default --command just build-recorder-siblings

      - name: Run recorder integration tests
        # Graceful skipping OFF (the recipe sets it): every recorder these tests
        # use is built above, and the Solana and Sway fixtures' compilers
        # (cargo-build-sbf, forc) come from codetracer's Linux dev shell.
        # CT_EMULATOR_EXTRA_NIM_PATHS: the emulator's `syscall_replay.nim`
        # imports `stew/endians2`, which `ct_emulator.nimble` does not declare;
        # codetracer's pinned `libs/nim-stew` and `libs/nim-result` supply it, as
        # in the other db-backend jobs.
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: nix develop .#devShells.x86_64-linux.default --command just test-recorder-siblings

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recorder-test-logs
          path: target/cross-test-logs/
          retention-days: 14
          if-no-files-found: ignore
