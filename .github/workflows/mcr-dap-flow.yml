name: MCR DAP Flow

# Cross-repo CI for the MCR-backend DAP flow tests
# (src/db-backend/tests/*_mcr_streaming_flow_test.rs) and for the
# backend-manager tests that record with ct-mcr (the entries
# ci/test/non-gui-not-provided.linux.txt names for this job, which
# `test-non-gui` excludes by name and this job selects from the same
# list).  Drives ct-native-replay + ct-mcr against pinned sibling SHAs of
# codetracer-native-recorder and codetracer-native-backend using real
# clones, real recorder/replay builds, real db-backend and real DAP.
#
# Per metacraft-dev-guidelines/policies/ci-workflow-standards.md the job
# clones/pins its siblings, sets the CT_<NAME>_SIBLING env vars the
# consumer recipe expects, then runs the single canonical
# `just test-mcr-dap-flow` target (which builds ct-mcr / ct-native-replay
# on demand via the siblings' own `just` targets per
# cross-repo-builds.md).  Languages whose compiler is absent on the
# runner honest-SKIP (`SKIPPED:` line) inside the Rust tests rather than
# silently no-op'ing.  Mirrors beam-flow.yml's shape.

on:
  pull_request:
    branches-ignore: [agents]
    paths:
      - 'src/db-backend/**'
      - 'src/backend-manager/**'
      - 'libs/ct-dap-client/**'
      - 'ci/test/non-gui-not-provided.linux.txt'
      - 'ci/lib/not-provided-filter.sh'
      - 'scripts/detect-siblings.sh'
      - 'justfile'
      - '.github/workflows/mcr-dap-flow.yml'
  push:
    # This repo's mainline is `dev` (`stable` is the release branch). The
    # filter previously named `main`, a branch this repo does not have, so
    # no mainline push ever triggered this workflow.
    branches: [dev, stable]
    paths:
      - 'src/db-backend/**'
      - 'src/backend-manager/**'
      - 'libs/ct-dap-client/**'
      - 'ci/test/non-gui-not-provided.linux.txt'
      - 'ci/lib/not-provided-filter.sh'
      - 'scripts/detect-siblings.sh'
      - 'justfile'
      - '.github/workflows/mcr-dap-flow.yml'
  workflow_dispatch:
    inputs:
      native_recorder_ref:
        description: 'codetracer-native-recorder ref (default: the commit flake.lock locks)'
        required: false
        default: ''
      native_backend_ref:
        description: 'codetracer-native-backend ref (default: the commit flake.lock locks)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

# Cancel superseded PR runs only: a new push to a PR makes its previous run
# moot, and stale runs otherwise hold scarce self-hosted runners. Every other
# event (mainline push, merge_group, tag, dispatch, schedule) gets a group
# unique to its run_id, so it is never cancelled and never cancels anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mcr-dap-flow:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Generate CI token
        # Must precede the checkout below, not follow it. `libs/tree-sitter-nim`
        # is a PRIVATE submodule, so a checkout with no `token:` clones it with
        # whatever credential the runner happens to have and fails with
        #
        #   fatal: repository 'https://github.com/metacraft-labs/tree-sitter-nim.git/'
        #     not found
        #   fatal: clone of '...' into submodule path '.../libs/tree-sitter-nim' failed
        #
        # taking every step after it down as `skipped`. beam-flow.yml carries
        # the same note for the same defect; this job kept the original
        # ordering and so kept failing intermittently -- intermittently because
        # a runner with the submodule already in its work tree gets away with
        # it, which is why it survived this long.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout codetracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones the cross-repo siblings adjacent to this checkout at the
        # refs named below, replacing the former
        # Install-Nix / Resolve-sibling-refs / four clone-repo steps.
        #
        # WHY THE OLD RESOLVE STEP HAD TO GO. It read `.github/sibling-pins`,
        # a repo-local pin file that e0c3a1593 deleted from this repo eight
        # weeks ago when every cross-repo CI site was migrated to resolve
        # sibling revisions from the workspace lock instead. This workflow was
        # the one site that migration missed. Since then the step could only
        # ever fail: `grep` on a nonexistent file exits 2, and under
        # `set -euo pipefail` the command substitution takes the whole job
        # down before a single sibling is cloned. It survived unnoticed
        # because the workflow is path-filtered onto db-backend files, so it
        # fires rarely -- the same reason beam-flow.yml's checkout ordering
        # defect survived, noted at that workflow's own token step.
        #
        # Re-adding the pin file is not an option: repo-local pin files are
        # exactly what e0c3a1593 removed, so this now resolves siblings the
        # way every other cross-repo job here does. This mirrors
        # beam-flow.yml, which this workflow's header already says it follows.
        #
        # WHICH REF. `=dev` is spelled explicitly rather than left bare. A
        # bare entry resolves through the per-commit workspace lock in the
        # shared manifests repo, which has published nothing for this repo
        # since 2026-08-02 -- the outage documented at the top of
        # codetracer.yml. Every job that left it bare died in this step.
        # Since reprobuild-specs Unified-Locking-And-Hooks.md §14 a bare
        # entry resolves from this commit's own committed repro.lock
        # instead (no manifests repo), and the `workspace-lock-freshness`
        # job checks that that lock pins every bare-declared sibling; once
        # this sibling is pinned there, dropping the `=dev` suffix restores
        # per-commit pinning here.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          # codetracer-native-recorder: src/db-backend/build.rs canonicalises
          #   ../../../codetracer-native-recorder at compile time, and
          #   ensure-ct-mcr builds ct_cli from it.
          # codetracer-native-backend: ensure-ct-native-replay builds
          #   ct-native-replay from it; ct-native-replay drives the flow
          #   under test.
          # codetracer-trace-format: src/db-backend/Cargo.toml path-deps on
          #   ../../../codetracer-trace-format/...
          # codetracer-trace-format-nim: the second half of a MATCHED FFI
          #   PAIR -- codetracer_trace_writer_nim's build.rs resolves its Nim
          #   entry point as a SIBLING of codetracer-trace-format and
          #   hard-errors when it is absent, so it must be provisioned
          #   wherever codetracer-trace-format is.
          # codetracer-visual-replay: ensure-ct-mcr's `ct_cli` imports
          #   `gfx_stream/ctfs_visual` from it, and the build stops with
          #   "cannot open file: gfx_stream/ctfs_visual" without it. Bare:
          #   clone-siblings resolves it from this commit's repro.lock.
          # codetracer-native-backend: an `/agents` input in flake.nix, so the
          #   fallback is the commit flake.lock and repro.lock lock, not `dev`
          #   (a branch the Nix lane does not build); refresh it with the lock.
          # codetracer-native-recorder: likewise the commit the locks name, so
          #   ct-mcr accepts the `replay-worker --parent-pid` that this
          #   native-backend passes (see setup-db-backend-siblings/action.yml).
          siblings: |
            codetracer-native-recorder=${{ github.event.inputs.native_recorder_ref || '36d280180cdab174082af2ac1649dfeeb45e2560' }}
            codetracer-native-backend=${{ github.event.inputs.native_backend_ref || 'b1e07aabb86536d2c4248cb8fc162381d86350fe' }}
            # codetracer-trace-format{,-nim} BY COMMIT, not `=dev`: the two halves of
            # the FFI pair are `/agents` inputs in flake.nix, and trace-format's `dev`
            # tip (051a298, 2026-09-30) predates the FileTable / PathTableKind API that
            # src/db-backend's ctfs_trace_reader has called since 2026-10-03, so a
            # sibling cloned at `dev` fails to compile. Full account and the refresh
            # rule: .github/actions/setup-db-backend-siblings/action.yml.
            codetracer-trace-format=2624f1e80609307548d9199caed0fd511ca31575
            codetracer-trace-format-nim=df7751a1dabac8bc99c27dd715d1b82723c06c50
            codetracer-visual-replay

      - name: Run MCR DAP flow tests
        # The single canonical target. scripts/detect-siblings.sh (sourced
        # by the dev shell) exports CT_CODETRACER_NATIVE_RECORDER_SIBLING /
        # CT_CODETRACER_NATIVE_BACKEND_SIBLING from the cloned siblings; the
        # ensure-ct-mcr / ensure-ct-native-replay prerequisites then build
        # ct-mcr / ct-native-replay on demand via the siblings' own `just`
        # targets (direnv exec, per cross-repo-builds.md) before the tests
        # run.
        #
        # Graceful skipping OFF: codetracer's dev shell carries every compiler
        # these tests use (gnatmake, ldc2, gfortran, go, fpc, gcc/clang, nim,
        # rustc), so a missing one is a failure here, not a skip that passes.
        #
        # The recipe then runs the backend-manager tests the non-gui list
        # assigns to this job (selected with `not-provided-filter.sh --lane
        # mcr-dap-flow`). Like the db-backend MCR tests, they record with
        # `ct-mcr record`, which refuses a host without CPUID faulting, and
        # they fail rather than skip on a missing prerequisite.
        env:
          CODETRACER_ALLOW_GRACEFUL_TEST_SKIPPING: "false"
        run: |
          set -euo pipefail
          mkdir -p test-logs
          nix develop '.?submodules=1' --command \
            just test-mcr-dap-flow 2>&1 | tee test-logs/mcr-dap-flow.log

      - name: Upload MCR DAP flow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcr-dap-flow-logs
          path: test-logs/
          retention-days: 14
          if-no-files-found: ignore
