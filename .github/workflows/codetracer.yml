          # the tens of thousands of regular files one at a time. `"$d"/*/` also matches
          # symlinks TO directories; those are skipped, because following them leaves the
          # work directory (these checkouts link into /nix/store) and a store path is not
          # ours to chmod.
          scan() {
            local d="$1" e p
            for e in "$d"/*/; do
              p="${e%/}"
              # `[ -L "$p" ] && continue` would be shorter and WRONG: GitHub runs `run:`
              # blocks under `bash -e`, where a bare `A && B` list that evaluates false is
              # a fatal command. Every branch here is a condition, never a bare list.
              if [ -L "$p" ]; then
                continue
              fi
              if [ ! -r "$p" ] || [ ! -x "$p" ]; then
                ro_blind=$((ro_blind + 1))
                continue
              fi
              if [ ! -w "$p" ]; then
                ro_count=$((ro_count + 1))
                if [ "$ro_shown" -lt 10 ]; then
                  ro_shown=$((ro_shown + 1))
                  echo "ro-sweep:   unwritable $p"
                fi
              fi
              scan "$p"
            done
            return 0
          }
          scan "$root"
          before="$ro_count"
          echo "ro-sweep: found $before unwritable directory(ies) under $root ($ro_blind unreadable)"
          if [ "$before" -eq 0 ]; then
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          # Prove the tool exists before claiming it worked: a `chmod` that is not on
          # PATH exits 127, and a `|| true` would turn that into a silent pass.
          chmod_bin="$(command -v chmod 2>/dev/null || true)"
          if [ -z "$chmod_bin" ]; then
            for candidate in /bin/chmod /usr/bin/chmod /run/current-system/sw/bin/chmod; do
              if [ -x "$candidate" ]; then
                chmod_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chmod_bin" ]; then
            echo "ro-sweep: FATAL no chmod on PATH and none at /bin/chmod;" \
              "$before directory(ies) CANNOT be fixed" >&2
            exit 1
          fi
          echo "ro-sweep: using $chmod_bin"
          "$chmod_bin" -R u+w "$root" 2>/dev/null || true
          ro_count=0
          ro_shown=0
          ro_blind=0
          scan "$root"
          after="$ro_count"
          echo "ro-sweep: after chmod -R u+w: $after unwritable directory(ies) remain"
          echo "ro-sweep: RESTORED owner-write on $((before - after)) directory(ies)"
          if [ "$after" -ne 0 ]; then
            echo "ro-sweep: WARNING $after directory(ies) are not owned by the runner user;" \
              "checkout will still fail to clean them"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # MODE 1 of the self-hosted checkout outage. A stale, owner-scoped
        # `http.https://github.com/metacraft-labs/.extraHeader` left in the
        # runner's reused `~/.gitconfig` OUTRANKS the fresh broader header
        # actions/checkout installs (git matches `http.<url>.*` by longest URL
        # prefix), so checkout authenticates with a dead token, GitHub answers
        # 401, and git dies on `could not read Username`. checkout COPIES
        # `$HOME/.gitconfig` into its temp HOME, so this file is live during the
        # failing fetch. Full rationale, the reproduction, and why this targets
        # the file by path rather than via `--global`: see the copy of this step
        # in the `test-non-gui` job.
        run: |
          set -uo pipefail
          cfg="$HOME/.gitconfig"
          echo "cred-evict: runner=${RUNNER_NAME:-?} home=$HOME"
          if [ ! -f "$cfg" ]; then
            echo "cred-evict: removed 0 (no $cfg on this runner - nothing reusable to poison)"
            exit 0
          fi
          echo "cred-evict: inspecting $cfg"
          removed=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            case "$key" in
              http.*.extraheader|http.*.extraHeader) ;;
              url.*x-access-token*) ;;
              *) continue ;;
            esac
            echo "cred-evict:   removing '$key' (value withheld)"
            git config --file "$cfg" --unset-all "$key" 2>/dev/null || true
            git config --file "$cfg" --remove-section "${key%.*}" 2>/dev/null || true
            removed=$((removed + 1))
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          # Recount in PURE BASH. `grep` and `sed` are NOT on PATH in a raw
          # `run:` step on these nix-darwin runners -- the first version of
          # this step used `grep -ciE` here, grep exited 127, `|| true`
          # swallowed it, and the step printed "removed 1 key(s);  still
          # present" with an EMPTY count. That is precisely the failure this
          # step is supposed to be immune to: a verification that silently
          # verifies nothing and still reads like a pass. No external
          # commands in the check.
          left=0
          while IFS= read -r k; do
            case "$k" in
              *extraheader*|*extraHeader*|*x-access-token*) left=$((left + 1)) ;;
            esac
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          echo "cred-evict: removed $removed credential-bearing key(s); $left still present"
          if [ "$removed" -eq 0 ]; then
            echo "cred-evict: NOTHING FOUND - this host was already clean, mode 1 did not apply here"
          fi
          if [ "$left" -ne 0 ]; then
            echo "cred-evict: WARNING $left credential-shaped key(s) SURVIVED the sweep"
          fi
          echo "cred-evict: keys remaining in $cfg:"
          while IFS= read -r k; do echo "  $k"; done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Run routed materialized origin-DAP matrix
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CT_TEST_LANGS: all
        run: nix develop . --command just test-origin-dap

  # M29 cross-process value-origin envelope. Drives the 2-trace + 3-trace
  # DAP suites and the gated 3-trace Playwright specs through the single
  # `just test-cross-process` entrypoint canonicalised in
  # `Cross-Process-Origin-E2E-Test-Design.md` §6.
  #
  # The committed three-trace fixture and both GUI specs are required. The
  # envelope rejects missing prerequisites, ignored/skipped tests, count
  # drift, and any Playwright skip result.
  cross-process-linux:
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    name: cross-process value-origin (Linux)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # `Setup db-backend siblings` above carries `env-flavor: nix`, so Nix
        # is already installed when this runs -- which it must be, because the
        # action reaches `repro` through this repo's own dev shell.
        uses: ./.github/actions/provision-repro-lock-siblings

      - name: Clone runquota sibling
        # `just build-once` below compiles `ct`, and src/ct/codetracer.nim ->
        # ../ct_test/ct_test -> src/ct_test/process_exec.nim opens with
        # `import runquota_process`. On the tup driver this checkout is the only
        # source of those modules: src/Tuprules.tup's NIM_REPO_PATH_FLAGS names
        # `$(ROOT)/../runquota/...`, and tup's environment allowlist in that
        # same file omits RUNQUOTA_SRC, so the dev shell export cannot stand in
        # for it. Cloned here rather than via the two composite actions above
        # because neither owns this dependency (issue #641).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Build frontend (needed by gated Playwright stage)
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: nix develop .#devShells.x86_64-linux.default --command just build-once

      - name: One bundle, one definition per name
        # A JS bundle is one script scope, so two top-level `function foo`
        # declarations are not an error -- the last silently wins and the
        # first one's callers run the wrong body. Two defects here were
        # exactly that: `--hotCodeReloading` collided a generic's anonymous
        # closures across modules until the editor stopped mounting, and two
        # `{.exportc.}` procs named `debugRepl` left the service one
        # unreachable in every build while throwing nothing.
        #
        # Placed immediately after the step that produces the bundles,
        # because it checks that step's output. Carries the same shape as
        # the other guards here: counted assertions with the count itself
        # asserted -- a bundle yielding zero top-level functions, or an
        # expected bundle never checked, fails rather than scoring zero, so
        # it cannot pass by matching nothing.
        run: nix develop .#devShells.x86_64-linux.default --command just test-js-bundle-name-uniqueness

      - name: Run cross-process envelope
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CT_CROSS_PROCESS_REQUIRED: "1"
        run: nix develop .#devShells.x86_64-linux.default --command just test-cross-process

  viewmodel-tests:
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    name: ViewModel headless tests (native + JS)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-trace-format-nim sibling
        # Nine ViewModel suites -- the eight request-panel ones plus
        # request_span_conformance_test -- ``import codetracer_ctfs/container``
        # to read a real CTFS container. ``config.nims`` resolves that module
        # from ``$CODETRACER_TRACE_FORMAT_NIM_SRC`` or from the workspace
        # sibling ``../codetracer-trace-format-nim/src``, and this job set up
        # neither, so all nine failed to compile with
        #
        #   Error: cannot open file: codetracer_ctfs/container
        #
        # in every run (30726348404, 31180327493, 31385899773). They compile
        # and pass in a normal workspace, which is why the gap survived: the
        # only environment that lacked the sibling was the one nobody was
        # reading. Cloned here with ``clone-repo``, the same way this job
        # already gets ``codetracer-js-recorder``, rather than through
        # ``setup-dev-env`` -- that route additionally requires a published
        # workspace lock, which is a separate unresolved problem and
        # would make this job depend on it for no benefit.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-trace-format-nim
          # That repo's default branch is `dev` (confirmed against the API);
          # `main` is not where its work lands.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format-nim
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # The ViewModel suites compile against ``../isonim/src`` et al. via
        # codetracer's top-level ``config.nims``. After ``Install Nix``, not
        # before it: the action reaches ``repro`` through this repo's dev
        # shell, which is also where the suites below run.
        uses: ./.github/actions/provision-repro-lock-siblings

      - name: Assert the JS ViewModel lane can observe its own failures (full suite)
        # The same contract suite `ci-verdict` runs, but here it runs INSIDE the
        # dev shell, where `nim` and `node` exist. That difference is the whole
        # point of this step.
        #
        # `ci-verdict` sits on stock ubuntu-latest, so its copy takes the skip
        # branch for the three dynamic contracts -- the ones that compile a
        # deliberately-failing suite with and without `-d:nodejs` and compare
        # node's exit code. Those three are the only thing standing between
        # "the recipe contains the string -d:nodejs" and "-d:nodejs actually
        # makes a failing suite fail", and for a day they ran nowhere at all.
        #
        # It runs BEFORE `test-vm` below on purpose: if the lane has lost the
        # ability to report failures, that is worth knowing before reading the
        # lane's report.
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/test/vm-js-lane-test.sh

      - name: Assert a crashed test binary cannot be reported as a partial run
        # ci/lib/test-lane-report.sh is the shared verdict all six
        # compile-and-run lanes report through. Its contract suite feeds it
        # fixture processes that print plausible `[OK]` lines and then die by
        # signal, and fails if the exit status is ever scored behind the
        # [OK]/[FAILED] tally again.
        #
        # That ordering is not hypothetical: `isonim_views_test` SEGV-ed at
        # case 216 of 461 and the lane printed `PARTIAL (212 OK, 4 FAILED)`,
        # which is indistinguishable from an ordinary partial run. 245 cases
        # went unrun for as long as nobody read the exit code.
        #
        # Pure bash, no toolchain, sub-second -- so like the step above it runs
        # BEFORE `test-vm`: if the lane cannot report a crash, that is worth
        # knowing before reading the lane's report.
        run: bash ci/test/test-lane-report-test.sh

      - name: Assert the style-variable guard can observe its own failures
        # Same reasoning as the two steps above, for a guard whose entire
        # claim is that it sees something no human and no compiler sees. Its
        # eleven arms feed it defects it must report and legal CSS it must
        # not, and include the two instrument checks that stop an empty
        # stylesheet or an unreadable Tupfile scoring as a pass — which is not
        # hypothetical, `default_white_theme.styl` compiles to zero bytes.
        #
        # Hermetic and sub-second on synthetic fixtures, so it runs BEFORE the
        # guard itself: if the guard has lost the ability to report, that is
        # worth knowing before reading its verdict.
        run: bash ci/test/css-token-resolution-test.sh

      - name: Every style variable in every shipped stylesheet resolves
        # Stylus emits an unresolved identifier verbatim rather than failing,
        # so `color: colors-ui-text-accent` compiles clean and reaches the
        # browser as an invalid value the browser drops. Three shipped
        # defects have had that cause and all three were found by a person
        # looking at the screen.
        #
        # In the dev shell because it compiles the shipped stylesheets with
        # `stylus` and reads the OUTPUT — the failure mode is source and
        # output disagreeing silently, so the source is the wrong thing to
        # read.
        run: nix develop .#devShells.x86_64-linux.default --command just test-css-token-resolution

      - name: Enforce the platform facade's host-free build (NS1)
        # Noir-Studio.milestones.org NS1: "A build configuration that **does
        # not link the host modules**, so a direct call fails to compile" and
        # "That configuration runs in CI, so the property cannot decay
        # quietly." This step is the second half of that sentence.
        #
        # It runs BEFORE `test-vm` deliberately. A `readFile` that has crept
        # into a ViewModel does not fail any suite — the desktop build links
        # `std/os` and the call works — so the only signal that the facade has
        # been bypassed is this gate. Reading it after a green suite would be
        # reading it too late.
        run: nix develop .#devShells.x86_64-linux.default --command just test-hostfree

      - name: Compile the platform facade's host instantiations
        # Noir-Studio.milestones.org NS2. The sibling of the gate above, and
        # for a hole the gate above cannot see: `test-hostfree` proves that
        # front-end code does not REACH the host, and this proves that the two
        # modules whose whole job is reaching the host still BUILD.
        #
        # Nothing compiled them. `host/web_browser.nim` and
        # `host/desktop_electron.nim` are `{.error.}` on the C backend so
        # `test-vm` cannot, and no JS suite imports either, because
        # `platform/web_platform.nim` was built to need neither. Both facts are
        # correct; together they left these two uncompiled by any lane, and
        # `web_browser.nim` duly reached `dev` in a state that does not compile
        # at all while every suite stayed green.
        #
        # Placed before `test-vm` for the same reason `test-hostfree` is: this
        # takes seconds and answers "does it build for anyone", which is not
        # worth learning after twenty minutes of suites.
        run: nix develop .#devShells.x86_64-linux.default --command just test-host-instantiations

      - name: Build and boot the web bundle
        # NS2's second build. The lane above proves the web instantiation's
        # modules compile; this proves they LINK into a bundle that contains no
        # node module loader and that `boot()` actually completes — the
        # sequence §4.2 and §4.5 specify, which until now nothing executed
        # because nothing called it.
        #
        # Runs under node rather than a browser deliberately: with no OPFS the
        # boot takes the in-memory path, which is a real product state (a user
        # with storage disabled) and is asserted to announce the coming loss
        # before editing is possible.
        run: nix develop .#devShells.x86_64-linux.default --command just test-web-bundle

      - name: Compile the renderer for a browser (both arms)
        # THE THING NOTHING IN CI COMPILED. The two steps above cover the web
        # instantiation's modules and its bundle; neither touches the renderer,
        # and until now nothing else did either. `ci/lib/test-lane-files.sh`
        # recorded why: every JS lane passes `-d:nodejs`, and the renderer does
        # not compile under it — `kdom`'s `createElementNS` is a browser
        # binding. The only gate was the tup product build, at package time.
        #
        # `dev` duly carried a renderer entry point that did not compile.
        # Commit 333ec709 removed `ui_imports`' `electron_lib` re-export after
        # auditing its symbols for uses "anywhere under `ui/`"; `ui_js.nim` is
        # not under `ui/` and read `inElectron` from it. Every suite stayed
        # green — the `web_browser.nim` shape again, one directory over.
        #
        # This step runs both arms on the `js-browser` backend (`nim js`, no
        # `-d:nodejs`, compile-only) and then the property gate, which proves
        # the arms are genuinely different builds and that the web one links no
        # Electron. It needs the isonim tailwind placeholder this job's
        # `provision-repro-lock-siblings` step already seeds.
        #
        # Before `test-vm` for the same reason the two steps above are: it
        # answers "does the product's front end build at all", which nobody
        # wants to learn after twenty minutes of suites.
        run: nix develop .#devShells.x86_64-linux.default --command just test-renderer-browser

      - name: Compile the renderer the way a developer builds it
        # THE STEP ABOVE COMPILES WHAT SHIPS, AND THAT IS NOT WHAT ANYONE TYPES.
        # `just build-ui-js` adds `-d:ctInExtension` and
        # `--hotCodeReloading:on`; nothing ran it, and `cloud` carried it broken
        # two ways at once — an internal Nim JS codegen error in `ui/trace.nim`
        # (an `{.exportc.}` routine generated at its own line, reaching a `var`
        # declared 800 lines later) and an identifier M49 added to only one of
        # dap.nim's two arms. Both are compile errors; the whole check takes
        # about ten seconds.
        #
        # It asserts the BYTES — over 1 MB, `node --check` parses them, and four
        # symbols that vanish under the wrong configuration — not the recipe's
        # exit status, and it re-reads `justfile` so the gate cannot be made
        # green by deleting the defines that make the build hard.
        run: nix develop .#devShells.x86_64-linux.default --command just test-renderer-extension-build

      - name: Assemble the web bundle's runtime assets (NS3 delivery)
        # NS3 was never short of a LOADER. `host/web_browser.nim` carries the
        # registry, the worker transport and `newBrowserWasmHost`, all tested,
        # and its own doc comment says nothing calls them because "the worker
        # script that instantiates the Noir modules ... is not in the bundle".
        # The gap was delivery, and this step is what closes it: the renderer
        # (newly buildable, see the step above), the web entry point and the
        # browser worker script are assembled and checked.
        #
        # The asset list is NOT in the shell script. `webRuntimeAssets()` in
        # `platform/web_deployment.nim` is the one declaration, compiled on both
        # backends and asserted by `test_platform_web.nim`; the gate reads it
        # through a small Nim program so a third hand-written copy cannot drift.
        #
        # The two Noir wasm modules are ~16 MB and ~4.6 MB and are not in the
        # repo, so their placement SKIPS LOUDLY here — printing the deployment
        # consequence the manifest declares for each — rather than passing
        # silently. Everything else is assembled and asserted.
        run: nix develop .#devShells.x86_64-linux.default --command just test-web-bundle-assets

      - name: The web bundle mounts a product
        # THE CHECK THIS REPOSITORY DID NOT HAVE, and the reason a blank page
        # reached production with a green pipeline.
        #
        # Every gate above asserts a STEP: the renderer compiled, the manifest
        # named it, the assembly placed it, the guard matched the document to
        # the tree, the loop arm booted. All five were true of
        # `ide.codetracer.com` on 2026-08-31, which served a boot diagnostic
        # and an empty `#dom-root` and nothing else. `ui.js` was throwing
        # `ReferenceError: monaco is not defined` during module init and no
        # check in the repository was listening for an uncaught exception.
        #
        # Verification-Harness-Traps.md trap 2 names the shape — "a chain of
        # `success: true` is not a result; assert the artefact" — and the
        # artefact is a DOM. This step loads the assembled bundle in headless
        # Chromium and asserts what a user would see.
        #
        # It carries its own mutation proof: three arms beside the control,
        # each verified to redden the assertion written for it, and a counted
        # assertion total so an arm that silently did not run is a failure
        # rather than a shorter green summary.
        #
        # Placed here, immediately after the assembly step, so the two read the
        # same bundle and a delivery regression and a rendering regression are
        # attributable to different steps.
        run: nix develop .#devShells.x86_64-linux.default --command just test-web-renderer-mounts

      - name: A test row's two controls, and only one of them re-runs
        # The TESTS pane's per-row ⟳ and ⏵, driven in a real browser.
        #
        # The step above asserts that the product MOUNTS. This asserts that one
        # of its controls does the specific thing it promises and not the
        # neighbouring thing that looks identical from outside: ⏵ must ENTER the
        # recording a row already has, executing nothing, where ⟳ and ⇧⏵ must
        # produce a new one. "The pane has buttons" cannot fail for its own
        # reason; "pressing ⏵ left the recording's id and timestamp unchanged"
        # can fail for exactly one.
        #
        # WHAT THIS LANE CAN AND CANNOT MEASURE, stated because a green here is
        # not the whole gate. The Noir compiler and the replay engine are
        # OPTIONAL bundle assets and this job does not build them, so no
        # recording can be made and the id/clock discriminator has nothing to
        # move. The gate detects that from the pane's own words and SKIPS those
        # arms loudly rather than reddening — a permanently red lane stops being
        # read, which is the failure `shell-gate-coverage.known-dark.txt` exists
        # to prevent.
        #
        # What it does assert here is real and was previously unasserted: both
        # controls exist on every row, are painted with a non-zero box, are
        # never labelled "open the recording" when there is none, do not claim
        # Shift changed something on a row where it changed nothing, and — in
        # exactly this configuration and no other — that a control disabled
        # because the deployment cannot compile STATES THAT REASON instead of
        # rendering inert.
        #
        # The recording arms run in `deploy-web-codetracer.yml`, which builds
        # the wasm modules and the replay engine and therefore can perform the
        # three gestures. That step is where the deciding assertion lives.
        #
        # Placed immediately after the mount step so the two read the same
        # bundle and a rendering regression and a behavioural one are
        # attributable to different steps.
        run: nix develop .#devShells.x86_64-linux.default --command just test-tests-pane-row-controls

      - name: A Low Level Code row click, on the render arm the bundle ships
        # THE DIVERGENT-ARMS HAZARD, closed for one gesture.
        #
        # `isonim_low_level_code_view.nim` has TWO row renderers. The headless
        # ViewModel suites above drive `renderInstructionRowMock`, which binds
        # `onclick = handler`; the shipped bundle renders
        # `renderInstructionRowWeb`, which binds through
        # `isonim_dom.addEventListener`. They are different procs reaching the
        # same closure, so every suite in this job can be green against a
        # binding no user ever touches — the same shape as a lane compiled with
        # a different define than the bundle that ships.
        #
        # `ci/test/low_level_code_row_click_probe.mjs` clicks the row's CENTRE
        # in real Chromium, with a real hit test (Playwright refuses the click
        # if another element would receive it), and asserts the COMMAND, the
        # PATH and the LINE the click put on the wire. The line is the
        # discriminator: the target row is line 43 where row 1 is 42 and the
        # active row is a third offset, so the payload can only have come from
        # the row actually clicked.
        #
        # WHY IT IS ONLY BEING RUN NOW. It was never blocked. Its only mention
        # anywhere in the tree was a COMMENT in `ci/test/web-bundle-assets.sh`
        # describing, in the present tense, what it "can assert" — and
        # `shell-gate-coverage.known-dark.txt` recorded it among the three
        # gates nothing referenced. It needs `storybook/dist/components.js` and
        # a Playwright Chromium, both of which this job already has; it needed
        # the recipe and this step.
        #
        # NO SKIP ARMS. Unlike the two steps above, every input is built from
        # source in the same invocation, so all ten checks are load-bearing on
        # every run and a shorter green summary is a failure rather than a
        # smaller measurement. The probe also carries a staleness gate on
        # CONTENT (not mtime — `nim js` does not rewrite a byte-identical
        # output, so an mtime gate goes permanently red): it compares the
        # command `low_level_code_vm.nim` currently sends against the bundle's
        # bytes and exits 2 rather than reporting on a tree nobody edited.
        #
        # Measured locally at 10/10, and proved able to fail BOTH ways: sending
        # `highLevelLine - 1` reddened exactly the line assertion, naming
        # `{"path":"src/combat.nr","line":42}`; renaming the command without
        # rebuilding tripped the staleness gate with exit 2.
        #
        # Seconds: ~2s for the `nim js` and ~5s for the browser leg.
        run: nix develop .#devShells.x86_64-linux.default --command just test-low-level-code-row-click

      - name: One layout per mode, and it survives a reload
        # THE SECOND OF THE THREE GATES NOTHING REFERENCED, and the one whose
        # description in `shell-gate-coverage.known-dark.txt` was half wrong in
        # the useful direction: `ci/test/mode_layout_probe.mjs` DOES measure
        # rendered `.lm_title` geometry — the exact quantity that went to zero
        # in the defect it covers — at its lines 96-116 and 338-343. It was
        # pointed at the right thing and had simply never been run.
        #
        # It could not be wired as it stood, because it is an INSTRUMENT and not
        # a gate: eleven legs of measurement written to a JSON report, and exit
        # 0 whether it measured everything or timed out on its first selector.
        # `ci/test/mode-layout-in-browser.sh` is the missing half — it assembles
        # a bundle, serves it, drives the probe at the `/noir` route, and counts
        # seventeen assertions over what came back.
        #
        # WHY THE MODEL TEST DOES NOT COVER THIS.
        # `src/tests/gui/tests/layout/mode_layout_test.nim` exercises the layout
        # MODEL — the per-mode tables and the placement engine. Every assertion
        # in it can hold of a product whose workspace looks wrong, because a
        # layout config is not a workspace: GoldenLayout still has to accept it,
        # build the stacks and give each pane a box. So nothing here reads a
        # config. It asks whether a mode switch CHANGES the strips (it did not,
        # before this work — the previous mode's arrangement was carried
        # across), whether TESTS and CONSTRAINTS are tabs OF the stacks the
        # request named, whether the third round trip reproduces the first
        # (`Mode-Transitions.md` §6: the failure mode is a slot that is right
        # once and empty afterwards), whether a splitter drag SURVIVES A RELOAD,
        # and whether a layout store filled with rubbish degrades to a populated
        # workspace rather than an empty window.
        #
        # ONE ARM SKIPS HERE, AND THE SKIP IS COUNTED SEPARATELY FROM THE
        # PASSES. This job builds no replay engine and no Noir toolchain, so
        # debug mode reaches no session and opens no source file, and the
        # debug-mode editor has nothing to be. Measured: 1600x0 with zero
        # `.view-line`s. Asserting "the editor is never empty" there would be a
        # permanently red lane on a correct product. The gate reads the absence
        # from the product itself — the edit legs carry a source tab, the debug
        # legs carry none — and says UNMEASURED.
        #
        # THAT BRANCH WAS VERIFIED IN BOTH DIRECTIONS WITH SYNTHETIC INPUT
        # (`CT_MODE_LAYOUT_REPORT` reads a report the script did not produce): a
        # report whose debug legs carry a source tab AND a 1600x0 editor makes
        # the arm RUN and FAIL, naming the box; the same report with a painted
        # editor makes it RUN and PASS. 17 checks + 1 skip becomes 18 checks.
        #
        # PROVED ABLE TO FAIL AGAINST THE REAL PRODUCT before landing: caption
        # `TestResults` back to `TEST RESULTS` in `ui/layout.nim`'s
        # `convertTabTitle` and rebuild, and two named assertions redden — "no
        # TESTS tab at all" in both modes, and "the old caption TEST RESULTS is
        # on screen in" all eleven legs. Exit 1.
        #
        # NOT WIRED INTO THE DEPLOY LANE HERE, deliberately. That lane's
        # `studio-bundle/` has the engine and the toolchain, so the skipped arm
        # would run there — but whether it PASSES there has not been measured,
        # and wiring a step on the strength of an expectation is how a lane
        # becomes permanently red. That step belongs to whoever runs it first.
        #
        # ~80s to assemble the bundle, ~20s in the browser.
        run: nix develop .#devShells.x86_64-linux.default --command just test-mode-layout-in-browser

      - name: A typed watch expression, in a browser, showing a correct value
        # The STATE pane's Watches tab, opened by a click on the product's own
        # tab button and filled by keystrokes into its own `#watch-0`.
        #
        # The two steps above assert that the product mounts and that a control
        # does what it promises. This asserts the third thing neither can: that
        # a pane a user must NAVIGATE TO is navigable. Every headless suite over
        # this pane drove the MockRenderer, whose tab strip the WebRenderer — the
        # one browsers run — did not have; `stWatches` was reachable from
        # `vm.selectTab` and from no gesture in any shipping product, and every
        # one of those suites was green over it. A probe that switches tabs by
        # calling the ViewModel cannot fail for that reason, so this one does not
        # call it.
        #
        # WHY IT CAN RUN HERE, unlike its two neighbours. There is no engine on
        # this page and it needs none: the rows come from
        # `ci/test/watch-expressions-probe/backend-response.json`, which is the
        # `ct/load-locals` body captured verbatim from
        # `watch_expressions_dap_test.rs` under `CT_WRITE_WATCH_FIXTURE`, and
        # they enter through the product's own `applyLocalsResponse`. So the
        # Noir compiler, the tracer and the replay engine — the OPTIONAL bundle
        # assets that force the row-controls gate to skip its recording arms
        # here — are not on this gate's path at all. Its dependencies are `nim
        # js`, stylus and Chromium, and this lane already proves it has all
        # three: `test-css-token-resolution` compiles the stylesheets above and
        # `test-web-renderer-mounts` drives Playwright's Chromium. Measured on
        # this branch before it was wired: 24 of 24, no skips.
        #
        # It EXITS 2 when any of those three is missing rather than passing, and
        # in THIS lane that must be red: a shell that has stopped providing
        # Chromium is a lane defect, not an absent optional capability, and the
        # loud-skip branch exists for developer machines outside the dev shell.
        #
        # The transport half is `watch_expressions_dap_test.rs`'s and stays
        # there; because this page renders that suite's own captured body, the
        # two cannot drift apart without it noticing.
        #
        # Placed immediately after the two browser steps so all three read the
        # same bundle and a mount, a behaviour and a navigation regression are
        # attributable to different steps.
        run: nix develop .#devShells.x86_64-linux.default --command just test-watch-expressions-in-browser

      - name: A recorded value reaches the State pane and is shown as the value it is
        # The sibling of the step above, and it runs here for the same reasons:
        # same captured `ct/load-locals` body, same three dependencies (`nim
        # js`, stylus, Chromium), no engine on the page and none needed.
        #
        # WHAT IT ADDS THAT THE STEP ABOVE CANNOT SEE. That gate's probe builds
        # its rows BY HAND out of the wire's JSON, so it reported the refusal's
        # `msg` correctly while the product's own mapping turned the same row
        # into the bare word "Error" — 24 green checks over a string the pane
        # does not paint. This probe calls `ui/state.nim:localsToStoreRows`,
        # the product's mapping, precisely so a wrong mapping is visible.
        #
        # It carries two mutation arms, each reproducing one half of the
        # pre-fix product in the harness and reddening only its own half:
        # arm V fills the value cell with `$v` (a four-line dump for a
        # sequence, "<error>" for a record, "Error" for a refusal), arm O
        # removes the tracker reset (the pane never asks and sits on
        # "Loading..."). Measured on this branch before it was wired: 32 of
        # 32, no skips.
        #
        # Like its neighbour it EXITS 2 when a dependency is missing, and in
        # THIS lane that must be red: a shell that has stopped providing
        # Chromium is a lane defect, not an absent optional capability.
        run: nix develop .#devShells.x86_64-linux.default --command just test-state-values-in-browser

      - name: A registered known failure signals when it goes green
        # The ledger `just test-vm` now consults, gated in both directions.
        #
        # Making `MockBackendService` strict turned eleven silently-wrong
        # dispatches into honest reds, and there was nowhere to put them: this
        # repo had no known-failure mechanism at all — no registry, no
        # annotation, no allow-list — so "registered as a known failure" meant a
        # row in a Markdown table and `just test-vm` exited 1 on every push. A
        # permanently red suite is one nobody reads, which is the condition
        # underneath this campaign's worst findings.
        #
        # A suppression mechanism observed only suppressing is
        # indistinguishable from one that suppresses everything, so this asserts
        # the other direction too: a registered test that starts PASSING reddens
        # the lane by name, and one failing for an UNREGISTERED reason is not
        # absorbed. Eight arms, counted, with the count asserted.
        #
        # Before `just test-vm` deliberately, so a broken ledger is reported as
        # a broken ledger rather than as whatever the lane does when it reads
        # one.
        run: nix develop .#devShells.x86_64-linux.default --command just test-known-failures

      - name: One press, one action; one pane id, one node
        # Two latent defects that were doing no harm by luck. The pane half is
        # a fixed duplicate-id fall-through in `ui/layout.nim`, with an arm
        # that reddens on the pre-fix bundle. The chord half is a standing
        # hazard: every whitelisted chord is bound twice onto the same action,
        # and only Monaco's `stopPropagation` keeps the two paths from both
        # delivering — so a chord Monaco also binds natively doubles, as
        # ALT+F8 was measured doing.
        #
        # Placed beside the mounts gate so both read the same assembled
        # bundle, and carrying the same shape: counted assertions with the
        # count asserted, a control arm, and an instrument arm that plants a
        # real duplicate so "exactly one" cannot pass vacuously.
        run: nix develop .#devShells.x86_64-linux.default --command just test-chord-and-pane-uniqueness

      - name: A submenu you can click, a bar that does not flicker, one menu on right-click
        # Three defects one user reported against the deployed site on
        # 2026-09-02, and the reason none of them was caught here: every
        # existing check asserts markup or a model, and all three defects are
        # invisible to both.
        #
        # The submenus were in the DOM with the right rows at the right
        # coordinates, clipped out of existence by an `overflow: hidden` the
        # `dropdown-surface()` mixin carried onto `#menu-main` at 09bc09b7; the
        # same mixin's reveal animation replayed from `opacity: 0` on every
        # rebuild of the shell, which is the flicker. So this gate hit-tests the
        # submenu row at its own painted centre and samples the menu's opacity
        # every animation frame — a screenshot before and after the sweep shows
        # a good menu both times.
        #
        # The context-menu half reads `defaultPrevented` from a document-level
        # bubble listener, because the native menu is browser chrome and is
        # suppressed under automation in every engine, so "two menus" cannot be
        # counted directly and the gate declines to pretend otherwise.
        #
        # Placed beside the other two browser gates so all three read the same
        # assembled bundle, and carrying the same shape: counted assertions with
        # the count asserted, and five mutation arms each verified to redden
        # exactly its own check.
        run: nix develop .#devShells.x86_64-linux.default --command just test-menu-and-context-menu

      - name: Editor context menu is the mode's
        # The CONTENT of the editor's right-click menu, entry by entry, per
        # mode. The gate above asserts that exactly one menu appears and that
        # its hint row is inert -- and passes unchanged on a menu whose whole
        # content is replay commands offered in Edit mode, which is what was
        # reported against noirstudio.dev. It never reads an entry name.
        #
        # So this one names each entry and asserts both directions: the
        # commands of the mode are present, and the commands of the other mode
        # are ABSENT rather than greyed out. "The menu differs between the
        # modes" cannot fail for its own reason and is not what is asked.
        #
        # Placed beside the other browser gates so all of them read the same
        # assembled bundle. The Debug half is NOT measured here and the gate
        # says so in its result rather than passing over it: switching /noir to
        # Debug mode currently leaves the workspace with no editor pane, so
        # there is nothing to right-click. That half is asserted on the desktop
        # by src/tests/gui/tests/editor/editor_context_menu_is_mode_dependent.spec.ts.
        run: nix develop .#devShells.x86_64-linux.default --command just test-editor-context-menu-modes

      - name: Renderer host-reach budget (NS1 residual 1)
        # The migration that stands between the web bundle and a rendered pane,
        # as a ratchet rather than a plan. Fails when a module gains a host
        # call, and equally when one loses a host call without the budget being
        # lowered — an unrecorded migration is one that can be silently undone.
        run: nix develop .#devShells.x86_64-linux.default --command just test-renderer-host-budget

      - name: Renderer pane parity (NS2's second half)
        # "A pane added to one platform appears in the other" — the half of
        # `test_one_codebase_two_platforms` that had no gate, because comparing
        # two pane sets needs two bundles and until this week there was one.
        # The registry is read from `makeComponent`, presence is measured in the
        # two BUILT bundles, and the kinds are a budget that fails both ways: a
        # new pane nobody decided about, and a budget entry the product no
        # longer dispatches.
        run: nix develop .#devShells.x86_64-linux.default --command just test-renderer-pane-parity

      - name: Identity layer — credentials, escape hatch, WebCrypto seam, mutation proofs (ID1/ID2)
        # `viewmodel/identity/token.nim` is the verification library ID1 asks
        # every product to link, and `test_identity_token.nim` runs in
        # `vm-unit` and `vm-unit-js` by the directory glob — this step is the
        # evidence that its ten cases can go red: seventeen mutations, each
        # verified to redden the case written for it.
        #
        # M17 is why it runs here rather than on one backend. It narrows the
        # JSON guard to `except CatchableError` and requires the C backend to
        # stay GREEN while the JS backend goes RED — CONTRIBUTING.md's
        # portability rule, as a check. Both backends are needed for that arm
        # to prove anything, so this step must never be reduced to one.
        #
        # Also runs `identity-no-escape-hatch.sh`, ID2's hard requirement: the
        # licensing binding ships `CT_LICENSE_DEV_NO_FFI`, a RUNTIME env var
        # that disables enforcement entirely. Survivable for a licence; for an
        # identity token it is an authentication bypass, so its absence is
        # asserted rather than left to habit — with two positive controls, one
        # synthetic and one over the real binding that has the hatch.
        #
        # And `identity-desktop-no-credential.sh`, ID2's
        # `test_desktop_never_handles_a_credential`. Its verification asks for
        # "a build-time surface check asserting no credential field exists in
        # the application", and that sentence is false as written: 50 files
        # hold a credential-shaped field, none of them ours — a replayed
        # program's sudo prompt, an LLM provider key, a share-artifact
        # passphrase. So the check is that every one is CLASSIFIED and none is
        # an identity credential, with the classification written down rather
        # than implied by which words a pattern happens to match.
        #
        # And `identity-webcrypto.sh`, which drives the browser signature seam
        # under Node against REAL Ed25519. That path cannot be a `vm-unit-js`
        # suite: `crypto.subtle` is a V8 microtask and `drainPlatformCallbacks`
        # drains nim-everywhere's queue, not V8's.
        run: nix develop .#devShells.x86_64-linux.default --command just test-identity

      - name: Noir Studio signed out (NS7a / Identity ID3)
        # `test_development_loop_needs_no_account`, as a property of the built
        # product: the arm that carries write, compile, run, record and export
        # reaches NO network primitive, so there is no request for a token to
        # ride on. The renderer arm's egress is budgeted per surface — lsp,
        # visual-replay, agentic, collab — and fails in both directions, which
        # is what catches ID3's named erosion ("one personalisation, one
        # counter"; a counter is a fetch).
        #
        # This step runs the gate AND its mutation proof: eleven mutations,
        # each verified to redden the assertion written for it. It lives in
        # `viewmodel-tests`, which ci/verdict/required-jobs.txt already
        # requires, rather than in a new job that file does not know about.
        run: nix develop .#devShells.x86_64-linux.default --command just test-noir-studio-signed-out

      - name: Run ViewModel headless tests (native + JS backends)
        run: nix develop .#devShells.x86_64-linux.default --command just test-vm

      - name: Run ct trace-layer unit tests
        # src/ct/trace/*_test.nim (recording-folder shape detection,
        # session-manifest open path, CTFS source materialization, path
        # handling, ct host idle-timeout parsing) is matched by neither
        # `test-vm`'s glob nor `test-vm-recorder-gated`'s, so these suites
        # ran nowhere.  Pure Nim, no recorder sibling, no display.
        run: nix develop .#devShells.x86_64-linux.default --command just test-ct-trace-units

      - name: Run ct upload MCR-enrichment unit tests
        # src/ct/online_sharing/test_mcr_enrichment.nim was matched by no
        # runner at all — 34 assertions that could not fail a build — and the
        # member-check suite alongside it pins that `ct upload` does not
        # replace the user's recording with a lossier export just because the
        # exporter exited 0.  Pure Nim, no recorder sibling, no display, so it
        # belongs in the same job as the trace-layer units above.
        run: nix develop .#devShells.x86_64-linux.default --command just test-mcr-enrichment-units

      - name: Clone codetracer-js-recorder sibling
        # The recorder-gated ViewModel tests
        # (src/frontend/viewmodel/tests/unit/test_{column,formatted_view_step,
        # statement_step}_*_vm.nim) drive the real JS recorder to produce a
        # column-aware trace and replay it through headless_session.  Without
        # the sibling on disk they all hit recorder_gate's
        # ``MISSING-RECORDER SKIP:`` path, so the column-aware / formatted-view
        # / statement-step coverage silently vanished from CI.  Clone it into
        # the workspace-sibling layout the tests resolve
        # (../codetracer-js-recorder/packages/cli/dist/index.js) per
        # codetracer-specs/Testing/Cross-Repo-CI-Integration.md.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-js-recorder
          # `dev` is that repo's default branch; `main` trails it (15 commits
          # behind when this was corrected), so the recorder-gated ViewModel
          # suites and the `ct record` dispatch tests below were exercising a
          # stale recorder while reporting green.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-js-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Run recorder-gated ViewModel tests (JS recorder + replay-server)
        # Builds the JS recorder sibling via scripts/build-siblings.sh, builds
        # replay-server, then runs the recorder-gated unit VM suites with a
        # zero-test guard that fails if they all skip (so a missing recorder
        # cannot masquerade as a pass).
        run: nix develop .#devShells.x86_64-linux.default --command just test-vm-recorder-gated

      - name: Clone runquota sibling
        # The `just build-once` step below compiles `ct`, whose import chain
        # (src/ct/codetracer.nim -> ../ct_test/ct_test ->
        # src/ct_test/process_exec.nim) starts with `import runquota_process`.
        # Under tup the checkout is the only way those modules resolve --
        # NIM_REPO_PATH_FLAGS points at `$(ROOT)/../runquota/...` and tup's
        # environment allowlist omits RUNQUOTA_SRC (issue #641).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Build ct (needed by the CLI dispatch tests)
        # record_missing_recorder_test.nim and record_dispatch_e2e_test.nim
        # drive the SHIPPED `ct` binary rather than importing its modules, so
        # the lane needs a build.  The pure dispatch table test does not, but
        # it runs in the same recipe.
        run: nix develop .#devShells.x86_64-linux.default --command just build-once

      - name: Run ct record CLI dispatch tests
        # Asserts that every language detection produces reaches a recorder,
        # that a missing recorder fails non-zero naming the language and the
        # remedy, and that a real `ct record` through the JS recorder sibling
        # cloned above produces a real CTFS container (with a zero-test guard
        # against an all-skipped run).
        run: nix develop .#devShells.x86_64-linux.default --command just test-cli-record

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewmodel-test-logs
          path: test-logs/
          retention-days: 30

  push-gpg-public-key:
    runs-on: eph-linux-x64-g2  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: "Upload public key"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command gpg --armor --export > CodeTracer.pub.asc
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer.pub.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer.pub.asc

  push-install-script:
    runs-on: eph-linux-x64-g2  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Upload script
        env:
