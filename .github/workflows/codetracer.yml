  dmg-build:
    # CIP-5 Wave 4: migrated to the self-hosted nix-darwin runner. The DIY
    # `dtolnay/rust-toolchain` + `./ci/build/dmg.sh` (-> Homebrew-native
    # `./non-nix-build/build.sh`) and `brew install awscli` steps are gone.
    # reprobuild builds the app bundle hermetically (`repro build .#macos-app
    # --tool-provisioning=nix`, driven by `ci/reprobuild/macos-daemon-build.sh`);
    # the dmg itself is packaged from that bundle in a plain devShell (see the
    # "Package DMG" step for why `.#dmg` cannot run hermetically on macOS), and
    # lands at the same `non-nix-build/CodeTracer.dmg` path the sign + upload
    # steps consume. `aws` comes from `nixpkgs#awscli2`, provisioned per-command
    # via `nix shell`.
    runs-on: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Sweep read-only leftovers from the persistent work directory
        # MODE 3 of the self-hosted checkout outage: a gitignored
        # `non-nix-build/CodeTracer.app` staged out of the Nix store leaves 0555
        # directories in this PERSISTENT work tree, and the next job's
        # `git clean -ffdx` cannot unlink anything inside them. Full rationale,
        # the measured run, and why the source fix in
        # scripts/stage-desktop-node-modules.py does not make this redundant:
        # see the copy of this step in the `test-non-gui` job, and
        # ci/runner/sweep-readonly-leftovers.sh, with which this body is kept
        # byte-identical by ci/test/readonly-leftovers-sweep-test.sh.
        run: |
          set -uo pipefail
          shopt -s dotglob nullglob
          root="${RUNNER_WORKSPACE:-}"
          echo "ro-sweep: runner=${RUNNER_NAME:-?} root=${root:-<unset>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "ro-sweep: found 0 unwritable directory(ies) (work dir absent - fresh runner)"
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          ro_count=0
          ro_shown=0
          ro_blind=0
          # Directory-only recursion via a trailing-slash glob, so bash never has to test
          # the tens of thousands of regular files one at a time. `"$d"/*/` also matches
          # symlinks TO directories; those are skipped, because following them leaves the
          # work directory (these checkouts link into /nix/store) and a store path is not
          # ours to chmod.
          scan() {
            local d="$1" e p
            for e in "$d"/*/; do
              p="${e%/}"
              # `[ -L "$p" ] && continue` would be shorter and WRONG: GitHub runs `run:`
              # blocks under `bash -e`, where a bare `A && B` list that evaluates false is
              # a fatal command. Every branch here is a condition, never a bare list.
              if [ -L "$p" ]; then
                continue
              fi
              if [ ! -r "$p" ] || [ ! -x "$p" ]; then
                ro_blind=$((ro_blind + 1))
                continue
              fi
              if [ ! -w "$p" ]; then
                ro_count=$((ro_count + 1))
                if [ "$ro_shown" -lt 10 ]; then
                  ro_shown=$((ro_shown + 1))
                  echo "ro-sweep:   unwritable $p"
                fi
              fi
              scan "$p"
            done
            return 0
          }
          scan "$root"
          before="$ro_count"
          echo "ro-sweep: found $before unwritable directory(ies) under $root ($ro_blind unreadable)"
          if [ "$before" -eq 0 ]; then
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          # Prove the tool exists before claiming it worked: a `chmod` that is not on
          # PATH exits 127, and a `|| true` would turn that into a silent pass.
          chmod_bin="$(command -v chmod 2>/dev/null || true)"
          if [ -z "$chmod_bin" ]; then
            for candidate in /bin/chmod /usr/bin/chmod /run/current-system/sw/bin/chmod; do
              if [ -x "$candidate" ]; then
                chmod_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chmod_bin" ]; then
            echo "ro-sweep: FATAL no chmod on PATH and none at /bin/chmod;" \
              "$before directory(ies) CANNOT be fixed" >&2
            exit 1
          fi
          echo "ro-sweep: using $chmod_bin"
          "$chmod_bin" -R u+w "$root" 2>/dev/null || true
          ro_count=0
          ro_shown=0
          ro_blind=0
          scan "$root"
          after="$ro_count"
          echo "ro-sweep: after chmod -R u+w: $after unwritable directory(ies) remain"
          echo "ro-sweep: RESTORED owner-write on $((before - after)) directory(ies)"
          if [ "$after" -ne 0 ]; then
            echo "ro-sweep: WARNING $after directory(ies) are not owned by the runner user;" \
              "checkout will still fail to clean them"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # MODE 1 of the self-hosted checkout outage. A stale, owner-scoped
        # `http.https://github.com/metacraft-labs/.extraHeader` left in the
        # runner's reused `~/.gitconfig` OUTRANKS the fresh broader header
        # actions/checkout installs (git matches `http.<url>.*` by longest URL
        # prefix), so checkout authenticates with a dead token, GitHub answers
        # 401, and git dies on `could not read Username`. checkout COPIES
        # `$HOME/.gitconfig` into its temp HOME, so this file is live during the
        # failing fetch. Full rationale, the reproduction, and why this targets
        # the file by path rather than via `--global`: see the copy of this step
        # in the `test-non-gui` job.
        run: |
          set -uo pipefail
          cfg="$HOME/.gitconfig"
          echo "cred-evict: runner=${RUNNER_NAME:-?} home=$HOME"
          if [ ! -f "$cfg" ]; then
            echo "cred-evict: removed 0 (no $cfg on this runner - nothing reusable to poison)"
            exit 0
          fi
          echo "cred-evict: inspecting $cfg"
          removed=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            case "$key" in
              http.*.extraheader|http.*.extraHeader) ;;
              url.*x-access-token*) ;;
              *) continue ;;
            esac
            echo "cred-evict:   removing '$key' (value withheld)"
            git config --file "$cfg" --unset-all "$key" 2>/dev/null || true
            git config --file "$cfg" --remove-section "${key%.*}" 2>/dev/null || true
            removed=$((removed + 1))
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          # Recount in PURE BASH. `grep` and `sed` are NOT on PATH in a raw
          # `run:` step on these nix-darwin runners -- the first version of
          # this step used `grep -ciE` here, grep exited 127, `|| true`
          # swallowed it, and the step printed "removed 1 key(s);  still
          # present" with an EMPTY count. That is precisely the failure this
          # step is supposed to be immune to: a verification that silently
          # verifies nothing and still reads like a pass. No external
          # commands in the check.
          left=0
          while IFS= read -r k; do
            case "$k" in
              *extraheader*|*extraHeader*|*x-access-token*) left=$((left + 1)) ;;
            esac
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          echo "cred-evict: removed $removed credential-bearing key(s); $left still present"
          if [ "$removed" -eq 0 ]; then
            echo "cred-evict: NOTHING FOUND - this host was already clean, mode 1 did not apply here"
          fi
          if [ "$left" -ne 0 ]; then
            echo "cred-evict: WARNING $left credential-shaped key(s) SURVIVED the sweep"
          fi
          echo "cred-evict: keys remaining in $cfg:"
          while IFS= read -r k; do echo "  $k"; done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build CodeTracer.app via reprobuild
        # Toolchain-free reprobuild macOS build of the *app bundle*: starts
        # runquotad, runs `repro build .#macos-app --tool-provisioning=nix`,
        # and lands `non-nix-build/CodeTracer.app` (which the packaging step
        # below turns into the dmg).
        #
        # WHY NOT `.#dmg`: reprobuild's `.#dmg` target invokes the nixpkgs
        # `create-dmg`, a shell script that shells out to macOS system tools
        # (`sw_vers`, then `hdiutil` / `SetFile`). None of those have a nixpkgs
        # package, and reprobuild runs every tool action with a scrubbed PATH =
        # the tool's own nix closure only (the sanctioned `CT_SANDBOX_TOOLS_DIR`
        # escape hatch is not populated anywhere), so `.#dmg` dies with
        # `create-dmg: line 16: sw_vers: command not found` (exit 127). A fully
        # hermetic dmg is not achievable on macOS — hdiutil is the only tool
        # that writes the format and it is macOS-system-only. So we keep the
        # reproducible half (the .app, built hermetically by reprobuild) and
        # package the inherently-non-hermetic dmg in the step below, where the
        # devShell provides create-dmg and the runner's /usr/bin provides the
        # macOS system tools it needs.
        env:
          CODETRACER_REPROBUILD_TARGET: .#macos-app
        run: nix develop . --command bash ci/reprobuild/macos-daemon-build.sh

      - name: Stage the pinned Electron runtime into the app bundle
        # THE PUBLISHED DMG HAS NO ELECTRON. Measured on
        # CodeTracer-latest-arm64.dmg (downloaded 2026-09-03, built 2026-08-30):
        # `Contents/MacOS/bin/electron` execs
        # `../node_modules/electron/dist/Electron.app/Contents/MacOS/Electron`,
        # and the Nix `node-modules-derivation` the bundle pointed at holds 880
        # top-level packages, none of them `electron` — `node-packages/
        # package.json` declares no `electron` at all, so no yarn install could
        # have produced one. The macOS GUI could not start, the same outcome the
        # 2026-08-30 AppImage had by a different route.
        #
        # WHY THIS IS A SEPARATE STEP AND NOT PART OF `.#macos-app`: reprobuild
        # runs every action with a scrubbed PATH and no network, and staging the
        # runtime is `npm ci` against a committed lockfile plus a download from
        # Electron's release assets. Same reason the "Package DMG" step below is
        # not a reprobuild action. The hermetic half stays hermetic; this step
        # adds the one input that cannot be.
        #
        # The pin is `appimage-scripts/electron/package.json` — the SAME file
        # the AppImage installs from, so both desktop artefacts carry the same
        # Electron by construction rather than by coincidence.
        run: nix develop . --command bash scripts/stage-electron-runtime.sh
          non-nix-build/CodeTracer.app/Contents/MacOS/node_modules/electron

      - name: Gate the app bundle before packaging it
        # Two gates, both pointed at the tree that is about to become the dmg.
        # This is the only moment it exists, and it is BEFORE the upload, so a
        # bundle that would dangle on a user's Mac cannot be published.
        #
        # `dmg-lib-check` cannot substitute for this: it runs on the same
        # self-hosted aarch64-darwin host that built the bundle, where the
        # /nix/store path in the old symlink RESOLVES. That is precisely how a
        # bundle with no dependency tree passed every release check.
        run: |
          nix develop . --command bash -c '
            set -eu
            bash ci/test/desktop-bundle-self-contained.sh non-nix-build/CodeTracer.app
            bash ci/test/electron-supply-chain.sh non-nix-build/CodeTracer.app
          '

      - name: Package DMG
        # Package `non-nix-build/CodeTracer.app` into `CodeTracer.dmg` using the
        # devShell's create-dmg. This runs in a plain `nix develop .` shell (NOT
        # a reprobuild action), so the devShell provides create-dmg. create-dmg
        # itself shells out to macOS system tools (sw_vers, hdiutil, SetFile);
        # this self-hosted nix-darwin runner's inherited PATH is nix-store-only,
        # so /usr/bin is not present and create-dmg dies with
        # `sw_vers: command not found`. Append the macOS system dirs (kept AFTER
        # the devShell entries so the nix create-dmg still wins) to resolve them.
        # The create-dmg flags mirror non-nix-build/build_dmg.sh (the pre-CIP-5
        # path) and repro.nim's create_dmg action, so the produced dmg is the
        # same shape the sign + upload steps below expect.
        run: |
          nix develop . --command bash -c '
            set -eu
            export PATH="$PATH:/usr/bin:/usr/sbin"
            cd non-nix-build
            rm -f CodeTracer.dmg
            staging="$(mktemp -d)"
            trap "rm -rf \"$staging\"" EXIT
            cp -R CodeTracer.app "$staging/"
            create-dmg \
              --volname CodeTracer \
              --background dmg_background.png \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon CodeTracer.app 150 200 \
              --app-drop-link 450 200 \
              --sandbox-safe \
              CodeTracer.dmg \
              "$staging"
          '

      - name: Upload artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          gpg --armor --detach-sign non-nix-build/CodeTracer.dmg
          # for now apply workaround from https://community.cloudflare.com/t/an-error-occurred-internalerror-when-calling-the-putobject-operation/764905/11:
          #   adding `--checksum-algorithm CRC32`
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp ./non-nix-build/CodeTracer.dmg s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg --checksum-algorithm CRC32
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp ./non-nix-build/CodeTracer.dmg.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg.asc --checksum-algorithm CRC32

  windows-installer-build:
    # Builds the NSIS installer (non-nix-build/CodeTracer-Setup.exe) and hands
    # it to windows-installer-publish (Linux) for signing + R2 upload. Split in
    # two so all GPG/aws work stays on the proven Linux path; the Windows leg
    # only produces the artifact.
    #
    # Gated to `main` (the release branch) because the -win-x64 artifact is a
    # RELEASE artifact promoted to `-latest-` by create-release, exactly like the
    # AppImage/dmg. Keeping it off PRs / `dev` also means the eph-win-x64 GARM
    # outage cannot turn PR runs red. This job is NOT in push-tag's `needs`, so
    # while GARM is down it can hang/fail without ever blocking a release —
    # create-release simply skips the (absent) win artifact (see below).
    runs-on: eph-win-x64-release  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64-release (dedicated release scale set)
    # See the timeout-minutes rationale on windows-rust-components. This job is
    # on the release scale set rather than the CI one, but it runs the SAME
    # env.ps1 bootstrap, so it has the same unbounded failure mode and would
    # inherit the same 360-minute default. It is bounded here rather than when
    # the `if:` below is repaired, so that repairing the gate is a one-line
    # change that cannot also reintroduce an unbounded job.
    timeout-minutes: 90
    # DEAD GATE -- this job has never run. `refs/heads/main` does not exist in
    # this repository: 702 remote refs, zero matches for `refs/heads/main`
    # (`git ls-remote origin | grep -c 'refs/heads/main$'` -> 0). The branches
    # are `dev` and `stable`. So the -win-x64 installer has never been built or
    # published, and the comment above claiming parity with the AppImage/dmg is
    # not accurate about the mechanism: `appimage-build` and `dmg-build` carry
    # NO `if:` at all and publish `CodeTracer-<ref_name>-...` on every branch
    # push. Matching them means DELETING this condition, not correcting the
    # branch name -- but that starts publishing a Windows artefact, which is a
    # release decision, so the gate is left in place and reported rather than
    # flipped here.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # See the eph-win-x64 note at the top of this file: actions/checkout needs
      # a real git for `submodules: recursive`, provisioned by this bootstrap.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # windows-diy provisions the DIY Windows toolchain via env.ps1's
        # ensure-* helpers (nim / rust / capnp / clingo / repro …) and clones the
        # recorder/trace siblings, persisting PATH to GITHUB_ENV/GITHUB_PATH.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            codetracer-native-recorder=dev

      - name: Remove WSL bash stub from System32
        # As in the other eph-win-x64 jobs: let CreateProcessW fall through to
        # Git Bash instead of the WSL launcher stub.
        shell: pwsh
        run: |
          $wslStub = "$env:SystemRoot\System32\bash.exe"
          if (Test-Path $wslStub) {
            takeown /f $wslStub | Out-Null
            icacls $wslStub /grant "Administrators:(F)" | Out-Null
            Remove-Item -Force $wslStub
          }
          $gitForWindowsBin = "C:\Program Files\Git\bin"
          if (Test-Path -LiteralPath $gitForWindowsBin -PathType Container) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitForWindowsBin
          }
          # Whatever supplied it, `bash` must resolve now: the build step below
          # is `shell: bash`, and a missing bash there reads as a build failure
          # rather than as a missing tool.
          $bash = Get-Command bash -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $bash) {
            throw "No bash on PATH. The 'Ensure Git and Git Bash are on PATH' step " +
                  "should have provisioned Git Bash; every step below this one needs it."
          }
          Write-Host "Using bash from $($bash.Source)"

      - name: Build CodeTracer-Setup.exe
        shell: bash
        env:
          CODETRACER_REPROBUILD_TOOL_PROVISIONING: scoop
          CODETRACER_REPROBUILD_LOG: quiet
        run: |
          set -euo pipefail
          # Canonical installer build, mirroring the `test-windows-installer`
          # justfile recipe: build the app once, then the NSIS `windows-installer`
          # reprobuild target. build-once.sh resolves repro/repro.exe from the
          # sibling checkout or PATH (env.ps1 puts it there).
          bash scripts/build-once.sh
          repro build windows-installer \
            --tool-provisioning="${CODETRACER_REPROBUILD_TOOL_PROVISIONING}" \
            --log="${CODETRACER_REPROBUILD_LOG}"
          test -f non-nix-build/CodeTracer-Setup.exe \
            || { echo "non-nix-build/CodeTracer-Setup.exe was not produced" >&2; exit 1; }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetracer-setup-exe
          path: non-nix-build/CodeTracer-Setup.exe
          if-no-files-found: error
          retention-days: 7

  windows-installer-publish:
    # Signs the Windows installer with the release key and publishes it to R2 as
    # CodeTracer-main-win-x64.exe(.asc), the per-`main`-build key that
    # create-release promotes to `-latest-`/`-<tag>-` — the exact shape as the
    # AppImage/dmg (CodeTracer-main-amd64.AppImage etc.). Runs on Linux so gpg,
    # aws and the imported release key all come from the proven nix path.
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    # Bounded for the same reason as windows-installer-build above, and with the
    # same dead `refs/heads/main` gate. This leg is signing + upload only, so it
    # needs far less headroom than the build.
    timeout-minutes: 30
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ windows-installer-build ]
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: codetracer-setup-exe
          path: .

      - name: Sign and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }}
          BUCKET: ${{ vars.R2_CODETRACER_BUCKET_NAME }}
        run: |
          set -euo pipefail
          aws_cmd() {
            nix develop .#devShells.x86_64-linux.default --command \
              aws --endpoint-url="$ENDPOINT" "$@"
          }
          nix develop .#devShells.x86_64-linux.default --command \
            gpg --armor --detach-sign CodeTracer-Setup.exe

          # SELF-PROMOTION: this leg publishes the win installer to the
          # per-`main`-build key AND to the `-<version>-` / `-latest-` release
          # keys itself, rather than leaving the latter to create-release.
          #
          # The design once had create-release promote `-main-` -> `-latest-`/
          # `-<tag>-` for every artifact (see its "Windows installer" block). But
          # create-release is gated only on the four Linux/darwin build jobs via
          # push-tag, while this Windows leg runs on the much slower eph-win-x64
          # runner (queue + the full env.ps1 DIY toolchain bootstrap + the NSIS
          # build). create-release therefore finishes, and runs its TOLERANT win
          # promotion, long before `CodeTracer-main-win-x64.exe` exists — so the
          # Windows installer was always skipped and only picked up "next
          # release". Promoting here removes that one-release lag so
          # get.codetracer.com/pwsh (which downloads CodeTracer-latest-win-x64.exe)
          # resolves in the same release. Every push to `main` is a release, so
          # advancing `-latest-` here matches the release model.
          YEAR=$(grep 'CodeTracerYear\*' src/ct/version.nim | sed 's/.*= //' | tr -d '[:space:]')
          MONTH=$(printf '%02d' "$(grep 'CodeTracerMonth\*' src/ct/version.nim | sed 's/.*= //' | tr -d '[:space:]')")
          BUILD=$(grep 'CodeTracerBuild\*' src/ct/version.nim | sed 's/.*= //' | tr -d '[:space:]')
          VERSION="$YEAR.$MONTH.$BUILD"

          for slot in "${{ github.ref_name }}" "$VERSION" latest; do
            aws_cmd s3 cp CodeTracer-Setup.exe \
              "s3://$BUCKET/CodeTracer-$slot-win-x64.exe" --checksum-algorithm CRC32
            aws_cmd s3 cp CodeTracer-Setup.exe.asc \
              "s3://$BUCKET/CodeTracer-$slot-win-x64.exe.asc" --checksum-algorithm CRC32
          done

  dmg-lib-check:
    # CIP-5 Wave 4: migrated to the self-hosted nix-darwin runner. The DIY
    # `brew install awscli` / `brew install sevenzip` steps are gone; `aws`
    # comes from `nixpkgs#awscli2` and 7-Zip from `nixpkgs#p7zip` (the `7z`
    # binary), both provisioned per-command via `nix shell`. This job only
    # downloads + extracts + smoke-runs the release dmg, so it needs no
    # Homebrew build toolchain.
    runs-on: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    needs:
      - dmg-build
    steps:
      - name: Sweep read-only leftovers from the persistent work directory
        # MODE 3 of the self-hosted checkout outage: a gitignored
        # `non-nix-build/CodeTracer.app` staged out of the Nix store leaves 0555
        # directories in this PERSISTENT work tree, and the next job's
        # `git clean -ffdx` cannot unlink anything inside them. Full rationale,
        # the measured run, and why the source fix in
        # scripts/stage-desktop-node-modules.py does not make this redundant:
        # see the copy of this step in the `test-non-gui` job, and
        # ci/runner/sweep-readonly-leftovers.sh, with which this body is kept
        # byte-identical by ci/test/readonly-leftovers-sweep-test.sh.
        run: |
          set -uo pipefail
          shopt -s dotglob nullglob
          root="${RUNNER_WORKSPACE:-}"
          echo "ro-sweep: runner=${RUNNER_NAME:-?} root=${root:-<unset>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "ro-sweep: found 0 unwritable directory(ies) (work dir absent - fresh runner)"
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          ro_count=0
          ro_shown=0
          ro_blind=0
          # Directory-only recursion via a trailing-slash glob, so bash never has to test
          # the tens of thousands of regular files one at a time. `"$d"/*/` also matches
          # symlinks TO directories; those are skipped, because following them leaves the
          # work directory (these checkouts link into /nix/store) and a store path is not
          # ours to chmod.
          scan() {
            local d="$1" e p
            for e in "$d"/*/; do
              p="${e%/}"
              # `[ -L "$p" ] && continue` would be shorter and WRONG: GitHub runs `run:`
              # blocks under `bash -e`, where a bare `A && B` list that evaluates false is
              # a fatal command. Every branch here is a condition, never a bare list.
              if [ -L "$p" ]; then
                continue
              fi
              if [ ! -r "$p" ] || [ ! -x "$p" ]; then
                ro_blind=$((ro_blind + 1))
                continue
              fi
              if [ ! -w "$p" ]; then
                ro_count=$((ro_count + 1))
                if [ "$ro_shown" -lt 10 ]; then
                  ro_shown=$((ro_shown + 1))
                  echo "ro-sweep:   unwritable $p"
                fi
              fi
              scan "$p"
            done
            return 0
          }
          scan "$root"
          before="$ro_count"
          echo "ro-sweep: found $before unwritable directory(ies) under $root ($ro_blind unreadable)"
          if [ "$before" -eq 0 ]; then
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          # Prove the tool exists before claiming it worked: a `chmod` that is not on
          # PATH exits 127, and a `|| true` would turn that into a silent pass.
          chmod_bin="$(command -v chmod 2>/dev/null || true)"
          if [ -z "$chmod_bin" ]; then
            for candidate in /bin/chmod /usr/bin/chmod /run/current-system/sw/bin/chmod; do
              if [ -x "$candidate" ]; then
                chmod_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chmod_bin" ]; then
            echo "ro-sweep: FATAL no chmod on PATH and none at /bin/chmod;" \
              "$before directory(ies) CANNOT be fixed" >&2
            exit 1
          fi
          echo "ro-sweep: using $chmod_bin"
          "$chmod_bin" -R u+w "$root" 2>/dev/null || true
          ro_count=0
          ro_shown=0
          ro_blind=0
          scan "$root"
          after="$ro_count"
          echo "ro-sweep: after chmod -R u+w: $after unwritable directory(ies) remain"
          echo "ro-sweep: RESTORED owner-write on $((before - after)) directory(ies)"
          if [ "$after" -ne 0 ]; then
            echo "ro-sweep: WARNING $after directory(ies) are not owned by the runner user;" \
              "checkout will still fail to clean them"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # MODE 1 of the self-hosted checkout outage. A stale, owner-scoped
        # `http.https://github.com/metacraft-labs/.extraHeader` left in the
        # runner's reused `~/.gitconfig` OUTRANKS the fresh broader header
        # actions/checkout installs (git matches `http.<url>.*` by longest URL
        # prefix), so checkout authenticates with a dead token, GitHub answers
        # 401, and git dies on `could not read Username`. checkout COPIES
        # `$HOME/.gitconfig` into its temp HOME, so this file is live during the
        # failing fetch. Full rationale, the reproduction, and why this targets
        # the file by path rather than via `--global`: see the copy of this step
        # in the `test-non-gui` job.
        run: |
          set -uo pipefail
          cfg="$HOME/.gitconfig"
          echo "cred-evict: runner=${RUNNER_NAME:-?} home=$HOME"
          if [ ! -f "$cfg" ]; then
            echo "cred-evict: removed 0 (no $cfg on this runner - nothing reusable to poison)"
            exit 0
          fi
          echo "cred-evict: inspecting $cfg"
          removed=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            case "$key" in
              http.*.extraheader|http.*.extraHeader) ;;
              url.*x-access-token*) ;;
              *) continue ;;
            esac
            echo "cred-evict:   removing '$key' (value withheld)"
            git config --file "$cfg" --unset-all "$key" 2>/dev/null || true
            git config --file "$cfg" --remove-section "${key%.*}" 2>/dev/null || true
            removed=$((removed + 1))
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          # Recount in PURE BASH. `grep` and `sed` are NOT on PATH in a raw
          # `run:` step on these nix-darwin runners -- the first version of
          # this step used `grep -ciE` here, grep exited 127, `|| true`
          # swallowed it, and the step printed "removed 1 key(s);  still
          # present" with an EMPTY count. That is precisely the failure this
          # step is supposed to be immune to: a verification that silently
          # verifies nothing and still reads like a pass. No external
          # commands in the check.
          left=0
          while IFS= read -r k; do
            case "$k" in
              *extraheader*|*extraHeader*|*x-access-token*) left=$((left + 1)) ;;
            esac
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          echo "cred-evict: removed $removed credential-bearing key(s); $left still present"
          if [ "$removed" -eq 0 ]; then
            echo "cred-evict: NOTHING FOUND - this host was already clean, mode 1 did not apply here"
          fi
          if [ "$left" -ne 0 ]; then
            echo "cred-evict: WARNING $left credential-shaped key(s) SURVIVED the sweep"
          fi
          echo "cred-evict: keys remaining in $cfg:"
          while IFS= read -r k; do echo "  $k"; done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)

      - name: Checkout
        # Only so that `uses: ./.github/actions/setup-nix` below resolves; no
        # other step in this job reads the tree. No submodules and no token:
        # this repository is public and nothing here talks to a remote, and
        # these runners reuse their work tree, so a persisted credential would
        # outlive the job that minted nothing.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ github.token }}

      - name: Download artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg ./CodeTracer.dmg
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg.asc ./CodeTracer.dmg.asc
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer.pub.asc ./CodeTracer.pub.asc

      - name: Verify GPG signature
        # A signed release is only worth signing if we check the signature on
        # the exact bytes we ship. The detached .asc and the published public
        # key come from the same bucket the dmg does; import the key and verify
        # before we run the binary, so a broken/absent signature fails loudly
        # here rather than being discovered by a user with `gpg --verify`.
        run: |
          nix shell nixpkgs#gnupg --command gpg --import ./CodeTracer.pub.asc
          nix shell nixpkgs#gnupg --command gpg --verify ./CodeTracer.dmg.asc ./CodeTracer.dmg

      - name: Extract dmg
        # WHY `hdiutil` AND NOT `7z x`.
        #
        # This step used to run `nix shell nixpkgs#p7zip --command 7z x
        # ./CodeTracer.dmg`, and the "Check if ct starts" step below then died:
        #
        #     .../<step>.sh: line 1: ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct: Permission denied
        #     ##[error]Process completed with exit code 126.
        #
        # Run 33742876598, job 100624879771, on m3-mcl-005. Exit 126 is
        # "found but not executable", not "not found" and not a crash of `ct`:
        # 7z reported `Everything is Ok` and unpacked all 32177 files first.
        #
        # 7z reads the DMG's HFS+ image as an archive and does not restore
        # POSIX mode bits, so every extracted file lands non-executable. That
        # makes the check unable to pass no matter what the DMG contains, which
        # is why this is an instrument defect and not a packaging one.
        #
        # It went unseen because it was unreachable: `dmg-lib-check` needs
        # `dmg-build`, and 33742876598 is the first run in ~30 where dmg-build
        # reached a runner at all. The step is as old as the job; the exposure
        # is new.
        #
        # `hdiutil attach` mounts the real HFS+ volume with its permissions
        # intact, so the executable bit is the one the DMG actually ships. That
        # matters beyond making the check pass: `chmod +x` after 7z would also
        # turn the job green, but it would forge the very property this job
        # exists to assert, and a genuinely non-executable `ct` in a shipped
        # DMG would then pass unnoticed. This way the check still fails if the
        # artifact is really broken.
        #
        # `-nobrowse` keeps the volume out of Finder; `-readonly` avoids any
        # write-back to the artifact we just gpg-verified. The contents are
        # copied out to ./CodeTracer so the paths every later step uses are
        # unchanged, and the volume is detached before those steps run so
        # nothing holds a mount on this persistent runner.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # THIRD confirmed instance of one root cause: this step's shell is the
          # devShell's bash, and on a nix-darwin self-hosted runner its PATH has
          # no /usr/bin. `hdiutil` exists ONLY at /usr/bin/hdiutil -- no nixpkgs
          # input provides it -- so the first version of this step died with
          #
          #     .../<step>.sh: line 6: hdiutil: command not found
          #     ##[error]Process completed with exit code 127.
          #
          # (run 33750724496, job 100642345443, on m3-mcl-004), which is the
          # same 127 that `codesign` and then `sw_vers` produced earlier today
          # in the ct-mcr and build-once steps. APPEND, never prepend, so the
          # devShell toolchain keeps winning for git/python/clang.
          export PATH="$PATH:/usr/bin"
          mountpoint="$(mktemp -d "${RUNNER_TEMP:-/tmp}/codetracer-dmg-XXXXXX")"
          # Detach on every exit path: a leaked mount outlives the job on these
          # persistent macOS runners and the next run's attach then fails.
          trap 'hdiutil detach "$mountpoint" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach ./CodeTracer.dmg -mountpoint "$mountpoint" -nobrowse -readonly
          rm -rf ./CodeTracer
          mkdir -p ./CodeTracer
          # -R preserves the mode bits; -p would also preserve them but drags in
          # ownership, which cannot be reproduced off the image.
          cp -R "$mountpoint"/*.app ./CodeTracer/
          test -x ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct \
            || { echo "::error::the DMG ships bin/ct without an executable bit"; exit 1; }

      - name: Check if ct starts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct --version

      - name: Record -> replay smoke on the packaged dmg
        # Informational, NOT a gate (continue-on-error): records a tiny Noir
        # package and reads it back with the SHIPPED ct + bundled recorder
        # (nargo / wazero / db-backend-record). Catches packaging regressions
        # that `--version` cannot -- a missing or mis-linked bundled recorder.
        # A known bug here may ship in an internal release and be fixed by a
        # follow-up; it must not block the release from cutting.
        continue-on-error: true
        env:
          CT: ${{ github.workspace }}/CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct
        run: bash scripts/test-packaged-record-replay.sh

  appimage-lib-check:
    # CIP-5 Wave 4: migrated to the self-hosted NixOS runner. The DIY
    # `sudo snap install aws-cli` step is gone (`aws` now comes from
    # `nixpkgs#awscli2` via `nix shell`), and the `sudo apt-get install fuse
    # libfuse2` step is dropped entirely: the ephemeral NixOS runner has no
    # fusermount setuid wrapper / /dev/fuse, so we smoke-run the AppImage with
    # `APPIMAGE_EXTRACT_AND_RUN=1` (self-extract, no FUSE) — the same mode
    # nix/shells/ci-base.nix documents for AppImages on these runners.
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    needs:
      - appimage-build
    steps:
      - name: Checkout
        # Only so that `uses: ./.github/actions/setup-nix` below resolves; no
        # other step in this job reads the tree. No submodules and no token:
        # this repository is public and nothing here talks to a remote, and
        # these runners reuse their work tree, so a persisted credential would
        # outlive the job that minted nothing.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ github.token }}

      - name: Download artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage ./CodeTracer.AppImage
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage.asc ./CodeTracer.AppImage.asc
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer.pub.asc ./CodeTracer.pub.asc

      - name: Verify GPG signature
        # A signed release is only worth signing if we check the signature on
        # the exact bytes we ship. The detached .asc and the published public
        # key come from the same bucket the AppImage does; import the key and
        # verify before we run the binary, so a broken/absent signature fails
        # loudly here rather than being discovered by a user with `gpg --verify`.
        run: |
          nix shell nixpkgs#gnupg --command gpg --import ./CodeTracer.pub.asc
          nix shell nixpkgs#gnupg --command gpg --verify ./CodeTracer.AppImage.asc ./CodeTracer.AppImage

      - name: Check if ct starts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x ./CodeTracer.AppImage
          ./CodeTracer.AppImage --version

      - name: Record -> replay smoke on the packaged AppImage
        # Informational, NOT a gate (continue-on-error): records a tiny Noir
        # package and reads it back with the SHIPPED ct + bundled recorder
        # (nargo / wazero / db-backend-record). Catches packaging regressions
        # that `--version` cannot -- a missing or mis-linked bundled recorder.
        # A known bug here may ship in an internal release and be fixed by a
        # follow-up; it must not block the release from cutting.
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CT: ${{ github.workspace }}/CodeTracer.AppImage --appimage-extract-and-run
        run: bash scripts/test-packaged-record-replay.sh

  # Cross-distro AppImage smoke.  ubuntu-latest (the appimage-lib-check
  # runner above) shares too many runtime libs with the build host to
  # catch glibc/libgcc/libstdc++ symbol-version regressions or a missing
  # patchelf entry.  This matrix runs `--version`, `--help`, and a tiny
  # `ct record` of a Python script on five distinct base images via
  # Docker, using AppImage's `--appimage-extract-and-run` mode so we
  # don't need FUSE in the runner.  See
  # scripts/test-appimage-cross-distro.sh.
  appimage-cross-distro:
    # Self-hosted on the nested-Docker class: this job's core is a 5-distro
    # Docker matrix (scripts/test-appimage-cross-distro.sh pulls
    # ubuntu/debian/fedora/arch images and runs the AppImage inside each), and
    # eph-linux-x64-nested is the Incus class that exposes an in-guest Docker
    # daemon (security.nesting + fuse-overlayfs). aws-cli comes from nixpkgs.
    runs-on: eph-linux-x64-nested
    needs:
      - appimage-build
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:40
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false

      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        #
        # This step (and a since-removed "Install AWS CLI" step) used to be
        # gated to `refs/tags/` while the Download AppImage + Smoke-test steps
        # that DEPEND on them were not, so on every branch (main/dev) run those
        # two ran without aws/nix installed and the job died at
        # `aws: command not found` — the AppImage's off-nix portability went
        # untested. Ungating them was necessary but NOT sufficient: the job
        # kept dying at the identical `aws: command not found` afterwards, for
        # a second and unrelated reason. See the note on "Download AppImage"
        # below, which is where the aws binary is now obtained.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ github.token }}

      - name: Download AppImage
        # WHY `nix shell --command` AND NOT A SEPARATE `nix profile install`.
        #
        # This step used to be preceded by an "Install AWS CLI" step running
        # `nix profile install nixpkgs#awscli2`, and it STILL died with
        #
        #     .../<step>.sh: line 1: aws: command not found
        #     ##[error]Process completed with exit code 127.
        #
        # in all five distro legs -- run 33742876598, jobs 100625123843
        # (debian:12), 100625123865 (fedora:40), 100625123866 (ubuntu:22.04),
        # 100625123986 (ubuntu:24.04), 100625124039 (archlinux:latest). The
        # install step itself SUCCEEDED in every one of them; only nix's
        # "'install' is a deprecated alias for 'add'" warning and the usual
        # restricted-setting warnings appear, and no error follows it.
        #
        # `nix profile install` writes into `$HOME/.nix-profile`, and
        # `$HOME/.nix-profile/bin` reaches PATH only via nix's profile shell
        # snippet. Each `run:` step is a fresh NON-login, NON-interactive shell
        # (`shell: /usr/bin/bash -e {0}`), which sources no profile, so the
        # binary exists on disk and is unreachable by name. Installing into a
        # profile and then invoking the tool bare in a later step cannot work
        # here regardless of whether the install succeeds -- which is why the
        # previous fix in this area (ungating the install step so it actually
        # ran; see the note in "Install Nix" above) did not change the symptom.
        # It addressed why the step was skipped, not why the name does not
        # resolve, and `aws: command not found` survived it unchanged.
        #
        # `nix shell nixpkgs#awscli2 --command aws ...` puts the binary on PATH
        # for exactly the process that needs it and does not depend on any
        # profile being sourced. This is the form the two sibling jobs that
        # download from the same bucket already use and that demonstrably
        # works: `appimage-lib-check` (line ~3860) and `dmg-lib-check`
        # (line ~3774) both got past their download in the same run -- far
        # enough to gpg-verify and then run the artifact.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage ./CodeTracer.AppImage

      - name: Smoke-test on ${{ matrix.distro }}
        run: |
          bash scripts/test-appimage-cross-distro.sh \
            --distro ${{ matrix.distro }} \
            ./CodeTracer.AppImage

  test-non-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: nixos
            runner: eph-linux-x64-g1  # CIP-5 nix leg; H4: routed to GPU host gpu-server-001
          # CIP-5 Wave 4: the macOS leg now runs on the self-hosted nix-darwin
          # runner and drives the tests through codetracer's nix dev shell
          # (``nix develop . --command just test``), same as the nixos leg. The
          # former Homebrew-native ``./non-nix-build/build.sh`` toolchain (brew
          # install just / setup-python / dtolnay rust-toolchain) is gone; nim /
          # cargo / cargo-nextest / nimsuggest all come from the dev shell.
          - platform: macos
            runner: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    runs-on: ${{ matrix.runner }}
    # macOS tests are new and may have pre-existing failures; don't block PRs
    continue-on-error: ${{ matrix.platform == 'macos' }}
    # NOTE: this job deliberately does NOT declare `needs: [lint-bash,
    # lint-nim, lint-nix, lint-rust]` any more.
    #
    # That dependency existed purely to fail fast and save runner time —
    # the lint jobs produce no artifact and no output this job consumes.
    # Its real effect was to make the entire non-GUI test suite hostage to
    # the lint lane's toolchain: when lint-rust started dying before it
    # linted anything (`direnv: not found`, exit 127; or `Setup dev env`
    # failing for want of a workspace lock), GitHub reported this job as
    # `skipped`, and the run was red from lint anyway, so the missing test
    # coverage was invisible. On `dev`, this job last executed on
    # 2026-06-25 and was skipped on every run after it.
    #
    # The lint jobs remain REQUIRED — ci/verdict/required-jobs.txt lists
    # all four, so a lint failure still fails the run. They just no longer
    # get to silence the tests on their way down.
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Sweep read-only leftovers from the persistent work directory
        # MODE 3 of the self-hosted checkout outage, and the first one seen on
        # the m3 macOS class. Run 33734457928, job 100581650873, runner
        # m3-mcl-003, this job, the step below:
        #
        #   warning: failed to remove non-nix-build/CodeTracer.app/Contents/
        #     MacOS/node_modules/<31,307 paths>: Permission denied
        #   ##[warning]Unable to clean or reset the repository. The repository
        #     will be recreated instead.
        #   ##[error]File was unable to be removed Error: EACCES: permission
        #     denied, unlink '.../node_modules/abbrev/LICENSE'
        #
        # All 31,307 warnings name ONE tree. `dmg-build` stages the desktop
        # bundle's `node_modules` out of the Nix store, store paths are 0555
        # directories / 0444 files, `shutil.copytree` preserved the mode, and
        # `non-nix-build/CodeTracer.app` is gitignored -- so it SURVIVES in the
        # persistent work directory and lands on whichever job runs there next.
        # `git clean -ffdx` then cannot unlink one file inside it, because
        # POSIX unlink needs write on the PARENT DIRECTORY.
        #
        # THE SOURCE IS FIXED SEPARATELY, in
        # scripts/stage-desktop-node-modules.py (which now restores owner-write
        # over what it stages and prints the counts) and gated on the finished
        # artefact by ci/test/desktop-bundle-self-contained.sh. This step is the
        # BACKSTOP, and it is not an alternative to that fix: the poison is
        # already on m3-mcl-003's disk and no source change removes it.
        #
        # WHY THE EXISTING SWEEP DID NOT COVER THIS. The step named "Sweep stale
        # git lock files from the persistent work directory" does carry a
        # `chmod -R u+w`, and it missed this for two independent reasons: it
        # exists in exactly ONE job (`visual-replay-regression-gate`,
        # `runs-on: [self-hosted, gpu]`), and it is built on `find`, which is
        # not on PATH on the nix-darwin runners at all.
        #
        # The body is PURE BASH -- no grep, sed, awk or find, none of which the
        # m3 runners have -- and is kept byte-identical to
        # ci/runner/sweep-readonly-leftovers.sh, where the rationale is written
        # out at length and where ci/test/readonly-leftovers-sweep-test.sh
        # executes it against poisoned and clean fixtures under
        # `env -i PATH=<bash+git only>`. An inline `run:` block has no other way
        # to be tested, and this campaign has three times been fooled by a
        # cleanup that silently no-opped.
        run: |
          set -uo pipefail
          shopt -s dotglob nullglob
          root="${RUNNER_WORKSPACE:-}"
          echo "ro-sweep: runner=${RUNNER_NAME:-?} root=${root:-<unset>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "ro-sweep: found 0 unwritable directory(ies) (work dir absent - fresh runner)"
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          ro_count=0
          ro_shown=0
          ro_blind=0
          # Directory-only recursion via a trailing-slash glob, so bash never has to test
          # the tens of thousands of regular files one at a time. `"$d"/*/` also matches
          # symlinks TO directories; those are skipped, because following them leaves the
          # work directory (these checkouts link into /nix/store) and a store path is not
          # ours to chmod.
          scan() {
            local d="$1" e p
            for e in "$d"/*/; do
              p="${e%/}"
              # `[ -L "$p" ] && continue` would be shorter and WRONG: GitHub runs `run:`
              # blocks under `bash -e`, where a bare `A && B` list that evaluates false is
              # a fatal command. Every branch here is a condition, never a bare list.
              if [ -L "$p" ]; then
                continue
              fi
              if [ ! -r "$p" ] || [ ! -x "$p" ]; then
                ro_blind=$((ro_blind + 1))
                continue
              fi
              if [ ! -w "$p" ]; then
                ro_count=$((ro_count + 1))
                if [ "$ro_shown" -lt 10 ]; then
                  ro_shown=$((ro_shown + 1))
                  echo "ro-sweep:   unwritable $p"
                fi
              fi
              scan "$p"
            done
            return 0
          }
          scan "$root"
          before="$ro_count"
          echo "ro-sweep: found $before unwritable directory(ies) under $root ($ro_blind unreadable)"
          if [ "$before" -eq 0 ]; then
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          # Prove the tool exists before claiming it worked: a `chmod` that is not on
          # PATH exits 127, and a `|| true` would turn that into a silent pass.
          chmod_bin="$(command -v chmod 2>/dev/null || true)"
          if [ -z "$chmod_bin" ]; then
            for candidate in /bin/chmod /usr/bin/chmod /run/current-system/sw/bin/chmod; do
              if [ -x "$candidate" ]; then
                chmod_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chmod_bin" ]; then
            echo "ro-sweep: FATAL no chmod on PATH and none at /bin/chmod;" \
              "$before directory(ies) CANNOT be fixed" >&2
            exit 1
          fi
          echo "ro-sweep: using $chmod_bin"
          "$chmod_bin" -R u+w "$root" 2>/dev/null || true
          ro_count=0
          ro_shown=0
          ro_blind=0
          scan "$root"
          after="$ro_count"
          echo "ro-sweep: after chmod -R u+w: $after unwritable directory(ies) remain"
          echo "ro-sweep: RESTORED owner-write on $((before - after)) directory(ies)"
          if [ "$after" -ne 0 ]; then
            echo "ro-sweep: WARNING $after directory(ies) are not owned by the runner user;" \
              "checkout will still fail to clean them"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # MODE 1 of the self-hosted checkout outage, and the fix for it.
        #
        # SYMPTOM. On m3-mcl-004 and m3-mcl-005, `actions/checkout` died three
        # times 20s apart with
        #   fatal: could not read Username for 'https://github.com':
        #   terminal prompts disabled
        # one line after it installed a freshly minted App token as
        # `http.https://github.com/.extraheader`. m3-mcl-001 and m3-mcl-006 ran
        # the identical step in the same run and succeeded. The variable is the
        # HOST, not the token.
        #
        # MECHANISM (reproduced exactly, against the real github.com):
        #   git config --local  http.https://github.com/.extraheader  <FRESH>
        #   git config --global http.https://github.com/metacraft-labs/.extraHeader <STALE>
        #   git ls-remote https://github.com/metacraft-labs/codetracer
        #   -> fatal: could not read Username for 'https://github.com'
        # Git resolves `http.<url>.*` by LONGEST matching URL prefix, so the
        # owner-scoped `.../metacraft-labs/` key WINS over checkout's broader
        # `https://github.com/` key. `git config --get-urlmatch http <url>`
        # confirms only one header is applied -- this is not a duplicate-header
        # 400, it is checkout's fresh credential being silently replaced by a
        # dead one. GitHub answers 401, git falls back to a credential prompt,
        # prompts are disabled, and you get the message above. The message is
        # the SYMPTOM OF A 401; it is not evidence that no credential existed.
        #
        # WHY IT SURVIVES. actions/checkout COPIES `$HOME/.gitconfig` into
        # `_temp/<uuid>/.gitconfig` and overrides HOME before its own `--global`
        # writes. So the runner's persistent `~/.gitconfig` IS in effect during
        # the failing fetch -- an earlier fix for this same message was written
        # to `--global` and landed in the throwaway temp copy that the failing
        # step never read. That is why this step targets `$HOME/.gitconfig` BY
        # PATH rather than via `--global`: `--global` follows XDG and can
        # resolve to `~/.config/git/config`, which checkout does NOT copy, so a
        # `--global --unset` can report success while leaving the actual
        # offending file untouched.
        #
        # CONFIRMED ON THE HOSTS, not merely reproduced. A six-leg diagnostic
        # (run 33729089916) dumped `git config --list --show-origin` from the
        # m3 pool before checkout. m3-mcl-004 and m3-mcl-005 -- the two that
        # failed -- carried, in `/private/var/lib/github-runners/mcl-00N/.gitconfig`:
        #     http.https://github.com/metacraft-labs/.extraheader  (553 bytes)
        # m3-mcl-001 -- which succeeded -- had the SAME seven other keys and
        # NOT that one (243-byte file vs 856-byte file). One variable, and it
        # is this key. This step then removed it on m3-mcl-004 and the very
        # next `Checkout` on that host went green.
        #
        # STILL UNKNOWN: WHO WRITES IT. `configure-git-auth.sh` in
        # metacraft-labs/metacraft-github-actions installs exactly this key but
        # deliberately passes it through `$GITHUB_ENV`, which is job-scoped, so
        # on its documented path nothing should reach this file. Something on
        # these runners writes it anyway (mcl-004's copy was stamped 08:15 on
        # the day of the outage). Until that writer is found this step is a
        # mitigation, not a cure -- it runs before every checkout precisely
        # because the poison can come back.
        #
        # WHY IT IS NEVER LEGITIMATE. An `http.*.extraHeader` in a home
        # directory that is reused across jobs is a minted installation token
        # outliving the job that minted it: dead within the hour, and a live
        # secret readable by whatever runs next until then. Nothing should carry
        # one across jobs -- `configure-git-auth.sh` deliberately passes its
        # credential through `$GITHUB_ENV`, which is job-scoped, precisely so
        # this file stays clean. Anything found here is residue.
        #
        # COUNT WHAT IS REMOVED. `--unset` on a key that is not there exits
        # cleanly and reads exactly like a fix that worked, so this step reports
        # how many keys it removed and prints what is left. "removed 0" is a
        # real, reportable result: it means this host was clean and mode 1 is
        # not what broke this job.
        #
        # Credential-FREE `url.https://github.com/.insteadOf` rewrites are
        # deliberately preserved: they carry no secret, they are inert, and
        # `.gitmodules` resolution depends on them.
        run: |
          set -uo pipefail
          cfg="$HOME/.gitconfig"
          echo "cred-evict: runner=${RUNNER_NAME:-?} home=$HOME"
          if [ ! -f "$cfg" ]; then
            echo "cred-evict: removed 0 (no $cfg on this runner - nothing reusable to poison)"
            exit 0
          fi
          echo "cred-evict: inspecting $cfg"
          removed=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            case "$key" in
              http.*.extraheader|http.*.extraHeader) ;;
              url.*x-access-token*) ;;
              *) continue ;;
            esac
            echo "cred-evict:   removing '$key' (value withheld)"
            git config --file "$cfg" --unset-all "$key" 2>/dev/null || true
            git config --file "$cfg" --remove-section "${key%.*}" 2>/dev/null || true
            removed=$((removed + 1))
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          # Recount in PURE BASH. `grep` and `sed` are NOT on PATH in a raw
          # `run:` step on these nix-darwin runners -- the first version of
          # this step used `grep -ciE` here, grep exited 127, `|| true`
          # swallowed it, and the step printed "removed 1 key(s);  still
          # present" with an EMPTY count. That is precisely the failure this
          # step is supposed to be immune to: a verification that silently
          # verifies nothing and still reads like a pass. No external
          # commands in the check.
          left=0
          while IFS= read -r k; do
            case "$k" in
              *extraheader*|*extraHeader*|*x-access-token*) left=$((left + 1)) ;;
            esac
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          echo "cred-evict: removed $removed credential-bearing key(s); $left still present"
          if [ "$removed" -eq 0 ]; then
            echo "cred-evict: NOTHING FOUND - this host was already clean, mode 1 did not apply here"
          fi
          if [ "$left" -ne 0 ]; then
            echo "cred-evict: WARNING $left credential-shaped key(s) SURVIVED the sweep"
          fi
          echo "cred-evict: keys remaining in $cfg:"
          while IFS= read -r k; do echo "  $k"; done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        # Both legs drive the tests through ``nix develop`` now. On the
        # self-hosted eph-linux-x64 / aarch64-darwin runners nix is already
        # on PATH, so setup-nix is a fast no-op; it stays for hosted-runner
        # portability.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # ``just test`` -> ``test-nimsuggest`` needs the codetracer source to
        # build, which pulls in ``../isonim/src`` et al. Both legs build inside
        # the nix dev shell, so both need the siblings adjacent to this
        # checkout -- and both have Nix by the step above, which this action
        # requires to reach ``repro``.
        uses: ./.github/actions/provision-repro-lock-siblings

      # --- macOS setup ---
      # No open-coded just / Python / Rust / cargo-nextest toolchain steps and
      # no ``./non-nix-build/build.sh`` any more: the macOS leg runs the tests
      # inside codetracer's nix dev shell (``nix develop . --command just
      # test``), which provisions nim / cargo / cargo-nextest / nimsuggest from
      # /nix/store exactly like the nixos leg. ``just test`` (test-rust +
      # test-nimsuggest) builds what it needs via cargo, so no explicit
      # pre-build of the ct tree is required here.
      - name: Clone codetracer-trace-format (macOS)
        # The BEAM recorder built below transitively path-depends on
        # codetracer-trace-format / codetracer_trace_writer_nim; its build.rs
        # resolves that crate from the workspace sibling
        # ``$GITHUB_WORKSPACE/../codetracer-trace-format``. Clone it (and its
        # matched FFI half, codetracer-trace-format-nim) with the same
        # ``clone-repo`` + ``ref: dev`` pattern the nixos leg's setup-dev-env
        # uses.
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-trace-format
          # `dev` is where this repo's work lands; its default branch is
          # `stable`, and the last published workspace lock recorded
          # upstream="dev" for it.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-trace-format-nim (macOS)
        # Matched FFI half of codetracer-trace-format: the recorder's build.rs
        # hard-errors ("Nim FFI entry point not found ...
        # codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim")
        # without this sibling. Same pairing the nixos leg's setup-dev-env
        # ``siblings:`` list encodes.
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-trace-format-nim
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format-nim
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone python-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-python-recorder
          # `dev`, like the other twelve sibling clones in this workflow. This
          # was the ONLY one on `stable`, and it was the only one with no
          # comment saying why -- next to `codetracer-trace-format`, which is
          # deliberately on `dev` and says so. An unexplained outlier beside an
          # explained one is what cost the time here, so: what `dev` gives us is
          # a tree whose `requires-python` is TRUE. `stable` declares `>=3.8` in
          # both pyproject files, which this repo's own
          # `just test-python-version-alignment` correctly fails -- checks (F)
          # and (G) of 21 -- because an ABI-locked extension has a closed range
          # and the pure recorder evaluates PEP 604 unions that need 3.10+.
          # That was fixed on `dev` in 53edd25 on 2026-08-28 and never promoted.
          #
          # `dev` is also the HEALTHIER branch, which is the opposite of how the
          # two names read: at the time of writing the main `CI` workflow is
          # green on `dev@53edd25` and red on `stable@73c6f2f`.
          #
          # Revisit if `stable` starts being a release pointer something outside
          # these repos pins -- no such consumer was found in either product's
          # workflows, but absence of a reference is not proof of absence. If it
          # is, the right fix is to promote `dev` -> `stable` THERE (a merge,
          # never a force-push: `stable` holds 73c6f2f, which `dev` lacks) and
          # change this line back.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-python-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone ruby-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-ruby-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-ruby-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Build ruby-recorder native extension (macOS)
        if: matrix.platform == 'macos'
        # The clone above is NOT enough, and for a long time nothing here said
        # so. `grep -E 'rake compile|extconf|build-extension'` over `.github/`
        # returned ZERO hits: the extension was built only by
        # scripts/build-siblings.sh, which on this workflow is reached solely by
        # the LINUX ct-test-providers job. Both macOS legs cloned the recorder
        # and then ran against a tree with no compiled artefact in it.
        #
        # It failed silently rather than loudly because scripts/detect-siblings.sh
        # probed `gems/codetracer-ruby-recorder/bin/codetracer-ruby-recorder` --
        # a nine-line shim CHECKED INTO GIT at mode 100755. That test cannot
        # fail, so detection printed "(native)", its "not built" warning was
        # unreachable, and the run died much later inside
        # `CodeTracer::Native.load_extension!` requiring a file nobody had named.
        # That probe is fixed too (contract suite:
        # ci/test/detect-siblings-recorder-artifacts-test.sh); this step closes
        # the other half, because a correct detector reporting "not built" is
        # still a red job if nothing ever builds it.
        #
        # Same `nix develop --command just <target>` shape as the ct-mcr step
        # above, and for the same reason: scripts/build-siblings.sh assumes
        # direnv-allow state and a parent codetracer dev shell, neither of which
        # this runner has yet, while the sibling's own flake supplies the Rust +
        # Ruby toolchain `just build-extension` expects.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-ruby-recorder"
          nix develop --no-write-lock-file --command just build-extension

          # Assert the artefact, do not assume the exit code. `just
          # build-extension` succeeding is not the same claim as "the file the
          # loader requires now exists", and it is the second claim that the
          # Playwright and non-GUI suites depend on.
          #
          # `load_extension!` (gems/codetracer-ruby-recorder/lib/codetracer/native.rb)
          # accepts `codetracer_ruby_recorder.<RbConfig DLEXT>` or any
          # `libcodetracer_ruby_recorder.{so,bundle,dylib,dll}` beside it, which
          # it then links to the name `require` wants. On macOS DLEXT is
          # `bundle`; asserting `.so` here -- the spelling
          # scripts/build-siblings.sh used to hard-code -- would fail on every
          # green build.
          ext_dir="gems/codetracer-ruby-recorder/ext/native_tracer/target/release"
          found=""
          for cand in \
            "$ext_dir/codetracer_ruby_recorder.bundle" \
            "$ext_dir/codetracer_ruby_recorder.so" \
            "$ext_dir/libcodetracer_ruby_recorder.bundle" \
            "$ext_dir/libcodetracer_ruby_recorder.dylib" \
            "$ext_dir/libcodetracer_ruby_recorder.so"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::just build-extension reported success but produced no loadable extension in $ext_dir. Contents:"
            ls -la "$ext_dir" || echo "  (directory does not exist)"
            exit 1
          fi
          echo "ruby recorder native extension: $found"

      # ── BEAM (Erlang / Elixir) recorder ──────────────────────────────
      # ``src/db-backend/tests/erlang_flow_dap_test.rs`` and
      # ``elixir_flow_dap_test.rs`` resolve the recorder binary via
      # ``test_harness::find_beam_recorder()``: env var override →
      # ``$PATH`` → sibling ``../codetracer-beam-recorder/target/{debug,
      # release}/codetracer-beam-recorder``.  The tests ``assert!`` and
      # panic when none of those hit, so they need the recorder repo
      # cloned AND its binary compiled before ``./ci/test/non-gui.sh``
      # runs.  Same sibling-pin pattern as codetracer-native-recorder
      # (resolve-mcr-ref + clone-repo + nix-develop build).
      #
      # setup-dev-env clones the BEAM recorder + codetracer-trace-format
      # (the recorder's CTFS path-dep) adjacent to this checkout at the
      # pinned `dev` refs, replacing the former
      # Checkout-manifests / Resolve-lock / per-sibling clone-repo steps.
      # Nix is already installed by the earlier "Install Nix" step on the
      # nixos leg; setup-dev-env's nix install is idempotent.
      - name: Setup dev env (BEAM siblings, nixos)
        if: matrix.platform == 'nixos'
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          # MATCHED FFI PAIR. The "Build codetracer-beam-recorder (nixos)" step
          # below already documents that this recorder "transitively
          # path-depends on codetracer-trace-format/codetracer_trace_writer_nim"
          # -- that crate's build.rs also needs the Nim half checked out as a
          # SIBLING of codetracer-trace-format, and hard-errors without it:
          #
          #   Nim FFI entry point not found at
          #   .../codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim
          #
          # Observed via the identical path-dep from codetracer-shell-recorders
          # (run 31719867246, job 94513828226). Pinned by the
          # "codetracer-trace-format implies codetracer-trace-format-nim"
          # assertion in ci/test/sibling-provisioning-test.sh.
          siblings: |
            codetracer-beam-recorder=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev

      - name: Allow direnv in cloned codetracer-beam-recorder
        # ``elixir_flow_dap_test.rs`` / ``erlang_flow_dap_test.rs``
        # invoke ``elixirc`` / ``erlc`` through
        # ``test_harness::run_in_recorder_shell``, which routes
        # tooling through ``direnv exec <beam-recorder-root> bash -lc``
        # so the BEAM recorder's own dev shell (declaring elixir +
        # erlang + rebar3 in flake.nix) is what supplies the
        # compilers.  ``should_use_recorder_direnv`` first probes
        # ``direnv exec <repo> true`` -- on a fresh clone that probe
        # fails because the cloned ``.envrc`` is in the "blocked"
        # state, so the helper silently falls back to the bare
        # codetracer-shell PATH (which has no elixirc) and the test
        # panics with ``failed to run elixirc in recorder dev shell:
        # No such file or directory (os error 2)``.  Allow the .envrc
        # before the test runs -- same idempotent pattern as the
        # codetracer-native-recorder direnv-allow step above.
        if: matrix.platform == 'nixos'
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv allow "${{ github.workspace }}/../codetracer-beam-recorder"

      - name: Build codetracer-beam-recorder (nixos)
        # ``find_beam_recorder()`` resolves the binary at
        # ``../codetracer-beam-recorder/target/debug/codetracer-beam-recorder``
        # -- pre-build it here so the Erlang / Elixir flow DAP tests
        # don't have to bootstrap the recorder themselves.
        #
        # Use codetracer's nix dev shell (not BEAM's own) because
        # BEAM's flake only ships {cargo, elixir, erlang, rebar3,
        # rustc} and the recorder transitively path-depends on
        # ``codetracer-trace-format/codetracer_trace_writer_nim``,
        # whose build.rs panics with "failed to run `nimble`" when
        # nimble isn't on PATH.  Codetracer's shell ships the full
        # nim/nimble toolchain.
        #
        # We skip ``--locked`` because the sibling
        # codetracer-trace-format clone is pinned to a newer ref
        # than the BEAM recorder's own Cargo.lock was generated
        # against; ``cargo build`` (without --locked) regenerates
        # the lock against the checked-out source.
        #
        # ``CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL=1`` is
        # set because the trace-format-nim crate's build.rs runs
        # ``nimble install --depsOnly`` by default, and the stew
        # dependency isn't in the recorder's nimble metadata --
        # codetracer's vendored ``libs/nim-stew`` is injected via
        # ``CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS`` instead, same
        # pattern as the macos test-non-gui branch above.  rebar3
        # compile (which the recorder's ``build-native`` target
        # also does) is irrelevant for the DAP tests.
        if: matrix.platform == 'nixos'
        shell: bash
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          nix develop .#devShells.x86_64-linux.default --command bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-beam-recorder"
            cargo build
          '

      - name: Clone codetracer-beam-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-beam-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-beam-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Build codetracer-beam-recorder (macOS)
        # cargo now comes from codetracer's nix dev shell (``nix develop .``)
        # rather than a DIY rust-toolchain — same source the nixos step above
        # uses, only with the host-default aarch64-darwin shell instead of the
        # explicit x86_64-linux selector.  Codetracer's shell ships the full
        # nim / nimble toolchain the recorder's transitive
        # codetracer_trace_writer_nim build.rs needs.
        #
        # Skip the recorder's ``just build-native`` (which uses ``--locked``)
        # for the same reason as the nixos step -- the trace-format sibling is
        # checked out at a newer ref than the recorder's Cargo.lock expects.
        # ``CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL=1`` +
        # ``CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS`` inject codetracer's
        # vendored stew instead of a network ``nimble install --depsOnly``,
        # exactly as the nixos step does.
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          nix develop . --command bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-beam-recorder"
            cargo build
          '

      # Runs all Rust tests including flow integration tests for all languages.
      # WASM flow tests skip automatically if wazero or wasm32-wasip1 target
      # are not available. Stylus flow tests are #[ignore] and need a devnode.
      # Cross-repo tests (rr) run in the separate test-ui-tests-rr job.
      - name: Run tests
        run: ./ci/test/non-gui.sh
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}

  test-ui-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: nixos
            runner: eph-linux-x64-g2  # CIP-5 nix leg; H4: routed to GPU host gpu-server-002
          # CIP-5 Wave 4: the macOS leg now runs on the self-hosted nix-darwin
          # runner. The ct binary is built by codetracer's reprobuild recipe in
          # the nix dev shell (``nix develop . --command just build-once`` ->
          # ``src/build-debug-repro/bin/ct``) and the Playwright suite runs
          # inside that same dev shell, replacing the Homebrew-native
          # ``./non-nix-build/build.sh`` toolchain (brew install just /
          # setup-python / dtolnay rust-toolchain).
          - platform: macos
            runner: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    runs-on: ${{ matrix.runner }}
    # macOS tests are new and may have pre-existing failures; don't block PRs
    continue-on-error: ${{ matrix.platform == 'macos' }}
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Sweep read-only leftovers from the persistent work directory
        # MODE 3 of the self-hosted checkout outage: a gitignored
        # `non-nix-build/CodeTracer.app` staged out of the Nix store leaves 0555
        # directories in this PERSISTENT work tree, and the next job's
        # `git clean -ffdx` cannot unlink anything inside them. Full rationale,
        # the measured run, and why the source fix in
        # scripts/stage-desktop-node-modules.py does not make this redundant:
        # see the copy of this step in the `test-non-gui` job, and
        # ci/runner/sweep-readonly-leftovers.sh, with which this body is kept
        # byte-identical by ci/test/readonly-leftovers-sweep-test.sh.
        run: |
          set -uo pipefail
          shopt -s dotglob nullglob
          root="${RUNNER_WORKSPACE:-}"
          echo "ro-sweep: runner=${RUNNER_NAME:-?} root=${root:-<unset>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "ro-sweep: found 0 unwritable directory(ies) (work dir absent - fresh runner)"
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          ro_count=0
          ro_shown=0
          ro_blind=0
          # Directory-only recursion via a trailing-slash glob, so bash never has to test
          # the tens of thousands of regular files one at a time. `"$d"/*/` also matches
          # symlinks TO directories; those are skipped, because following them leaves the
          # work directory (these checkouts link into /nix/store) and a store path is not
          # ours to chmod.
          scan() {
            local d="$1" e p
            for e in "$d"/*/; do
              p="${e%/}"
              # `[ -L "$p" ] && continue` would be shorter and WRONG: GitHub runs `run:`
              # blocks under `bash -e`, where a bare `A && B` list that evaluates false is
              # a fatal command. Every branch here is a condition, never a bare list.
              if [ -L "$p" ]; then
                continue
              fi
              if [ ! -r "$p" ] || [ ! -x "$p" ]; then
                ro_blind=$((ro_blind + 1))
                continue
              fi
              if [ ! -w "$p" ]; then
                ro_count=$((ro_count + 1))
                if [ "$ro_shown" -lt 10 ]; then
                  ro_shown=$((ro_shown + 1))
                  echo "ro-sweep:   unwritable $p"
                fi
              fi
              scan "$p"
            done
            return 0
          }
          scan "$root"
          before="$ro_count"
          echo "ro-sweep: found $before unwritable directory(ies) under $root ($ro_blind unreadable)"
          if [ "$before" -eq 0 ]; then
            echo "ro-sweep: NOTHING FOUND - this host was already clean, mode 3 did not apply here"
            exit 0
          fi
          # Prove the tool exists before claiming it worked: a `chmod` that is not on
          # PATH exits 127, and a `|| true` would turn that into a silent pass.
          chmod_bin="$(command -v chmod 2>/dev/null || true)"
          if [ -z "$chmod_bin" ]; then
            for candidate in /bin/chmod /usr/bin/chmod /run/current-system/sw/bin/chmod; do
              if [ -x "$candidate" ]; then
                chmod_bin="$candidate"
                break
              fi
            done
          fi
          if [ -z "$chmod_bin" ]; then
            echo "ro-sweep: FATAL no chmod on PATH and none at /bin/chmod;" \
              "$before directory(ies) CANNOT be fixed" >&2
            exit 1
          fi
          echo "ro-sweep: using $chmod_bin"
          "$chmod_bin" -R u+w "$root" 2>/dev/null || true
          ro_count=0
          ro_shown=0
          ro_blind=0
          scan "$root"
          after="$ro_count"
          echo "ro-sweep: after chmod -R u+w: $after unwritable directory(ies) remain"
          echo "ro-sweep: RESTORED owner-write on $((before - after)) directory(ies)"
          if [ "$after" -ne 0 ]; then
            echo "ro-sweep: WARNING $after directory(ies) are not owned by the runner user;" \
              "checkout will still fail to clean them"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # MODE 1 of the self-hosted checkout outage. A stale, owner-scoped
        # `http.https://github.com/metacraft-labs/.extraHeader` left in the
        # runner's reused `~/.gitconfig` OUTRANKS the fresh broader header
        # actions/checkout installs (git matches `http.<url>.*` by longest URL
        # prefix), so checkout authenticates with a dead token, GitHub answers
        # 401, and git dies on `could not read Username`. checkout COPIES
        # `$HOME/.gitconfig` into its temp HOME, so this file is live during the
        # failing fetch. Full rationale, the reproduction, and why this targets
        # the file by path rather than via `--global`: see the copy of this step
        # in the `test-non-gui` job.
        run: |
          set -uo pipefail
          cfg="$HOME/.gitconfig"
          echo "cred-evict: runner=${RUNNER_NAME:-?} home=$HOME"
          if [ ! -f "$cfg" ]; then
            echo "cred-evict: removed 0 (no $cfg on this runner - nothing reusable to poison)"
            exit 0
          fi
          echo "cred-evict: inspecting $cfg"
          removed=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            case "$key" in
              http.*.extraheader|http.*.extraHeader) ;;
              url.*x-access-token*) ;;
              *) continue ;;
            esac
            echo "cred-evict:   removing '$key' (value withheld)"
            git config --file "$cfg" --unset-all "$key" 2>/dev/null || true
            git config --file "$cfg" --remove-section "${key%.*}" 2>/dev/null || true
            removed=$((removed + 1))
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          # Recount in PURE BASH. `grep` and `sed` are NOT on PATH in a raw
          # `run:` step on these nix-darwin runners -- the first version of
          # this step used `grep -ciE` here, grep exited 127, `|| true`
          # swallowed it, and the step printed "removed 1 key(s);  still
          # present" with an EMPTY count. That is precisely the failure this
          # step is supposed to be immune to: a verification that silently
          # verifies nothing and still reads like a pass. No external
          # commands in the check.
          left=0
          while IFS= read -r k; do
            case "$k" in
              *extraheader*|*extraHeader*|*x-access-token*) left=$((left + 1)) ;;
            esac
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          echo "cred-evict: removed $removed credential-bearing key(s); $left still present"
          if [ "$removed" -eq 0 ]; then
            echo "cred-evict: NOTHING FOUND - this host was already clean, mode 1 did not apply here"
          fi
          if [ "$left" -ne 0 ]; then
            echo "cred-evict: WARNING $left credential-shaped key(s) SURVIVED the sweep"
          fi
          echo "cred-evict: keys remaining in $cfg:"
          while IFS= read -r k; do echo "  $k"; done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env (nix) installs Nix via the shared setup-nix (a fast
        # no-op on the self-hosted eph-linux-x64 / aarch64-darwin runners,
        # where nix is already on PATH) and clones the cross-repo siblings
        # adjacent to this checkout (``../<name>``) at their pinned `dev` refs.
        # This replaces the former Checkout-manifests / Resolve-lock /
        # per-sibling clone-repo steps (both legs) and the nixos ``Install Nix``
        # (setup-nix). Nix is provisioned here for both the macOS sibling
        # ``nix develop`` builds and the ct build + Playwright run, which now
        # all go through codetracer's dev shell.
        #
        # ``runquota`` is listed because the macOS leg runs ``just build-once``
        # and `ct` imports ``runquota_process`` through
        # src/ct_test/process_exec.nim. On Darwin build-once selects the
        # reprobuild driver, which could resolve runquota from its nix flake
        # input alone -- but scripts/require-siblings.sh requires the checkout
        # on every driver so there is a single workspace-completeness rule (the
        # tup driver has no other way in; see the notes in that script).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          nix-develop-args: '.?submodules=1'
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            codetracer-native-recorder=dev
            nim-stackable-hooks=dev
            codetracer-visual-replay=dev
            codetracer-native-backend=dev
            runquota=dev

      - name: Stage codetracer-trace-format into libs/
        # The nix flake build below overrides the codetracer-trace-format input
        # with the in-repo path ./libs/codetracer-trace-format; mirror the
        # sibling clone (placed at ../codetracer-trace-format by
        # setup-dev-env) there.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      # --- NixOS setup ---

      - name: Stage codetracer-trace-format-nim into libs/
        # codetracer-trace-format and codetracer-trace-format-nim are a MATCHED
        # PAIR across an FFI boundary, and must move together or not at all.
        # `codetracer-trace-format/codetracer_trace_writer_nim/src/lib.rs` is the
        # Rust caller; `codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim`
        # is the Nim provider. Overriding only the first one links the newer
        # caller against the older provider:
        #
        #   libcodetracer_trace_writer_nim...rcgu.o: in function
        #     `codetracer_trace_writer_nim::NimTraceReaderHandle::event_metadata':
        #     undefined reference to `ct_reader_event_metadata'
        #   error: could not compile `replay-server` (bin "replay-server")
        #
        # `ct_reader_event_metadata` was added to the Nim side on 2026-08-07;
        # flake.lock pins that repo at 839ed880 (2026-06-24), which does not
        # define it.
        #
        # This is what the per-commit workspace lock was actually buying: not a
        # pinned SHA, but COORDINATION across repos -- it moved both halves to
        # one consistent revision. Pinning each sibling independently to `dev`
        # keeps them current and loses that coordination, so the pair has to be
        # overridden together, explicitly.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format-nim"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format-nim"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      - name: Build CodeTracer (nix)
        if: matrix.platform == 'nixos'
        run: nix build --print-build-logs '.?submodules=1#codetracer' --override-input codetracer-trace-format path:./libs/codetracer-trace-format --override-input codetracer-trace-format-nim path:./libs/codetracer-trace-format-nim

      # --- macOS setup ---
      # The macOS leg now builds the ct binary with codetracer's reprobuild
      # recipe inside the nix dev shell and runs the Playwright suite in that
      # same shell (see the "Build CodeTracer (nix dev shell)" step and
      # ``./ci/test/ui-tests-db.sh`` below). just / nim / cargo / node /
      # Playwright all come from ``nix develop .``; the former open-coded brew
      # install just / setup-python / dtolnay rust-toolchain steps are gone.
      - name: Provision dependency siblings from repro.lock
        # codetracer's ``config.nims`` adds ``../isonim/src`` and the four
        # nim-* sibling sources to the Nim search path.  Without them the
        # frontend build aborts with ``cannot open file:
        # isonim/core/async_compat``.  Reuse the composite action
        # the Linux jobs already use.  ``Setup dev env`` above carries
        # ``env-flavor: nix``, so the dev shell this action reaches ``repro``
        # through is available by now.
        #
        # NO LONGER GATED TO macOS, and the comment above is why: the nixos leg
        # needs the same five sources for the same reason, and it was dying of
        # the very error this step's own note quotes. Run 33809372477, job
        # 100828216515 (test-ui-tests, nixos eph-linux-x64-g2):
        #
        #     src/frontend/storybook_components.nim(11, 19)
        #     Error: cannot open file: isonim/core/async_compat
        #     error: Recipe `build-storybook-components` failed ...
        #     error: Recipe `test-gui-prebuilt` failed with exit code 1
        #
        # The `siblings:` block in `Setup dev env` above carries
        # trace-format, trace-format-nim, native-recorder, nim-stackable-hooks,
        # visual-replay, native-backend and runquota -- and no isonim, because
        # isonim is not resolvable from the workspace lock (the `codetracer`
        # project in metacraft-manifests does not declare it). repro.lock is
        # what answers for it, which is exactly what this action reads.
        uses: ./.github/actions/provision-repro-lock-siblings

      # NOTE: codetracer-trace-format, codetracer-trace-format-nim,
      # codetracer-native-recorder, nim-stackable-hooks, codetracer-visual-replay and
      # codetracer-native-backend are now cloned adjacent to this checkout
      # (``../<name>``) at their pinned `dev` refs by the
      # ``Setup dev env`` step above. The macOS cargo path deps
      # (``../../../codetracer-trace-format/...``), the trace-format-nim FFI
      # entry point, the native-recorder canonicalize, the ct_cli
      # ``gfx_stream/ctfs_visual`` import and the build-license-ffi recipe all
      # resolve against those clones, so the former per-sibling resolve/clone
      # steps (and the trace-format symlink) are no longer needed.

      - name: Clone codetracer-snapshot-codecs sibling (macOS)
        if: matrix.platform == 'macos'
        # codetracer-visual-replay's config.nims threads
        # ``--path:../codetracer-snapshot-codecs/src`` into the Nim
        # compile.  The build aborts with ``cannot open file:
        # snapshot_codecs`` without this checkout.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-snapshot-codecs
          ref: dev
          path: ${{ github.workspace }}/../codetracer-snapshot-codecs
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-image-diff sibling (macOS)
        if: matrix.platform == 'macos'
        # Companion sibling to codetracer-snapshot-codecs threaded via
        # the same ``config.nims`` --path; without it ST-M3 test
        # imports break the visual-replay build.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-image-diff
          ref: dev
          path: ${{ github.workspace }}/../codetracer-image-diff
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      # NOTE: Nix is installed by the ``Setup dev env`` step above (a fast
      # no-op on the self-hosted aarch64-darwin runner, where nix is already
      # on PATH). The former bespoke ``Install Nix (macOS, for ct_cli build)``
      # step is therefore no longer needed; the visual-replay sibling builds
      # below still drive each sibling's own ``nix develop`` flake.

      - name: Build ct-mcr via codetracer-native-recorder nix develop (macOS)
        if: matrix.platform == 'macos'
        # The macOS Playwright suite needs ct_cli/ct_cli built from
        # the codetracer-native-recorder sibling.  Use the recorder's
        # own ``nix develop`` shell + its ``just build-ct-mcr`` target
        # so the recipe is single-sourced in the sibling's Justfile
        # (canonical pattern from
        # metacraft-dev-guidelines/policies/ci-workflow-standards.md
        # "Building artifacts from sibling repos").
        #
        # We bypass scripts/build-siblings.sh because that script
        # assumes direnv-allow state and a parent codetracer dev shell
        # that supplies nim/nimble.  On this runner none of those
        # preconditions hold yet -- ``nix develop`` invokes the recorder's
        # flake directly and supplies the same Nim/Rust/LLDB toolchain
        # the recipe expects, without the direnv allow state plumbing.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-native-recorder"
          # Cargo's default libgit2 transport does not read gitconfig, so the
          # git CLI has to be forced for the private ``lldb-sys.rs``
          # dependency. The CREDENTIAL it then uses is already installed
          # job-wide by ``Setup dev env`` above, so nothing is configured here.
          #
          # That step runs the shared ``setup-nix``, which exports
          #
          #   GIT_CONFIG_KEY_0=http.https://github.com/metacraft-labs/.extraHeader
          #
          # through $GITHUB_ENV. Four things make it sufficient here, and each
          # was checked rather than assumed:
          #
          #   * ``Setup dev env`` is unconditional on this job -- it is not
          #     gated on ``matrix.platform`` -- so the macOS leg gets it too.
          #   * ``lldb-sys.rs`` lives at github.com/metacraft-labs/lldb-sys.rs,
          #     and git matches ``http.<url>.*`` by scheme + host + port +
          #     slash-delimited path prefix, so the metacraft-labs scope covers
          #     it (and nothing outside the org).
          #   * GIT_CONFIG_COUNT/KEY_n/VALUE_n are ordinary environment
          #     variables, so they survive ``nix develop --command`` into
          #     cargo's child git processes. Verified directly: inside a
          #     ``nix develop`` shell, ``git config --get-all`` resolves the
          #     header from the environment alone.
          #   * The same scoped-header + git-CLI combination already fetches
          #     this exact dependency in ``visual-replay-regression-gate``,
          #     which builds its own per-repo header and neutralises
          #     ~/.gitconfig entirely.
          #
          # What used to be here was a GLOBAL catch-all rewriting every
          # github.com URL to carry the token as userinfo. Unlike a
          # per-checkout local header, ``--global`` config IS inherited by
          # ``git clone``, and it put the token into argv, into the
          # ``.git/config`` of every clone it touched, and into git's own error
          # messages -- for nixpkgs and every third-party fetch as well, none of
          # which the token is for. ``setup-nix`` evicts exactly that pattern
          # from a reused ~/.gitconfig at the start of the job; re-adding it
          # here put it straight back.
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          # ``just build-ct-mcr`` ad-hoc-signs ct_cli with its record/debug
          # entitlements, and the ONLY ``codesign`` on a macOS host is the
          # system one at /usr/bin/codesign -- no nixpkgs input in the
          # recorder's devShell provides that command.
          #
          # ``nix develop`` does not replace PATH, it PREPENDS the devShell's
          # store paths and keeps the ambient PATH as the tail.  MEASURED on an
          # aarch64-darwin host: inside the recorder's own ``nix develop``,
          # ``command -v codesign`` resolves to /usr/bin/codesign purely via
          # that inherited tail, while ``otool``/``install_name_tool`` resolve
          # into the nix store (cctools).  So codesign's availability is a
          # property of the AMBIENT PATH, not of the flake.
          #
          # On these nix-darwin self-hosted runners the PATH a raw ``run:``
          # step inherits does NOT contain /usr/bin, so the tail is deficient
          # and the recipe died with ``codesign: command not found`` (exit
          # 127).  It is not a compile error -- the Nim build above it
          # succeeds; everything printed before it is warnings.  Appending
          # /usr/bin restores exactly the tail a developer's shell supplies.
          #
          # APPEND, never prepend: the devShell's toolchain must keep winning
          # for git/python/clang etc.  This only has to make reachable the one
          # command that exists nowhere else.
          PATH="$PATH:/usr/bin" \
            nix develop --no-write-lock-file --command just build-ct-mcr

      - name: Build ct_gfx_player via codetracer-visual-replay nix develop (macOS)
        if: matrix.platform == 'macos'
        # The Playwright suite's visual-replay specs
        # ``requireExecutable(ct_gfx_player)`` at module-load time.
        # ``codetracer-visual-replay``'s ``just build`` target wraps
        # ``nimble build`` and emits ct_gfx_player + ct-native-replay
        # at the repo root, which is where
        # ``src/tests/gui/lib/real-visual-trace.ts`` expects them.
        # Same direct ``nix develop --command`` pattern as ct-mcr.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-visual-replay"
          nix develop --no-write-lock-file --command just build

      - name: Build CodeTracer (nix dev shell)
        if: matrix.platform == 'macos'
        # Toolchain-free reprobuild build inside codetracer's nix dev shell,
        # the same path ``dmg-build`` uses on this runner. On Darwin
        # ``scripts/build-once.sh`` selects the reprobuild driver (``repro`` +
        # ``runquotad`` are both provisioned by ``nix develop .``) and emits the
        # ct binary at ``src/build-debug-repro/bin/ct`` — the path
        # ``ci/test/ui-tests-db.sh`` points ``CODETRACER_E2E_CT_PATH`` at. The
        # in-repo ``libs/codetracer-trace-format{,-nim}`` staged above feed the
        # recipe; no ``--override-input`` is needed for the tup/reprobuild dev
        # build. Replaces the old Homebrew ``./non-nix-build/build.sh``.
        #
        # The `repro daemon stop` is a de-poisoning step, not hygiene. The
        # repro user daemon is PERSISTENT and its endpoint is deliberately
        # stable across nix-develop sessions, so one daemon serves every job on
        # a runner indefinitely. On macOS it is started via launchd, and when
        # that fails it falls back to a plain fork+setsid that never does the
        # `chdir("/")` step of daemonising -- so it inherits the cwd of
        # whichever `repro build` first spawned it. When that cwd was an
        # ephemeral dir (a `nix develop` TMPDIR, or the reprobuild smoke test's
        # `mktemp -d`, both of which are deleted afterwards), the surviving
        # daemon is left holding a deleted directory, and EVERY later
        # `repro build` on that runner dies in `getCurrentDir()` with
        #
        #     daemon-hosted build failed: No such file or directory
        #
        # -- which is what killed this step, in a DIFFERENT job from the one
        # that poisoned the runner. Reproduced locally: spawn the daemon from
        # dir A via the fork path, `rm -rf A`, then build from dir B and it
        # fails exactly so.
        #
        # Stopping first makes the next build spawn a daemon whose cwd is this
        # checkout, which persists for the life of the job, so this step does
        # not re-poison the runner either. `|| true` because a runner with no
        # daemon yet is the normal case, not an error.
        #
        # The durable fix is upstream in reprobuild (add the missing
        # `chdir("/")` in the fork path, and make the daemon tolerate a
        # vanished cwd); this only stops codetracer's jobs being the victim.
        #
        # PATH gets /usr/bin for the same reason the ct-mcr step above does,
        # and this is the second confirmed instance of that one root cause.
        # With the daemon de-poisoned, `repro build` runs the real graph and
        # 41 of its 42 actions succeed; the `dmg` action then dies with
        #
        #     repro build: action failed: dmg (exit code 127)
        #     .../create-dmg: line 16: sw_vers: command not found
        #
        # Exit 127 is command-not-found, and `sw_vers` exists ONLY at
        # /usr/bin/sw_vers -- no nixpkgs input provides it. repro's own log
        # confirms the mechanism: `PATH: 0 hermetic (keyed by value), 22
        # inherited (passthrough)`, so every action inherits this step's PATH,
        # and on a nix-darwin self-hosted runner that PATH has no /usr/bin.
        # Appending it is what a developer's shell supplies. APPEND, never
        # prepend, so the devShell toolchain keeps winning.
        run: |
          set -euo pipefail
          export PATH="$PATH:/usr/bin"
          nix develop . --command repro daemon stop >/dev/null 2>&1 || true
          nix develop . --command just build-once

      - name: Clone python-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-python-recorder
          # `dev`, like the other twelve sibling clones in this workflow. This
          # was the ONLY one on `stable`, and it was the only one with no
          # comment saying why -- next to `codetracer-trace-format`, which is
          # deliberately on `dev` and says so. An unexplained outlier beside an
          # explained one is what cost the time here, so: what `dev` gives us is
          # a tree whose `requires-python` is TRUE. `stable` declares `>=3.8` in
          # both pyproject files, which this repo's own
          # `just test-python-version-alignment` correctly fails -- checks (F)
          # and (G) of 21 -- because an ABI-locked extension has a closed range
          # and the pure recorder evaluates PEP 604 unions that need 3.10+.
          # That was fixed on `dev` in 53edd25 on 2026-08-28 and never promoted.
          #
          # `dev` is also the HEALTHIER branch, which is the opposite of how the
          # two names read: at the time of writing the main `CI` workflow is
          # green on `dev@53edd25` and red on `stable@73c6f2f`.
          #
          # Revisit if `stable` starts being a release pointer something outside
          # these repos pins -- no such consumer was found in either product's
          # workflows, but absence of a reference is not proof of absence. If it
          # is, the right fix is to promote `dev` -> `stable` THERE (a merge,
          # never a force-push: `stable` holds 73c6f2f, which `dev` lacks) and
          # change this line back.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-python-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone ruby-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-ruby-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-ruby-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Build ruby-recorder native extension (macOS)
        if: matrix.platform == 'macos'
        # The clone above is NOT enough, and for a long time nothing here said
        # so. `grep -E 'rake compile|extconf|build-extension'` over `.github/`
        # returned ZERO hits: the extension was built only by
        # scripts/build-siblings.sh, which on this workflow is reached solely by
        # the LINUX ct-test-providers job. Both macOS legs cloned the recorder
        # and then ran against a tree with no compiled artefact in it.
        #
        # It failed silently rather than loudly because scripts/detect-siblings.sh
        # probed `gems/codetracer-ruby-recorder/bin/codetracer-ruby-recorder` --
        # a nine-line shim CHECKED INTO GIT at mode 100755. That test cannot
        # fail, so detection printed "(native)", its "not built" warning was
        # unreachable, and the run died much later inside
        # `CodeTracer::Native.load_extension!` requiring a file nobody had named.
        # That probe is fixed too (contract suite:
        # ci/test/detect-siblings-recorder-artifacts-test.sh); this step closes
        # the other half, because a correct detector reporting "not built" is
        # still a red job if nothing ever builds it.
        #
        # Same `nix develop --command just <target>` shape as the ct-mcr step
        # above, and for the same reason: scripts/build-siblings.sh assumes
        # direnv-allow state and a parent codetracer dev shell, neither of which
        # this runner has yet, while the sibling's own flake supplies the Rust +
        # Ruby toolchain `just build-extension` expects.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-ruby-recorder"
          nix develop --no-write-lock-file --command just build-extension

          # Assert the artefact, do not assume the exit code. `just
          # build-extension` succeeding is not the same claim as "the file the
          # loader requires now exists", and it is the second claim that the
          # Playwright and non-GUI suites depend on.
          #
          # `load_extension!` (gems/codetracer-ruby-recorder/lib/codetracer/native.rb)
          # accepts `codetracer_ruby_recorder.<RbConfig DLEXT>` or any
          # `libcodetracer_ruby_recorder.{so,bundle,dylib,dll}` beside it, which
          # it then links to the name `require` wants. On macOS DLEXT is
          # `bundle`; asserting `.so` here -- the spelling
          # scripts/build-siblings.sh used to hard-code -- would fail on every
          # green build.
          ext_dir="gems/codetracer-ruby-recorder/ext/native_tracer/target/release"
          found=""
          for cand in \
            "$ext_dir/codetracer_ruby_recorder.bundle" \
            "$ext_dir/codetracer_ruby_recorder.so" \
            "$ext_dir/libcodetracer_ruby_recorder.bundle" \
            "$ext_dir/libcodetracer_ruby_recorder.dylib" \
            "$ext_dir/libcodetracer_ruby_recorder.so"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::just build-extension reported success but produced no loadable extension in $ext_dir. Contents:"
            ls -la "$ext_dir" || echo "  (directory does not exist)"
            exit 1
          fi
          echo "ruby recorder native extension: $found"

      - name: Clone codetracer-js-recorder sibling
        # NOT gated to macOS, unlike the two clones above, and not for symmetry
        # -- the suite below needs this on both legs and neither leg has it.
        #
        # `test-ui-tests` died here on 2026-09-03, run 33809372477, job
        # 100828216608 (macos, aarch64-darwin):
        #
        #     Error: codetracer-js-recorder not found; set
        #     CODETRACER_JS_RECORDER_PATH or build the sibling repo
        #     (npm run build).
        #     Error: could not record the cross-process demo from this tree
        #     (scripts/materialize-recording.sh exited 1).
        #
        # repeated for every recording the Playwright suite materialises. Those
        # recordings are PRODUCED, not committed, so there is no stale copy to
        # fall back on and the whole DB-based lane fails at its first fixture.
        #
        # `viewmodel-tests` clones this same sibling (see the step of the same
        # name in that job) precisely because its recorder-gated suites cannot
        # resolve `../codetracer-js-recorder/packages/cli/dist/index.js`
        # otherwise. This job runs `ci/test/ui-tests-db.sh`, which reaches the
        # same materialiser, and simply never had the step. The nixos leg's
        # `siblings:` block does not carry it either -- that leg fails earlier,
        # in the storybook build, so its need for the recorder has never been
        # reached, let alone reported.
        #
        # `dev` is that repo's default branch and `main` trails it, which is
        # the ref `viewmodel-tests` settled on for the same reason.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-js-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-js-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Build codetracer-js-recorder sibling
        # The clone above landed without a build, and the clone alone does not
        # satisfy what needs it. scripts/materialize-recording.sh resolves
        # `$JS_RECORDER_ROOT/packages/cli/dist/index.js` and hard-fails with
        #
        #     codetracer-js-recorder is not built (…/packages/cli/dist/index.js;
        #     run 'just build' there)
        #
        # `dist/` is PRODUCED, never committed, so there is no stale copy to
        # fall back on. In this workflow `npm run build` appeared only inside
        # the comment on the clone step -- the string occurs nowhere in any
        # `run:` block -- so the fix for "test-ui-tests never cloned the JS
        # recorder" stopped one step short of making the suite pass.
        #
        # NOT gated on macOS, matching the clone above: both legs materialise
        # recordings through the same script.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-js-recorder"
          nix develop --no-write-lock-file --command just build

          # The artefact materialize-recording.sh actually opens, asserted by
          # the same name it uses. A built-looking tree with no dist/index.js
          # fails later, inside a Playwright fixture, as a suite-wide timeout.
          if [ ! -f packages/cli/dist/index.js ]; then
            echo "::error::just build reported success but packages/cli/dist/index.js is missing; scripts/materialize-recording.sh will fail on every recording."
            ls -la packages/cli/dist 2>/dev/null || echo "  (packages/cli/dist does not exist)"
            exit 1
          fi
          echo "js recorder CLI: $(pwd)/packages/cli/dist/index.js"

      # The browser-only stylesheet guards, ahead of the full suite because
      # they cost seconds and answer for the regressions these surfaces have
      # actually shipped: the footer going tabs-only (b27da3947, 51a3e820e,
      # 00fd68b7f), the footer painting its readouts at 1.22:1, and the BUILD
      # output panel painting its lines at 1.42:1 on the web and 1.05:1 under
      # Electron. Every one of those surfaced -- when it surfaced at all -- as
      # a suite-wide timeout an hour into the run, or as a user report weeks
      # after release. See ci/test/css-contrast-guards.sh.
      - name: Stylesheet guards (footer visibility + contrast, build panel contrast)
        run: ./ci/test/css-contrast-guards.sh
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}

      - name: Run TypeScript Playwright UI tests (DB-based only)
        run: ./ci/test/ui-tests-db.sh
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}
          CODETRACER_DB_TESTS_ONLY: "1"

      # Named separately from the suite above, which already contains it, so a
      # regression here is attributable from the job list without reading a
      # full Playwright report. The two assertions are the Event Log's
      # contract: its rows do not change when the reader moves, and a move
      # relocates only the dimming boundary
      # (`GUI/Core-Panes/Event-Log-Pane.md` § "What a move changes, and what it
      # does not"). It runs `always()` for the same reason it exists — the
      # failure it guards against, the pane emptying after a jump, is one a
      # reader hits immediately, so it should be reported even when an earlier
      # spec in the suite has already gone red.
      - name: Event Log stays static across a jump
        if: always()
        run: ./ci/test/ui-tests-db.sh tests/event-log/event_log_is_static_across_jumps.spec.ts
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}
          CODETRACER_DB_TESTS_ONLY: "1"

  test-ui-tests-rr:
    # ROUTED to the GPU hosts (H4). The earlier hold on this job -- "the GPU
    # hosts are hybrid i9-12900Ks, so unpinned rr is a core-type lottery" --
    # was wrong, and rr's own source says so: rr already confines itself to
    # the P-cores without being asked.
    #
    #   * RecordCommand.cc:214 -- RecordFlags' default is
    #     `bind_cpu(BindCPU::PREFER_PERF_CORE)`. Not ANY, not UNBOUND.
    #   * util.cc:2166 -- choose_cpu() calls filter_for_perf_cores(cpus) for
    #     that mode, and util.cc:2075-2081 keeps only CPUs whose CPUGroup kind
    #     is P_CORE (CPUs.cc:106-112 maps /sys/devices/cpu_core -> P_CORE and
    #     cpu_atom -> E_CORE).
    #   * The chosen P-core is then recorded as the bound CPU
    #     (RecordSession.cc:2579) and Session::do_bind_cpu (Session.cc:768)
    #     sets affinity to it, so PerfCounters only ever sees a P-core PMU.
    #   * PerfCounters.cc:216 -- "For hybrid products the data in this table is
    #     for the P-cores of that product", i.e. the P-core PMU is the one rr's
    #     counter table is written against.
    #
    # There is no "unpinned" path here to lose the lottery on: rr's UNBOUND
    # mode is a hard CLEAN_FATAL on multi-PMU systems (PerfCounters.cc:325,
    # "Multiple PMU types detected. Unbinding CPU is not supported."), and
    # nothing on this job's path asks for it -- codetracer-native-backend's
    # record_program_with_rr (src/record.rs:153-167) spawns
    # `rr record [-W] -n -o <dir> ...` with no --bind-to-cpu and no -u, and
    # codetracer's own E-core workaround (src/common/intel_fix.nim,
    # workaroundIntelECoreProblem) is `discard` -- dead since rr fixed this
    # upstream. The E-core abort the probe saw was manufactured by the probe
    # explicitly binding to an E-core; that is not what CI does.
    #
    # The one host-side precondition is that the guest exposes
    # /sys/devices/cpu_core and cpu_atom, or cpu_groups() comes back empty and
    # the filter no-ops. Both GPU guests do expose them -- that was measured
    # when the hold was written.
    runs-on: eph-linux-x64-g2  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    timeout-minutes: 120
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones codetracer-trace-format adjacent to this checkout at the
        # pinned `dev` ref, replacing the former
        # Checkout-manifests / Resolve-lock / clone-repo / Install Nix steps.
        # The flake build below reads the in-repo path
        # libs/codetracer-trace-format, so the sibling clone is mirrored
        # there by the next step.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev

      - name: Stage codetracer-trace-format into libs/
        # The flake override below points at ./libs/codetracer-trace-format;
        # mirror the sibling clone there.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"


      - name: Stage codetracer-trace-format-nim into libs/
        # codetracer-trace-format and codetracer-trace-format-nim are a MATCHED
        # PAIR across an FFI boundary, and must move together or not at all.
        # `codetracer-trace-format/codetracer_trace_writer_nim/src/lib.rs` is the
        # Rust caller; `codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim`
        # is the Nim provider. Overriding only the first one links the newer
        # caller against the older provider:
        #
        #   libcodetracer_trace_writer_nim...rcgu.o: in function
        #     `codetracer_trace_writer_nim::NimTraceReaderHandle::event_metadata':
        #     undefined reference to `ct_reader_event_metadata'
        #   error: could not compile `replay-server` (bin "replay-server")
        #
        # `ct_reader_event_metadata` was added to the Nim side on 2026-08-07;
        # flake.lock pins that repo at 839ed880 (2026-06-24), which does not
        # define it.
        #
        # This is what the per-commit workspace lock was actually buying: not a
        # pinned SHA, but COORDINATION across repos -- it moved both halves to
        # one consistent revision. Pinning each sibling independently to `dev`
        # keeps them current and loses that coordination, so the pair has to be
        # overridden together, explicitly.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format-nim"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format-nim"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      - name: Build CodeTracer
        run: nix build --print-build-logs '.?submodules=1#codetracer' --override-input codetracer-trace-format path:./libs/codetracer-trace-format --override-input codetracer-trace-format-nim path:./libs/codetracer-trace-format-nim

      - name: Setup rr-backend
        # `ci/setup-rr-backend.sh` resolves codetracer-native-backend's revision
        # from `$RR_BACKEND_REF` first and otherwise from the workspace lock via
        # `scripts/resolve-sibling-rev.sh`. That second route cannot work on a
        # runner: the resolver locates the locks/ tree by walking up for a
        # `.repro/manifests` or `.repo/manifests` directory, and a CI checkout
        # has neither (nothing sets `$CT_MANIFEST_DIR` here either), so it exits
        # 3 with "cannot locate the manifest repo locks/ tree" -- the same
        # lock dependency the `siblings:` entries above were pinned to avoid,
        # reached one step later. Take the documented explicit override, which
        # keeps the script's lock path intact for workspace use.
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
          RR_BACKEND_REF: dev
        run: ./ci/setup-rr-backend.sh

      - name: Run TypeScript Playwright UI tests (RR-based only)
        env:
          CODETRACER_E2E_CT_PATH: ${{ github.workspace }}/result/bin/ct
          CODETRACER_RR_BACKEND_PATH: ${{ github.workspace }}/../codetracer-native-backend
          CODETRACER_RR_BACKEND_PRESENT: "1"
          CODETRACER_RR_TESTS_ONLY: "1"
          PLAYWRIGHT_GLOBAL_TIMEOUT: "10800000"
        run: "nix develop .#devShells.x86_64-linux.default --command just test-gui"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-tests-rr-artifacts
          path: |
            tsc-ui-tests/test-results/
            tsc-ui-tests/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  visual-replay-regression-gate:
    # Visual-replay specs cross-validate HW rasterisation (gfx-real, the
    # Vulkan / OpenGL output the user actually sees) against SW
    # rasterisation (lavapipe), then diff at the pixel level.  Without
    # a real GPU the HW path silently swrasts and the diff degenerates
    # to comparing lavapipe-against-lavapipe -- the gate's whole point
    # disappears.  Pin to runners with the ``gpu`` label so jobs only
    # land on hosts with usable Vulkan / GL drivers (each gpu-server
    # carries 2x RTX 3090; see metacraft-labs/infra
    # services/github-runners/common.nix).
    # EXEMPTION (CIP-5): GPU runner -> kept persistent [self-hosted, gpu]; the HW
    # rasterisation vs lavapipe visual gate needs a real GPU (2x RTX 3090), which
    # the ephemeral eph-linux-x64 class has no access to. 5-platform matrix N/A.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          skip-token-revoke: false

      - name: Sweep stale git lock files from the persistent work directory
        # MODE 2 of the self-hosted checkout outage. gpu-server-001-mcl-002 is
        # a PERSISTENT runner: $RUNNER_WORKSPACE and the repo inside it survive
        # between jobs. A job killed mid-fetch leaves git's `*.lock` sentinels
        # behind, and the NEXT job's checkout dies before any product code runs:
        #
        #   fatal: Unable to create
        #   '.../codetracer/.git/modules/libs/nim-faststreams/shallow.lock':
        #   File exists.
        #   fatal: Fetched in submodule path 'libs/nim-faststreams', but it did
        #   not contain 37a18315... Direct fetching of that commit failed.
        #
        # `clean: true` on actions/checkout does not help: `git clean -ffdx`
        # removes untracked files in the WORKTREE and never touches `.git`.
        #
        # COUNT WHAT IS REMOVED. `rm -f` on a path that no longer exists exits
        # 0 and reads exactly like a sweep that worked; this campaign has been
        # misled by silent no-op cleanups more than once. So this step prints
        # how many locks it found, names each one, and re-counts afterwards. A
        # run where the sweep found 0 is a run where this was NOT the cause,
        # and the log says so plainly instead of implying success.
        #
        # Only locks older than 60 minutes are swept: a fresh lock could belong
        # to a concurrent job on the same host, and deleting a live lock would
        # manufacture the corruption this step exists to clear.
        #
        # AND ONLY GIT'S OWN LOCKS. The first version matched `-name '*.lock'`
        # anywhere under the work directory, which is a very different thing
        # from what the prose above describes. Measured on run 33734457928, job
        # 100581651054, gpu-server-002-mcl-001: of the 42 files it deleted, the
        # ones it named first were
        #
        #   codetracer-trace-format/Cargo.lock
        #   codetracer-trace-format/flake.lock
        #   nim-agents/repro.lock
        #   isonim/src/isonim/layout/yoga/yarn.lock
        #
        # — the PINS of the sibling checkouts, not git sentinels. A sweep meant
        # to unblock checkout was quietly unpinning the build. The find is now
        # anchored under a `.git` directory, which is the only place git puts
        # the `*.lock` files this step is about.
        run: |
          set -uo pipefail
          root="${RUNNER_WORKSPACE:-}"
          echo "stale-lock-sweep: runner=${RUNNER_NAME:-?} root=${root:-<unset>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "stale-lock-sweep: found 0 stale lock file(s) (work dir absent - fresh runner)"
            exit 0
          fi
          found=0
          removed=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            found=$((found + 1))
            echo "stale-lock-sweep:   found $f"
            if rm -f "$f"; then
              removed=$((removed + 1))
            else
              echo "stale-lock-sweep:   FAILED to remove $f"
            fi
          done < <(find "$root" -type d -name .git -exec \
            find {} -type f -name '*.lock' -mmin +60 ';' 2>/dev/null)
          remaining=$(find "$root" -type d -name .git -exec \
            find {} -type f -name '*.lock' -mmin +60 ';' 2>/dev/null | wc -l | tr -d ' ')
          echo "stale-lock-sweep: found $found, removed $removed, still present $remaining"
          if [ "$found" -eq 0 ]; then
            echo "stale-lock-sweep: NOTHING WAS STALE - if checkout still fails, mode 2 is not the cause"
          fi
          # ------------------------------------------------------------------
          # The OTHER, and far more frequent, way this persistent work
          # directory breaks checkout. Over 54 sampled `dev` runs the gpu class
          # failed checkout in 51 of 54 jobs, on every slot of BOTH gpu
          # machines, while all six m3 Macs checked out 244/244 times. It is
          # not one bad box and it is not the token -- it is this directory.
          # The failure is `git clean -ffdx` unable to delete read-only files
          # left behind by a Nix-derived build output (storybook-static and
          # friends are copied out of the store with store permissions, 0444):
          #
          #   rm: cannot remove '.../storybook/storybook-static/public/...':
          #   Permission denied
          #   fatal: --local can only be used inside a git repository
          #   fatal: not a git repository (or any parent up to mount point /var)
          #
          # checkout removes the repo when it cannot clean it, and then every
          # subsequent git call in the step is running outside a repository.
          # Restoring owner-write on the tree is what lets `git clean` finish.
          # Again: COUNT, do not assume. `chmod -R` succeeds on a tree that
          # needed nothing.
          notwritable=$(find "$root" ! -writable 2>/dev/null | wc -l | tr -d ' ')
          echo "stale-lock-sweep: $notwritable path(s) under $root are not owner-writable"
          if [ "$notwritable" -ne 0 ]; then
            chmod -R u+w "$root" 2>/dev/null || true
            still=$(find "$root" ! -writable 2>/dev/null | wc -l | tr -d ' ')
            echo "stale-lock-sweep: after chmod -R u+w, $still path(s) still not writable"
            if [ "$still" -ne 0 ]; then
              echo "stale-lock-sweep: WARNING these are not owned by the runner user; checkout will still fail to clean"
            fi
          else
            echo "stale-lock-sweep: nothing was read-only - the storybook-static mode is not present on this run"
          fi
          if [ "$remaining" -ne 0 ]; then
            echo "stale-lock-sweep: WARNING sweep did not clear everything it found"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # MODE 1 of the self-hosted checkout outage. A stale, owner-scoped
        # `http.https://github.com/metacraft-labs/.extraHeader` left in the
        # runner's reused `~/.gitconfig` OUTRANKS the fresh broader header
        # actions/checkout installs (git matches `http.<url>.*` by longest URL
        # prefix), so checkout authenticates with a dead token, GitHub answers
        # 401, and git dies on `could not read Username`. checkout COPIES
        # `$HOME/.gitconfig` into its temp HOME, so this file is live during the
        # failing fetch. Full rationale, the reproduction, and why this targets
        # the file by path rather than via `--global`: see the copy of this step
        # in the `test-non-gui` job.
        run: |
          set -uo pipefail
          cfg="$HOME/.gitconfig"
          echo "cred-evict: runner=${RUNNER_NAME:-?} home=$HOME"
          if [ ! -f "$cfg" ]; then
            echo "cred-evict: removed 0 (no $cfg on this runner - nothing reusable to poison)"
            exit 0
          fi
          echo "cred-evict: inspecting $cfg"
          removed=0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            case "$key" in
              http.*.extraheader|http.*.extraHeader) ;;
              url.*x-access-token*) ;;
              *) continue ;;
            esac
            echo "cred-evict:   removing '$key' (value withheld)"
            git config --file "$cfg" --unset-all "$key" 2>/dev/null || true
            git config --file "$cfg" --remove-section "${key%.*}" 2>/dev/null || true
            removed=$((removed + 1))
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          # Recount in PURE BASH. `grep` and `sed` are NOT on PATH in a raw
          # `run:` step on these nix-darwin runners -- the first version of
          # this step used `grep -ciE` here, grep exited 127, `|| true`
          # swallowed it, and the step printed "removed 1 key(s);  still
          # present" with an EMPTY count. That is precisely the failure this
          # step is supposed to be immune to: a verification that silently
          # verifies nothing and still reads like a pass. No external
          # commands in the check.
          left=0
          while IFS= read -r k; do
            case "$k" in
              *extraheader*|*extraHeader*|*x-access-token*) left=$((left + 1)) ;;
            esac
          done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)
          echo "cred-evict: removed $removed credential-bearing key(s); $left still present"
          if [ "$removed" -eq 0 ]; then
            echo "cred-evict: NOTHING FOUND - this host was already clean, mode 1 did not apply here"
          fi
          if [ "$left" -ne 0 ]; then
            echo "cred-evict: WARNING $left credential-shaped key(s) SURVIVED the sweep"
          fi
          echo "cred-evict: keys remaining in $cfg:"
          while IFS= read -r k; do echo "  $k"; done < <(git config --file "$cfg" --list --name-only 2>/dev/null || true)

      - name: Checkout CodeTracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave `http.https://github.com/.extraHeader` behind in
          # `.git/config` for the rest of a three-hour job on a persistent GPU
          # runner. This is ordinary least-persistence hygiene — the same reason
          # actions/checkout v6 moved the credential out of `.git/config`
          # entirely — and NOT a boundary the private-Cargo preflight depends
          # on: that header carries the org-wide CI App token, which by policy
          # also authenticates the private lldb-sys dependency, so its presence
          # is never a leak and the preflight no longer asserts anything about
          # it. See the long note in
          # `ci/test/visual-replay-private-cargo-preflight.sh`.
          #
          # Nothing downstream needs the persisted header:
          #   * `Setup dev env` gets the same token explicitly via `gh-token`.
          #   * `submodules: recursive` is unaffected — actions/checkout fetches
          #     submodules under a temporary *global* auth config it installs
          #     regardless of this setting, and only strips the credential in
          #     its `finally` block, after submodules are checked out.
          #   * The gate itself does no network git against this checkout. Its
          #     one authenticated fetch (`git ls-remote` on lldb-sys, in the
          #     preflight) uses the process-scoped `GIT_CONFIG_KEY_0`
          #     extraHeader; every other git-touching step runs with its working
          #     directory inside a *sibling* repo provisioned by setup-dev-env.
          persist-credentials: false

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones every source dependency used by the visual gate adjacent to
        # this checkout at their pinned `dev` refs. That includes the
        # frontend's IsoNim/agent libraries, the incremental runner's trace and
        # I/O libraries, and visual replay's own native siblings. A missing
        # lock entry fails loudly before the build starts.
        #
        # `runquota` is on the list because this gate runs `just build-once`,
        # which compiles `ct`, which pulls in src/ct_test/process_exec.nim ->
        # `import runquota_process`. Under the tup driver this CHECKOUT is the
        # only way those modules resolve: NIM_REPO_PATH_FLAGS points at
        # `$(ROOT)/../runquota/...`, and tup's environment allowlist in
        # src/Tuprules.tup does not carry RUNQUOTA_SRC, so the dev shell's
        # export of it never reaches `nim`. Its absence is what made this job
        # die on `cannot open file: runquota_process` (issue #641), fifteen
        # minutes into the Nim compile rather than here.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            isonim=dev
            nim-everywhere=dev
            nim-acp=dev
            nim-agent-harbor=dev
            nim-agents=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            io-mon=e2ee15afe8dd7f538ec2ce79af9a1aa512addce2
            nim-shm-queue=5a8e43b52fa202859658692c9f8432967f3971ea
            nim-shm-gset=360bfc15cadab1ff583e6d1cbc20b389d5d6825f
            nim-stackable-hooks=dev
            codetracer-visual-replay=dev
            codetracer-native-backend=dev
            codetracer-native-recorder=dev
            codetracer-native-test-programs=dev
            codetracer-visual-replay-fixtures=dev
            runquota=dev

      - name: Run visual replay regression gate
        env:
          # The CodeTracer dev shell already supplies Nim/Nimble. Build the
          # recorder emulator directly instead of re-entering its freshly
          # cloned, unapproved direnv environment; provide the vendored
          # results/stew paths that build_native_api.sh imports.
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
          CODETRACER_VISUAL_REPLAY_REPO_PATH: ${{ github.workspace }}/../codetracer-visual-replay
          CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN: ${{ steps.ci_token.outputs.token }}
          PLAYWRIGHT_GLOBAL_TIMEOUT: "10800000"
        run: |
          set -euo pipefail

          # Cargo's default libgit2 transport does not honor the Git URL
          # authentication installed by setup-dev-env. Force the Git CLI and
          # give it a process-scoped HTTP header for the one private dependency
          # used by codetracer-native-backend. Keep the repository URL free of
          # credentials so the token cannot enter git-remote-https argv. No
          # credential file is written; the App token is revoked by its
          # action's post-job hook.
          lldb_sys_url="https://github.com/metacraft-labs/lldb-sys.rs.git"
          cargo_auth_basic="$(
            printf 'x-access-token:%s' "${CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN}" |
              base64 | tr -d '\r\n'
          )"
          cargo_home="${RUNNER_TEMP}/visual-replay-cargo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${cargo_home}"
          mkdir -p "${cargo_home}"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          export CARGO_HOME="${cargo_home}"
          export CODETRACER_VISUAL_REPLAY_CLEAN_CARGO_HOME=true
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          export SSH_ASKPASS=/bin/false
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null

          # A self-hosted runner may carry process-scoped Git configuration
          # from its launcher. Remove every numbered entry before installing
          # the closed configuration below; entries above GIT_CONFIG_COUNT are
          # ignored by Git today, but must not become active if this list is
          # extended later. GIT_CONFIG_PARAMETERS is a separate inline channel.
          for git_env_name in "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}"; do
            if [[ "${git_env_name}" =~ ^GIT_CONFIG_(KEY|VALUE)_[0-9]+$ ]]; then
              unset "${git_env_name}"
            fi
          done
          unset GIT_CONFIG_PARAMETERS GIT_CONFIG_NOSYSTEM GIT_ALLOW_PROTOCOL

          # Carry only the header and helper block through Nix shell startup.
          # The gate re-establishes all non-secret policy values after the
          # git-hooks shell hook has finished and before invoking Git/Cargo.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${lldb_sys_url}.extraHeader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${cargo_auth_basic}"
          export GIT_CONFIG_KEY_1="credential.helper"
          export GIT_CONFIG_VALUE_1=""
          unset CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN cargo_auth_basic

          cleanup_private_cargo_auth() {
            rm -rf "${cargo_home}"
            unset CARGO_NET_GIT_FETCH_WITH_CLI CARGO_HOME
            unset CODETRACER_VISUAL_REPLAY_CLEAN_CARGO_HOME
            unset GIT_TERMINAL_PROMPT GIT_ASKPASS SSH_ASKPASS
            unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM
            unset GIT_CONFIG_PARAMETERS GIT_CONFIG_NOSYSTEM GIT_ALLOW_PROTOCOL
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
            unset git_env_name lldb_sys_url cargo_home
          }
          trap cleanup_private_cargo_auth EXIT

          nix develop .#devShells.x86_64-linux.default --command just test-visual-replay-gate

      - name: Stage sibling artifacts into workspace
        # actions/upload-artifact@v5 forbids paths containing ``..``
        # and absolute paths outside the workspace, so the previous
        # config aborted with ``Invalid pattern '../codetracer-visual-replay/...':
        # Relative pathing '.' and '..' is not allowed``.  Copy any
        # sibling and /tmp artifacts into a workspace staging dir so
        # the upload step can reference them via workspace-relative
        # globs.
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          STAGE="visual-replay-regression-staging"
          mkdir -p "${STAGE}/sibling/tests/output" \
                   "${STAGE}/sibling/bench-results" \
                   "${STAGE}/tmp"
          if [ -d ../codetracer-visual-replay/tests/output ]; then
            cp -a ../codetracer-visual-replay/tests/output/. \
                  "${STAGE}/sibling/tests/output/" 2>/dev/null || true
          fi
          if [ -d ../codetracer-visual-replay/bench-results ]; then
            cp -a ../codetracer-visual-replay/bench-results/. \
                  "${STAGE}/sibling/bench-results/" 2>/dev/null || true
          fi
          shopt -s nullglob
          for f in /tmp/*_diff.rgba /tmp/*_sw.rgba /tmp/*_hw.rgba; do
            cp -a "$f" "${STAGE}/tmp/" 2>/dev/null || true
          done

      - name: Upload visual replay artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-replay-regression-artifacts
          path: |
            src/tests/gui/test-results/
            src/tests/gui/playwright-report/
            src/tests/gui/test-stats/
            storybook/storybook-static/
            storybook/dist/
            visual-replay-regression-staging/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ct-test gates.
  #
  # `ci/test/m16-release-gate.sh` and `ci/test/ct-providers.sh` were real,
  # maintained scripts that NO pipeline invoked: `.gitlab-ci.yml`'s only test
  # jobs are `just test` (test-rust + test-nimsuggest + optional cross-repo) and
  # `ci/test/ui-tests.sh`, and no workflow here named either script. They ran
  # only when a human typed `just test-m16-release-gate` / `just
  # test-ct-providers`. Every suite listed in them — not just the most recently
  # added one — has therefore been in a gate that never gated.
  #
  # They are split across two jobs on purpose, because they have very different
  # prerequisites and mixing them would let the harder one's infrastructure
  # failures mask the easier one's test failures:
  #
  #   * `ct-test-release-gate` needs nothing but the codetracer dev shell. It is
  #     the toolchain-light provider matrix plus the framework contract,
  #     discovery, run-store and worker-pool suites.
  #   * `ct-test-providers` drives real external toolchains AND three recorder
  #     siblings (native/ct-mcr, JavaScript, Ruby), which have to be checked out
  #     and built before the recording assertions can run.
  #
  # Neither job weakens what the scripts check: `CT_PROVIDERS_ALLOW_MISSING` and
  # `CT_PROVIDERS_SKIP_SIBLINGS` are deliberately NOT set, so a recorder that is
  # missing or fails to build fails the job instead of quietly turning the
  # recording assertions into no-ops.
  # ---------------------------------------------------------------------------
  ct-test-release-gate:
    # Moved -g2 -> -g1 as the counterweight to test-ui-tests-rr (22.1 min)
    # landing on -g2 in this same commit; without it the always-on subset skews
    # 103.4 vs 122.2. Lands next to ct-test-providers, which it shares a closure
    # with, so the move is locality-positive as well as arithmetic.
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    name: ct-test release gate (M16 provider matrix)
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility ALL from
        # being readable inside private repos, so we mint per-run installation
        # tokens from the repo-local CI_TOKEN_PROVIDER_APP_ID +
        # CI_TOKEN_PROVIDER_PRIVATE_KEY secrets via the CI Token Provider App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # The gate's last two suites are ViewModel tests under
        # src/frontend/viewmodel/, which build against ../isonim/src et al. via
        # codetracer's top-level config.nims. Same prerequisite as
        # `viewmodel-tests`, and like it this runs after ``Install Nix``
        # because the action reaches ``repro`` through this repo's dev shell.
        uses: ./.github/actions/provision-repro-lock-siblings

      - name: Run the M16 ct-test release gate
        # The ct_test sources import runquota_process; the dev shell exports
        # RUNQUOTA_SRC (nix/shells/ci-base.nix) and src/ct_test/config.nims
        # turns that into the --path set, so no runquota sibling checkout is
        # needed here.
        run: nix develop .#devShells.x86_64-linux.default --command just test-m16-release-gate

  ct-test-providers:
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    name: ct-test cross-language provider gate
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          skip-token-revoke: false

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # ci/test/ct-providers.sh requires three recorder siblings checked out
        # at ../<repo> and builds each through its own pinned dev shell
        # (scripts/build-siblings.sh -> `direnv exec <repo> just build`). Without
        # them the script aborts in its very first suite, which is why it could
        # never simply be dropped into an existing job.
        #
        # setup-dev-env clones them adjacent to this checkout at
        # pinned `dev` refs — the same mechanism
        # `visual-replay-regression-gate` and `test-non-gui` already use, so
        # this is not new infrastructure. The trace-format / io-mon /
        # stackable-hooks / nim-shm-queue entries are the native recorder's own
        # build dependencies, mirroring the visual gate's sibling list.
        #
        # codetracer-native-backend is listed for the NATIVE RECORDER's sake,
        # not this job's: `build-siblings.sh` runs `just build-ct-mcr`, whose
        # `build-license-ffi` recipe opens with
        # `cd ../codetracer-native-backend && ...` to build `ct_license_ffi` out
        # of the backend checkout. Without it:
        #
        #   sh: line 1: cd: ../codetracer-native-backend: No such file or directory
        #   error: could not find `Cargo.toml` in `.../codetracer-native-recorder`
        #   error: Recipe `build-license-ffi` failed on line 123 with exit code 101
        #
        # The recipe `&&`-chains only its first link and uses `;` after, so the
        # failed `cd` does not abort it -- cargo just runs in the recorder root,
        # which has no root Cargo.toml, and the error names the wrong repo.
        #
        # A gap in this list, not in the lock: the recipe is byte-identical at
        # the last lock-pinned recorder revision (196f95c9, 2026-07-07) and at
        # today's `dev`, and neither revision has a root Cargo.toml, so the
        # lock-pinned build would have failed the same way. It stayed invisible
        # because this job could not get past `Setup dev env` to reach it.
        #
        # codetracer-visual-replay is here for the same reason, one layer on:
        # once the backend is present, `build-license-ffi` succeeds and the
        # build reaches `cd ct_cli && nimble build`, which imports
        # `gfx_stream/ctfs_visual` -- a module that lives in
        # codetracer-visual-replay/src/gfx_stream, not in the recorder:
        #
        #   ct_cli/src/ct_cli/extract_gfx_cmd.nim(39, 18)
        #     Error: cannot open file: gfx_stream/ctfs_visual
        #   error: Recipe `build-ct-mcr` failed on line 43 with exit code 1
        #
        # `visual-replay-regression-gate` already lists it. Same missing-sibling
        # class as the backend above, uncovered only because fixing the first
        # one let the build run far enough to hit the second.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            nim-everywhere=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            io-mon=e2ee15afe8dd7f538ec2ce79af9a1aa512addce2
            nim-shm-queue=5a8e43b52fa202859658692c9f8432967f3971ea
            nim-shm-gset=360bfc15cadab1ff583e6d1cbc20b389d5d6825f
            nim-stackable-hooks=dev
            codetracer-native-recorder=dev
            codetracer-js-recorder=dev
            codetracer-ruby-recorder=dev
            codetracer-native-backend=dev
            codetracer-visual-replay=dev

      - name: Allow direnv in the cloned recorder siblings
        # scripts/build-siblings.sh runs every sibling build as
        # `direnv exec <repo> …` so the repo's own flake pins its toolchain. A
        # freshly cloned .envrc is in direnv's "blocked" state, so without this
        # the build step fails (or silently falls back to the wrong PATH) —
        # the same hazard `test-non-gui` handles for codetracer-beam-recorder.
        run: |
          set -euo pipefail
          for sibling in codetracer-native-recorder codetracer-js-recorder codetracer-ruby-recorder; do
            nix develop .#devShells.x86_64-linux.default -c \
              direnv allow "${{ github.workspace }}/../${sibling}"
          done

      - name: Run the cross-language ct-test provider gate
        # No CT_PROVIDERS_ALLOW_MISSING / CT_PROVIDERS_SKIP_SIBLINGS: a missing
        # or unbuildable recorder must fail this job, not silently degrade the
        # recording assertions into checks of nothing.
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
          # codetracer-native-recorder depends on the PRIVATE metacraft-labs/lldb-sys.rs.
          # Cargo's default libgit2 transport does not read gitconfig, so it never
          # presents the org-scoped extraHeader that `Setup dev env` installs job-wide
          # (GIT_CONFIG_KEY_0/VALUE_0/COUNT) and reports the resulting 401 as the
          # misleading "revision ... not found". Forcing the git CLI makes cargo use
          # that credential, exactly as the dmg-build and visual-replay lanes already do.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: nix develop '.?submodules=1' --command just test-ct-providers

      - name: Upload sibling build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ct-test-providers-sibling-logs
          # scripts/build-siblings.sh captures each recorder build into
          # .tools/build-siblings-logs/<repo>.log (LOG_DIR in that script);
          # without them a sibling build failure reports only its exit code.
          path: .tools/build-siblings-logs/
          retention-days: 14
          if-no-files-found: ignore

  push-to-attic:
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    needs:
      - test-non-gui
      - test-ui-tests
      - appimage-lib-check
      - dmg-lib-check
    if: "github.ref == 'refs/heads/main' && ${{ !github.event.codetracer-ci }}"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default --command ./ci/deploy/build-nix-and-push-to-attic.sh"
        env:
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}

  docs-scope:
    # Does this run have any documentation to publish?
    #
    # WHY A JOB AND NOT A `paths:` FILTER. `paths:` only exists on the workflow
    # TRIGGER, and this workflow's `pull_request:` trigger drives the entire CI
    # matrix -- Linux, macOS and Windows builds and tests. Narrowing it to
    # `docs/**` would stop all of that from running on every non-docs pull
    # request. GitHub has no per-job `paths:`, so the filter has to be
    # evaluated inside the workflow.
    #
    # WHY A SEPARATE JOB AND NOT A FIRST STEP. A job-level `if:` is evaluated
    # before a runner is allocated; a step-level one is not. Deciding this in a
    # step would have every pull request occupy one of the six self-hosted
    # `eph-linux-x64` slots just to conclude it had nothing to do -- the same
    # waste `cla.yml` documents having had to fix. This job needs no Nix and no
    # checkout, so it runs on the free hosted class.
    runs-on: ubuntu-latest
    if: ${{ !github.event['codetracer-ci'] }}
    permissions:
      # Read-only: this job only asks which files a pull request touches.
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - name: Decide whether the docs channel has anything to publish
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            // A branch deploy republishes its channel unconditionally: the
            // published site must match the branch even when the change that
            // moved it was, say, a theme token in a sibling repo.
            if (context.eventName !== 'pull_request') {
              core.info(`event '${context.eventName}': a branch deploy always publishes its channel`);
              core.setOutput('publish', 'true');
              return;
            }
            // The docs preview is built from `docs/` by `ci/deploy/docs.sh`.
            // A change to the deploy script itself counts: it is the thing
            // that decides what the published tree looks like.
            const isDocs = (name) =>
              name.startsWith('docs/') || /^ci\/deploy\/docs[-.a-z]*\.sh$/.test(name);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const touched = files.map((f) => f.filename).filter(isDocs);
            core.info(`${files.length} changed file(s), ${touched.length} of them documentation`);
            for (const name of touched.slice(0, 20)) core.info(`  ${name}`);
            // `listFiles` is capped at 3000 files per pull request, so beyond
            // that the answer is "we do not know". Fail toward publishing: a
            // preview nobody needed costs a build, a missing one costs a
            // reviewer their only look at the rendered change.
            if (files.length >= 3000 && touched.length === 0) {
              core.warning('the changed-file list is truncated at the API cap; publishing anyway');
              core.setOutput('publish', 'true');
              return;
            }
            core.setOutput('publish', touched.length > 0 ? 'true' : 'false');

  build-and-deploy-docs:
    needs: [ docs-scope ]
    runs-on: eph-linux-x64-g2  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # The docs site is INDEPENDENT content: it is built by its own isonim-docs
    # SSG consumer (docs/book-isonim via ci/deploy/docs.sh) and consumes NO
    # artifact from the app build or the attic-cache push. It must therefore not
    # be chained behind push-to-attic (which needs the full build/test matrix:
    # test-non-gui, test-ui-tests, appimage/dmg-lib-check) — otherwise any
    # unrelated app-CI failure silently blocks the docs deploy. Decoupled so the
    # docs publish on every push to a documentation branch regardless of
    # build/test status. The attic substituter set up in "Install Nix" is a
    # read-through cache that works whether or not this run's push-to-attic
    # populated it.
    #
    # THREE PUBLISH CHANNELS, one job, chosen by the event and the branch
    # (`ci/deploy/docs.sh` derives the channel; see its header):
    #
    #   stable       -> docs.codetracer.com/          (the released book, plus /old)
    #   dev          -> docs.codetracer.com/nightly   (the integration book)
    #   pull request -> docs.codetracer.com/pr/<N>    (that PR's docs preview)
    #
    # `main` deliberately publishes nothing: the released docs now track
    # `stable`, so a `main` push must not overwrite them.
    #
    # WHY PREVIEWS ARE SAME-REPO ONLY.
    #
    # A `pull_request` run from a FORK gets a read-only `GITHUB_TOKEN` and no
    # secrets, by design, because the code it builds is written by whoever
    # opened the pull request. Publishing a preview from such a run would mean
    # executing attacker-controlled build code with a token that can write to
    # `gh-pages` -- the classic supply-chain hole. `pull_request_target` is NOT
    # the answer: it would hand that write token to exactly the same untrusted
    # code. (`cla.yml` uses `pull_request_target` safely because it never
    # checks out or runs the pull request's code; this job does both.)
    #
    # So fork pull requests get NO preview and NO explanatory comment. The
    # comment is not withheld out of preference -- with a read-only token this
    # job cannot post one either, and the whole job is gated off before a
    # runner is even allocated. Reviewers of a fork PR read the diff, as they
    # did before previews existed.
    #
    # `head.repo.full_name` is the fork test: on a same-repo pull request it
    # equals the repository, and it is the value GitHub itself uses to decide
    # whether to issue a write token.
    #
    # `needs.docs-scope.outputs.publish` is the "only when the docs actually
    # change" gate: on a pull request it is false unless the diff touches
    # `docs/` or the deploy script, so such a run publishes nothing AND
    # comments nothing. On a branch push it is always true.
    if: >-
      ${{ !github.event['codetracer-ci'] &&
          needs.docs-scope.outputs.publish == 'true' && (
            github.ref == 'refs/heads/stable' ||
            github.ref == 'refs/heads/dev' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) }}
    # PER-CHANNEL concurrency groups, not one shared group.
    #
    # All channels commit to the same `gh-pages` branch, so a single shared
    # group looks safer at first glance -- no channel could ever race another.
    # It is not, once pull-request previews exist. GitHub keeps at most ONE
    # pending run per concurrency group and CANCELS any older pending one, so
    # with a shared group a `stable` deploy waiting behind a running preview
    # would be silently cancelled the moment a second preview queued behind it.
    # Busy pull-request days would quietly stop publishing the released docs.
    #
    # Per-channel groups keep the guarantee that actually matters -- a channel
    # never races ITSELF, so its own subtree is never written twice at once --
    # and hand the cross-channel case to the mechanism built for it: docs.sh
    # pushes fast-forward only, and re-fetches and re-applies its subtree when
    # it loses. That path is exercised by ci/test/docs-deploy-channels-test.sh.
    #
    # The preview group is keyed by PR NUMBER so the cleanup job in
    # docs-preview-cleanup.yml can join it: a cleanup must not overlap the same
    # PR's last preview publish, or the publish would resurrect the directory
    # the cleanup just removed.
    #
    # Never cancel in progress: a cancelled deploy leaves that channel a
    # release behind.
    concurrency:
      group: >-
        docs-gh-pages-${{
          github.event_name == 'pull_request'
            && format('pr-{0}', github.event.pull_request.number)
            || github.ref_name
        }}
      cancel-in-progress: false
    permissions:
      # `contents: write` publishes gh-pages. `pull-requests: write` posts the
      # single preview comment, and is the narrowest grant that can: GitHub has
      # no finer scope for "edit one comment". It is deliberately NOT a
      # separate job -- splitting one out would duplicate the whole nix +
      # sibling-checkout preamble, and this job already holds `contents:
      # write`, which is strictly the more powerful of the two.
      contents: "write"
      pull-requests: "write"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Check out sibling repos for the isonim-docs SSG build
        # The docs are now built by the isonim-docs SSG consumer at
        # docs/book-isonim/ (see ci/deploy/docs.sh), whose config.nims
        # `--path`-switches to sibling checkouts laid out one level above this
        # repo (book-isonim/../../../<repo>): isonim, isonim-docs,
        # nim-everywhere, nim-faststreams, nim-stew. actions/checkout can only
        # write inside the workspace, so clone each sibling next to the
        # codetracer checkout with the cross-repo installation token minted
        # above. This mirrors isonim-docs/.github/workflows/ci.yml's
        # sibling-checkout layout (adjusted for book-isonim's extra depth).
        #
        # Sibling revisions default to each repo's default branch, matching
        # the isonim-docs CI convention; if/when isonim-docs joins the
        # workspace-lock cross-repo CI, these should move to pinned-lock
        # resolution instead.
        env:
          SIBLING_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          for repo in isonim isonim-docs nim-everywhere nim-faststreams nim-stew codetracer-design-system; do
            dest="${GITHUB_WORKSPACE}/../${repo}"
            rm -rf "$dest"
            git clone --depth 1 \
              "https://x-access-token:${SIBLING_TOKEN}@github.com/metacraft-labs/${repo}.git" \
              "$dest"
          done

      - env:
          # docs.sh reads AND pushes gh-pages with this (the job's GITHUB_TOKEN +
          # the contents:write permission above) -- the same reliable mechanism
          # the isonim/isonim-docs docs deploys use. It is now used for both
          # directions: the script fetches the current gh-pages so it can leave
          # the OTHER channel's subtree in place, then pushes its own subtree on
          # top (fast-forward, never `--force`). The old origin+CODETRACER_PUSH_
          # GITHUB_TOKEN path failed auth ("Authentication failed for .../codetracer").
          #
          # `origin` is deliberately NOT re-pointed at a credentialed URL here.
          # docs.sh only reads `origin` in its DEPLOY_TOKEN-absent fallback
          # (`ci/deploy/docs.sh`, the `REMOTE` resolution before the publish
          # step), and DEPLOY_TOKEN is always set on this step -- so the
          # rewrite could never be the credential that pushed, it could only
          # expand a long-lived PAT into `.git/config` on a self-hosted runner
          # that reuses its workspace. This is a category-1 push (the
          # workflow's own public repo), and the policy credential for that is
          # the token Actions already provides.
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # docs.sh derives the channel from the event and the branch; on a
          # pull request it needs the number that names the `/pr/<N>` subtree.
          # Passed explicitly rather than parsed out of GITHUB_REF so the
          # published path comes from the event payload GitHub itself
          # populated.
          DOCS_DEPLOY_PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config init.defaultBranch main

          nix develop .#devShells.x86_64-linux.default --command ./ci/deploy/docs.sh

      - name: Link the preview from the pull request
        # Only on a pull request, and only after the publish above succeeded --
        # a link posted for a preview that was never published is worse than no
        # link, because it looks authoritative and 404s.
        #
        # The comment is edited in place on every subsequent push (see
        # ci/deploy/docs-preview-comment.sh), so a long pull request ends with
        # exactly one preview comment rather than one per push. It names the
        # head commit so a reviewer can tell whether what they are looking at
        # includes the push they just made.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The pull request's own head, NOT `github.sha`: on a `pull_request`
          # event `github.sha` is the ephemeral merge commit, which exists
          # nowhere the reviewer can see it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command \
            ./ci/deploy/docs-preview-comment.sh published \
            "$PR_NUMBER" "https://docs.codetracer.com/pr/${PR_NUMBER}/" "$HEAD_SHA"

  push-tag:
    runs-on: eph-linux-x64-g2  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    needs: [ dev-build, nix-build, appimage-build, dmg-build ]
    permissions:
      contents: "write"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix
        uses: metacraft-labs/nixos-modules/.github/install-nix@main
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Configure Nix for private repos
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ steps.ci_token.outputs.token }}" >> ~/.config/nix/nix.conf
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Create tag
        if: ${{ github.ref == 'refs/heads/main' }}
        id: tag
        run: |
          YEAR=$(bash -c 'grep "CodeTracerYear\*" src/ct/version.nim | sed "s/.*CodeTracerYear\* = //g"')
          MONTH=$(bash -c "printf '%02d' \$(grep \"CodeTracerMonth\*\" src/ct/version.nim | sed \"s/.*CodeTracerMonth\* = //g\")")
          BUILD=$(bash -c 'grep "CodeTracerBuild\*" src/ct/version.nim | sed "s/.*CodeTracerBuild\* = //g"')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config init.defaultBranch main

          # `origin` is deliberately NOT re-pointed at a credentialed URL.
          #
          # It used to be, at `CODETRACER_PUSH_GITHUB_TOKEN` -- a long-lived
          # PAT, and the last rotation-bearing GitHub credential in this
          # workflow. That userinfo could never be the credential that pushed.
          # The `Checkout` step above runs with `persist-credentials` at its
          # default of true, so actions/checkout leaves
          # `http.https://github.com/.extraheader` in `.git/config` carrying
          # the App installation token, and Git prefers a configured
          # Authorization header over userinfo in the remote URL.
          #
          # That preference is total, not merely a first choice, which is what
          # makes deleting the line safe rather than a gamble. Against a server
          # that answers 401, `git push` retries with the SAME header and then
          # gives up; the userinfo is never put on the wire at all, so it is not
          # a fallback either. (Reproducible without any real credential: point
          # a checkout at a local HTTP server with both an `extraHeader` and
          # userinfo configured, and read the `Authorization` it receives.)
          #
          # So the App token was already performing this push, and removing the
          # rewrite changes which credential authenticates not at all -- it only
          # stops expanding a PAT into `.git/config` on a self-hosted runner
          # that reuses its workspace. `persist-credentials` must therefore STAY
          # enabled on the checkout above: here the persisted header is
          # load-bearing, which is the opposite of the situation in most jobs.
          #
          # VERIFIED 2026-08, for whoever runs the next release. The
          # metacraft-labs-ci-token-provider App installation (app id 3115338)
          # carries `contents: write` at the org level -- confirmed against
          # `GET /orgs/metacraft-labs/installations`. `create-github-app-token`
          # is called above with no `permissions:` input, so the minted token
          # inherits the installation's full permission set, contents:write
          # included, and the persisted `extraheader` push below authenticates
          # with it. If the tag push nonetheless 403s, re-check that permission
          # set (it may have been narrowed) rather than reintroducing a PAT --
          # the old PAT was already inert and restoring it would not help.
          git tag -a "$YEAR.$MONTH.$BUILD" -m "Release $YEAR.$MONTH.$BUILD" || echo "Tag already exists"
          (git push origin "$YEAR.$MONTH.$BUILD" && echo "tag=$YEAR.$MONTH.$BUILD" >> $GITHUB_OUTPUT) || echo "Tag already exists"

  create-release:
    runs-on: eph-linux-x64-g2  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    needs: [ push-tag ]
    if: ${{ ((startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')) || needs.push-tag.outputs.tag != '') && !github.event['codetracer-ci'] }}
    permissions:
      contents: "write"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix
        uses: metacraft-labs/nixos-modules/.github/install-nix@main
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Configure Nix for private repos
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ steps.ci_token.outputs.token }}" >> ~/.config/nix/nix.conf
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Create resource tarball
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c "tar cfJ resources.tar.xz resources/"
          nix develop .#devShells.x86_64-linux.default --command bash -c "gpg --detach-sign resources.tar.xz"
      - name: Promote the just-built artifacts to the release tag
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }}
          BUCKET: ${{ vars.R2_CODETRACER_BUCKET_NAME }}
          TAG: ${{ needs.push-tag.outputs.tag }}
        run: |
          set -euo pipefail

          # PROVENANCE: promote the exact bytes this run's appimage-build and
          # dmg-build just wrote to R2 under the CodeTracer-main-* keys. Earlier
          # this step re-fetched them from the downloads.codetracer.com CDN with
          # wget -- but that CDN is a public cache in front of the bucket: it can
          # still be serving a previous build's bytes when this job runs, or a
          # neighbouring push to `main` can have overwritten the pointer, so the
          # tag could be cut from artifacts that were never built for it. Reading
          # straight from the authenticated bucket removes that gap: the source
          # of truth, not a cache of it.
          aws_cmd() {
            nix develop .#devShells.x86_64-linux.default --command \
              aws --endpoint-url="$ENDPOINT" "$@"
          }

          for f in CodeTracer-main-arm64.dmg CodeTracer-main-arm64.dmg.asc \
                   CodeTracer-main-amd64.AppImage CodeTracer-main-amd64.AppImage.asc; do
            aws_cmd s3 cp "s3://$BUCKET/$f" "$f"
          done

          # A tag artifact must be the SIGNED artifact. The release GPG key was
          # imported above (import-gpg), so its public half is in the keyring;
          # verify each detached signature against the bytes we are about to
          # publish before we publish them. A bad or missing signature fails the
          # release rather than shipping unverifiable bytes under a version tag.
          nix develop .#devShells.x86_64-linux.default --command \
            gpg --verify CodeTracer-main-arm64.dmg.asc CodeTracer-main-arm64.dmg
          nix develop .#devShells.x86_64-linux.default --command \
            gpg --verify CodeTracer-main-amd64.AppImage.asc CodeTracer-main-amd64.AppImage

          promote() { # promote <local-file> <dest-suffix>
            aws_cmd s3 cp "$1" "s3://$BUCKET/CodeTracer-$2" --checksum-algorithm CRC32
          }
          for slot in "$TAG" latest; do
            promote CodeTracer-main-arm64.dmg          "$slot-arm64.dmg"
            promote CodeTracer-main-arm64.dmg.asc      "$slot-arm64.dmg.asc"
            promote CodeTracer-main-amd64.AppImage     "$slot-amd64.AppImage"
            promote CodeTracer-main-amd64.AppImage.asc "$slot-amd64.AppImage.asc"
          done

          # Windows installer (CodeTracer-latest-win-x64.exe, consumed by
          # https://get.codetracer.com/pwsh). windows-installer-build /
          # windows-installer-publish upload CodeTracer-main-win-x64.exe(.asc)
          # when they run on `main`. That leg needs the eph-win-x64 GARM runner;
          # while that fleet is down the key is simply absent, so this promotion
          # is TOLERANT: it publishes the win artifact when present and skips it
          # (without failing the release) when it is not. The moment a Windows
          # build lands the key, the next release promotes it with zero further
          # changes.
          if aws_cmd s3 cp "s3://$BUCKET/CodeTracer-main-win-x64.exe" CodeTracer-main-win-x64.exe \
             && aws_cmd s3 cp "s3://$BUCKET/CodeTracer-main-win-x64.exe.asc" CodeTracer-main-win-x64.exe.asc; then
            nix develop .#devShells.x86_64-linux.default --command \
              gpg --verify CodeTracer-main-win-x64.exe.asc CodeTracer-main-win-x64.exe
            for slot in "$TAG" latest; do
              promote CodeTracer-main-win-x64.exe     "$slot-win-x64.exe"
              promote CodeTracer-main-win-x64.exe.asc "$slot-win-x64.exe.asc"
            done
          else
            echo "::warning::CodeTracer-main-win-x64.exe not found in R2 — skipping the Windows installer for this release (eph-win-x64 build not yet published)."
          fi

      - name: Get changelog text
        id: changelog
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c "awk '/^## /{if (p) exit; p=1} p' CHANGELOG.md > release_changelog.md"
          echo "\

          We're actively working on multiple exciting features, which are not fully released yet. Stay tuned!

          Available downloads:

          <a href="https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg"><img width="75px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Apple_logo_grey.svg"></a>
          <a href="https://deb.codetracer.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/9/9e/UbuntuCoF.svg"></a>
          <a href="https://deb.codetracer.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/6/66/Openlogo-debianV2.svg"></a>
