  dev-build:
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup isonim siblings
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Allow direnv in cloned codetracer-native-recorder
        # ci/build/dev.sh builds src/db-backend, whose build.rs invokes
        # ``direnv exec <recorder-root> bash ct_emulator/build_native_api.sh``
        # to materialise the recorder's generated C before the Rust build. A
        # fresh clone has its .envrc "blocked", so direnv refuses and build.rs
        # panics with ``build_native_api.sh exited with status 1``. Mirror the
        # proven lint-rust pattern: ``direnv allow`` is idempotent and persists
        # only in the local direnv state dir on this self-hosted runner.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv allow "${{ github.workspace }}/../codetracer-native-recorder"

      - name: Resolve ct_emulator nimble dependencies
        # build_native_api.sh runs ``nim c ... ct_emulator.nim`` whose .nimble
        # declares ``requires "results"``. A fresh nim install has no global
        # ``results`` package, so the script aborts with
        # ``cannot open file: results``. ``nimble install --depsOnly`` once in
        # ct_emulator (inside the recorder's direnv env so nim/nimble resolve
        # from the recorder's flake) is idempotent -- same fixup lint-rust does.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv exec "${{ github.workspace }}/../codetracer-native-recorder" \
              bash -c 'cd "${{ github.workspace }}/../codetracer-native-recorder/ct_emulator" && nimble install --depsOnly -y'

      # The emulator's ``syscall_replay.nim`` imports ``stew/endians2`` but
      # ``ct_emulator.nimble`` doesn't list ``stew`` as a dep, so a fresh Nim
      # build cannot resolve the module. Codetracer ships its own pinned copy as
      # a submodule under ``libs/nim-stew``; inject it via
      # ``CT_EMULATOR_EXTRA_NIM_PATHS`` so build_native_api.sh's ``--path:``
      # flags pick it up -- same env-var lint-rust uses.
      - name: Build
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: "nix develop .#devShells.x86_64-linux.default --command ./ci/build/dev.sh"

