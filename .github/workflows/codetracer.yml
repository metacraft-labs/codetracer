      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup isonim siblings
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default --command ./ci/build/dev.sh"

  nix-build:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default --command ./ci/build/nix.sh"

  appimage-build:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup isonim siblings
        # appimage-build runs nim *outside* the Nix sandbox via
        # ``./ci/build/appimage.sh``; clone the isonim siblings next
        # to the codetracer checkout so codetracer's ``nim.cfg``
        # ``path:"../isonim/src"`` directives resolve.
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build
        run: "nix develop .#devShells.x86_64-linux.default --command ./ci/build/appimage.sh"

      - name: Upload artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command gpg --armor --detach-sign CodeTracer.AppImage
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer.AppImage s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer.AppImage.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage.asc

  dmg-build:
    # CIP-5 Wave 4: migrated to the self-hosted nix-darwin runner. The DIY
    # `dtolnay/rust-toolchain` + `./ci/build/dmg.sh` (-> Homebrew-native
    # `./non-nix-build/build.sh`) and `brew install awscli` steps are gone. The
    # dmg is now produced toolchain-free by reprobuild
    # (`repro build .#dmg --tool-provisioning=nix`, driven by
    # `ci/reprobuild/macos-daemon-build.sh`), which lands the artifact at the
    # same `non-nix-build/CodeTracer.dmg` path the sign + upload steps consume.
    # `aws` comes from `nixpkgs#awscli2`, provisioned per-command via `nix
    # shell`.
    runs-on: eph-macos-arm64  # CIP-5: nix macOS job -> eph-macos-arm64
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build DMG via reprobuild
        # Toolchain-free reprobuild macOS build: starts runquotad, runs
        # `repro build .#dmg --tool-provisioning=nix`, and asserts the artifact
        # at `non-nix-build/CodeTracer.dmg` — the exact path the sign + upload
        # steps below consume.
        run: nix develop . --command bash ci/reprobuild/macos-daemon-build.sh

      - name: Upload artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          gpg --armor --detach-sign non-nix-build/CodeTracer.dmg
          # for now apply workaround from https://community.cloudflare.com/t/an-error-occurred-internalerror-when-calling-the-putobject-operation/764905/11:
          #   adding `--checksum-algorithm CRC32`
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp ./non-nix-build/CodeTracer.dmg s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg --checksum-algorithm CRC32
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp ./non-nix-build/CodeTracer.dmg.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg.asc --checksum-algorithm CRC32

  dmg-lib-check:
    # CIP-5 Wave 4: migrated to the self-hosted nix-darwin runner. The DIY
    # `brew install awscli` / `brew install sevenzip` steps are gone; `aws`
    # comes from `nixpkgs#awscli2` and 7-Zip from `nixpkgs#p7zip` (the `7z`
    # binary), both provisioned per-command via `nix shell`. This job only
    # downloads + extracts + smoke-runs the release dmg, so it needs no
    # Homebrew build toolchain.
    runs-on: eph-macos-arm64  # CIP-5: nix macOS job -> eph-macos-arm64
    needs:
      - dmg-build
    steps:
      - name: Download artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg ./CodeTracer.dmg

      - name: Extract dmg
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#p7zip --command 7z x ./CodeTracer.dmg

      - name: Check if ct starts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct --version

  appimage-lib-check:
    # CIP-5 Wave 4: migrated to the self-hosted NixOS runner. The DIY
    # `sudo snap install aws-cli` step is gone (`aws` now comes from
    # `nixpkgs#awscli2` via `nix shell`), and the `sudo apt-get install fuse
    # libfuse2` step is dropped entirely: the ephemeral NixOS runner has no
    # fusermount setuid wrapper / /dev/fuse, so we smoke-run the AppImage with
    # `APPIMAGE_EXTRACT_AND_RUN=1` (self-extract, no FUSE) — the same mode
    # nix/shells/ci-base.nix documents for AppImages on these runners.
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    needs:
      - appimage-build
    steps:
      - name: Download artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage ./CodeTracer.AppImage

      - name: Check if ct starts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x ./CodeTracer.AppImage
          ./CodeTracer.AppImage --version

  # Cross-distro AppImage smoke.  ubuntu-latest (the appimage-lib-check
  # runner above) shares too many runtime libs with the build host to
  # catch glibc/libgcc/libstdc++ symbol-version regressions or a missing
  # patchelf entry.  This matrix runs `--version`, `--help`, and a tiny
  # `ct record` of a Python script on five distinct base images via
  # Docker, using AppImage's `--appimage-extract-and-run` mode so we
  # don't need FUSE in the runner.  See
  # scripts/test-appimage-cross-distro.sh.
  appimage-cross-distro:
    # Self-hosted on the nested-Docker class: this job's core is a 5-distro
    # Docker matrix (scripts/test-appimage-cross-distro.sh pulls
    # ubuntu/debian/fedora/arch images and runs the AppImage inside each), and
    # eph-linux-x64-nested is the Incus class that exposes an in-guest Docker
    # daemon (security.nesting + fuse-overlayfs). aws-cli comes from nixpkgs.
    runs-on: eph-linux-x64-nested
    needs:
      - appimage-build
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:40
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install AWS CLI
        if: ${{ startsWith(github.ref, 'refs/tags/') && !github.event['codetracer-ci'] }}
        # nixpkgs' awscli2 into the runner's nix profile (on PATH for the
        # download step) — snap/apt are unavailable on the NixOS runner.
        run: nix profile install nixpkgs#awscli2

      - name: Download AppImage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage ./CodeTracer.AppImage

      - name: Smoke-test on ${{ matrix.distro }}
        run: |
          bash scripts/test-appimage-cross-distro.sh \
            --distro ${{ matrix.distro }} \
            ./CodeTracer.AppImage

  test-non-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: nixos
            runner: eph-linux-x64  # CIP-5: nix leg -> eph-linux-x64
          # CIP-5 Wave 4: the macOS leg now runs on the self-hosted nix-darwin
          # runner and drives the tests through codetracer's nix dev shell
          # (``nix develop . --command just test``), same as the nixos leg. The
          # former Homebrew-native ``./non-nix-build/build.sh`` toolchain (brew
          # install just / setup-python / dtolnay rust-toolchain) is gone; nim /
          # cargo / cargo-nextest / nimsuggest all come from the dev shell.
          - platform: macos
            runner: eph-macos-arm64  # CIP-5: nix macOS job -> eph-macos-arm64
    runs-on: ${{ matrix.runner }}
    # macOS tests are new and may have pre-existing failures; don't block PRs
    continue-on-error: ${{ matrix.platform == 'macos' }}
    # NOTE: this job deliberately does NOT declare `needs: [lint-bash,
    # lint-nim, lint-nix, lint-rust]` any more.
    #
    # That dependency existed purely to fail fast and save runner time —
    # the lint jobs produce no artifact and no output this job consumes.
    # Its real effect was to make the entire non-GUI test suite hostage to
    # the lint lane's toolchain: when lint-rust started dying before it
    # linted anything (`direnv: not found`, exit 127; or `Setup dev env`
    # failing for want of a workspace lock), GitHub reported this job as
    # `skipped`, and the run was red from lint anyway, so the missing test
    # coverage was invisible. On `dev`, this job last executed on
    # 2026-06-25 and was skipped on every run after it.
    #
    # The lint jobs remain REQUIRED — ci/verdict/required-jobs.txt lists
    # all four, so a lint failure still fails the run. They just no longer
    # get to silence the tests on their way down.
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup isonim siblings
        # ``just test`` -> ``test-nimsuggest`` needs the codetracer
        # source to build, which pulls in ``../isonim/src`` siblings.
        # Both legs now build inside the nix dev shell, so both need the
        # isonim siblings adjacent to this checkout.
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        # Both legs drive the tests through ``nix develop`` now. On the
        # self-hosted eph-linux-x64 / eph-macos-arm64 runners nix is already
        # on PATH, so setup-nix is a fast no-op; it stays for hosted-runner
        # portability.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # --- macOS setup ---
      # No open-coded just / Python / Rust / cargo-nextest toolchain steps and
      # no ``./non-nix-build/build.sh`` any more: the macOS leg runs the tests
      # inside codetracer's nix dev shell (``nix develop . --command just
      # test``), which provisions nim / cargo / cargo-nextest / nimsuggest from
      # /nix/store exactly like the nixos leg. ``just test`` (test-rust +
      # test-nimsuggest) builds what it needs via cargo, so no explicit
      # pre-build of the ct tree is required here.
      - name: Clone codetracer-trace-format (macOS)
        # The BEAM recorder built below transitively path-depends on
        # codetracer-trace-format / codetracer_trace_writer_nim; its build.rs
        # resolves that crate from the workspace sibling
        # ``$GITHUB_WORKSPACE/../codetracer-trace-format``. Clone it (and its
        # matched FFI half, codetracer-trace-format-nim) with the same
        # ``clone-repo`` + ``ref: dev`` pattern the nixos leg's setup-dev-env
        # uses.
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-trace-format
          # `dev` is where this repo's work lands; its default branch is
          # `stable`, and the last published workspace lock recorded
          # upstream="dev" for it.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-trace-format-nim (macOS)
        # Matched FFI half of codetracer-trace-format: the recorder's build.rs
        # hard-errors ("Nim FFI entry point not found ...
        # codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim")
        # without this sibling. Same pairing the nixos leg's setup-dev-env
        # ``siblings:`` list encodes.
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-trace-format-nim
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format-nim
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone python-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-python-recorder
          ref: main
          path: ${{ github.workspace }}/../codetracer-python-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone ruby-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-ruby-recorder
          ref: main
          path: ${{ github.workspace }}/../codetracer-ruby-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      # ── BEAM (Erlang / Elixir) recorder ──────────────────────────────
      # ``src/db-backend/tests/erlang_flow_dap_test.rs`` and
      # ``elixir_flow_dap_test.rs`` resolve the recorder binary via
      # ``test_harness::find_beam_recorder()``: env var override →
      # ``$PATH`` → sibling ``../codetracer-beam-recorder/target/{debug,
      # release}/codetracer-beam-recorder``.  The tests ``assert!`` and
      # panic when none of those hit, so they need the recorder repo
      # cloned AND its binary compiled before ``./ci/test/non-gui.sh``
      # runs.  Same sibling-pin pattern as codetracer-native-recorder
      # (resolve-mcr-ref + clone-repo + nix-develop build).
      #
      # setup-dev-env clones the BEAM recorder + codetracer-trace-format
      # (the recorder's CTFS path-dep) adjacent to this checkout at the
      # pinned `dev` refs, replacing the former
      # Checkout-manifests / Resolve-lock / per-sibling clone-repo steps.
      # Nix is already installed by the earlier "Install Nix" step on the
      # nixos leg; setup-dev-env's nix install is idempotent.
      - name: Setup dev env (BEAM siblings, nixos)
        if: matrix.platform == 'nixos'
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          # MATCHED FFI PAIR. The "Build codetracer-beam-recorder (nixos)" step
          # below already documents that this recorder "transitively
          # path-depends on codetracer-trace-format/codetracer_trace_writer_nim"
          # -- that crate's build.rs also needs the Nim half checked out as a
          # SIBLING of codetracer-trace-format, and hard-errors without it:
          #
          #   Nim FFI entry point not found at
          #   .../codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim
          #
          # Observed via the identical path-dep from codetracer-shell-recorders
          # (run 31719867246, job 94513828226). Pinned by the
          # "codetracer-trace-format implies codetracer-trace-format-nim"
          # assertion in ci/test/sibling-provisioning-test.sh.
          siblings: |
            codetracer-beam-recorder=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev

      - name: Allow direnv in cloned codetracer-beam-recorder
        # ``elixir_flow_dap_test.rs`` / ``erlang_flow_dap_test.rs``
        # invoke ``elixirc`` / ``erlc`` through
        # ``test_harness::run_in_recorder_shell``, which routes
        # tooling through ``direnv exec <beam-recorder-root> bash -lc``
        # so the BEAM recorder's own dev shell (declaring elixir +
        # erlang + rebar3 in flake.nix) is what supplies the
        # compilers.  ``should_use_recorder_direnv`` first probes
        # ``direnv exec <repo> true`` -- on a fresh clone that probe
        # fails because the cloned ``.envrc`` is in the "blocked"
        # state, so the helper silently falls back to the bare
        # codetracer-shell PATH (which has no elixirc) and the test
        # panics with ``failed to run elixirc in recorder dev shell:
        # No such file or directory (os error 2)``.  Allow the .envrc
        # before the test runs -- same idempotent pattern as the
        # codetracer-native-recorder direnv-allow step above.
        if: matrix.platform == 'nixos'
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv allow "${{ github.workspace }}/../codetracer-beam-recorder"

      - name: Build codetracer-beam-recorder (nixos)
        # ``find_beam_recorder()`` resolves the binary at
        # ``../codetracer-beam-recorder/target/debug/codetracer-beam-recorder``
        # -- pre-build it here so the Erlang / Elixir flow DAP tests
        # don't have to bootstrap the recorder themselves.
        #
        # Use codetracer's nix dev shell (not BEAM's own) because
        # BEAM's flake only ships {cargo, elixir, erlang, rebar3,
        # rustc} and the recorder transitively path-depends on
        # ``codetracer-trace-format/codetracer_trace_writer_nim``,
        # whose build.rs panics with "failed to run `nimble`" when
        # nimble isn't on PATH.  Codetracer's shell ships the full
        # nim/nimble toolchain.
        #
        # We skip ``--locked`` because the sibling
        # codetracer-trace-format clone is pinned to a newer ref
        # than the BEAM recorder's own Cargo.lock was generated
        # against; ``cargo build`` (without --locked) regenerates
        # the lock against the checked-out source.
        #
        # ``CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL=1`` is
        # set because the trace-format-nim crate's build.rs runs
        # ``nimble install --depsOnly`` by default, and the stew
        # dependency isn't in the recorder's nimble metadata --
        # codetracer's vendored ``libs/nim-stew`` is injected via
        # ``CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS`` instead, same
        # pattern as the macos test-non-gui branch above.  rebar3
        # compile (which the recorder's ``build-native`` target
        # also does) is irrelevant for the DAP tests.
        if: matrix.platform == 'nixos'
        shell: bash
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          nix develop .#devShells.x86_64-linux.default --command bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-beam-recorder"
            cargo build
          '

      - name: Clone codetracer-beam-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-beam-recorder
          ref: main
          path: ${{ github.workspace }}/../codetracer-beam-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Build codetracer-beam-recorder (macOS)
        # cargo now comes from codetracer's nix dev shell (``nix develop .``)
        # rather than a DIY rust-toolchain — same source the nixos step above
        # uses, only with the host-default aarch64-darwin shell instead of the
        # explicit x86_64-linux selector.  Codetracer's shell ships the full
        # nim / nimble toolchain the recorder's transitive
        # codetracer_trace_writer_nim build.rs needs.
        #
        # Skip the recorder's ``just build-native`` (which uses ``--locked``)
        # for the same reason as the nixos step -- the trace-format sibling is
        # checked out at a newer ref than the recorder's Cargo.lock expects.
        # ``CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL=1`` +
        # ``CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS`` inject codetracer's
        # vendored stew instead of a network ``nimble install --depsOnly``,
        # exactly as the nixos step does.
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          nix develop . --command bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-beam-recorder"
            cargo build
          '

      # Runs all Rust tests including flow integration tests for all languages.
      # WASM flow tests skip automatically if wazero or wasm32-wasip1 target
      # are not available. Stylus flow tests are #[ignore] and need a devnode.
      # Cross-repo tests (rr) run in the separate test-ui-tests-rr job.
      - name: Run tests
        run: ./ci/test/non-gui.sh
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}

  test-ui-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: nixos
            runner: eph-linux-x64  # CIP-5: nix leg -> eph-linux-x64
          # CIP-5 Wave 4: the macOS leg now runs on the self-hosted nix-darwin
          # runner. The ct binary is built by codetracer's reprobuild recipe in
          # the nix dev shell (``nix develop . --command just build-once`` ->
          # ``src/build-debug-repro/bin/ct``) and the Playwright suite runs
          # inside that same dev shell, replacing the Homebrew-native
          # ``./non-nix-build/build.sh`` toolchain (brew install just /
          # setup-python / dtolnay rust-toolchain).
          - platform: macos
            runner: eph-macos-arm64  # CIP-5: nix macOS job -> eph-macos-arm64
    runs-on: ${{ matrix.runner }}
    # macOS tests are new and may have pre-existing failures; don't block PRs
    continue-on-error: ${{ matrix.platform == 'macos' }}
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env (nix) installs Nix via the shared setup-nix (a fast
        # no-op on the self-hosted eph-linux-x64 / eph-macos-arm64 runners,
        # where nix is already on PATH) and clones the cross-repo siblings
        # adjacent to this checkout (``../<name>``) at their pinned `dev` refs.
        # This replaces the former Checkout-manifests / Resolve-lock /
        # per-sibling clone-repo steps (both legs) and the nixos ``Install Nix``
        # (setup-nix). Nix is provisioned here for both the macOS sibling
        # ``nix develop`` builds and the ct build + Playwright run, which now
        # all go through codetracer's dev shell.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          nix-develop-args: '.?submodules=1'
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            codetracer-native-recorder=dev
            nim-stackable-hooks=dev
            codetracer-visual-replay=dev
            codetracer-native-backend=dev

      - name: Stage codetracer-trace-format into libs/
        # The nix flake build below overrides the codetracer-trace-format input
        # with the in-repo path ./libs/codetracer-trace-format; mirror the
        # sibling clone (placed at ../codetracer-trace-format by
        # setup-dev-env) there.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      # --- NixOS setup ---

      - name: Stage codetracer-trace-format-nim into libs/
        # codetracer-trace-format and codetracer-trace-format-nim are a MATCHED
        # PAIR across an FFI boundary, and must move together or not at all.
        # `codetracer-trace-format/codetracer_trace_writer_nim/src/lib.rs` is the
        # Rust caller; `codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim`
        # is the Nim provider. Overriding only the first one links the newer
        # caller against the older provider:
        #
        #   libcodetracer_trace_writer_nim...rcgu.o: in function
        #     `codetracer_trace_writer_nim::NimTraceReaderHandle::event_metadata':
        #     undefined reference to `ct_reader_event_metadata'
        #   error: could not compile `replay-server` (bin "replay-server")
        #
        # `ct_reader_event_metadata` was added to the Nim side on 2026-08-07;
        # flake.lock pins that repo at 839ed880 (2026-06-24), which does not
        # define it.
        #
        # This is what the per-commit workspace lock was actually buying: not a
        # pinned SHA, but COORDINATION across repos -- it moved both halves to
        # one consistent revision. Pinning each sibling independently to `dev`
        # keeps them current and loses that coordination, so the pair has to be
        # overridden together, explicitly.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format-nim"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format-nim"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      - name: Build CodeTracer (nix)
        if: matrix.platform == 'nixos'
        run: nix build --print-build-logs '.?submodules=1#codetracer' --override-input codetracer-trace-format path:./libs/codetracer-trace-format --override-input codetracer-trace-format-nim path:./libs/codetracer-trace-format-nim

      # --- macOS setup ---
      # The macOS leg now builds the ct binary with codetracer's reprobuild
      # recipe inside the nix dev shell and runs the Playwright suite in that
      # same shell (see the "Build CodeTracer (nix dev shell)" step and
      # ``./ci/test/ui-tests-db.sh`` below). just / nim / cargo / node /
      # Playwright all come from ``nix develop .``; the former open-coded brew
      # install just / setup-python / dtolnay rust-toolchain steps are gone.
      - name: Setup isonim siblings (macOS)
        if: matrix.platform == 'macos'
        # codetracer's nim.cfg ``--path:``s into ``../isonim/src`` and
        # five other isonim sibling repos.  Without them the
        # frontend build aborts with ``cannot open file:
        # isonim/core/async_compat``.  Reuse the composite action
        # the Linux jobs already use.
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      # NOTE: codetracer-trace-format, codetracer-trace-format-nim,
      # codetracer-native-recorder, nim-stackable-hooks, codetracer-visual-replay and
      # codetracer-native-backend are now cloned adjacent to this checkout
      # (``../<name>``) at their pinned `dev` refs by the
      # ``Setup dev env`` step above. The macOS cargo path deps
      # (``../../../codetracer-trace-format/...``), the trace-format-nim FFI
      # entry point, the native-recorder canonicalize, the ct_cli
      # ``gfx_stream/ctfs_visual`` import and the build-license-ffi recipe all
      # resolve against those clones, so the former per-sibling resolve/clone
      # steps (and the trace-format symlink) are no longer needed.

      - name: Clone codetracer-snapshot-codecs sibling (macOS)
        if: matrix.platform == 'macos'
        # codetracer-visual-replay's config.nims threads
        # ``--path:../codetracer-snapshot-codecs/src`` into the Nim
        # compile.  The build aborts with ``cannot open file:
        # snapshot_codecs`` without this checkout.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-snapshot-codecs
          ref: main
          path: ${{ github.workspace }}/../codetracer-snapshot-codecs
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-image-diff sibling (macOS)
        if: matrix.platform == 'macos'
        # Companion sibling to codetracer-snapshot-codecs threaded via
        # the same ``config.nims`` --path; without it ST-M3 test
        # imports break the visual-replay build.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-image-diff
          ref: main
          path: ${{ github.workspace }}/../codetracer-image-diff
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      # NOTE: Nix is installed by the ``Setup dev env`` step above (a fast
      # no-op on the self-hosted eph-macos-arm64 runner, where nix is already
      # on PATH). The former bespoke ``Install Nix (macOS, for ct_cli build)``
      # step is therefore no longer needed; the visual-replay sibling builds
      # below still drive each sibling's own ``nix develop`` flake.

      - name: Build ct-mcr via codetracer-native-recorder nix develop (macOS)
        if: matrix.platform == 'macos'
        # The macOS Playwright suite needs ct_cli/ct_cli built from
        # the codetracer-native-recorder sibling.  Use the recorder's
        # own ``nix develop`` shell + its ``just build-ct-mcr`` target
        # so the recipe is single-sourced in the sibling's Justfile
        # (canonical pattern from
        # metacraft-dev-guidelines/policies/ci-workflow-standards.md
        # "Building artifacts from sibling repos").
        #
        # We bypass scripts/build-siblings.sh because that script
        # assumes direnv-allow state and a parent codetracer dev shell
        # that supplies nim/nimble.  On this runner none of those
        # preconditions hold yet -- ``nix develop`` invokes the recorder's
        # flake directly and supplies the same Nim/Rust/LLDB toolchain
        # the recipe expects, without the direnv allow state plumbing.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-native-recorder"
          # Allow cargo to use git's credential helper so cloning the
          # private ``lldb-sys.rs`` dependency picks up the App-token
          # we set via ``GIT_CREDENTIALS`` below.
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
          nix develop --no-write-lock-file --command just build-ct-mcr

      - name: Build ct_gfx_player via codetracer-visual-replay nix develop (macOS)
        if: matrix.platform == 'macos'
        # The Playwright suite's visual-replay specs
        # ``requireExecutable(ct_gfx_player)`` at module-load time.
        # ``codetracer-visual-replay``'s ``just build`` target wraps
        # ``nimble build`` and emits ct_gfx_player + ct-native-replay
        # at the repo root, which is where
        # ``src/tests/gui/lib/real-visual-trace.ts`` expects them.
        # Same direct ``nix develop --command`` pattern as ct-mcr.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-visual-replay"
          nix develop --no-write-lock-file --command just build

      - name: Build CodeTracer (nix dev shell)
        if: matrix.platform == 'macos'
        # Toolchain-free reprobuild build inside codetracer's nix dev shell,
        # the same path ``dmg-build`` uses on this runner. On Darwin
        # ``scripts/build-once.sh`` selects the reprobuild driver (``repro`` +
        # ``runquotad`` are both provisioned by ``nix develop .``) and emits the
        # ct binary at ``src/build-debug-repro/bin/ct`` — the path
        # ``ci/test/ui-tests-db.sh`` points ``CODETRACER_E2E_CT_PATH`` at. The
        # in-repo ``libs/codetracer-trace-format{,-nim}`` staged above feed the
        # recipe; no ``--override-input`` is needed for the tup/reprobuild dev
        # build. Replaces the old Homebrew ``./non-nix-build/build.sh``.
        run: nix develop . --command just build-once

      - name: Clone python-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-python-recorder
          ref: main
          path: ${{ github.workspace }}/../codetracer-python-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone ruby-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-ruby-recorder
          ref: main
          path: ${{ github.workspace }}/../codetracer-ruby-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Run TypeScript Playwright UI tests (DB-based only)
        run: ./ci/test/ui-tests-db.sh
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}
          CODETRACER_DB_TESTS_ONLY: "1"

  test-ui-tests-rr:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    timeout-minutes: 120
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones codetracer-trace-format adjacent to this checkout at the
        # pinned `dev` ref, replacing the former
        # Checkout-manifests / Resolve-lock / clone-repo / Install Nix steps.
        # The flake build below reads the in-repo path
        # libs/codetracer-trace-format, so the sibling clone is mirrored
        # there by the next step.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev

      - name: Stage codetracer-trace-format into libs/
        # The flake override below points at ./libs/codetracer-trace-format;
        # mirror the sibling clone there.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"


      - name: Stage codetracer-trace-format-nim into libs/
        # codetracer-trace-format and codetracer-trace-format-nim are a MATCHED
        # PAIR across an FFI boundary, and must move together or not at all.
        # `codetracer-trace-format/codetracer_trace_writer_nim/src/lib.rs` is the
        # Rust caller; `codetracer-trace-format-nim/src/codetracer_trace_writer_ffi.nim`
        # is the Nim provider. Overriding only the first one links the newer
        # caller against the older provider:
        #
        #   libcodetracer_trace_writer_nim...rcgu.o: in function
        #     `codetracer_trace_writer_nim::NimTraceReaderHandle::event_metadata':
        #     undefined reference to `ct_reader_event_metadata'
        #   error: could not compile `replay-server` (bin "replay-server")
        #
        # `ct_reader_event_metadata` was added to the Nim side on 2026-08-07;
        # flake.lock pins that repo at 839ed880 (2026-06-24), which does not
        # define it.
        #
        # This is what the per-commit workspace lock was actually buying: not a
        # pinned SHA, but COORDINATION across repos -- it moved both halves to
        # one consistent revision. Pinning each sibling independently to `dev`
        # keeps them current and loses that coordination, so the pair has to be
        # overridden together, explicitly.
        shell: bash
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/../codetracer-trace-format-nim"
          DEST="${{ github.workspace }}/libs/codetracer-trace-format-nim"
          rm -rf "$DEST"
          cp -a "$SRC" "$DEST"

      - name: Build CodeTracer
        run: nix build --print-build-logs '.?submodules=1#codetracer' --override-input codetracer-trace-format path:./libs/codetracer-trace-format --override-input codetracer-trace-format-nim path:./libs/codetracer-trace-format-nim

      - name: Setup rr-backend
        # `ci/setup-rr-backend.sh` resolves codetracer-native-backend's revision
        # from `$RR_BACKEND_REF` first and otherwise from the workspace lock via
        # `scripts/resolve-sibling-rev.sh`. That second route cannot work on a
        # runner: the resolver locates the locks/ tree by walking up for a
        # `.repro/manifests` or `.repo/manifests` directory, and a CI checkout
        # has neither (nothing sets `$CT_MANIFEST_DIR` here either), so it exits
        # 3 with "cannot locate the manifest repo locks/ tree" -- the same
        # lock dependency the `siblings:` entries above were pinned to avoid,
        # reached one step later. Take the documented explicit override, which
        # keeps the script's lock path intact for workspace use.
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
          RR_BACKEND_REF: dev
        run: ./ci/setup-rr-backend.sh

      - name: Run TypeScript Playwright UI tests (RR-based only)
        env:
          CODETRACER_E2E_CT_PATH: ${{ github.workspace }}/result/bin/ct
          CODETRACER_RR_BACKEND_PATH: ${{ github.workspace }}/../codetracer-native-backend
          CODETRACER_RR_BACKEND_PRESENT: "1"
          CODETRACER_RR_TESTS_ONLY: "1"
          PLAYWRIGHT_GLOBAL_TIMEOUT: "10800000"
        run: "nix develop .#devShells.x86_64-linux.default --command just test-gui"

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ui-tests-rr-artifacts
          path: |
            tsc-ui-tests/test-results/
            tsc-ui-tests/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  visual-replay-regression-gate:
    # Visual-replay specs cross-validate HW rasterisation (gfx-real, the
    # Vulkan / OpenGL output the user actually sees) against SW
    # rasterisation (lavapipe), then diff at the pixel level.  Without
    # a real GPU the HW path silently swrasts and the diff degenerates
    # to comparing lavapipe-against-lavapipe -- the gate's whole point
    # disappears.  Pin to runners with the ``gpu`` label so jobs only
    # land on hosts with usable Vulkan / GL drivers (each gpu-server
    # carries 2x RTX 3090; see metacraft-labs/infra
    # services/github-runners/common.nix).
    # EXEMPTION (CIP-5): GPU runner -> kept persistent [self-hosted, gpu]; the HW
    # rasterisation vs lavapipe visual gate needs a real GPU (2x RTX 3090), which
    # the ephemeral eph-linux-x64 class has no access to. 5-platform matrix N/A.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          skip-token-revoke: false

      - name: Checkout CodeTracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave `http.https://github.com/.extraHeader` behind in
          # `.git/config` for the rest of a three-hour job on a persistent GPU
          # runner. This is ordinary least-persistence hygiene — the same reason
          # actions/checkout v6 moved the credential out of `.git/config`
          # entirely — and NOT a boundary the private-Cargo preflight depends
          # on: that header carries the org-wide CI App token, which by policy
          # also authenticates the private lldb-sys dependency, so its presence
          # is never a leak and the preflight no longer asserts anything about
          # it. See the long note in
          # `ci/test/visual-replay-private-cargo-preflight.sh`.
          #
          # Nothing downstream needs the persisted header:
          #   * `Setup dev env` gets the same token explicitly via `gh-token`.
          #   * `submodules: recursive` is unaffected — actions/checkout fetches
          #     submodules under a temporary *global* auth config it installs
          #     regardless of this setting, and only strips the credential in
          #     its `finally` block, after submodules are checked out.
          #   * The gate itself does no network git against this checkout. Its
          #     one authenticated fetch (`git ls-remote` on lldb-sys, in the
          #     preflight) uses the process-scoped `GIT_CONFIG_KEY_0`
          #     extraHeader; every other git-touching step runs with its working
          #     directory inside a *sibling* repo provisioned by setup-dev-env.
          persist-credentials: false

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones every source dependency used by the visual gate adjacent to
        # this checkout at their pinned `dev` refs. That includes the
        # frontend's IsoNim/agent libraries, the incremental runner's trace and
        # I/O libraries, and visual replay's own native siblings. A missing
        # lock entry fails loudly before the build starts.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            isonim=dev
            nim-everywhere=dev
            nim-acp=dev
            nim-agent-harbor=dev
            nim-agents=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            io-mon=dev
            nim-shm-queue=dev
            nim-shm-gset=dev
            nim-stackable-hooks=dev
            codetracer-visual-replay=dev
            codetracer-native-backend=dev
            codetracer-native-recorder=dev
            codetracer-native-test-programs=dev
            codetracer-visual-replay-fixtures=dev

      - name: Run visual replay regression gate
        env:
          # The CodeTracer dev shell already supplies Nim/Nimble. Build the
          # recorder emulator directly instead of re-entering its freshly
          # cloned, unapproved direnv environment; provide the vendored
          # results/stew paths that build_native_api.sh imports.
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
          CODETRACER_VISUAL_REPLAY_REPO_PATH: ${{ github.workspace }}/../codetracer-visual-replay
          CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN: ${{ steps.ci_token.outputs.token }}
          PLAYWRIGHT_GLOBAL_TIMEOUT: "10800000"
        run: |
          set -euo pipefail

          # Cargo's default libgit2 transport does not honor the Git URL
          # authentication installed by setup-dev-env. Force the Git CLI and
          # give it a process-scoped HTTP header for the one private dependency
          # used by codetracer-native-backend. Keep the repository URL free of
          # credentials so the token cannot enter git-remote-https argv. No
          # credential file is written; the App token is revoked by its
          # action's post-job hook.
          lldb_sys_url="https://github.com/metacraft-labs/lldb-sys.rs.git"
          cargo_auth_basic="$(
            printf 'x-access-token:%s' "${CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN}" |
              base64 | tr -d '\r\n'
          )"
          cargo_home="${RUNNER_TEMP}/visual-replay-cargo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${cargo_home}"
          mkdir -p "${cargo_home}"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          export CARGO_HOME="${cargo_home}"
          export CODETRACER_VISUAL_REPLAY_CLEAN_CARGO_HOME=true
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          export SSH_ASKPASS=/bin/false
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null

          # A self-hosted runner may carry process-scoped Git configuration
          # from its launcher. Remove every numbered entry before installing
          # the closed configuration below; entries above GIT_CONFIG_COUNT are
          # ignored by Git today, but must not become active if this list is
          # extended later. GIT_CONFIG_PARAMETERS is a separate inline channel.
          for git_env_name in "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}"; do
            if [[ "${git_env_name}" =~ ^GIT_CONFIG_(KEY|VALUE)_[0-9]+$ ]]; then
              unset "${git_env_name}"
            fi
          done
          unset GIT_CONFIG_PARAMETERS GIT_CONFIG_NOSYSTEM GIT_ALLOW_PROTOCOL

          # Carry only the header and helper block through Nix shell startup.
          # The gate re-establishes all non-secret policy values after the
          # git-hooks shell hook has finished and before invoking Git/Cargo.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${lldb_sys_url}.extraHeader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${cargo_auth_basic}"
          export GIT_CONFIG_KEY_1="credential.helper"
          export GIT_CONFIG_VALUE_1=""
          unset CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN cargo_auth_basic

          cleanup_private_cargo_auth() {
            rm -rf "${cargo_home}"
            unset CARGO_NET_GIT_FETCH_WITH_CLI CARGO_HOME
            unset CODETRACER_VISUAL_REPLAY_CLEAN_CARGO_HOME
            unset GIT_TERMINAL_PROMPT GIT_ASKPASS SSH_ASKPASS
            unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM
            unset GIT_CONFIG_PARAMETERS GIT_CONFIG_NOSYSTEM GIT_ALLOW_PROTOCOL
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
            unset git_env_name lldb_sys_url cargo_home
          }
          trap cleanup_private_cargo_auth EXIT

          nix develop .#devShells.x86_64-linux.default --command just test-visual-replay-gate

      - name: Stage sibling artifacts into workspace
        # actions/upload-artifact@v5 forbids paths containing ``..``
        # and absolute paths outside the workspace, so the previous
        # config aborted with ``Invalid pattern '../codetracer-visual-replay/...':
        # Relative pathing '.' and '..' is not allowed``.  Copy any
        # sibling and /tmp artifacts into a workspace staging dir so
        # the upload step can reference them via workspace-relative
        # globs.
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          STAGE="visual-replay-regression-staging"
          mkdir -p "${STAGE}/sibling/tests/output" \
                   "${STAGE}/sibling/bench-results" \
                   "${STAGE}/tmp"
          if [ -d ../codetracer-visual-replay/tests/output ]; then
            cp -a ../codetracer-visual-replay/tests/output/. \
                  "${STAGE}/sibling/tests/output/" 2>/dev/null || true
          fi
          if [ -d ../codetracer-visual-replay/bench-results ]; then
            cp -a ../codetracer-visual-replay/bench-results/. \
                  "${STAGE}/sibling/bench-results/" 2>/dev/null || true
          fi
          shopt -s nullglob
          for f in /tmp/*_diff.rgba /tmp/*_sw.rgba /tmp/*_hw.rgba; do
            cp -a "$f" "${STAGE}/tmp/" 2>/dev/null || true
          done

      - name: Upload visual replay artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-replay-regression-artifacts
          path: |
            src/tests/gui/test-results/
            src/tests/gui/playwright-report/
            src/tests/gui/test-stats/
            storybook/storybook-static/
            storybook/dist/
            visual-replay-regression-staging/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ct-test gates.
  #
  # `ci/test/m16-release-gate.sh` and `ci/test/ct-providers.sh` were real,
  # maintained scripts that NO pipeline invoked: `.gitlab-ci.yml`'s only test
  # jobs are `just test` (test-rust + test-nimsuggest + optional cross-repo) and
  # `ci/test/ui-tests.sh`, and no workflow here named either script. They ran
  # only when a human typed `just test-m16-release-gate` / `just
  # test-ct-providers`. Every suite listed in them — not just the most recently
  # added one — has therefore been in a gate that never gated.
  #
  # They are split across two jobs on purpose, because they have very different
  # prerequisites and mixing them would let the harder one's infrastructure
  # failures mask the easier one's test failures:
  #
  #   * `ct-test-release-gate` needs nothing but the codetracer dev shell. It is
  #     the toolchain-light provider matrix plus the framework contract,
  #     discovery, run-store and worker-pool suites.
  #   * `ct-test-providers` drives real external toolchains AND three recorder
  #     siblings (native/ct-mcr, JavaScript, Ruby), which have to be checked out
  #     and built before the recording assertions can run.
  #
  # Neither job weakens what the scripts check: `CT_PROVIDERS_ALLOW_MISSING` and
  # `CT_PROVIDERS_SKIP_SIBLINGS` are deliberately NOT set, so a recorder that is
  # missing or fails to build fails the job instead of quietly turning the
  # recording assertions into no-ops.
  # ---------------------------------------------------------------------------
  ct-test-release-gate:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    name: ct-test release gate (M16 provider matrix)
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility ALL from
        # being readable inside private repos, so we mint per-run installation
        # tokens from the repo-local CI_TOKEN_PROVIDER_APP_ID +
        # CI_TOKEN_PROVIDER_PRIVATE_KEY secrets via the CI Token Provider App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Setup isonim siblings
        # The gate's last two suites are ViewModel tests under
        # src/frontend/viewmodel/, which build against ../isonim/src et al. via
        # codetracer's top-level nim.cfg. Same prerequisite as `viewmodel-tests`.
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Run the M16 ct-test release gate
        # The ct_test sources import runquota_process; the dev shell exports
        # RUNQUOTA_SRC (nix/shells/ci-base.nix) and src/ct_test/config.nims
        # turns that into the --path set, so no runquota sibling checkout is
        # needed here.
        run: nix develop .#devShells.x86_64-linux.default --command just test-m16-release-gate

  ct-test-providers:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    name: ct-test cross-language provider gate
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          skip-token-revoke: false

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # ci/test/ct-providers.sh requires three recorder siblings checked out
        # at ../<repo> and builds each through its own pinned dev shell
        # (scripts/build-siblings.sh -> `direnv exec <repo> just build`). Without
        # them the script aborts in its very first suite, which is why it could
        # never simply be dropped into an existing job.
        #
        # setup-dev-env clones them adjacent to this checkout at
        # pinned `dev` refs — the same mechanism
        # `visual-replay-regression-gate` and `test-non-gui` already use, so
        # this is not new infrastructure. The trace-format / io-mon /
        # stackable-hooks / nim-shm-queue entries are the native recorder's own
        # build dependencies, mirroring the visual gate's sibling list.
        #
        # codetracer-native-backend is listed for the NATIVE RECORDER's sake,
        # not this job's: `build-siblings.sh` runs `just build-ct-mcr`, whose
        # `build-license-ffi` recipe opens with
        # `cd ../codetracer-native-backend && ...` to build `ct_license_ffi` out
        # of the backend checkout. Without it:
        #
        #   sh: line 1: cd: ../codetracer-native-backend: No such file or directory
        #   error: could not find `Cargo.toml` in `.../codetracer-native-recorder`
        #   error: Recipe `build-license-ffi` failed on line 123 with exit code 101
        #
        # The recipe `&&`-chains only its first link and uses `;` after, so the
        # failed `cd` does not abort it -- cargo just runs in the recorder root,
        # which has no root Cargo.toml, and the error names the wrong repo.
        #
        # A gap in this list, not in the lock: the recipe is byte-identical at
        # the last lock-pinned recorder revision (196f95c9, 2026-07-07) and at
        # today's `dev`, and neither revision has a root Cargo.toml, so the
        # lock-pinned build would have failed the same way. It stayed invisible
        # because this job could not get past `Setup dev env` to reach it.
        #
        # codetracer-visual-replay is here for the same reason, one layer on:
        # once the backend is present, `build-license-ffi` succeeds and the
        # build reaches `cd ct_cli && nimble build`, which imports
        # `gfx_stream/ctfs_visual` -- a module that lives in
        # codetracer-visual-replay/src/gfx_stream, not in the recorder:
        #
        #   ct_cli/src/ct_cli/extract_gfx_cmd.nim(39, 18)
        #     Error: cannot open file: gfx_stream/ctfs_visual
        #   error: Recipe `build-ct-mcr` failed on line 43 with exit code 1
        #
        # `visual-replay-regression-gate` already lists it. Same missing-sibling
        # class as the backend above, uncovered only because fixing the first
        # one let the build run far enough to hit the second.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@main
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          siblings: |
            nim-everywhere=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            io-mon=dev
            nim-shm-queue=dev
            nim-shm-gset=dev
            nim-stackable-hooks=dev
            codetracer-native-recorder=dev
            codetracer-js-recorder=dev
            codetracer-ruby-recorder=dev
            codetracer-native-backend=dev
            codetracer-visual-replay=dev

      - name: Allow direnv in the cloned recorder siblings
        # scripts/build-siblings.sh runs every sibling build as
        # `direnv exec <repo> …` so the repo's own flake pins its toolchain. A
        # freshly cloned .envrc is in direnv's "blocked" state, so without this
        # the build step fails (or silently falls back to the wrong PATH) —
        # the same hazard `test-non-gui` handles for codetracer-beam-recorder.
        run: |
          set -euo pipefail
          for sibling in codetracer-native-recorder codetracer-js-recorder codetracer-ruby-recorder; do
            nix develop .#devShells.x86_64-linux.default -c \
              direnv allow "${{ github.workspace }}/../${sibling}"
          done

      - name: Run the cross-language ct-test provider gate
        # No CT_PROVIDERS_ALLOW_MISSING / CT_PROVIDERS_SKIP_SIBLINGS: a missing
        # or unbuildable recorder must fail this job, not silently degrade the
        # recording assertions into checks of nothing.
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
        run: nix develop '.?submodules=1' --command just test-ct-providers

      - name: Upload sibling build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ct-test-providers-sibling-logs
          # scripts/build-siblings.sh captures each recorder build into
          # .tools/build-siblings-logs/<repo>.log (LOG_DIR in that script);
          # without them a sibling build failure reports only its exit code.
          path: .tools/build-siblings-logs/
          retention-days: 14
          if-no-files-found: ignore

  push-to-attic:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    needs:
      - test-non-gui
      - test-ui-tests
      - appimage-lib-check
      - dmg-lib-check
    if: "github.ref == 'refs/heads/main' && ${{ !github.event.codetracer-ci }}"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default --command ./ci/deploy/build-nix-and-push-to-attic.sh"
        env:
          ATTIC_ENDPOINT: ${{ vars.ATTIC_ENDPOINT }}
          ATTIC_CACHE: ${{ vars.ATTIC_CACHE }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}

  build-and-deploy-docs:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    # The docs site is INDEPENDENT content: it is built by its own isonim-docs
    # SSG consumer (docs/book-isonim via ci/deploy/docs.sh) and consumes NO
    # artifact from the app build or the attic-cache push. It must therefore not
    # be chained behind push-to-attic (which needs the full build/test matrix:
    # test-non-gui, test-ui-tests, appimage/dmg-lib-check) — otherwise any
    # unrelated app-CI failure silently blocks the docs deploy. Decoupled so the
    # docs publish on every main push regardless of build/test status. The attic
    # substituter set up in "Install Nix" is a read-through cache that works
    # whether or not this run's push-to-attic populated it.
    if: ${{ github.ref == 'refs/heads/main' && !github.event['codetracer-ci'] }}
    permissions:
      contents: "write"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Check out sibling repos for the isonim-docs SSG build
        # The docs are now built by the isonim-docs SSG consumer at
        # docs/book-isonim/ (see ci/deploy/docs.sh), whose config.nims
        # `--path`-switches to sibling checkouts laid out one level above this
        # repo (book-isonim/../../../<repo>): isonim, isonim-docs,
        # nim-everywhere, nim-faststreams, nim-stew. actions/checkout can only
        # write inside the workspace, so clone each sibling next to the
        # codetracer checkout with the cross-repo installation token minted
        # above. This mirrors isonim-docs/.github/workflows/ci.yml's
        # sibling-checkout layout (adjusted for book-isonim's extra depth).
        #
        # Sibling revisions default to each repo's default branch, matching
        # the isonim-docs CI convention; if/when isonim-docs joins the
        # workspace-lock cross-repo CI, these should move to pinned-lock
        # resolution instead.
        env:
          SIBLING_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          for repo in isonim isonim-docs nim-everywhere nim-faststreams nim-stew codetracer-design-system; do
            dest="${GITHUB_WORKSPACE}/../${repo}"
            rm -rf "$dest"
            git clone --depth 1 \
              "https://x-access-token:${SIBLING_TOKEN}@github.com/metacraft-labs/${repo}.git" \
              "$dest"
          done

      - env:
          # docs.sh pushes gh-pages with this (the job's GITHUB_TOKEN + the
          # contents:write permission below) -- the same reliable mechanism the
          # isonim/isonim-docs docs deploys use. The old origin+CODETRACER_PUSH_
          # GITHUB_TOKEN path failed auth ("Authentication failed for .../codetracer").
          #
          # `origin` is deliberately NOT re-pointed at a credentialed URL here.
          # docs.sh only reads `origin` in its DEPLOY_TOKEN-absent fallback
          # (`ci/deploy/docs.sh`, the `git push --force "$REMOTE" HEAD:gh-pages`
          # branch), and DEPLOY_TOKEN is always set on this step -- so the
          # rewrite could never be the credential that pushed, it could only
          # expand a long-lived PAT into `.git/config` on a self-hosted runner
          # that reuses its workspace. This is a category-1 push (the
          # workflow's own public repo), and the policy credential for that is
          # the token Actions already provides.
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config init.defaultBranch main

          nix develop .#devShells.x86_64-linux.default --command ./ci/deploy/docs.sh

  push-tag:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    needs: [ dev-build, nix-build, appimage-build, dmg-build ]
    permissions:
      contents: "write"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix
        uses: metacraft-labs/nixos-modules/.github/install-nix@main
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Configure Nix for private repos
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ steps.ci_token.outputs.token }}" >> ~/.config/nix/nix.conf
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Create tag
        if: ${{ github.ref == 'refs/heads/main' }}
        id: tag
        run: |
          YEAR=$(bash -c 'grep "CodeTracerYear\*" src/ct/version.nim | sed "s/.*CodeTracerYear\* = //g"')
          MONTH=$(bash -c "printf '%02d' \$(grep \"CodeTracerMonth\*\" src/ct/version.nim | sed \"s/.*CodeTracerMonth\* = //g\")")
          BUILD=$(bash -c 'grep "CodeTracerBuild\*" src/ct/version.nim | sed "s/.*CodeTracerBuild\* = //g"')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config init.defaultBranch main

          # `origin` is deliberately NOT re-pointed at a credentialed URL.
          #
          # It used to be, at `CODETRACER_PUSH_GITHUB_TOKEN` -- a long-lived
          # PAT, and the last rotation-bearing GitHub credential in this
          # workflow. That userinfo could never be the credential that pushed.
          # The `Checkout` step above runs with `persist-credentials` at its
          # default of true, so actions/checkout leaves
          # `http.https://github.com/.extraheader` in `.git/config` carrying
          # the App installation token, and Git prefers a configured
          # Authorization header over userinfo in the remote URL.
          #
          # That preference is total, not merely a first choice, which is what
          # makes deleting the line safe rather than a gamble. Against a server
          # that answers 401, `git push` retries with the SAME header and then
          # gives up; the userinfo is never put on the wire at all, so it is not
          # a fallback either. (Reproducible without any real credential: point
          # a checkout at a local HTTP server with both an `extraHeader` and
          # userinfo configured, and read the `Authorization` it receives.)
          #
          # So the App token was already performing this push, and removing the
          # rewrite changes which credential authenticates not at all -- it only
          # stops expanding a PAT into `.git/config` on a self-hosted runner
          # that reuses its workspace. `persist-credentials` must therefore STAY
          # enabled on the checkout above: here the persisted header is
          # load-bearing, which is the opposite of the situation in most jobs.
          #
          # STILL UNVERIFIED, for whoever runs the next release. Whether the App
          # installation has `contents: write` on this repo has never been
          # exercised: the last tag (25.11.1) predates the switch to App tokens,
          # and no `main` run has reached this job since. If the tag push fails
          # with 403, that is the App's permission set, NOT this change -- the
          # PAT was already inert and restoring it would not help. Grant the
          # installation contents:write rather than reintroducing a PAT.
          git tag -a "$YEAR.$MONTH.$BUILD" -m "Release $YEAR.$MONTH.$BUILD" || echo "Tag already exists"
          (git push origin "$YEAR.$MONTH.$BUILD" && echo "tag=$YEAR.$MONTH.$BUILD" >> $GITHUB_OUTPUT) || echo "Tag already exists"

  create-release:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    needs: [ push-tag ]
    if: ${{ ((startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')) || needs.push-tag.outputs.tag != '') && !github.event['codetracer-ci'] }}
    permissions:
      contents: "write"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix
        uses: metacraft-labs/nixos-modules/.github/install-nix@main
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Configure Nix for private repos
        run: |
          mkdir -p ~/.config/nix
          echo "access-tokens = github.com=${{ steps.ci_token.outputs.token }}" >> ~/.config/nix/nix.conf
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://x-access-token:${{ steps.ci_token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Create resource tarball
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c "tar cfJ resources.tar.xz resources/"
          nix develop .#devShells.x86_64-linux.default --command bash -c "gpg --detach-sign resources.tar.xz"
      - name: Upload latest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command wget "https://downloads.codetracer.com/CodeTracer-main-arm64.dmg"
          nix develop .#devShells.x86_64-linux.default --command wget "https://downloads.codetracer.com/CodeTracer-main-arm64.dmg.asc"
          nix develop .#devShells.x86_64-linux.default --command wget "https://downloads.codetracer.com/CodeTracer-main-amd64.AppImage"
          nix develop .#devShells.x86_64-linux.default --command wget "https://downloads.codetracer.com/CodeTracer-main-amd64.AppImage.asc"

          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-arm64.dmg s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg --checksum-algorithm CRC32
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-arm64.dmg.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg.asc --checksum-algorithm CRC32
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-amd64.AppImage s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ needs.push-tag.outputs.tag }}-amd64.AppImage --checksum-algorithm CRC32
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-amd64.AppImage.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ needs.push-tag.outputs.tag }}-amd64.AppImage.asc --checksum-algorithm CRC32

          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-arm64.dmg s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-latest-arm64.dmg --checksum-algorithm CRC32
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-arm64.dmg.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-latest-arm64.dmg.asc --checksum-algorithm CRC32
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-amd64.AppImage s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-latest-amd64.AppImage --checksum-algorithm CRC32
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer-main-amd64.AppImage.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-latest-amd64.AppImage.asc --checksum-algorithm CRC32

      - name: Get changelog text
        id: changelog
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c "awk '/^## /{if (p) exit; p=1} p' CHANGELOG.md > release_changelog.md"
          echo "\

          We're actively working on multiple exciting features, which are not fully released yet. Stay tuned!

          Available downloads:

          <a href="https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg"><img width="75px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Apple_logo_grey.svg"></a>
          <a href="https://deb.codetracer.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/9/9e/UbuntuCoF.svg"></a>
          <a href="https://deb.codetracer.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/6/66/Openlogo-debianV2.svg"></a>
          <a href="https://rpm.codetracer.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/d/d8/Red_Hat_logo.svg"></a>
          <a href="https://rpm.codetracer.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Fedora_logo.svg"></a>
          <a href="https://github.com/metacraft-labs/metacraft-overlay"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/4/48/Gentoo_Linux_logo_matte.svg"></a>
          <a href="https://aur.archlinux.org/packages/codetracer"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/1/13/Arch_Linux_%22Crystal%22_icon.svg"></a>
          <a href="https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-amd64.AppImage"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/7/73/App-image-logo.svg"></a>

          Key signatures:

          [![Download macOS Signature](https://img.shields.io/badge/Download-macOS%20Signature-blue?style=for-the-badge)](https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg.asc)
          [![Download AppImage Signature](https://img.shields.io/badge/Download-AppImage%20Signature-blue?style=for-the-badge)](https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-amd64.AppImage.asc)
          [![Download PGP Key](https://img.shields.io/badge/Download-PGP%20key-blue?style=for-the-badge)](https://downloads.codetracer.com/CodeTracer.pub.asc)" >> release_changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "release_changelog.md"
          draft: true
          prerelease: false
          files: |
            resources.tar.xz
            resources.tar.xz.asc
          generate_release_notes: false
          tag_name: "${{ needs.push-tag.outputs.tag }}"

  queue-watchdog:
    # Alarm, not a gate: is anything actually SERVICING this run?
    #
    # `ci-verdict` below answers "did the required jobs run?", and answers it
    # correctly -- but it cannot answer at all until every job it declares
    # `needs:` on has reached a conclusion. A job that never gets a runner
    # never reaches one: it does not fail and it does not finish, it sits
    # `queued` until GitHub cancels it at the 24-hour ceiling. Neither GitHub
    # timer covers that state -- the 24h limit applies to a job WAITING for a
    # runner, `timeout-minutes` to a job that has STARTED -- so the verdict
    # lands about a day after the push, and for that whole day "nothing is
    # servicing this run" is indistinguishable from "CI is still thinking".
    # The `ci-verdict` header has to warn readers not to read a missing
    # verdict as a passing one; this job is what puts a deadline on that
    # warning.
    #
    # It declares NO `needs:`, so it starts in the first scheduling wave and
    # is watching before there is anything to watch. Nothing declares `needs:`
    # on it and it is deliberately absent from ci/verdict/required-jobs.txt:
    # like `workspace-lock-freshness`, it must be loud and structurally
    # incapable of cascading. An alarm that can skip a test job would be a
    # worse defect than the one it reports.
    #
    # WHAT IT IS NOT. It is NOT a "does a runner exist for label X?" precheck,
    # because that is not implementable against this org:
    # `/orgs/{org}/actions/runner-scale-sets` answers 404, and scale-set
    # runners appear in `/orgs/{org}/actions/runners` with an EMPTY `labels`
    # array -- so comparing `runs-on:` labels against registered runner labels
    # would declare healthy job classes unserviceable and cry wolf on every
    # run. This watches the run's own observed behaviour instead, which needs
    # no runner introspection and no permission beyond reading its own run.
    #
    # Stock ubuntu-latest, bash + jq + curl: a watchdog must not share the
    # failure mode it watches for. If this needed a self-hosted runner, a run
    # starved of self-hosted runners would starve the watchdog too, and it
    # would fall silent at exactly the moment it is meant to speak.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The jobs API of this run. The workflow's top-level grant is
      # `contents: read` only, so this must be named here or every poll 403s
      # and the watchdog retries forever without ever reaching a verdict.
      actions: read
    # Must exceed --deadline-minutes, or the job is killed before it can
    # report. It exits as soon as nothing is queued, so a healthy run releases
    # this runner early rather than holding it for the ceiling.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Self-test the queue watchdog
        # Same rule as `ci-verdict`'s self-tests: a gate is only worth trusting
        # if its own contracts hold, and they are checked on every run against
        # fixtures captured from the real starved runs it was built for.
        run: bash ci/verdict/queue-watchdog-test.sh

      - name: Fail if nothing is servicing this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ci/verdict/queue-watchdog.sh --poll \
            --deadline-minutes 30 --interval-seconds 30

  ci-verdict:
    # Final gate: assert that CI actually RAN the jobs it gates on.
    #
    # GitHub reports a job whose dependency failed as `skipped`, and
    # `skipped` is not `failure`. When `lint-rust` started failing early —
    # in `Setup dev env` for want of a repo-workspaces workspace lock on
    # the pushed commit, or one step later at `direnv: not found` — every
    # job declaring `needs: [lint-bash, lint-nim, lint-nix, lint-rust]`,
    # including `test-non-gui`, the whole non-GUI suite, was silently
    # skipped. The run went red regardless, so for six weeks "the tests
    # are failing" and "the tests never ran" looked identical. On `dev`,
    # `test-non-gui` last actually executed on 2026-06-25.
    #
    # This job exists so those two states never look alike again. It does
    # not suppress or soften any failure: a required job that ran and
    # failed still fails this gate (exit 1). It only ensures that a
    # required job which never ran fails LOUDLY and differently (exit 2).
    #
    # It deliberately runs on a stock GitHub-hosted runner with nothing
    # but checkout + bash + jq — no Nix, no dev shell, no setup-dev-env,
    # no workspace lock, no cross-repo siblings. A watchdog must not share
    # the failure mode it is watching for; if this job needed the dev env,
    # the very outage it reports would take it down too.
    #
    # KNOWN LATENCY — read before trusting the absence of a verdict.
    # Two jobs in the needs: list below, `reprobuild-macos-smoke` and
    # `origin-dap-macos`, request `runs-on: eph-macos-arm64`, and no
    # registered runner carries that label (the org's darwin runners
    # expose aarch64-darwin / nix-darwin / darwin instead). Those jobs
    # therefore never get scheduled: they sit queued until GitHub's
    # 24-hour ceiling cancels them. Because this gate waits on them, its
    # verdict cannot be published until ~24h after the push. It is
    # correct when it arrives, but it is NOT prompt, and a run that is
    # still in progress has simply not been judged yet — do not read a
    # missing verdict as a passing one. Fixing the runner labels removes
    # the delay; dropping those jobs from needs: would remove the delay
    # by giving up the coverage, which is the trade this gate exists to
    # refuse.
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust
      - dev-build
      - nix-build
      - appimage-build
      - dmg-build
      - appimage-lib-check
      - appimage-cross-distro
      - dmg-lib-check
      - test-non-gui
      - test-ui-tests
      - test-ui-tests-rr
      - cross-process-linux
      - viewmodel-tests
      - visual-replay-regression-gate
      - ct-test-release-gate
      - ct-test-providers
      - windows-bootstrap-smoke
      - windows-named-pipe-tests
      - windows-rust-components
      - windows-headless-test
      - origin-dap-windows
      - origin-dap-macos
      - reprobuild-linux-smoke
      - reprobuild-macos-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false

      - name: Self-test the verdict gate
        # The gate is only worth trusting if its own contracts hold, so
        # they are checked on every run, against fixtures captured from
        # the real broken runs this gate was built for.
        run: bash ci/verdict/required-jobs-test.sh

      - name: Assert the Windows lane provisions its own git and bash
        # The eph-win-x64 image ships neither; five of the six Windows jobs
        # did not run the bootstrap that supplies them, and the lane failed
        # in three places that looked unrelated. This is a static contract
        # over this workflow file, so it can be enforced from a Linux runner
        # -- which matters, because the Windows lane had no signal at all
        # for the months this went unnoticed.
        run: bash ci/test/windows-runner-bootstrap-test.sh

      - name: Assert every job's sibling checkout is self-sufficient
        # Two halves of one contract, both static checks over this workflow
        # file, so they run here from a stock runner where they cannot be
        # taken down by the outages they watch for.
        #
        # WHICH REF: a bare `siblings:` entry resolves its revision from a
        # workspace lock in metacraft-labs/metacraft-manifests, which has
        # published nothing for this repo since 2026-08-02. Six jobs died in
        # their first real step for eight days because of it, and nine more
        # were reported `skipped` in consequence -- the state the verdict step
        # below exists to name.
        #
        # WHICH CREDENTIAL: one org-scoped installation token per job, minted
        # from the per-repo secret. The org-variable form of the app id
        # resolves only because this repo is public and evaluates to the empty
        # string anywhere else; a job that minted two tokens made it ambiguous
        # which one a step used; and an unresolved `steps.*.outputs.token`
        # silently becomes an empty token rather than an error.
        run: bash ci/test/sibling-provisioning-test.sh

      - name: Self-test the private-registry credential preflight
        # This suite is also run by `visual-replay-regression-gate`, but that
        # job needs a GPU runner, a workspace lock and eight sibling
        # checkouts, so it is exactly the kind of lane that can stop
        # executing without anyone noticing -- which is what this whole
        # verdict job exists to prevent. The suite itself needs only bash,
        # git and coreutils (its `cargo` is a stub), so running it here as
        # well means the boundary and credential-leak contracts around the
        # private lldb-sys token are checked on every run, from a stock
        # runner, regardless of the state of the heavy lanes.
        run: bash ci/test/visual-replay-private-cargo-preflight-test.sh

      - name: Assert the required jobs actually ran
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > "${RUNNER_TEMP}/needs.json"
          bash ci/verdict/required-jobs.sh --needs-json "${RUNNER_TEMP}/needs.json"

  workspace-lock-freshness:
    # Alarm, not a gate: is the shared manifests repo still receiving workspace
    # locks for this repo's commits?
    #
    # Until 2026-08-04 that question was answered as a side effect —
    # `setup-dev-env` resolved every cross-repo sibling from the per-commit
    # lock, so an unlocked commit could not get past `Setup dev env`. That
    # coupling was a terrible gate (six jobs dead in their first real step, nine
    # more `skipped`, for eight days) and the `siblings:` entries above now name
    # their refs explicitly so it cannot recur. But it was also the only thing
    # anyone was watching, and the condition it was accidentally reporting is
    # not small: nothing has been committed to the manifests repo, for ANY repo,
    # since 2026-08-02. Those locks are what make a published workspace state
    # reproducible, so the stall means no reproducible snapshot exists for any
    # commit in that window.
    #
    # Fixing the pipeline must not be the thing that hides that. Hence a job
    # with its own name, red on every run while the stall lasts.
    #
    # NOTHING declares `needs:` on this job, and it is deliberately absent from
    # `ci/verdict/required-jobs.txt`. A red check here must never be able to
    # skip a test job — coupling lock publication to the test suite is exactly
    # the defect being undone, and re-introducing it as a gate would trade an
    # eight-day outage for the next one. Loud, and structurally incapable of
    # cascading.
    #
    # Stock ubuntu-latest, bash + git only: like `ci-verdict`, a watchdog must
    # not share the failure mode it watches for.
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Mint installation token for the manifests repo
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        # depth 2 so HEAD's first parent is present: that is the second
        # candidate, and the one that kept `dev` resolvable for exactly one
        # commit after publication stopped.
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Clone the manifests repo
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch latest \
            "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/metacraft-manifests.git" \
            "${RUNNER_TEMP}/metacraft-manifests"

      - name: Assert this commit has a published workspace lock
        run: |
          set -uo pipefail
          # HEAD plus its first parent — the same two candidates clone-siblings
          # probes. `git rev-parse HEAD^` is empty for a root commit or if the
          # fetch depth did not reach the parent; the script ignores empty and
          # all-zero candidates.
          PARENT="$(git rev-parse --verify --quiet HEAD^ || true)"
          bash ci/verdict/workspace-lock-freshness.sh \
            --manifest-dir "${RUNNER_TEMP}/metacraft-manifests" \
            --sha "${GITHUB_SHA}" \
            --sha "${PARENT}"
