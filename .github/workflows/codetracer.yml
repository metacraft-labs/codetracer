name: Codetracer CI
on:
  push:
    branches:
      - main
      - dev
      - stable
      # Scheduling rationale: see docs/ci-server.md, GitHub Actions scheduling.
      - cloud
  pull_request:
    branches-ignore: [agents]

  # Scheduling rationale: see docs/ci-server.md, GitHub Actions scheduling.
  workflow_dispatch:

# Scheduling rationale: see docs/ci-server.md, GitHub Actions scheduling.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('coverage-{0}', github.ref_name) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

# Every job below carries an explicit `timeout-minutes`, each derived from that
# job's own measured durations and quoted on it; the rule, its traps and the
# worst-case path through `needs:` are in docs/ci-server.md, "The codetracer
# workflow: how each timeout-minutes was arrived at".

jobs:
  windows-bootstrap-smoke:
    # The job is in .github/workflows/windows-bootstrap-smoke.yml.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-bootstrap-smoke.yml
    secrets: inherit

  origin-dap-windows:
    # The job is in .github/workflows/origin-dap-windows.yml.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/origin-dap-windows.yml
    secrets: inherit

  origin-dap-windows-toolchain:
    # The job is in .github/workflows/origin-dap-windows-toolchain.yml.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/origin-dap-windows-toolchain.yml
    secrets: inherit

  origin-dap-windows-nightly:
    # The job is in .github/workflows/origin-dap-windows-nightly.yml.
    needs: origin-dap-windows-toolchain
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/origin-dap-windows-nightly.yml
    secrets: inherit

  windows-named-pipe-tests:
    # The job is in .github/workflows/windows-named-pipe-tests.yml.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-named-pipe-tests.yml
    secrets: inherit

  windows-rust-components:
    # The job is in .github/workflows/windows-rust-components.yml.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-rust-components.yml
    secrets: inherit

  windows-headless-test:
    # The job is in .github/workflows/windows-headless-test.yml.
    needs:
      - windows-rust-components
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-headless-test.yml
    secrets: inherit

  lint-bash:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # 200-run window (2026-09-03..05): 22 green, median 2.8m, max 3.1m.
    # No longer one linter: ci/lint/bash.sh also runs ~46 contract suites.
    # Run 44269676398 took 14.5m (6.5m setup, ~8m of suites); on 44379188088
    # a garm runner spent 9.5m on setup and the 15m limit cut the suites off
    # mid-way. 30m is ~2x the slowest measured body plus setup.
    timeout-minutes: 30
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # MEASURE THE FETCH ENVIRONMENT BEFORE NIX TOUCHES THE NETWORK, and
      # before the FIRST `nix develop` in this job rather than before the
      # lint one -- a job whose earlier `nix develop` dies never reaches a
      # diagnostic placed after it. Three explanations for the
      # `could not read Username` failure have been proposed and disproven;
      # this ends the guessing. Unconditional, cannot redden the job, prints
      # no credential value.
      - uses: ./.github/actions/dump-git-fetch-env
        with:
          # Two authenticated probes as paired controls against the
          # anonymous one. Never printed; see the action.
          gh-token: ${{ steps.ci_token.outputs.token }}

      # `devShells.lint`, NOT `.default`. The default shell reaches the Cargo
      # git closure of Sui and Solana through `nix-blockchain-development` when
      # its `nativeBuildInputs` are evaluated, and this stage runs bash,
      # shellcheck, python3, node and nimsuggest. That is what the whole
      # `lint-*` stage has been dying inside, before a single lint ran:
      #
      #   error: Failed to fetch git repository https://github.com/anza-xyz/crossbeam
      #   fatal: could not read Username for 'https://github.com'
      #
      # The lint shell takes `pkgs` and nothing else, so that closure is never
      # forced. See nix/shells/lint.nix for how its package list was derived
      # (what the scripts INVOKE, not what they mention) and for why this does
      # not serve `lint-nix` or `lint-rust`.
      #
      # `ci/lib/require-tools.sh` runs as the stage's first `lint_step`, so a
      # shell missing a tool says which one BY NAME instead of dying obscurely
      # inside a contract suite.
      - run: "nix develop .#devShells.x86_64-linux.lint -c ./ci/lint/bash.sh"
        env:
          # flake-lock-metadata-test asks GitHub for each direct input's commit
          # date, and in CI it fails hard rather than skip when it cannot. The
          # token this job already mints (Checkout and Install Nix are handed
          # it above) is the credential it needs; without this the suite read
          # "no authenticated GitHub access" on every run.
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}

  lint-nim:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # 45m, RE-MEASURED 2026-09-24. The 15m bound came from a 200-run window
    # (25 green, median 3.3m, max 3.7m) taken when this stage was a handful of
    # steps. It has since grown to 23, and because `dev`'s lint-nim stopped at
    # an early failing step for days, no run showed that a COMPLETE stage no
    # longer fits: #770's run 35933277847 (job 107637263905, on a healthy
    # high-mem-server runner) spent 3.5m in dev-shell setup, 7.6m reaching the
    # SDK facade guard, and was cancelled at 15m inside the Plugin reactive
    # contract suite with nine steps left. Scaling those nine from a local run
    # by that runner's measured speed puts a complete stage at ~30m; 45m is
    # 1.5x that. It is a HANG bound, so it should be re-derived from green runs
    # once there are some -- and lowered if they come in well under it.
    timeout-minutes: 45
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # ci/lint/nim.sh runs the SDK-facade-boundary guard, which since
      # ada0a7ee walks the import graph INTO the `isonim` and `nim-everywhere`
      # sibling packages (both REQUIRED siblings per scripts/require-siblings.sh)
      # and fails `graph-walks-siblings` if it cannot resolve them. That commit
      # added the sibling requirement to the guard but not to this job, so
      # lint-nim went red with `cannot locate sibling package: isonim /
      # nim-everywhere`. Provision the lock-pinned siblings next to this
      # checkout through the shared action, the same way the build/test jobs
      # do -- `repro.lock`'s `depends` names both of the ones the guard walks
      # into. After ``Install Nix`` above, because the action reaches ``repro``
      # through this repo's own dev shell.
      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          root-default-shell: "false"  # lint-nim enters only the lint shell

      - name: Mint a token for the clone below
        # An installation token lives an hour, and the clone below comes after
        # 'Provision dependency siblings from repro.lock', which can take most of
        # one on a cold runner: hand it a token minted here, not the job's first
        # (ci/test/late-clone-token-test.py).
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone codetracer-pm sibling
        # `ci/test/cua-keymap-extractor.sh` (PLAT-68's CUA keymap step in
        # ci/lint/nim.sh) re-extracts every binding CUA-Keymap.md cites, and
        # reads that document from the specification checkout beside this one
        # (`$CT_SPECS_DIR`, else `../codetracer-pm`). A missing checkout is
        # red by design, never a skip, and nothing in this job provided one,
        # so the step could not pass here. `codetracer-pm` is not a build
        # input and is not in `repro.lock`, so it is cloned at its mainline
        # `latest`, as `ct-test-certificates` clones the test-certificates
        # standard -- the gate checks this commit against the document as
        # published.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-pm
          ref: latest
          path: ${{ github.workspace }}/../codetracer-pm
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      # MEASURE THE FETCH ENVIRONMENT BEFORE NIX TOUCHES THE NETWORK, and
      # before the FIRST `nix develop` in this job rather than before the
      # lint one -- a job whose earlier `nix develop` dies never reaches a
      # diagnostic placed after it. Three explanations for the
      # `could not read Username` failure have been proposed and disproven;
      # this ends the guessing. Unconditional, cannot redden the job, prints
      # no credential value.
      - uses: ./.github/actions/dump-git-fetch-env
        with:
          # Two authenticated probes as paired controls against the
          # anonymous one. Never printed; see the action.
          gh-token: ${{ steps.ci_token.outputs.token }}

      # `devShells.lint`, NOT `.default`. The default shell reaches the Cargo
      # git closure of Sui and Solana through `nix-blockchain-development` when
      # its `nativeBuildInputs` are evaluated, and this stage runs bash,
      # shellcheck, python3, node and nimsuggest. That is what the whole
      # `lint-*` stage has been dying inside, before a single lint ran:
      #
      #   error: Failed to fetch git repository https://github.com/anza-xyz/crossbeam
      #   fatal: could not read Username for 'https://github.com'
      #
      # The lint shell takes `pkgs` and nothing else, so that closure is never
      # forced. See nix/shells/lint.nix for how its package list was derived
      # (what the scripts INVOKE, not what they mention) and for why this does
      # not serve `lint-nix` or `lint-rust`.
      #
      # `ci/lib/require-tools.sh` runs as the stage's first `lint_step`, so a
      # shell missing a tool says which one BY NAME instead of dying obscurely
      # inside a contract suite.
      - run: "nix develop .#devShells.x86_64-linux.lint -c ./ci/lint/nim.sh"
        env:
          # ci/lint/nim.sh runs under a scratch CODETRACER_HOME that it removes
          # on exit, so without this the CUA keymap gate would download the
          # VS Code source archive again on every run. The extractor's own
          # override keeps one copy per runner, beside the workspace (as
          # ct-test-certificates' nimcache does), and outside the runner
          # account's CodeTracer state.
          CT_VSCODE_SRC_CACHE: ${{ github.workspace }}/../ct-vscode-src-cache

  wasm-recordings:
    name: WebAssembly boundary recording fixtures
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: '2'
      GOMAXPROCS: '2'
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false
      - name: Setup dev env and lock-pinned recording dependencies
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            codetracer-wasm-recorder
            codetracer-wasm-instrumenter
            codetracer-trace-format
            codetracer-trace-format-nim
      - name: Assert the fixture CI contract
        run: bash ci/test/wasm-recordings-ci-test.sh
      # Each producer owns its compiler and trace-writer dependencies.
      - name: Build the wazero replayer
        working-directory: ../codetracer-wasm-recorder
        run: nix develop . --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-wasm-recorder-shell" --command just build
      - name: Build the WebAssembly instrumenter
        working-directory: ../codetracer-wasm-instrumenter
        run: nix develop . --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-wasm-instrumenter-shell" --command just build
      - name: Build the canonical recording decoder
        working-directory: ../codetracer-trace-format-nim
        run: nix develop . --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-trace-format-nim-shell" --command just build
      - name: Build the browser recording daemon
        run: nix develop .#ci --command cargo build --locked --manifest-path src/backend-manager/Cargo.toml
      - name: Re-record and verify the boundary fixtures
        run: nix develop .#ci --command just verify-wasm-recordings

  dev-shell-hygiene:
    runs-on: [self-hosted, linux, x64]
    # NEW, NO SAMPLE YET. Three gates that `shell-gate-coverage.sh` reported as
    # reachable from no lane, each a `just` recipe already written: two enter
    # the default dev shell from a scratch repository (`nix develop`, cached on
    # this runner class) and one serves the web front door's Functions with
    # the `.#ci` shell's pinned wrangler on localhost. 45m is a first bound,
    # to be tightened from the first green runs.
    timeout-minutes: 45
    name: Dev shell hygiene and the local web front door
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # Entering the dev shell from ANOTHER repository writes nothing there
      # (no `node_modules` link, no hook config): the header of
      # ci/test/dev-shell-writes-nothing-elsewhere-test.sh.
      - name: The dev shell writes nothing into the repository it is entered from
        run: nix develop .#devShells.x86_64-linux.default --command just test-dev-shell-writes-nothing-elsewhere

      # Rust built in the dev shell outside this checkout unwinds its panics:
      # the header of ci/test/dev-shell-rust-unwinds-test.sh.
      - name: Rust built in the dev shell unwinds its panics
        run: nix develop .#devShells.x86_64-linux.default --command just test-dev-shell-rust-unwinds

      # PYTHONPATH in the dev shells names the declared Python minor version
      # only: the header of ci/test/dev-shell-pythonpath-test.sh.
      - name: The dev shells' PYTHONPATH carries the declared Python only
        run: nix develop .#devShells.x86_64-linux.default --command just test-dev-shell-pythonpath

      # The dev shell's Python recorder links a trace writer from the same
      # trace-format pair as its Rust, whatever the recorder flake pins: the
      # header of ci/test/dev-shell-python-recorder-ffi-pair-test.sh.
      - name: The dev shell's Python recorder links its own trace-format pair
        run: nix develop .#devShells.x86_64-linux.default --command just test-dev-shell-python-recorder-ffi-pair

      # The dev shell's codex-acp starts and answers an ACP initialize: the
      # header of ci/test/dev-shell-codex-acp-test.sh.
      - name: The dev shell's codex-acp starts and answers initialize
        run: nix develop .#devShells.x86_64-linux.default --command just test-dev-shell-codex-acp

      # build-once.sh sources the cached dev-shell profile with THIS repository
      # as its working directory: scripts/test-build-once-profile-cwd.sh.
      - name: build-once prepares this checkout, whatever directory it runs from
        run: nix develop .#devShells.x86_64-linux.default --command just test-build-once-profile-cwd

      - name: Failed build-once invalidates stale and partial renderer bundles
        run: bash scripts/test-build-once-failed-bundle.sh

      # Every script that starts its own Xvfb starts its clients once the
      # server answers: scripts/test-own-xvfb.sh.
      - name: Scripts that start their own Xvfb wait for it to answer
        run: nix develop .#devShells.x86_64-linux.default --command just test-own-xvfb

      # The front door's Functions served by the pinned wrangler, on
      # localhost — no network, no deploy (ci/test/web-front-door-local.sh).
      - name: The web front door's logic, served locally
        if: always()
        run: nix develop .#ci --command just test-web-front-door-local

  lint-nix:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # 200-run window: 42 green, median 5.4m, max 7.2m -- measured when this lane
    # only evaluated the flake. Since 7ab073a22 it also BUILDS the backend-manager
    # package's sandbox inputs (db-backend, the ct-mcr test recorder, the license
    # check), none of which a fresh slot has in its store: on nixos-ci-bare-003
    # (2026-10-25/26) that step took 26-35m and the flake check 10-18m, and on
    # #882 every attempt on a cold garm slot was cancelled at 25m inside the
    # build. 90m is ~2x the slowest local measurement of the two steps together.
    # The ct-mcr test recorder and the license check left those inputs when
    # backend-manager's check phase stopped running the CPUID-faulting
    # recording test; the limit is kept until the lane is measured again.
    timeout-minutes: 90
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # MEASURE THE FETCH ENVIRONMENT BEFORE NIX TOUCHES THE NETWORK, and
      # before the FIRST `nix develop` in this job rather than before the
      # lint one -- a job whose earlier `nix develop` dies never reaches a
      # diagnostic placed after it. Three explanations for the
      # `could not read Username` failure have been proposed and disproven;
      # this ends the guessing. Unconditional, cannot redden the job, prints
      # no credential value.
      - uses: ./.github/actions/dump-git-fetch-env
        with:
          # Two authenticated probes as paired controls against the
          # anonymous one. Never printed; see the action.
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default -c ./ci/lint/nix.sh"

  lint-rust:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # 200-run window: 40 green, median 8.5m, max 10.7m, on warm runners;
    # clippy over the whole workspace is the longest of the four lints. A cold
    # runner first builds the dev shell for the direnv step and resolves the
    # ct_emulator nimble dependencies: 24m of setup on PR #903 (14m and 10m),
    # which left the old 30m bound too little for the lints themselves. 50m
    # covers that setup plus the slowest green.
    timeout-minutes: 50
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones the cross-repo siblings adjacent to this checkout at the
        # pinned `dev` refs, replacing the former
        # Checkout-manifests / Resolve-lock / per-sibling clone-repo / Install
        # Nix steps. The direnv-allow + ct_emulator nimble steps below remain
        # bespoke because they operate inside the cloned native-recorder
        # sibling's own dev env.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            # codetracer-trace-format{,-nim} BY COMMIT, not `=dev`: the two halves of
            # the FFI pair are `/agents` inputs in flake.nix, and trace-format's `dev`
            # tip (051a298, 2026-09-30) predates the FileTable / PathTableKind API that
            # src/db-backend's ctfs_trace_reader has called since 2026-10-03, so a
            # sibling cloned at `dev` fails to compile. Full account and the refresh
            # rule: .github/actions/setup-db-backend-siblings/action.yml.
            codetracer-trace-format=2f01e602e70f69a04675293f3fa0d5bad9f196a1
            codetracer-trace-format-nim=3e50ca3f2bf6316e8f764952a84078cf59b11023
            codetracer-native-recorder=95da3c1397cd62b9940ca91ce9109b7a61b228a9

      # MEASURE THE FETCH ENVIRONMENT BEFORE NIX TOUCHES THE NETWORK, and
      # before the FIRST `nix develop` in this job rather than before the
      # lint one -- a job whose earlier `nix develop` dies never reaches a
      # diagnostic placed after it. Three explanations for the
      # `could not read Username` failure have been proposed and disproven;
      # this ends the guessing. Unconditional, cannot redden the job, prints
      # no credential value.
      - uses: ./.github/actions/dump-git-fetch-env
        with:
          # Two authenticated probes as paired controls against the
          # anonymous one. Never printed; see the action.
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Allow direnv in cloned codetracer-native-recorder
        # src/db-backend/build.rs invokes ``direnv exec <recorder-root>
        # bash ct_emulator/build_native_api.sh`` to materialise the
        # generated C sources before the Rust build.  A fresh clone has
        # its .envrc in the "blocked" state, so direnv refuses to run
        # and the build script panics with ``build_native_api.sh exited
        # with status exit status: 1``.  ``direnv allow`` is idempotent
        # and only persists in the local direnv state dir on this
        # self-hosted runner.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv allow "${{ github.workspace }}/../codetracer-native-recorder"

      - name: Resolve ct_emulator nimble dependencies
        # build_native_api.sh runs ``nim c ... ct_emulator.nim``
        # whose .nimble declares ``requires "results"``.  A fresh
        # nim install has no global ``results`` package, so the
        # script aborts with ``cannot open file: results``.  Run
        # ``nimble install --depsOnly`` once in ct_emulator (inside
        # the recorder's direnv env so nim/nimble resolve from the
        # recorder's flake) -- idempotent, mirrors what
        # codetracer_trace_writer_nim's build.rs does in the trace-
        # format crate.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv exec "${{ github.workspace }}/../codetracer-native-recorder" \
              bash -c 'cd "${{ github.workspace }}/../codetracer-native-recorder/ct_emulator" && nimble install --depsOnly -y'

      # The emulator's ``syscall_replay.nim`` imports ``stew/endians2``
      # but ``ct_emulator.nimble`` doesn't list ``stew`` as a dep, so a
      # fresh Nim build cannot resolve the module.  Codetracer ships its
      # own pinned copy as a submodule under ``libs/nim-stew``; inject
      # it via ``CT_EMULATOR_EXTRA_NIM_PATHS`` so build_native_api.sh's
      # ``--path:`` flags pick it up.  Same env-var the windows-rust-
      # components job (line 460) and the macOS db-backend test job
      # (line 472) already use.  Required because build.rs's wipe-
      # before-regen (commit 601cf357) means we no longer rely on a
      # stale cached @memulator_wasm_api.nim.c surviving from prior runs.
      - name: Run rust lints
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: nix develop .#devShells.x86_64-linux.default -c ./ci/lint/rust.sh

  reprobuild-macos-smoke:
    runs-on: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    # 200-run window: 48 green, median 6.5m, max 19.1m. The spread is cache
    # warmth, not work, so the bound is set off the MAX (~2.1x), not the median.
    timeout-minutes: 40
    steps:
      - name: Mint installation token for cross-repo sibling access
