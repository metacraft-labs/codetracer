name: Codetracer CI
on:
  push:
    branches:
      - main
      - dev
      - stable
  pull_request:

# Collapse superseded pull-request runs only.
#
# This is the widest workflow in the repository -- Windows, Linux and macOS
# legs across three runner classes -- so a superseded pull-request run is the
# single most expensive thing the fleet can be doing.
#
# `github.head_ref` is set on `pull_request` and empty everywhere else, so PR
# runs group per source branch and a new push cancels the run it superseded.
# Pushes to `main`/`dev`/`stable` fall through to `github.run_id`, which is
# unique per run: every mainline commit keeps a group of its own and is never
# cancelled. That is deliberate -- `dev` is the integration branch and each
# commit's build result is independently meaningful for bisecting, so
# collapsing mainline pushes would destroy history rather than save capacity.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  # WHY EVERY `siblings:` ENTRY CARRIES AN EXPLICIT `=dev` REF.
  #
  # `metacraft-github-actions/setup-dev-env` clones cross-repo siblings via its
  # `clone-siblings` sub-action. A bare entry (`codetracer-trace-format`) asks
  # that action to resolve the revision from a *workspace lock* — a per-commit
  # snapshot published to `metacraft-labs/metacraft-manifests@latest` by the
  # workspace tooling's pre-push hook. An entry of the form `name=ref` skips
  # that lookup and clones `ref` directly.
  #
  # Lock publication for this repo stopped on 2026-08-02 (last entry:
  # `locks/dev/codetracer/784c9bda…​.xml`). `clone-siblings` probes the pushed
  # commit and its parent only (`--no-walk`), so `dev` stayed resolvable for
  # exactly one more commit and then broke: 8d587343 (parent 784c9bda) was the
  # last green `Setup dev env`; 3583cd6b (run 30951549711, 2026-08-04) was the
  # first red one, and every push since has failed the same way:
  #
  #   ##[error]No workspace lock for codetracer (candidates: <sha> <parent>).
  #   Neither a repo-workspaces locks/<project>/codetracer/<sha>.xml nor a
  #   reprobuild locks/<project>/codetracer/<sha>.toml exists in
  #   metacraft-labs/metacraft-manifests@latest.
  #
  # That took out `lint-rust`, `test-non-gui`, `test-ui-tests` (both legs),
  # `test-ui-tests-rr`, `visual-replay-regression-gate` and `ct-test-providers`
  # in their first real step, which in turn left nine jobs declaring `needs:` on
  # them `skipped` — the exact "the tests never ran" state `ci-verdict` exists
  # to name.
  #
  # Restoring lock publication is an infrastructure task outside this repo (the
  # workspace moved from repo-workspaces to reprobuild and the manifests repo
  # has received nothing since). Until it is restored, siblings are pinned to
  # the branch the lock itself recorded for every one of them (`upstream="dev"`
  # in 784c9bda's lock), which is also what the lock-free paths in this file
  # already do — `.github/actions/setup-isonim-siblings` and the `clone-repo`
  # steps in `viewmodel-tests` / `test-non-gui` all clone `ref: dev`.
  #
  # This changes WHERE a revision comes from, not WHICH repos are provisioned
  # or what any job asserts. When locks are published again, dropping the
  # `=dev` suffixes restores per-commit pinning.
  #
  # NOTE (CIP-5 Wave 4): the whole Windows platform was migrated as a single
  # unit (honoring the prior "move the whole platform or none of it" rule) from
  # the GitHub-hosted `windows-latest` onto the self-hosted `eph-win-x64`
  # class, now that it is provisioned. These jobs keep their DIY env.ps1
  # (`windows-diy`) toolchain path unchanged — only the runner label moved;
  # `eph-win-x64` is the DIY-Windows runner. `eph-win-arm64` is intentionally NOT
  # added here (env.ps1 ARM support is unverified in CI and that class still
  # queues); revisit once eph-win-arm64 is live.
  #
  # WHY EVERY eph-win-x64 JOB STARTS WITH "Ensure Git and Git Bash":
  # the migration above moved the runner label but inherited the GitHub-hosted
  # `windows-latest` *image contract*, and `eph-win-x64` does not honour it.
  # The garm-provisioned image ships neither `git` nor `bash` on PATH, which
  # took out three of the four Windows jobs in three different places:
  #
  #   windows-bootstrap-smoke   "Validate env.sh syntax"   -> bash: command not found
  #   windows-named-pipe-tests  "Install Rust toolchain"   -> bash: command not found
  #                             (dtolnay/rust-toolchain's own step is shell: bash)
  #   windows-rust-components   "Checkout"                 -> Input 'submodules' not
  #                             supported when falling back to the GitHub REST API
  #
  # All three logs also carry actions/checkout's tell: "The repository will be
  # downloaded using the GitHub REST API / To create a local Git repository
  # instead, add Git 2.18 or higher to the PATH." Runs 30726348404, 31180327493
  # and 31385899773 fail identically, so this is the steady state of the lane,
  # not a one-off.
  #
  # `ci/ensure-git-for-checkout.ps1` already solved exactly this — it finds or
  # provisions a pinned, digest-verified PortableGit and puts BOTH `cmd/`
  # (git.exe) and `bin/` (bash.exe) on GITHUB_PATH. It was wired into
  # `origin-dap-windows` only, where its step is the one Windows step that has
  # been passing throughout. Every eph-win-x64 job now runs it, first, before
  # checkout: the jobs that check out submodules need git *for* the checkout,
  # and the jobs whose first real step is `shell: bash` need bash before it.
  # It is fetched over HTTPS at the immutable `github.sha` rather than run from
  # the tree because at that point there is no tree — the checkout is the step
  # it is making possible.
  #
  # `ci/test/windows-runner-bootstrap-test.sh` pins this: it fails if any
  # eph-win-x64 job stops opening with the bootstrap.
  windows-bootstrap-smoke:
    runs-on: eph-win-x64  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64
    steps:
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate env.sh syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f env.sh
          bash -n env.sh

      - name: Validate PowerShell parser
        shell: pwsh
        run: |
          $scriptPaths = @(
            "env.ps1",
            "non-nix-build/windows/toolchain-utils.ps1",
            "non-nix-build/windows/ensure-rust.ps1",
            "non-nix-build/windows/ensure-just.ps1",
            "non-nix-build/windows/ensure-nextest.ps1",
            "non-nix-build/windows/ensure-node.ps1",
            "non-nix-build/windows/ensure-uv.ps1",
            "non-nix-build/windows/ensure-nim.ps1",
            "non-nix-build/windows/ensure-capnp.ps1",
            "non-nix-build/windows/ensure-tup.ps1",
            "non-nix-build/windows/ensure-ct-remote.ps1",
            "non-nix-build/windows/ensure-nargo.ps1",
            "non-nix-build/windows/ensure-ttd.ps1",
            "non-nix-build/windows/validate-toolchain-versions.ps1",
            "non-nix-build/windows/validate-env-path-entries.ps1",
            "non-nix-build/windows/validate-install-root.ps1"
          )

          foreach ($scriptPath in $scriptPaths) {
            if (-not (Test-Path -LiteralPath $scriptPath)) {
              throw "Missing required file: $scriptPath"
            }

            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$null,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "${scriptPath}: $($_.Message)" }
              throw "PowerShell parser reported one or more errors."
            }
          }

      - name: Validate toolchain-versions.env
        shell: pwsh
        run: |
          pwsh -File non-nix-build/windows/validate-toolchain-versions.ps1

      - name: Validate env.ps1 PATH helper
        shell: pwsh
        run: |
          pwsh -File non-nix-build/windows/validate-env-path-entries.ps1

      - name: Validate env.ps1 install-root resolution
        # Extracts Get-DefaultInstallRoot and Test-DirectoryWritable from
        # env.ps1 by AST and exercises them in isolation, including the case
        # the fleet actually hit: a directory that EXISTS and still refuses
        # every create. That is D: on an eph-win-x64 guest -- the read-only
        # cloudbase-init config drive -- and it took out every Windows job at
        # the first Ensure-* step.
        shell: pwsh
        run: |
          pwsh -File non-nix-build/windows/validate-install-root.ps1

      - name: Validate arm64 mode routing smoke checks
        shell: pwsh
        run: |
          $windowsDir = "non-nix-build/windows"

          function Invoke-BootstrapProbe {
            param(
              [Parameter(Mandatory = $true)][string]$Name,
              [Parameter(Mandatory = $true)][hashtable]$Env,
              [Parameter(Mandatory = $true)][scriptblock]$Action,
              [Parameter(Mandatory = $true)][string[]]$RequiredPatterns,
              [string[]]$ForbiddenPatterns = @()
            )

            $installRoot = Join-Path $env:RUNNER_TEMP ("codetracer-bootstrap-routing-" + $Name)
            if (Test-Path -LiteralPath $installRoot) {
              Remove-Item -LiteralPath $installRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Path $installRoot -Force | Out-Null

            $savedPath = $env:PATH
            $savedArchOverride = $env:WINDOWS_DIY_ARCH_OVERRIDE
            $savedEnv = @{}
            foreach ($envKey in $Env.Keys) {
              $savedEnv[$envKey] = [Environment]::GetEnvironmentVariable($envKey)
              [Environment]::SetEnvironmentVariable($envKey, [string]$Env[$envKey])
            }

            [Environment]::SetEnvironmentVariable("WINDOWS_DIY_ARCH_OVERRIDE", "arm64")
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $probeOutput = @()
            try {
              $probeSucceeded = $true
              $probeOutput = & $Action $installRoot 2>&1
            } catch {
              $probeSucceeded = $false
              $probeOutput = @($probeOutput) + $_.Exception.Message + ($_ | Out-String -Width 10000)
            } finally {
              $env:PATH = $savedPath
              [Environment]::SetEnvironmentVariable("WINDOWS_DIY_ARCH_OVERRIDE", $savedArchOverride)
              foreach ($envKey in $Env.Keys) {
                [Environment]::SetEnvironmentVariable($envKey, $savedEnv[$envKey])
              }
            }

            $probeText = ($probeOutput | Out-String -Width 10000)
            if ($probeSucceeded) {
              throw "Probe '$Name' unexpectedly succeeded. Expected a fast-fail source-route assertion."
            }

            foreach ($pattern in $RequiredPatterns) {
              if ($probeText -notmatch $pattern) {
                throw "Probe '$Name' output is missing required pattern '$pattern'."
              }
            }

            foreach ($pattern in $ForbiddenPatterns) {
              if ($probeText -match $pattern) {
                throw "Probe '$Name' output matched forbidden pattern '$pattern'."
              }
            }
          }

          # Load shared modules
          . "$windowsDir/toolchain-utils.ps1"
          . "$windowsDir/ensure-nim.ps1"
          . "$windowsDir/ensure-capnp.ps1"
          . "$windowsDir/ensure-ct-remote.ps1"

          # Parse toolchain versions
          $toolchainPath = Join-Path $windowsDir "toolchain-versions.env"
          $toolchain = @{}
          foreach ($line in Get-Content -LiteralPath $toolchainPath) {
            if ($line -match '^\s*#' -or [string]::IsNullOrWhiteSpace($line)) { continue }
            if ($line -notmatch '^\s*([A-Za-z_][A-Za-z0-9_]*)=(.*)$') { continue }
            $name = $matches[1]
            $value = $matches[2].Trim()
            if ($value.StartsWith('"') -and $value.EndsWith('"') -and $value.Length -ge 2) {
              $value = $value.Substring(1, $value.Length - 2)
            }
            $toolchain[$name] = $value
          }

          Invoke-BootstrapProbe `
            -Name "nim-auto-arm64-source-first" `
            -Env @{
              "NIM_WINDOWS_SOURCE_MODE" = "auto"
            } `
            -Action {
              param($installRoot)
              $arch = Get-WindowsArch
              Ensure-Nim -Root $installRoot -Arch $arch -Toolchain $toolchain
            } `
            -RequiredPatterns @(
              "NIM_WINDOWS_SOURCE_MODE=auto attempted Nim source bootstrap on 'arm64' and failed:",
              "Prebuilt fallback is x64-only"
            ) `
            -ForbiddenPatterns @(
              "Falling back to pinned prebuilt asset",
              "NIM_WINDOWS_SOURCE_MODE=prebuilt"
            )

          Invoke-BootstrapProbe `
            -Name "capnp-auto-arm64-source-route" `
            -Env @{
              "CAPNP_WINDOWS_SOURCE_MODE" = "auto"
            } `
            -Action {
              param($installRoot)
              $arch = Get-WindowsArch
              Ensure-Capnp -Root $installRoot -Arch $arch -Toolchain $toolchain
            } `
            -RequiredPatterns @(
              "git is required for source bootstrap but was not found on PATH"
            ) `
            -ForbiddenPatterns @(
              "capnproto-c\\+\\+-win32-"
            )

          Invoke-BootstrapProbe `
            -Name "ct-remote-auto-arm64-local-route" `
            -Env @{
              "CT_REMOTE_WINDOWS_SOURCE_MODE" = "auto"
              "CT_REMOTE_WINDOWS_SOURCE_REPO" = (Join-Path $env:RUNNER_TEMP "codetracer-ci-missing-routes")
            } `
            -Action {
              param($installRoot)
              $arch = Get-WindowsArch
              Ensure-CtRemote -Root $installRoot -Arch $arch -Toolchain $toolchain -WindowsDir $windowsDir
            } `
            -RequiredPatterns @(
              "CT_REMOTE_WINDOWS_SOURCE_MODE=auto on 'arm64' requires local source project",
              "Pinned download is x64-only"
            ) `
            -ForbiddenPatterns @(
              "Installing ct-remote from pinned download",
              "Falling back to pinned download"
            )

  # M13: Windows materialized origin-DAP verification. The per-PR job runs the
  # seven substantive Python scenarios against the locked Rust-backed Python
  # recorder. Rust TTD and MCP/CLI coverage remain follow-up work and are not
  # exercised or claimed by this job.
  #
  # Spec: codetracer-specs/Planned-Features/Value-Origin-Tracking.milestones.org §M13.
  origin-dap-windows:
    runs-on: eph-win-x64  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64
    name: origin-DAP (materialized Python, Windows)
    steps:
      # See the eph-win-x64 note at the top of this file. This is where the
      # bootstrap started, and for a long time it was the only job that had it.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        # This job needs exactly one thing from this action: the three
        # db-backend sibling checkouts. It provisions its own toolchain right
        # below (`ensure-origin-dap-windows-toolchain.ps1` downloads pinned
        # capnp/nim/just; Rust and Python come from their own actions) and it
        # never calls `dev-exec`.
        #
        # The flavor is `windows-diy` because `nix` is not merely unnecessary
        # here, it is impossible: it installs Nix through
        # DeterminateSystems/nix-installer-action, which has no Windows
        # platform mapping, and the step aborts with "ArchOs (X64-Windows)
        # doesn't map to a supported Nix platform" before this job reaches any
        # step of its own. `windows-diy` sources env.ps1 instead -- the same
        # flavor windows-rust-components and windows-headless-test already use
        # on this runner class, and the reason `npm` resolves in "Generate
        # tree-sitter-nim parser" below, since nothing else in this job
        # provides Node.
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Provision verified origin-DAP toolchain
        shell: powershell
        run: ./ci/ensure-origin-dap-windows-toolchain.ps1

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read locked Python recorder revision
        id: python-recorder-lock
        shell: powershell
        run: |
          $lock = Get-Content -Raw flake.lock | ConvertFrom-Json
          $revision = $lock.nodes.'codetracer-python-recorder'.locked.rev
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "flake.lock does not contain a valid codetracer-python-recorder revision"
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Verify Windows bootstrap and private recorder authentication contracts
        shell: powershell
        run: |
          ./ci/test/ensure-git-for-checkout.ps1
          ./ci/test/ensure-origin-dap-windows-toolchain.ps1
          ./ci/test/checkout-locked-python-recorder.ps1

      - name: Checkout locked Python recorder adjacent to CodeTracer
        shell: powershell
        env:
          RECORDER_REVISION: ${{ steps.python-recorder-lock.outputs.revision }}
          SIBLING_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE "..\codetracer-python-recorder"
          ./ci/checkout-locked-python-recorder.ps1 `
            -Revision $env:RECORDER_REVISION `
            -Destination $destination

      - name: Install and verify locked Rust-backed Python recorder
        shell: powershell
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          $recorder = Join-Path $env:GITHUB_WORKSPACE `
            "..\codetracer-python-recorder\codetracer-python-recorder"
          $stewRoot = (Resolve-Path "$env:GITHUB_WORKSPACE\libs\nim-stew").Path.Replace('\', '/')
          $nimPathConfig = @(
            "--path:`"$stewRoot/stew`""
            "--path:`"$stewRoot`""
          )
          foreach ($nimConfigDir in @(
            (Join-Path $env:APPDATA "nim"),
            (Join-Path $env:USERPROFILE ".config\nim")
          )) {
            New-Item -ItemType Directory -Force -Path $nimConfigDir | Out-Null
            $nimPathConfig | Add-Content -Path (Join-Path $nimConfigDir "nim.cfg")
          }
          $env:CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL = "1"
          & $python -m pip install --disable-pip-version-check $recorder
          if ($LASTEXITCODE -ne 0) { throw "failed to install the locked Python recorder" }
          & $python -c "import codetracer_python_recorder"
          if ($LASTEXITCODE -ne 0) { throw "the locked Python recorder is not importable" }
          "CODETRACER_PYTHON_CMD=$python" >> $env:GITHUB_ENV

      - name: Verify Git Bash for the strict gate
        shell: powershell
        run: |
          $git = Get-Command git.exe -CommandType Application -ErrorAction Stop |
            Select-Object -First 1
          $gitDirectory = Split-Path -Parent $git.Source
          $gitRoot = Split-Path -Parent $gitDirectory
          $gitBash = Join-Path (Join-Path $gitRoot "bin") "bash.exe"
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "The verified Git installation does not include Git Bash."
          }
          $bashDirectory = Split-Path -Parent $gitBash
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bashDirectory
          Write-Host "Using Git Bash from $gitBash for the strict gate."

      - name: Generate tree-sitter-nim parser
        shell: powershell
        run: |
          npm install -g tree-sitter-cli
          cd libs/tree-sitter-nim
          tree-sitter generate

      - name: Run required materialized Python origin-DAP gate
        shell: bash
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CT_ORIGIN_DAP_REQUIRED: "1"
          CT_TEST_LANGS: python
        run: just test-origin-dap

  # M13: Definition of the eventual Windows nightly routed matrix. In this
  # target, `all` means only Python, Ruby and JavaScript, matching
  # test-origin-dap's strict router. It does not include or claim Rust TTD,
  # other languages, or MCP/CLI. This workflow currently has only push and PR
  # triggers, so the guarded job remains inactive until a scheduled or manual
  # trigger is added deliberately.
  origin-dap-windows-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: eph-win-x64  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64
    name: origin-DAP (nightly routed materialized matrix, Windows)
    steps:
      # See the eph-win-x64 note at the top of this file. This job is
      # schedule/dispatch-gated, so it has never run on the migrated runner
      # class; it checks out with `submodules: recursive` and would hit the
      # same REST-API fallback the moment it is triggered.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        # `windows-diy`, for the reason spelled out in the per-PR job above:
        # the `nix` flavor cannot install Nix on a Windows runner, and this
        # job wants the sibling checkouts, not a Nix shell. Keep the two in
        # step.
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install capnproto
        shell: pwsh
        run: choco install capnproto -y

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read locked Python recorder revision
        id: python-recorder-lock
        shell: pwsh
        run: |
          $lock = Get-Content -Raw flake.lock | ConvertFrom-Json
          $revision = $lock.nodes.'codetracer-python-recorder'.locked.rev
          if ($revision -notmatch '^[0-9a-f]{40}$') {
            throw "flake.lock does not contain a valid codetracer-python-recorder revision"
          }
          "revision=$revision" >> $env:GITHUB_OUTPUT

      - name: Verify private recorder checkout authentication contract
        shell: pwsh
        run: ./ci/test/checkout-locked-python-recorder.ps1

      - name: Checkout locked Python recorder adjacent to CodeTracer
        shell: pwsh
        env:
          RECORDER_REVISION: ${{ steps.python-recorder-lock.outputs.revision }}
          SIBLING_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          $destination = Join-Path $env:GITHUB_WORKSPACE "..\codetracer-python-recorder"
          ./ci/checkout-locked-python-recorder.ps1 `
            -Revision $env:RECORDER_REVISION `
            -Destination $destination

      - name: Install Nim toolchain
        shell: pwsh
        run: |
          choco install nim -y
          $nimBin = (Get-ChildItem -Path "C:\tools\Nim\nim-*\bin" -Directory | Select-Object -First 1).FullName
          if ($nimBin) { Add-Content -Path $env:GITHUB_PATH -Value $nimBin }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.nimble\bin"

      - name: Install and verify locked Rust-backed Python recorder
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          $recorder = Join-Path $env:GITHUB_WORKSPACE `
            "..\codetracer-python-recorder\codetracer-python-recorder"
          $stewRoot = (Resolve-Path "$env:GITHUB_WORKSPACE\libs\nim-stew").Path.Replace('\', '/')
          $nimPathConfig = @(
            "--path:`"$stewRoot/stew`""
            "--path:`"$stewRoot`""
          )
          foreach ($nimConfigDir in @(
            (Join-Path $env:APPDATA "nim"),
            (Join-Path $env:USERPROFILE ".config\nim")
          )) {
            New-Item -ItemType Directory -Force -Path $nimConfigDir | Out-Null
            $nimPathConfig | Add-Content -Path (Join-Path $nimConfigDir "nim.cfg")
          }
          $env:CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL = "1"
          & $python -m pip install --disable-pip-version-check $recorder
          if ($LASTEXITCODE -ne 0) { throw "failed to install the locked Python recorder" }
          & $python -c "import codetracer_python_recorder"
          if ($LASTEXITCODE -ne 0) { throw "the locked Python recorder is not importable" }
          "CODETRACER_PYTHON_CMD=$python" >> $env:GITHUB_ENV

      - name: Prefer Git Bash over WSL bash stub
        # The twin of the step of the same purpose in
        # ``windows-rust-components``; keep the two bodies in step. Both
        # remove the WSL launcher stub so ``CreateProcessW``'s System32-first
        # lookup falls through to Git for Windows' ``bash.exe``.
        #
        # The ``C:\Program Files\Git\bin`` append is conditional on the
        # directory existing. That is the GitHub-hosted ``windows-latest``
        # layout; on ``eph-win-x64`` the directory is absent and the
        # "Ensure Git and Git Bash are on PATH" step above provisions
        # PortableGit under RUNNER_TEMP instead. Appending a non-existent
        # directory succeeds silently, which is why the original mismatch
        # surfaced several steps later as ``bash: command not found`` rather
        # than here.
        #
        # And then bash must actually resolve: this job's payload step is
        # ``shell: bash``, so a missing bash there is reported as a test
        # failure rather than as a missing tool.
        shell: pwsh
        run: |
          $wslStub = "$env:SystemRoot\System32\bash.exe"
          if (Test-Path $wslStub) {
            takeown /f $wslStub | Out-Null
            icacls $wslStub /grant "Administrators:(F)" | Out-Null
            Remove-Item -Force $wslStub
          }
          $gitForWindowsBin = "C:\Program Files\Git\bin"
          if (Test-Path -LiteralPath $gitForWindowsBin -PathType Container) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitForWindowsBin
          }
          $bash = Get-Command bash -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $bash) {
            throw "No bash on PATH. The 'Ensure Git and Git Bash are on PATH' step " +
                  "should have provisioned Git Bash; the routed matrix below needs it."
          }
          Write-Host "Using bash from $($bash.Source)"

      - name: Generate tree-sitter-nim parser
        shell: pwsh
        run: |
          npm install -g tree-sitter-cli
          cd libs/tree-sitter-nim
          tree-sitter generate

      - name: Install just
        shell: pwsh
        run: |
          choco install just -y
          just --version

      - name: Run routed materialized origin-DAP matrix
        shell: bash
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CT_TEST_LANGS: all
        run: just test-origin-dap

  windows-named-pipe-tests:
    runs-on: eph-win-x64  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64
    steps:
      # See the eph-win-x64 note at the top of this file. Without this,
      # `dtolnay/rust-toolchain@stable` dies in its own `shell: bash` step
      # with `bash: command not found` before rustup is ever consulted.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Windows named-pipe transport tests
        working-directory: src/tui
        shell: pwsh
        run: cargo test --bin simple-tui windows_named_pipe -- --nocapture

  windows-rust-components:
    runs-on: eph-win-x64  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64
    steps:
      # See the eph-win-x64 note at the top of this file. This job checks out
      # with `submodules: recursive`, which actions/checkout can only honour
      # through a real git; without one it falls back to the REST API and
      # fails outright with "Input 'submodules' not supported".
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # setup-dev-env (windows-diy) clones the cross-repo siblings adjacent
        # to this checkout at their pinned `dev` refs and sources
        # env.ps1, whose ensure-* helpers provision the Windows toolchain
        # (capnp / cargo / nim / nimble), persisting the env to GITHUB_ENV /
        # GITHUB_PATH for subsequent steps. This replaces the former
        # Checkout-manifests / Resolve-lock / per-sibling clone-repo steps AND
        # the open-coded toolchain installs (dtolnay rust-toolchain, choco
        # capnproto, choco nim).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}
          siblings: |
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev
            codetracer-native-recorder=dev

      - name: Remove WSL bash stub from System32
        # db-backend's build.rs runs ``Command::new("bash") ...
        # build_native_api.sh`` on Windows.  Rust's
        # ``Command::new`` uses ``CreateProcessW``, whose documented
        # lookup order checks ``C:\Windows\System32`` BEFORE PATH.
        # On windows-latest that directory contains a WSL launcher
        # stub (``bash.exe``) which aborts with ``Windows Subsystem
        # for Linux has no installed distributions``.  Even after
        # prepending Git Bash to PATH the WSL stub still wins.
        #
        # We don't need WSL on this runner -- removing the stub
        # lets CreateProcessW fall through to Git for Windows'
        # ``bash.exe``, which the "Ensure Git and Git Bash are on
        # PATH" step above has already placed on GITHUB_PATH. That is
        # what the build.rs comment ("Ensure Git for Windows bash is
        # on PATH") actually wants.
        #
        # This step used to append the literal
        # ``C:\Program Files\Git\bin`` unconditionally. That is the
        # GitHub-hosted ``windows-latest`` layout; on ``eph-win-x64``
        # the directory does not exist, and the bootstrap step instead
        # provisions PortableGit under RUNNER_TEMP. Appending a
        # non-existent directory is silent, so the mismatch would not
        # have shown up here -- it showed up as ``bash: command not
        # found`` in whichever step needed bash first. The path is now
        # added only when it is really there, so a runner that does
        # ship Git for Windows keeps the old behaviour and one that
        # does not relies on the bootstrap rather than on a lie.
        shell: pwsh
        run: |
          $wslStub = "$env:SystemRoot\System32\bash.exe"
          if (Test-Path $wslStub) {
            takeown /f $wslStub | Out-Null
            icacls $wslStub /grant "Administrators:(F)" | Out-Null
            Remove-Item -Force $wslStub
          }
          $gitForWindowsBin = "C:\Program Files\Git\bin"
          if (Test-Path -LiteralPath $gitForWindowsBin -PathType Container) {
            Add-Content -Path $env:GITHUB_PATH -Value $gitForWindowsBin
          }
          # Whatever supplied it, `bash` must resolve now: every step below
          # this one is `shell: bash`, and a missing bash there reads as a
          # build failure rather than as a missing tool.
          $bash = Get-Command bash -CommandType Application -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $bash) {
            throw "No bash on PATH. The 'Ensure Git and Git Bash are on PATH' step " +
                  "should have provisioned Git Bash; every step below this one needs it."
          }
          Write-Host "Using bash from $($bash.Source)"

      - name: Generate tree-sitter-nim parser
        shell: pwsh
        run: |
          npm install -g tree-sitter-cli
          cd libs/tree-sitter-nim
          tree-sitter generate

      - name: Build db-backend
        working-directory: src/db-backend
        shell: bash
        # The emulator's ``syscall_replay.nim`` imports
        # ``stew/endians2`` but ``ct_emulator.nimble`` doesn't list
        # ``stew`` as a dep, so on a fresh Windows runner Nim cannot
        # resolve the module.  The Nix derivation sets
        # ``CT_EMULATOR_EXTRA_NIM_PATHS`` to inject codetracer's
        # vendored ``libs/nim-stew``; mirror that here so
        # build_native_api.sh's ``--path:`` flags pick it up.
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: dev-exec cargo build

      - name: Test db-backend
        working-directory: src/db-backend
        shell: bash
        # build_native_api.sh has already produced the C files in
        # the Build step above; this env var only matters when
        # regeneration is required, but we leave it set so a stale
        # cache doesn't trigger a re-run that then fails for the
        # same path-resolution reason.
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          # ``ctfs_trace_reader::tests::bench_new_format_startup_time``
          # asserts new-format trace startup is under 200ms.  That
          # number is calibrated for a developer workstation; GitHub-
          # hosted ``windows-latest`` is consistently 2-3x slower
          # (we've observed 322ms cleanly).  Let CI assert against a
          # roomier threshold without weakening the dev-machine SLA.
          CT_BENCH_STARTUP_MS_THRESHOLD: "1000"
        # The *_flow_*  tests under tests/ are end-to-end integration
        # tests that drive sibling-language recorders through the DAP
        # wire protocol; they need both the recorder binaries AND a
        # matching language runtime (elixir/erlang/ruby/etc.) on the
        # runner image.  windows-latest has none of those installed --
        # the Cross-Repo Integration Tests workflow exercises the same
        # code paths on a Linux self-hosted runner with the recorders
        # + runtimes available.  Mirror the skip pattern used by the
        # db-backend Nix derivation in nix/packages/default.nix.
        run: |
          dev-exec cargo test -- \
            --skip ruby_flow_integration \
            --skip bash_flow_integration \
            --skip zsh_flow_integration \
            --skip javascript_flow_integration \
            --skip e2e_codetracer_elixir \
            --skip e2e_codetracer_erlang

      - name: Build backend-manager
        working-directory: src/backend-manager
        shell: bash
        run: dev-exec cargo build

      - name: Build tui
        working-directory: src/tui
        shell: bash
        run: dev-exec cargo build

      - name: Clippy db-backend
        working-directory: src/db-backend
        shell: bash
        # Same rationale as Build db-backend above: keep the path
        # variable set so any cached-state-invalidation triggers
        # a regeneration with stew on the import path.
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: dev-exec cargo clippy --all-targets -- -D warnings

      - name: Clippy backend-manager
        working-directory: src/backend-manager
        shell: bash
        run: dev-exec cargo clippy --all-targets -- -D warnings

      - name: Clippy tui
        working-directory: src/tui
        shell: bash
        run: dev-exec cargo clippy --all-targets -- -D warnings

      - name: Test tui named pipe
        working-directory: src/tui
        shell: bash
        run: dev-exec cargo test --bin simple-tui windows_named_pipe

  # Headless DAP test suite on Windows using MCR backend.
  # Installs all dependencies via env.ps1, builds ct-mcr from the
  # codetracer-native-recorder sibling, then runs the Rust DAP integration tests.
  windows-headless-test:
    runs-on: eph-win-x64  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64
    name: test (headless DAP, Windows)
    needs:
      - windows-rust-components
    steps:
      # See the eph-win-x64 note at the top of this file. This job has been
      # `skipped` behind windows-rust-components throughout the blackout, so it
      # has never reported — but it checks out with `submodules: recursive` and
      # runs `shell: bash` steps, so it would fail exactly as that job did the
      # moment it is unblocked.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Disable TTD validation for the Windows DIY bootstrap
        # setup-dev-env (windows-diy) sources env.ps1 inside the composite;
        # surface the same WINDOWS_DIY_ENSURE_TTD=false the former bootstrap
        # step set so env.ps1 skips the slow TTD/WinDbg validation.
        shell: bash
        run: echo "WINDOWS_DIY_ENSURE_TTD=false" >> "$GITHUB_ENV"

      - name: Setup dev env
        # setup-dev-env clones the cross-repo siblings adjacent to this
        # checkout at their pinned `dev` refs and sources
        # env.ps1 (windows-diy flavor), persisting the resulting env to
        # GITHUB_ENV/GITHUB_PATH for subsequent steps — replacing the former
        # Checkout-manifests / Resolve-lock / per-sibling clone-repo steps
        # AND the hand-rolled "Bootstrap Windows dev environment" env-export
        # (the composite captures the full env.ps1 delta, a superset of the
        # vars that step exported by hand).
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}
          env-ps1-path: ./env.ps1
          siblings: |
            codetracer-native-recorder=dev
            codetracer-trace-format=dev
            codetracer-trace-format-nim=dev

      - name: Install Nim dependencies
        shell: bash
        run: nimble install results stew -y

      - name: Build ct-mcr.exe
        shell: bash
        run: |
          cd "${{ github.workspace }}/../codetracer-native-recorder/ct_cli"
          nim c --cc:vcc \
            --path:../ct_time_model/src --path:../ct_events/src \
            --path:../ct_ringbuf/src --path:../ct_runtime/src \
            --path:../ct_recorder/src --path:../ct_replayer/src \
            --path:../ct_debugserver/src --path:../ct_trace_store/src \
            --path:../ct_interpose/src --path:../ct_instrument/src \
            --path:../ct_snapshot/src --path:../ct_sync/src \
            -o:ct_mcr.exe src/ct_cli.nim

      - name: Build ct_interpose.dll
        shell: bash
        run: |
          cd "${{ github.workspace }}/../codetracer-native-recorder"
          nim c --app:lib --cc:vcc --mm:orc \
            -o:ct_interpose/ct_interpose.dll \
            ct_interpose/src/ct_interpose/library_init_windows.nim

      - name: Build db-backend
        working-directory: src/db-backend
        shell: bash
        # Same CT_EMULATOR_EXTRA_NIM_PATHS rationale as the
        # windows-rust-components job above; without it
        # build_native_api.sh fails on a fresh runner with
        # ``cannot open file: stew/endians2``.
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: cargo build --release

      - name: Build backend-manager
        working-directory: src/backend-manager
        shell: bash
        run: cargo build --release

      - name: Run headless DAP tests (MCR backend)
        shell: bash
        env:
          CODETRACER_CT_MCR_CMD: ${{ github.workspace }}/../codetracer-native-recorder/ct_cli/ct_mcr.exe
          CODETRACER_ALLOW_GRACEFUL_TEST_SKIPPING: "false"
          CODETRACER_USE_GCC: "1"
          CODETRACER_GDB_CMD: gdb
          CODETRACER_GCC_CMD: gcc
          CODETRACER_GPP_CMD: g++
        working-directory: src/db-backend
        run: |
          cargo nextest run --release --test '*' \
            -E 'test(~dap) and not test(~bash_flow) and not test(~zsh_flow) and not test(~javascript_flow)'

  lint-bash:
    runs-on: eph-linux-x64-g1  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default -c ./ci/lint/bash.sh"

  lint-nim:
