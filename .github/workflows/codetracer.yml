          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone codetracer-native-recorder
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-recorder
          ref: ${{ steps.hcr_pins.outputs.native_recorder }}
          path: ${{ github.workspace }}/../codetracer-native-recorder
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-native-backend
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-backend
          ref: ${{ steps.hcr_pins.outputs.native_backend }}
          path: ${{ github.workspace }}/../codetracer-native-backend
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'true'

      - name: Clone nim-stackable-hooks
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/nim-stackable-hooks
          ref: ${{ steps.hcr_pins.outputs.stackable_hooks }}
          path: ${{ github.workspace }}/../nim-stackable-hooks
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Run Reprobuild macOS smoke
        run: nix develop . --command just test-reprobuild-macos-smoke

      # A crate built with plain `cargo test` in the dev shell, outside this
      # checkout, unwinds its panics: ci/test/dev-shell-rust-unwinds-test.sh.
      # macOS is where it can fail -- the shell's `cc` is GCC there.
      - name: Rust built in the dev shell unwinds its panics (macOS)
        run: bash ci/test/dev-shell-rust-unwinds-test.sh

      - name: Run Reprobuild HCR MCR DAP test (macOS arm64)
        run: nix develop . --command just test-reprobuild-hcr-mcr-dap

      - name: Run Reprobuild HCR in CodeTracer test (macOS arm64)
        run: nix develop . --command just test-reprobuild-hcr-in-codetracer

  reprobuild-linux-smoke:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # 200-run window: 48 green, median 1.8m, max 5.1m -- measured before the
    # smoke's `nix develop .` had to build the dev shell on cold runners. Since:
    # green in 7.7m (dev 3266ab28aa) and 12.6m (PR #903's first run), and
    # cancelled at the old 15m on dev ef129742ac and twice on PR #903, each
    # time still in that build. 30m covers the slowest green with margin.
    timeout-minutes: 30
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
