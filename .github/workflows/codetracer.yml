        # 401, and git dies on `could not read Username`. checkout COPIES
        # `$HOME/.gitconfig` into its temp HOME, so this file is live during the
        # failing fetch. Full rationale, the reproduction, and why this targets
        # the file by path rather than via `--global`: see the copy of this step
        # in the `test-non-gui` job.
