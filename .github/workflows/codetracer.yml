          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Run Reprobuild Linux smoke
        run: nix develop . --command just test-reprobuild-linux-smoke

      - name: Verify test-reprobuild-hcr-mcr-dap fails loudly unsupported on Linux
        run: |
          set +e
          output=$(nix develop . --command just test-reprobuild-hcr-mcr-dap 2>&1)
