  # M29 cross-process value-origin envelope. Drives the 2-trace + 3-trace
  # DAP suites and the gated 3-trace Playwright specs through the single
  # `just test-cross-process` entrypoint canonicalised in
  # `Cross-Process-Origin-E2E-Test-Design.md` §6.
  #
  # The committed three-trace fixture and both GUI specs are required. The
  # envelope rejects missing prerequisites, ignored/skipped tests, count
  # drift, and any Playwright skip result.
  cross-process-linux:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # NO GREEN SAMPLE: 0 success in 50 records. Every failure dies at step 7 of 9
    # ("Build frontend"), skipping the two Playwright steps the green path runs,
    # so the 9.7m worst failure is a LOWER bound on green, not a duration.
    # 45m is ~4.6x that lower bound -- deliberately generous, because the
    # unmeasured tail is the part that does the work.
    timeout-minutes: 45
    name: cross-process value-origin (Linux)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # `Setup db-backend siblings` above carries `env-flavor: nix`, so Nix
        # is already installed when this runs -- which it must be, because the
        # action reaches `repro` through this repo's own dev shell.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Mint a token for the clones below
        # An installation token lives an hour, and the clones below come after
        # 'Provision dependency siblings from repro.lock', which can take most of
        # one on a cold runner: hand them a token minted here, not the job's first
        # (ci/test/late-clone-token-test.py).
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      # The envelope records the three-tier demo from this tree, and
      # scripts/materialize-recording.sh refuses without `ct-instrument` and a
      # built codetracer-js-recorder. `just test-cross-process` builds both
      # (with session-manager) through
      # scripts/provision-cross-process-recording.sh, which fails by name when
      # a sibling is not checked out -- so both are cloned here, unbuilt: the
      # provisioning step builds them in their own dev shells, the same way on
      # every host. Asserted by ci/test/cross-process-gate.sh.
      - name: Clone codetracer-wasm-instrumenter sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-wasm-instrumenter
          ref: dev
          path: ${{ github.workspace }}/../codetracer-wasm-instrumenter
          submodules: "false"
          gh-token: ${{ steps.late_token.outputs.token }}

      - name: Clone codetracer-js-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-js-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-js-recorder
          submodules: "false"
          gh-token: ${{ steps.late_token.outputs.token }}

      - name: Clone runquota sibling
        # `just build-once` below compiles `ct`, and src/ct/codetracer.nim ->
        # ../ct_test/ct_test -> src/ct_test/process_exec.nim opens with
        # `import runquota_process`. The build's Nim search path
        # (`config.nims`) names `../runquota/...`, so this checkout is where
        # those modules come from; scripts/require-siblings.sh requires it. Cloned here rather than via
        # the two composite actions above because neither owns this dependency
        # (issue #641).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Build frontend (needed by gated Playwright stage)
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: nix develop .#devShells.x86_64-linux.default --command just build-once

      - name: One bundle, one definition per name
        # A JS bundle is one script scope, so two top-level `function foo`
        # declarations are not an error -- the last silently wins and the
        # first one's callers run the wrong body. Two defects here were
        # exactly that: `--hotCodeReloading` collided a generic's anonymous
        # closures across modules until the editor stopped mounting, and two
        # `{.exportc.}` procs named `debugRepl` left the service one
        # unreachable in every build while throwing nothing.
        #
        # Placed immediately after the step that produces the bundles,
        # because it checks that step's output. Carries the same shape as
        # the other guards here: counted assertions with the count itself
        # asserted -- a bundle yielding zero top-level functions, or an
        # expected bundle never checked, fails rather than scoring zero, so
        # it cannot pass by matching nothing.
        run: nix develop .#devShells.x86_64-linux.default --command just test-js-bundle-name-uniqueness

      - name: Run cross-process envelope
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CT_CROSS_PROCESS_REQUIRED: "1"
        run: nix develop .#devShells.x86_64-linux.default --command just test-cross-process

  ct-host-container-gate:
    # `ct host` SERVING FROM INSIDE A CONTAINER, REACHED FROM OUTSIDE IT — the
    # WD2 seam (`ci/SEAM-REGISTER.md`), graded here rather than only by hand.
    #
    # The gate (`ci/test/host-image-serves-in-a-container.sh`) needs an Incus
    # daemon with a managed bridge, and no runner class gives a job one: the
    # ephemeral Linux runners are Incus containers themselves and offer Docker
    # and /dev/kvm. `kvm` is the capability label every one of them carries
    # (infra central-garm.nix: the generic pool grants /dev/kvm since the
    # 2026-10-11 fold-back), and it is all this needs:
    # `ci/test/host-image-serves-in-incus-vm.sh` boots a NixOS VM that IS an
    # Incus host (`nix/packages/incus-vm.nix`), publishes the image into it
    # through `ci/publish-host-image.sh` — confirmed by isonim-platform's
    # `sessionctl image-resolve`, which is why the token below must reach
    # that private flake — and runs the gate as root on that host.
    runs-on: [self-hosted, linux, x64, kvm]
    # NO GREEN SAMPLE YET: this job is new. The image is the `codetracer`
    # package's closure, which `nix-build` (median 8.7m, max 10.9m, warm) and a
    # cold-store garm runner (`nix develop .#ci` alone measured 55m in
    # deploy-web-codetracer.yml) bracket; the VM boot, the ~400 MB import and
    # the gate's own waits add minutes, not tens. 120m covers a cold build
    # with room, and is still a bound rather than the 360m default.
    timeout-minutes: 120
    name: ct host serves from an Incus container (Linux, KVM)
    steps:
      - name: Mint installation token for cross-repo sibling access
        # The same per-run installation token as `nix-build`. Here it also
        # lets nix fetch the private `github:metacraft-labs/isonim-platform`
        # flake that provides `sessionctl`.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The gate's fixture trace is `examples/recordings`, a submodule,
          # and the image build is `.?submodules=1`.
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Publish ct host's image into an Incus VM and serve it from a container
        run: bash ci/test/host-image-serves-in-incus-vm.sh

