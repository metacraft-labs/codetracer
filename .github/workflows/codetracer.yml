  isonim-editor-smoke:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; same label as `viewmodel-tests` and `tui-tests`
    # NEW, NO CI SAMPLE YET, so the bound is the sum of two measured parts with
    # room for a cold runner. The smoke step took 840 s with nothing built yet
    # (StoryBook, IsoNim's node modules, the `isonim-review` daemon) and 157 s
    # warm, on nixos-ci-bare-003 at load ~180 (2026-11-05). `just build-once`,
    # the rest of the body, is what `cross-process-linux` is bounded at 45m
    # for. The layouts step after the smoke took at most 17.5 minutes on
    # xps-nixos (2026-11-18, warm Nim cache; 14 of them in the browser),
    # reusing the smoke's bundle and daemon; count it as 18. 45 + 15 + 18 is
    # 78; 120 leaves half again for sibling provisioning and a cold Nix store.
    # Tighten it from the first green runs.
    timeout-minutes: 120
    name: IsoNim Editor instance smoke
    # WHY THIS JOB EXISTS. `scripts/isonim-editor-codetracer.sh --smoke` is a
    # check: it builds StoryBook and the IsoNim Editor instance over the same
    # story declaration and asserts, in a headless browser, that the declared
    # stories and only they render, that the editor's preview equals
    # StoryBook's render pixel for pixel, and that a review comment reaches an
    # agent session. Until this job no workflow ran it, and
    # `ci/test/shell-gate-coverage.sh` failed on it by name (codetracer-pm
    # issues/2026-11-04-shell-gate-coverage-red-on-two-new-scripts.md).
    #
    # WHY ITS OWN JOB. It needs a `build-once` tree, a StoryBook build, IsoNim's
    # node modules and its `isonim-review` daemon. `viewmodel-tests`, the
    # other job that builds the tree, is already at its 75-minute bound with
    # no green sample (see `tui-tests`).
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      # Every authenticated clone is in this block, at the top of the job: the
      # installation token minted above expires an hour after it is minted.
      - name: Setup db-backend siblings and the editor daemon's siblings
        # The db-backend siblings are what `just build-once` needs to build
        # `replay-server` (see `gpui-window-captures`). The two extra ones are
        # the `isonim-review` daemon's: IsoNim's `isonim-review-build` compiles
        # it with `--path:../nim-faststreams` and `--path:../nim-stew`. Both are
        # in this repo's committed `repro.lock`, so they are named BARE and
        # clone at the revision that lock pins.
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          extra-siblings: |
            nim-faststreams
            nim-stew

      - name: Clone runquota sibling
        # `just build-once` compiles `ct`, which imports `runquota_process`
        # (see `cross-process-linux`).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Provision dependency siblings from repro.lock
        # isonim (the editor framework, its server and its daemon's source),
        # isonim-render-serve and nim-everywhere (on the editor bundle's and
        # the daemon's paths), and nim-acp, nim-agents and nim-agent-harbor
        # (the daemon's). After the step above, which installed Nix: this
        # action reaches `repro` through the dev shell.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Build ct and the frontend stylesheets
        # The editor's preview frames and StoryBook link the built stylesheets
        # under `src/build-debug/frontend`; the script refuses to start
        # without them.
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: nix develop .#devShells.x86_64-linux.default --command just build-once

      - name: The IsoNim Editor instance shows exactly StoryBook's stories
        # Builds StoryBook and the instance (IsoNim's node modules and its
        # `isonim-review` daemon too, in the provisioned `../isonim`), serves
        # it on a free loopback port with IsoNim's deterministic test agent,
        # and checks it in headless Chromium. Screenshots and logs land in
        # build/isonim-editor-codetracer-smoke/smoke/, uploaded below.
        run: nix develop .#devShells.x86_64-linux.default --command just isonim-editor-codetracer --smoke

      - name: Layout stories fit the preview and show at 100%
        # e2e_codetracer_instance_layouts_fit_and_100: builds the instance into
        # its own tree (build/isonim-editor-codetracer-layouts/), reusing the
        # `build-once` tree, the components bundle and the `isonim-review`
        # daemon the smoke step above already built, and checks in headless
        # Chromium at 1920x1080 that every full-window layout story (Layouts L1
        # to L14) fits the editor's page preview and shows at 100% with
        # scrollbars, in both themes, by measurement. It is in this job rather
        # than its own for the reason the smoke is: everything it needs is
        # already here. `!cancelled()` so a smoke failure does not hide the
        # layouts result; the step still fails the job on its own.
        if: ${{ !cancelled() }}
        run: nix develop .#devShells.x86_64-linux.default --command just test-isonim-editor-layouts-fit-and-100

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isonim-editor-smoke
          path: build/isonim-editor-codetracer-smoke/smoke/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload layouts artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isonim-editor-layouts-fit-and-100
          path: build/isonim-editor-codetracer-layouts/layouts/
          retention-days: 14
          if-no-files-found: ignore

