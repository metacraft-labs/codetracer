    runs-on: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    # NO GREEN SAMPLE. This job is `workflow_dispatch`-only and has never run
    # green in the window; its 3 records are failures at 5.5m, which is a LOWER
