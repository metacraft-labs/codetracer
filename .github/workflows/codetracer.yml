          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Read the HCR tests' sibling pins
        # The HCR MCR DAP test builds ../codetracer-native-recorder (whose
        # ct_interpose imports ../nim-stackable-hooks) and
        # ../codetracer-native-backend. Unprovisioned, it built whatever an
        # earlier job left in this reused workspace (run 44864106832).
        id: hcr_pins
        run: >-
          nix develop . --command bash ci/lib/sibling-pin-outputs.sh
          native_recorder=flake:codetracer-native-recorder
          native_backend=flake:codetracer-native-backend
          stackable_hooks=lock:nim-stackable-hooks

      - name: Mint a token for the clones below
        id: late_token
