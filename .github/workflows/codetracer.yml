  viewmodel-tests:
    runs-on: eph-linux-x64  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    name: ViewModel headless tests (native + JS)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup isonim siblings
        uses: ./.github/actions/setup-isonim-siblings
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-trace-format-nim sibling
        # Nine ViewModel suites -- the eight request-panel ones plus
        # request_span_conformance_test -- ``import codetracer_ctfs/container``
        # to read a real CTFS container. ``config.nims`` resolves that module
        # from ``$CODETRACER_TRACE_FORMAT_NIM_SRC`` or from the workspace
        # sibling ``../codetracer-trace-format-nim/src``, and this job set up
        # neither, so all nine failed to compile with
        #
        #   Error: cannot open file: codetracer_ctfs/container
        #
        # in every run (30726348404, 31180327493, 31385899773). They compile
        # and pass in a normal workspace, which is why the gap survived: the
        # only environment that lacked the sibling was the one nobody was
        # reading. Cloned here with ``clone-repo``, the same way this job
        # already gets ``codetracer-js-recorder``, rather than through
        # ``setup-dev-env`` -- that route additionally requires a published
        # workspace lock, which is a separate unresolved problem and
        # would make this job depend on it for no benefit.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-trace-format-nim
          # That repo's default branch is `dev` (confirmed against the API);
          # `main` is not where its work lands.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format-nim
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Run ViewModel headless tests (native + JS backends)
        run: nix develop .#devShells.x86_64-linux.default --command just test-vm

      - name: Run ct trace-layer unit tests
        # src/ct/trace/*_test.nim (recording-folder shape detection,
        # session-manifest open path, CTFS source materialization, path
        # handling, ct host idle-timeout parsing) is matched by neither
        # `test-vm`'s glob nor `test-vm-recorder-gated`'s, so these suites
        # ran nowhere.  Pure Nim, no recorder sibling, no display.
        run: nix develop .#devShells.x86_64-linux.default --command just test-ct-trace-units

      - name: Run ct upload MCR-enrichment unit tests
        # src/ct/online_sharing/test_mcr_enrichment.nim was matched by no
        # runner at all — 34 assertions that could not fail a build — and the
        # member-check suite alongside it pins that `ct upload` does not
        # replace the user's recording with a lossier export just because the
        # exporter exited 0.  Pure Nim, no recorder sibling, no display, so it
        # belongs in the same job as the trace-layer units above.
        run: nix develop .#devShells.x86_64-linux.default --command just test-mcr-enrichment-units

      - name: Clone codetracer-js-recorder sibling
        # The recorder-gated ViewModel tests
        # (src/frontend/viewmodel/tests/unit/test_{column,formatted_view_step,
        # statement_step}_*_vm.nim) drive the real JS recorder to produce a
        # column-aware trace and replay it through headless_session.  Without
        # the sibling on disk they all hit recorder_gate's
        # ``MISSING-RECORDER SKIP:`` path, so the column-aware / formatted-view
        # / statement-step coverage silently vanished from CI.  Clone it into
        # the workspace-sibling layout the tests resolve
        # (../codetracer-js-recorder/packages/cli/dist/index.js) per
        # codetracer-specs/Testing/Cross-Repo-CI-Integration.md.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@main
        with:
          repo: metacraft-labs/codetracer-js-recorder
          # `dev` is that repo's default branch; `main` trails it (15 commits
          # behind when this was corrected), so the recorder-gated ViewModel
          # suites and the `ct record` dispatch tests below were exercising a
          # stale recorder while reporting green.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-js-recorder
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Run recorder-gated ViewModel tests (JS recorder + replay-server)
        # Builds the JS recorder sibling via scripts/build-siblings.sh, builds
        # replay-server, then runs the recorder-gated unit VM suites with a
        # zero-test guard that fails if they all skip (so a missing recorder
        # cannot masquerade as a pass).
        run: nix develop .#devShells.x86_64-linux.default --command just test-vm-recorder-gated

      - name: Build ct (needed by the CLI dispatch tests)
        # record_missing_recorder_test.nim and record_dispatch_e2e_test.nim
        # drive the SHIPPED `ct` binary rather than importing its modules, so
        # the lane needs a build.  The pure dispatch table test does not, but
        # it runs in the same recipe.
        run: nix develop .#devShells.x86_64-linux.default --command just build-once

      - name: Run ct record CLI dispatch tests
        # Asserts that every language detection produces reaches a recorder,
        # that a missing recorder fails non-zero naming the language and the
        # remedy, and that a real `ct record` through the JS recorder sibling
        # cloned above produces a real CTFS container (with a zero-test guard
        # against an all-skipped run).
        run: nix develop .#devShells.x86_64-linux.default --command just test-cli-record

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewmodel-test-logs
          path: test-logs/
          retention-days: 30

  push-gpg-public-key:
