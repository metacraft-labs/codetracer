          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp install-on-distributions.sh s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/install.sh

  dev-build:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # 200-run window: 14 green, median 7.3m, max 8.0m. Very tight distribution,
    # so 30m is ~3.8x the slowest green -- headroom is for a cold Nix cache,
    # which this window never sampled.
    timeout-minutes: 30
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # After ``Install Nix``: the action reaches ``repro`` through this
        # repo's dev shell, which the build step below uses anyway.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Mint a token for the clone below
        # An installation token lives an hour, and the clone below comes after
        # 'Provision dependency siblings from repro.lock', which can take most of
        # one on a cold runner: hand it a token minted here, not the job's first
        # (ci/test/late-clone-token-test.py).
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone runquota sibling
        # The build (`just build-once`) compiles `ct`, and src/ct/codetracer.nim
        # -> ../ct_test/ct_test -> src/ct_test/process_exec.nim opens with
        # `import runquota_process`; the Nim search path (`config.nims`) names
        # `../runquota/...`. scripts/require-siblings.sh requires the checkout
        # before any compile starts. The step this job used to run
        # (`ci/build/dev.sh`, the tup build) never ran that preflight, so the
        # job never needed it; every other job that runs `build-once` clones
        # it the same way (issue #641).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Allow direnv in cloned codetracer-native-recorder
        # the build (`just build-once`) builds src/db-backend, whose build.rs invokes
        # ``direnv exec <recorder-root> bash ct_emulator/build_native_api.sh``
        # to materialise the recorder's generated C before the Rust build. A
        # fresh clone has its .envrc "blocked", so direnv refuses and build.rs
        # panics with ``build_native_api.sh exited with status 1``. Mirror the
        # proven lint-rust pattern: ``direnv allow`` is idempotent and persists
        # only in the local direnv state dir on this self-hosted runner.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv allow "${{ github.workspace }}/../codetracer-native-recorder"

      - name: Resolve ct_emulator nimble dependencies
        # build_native_api.sh runs ``nim c ... ct_emulator.nim`` whose .nimble
        # declares ``requires "results"``. A fresh nim install has no global
        # ``results`` package, so the script aborts with
        # ``cannot open file: results``. ``nimble install --depsOnly`` once in
        # ct_emulator (inside the recorder's direnv env so nim/nimble resolve
        # from the recorder's flake) is idempotent -- same fixup lint-rust does.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv exec "${{ github.workspace }}/../codetracer-native-recorder" \
              bash -c 'cd "${{ github.workspace }}/../codetracer-native-recorder/ct_emulator" && nimble install --depsOnly -y'

      # The emulator's ``syscall_replay.nim`` imports ``stew/endians2`` but
      # ``ct_emulator.nimble`` doesn't list ``stew`` as a dep, so a fresh Nim
      # build cannot resolve the module. Codetracer ships its own pinned copy as
      # a submodule under ``libs/nim-stew``; inject it via
      # ``CT_EMULATOR_EXTRA_NIM_PATHS`` so build_native_api.sh's ``--path:``
      # flags pick it up -- same env-var lint-rust uses.
      - name: Build
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: "nix develop .#devShells.x86_64-linux.default --command just build-once"

      - name: Assert the build produced every product the retired tup build did
        # products_parity. `ci/build/linux-products-baseline.txt` is
        # the list of products the last tup build produced, recorded before the
        # tup rules files were removed; a clean `repro build` has to produce all of it.
        # The build tree is the one the dev shell names in CODETRACER_BUILD_DIR
        # (src/build-debug-repro).
        run: "nix develop .#devShells.x86_64-linux.default --command bash ci/test/products-parity.sh"

  nix-build:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # 200-run window: 7 green, median 8.7m, max 10.9m. Only 7 greens, so the bound
    # is set wide (~3.2x max) rather than trusting a small sample's tail.
    timeout-minutes: 35
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - run: "nix develop .#devShells.x86_64-linux.default --command ./ci/build/nix.sh"

  appimage-build:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # 200-run window: 13 green, median 9.7m, max 18.8m. Set off the max (~2.1x);
    # the p90 of 17.0m shows the cold-cache arm is a normal outcome, not a fluke.
    timeout-minutes: 40
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        # ``./ci/build/appimage.sh`` -> ``build_db_backend.sh`` runs
        # ``cargo build`` in src/db-backend, whose build.rs needs the
        # codetracer-native-recorder sibling checkout (and its trace-format
        # siblings) to regenerate the recorder's native C. Clone them adjacent
        # to the checkout, exactly as dev-build does.
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # appimage-build runs nim *outside* the Nix sandbox via
        # ``./ci/build/appimage.sh``; the lock-pinned siblings have to sit
        # next to the codetracer checkout so ``config.nims``'
        # ``addPathIfDir(workspaceRoot / "isonim/src")`` resolves. After
        # ``Install Nix`` because the action reaches ``repro`` through this
        # repo's dev shell.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Allow direnv in cloned codetracer-native-recorder
        # db-backend's build.rs invokes ``direnv exec <recorder-root> bash
        # ct_emulator/build_native_api.sh``; a fresh clone has its .envrc
        # "blocked", so direnv refuses and build.rs panics. ``direnv allow`` is
        # idempotent -- mirror the proven lint-rust / dev-build pattern.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv allow "${{ github.workspace }}/../codetracer-native-recorder"

      - name: Resolve ct_emulator nimble dependencies
        # build_native_api.sh's ``nim c ... ct_emulator.nim`` requires the
        # ``results`` package (ct_emulator.nimble ``requires "results"``);
        # install it once inside the recorder's direnv env, same as lint-rust.
        run: |
          nix develop .#devShells.x86_64-linux.default -c \
            direnv exec "${{ github.workspace }}/../codetracer-native-recorder" \
              bash -c 'cd "${{ github.workspace }}/../codetracer-native-recorder/ct_emulator" && nimble install --depsOnly -y'

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      # ``CT_EMULATOR_EXTRA_NIM_PATHS`` injects codetracer's pinned nim-stew /
      # nim-result submodules so build_native_api.sh's ``--path:`` flags resolve
      # ``stew/endians2`` (not a declared ct_emulator.nimble dep) -- same
      # env-var lint-rust and dev-build use.
      - name: Build
        env:
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: "nix develop .#devShells.x86_64-linux.default --command ./ci/build/appimage.sh"

      - name: Upload artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command gpg --armor --detach-sign CodeTracer.AppImage
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer.AppImage s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage
          nix develop .#devShells.x86_64-linux.default --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp CodeTracer.AppImage.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage.asc

  dmg-build:
    # CIP-5 Wave 4: migrated to the self-hosted nix-darwin runner. The DIY
    # `dtolnay/rust-toolchain` + `./ci/build/dmg.sh` (-> Homebrew-native
    # `./non-nix-build/build.sh`) and `brew install awscli` steps are gone.
    # reprobuild builds the app bundle hermetically (`repro build .#macos-app
    # --tool-provisioning=nix`, driven by `ci/reprobuild/macos-daemon-build.sh`);
    # the dmg itself is packaged from that bundle in a plain devShell (see the
    # "Package DMG" step for why `.#dmg` cannot run hermetically on macOS), and
    # lands at the same `non-nix-build/CodeTracer.dmg` path the sign + upload
    # steps consume. `aws` comes from `nixpkgs#awscli2`, provisioned per-command
    # via `nix shell`.
    runs-on: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    # 200-run window: 7 green, median 11.7m, max 42.8m. The 3.7x spread between
    # median and max IS the measurement here -- a cold aarch64-darwin build is a
    # real green. 90m is ~2.1x the slowest observed green; anything near the
    # median would convert that cold build into a red.
    timeout-minutes: 90
    needs:
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust

    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Evict stale git credentials from this runner's persistent home
        # Before any git operation: a stale owner-scoped extraHeader in this
        # reused runner's ~/.gitconfig outranks checkout's fresh one. A remote
        # action, so it needs no checkout; the rationale is in its action.yml.
        uses: metacraft-labs/metacraft-github-actions/evict-stale-git-credentials@2c12f82a56d5000bd47c42ad8c25a3596820057c

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Build CodeTracer.app via reprobuild
        # Toolchain-free reprobuild macOS build of the *app bundle*: starts
        # runquotad, runs `repro build .#macos-app --tool-provisioning=nix`,
        # and lands `non-nix-build/CodeTracer.app` (which the packaging step
        # below turns into the dmg).
        #
        # WHY NOT `.#dmg`: reprobuild's `.#dmg` target invokes the nixpkgs
        # `create-dmg`, a shell script that shells out to macOS system tools
        # (`sw_vers`, then `hdiutil` / `SetFile`). None of those have a nixpkgs
        # package, and reprobuild runs every tool action with a scrubbed PATH =
        # the tool's own nix closure only (the sanctioned `CT_SANDBOX_TOOLS_DIR`
        # escape hatch is not populated anywhere), so `.#dmg` dies with
        # `create-dmg: line 16: sw_vers: command not found` (exit 127). A fully
        # hermetic dmg is not achievable on macOS — hdiutil is the only tool
        # that writes the format and it is macOS-system-only. So we keep the
        # reproducible half (the .app, built hermetically by reprobuild) and
        # package the inherently-non-hermetic dmg in the step below, where the
        # devShell provides create-dmg and the runner's /usr/bin provides the
        # macOS system tools it needs.
        env:
          CODETRACER_REPROBUILD_TARGET: .#macos-app
        run: nix develop . --command bash ci/reprobuild/macos-daemon-build.sh

      - name: Stage the pinned Electron runtime into the app bundle
        # THE PUBLISHED DMG HAS NO ELECTRON. Measured on
        # CodeTracer-latest-arm64.dmg (downloaded 2026-09-03, built 2026-08-30):
        # `Contents/MacOS/bin/electron` execs
        # `../node_modules/electron/dist/Electron.app/Contents/MacOS/Electron`,
        # and the Nix `node-modules-derivation` the bundle pointed at holds 880
        # top-level packages, none of them `electron` — `node-packages/
        # package.json` declares no `electron` at all, so no yarn install could
        # have produced one. The macOS GUI could not start, the same outcome the
        # 2026-08-30 AppImage had by a different route.
        #
        # WHY THIS IS A SEPARATE STEP AND NOT PART OF `.#macos-app`: reprobuild
        # runs every action with a scrubbed PATH and no network, and staging the
        # runtime is `npm ci` against a committed lockfile plus a download from
        # Electron's release assets. Same reason the "Package DMG" step below is
        # not a reprobuild action. The hermetic half stays hermetic; this step
        # adds the one input that cannot be.
        #
        # The pin is `appimage-scripts/electron/package.json` — the SAME file
        # the AppImage installs from, so both desktop artefacts carry the same
        # Electron by construction rather than by coincidence.
        run: nix develop . --command bash scripts/stage-electron-runtime.sh
          non-nix-build/CodeTracer.app/Contents/MacOS/node_modules/electron

      - name: Gate the app bundle before packaging it
        # Two gates, both pointed at the tree that is about to become the dmg.
        # This is the only moment it exists, and it is BEFORE the upload, so a
        # bundle that would dangle on a user's Mac cannot be published.
        #
        # `dmg-lib-check` cannot substitute for this: it runs on the same
        # self-hosted aarch64-darwin host that built the bundle, where the
        # /nix/store path in the old symlink RESOLVES. That is precisely how a
        # bundle with no dependency tree passed every release check.
        run: |
          nix develop . --command bash -c '
            set -eu
            bash ci/test/desktop-bundle-self-contained.sh non-nix-build/CodeTracer.app
            bash ci/test/electron-supply-chain.sh non-nix-build/CodeTracer.app
          '

      - name: Package DMG
        # Package `non-nix-build/CodeTracer.app` into `CodeTracer.dmg` using the
        # devShell's create-dmg. This runs in a plain `nix develop .` shell (NOT
        # a reprobuild action), so the devShell provides create-dmg. create-dmg
        # itself shells out to macOS system tools (sw_vers, hdiutil, SetFile);
        # this self-hosted nix-darwin runner's inherited PATH is nix-store-only,
        # so /usr/bin is not present and create-dmg dies with
        # `sw_vers: command not found`. Append the macOS system dirs (kept AFTER
        # the devShell entries so the nix create-dmg still wins) to resolve them.
        # The create-dmg flags mirror non-nix-build/build_dmg.sh (the pre-CIP-5
        # path) and repro.nim's create_dmg action, so the produced dmg is the
        # same shape the sign + upload steps below expect.
        run: |
          nix develop . --command bash -c '
            set -eu
            export PATH="$PATH:/usr/bin:/usr/sbin"
            cd non-nix-build
            rm -f CodeTracer.dmg
            staging="$(mktemp -d)"
            trap "rm -rf \"$staging\"" EXIT
            cp -R CodeTracer.app "$staging/"
            create-dmg \
              --volname CodeTracer \
              --background dmg_background.png \
              --window-pos 200 120 \
              --window-size 600 400 \
              --icon-size 100 \
              --icon CodeTracer.app 150 200 \
              --app-drop-link 450 200 \
              --sandbox-safe \
              CodeTracer.dmg \
              "$staging"
          '

      - name: Upload artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          gpg --armor --detach-sign non-nix-build/CodeTracer.dmg
          # for now apply workaround from https://community.cloudflare.com/t/an-error-occurred-internalerror-when-calling-the-putobject-operation/764905/11:
          #   adding `--checksum-algorithm CRC32`
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp ./non-nix-build/CodeTracer.dmg s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg --checksum-algorithm CRC32
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp ./non-nix-build/CodeTracer.dmg.asc s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg.asc --checksum-algorithm CRC32

  windows-installer-build:
    # Builds the NSIS installer (non-nix-build/CodeTracer-Setup.exe) and hands
    # it to windows-installer-publish (Linux) for signing + R2 upload. Split in
    # two so all GPG/aws work stays on the proven Linux path; the Windows leg
    # only produces the artifact.
    #
    # Gated to `main` (the release branch) because the -win-x64 artifact is a
    # RELEASE artifact promoted to `-latest-` by create-release, exactly like the
    # AppImage/dmg. Keeping it off PRs / `dev` also means the eph-win-x64 GARM
    # outage cannot turn PR runs red. This job is NOT in push-tag's `needs`, so
    # while GARM is down it can hang/fail without ever blocking a release —
    # create-release simply skips the (absent) win artifact (see below).
    runs-on: eph-win-x64-release  # CIP-5: DIY-Windows (env.ps1) -> eph-win-x64-release (dedicated release scale set)
    # See the timeout-minutes rationale on windows-rust-components. This job is
    # on the release scale set rather than the CI one, but it runs the SAME
    # env.ps1 bootstrap, so it has the same unbounded failure mode and would
    # inherit the same 360-minute default. It is bounded here rather than when
    # the `if:` below is repaired, so that repairing the gate is a one-line
    # change that cannot also reintroduce an unbounded job.
    timeout-minutes: 90
    # DEAD GATE -- this job has never run. `refs/heads/main` does not exist in
    # this repository: 702 remote refs, zero matches for `refs/heads/main`
    # (`git ls-remote origin | grep -c 'refs/heads/main$'` -> 0). The branches
    # are `dev` and `stable`. So the -win-x64 installer has never been built or
    # published, and the comment above claiming parity with the AppImage/dmg is
    # not accurate about the mechanism: `appimage-build` and `dmg-build` carry
    # NO `if:` at all and publish `CodeTracer-<ref_name>-...` on every branch
    # push. Matching them means DELETING this condition, not correcting the
    # branch name -- but that starts publishing a Windows artefact, which is a
    # release decision, so the gate is left in place and reported rather than
    # flipped here.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      # See the eph-win-x64 note at the top of this file: actions/checkout needs
      # a real git for `submodules: recursive`, provisioned by this bootstrap.
      - name: Ensure Git and Git Bash are on PATH
        shell: powershell
        env:
          CODETRACER_GIT_BOOTSTRAP_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $revision = $env:CODETRACER_GIT_BOOTSTRAP_REVISION
          if ($revision -cnotmatch '^[0-9a-f]{40}$') {
            throw "The workflow did not supply an immutable bootstrap revision."
          }
          $bootstrapUrl =
            "https://raw.githubusercontent.com/metacraft-labs/codetracer/" +
            "$revision/ci/ensure-git-for-checkout.ps1"
          $bootstrapScript = Join-Path $env:RUNNER_TEMP `
            "codetracer-ensure-git-$revision-$([Guid]::NewGuid().ToString('N')).ps1"
          [Net.ServicePointManager]::SecurityProtocol =
            [Net.ServicePointManager]::SecurityProtocol -bor
            [Net.SecurityProtocolType]::Tls12
          try {
            Invoke-WebRequest `
              -Uri $bootstrapUrl `
              -OutFile $bootstrapScript `
              -UseBasicParsing
            & $bootstrapScript
          }
          finally {
            Remove-Item -LiteralPath $bootstrapScript -Force -ErrorAction SilentlyContinue
          }

      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # windows-diy provisions the DIY Windows toolchain via env.ps1's
        # ensure-* helpers (nim / rust / capnp / clingo / repro …) and clones the
        # recorder/trace siblings, persisting PATH to GITHUB_ENV/GITHUB_PATH.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: windows-diy
          gh-token: ${{ steps.ci_token.outputs.token }}
          siblings: |
            # codetracer-trace-format{,-nim} BY COMMIT, not `=dev`: the two halves of
            # the FFI pair are `/agents` inputs in flake.nix, and trace-format's `dev`
            # tip (051a298, 2026-09-30) predates the FileTable / PathTableKind API that
            # src/db-backend's ctfs_trace_reader has called since 2026-10-03, so a
            # sibling cloned at `dev` fails to compile. Full account and the refresh
            # rule: .github/actions/setup-db-backend-siblings/action.yml.
            codetracer-trace-format=2f01e602e70f69a04675293f3fa0d5bad9f196a1
            codetracer-trace-format-nim=3e50ca3f2bf6316e8f764952a84078cf59b11023
            codetracer-native-recorder=95da3c1397cd62b9940ca91ce9109b7a61b228a9
            # Required by scripts/require-siblings.sh, which build-once.sh runs first.
            # BARE: this job only runs on codetracer, so clone-siblings resolves
            # them from this commit's own committed repro.lock, which pins all of them.
            # nim-shm-queue and nim-shm-gset travel with io-mon: its modules import both.
            io-mon
            nim-stackable-hooks
            test-certificates-tools
            nim-shm-queue
            nim-shm-gset
            # `ct shell-session` imports nim_pty (src/common/shell_session.nim).
            nim-pty

      # codetracer-trace-format-nim's recipe reads its tool paths from the
      # schema-1 manifest its `toolPathsFile` variant selects, with no ambient
      # fallback; without it its provider refuses to start and build-once
      # refuses first. Windows has no Nix dev shell to publish the manifest, so
      # trace-format-nim's own binders write it and select it in REPRO_VARIANTS
      # (through GITHUB_ENV), exactly as its ci-reprobuild.yml Windows leg does.
      - name: Bind trace-format-nim's locked Nim sources (tool-path manifest)
        shell: pwsh
        working-directory: ../codetracer-trace-format-nim
        run: |
          $ErrorActionPreference = 'Stop'
          $here = (Get-Location).Path
          ./ci/acquire-windows-nim-sources.ps1 -Destination "$env:RUNNER_TEMP/trace-nim-sources" `
            -Manifest (Join-Path $here 'ci/windows-complete-source-manifest.json') `
            -Lock (Join-Path $here 'flake.lock') `
            -Receipt "$env:RUNNER_TEMP/trace-nim-source-receipt.json"

      - name: Bind trace-format-nim's declared Zstd (tool-path manifest)
        shell: pwsh
        working-directory: ../codetracer-trace-format-nim
        run: |
          $ErrorActionPreference = 'Stop'
          $powerShell = (Get-Command pwsh -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          repro exec ./ci/windows-zstd-prerequisite -- $powerShell -NoProfile -File (Join-Path (Get-Location).Path 'ci/bind-declared-windows-zstd.ps1')
          if ($LASTEXITCODE -ne 0) { throw "declared Windows Zstd prerequisite failed: $LASTEXITCODE" }

      - name: Build CodeTracer-Setup.exe
        shell: bash
        env:
          CODETRACER_REPROBUILD_TOOL_PROVISIONING: scoop
          CODETRACER_REPROBUILD_LOG: quiet
        run: |
          set -euo pipefail
          # Canonical installer build, mirroring the `test-windows-installer`
          # justfile recipe: build the app once, then the NSIS `windows-installer`
          # reprobuild target. build-once.sh resolves repro/repro.exe from the
          # sibling checkout or PATH (env.ps1 puts it there).
          bash scripts/build-once.sh
          repro build windows-installer \
            --tool-provisioning="${CODETRACER_REPROBUILD_TOOL_PROVISIONING}" \
            --log="${CODETRACER_REPROBUILD_LOG}"
          test -f non-nix-build/CodeTracer-Setup.exe \
            || { echo "non-nix-build/CodeTracer-Setup.exe was not produced" >&2; exit 1; }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: codetracer-setup-exe
          path: non-nix-build/CodeTracer-Setup.exe
          if-no-files-found: error
          retention-days: 7

  windows-installer-publish:
    # Signs the Windows installer with the release key and publishes it to R2 as
    # CodeTracer-main-win-x64.exe(.asc), the per-`main`-build key that
    # create-release promotes to `-latest-`/`-<tag>-` — the exact shape as the
    # AppImage/dmg (CodeTracer-main-amd64.AppImage etc.). Runs on Linux so gpg,
    # aws and the imported release key all come from the proven nix path.
    runs-on: [self-hosted, linux, x64]  # CIP-5: nix job (self-hosted nixos) -> eph-linux-x64
    # Bounded for the same reason as windows-installer-build above, and with the
    # same dead `refs/heads/main` gate. This leg is signing + upload only, so it
    # needs far less headroom than the build.
    timeout-minutes: 30
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [ windows-installer-build ]
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: "Import GPG key for signing"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: codetracer-setup-exe
          path: .

      - name: Sign and upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }}
          BUCKET: ${{ vars.R2_CODETRACER_BUCKET_NAME }}
        run: |
          set -euo pipefail
          aws_cmd() {
            nix develop .#devShells.x86_64-linux.default --command \
              aws --endpoint-url="$ENDPOINT" "$@"
          }
          nix develop .#devShells.x86_64-linux.default --command \
            gpg --armor --detach-sign CodeTracer-Setup.exe

          # SELF-PROMOTION: this leg publishes the win installer to the
          # per-`main`-build key AND to the `-<version>-` / `-latest-` release
          # keys itself, rather than leaving the latter to create-release.
          #
          # The design once had create-release promote `-main-` -> `-latest-`/
          # `-<tag>-` for every artifact (see its "Windows installer" block). But
          # create-release is gated only on the four Linux/darwin build jobs via
          # push-tag, while this Windows leg runs on the much slower eph-win-x64
          # runner (queue + the full env.ps1 DIY toolchain bootstrap + the NSIS
          # build). create-release therefore finishes, and runs its TOLERANT win
          # promotion, long before `CodeTracer-main-win-x64.exe` exists — so the
          # Windows installer was always skipped and only picked up "next
          # release". Promoting here removes that one-release lag so
          # get.codetracer.com/pwsh (which downloads CodeTracer-latest-win-x64.exe)
          # resolves in the same release. Every push to `main` is a release, so
          # advancing `-latest-` here matches the release model.
          YEAR=$(grep 'CodeTracerYear\*' src/ct/version.nim | sed 's/.*= //' | tr -d '[:space:]')
          MONTH=$(printf '%02d' "$(grep 'CodeTracerMonth\*' src/ct/version.nim | sed 's/.*= //' | tr -d '[:space:]')")
          BUILD=$(grep 'CodeTracerBuild\*' src/ct/version.nim | sed 's/.*= //' | tr -d '[:space:]')
          VERSION="$YEAR.$MONTH.$BUILD"

          for slot in "${{ github.ref_name }}" "$VERSION" latest; do
            aws_cmd s3 cp CodeTracer-Setup.exe \
              "s3://$BUCKET/CodeTracer-$slot-win-x64.exe" --checksum-algorithm CRC32
            aws_cmd s3 cp CodeTracer-Setup.exe.asc \
              "s3://$BUCKET/CodeTracer-$slot-win-x64.exe.asc" --checksum-algorithm CRC32
          done

  dmg-lib-check:
    # CIP-5 Wave 4: migrated to the self-hosted nix-darwin runner. The DIY
    # `brew install awscli` / `brew install sevenzip` steps are gone; `aws`
    # comes from `nixpkgs#awscli2` and 7-Zip from `nixpkgs#p7zip` (the `7z`
    # binary), both provisioned per-command via `nix shell`. This job only
    # downloads + extracts + smoke-runs the release dmg, so it needs no
    # Homebrew build toolchain.
    runs-on: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    # NO GREEN SAMPLE: 0 success in 7 records (failures at 0.8m, cancels at 0.0m).
    # Bound by sibling: `appimage-lib-check` is the same shape (walk a built
    # bundle's dynamic deps) and measures 1.2m max green, bounded at 15m. 20m
    # here for the slower macOS runner. Not measured on this job.
    timeout-minutes: 20
    needs:
      - dmg-build
    steps:

      - name: Evict stale git credentials from this runner's persistent home
        # Before any git operation: a stale owner-scoped extraHeader in this
        # reused runner's ~/.gitconfig outranks checkout's fresh one. A remote
        # action, so it needs no checkout; the rationale is in its action.yml.
        uses: metacraft-labs/metacraft-github-actions/evict-stale-git-credentials@2c12f82a56d5000bd47c42ad8c25a3596820057c

      - name: Checkout
        # Only so that `uses: ./.github/actions/setup-nix` below resolves; no
        # other step in this job reads the tree. No submodules and no token:
        # this repository is public and nothing here talks to a remote, and
        # these runners reuse their work tree, so a persisted credential would
        # outlive the job that minted nothing.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ github.token }}

      - name: Download artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg ./CodeTracer.dmg
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-arm64.dmg.asc ./CodeTracer.dmg.asc
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer.pub.asc ./CodeTracer.pub.asc

      - name: Verify GPG signature
        # A signed release is only worth signing if we check the signature on
        # the exact bytes we ship. The detached .asc and the published public
        # key come from the same bucket the dmg does; import the key and verify
        # before we run the binary, so a broken/absent signature fails loudly
        # here rather than being discovered by a user with `gpg --verify`.
        run: |
          nix shell nixpkgs#gnupg --command gpg --import ./CodeTracer.pub.asc
          nix shell nixpkgs#gnupg --command gpg --verify ./CodeTracer.dmg.asc ./CodeTracer.dmg

      - name: Extract dmg
        # WHY `hdiutil` AND NOT `7z x`.
        #
        # This step used to run `nix shell nixpkgs#p7zip --command 7z x
        # ./CodeTracer.dmg`, and the "Check if ct starts" step below then died:
        #
        #     .../<step>.sh: line 1: ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct: Permission denied
        #     ##[error]Process completed with exit code 126.
        #
        # Run 33742876598, job 100624879771, on m3-mcl-005. Exit 126 is
        # "found but not executable", not "not found" and not a crash of `ct`:
        # 7z reported `Everything is Ok` and unpacked all 32177 files first.
        #
        # 7z reads the DMG's HFS+ image as an archive and does not restore
        # POSIX mode bits, so every extracted file lands non-executable. That
        # makes the check unable to pass no matter what the DMG contains, which
        # is why this is an instrument defect and not a packaging one.
        #
        # It went unseen because it was unreachable: `dmg-lib-check` needs
        # `dmg-build`, and 33742876598 is the first run in ~30 where dmg-build
        # reached a runner at all. The step is as old as the job; the exposure
        # is new.
        #
        # `hdiutil attach` mounts the real HFS+ volume with its permissions
        # intact, so the executable bit is the one the DMG actually ships. That
        # matters beyond making the check pass: `chmod +x` after 7z would also
        # turn the job green, but it would forge the very property this job
        # exists to assert, and a genuinely non-executable `ct` in a shipped
        # DMG would then pass unnoticed. This way the check still fails if the
        # artifact is really broken.
        #
        # `-nobrowse` keeps the volume out of Finder; `-readonly` avoids any
        # write-back to the artifact we just gpg-verified. The contents are
        # copied out to ./CodeTracer so the paths every later step uses are
        # unchanged, and the volume is detached before those steps run so
        # nothing holds a mount on this persistent runner.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          # THIRD confirmed instance of one root cause: this step's shell is the
          # devShell's bash, and on a nix-darwin self-hosted runner its PATH has
          # no /usr/bin. `hdiutil` exists ONLY at /usr/bin/hdiutil -- no nixpkgs
          # input provides it -- so the first version of this step died with
          #
          #     .../<step>.sh: line 6: hdiutil: command not found
          #     ##[error]Process completed with exit code 127.
          #
          # (run 33750724496, job 100642345443, on m3-mcl-004), which is the
          # same 127 that `codesign` and then `sw_vers` produced earlier today
          # in the ct-mcr and build-once steps. APPEND, never prepend, so the
          # devShell toolchain keeps winning for git/python/clang.
          export PATH="$PATH:/usr/bin"
          mountpoint="$(mktemp -d "${RUNNER_TEMP:-/tmp}/codetracer-dmg-XXXXXX")"
          # Detach on every exit path: a leaked mount outlives the job on these
          # persistent macOS runners and the next run's attach then fails.
          trap 'hdiutil detach "$mountpoint" -force >/dev/null 2>&1 || true' EXIT
          hdiutil attach ./CodeTracer.dmg -mountpoint "$mountpoint" -nobrowse -readonly
          rm -rf ./CodeTracer
          mkdir -p ./CodeTracer
          # -R preserves the mode bits; -p would also preserve them but drags in
          # ownership, which cannot be reproduced off the image.
          cp -R "$mountpoint"/*.app ./CodeTracer/
          test -x ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct \
            || { echo "::error::the DMG ships bin/ct without an executable bit"; exit 1; }

      - name: Check if ct starts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          ./CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct --version

      - name: Record -> replay smoke on the packaged dmg
        # Informational, NOT a gate (continue-on-error): records a tiny Noir
        # package and reads it back with the SHIPPED ct + bundled recorder
        # (nargo / wazero / db-backend-record). Catches packaging regressions
        # that `--version` cannot -- a missing or mis-linked bundled recorder.
        # A known bug here may ship in an internal release and be fixed by a
        # follow-up; it must not block the release from cutting.
        continue-on-error: true
        env:
          CT: ${{ github.workspace }}/CodeTracer/CodeTracer.app/Contents/MacOS/bin/ct
        run: bash scripts/test-packaged-record-replay.sh

  appimage-lib-check:
    # CIP-5 Wave 4: migrated to the self-hosted NixOS runner. The DIY
    # `sudo snap install aws-cli` step is gone (`aws` now comes from
    # `nixpkgs#awscli2` via `nix shell`), and the `sudo apt-get install fuse
    # libfuse2` step is dropped entirely: the ephemeral NixOS runner has no
    # fusermount setuid wrapper / /dev/fuse, so we smoke-run the AppImage with
    # `APPIMAGE_EXTRACT_AND_RUN=1` (self-extract, no FUSE) — the same mode
    # nix/shells/ci-base.nix documents for AppImages on these runners.
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # 200-run window: 5 green, median 1.1m, max 1.2m. 15m is ~12x the slowest
    # green; the floor dominates because the job itself is seconds of work.
    timeout-minutes: 15
    needs:
      - appimage-build
    steps:
      - name: Checkout
        # Only so that `uses: ./.github/actions/setup-nix` below resolves; no
        # other step in this job reads the tree. No submodules and no token:
        # this repository is public and nothing here talks to a remote, and
        # these runners reuse their work tree, so a persisted credential would
        # outlive the job that minted nothing.
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ github.token }}

      - name: Download artifact
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage ./CodeTracer.AppImage
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage.asc ./CodeTracer.AppImage.asc
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer.pub.asc ./CodeTracer.pub.asc

      - name: Verify GPG signature
        # A signed release is only worth signing if we check the signature on
        # the exact bytes we ship. The detached .asc and the published public
        # key come from the same bucket the AppImage does; import the key and
        # verify before we run the binary, so a broken/absent signature fails
        # loudly here rather than being discovered by a user with `gpg --verify`.
        run: |
          nix shell nixpkgs#gnupg --command gpg --import ./CodeTracer.pub.asc
          nix shell nixpkgs#gnupg --command gpg --verify ./CodeTracer.AppImage.asc ./CodeTracer.AppImage

      - name: Check if ct starts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x ./CodeTracer.AppImage
          ./CodeTracer.AppImage --version

      - name: Record -> replay smoke on the packaged AppImage
        # Informational, NOT a gate (continue-on-error): records a tiny Noir
        # package and reads it back with the SHIPPED ct + bundled recorder
        # (nargo / wazero / db-backend-record). Catches packaging regressions
        # that `--version` cannot -- a missing or mis-linked bundled recorder.
        # A known bug here may ship in an internal release and be fixed by a
        # follow-up; it must not block the release from cutting.
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CT: ${{ github.workspace }}/CodeTracer.AppImage --appimage-extract-and-run
        run: bash scripts/test-packaged-record-replay.sh

  # Cross-distro AppImage smoke.  ubuntu-latest (the appimage-lib-check
  # runner above) shares too many runtime libs with the build host to
  # catch glibc/libgcc/libstdc++ symbol-version regressions or a missing
  # patchelf entry.  This matrix runs `--version`, `--help`, and a tiny
  # `ct record` of a Python script on five distinct base images via
  # Docker, using AppImage's `--appimage-extract-and-run` mode so we
  # don't need FUSE in the runner.  See
  # scripts/test-appimage-cross-distro.sh.
  appimage-cross-distro:
    # Self-hosted: this job's core is a 5-distro Docker matrix
    # (scripts/test-appimage-cross-distro.sh pulls ubuntu/debian/fedora/arch
    # images and runs the AppImage inside each), so it needs an in-guest Docker
    # daemon. Every `eph-linux-x64` container now provides one: the runner-image
    # consolidation folded the retired nested golden's capability into the single
    # `gosti-linux-runner` image (security.nesting + nested KVM + docker/fuse3
    # baked), so nested Docker is no longer a separate class. aws-cli comes from
    # nixpkgs.
    runs-on: [self-hosted, linux, x64]
    # 200-run window: 22 green across the five distro legs, median 9.9m,
    # slowest leg 12.5m (ubuntu:24.04). 40m is ~3.2x the slowest leg.
    # One bound covers the matrix, so it is set off the SLOWEST leg.
    timeout-minutes: 40
    needs:
      - appimage-build
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:40
          - archlinux:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false

      - name: Install Nix
        # WITHOUT THIS, THIS JOB USES WHATEVER NIX THE RUNNER IMAGE SHIPS.
        # `eph-linux-x64`'s ambient nix.conf does not enable the experimental
        # features `nix develop` / `nix shell` need, so the step below died with
        #
        #     error: experimental Nix feature 'nix-command' is disabled;
        #     add '--extra-experimental-features nix-command' to enable it
        #
        # in every one of the last twelve completed `dev` runs. Every other nix
        # job in this workflow provisions Nix first; these did not, and the
        # omission is invisible in review because `nix develop` reads as
        # self-contained. `ci/test/nix-provisioning-test.sh` now fails when a
        # job runs nix without provisioning it.
        #
        # This step (and a since-removed "Install AWS CLI" step) used to be
        # gated to `refs/tags/` while the Download AppImage + Smoke-test steps
        # that DEPEND on them were not, so on every branch (main/dev) run those
        # two ran without aws/nix installed and the job died at
        # `aws: command not found` — the AppImage's off-nix portability went
        # untested. Ungating them was necessary but NOT sufficient: the job
        # kept dying at the identical `aws: command not found` afterwards, for
        # a second and unrelated reason. See the note on "Download AppImage"
        # below, which is where the aws binary is now obtained.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ github.token }}

      - name: Download AppImage
        # WHY `nix shell --command` AND NOT A SEPARATE `nix profile install`.
        #
        # This step used to be preceded by an "Install AWS CLI" step running
        # `nix profile install nixpkgs#awscli2`, and it STILL died with
        #
        #     .../<step>.sh: line 1: aws: command not found
        #     ##[error]Process completed with exit code 127.
        #
        # in all five distro legs -- run 33742876598, jobs 100625123843
        # (debian:12), 100625123865 (fedora:40), 100625123866 (ubuntu:22.04),
        # 100625123986 (ubuntu:24.04), 100625124039 (archlinux:latest). The
        # install step itself SUCCEEDED in every one of them; only nix's
        # "'install' is a deprecated alias for 'add'" warning and the usual
        # restricted-setting warnings appear, and no error follows it.
        #
        # `nix profile install` writes into `$HOME/.nix-profile`, and
        # `$HOME/.nix-profile/bin` reaches PATH only via nix's profile shell
        # snippet. Each `run:` step is a fresh NON-login, NON-interactive shell
        # (`shell: /usr/bin/bash -e {0}`), which sources no profile, so the
        # binary exists on disk and is unreachable by name. Installing into a
        # profile and then invoking the tool bare in a later step cannot work
        # here regardless of whether the install succeeds -- which is why the
        # previous fix in this area (ungating the install step so it actually
        # ran; see the note in "Install Nix" above) did not change the symptom.
        # It addressed why the step was skipped, not why the name does not
        # resolve, and `aws: command not found` survived it unchanged.
        #
        # `nix shell nixpkgs#awscli2 --command aws ...` puts the binary on PATH
        # for exactly the process that needs it and does not depend on any
        # profile being sourced. This is the form the two sibling jobs that
        # download from the same bucket already use and that demonstrably
        # works: `appimage-lib-check` (line ~3860) and `dmg-lib-check`
        # (line ~3774) both got past their download in the same run -- far
        # enough to gpg-verify and then run the artifact.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
        run: |
          nix shell nixpkgs#awscli2 --command aws --endpoint-url=${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }} s3 cp s3://${{ vars.R2_CODETRACER_BUCKET_NAME }}/CodeTracer-${{ github.ref_name }}-amd64.AppImage ./CodeTracer.AppImage

      - name: Smoke-test on ${{ matrix.distro }}
        run: |
          bash scripts/test-appimage-cross-distro.sh \
            --distro ${{ matrix.distro }} \
            ./CodeTracer.AppImage

  test-non-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: nixos
            runner: [self-hosted, linux, x64]  # CIP-5 nix leg; H4: routed to GPU host gpu-server-001
          # CIP-5 Wave 4: the macOS leg now runs on the self-hosted nix-darwin
          # runner and drives the tests through codetracer's nix dev shell
          # (``nix develop . --command just test``), same as the nixos leg. The
          # former Homebrew-native ``./non-nix-build/build.sh`` toolchain (brew
          # install just / setup-python / dtolnay rust-toolchain) is gone; nim /
          # cargo / cargo-nextest / nimsuggest all come from the dev shell.
          - platform: macos
            runner: aarch64-darwin  # CIP-5: nix macOS job -> self-hosted m3 (aarch64-darwin)
    runs-on: ${{ matrix.runner }}
    # NO GREEN SAMPLE on either leg: 0 success in 99 records. Failures die early
    # (max 13.0m) so they are lower bounds; more usefully, a CANCELLED macOS leg
    # was still executing at 40.1m, which is a hard lower bound on how long a
    # healthy run can take. 60m clears that with ~1.5x margin.
    timeout-minutes: 60
    # macOS tests are new and may have pre-existing failures; don't block PRs
    continue-on-error: ${{ matrix.platform == 'macos' }}
    # NOTE: this job deliberately does NOT declare `needs: [lint-bash,
    # lint-nim, lint-nix, lint-rust]` any more.
    #
    # That dependency existed purely to fail fast and save runner time —
    # the lint jobs produce no artifact and no output this job consumes.
    # Its real effect was to make the entire non-GUI test suite hostage to
    # the lint lane's toolchain: when lint-rust started dying before it
    # linted anything (`direnv: not found`, exit 127; or `Setup dev env`
    # failing for want of a workspace lock), GitHub reported this job as
    # `skipped`, and the run was red from lint anyway, so the missing test
    # coverage was invisible. On `dev`, this job last executed on
    # 2026-06-25 and was skipped on every run after it.
    #
    # The lint jobs remain REQUIRED — ci/verdict/required-jobs.txt lists
    # all four, so a lint failure still fails the run. They just no longer
    # get to silence the tests on their way down.
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Evict stale git credentials from this runner's persistent home
        # Before any git operation: a stale owner-scoped extraHeader in this
        # reused runner's ~/.gitconfig outranks checkout's fresh one. A remote
        # action, so it needs no checkout; the rationale is in its action.yml.
        uses: metacraft-labs/metacraft-github-actions/evict-stale-git-credentials@2c12f82a56d5000bd47c42ad8c25a3596820057c

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        # Both legs drive the tests through ``nix develop`` now. On the
        # self-hosted eph-linux-x64 / aarch64-darwin runners nix is already
        # on PATH, so setup-nix is a fast no-op; it stays for hosted-runner
        # portability.
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # ``just test`` -> ``test-nimsuggest`` needs the codetracer source to
        # build, which pulls in ``../isonim/src`` et al. Both legs build inside
        # the nix dev shell, so both need the siblings adjacent to this
        # checkout -- and both have Nix by the step above, which this action
        # requires to reach ``repro``.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      # --- macOS setup ---
      # No open-coded just / Python / Rust / cargo-nextest toolchain steps and
      # no ``./non-nix-build/build.sh`` any more: the macOS leg runs the tests
      # inside codetracer's nix dev shell (``nix develop . --command just
      # test``), which provisions nim / cargo / cargo-nextest / nimsuggest from
      # /nix/store exactly like the nixos leg. ``just test`` (test-rust +
      # test-nimsuggest) builds what it needs via cargo, so no explicit
      # pre-build of the ct tree is required here.

      # ── db-backend siblings and the BEAM (Erlang / Elixir) recorder ──
      # `just test-rust` builds src/db-backend, whose build.rs compiles the
      # Nim MCR emulator out of the codetracer-native-recorder sibling and
      # panics without it, and whose Cargo.toml path-depends on
      # codetracer-trace-format (+ its matched Nim half). Those, and the BEAM
      # recorder that ``erlang_flow_dap_test.rs`` / ``elixir_flow_dap_test.rs``
      # find through ``test_harness::find_beam_recorder()`` (built per leg
      # below), are members of this repo's develop set, so the
      # "Provision dependency siblings from repro.lock" step above clones
      # them at repro.lock's revisions -- all but the private two, which the
      # public lock cannot pin (bbf7dbed4a6); they are cloned below at
      # flake.lock's (run 44864106832: build.rs panicked without them).

      - name: Read the private siblings' pins
        id: private_pins
        run: >-
          nix develop . --command bash ci/lib/sibling-pin-outputs.sh
          native_recorder=flake:codetracer-native-recorder
          native_backend=flake:codetracer-native-backend

      - name: Mint a token for the clones below
        # An installation token lives an hour, and the clones below come after
        # 'Provision dependency siblings from repro.lock', which can take most of
        # one on a cold runner: hand them a token minted here, not the job's first
        # (ci/test/late-clone-token-test.py).
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone codetracer-native-recorder
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-recorder
          ref: ${{ steps.private_pins.outputs.native_recorder }}
          path: ${{ github.workspace }}/../codetracer-native-recorder
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-native-backend
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-backend
          ref: ${{ steps.private_pins.outputs.native_backend }}
          path: ${{ github.workspace }}/../codetracer-native-backend
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'true'

      - name: Clone python-recorder (macOS)
        if: matrix.platform == 'macos'
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-python-recorder
          # `dev`, like the other twelve sibling clones in this workflow. This
          # was the ONLY one on `stable`, and it was the only one with no
          # comment saying why -- next to `codetracer-trace-format`, which is
          # deliberately on `dev` and says so. An unexplained outlier beside an
          # explained one is what cost the time here, so: what `dev` gives us is
          # a tree whose `requires-python` is TRUE. `stable` declares `>=3.8` in
          # both pyproject files, which this repo's own
          # `just test-python-version-alignment` correctly fails -- checks (F)
          # and (G) of 21 -- because an ABI-locked extension has a closed range
          # and the pure recorder evaluates PEP 604 unions that need 3.10+.
          # That was fixed on `dev` in 53edd25 on 2026-08-28 and never promoted.
          #
          # `dev` is also the HEALTHIER branch, which is the opposite of how the
          # two names read: at the time of writing the main `CI` workflow is
          # green on `dev@53edd25` and red on `stable@73c6f2f`.
          #
          # Revisit if `stable` starts being a release pointer something outside
          # these repos pins -- no such consumer was found in either product's
          # workflows, but absence of a reference is not proof of absence. If it
          # is, the right fix is to promote `dev` -> `stable` THERE (a merge,
          # never a force-push: `stable` holds 73c6f2f, which `dev` lacks) and
          # change this line back.
          ref: dev
          path: ${{ github.workspace }}/../codetracer-python-recorder
          gh-token: ${{ steps.late_token.outputs.token }}

      # The Ruby recorder, on BOTH legs. It used to be cloned and built on macOS
      # only, on the reading that the nixos leg got it from "Provision
      # dependency siblings from repro.lock". It does not: that action clones
      # only the lock's BUILD inputs (ci/repro-lock-build-input-siblings.sh:
      # isonim and the Nim libraries), and codetracer-ruby-recorder is a
      # test-lane member of the develop set, not a build input. And a clone
      # alone would not have been enough, because the extension is compiled.
      #
      # backend-manager's real_recording_integration records its custom-format
      # traces with the native Ruby recorder (`find_ruby_recorder()`: the
      # `codetracer-ruby-recorder` launcher, used only when the extension under
      # ext/native_tracer/target/release is built) and FAILS without one --
      # "no CTFS-capable Ruby recorder found", about thirty test_real_custom_*
      # tests plus test_real_py_add_watchpoint_reports_the_backends_own_verdict
      # on the nixos leg. The lane ships ruby and is the lane meant to run
      # them, so it provisions the recorder rather than excluding them.
      - name: Clone ruby-recorder
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-ruby-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-ruby-recorder
          gh-token: ${{ steps.late_token.outputs.token }}

      - name: Build ruby-recorder native extension
        # Both legs (see the clone step above for why the nixos leg needs it
        # too); the sibling's own flake supplies the toolchain on each.
        #
        # The clone above is NOT enough, and for a long time nothing here said
        # so. `grep -E 'rake compile|extconf|build-extension'` over `.github/`
        # returned ZERO hits: the extension was built only by
        # scripts/build-siblings.sh, which on this workflow is reached solely by
        # the LINUX ct-test-providers job. Both macOS legs cloned the recorder
        # and then ran against a tree with no compiled artefact in it.
        #
        # It failed silently rather than loudly because scripts/detect-siblings.sh
        # probed `gems/codetracer-ruby-recorder/bin/codetracer-ruby-recorder` --
        # a nine-line shim CHECKED INTO GIT at mode 100755. That test cannot
        # fail, so detection printed "(native)", its "not built" warning was
        # unreachable, and the run died much later inside
        # `CodeTracer::Native.load_extension!` requiring a file nobody had named.
        # That probe is fixed too (contract suite:
        # ci/test/detect-siblings-recorder-artifacts-test.sh); this step closes
        # the other half, because a correct detector reporting "not built" is
        # still a red job if nothing ever builds it.
        #
        # Same `nix develop --command just <target>` shape as the ct-mcr step
        # above, and for the same reason: scripts/build-siblings.sh assumes
        # direnv-allow state and a parent codetracer dev shell, neither of which
        # this runner has yet, while the sibling's own flake supplies the Rust +
        # Ruby toolchain `just build-extension` expects.
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-ruby-recorder"
          # Built INTO the gem's own target/ directory. The Linux runners export
          # their own CARGO_TARGET_DIR (see cross-repo-tests.yml's ct-native-replay
          # step), and both the loader (`load_extension!`) and backend-manager's
          # `find_ruby_recorder()` look only under ext/native_tracer/target/release,
          # so a build that followed the runner's variable would land where neither
          # looks and fail the assertion below.
          CARGO_TARGET_DIR="$PWD/gems/codetracer-ruby-recorder/ext/native_tracer/target" \
            nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-ruby-recorder-shell" --no-write-lock-file --command just build-extension

          # Assert the artefact, do not assume the exit code. `just
          # build-extension` succeeding is not the same claim as "the file the
          # loader requires now exists", and it is the second claim that the
          # Playwright and non-GUI suites depend on.
          #
          # `load_extension!` (gems/codetracer-ruby-recorder/lib/codetracer/native.rb)
          # accepts `codetracer_ruby_recorder.<RbConfig DLEXT>` or any
          # `libcodetracer_ruby_recorder.{so,bundle,dylib,dll}` beside it, which
          # it then links to the name `require` wants. On macOS DLEXT is
          # `bundle`; asserting `.so` here -- the spelling
          # scripts/build-siblings.sh used to hard-code -- would fail on every
          # green build. On Linux it is `so`, and cargo names the cdylib
          # `libcodetracer_ruby_recorder.so`; the list below accepts each leg's
          # spellings.
          ext_dir="gems/codetracer-ruby-recorder/ext/native_tracer/target/release"
          found=""
          for cand in \
            "$ext_dir/codetracer_ruby_recorder.bundle" \
            "$ext_dir/codetracer_ruby_recorder.so" \
            "$ext_dir/libcodetracer_ruby_recorder.bundle" \
            "$ext_dir/libcodetracer_ruby_recorder.dylib" \
            "$ext_dir/libcodetracer_ruby_recorder.so"; do
            if [ -f "$cand" ]; then found="$cand"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error::just build-extension reported success but produced no loadable extension in $ext_dir. Contents:"
            ls -la "$ext_dir" || echo "  (directory does not exist)"
            exit 1
          fi
          echo "ruby recorder native extension: $found"

      - name: Mint a token for the clone below
        # An installation token lives an hour, and the clone below comes after
        # 'Build ruby-recorder native extension', which can take most of
        # one on a cold runner: hand it a token minted here, not the job's first
        # (ci/test/late-clone-token-test.py).
        id: late_token_2
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      # ---------------------------------------------------------------------
      # codetracer-js-recorder. This lane runs `./ci/test/non-gui.sh` ->
      # `just test` -> `just test-rust` -> `cargo nextest run --release
      # --test '*'`, so every JavaScript test executes here, and every one of
      # them needs this sibling, among them:
      #
      #   javascript_flow_integration::test_javascript_flow_integration
      #   javascript_flow_dap_test::javascript_flow_dap_variables_and_values
      #   javascript_flow_dap_test::test_js_locals_all_statements
      #   javascript_hcr_ctfs_integration::test_javascript_hcr_ctfs_integration
      #   javascript_locals_dap_test::test_js_load_locals_is_point_in_time_not_a_frame_union
      #   javascript_locals_dap_test::test_js_locals_live_recording_has_values_on_every_step
      #
      # `find_js_recorder()` (src/db-backend/tests/test_harness/mod.rs:2469)
      # resolves `../../../codetracer-js-recorder/packages/cli/dist/index.js`
      # relative to `src/db-backend`, i.e. the sibling checkout beside this
      # one -- exactly where `clone-repo` places it below.
      #
      # `origin_javascript_dap_test`'s four tests resolve the recorder the same
      # way and also run on this lane, but their guard is a bare `return` with
      # an `eprintln!` -- so without the sibling they pass while asserting
      # nothing. They are not listed above because the five are the tests that
      # REPORT a missing recorder; the clone makes all nine actually run.
      #
      # WHY THIS MATTERS: with the sibling absent, `find_js_recorder()` answers
      # None, the HCR test takes its loud-skip path and the two DAP suites
      # panic. NO CI lane built this recorder: `test-non-gui` provisioned
      # trace-format, trace-format-nim, python-, ruby- and beam-recorder and
      # not this one, and `windows-rust-components` runs a bare `cargo test`
      # with the JS suites `--skip`ped outright. A defect affecting EVERY
      # multi-file JavaScript trace survived roughly two months behind that
      # gap and was found only because one developer happened to have the
      # sibling built locally.
      #
      # Provisioned with `clone-repo` rather than by extending the
      # `siblings:` block above: that block's entries are `=dev` branch tips,
      # and `ci/test/sibling-provisioning-test.sh`'s branch-tip CEILING "is
      # lowered as blocks are converted and is never raised". This is the same
      # shape the `test-ui-tests` and `viewmodel-tests` jobs already use for
      # this same repo. NOT gated to one platform: both legs run the same
      # `just test`, so both need it.
      #
      # The loud-skip path in the tests is deliberately left alone. The goal is
      # that CI HAS the recorder, not that every developer must.
      - name: Clone codetracer-js-recorder sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-js-recorder
          ref: dev
          path: ${{ github.workspace }}/../codetracer-js-recorder
          submodules: "false"
          gh-token: ${{ steps.late_token_2.outputs.token }}

      - name: Build codetracer-js-recorder sibling
        # The clone lands unbuilt and `packages/cli/dist/` is PRODUCED, never
        # committed, so there is no stale copy to fall back on: without this
        # step `find_js_recorder()` still answers None and the JS tests still
        # skip. `ci/verdict/recorder-clone-implies-build.py` enforces that a
        # job cloning this repo also builds it in the same job.
        #
        # Built in the RECORDER's own pinned dev shell (`nix develop` from its
        # checkout), the way `scripts/build-siblings.sh` and `test-ui-tests`
        # build it -- codetracer's shell does not ship the napi/node toolchain
        # the addon needs.
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-js-recorder"
          nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-js-recorder-shell" --no-write-lock-file --command just build

          # Assert the artefact `find_js_recorder()` actually opens, by the
          # same name it uses. A built-looking tree with no dist/index.js
          # would put the JS tests straight back on the skip path, silently.
          if [ ! -f packages/cli/dist/index.js ]; then
            echo "::error::just build reported success but packages/cli/dist/index.js is missing; find_js_recorder() returns None and the JavaScript db-backend tests skip instead of asserting."
            ls -la packages/cli/dist 2>/dev/null || echo "  (packages/cli/dist does not exist)"
            exit 1
          fi
          echo "js recorder CLI: $(pwd)/packages/cli/dist/index.js"

      - name: Mint a token for the clone below
        # An installation token lives an hour, and the clone below comes after
        # 'Build codetracer-js-recorder sibling', which can take most of
        # one on a cold runner: hand it a token minted here, not the job's first
        # (ci/test/late-clone-token-test.py).
        id: late_token_3
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      # ---------------------------------------------------------------------
      # codetracer-wasm-instrumenter. Seven db-backend integration tests in
      # this lane replay the `cross-process-three-trace` recording
      # (cross_process_three_trace_dap_test, m25b_event_log_test,
      # step_over_frameless_step_test). It is not committed: the test harness
      # produces it from this tree with scripts/materialize-recording.sh, which
      # instruments the demo's wasm with `ct-instrument` and refuses to record
      # without it ("ct-instrument not found"). Its other prerequisite,
      # `session-manager`, is built by `just test-rust` itself.
      #
      # Cloned with `clone-repo` for the same branch-tip-ceiling reason as the
      # js recorder above, and built in the instrumenter's own dev shell. The
      # script finds the binary at `<sibling>/target/release/ct-instrument`.
      # Not gated to one platform: both legs run the same `just test`.
      - name: Clone codetracer-wasm-instrumenter sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-wasm-instrumenter
          ref: dev
          path: ${{ github.workspace }}/../codetracer-wasm-instrumenter
          submodules: "false"
          gh-token: ${{ steps.late_token_3.outputs.token }}

      - name: Build ct-instrument (codetracer-wasm-instrumenter sibling)
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-wasm-instrumenter"
          # Pinned, like the native backend and Ruby recorder builds in this
          # lane: the self-hosted runners export a runner-wide
          # CARGO_TARGET_DIR, and under it cargo wrote the binary there, so
          # the check below failed after a successful build. The pin makes
          # the path checked the path written. scripts/materialize-recording.sh
          # also honours a CARGO_TARGET_DIR it is given, for builds outside
          # this step. Asserted by ci/test/ct-instrument-target-dir-test.sh.
          CARGO_TARGET_DIR="$PWD/target" \
            nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/codetracer-wasm-instrumenter-shell" --no-write-lock-file --command cargo build --release -p ct-instrument-cli
          if [ ! -x target/release/ct-instrument ]; then
            echo "::error::cargo build reported success but target/release/ct-instrument is missing; scripts/materialize-recording.sh cannot produce the cross-process recording."
            exit 1
          fi
          echo "ct-instrument: $(pwd)/target/release/ct-instrument"

      - name: Allow direnv in cloned codetracer-beam-recorder
        # ``elixir_flow_dap_test.rs`` / ``erlang_flow_dap_test.rs``
        # invoke ``elixirc`` / ``erlc`` through
        # ``test_harness::run_in_recorder_shell``, which routes
        # tooling through ``direnv exec <beam-recorder-root> bash -lc``
        # so the BEAM recorder's own dev shell (declaring elixir +
        # erlang + rebar3 in flake.nix) is what supplies the
        # compilers.  ``should_use_recorder_direnv`` first probes
        # ``direnv exec <repo> true`` -- on a fresh clone that probe
        # fails because the cloned ``.envrc`` is in the "blocked"
        # state, so the helper silently falls back to the bare
        # codetracer-shell PATH (which has no elixirc) and the test
        # panics with ``failed to run elixirc in recorder dev shell:
        # No such file or directory (os error 2)``.  Allow the .envrc
        # before the test runs -- same idempotent pattern as the
        # codetracer-native-recorder direnv-allow step above. Both legs run
        # these tests, so both allow it; `nix develop .` is the host's own
        # default shell on either.
        run: |
          nix develop . -c \
            direnv allow "${{ github.workspace }}/../codetracer-beam-recorder"

      - name: Build codetracer-beam-recorder (nixos)
        # ``find_beam_recorder()`` resolves the binary at
        # ``../codetracer-beam-recorder/target/debug/codetracer-beam-recorder``
        # -- pre-build it here so the Erlang / Elixir flow DAP tests
        # don't have to bootstrap the recorder themselves.
        #
        # Use codetracer's nix dev shell (not BEAM's own) because
        # BEAM's flake only ships {cargo, elixir, erlang, rebar3,
        # rustc} and the recorder transitively path-depends on
        # ``codetracer-trace-format/codetracer_trace_writer_nim``,
        # whose build.rs panics with "failed to run `nimble`" when
        # nimble isn't on PATH.  Codetracer's shell ships the full
        # nim/nimble toolchain.
        #
        # We skip ``--locked`` because the sibling
        # codetracer-trace-format clone is pinned to a newer ref
        # than the BEAM recorder's own Cargo.lock was generated
        # against; ``cargo build`` (without --locked) regenerates
        # the lock against the checked-out source.
        #
        # ``CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL=1`` is
        # set because the trace-format-nim crate's build.rs runs
        # ``nimble install --depsOnly`` by default, and the stew
        # dependency isn't in the recorder's nimble metadata --
        # codetracer's vendored ``libs/nim-stew`` is injected via
        # ``CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS`` instead, same
        # pattern as the macos test-non-gui branch above.  rebar3
        # compile (which the recorder's ``build-native`` target
        # also does) is irrelevant for the DAP tests.
        if: matrix.platform == 'nixos'
        shell: bash
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          # libs/nim-result LAST: Nim gives the last --path precedence, and
          # without it `import results` finds libs/nim-stew/stew's legacy copy
          # (no `unsafeError`, a `func mapErr` nim-fork 2.3.1 refuses), as in
          # run 44384977215's regression gate. ct-build sets the same three.
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          nix develop .#devShells.x86_64-linux.default --command bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-beam-recorder"
            cargo build
          '

      - name: Build codetracer-beam-recorder (macOS)
        # cargo now comes from codetracer's nix dev shell (``nix develop .``)
        # rather than a DIY rust-toolchain — same source the nixos step above
        # uses, only with the host-default aarch64-darwin shell instead of the
        # explicit x86_64-linux selector.  Codetracer's shell ships the full
        # nim / nimble toolchain the recorder's transitive
        # codetracer_trace_writer_nim build.rs needs.
        #
        # Skip the recorder's ``just build-native`` (which uses ``--locked``)
        # for the same reason as the nixos step -- the trace-format sibling is
        # checked out at a newer ref than the recorder's Cargo.lock expects.
        # ``CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL=1`` +
        # ``CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS`` inject codetracer's
        # vendored stew instead of a network ``nimble install --depsOnly``,
        # exactly as the nixos step does.
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          # libs/nim-result LAST: Nim gives the last --path precedence, and
          # without it `import results` finds libs/nim-stew/stew's legacy copy
          # (no `unsafeError`, a `func mapErr` nim-fork 2.3.1 refuses), as in
          # run 44384977215's regression gate. ct-build sets the same three.
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}"
          nix develop . --command bash -c '
            set -euo pipefail
            cd "${GITHUB_WORKSPACE}/../codetracer-beam-recorder"
            cargo build
          '

      # Runs all Rust tests including flow integration tests for all languages.
      # WASM flow tests skip automatically if wazero or wasm32-wasip1 target
      # are not available. Stylus flow tests are #[ignore] and need a devnode.
      # Cross-repo tests (rr) run in the separate test-ui-tests-rr job.
      - name: Build ct-print (codetracer-trace-format-nim sibling)
        # The GDScript version-attribution tests (gdh7_consumers_tell_the_truth)
        # read recordings through `ct-print` as an independent decoder and fail
        # without it: it is a build artefact of the trace-format-nim sibling,
        # which this job clones but never built. Built with that repo's own
        # recipe, inside codetracer's dev shell (which carries nim and nimble).
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/../codetracer-trace-format-nim"
          nix develop "${{ github.workspace }}" --command nimble buildCtPrint
          if [ ! -x ct-print ]; then
            echo "::error::nimble buildCtPrint reported success but ct-print is missing; the gdh7 tests cannot run."
            exit 1
          fi

      - name: Run tests
        run: ./ci/test/non-gui.sh
        env:
          CODETRACER_CI_PLATFORM: ${{ matrix.platform }}
          # The MCR emulator's Nim build resolves stew / results from
          # codetracer's vendored copies, as every other db-backend lane does.
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result

  test-ui-tests:
    # The job is in .github/workflows/test-ui-tests.yml.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/test-ui-tests.yml
    secrets: inherit

  test-ui-tests-rr:
    # The job is in .github/workflows/test-ui-tests-rr.yml.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/test-ui-tests-rr.yml
    secrets: inherit

  visual-replay-regression-gate:
    # Visual-replay specs cross-validate HW rasterisation (gfx-real, the
    # Vulkan / OpenGL output the user actually sees) against SW
    # rasterisation (lavapipe), then diff at the pixel level.  Without
    # a real GPU the HW path silently swrasts and the diff degenerates
    # to comparing lavapipe-against-lavapipe -- the gate's whole point
    # disappears.  Pin to runners with the ``gpu`` label so jobs only
    # land on hosts with usable Vulkan / GL drivers (each gpu-server
    # carries 2x RTX 3090; see metacraft-labs/infra
    # services/github-runners/common.nix).
    # EXEMPTION (CIP-5): GPU runner -> kept persistent [self-hosted, gpu]; the HW
    # rasterisation vs lavapipe visual gate needs a real GPU (2x RTX 3090), which
    # the ephemeral eph-linux-x64 class has no access to. 5-platform matrix N/A.
    runs-on: [self-hosted, gpu]
    timeout-minutes: 180
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          skip-token-revoke: false

      - name: Sweep stale git lock files from the persistent work directory
        # MODE 2 of the self-hosted checkout outage. gpu-server-001-mcl-002 is
        # a PERSISTENT runner: $RUNNER_WORKSPACE and the repo inside it survive
        # between jobs. A job killed mid-fetch leaves git's `*.lock` sentinels
        # behind, and the NEXT job's checkout dies before any product code runs:
        #
        #   fatal: Unable to create
        #   '.../codetracer/.git/modules/libs/nim-faststreams/shallow.lock':
        #   File exists.
        #   fatal: Fetched in submodule path 'libs/nim-faststreams', but it did
        #   not contain 37a18315... Direct fetching of that commit failed.
        #
        # `clean: true` on actions/checkout does not help: `git clean -ffdx`
        # removes untracked files in the WORKTREE and never touches `.git`.
        #
        # COUNT WHAT IS REMOVED. `rm -f` on a path that no longer exists exits
        # 0 and reads exactly like a sweep that worked; this campaign has been
        # misled by silent no-op cleanups more than once. So this step prints
        # how many locks it found, names each one, and re-counts afterwards. A
        # run where the sweep found 0 is a run where this was NOT the cause,
        # and the log says so plainly instead of implying success.
        #
        # Only locks older than 60 minutes are swept: a fresh lock could belong
        # to a concurrent job on the same host, and deleting a live lock would
        # manufacture the corruption this step exists to clear.
        #
        # AND ONLY GIT'S OWN LOCKS. The first version matched `-name '*.lock'`
        # anywhere under the work directory, which is a very different thing
        # from what the prose above describes. Measured on run 33734457928, job
        # 100581651054, gpu-server-002-mcl-001: of the 42 files it deleted, the
        # ones it named first were
        #
        #   codetracer-trace-format/Cargo.lock
        #   codetracer-trace-format/flake.lock
        #   nim-agents/repro.lock
        #   isonim/src/isonim/layout/yoga/yarn.lock
        #
        # — the PINS of the sibling checkouts, not git sentinels. A sweep meant
        # to unblock checkout was quietly unpinning the build. The find is now
        # anchored under a `.git` directory, which is the only place git puts
        # the `*.lock` files this step is about.
        run: |
          set -uo pipefail
          root="${RUNNER_WORKSPACE:-}"
          echo "stale-lock-sweep: runner=${RUNNER_NAME:-?} root=${root:-<unset>}"
          if [ -z "$root" ] || [ ! -d "$root" ]; then
            echo "stale-lock-sweep: found 0 stale lock file(s) (work dir absent - fresh runner)"
            exit 0
          fi
          found=0
          removed=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            found=$((found + 1))
            echo "stale-lock-sweep:   found $f"
            if rm -f "$f"; then
              removed=$((removed + 1))
            else
              echo "stale-lock-sweep:   FAILED to remove $f"
            fi
          done < <(find "$root" -type d -name .git -exec \
            find {} -type f -name '*.lock' -mmin +60 ';' 2>/dev/null)
          remaining=$(find "$root" -type d -name .git -exec \
            find {} -type f -name '*.lock' -mmin +60 ';' 2>/dev/null | wc -l | tr -d ' ')
          echo "stale-lock-sweep: found $found, removed $removed, still present $remaining"
          if [ "$found" -eq 0 ]; then
            echo "stale-lock-sweep: NOTHING WAS STALE - if checkout still fails, mode 2 is not the cause"
          fi
          if [ "$remaining" -ne 0 ]; then
            echo "stale-lock-sweep: WARNING sweep did not clear everything it found"
          fi

      - name: Evict stale git credentials from this runner's persistent home
        # Before any git operation: a stale owner-scoped extraHeader in this
        # reused runner's ~/.gitconfig outranks checkout's fresh one. A remote
        # action, so it needs no checkout; the rationale is in its action.yml.
        uses: metacraft-labs/metacraft-github-actions/evict-stale-git-credentials@2c12f82a56d5000bd47c42ad8c25a3596820057c

      - name: Checkout CodeTracer
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave `http.https://github.com/.extraHeader` behind in
          # `.git/config` for the rest of a three-hour job on a persistent GPU
          # runner. This is ordinary least-persistence hygiene — the same reason
          # actions/checkout v6 moved the credential out of `.git/config`
          # entirely — and NOT a boundary the private-Cargo preflight depends
          # on: that header carries the org-wide CI App token, which by policy
          # also authenticates the private lldb-sys dependency, so its presence
          # is never a leak and the preflight no longer asserts anything about
          # it. See the long note in
          # `ci/test/visual-replay-private-cargo-preflight.sh`.
          #
          # Nothing downstream needs the persisted header:
          #   * `Setup dev env` gets the same token explicitly via `gh-token`.
          #   * `submodules: recursive` is unaffected — actions/checkout fetches
          #     submodules under a temporary *global* auth config it installs
          #     regardless of this setting, and only strips the credential in
          #     its `finally` block, after submodules are checked out.
          #   * The gate itself does no network git against this checkout. Its
          #     one authenticated fetch (`git ls-remote` on lldb-sys, in the
          #     preflight) uses the process-scoped `GIT_CONFIG_KEY_0`
          #     extraHeader; every other git-touching step runs with its working
          #     directory inside a *sibling* repo provisioned by setup-dev-env.
          persist-credentials: false

      - name: Setup dev env
        # setup-dev-env installs Nix (with the Attic substituter/keys) and
        # clones every source dependency used by the visual gate adjacent to
        # this checkout at their pinned refs -- repro.lock's for the IsoNim
        # and agent libraries. That includes the
        # frontend's IsoNim/agent libraries, the incremental runner's trace and
        # I/O libraries, and visual replay's own native siblings. A missing
        # lock entry fails loudly before the build starts.
        #
        # `runquota` is on the list because this gate runs `just build-once`,
        # which compiles `ct`, which pulls in src/ct_test/process_exec.nim ->
        # `import runquota_process`. This CHECKOUT is
        # where those modules resolve from: `config.nims` points at
        # `../runquota/...`. Its absence is what made this job
        # die on `cannot open file: runquota_process` (issue #641), fifteen
        # minutes into the Nim compile rather than here.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            # BARE, so clone-siblings takes repro.lock's revisions: build-once
            # refuses a producer checkout the lock does not name, and
            # `isonim=agents` cloned the branch tip (530cfa8) where the lock
            # pins b56bd098 (run 44900586259).
            isonim
            nim-everywhere
            nim-acp
            nim-agent-harbor
            nim-agents
            # codetracer-trace-format{,-nim} BY COMMIT, not `=dev`: the two halves of
            # the FFI pair are `/agents` inputs in flake.nix, and trace-format's `dev`
            # tip (051a298, 2026-09-30) predates the FileTable / PathTableKind API that
            # src/db-backend's ctfs_trace_reader has called since 2026-10-03, so a
            # sibling cloned at `dev` fails to compile. Full account and the refresh
            # rule: .github/actions/setup-db-backend-siblings/action.yml.
            codetracer-trace-format=2f01e602e70f69a04675293f3fa0d5bad9f196a1
            codetracer-trace-format-nim=3e50ca3f2bf6316e8f764952a84078cf59b11023
            io-mon=1365943692eedfb0699ce90e59c4602d90317561
            nim-shm-queue=0d6049997d77421b6e4748f819657cf6042e9508
            nim-shm-gset=803a4faa23f985ad9697437603436f2f784072be
            nim-stackable-hooks=07319306758cf608e664fe9e64ab7e0bed5ca186
            # codetracer-native-backend and codetracer-visual-replay BY COMMIT as well: both are
            # `/agents` inputs in flake.nix (7ab073a22), so `=dev` cloned a different tree than the
            # Nix lane builds. These are the revs flake.lock and repro.lock lock; refresh them with
            # the lock, as for the trace-format pair above.
            codetracer-visual-replay=360a8131ec9fc81d0ebd1cdbd1743238218346af
            codetracer-native-backend=367e7164f43453513681807eeadb8797b6d5bcde
            codetracer-native-recorder=95da3c1397cd62b9940ca91ce9109b7a61b228a9
            codetracer-native-test-programs=0d0d64e2ebe2cb261284778fa7959bb7cf761604
            runquota=83d89e581d01c96eadb157bee48cecab6aba1866
            isonim-tui
            test-certificates-tools
            nim-pty

      - name: Check out codetracer-native-backend's submodules
        # setup-dev-env clones the sibling without them. Where the gate has to
        # build ct-native-replay (a runner with no build of it in the sibling's
        # target/), `nix develop '.?submodules=1'` then fetched libs/rr and
        # libs/delve from the empty paths over file://, which the gate's Git
        # policy refuses ("transport 'file' not allowed", the TUI job's player
        # build in run 44081496736). Checked out, Nix reads them in place. Here,
        # because libs/rr is private and the gate step runs with no credential
        # but the lldb-sys header (ci/test/native-backend-submodules-test.sh).
        run: git -C "${{ github.workspace }}/../codetracer-native-backend" submodule update --init --recursive

      - name: Build ct for the gate and the Visual Replay capture
        # Its own step, so the capture below can wait on it (the gate rebuilds).
        id: ct
        run: nix develop .#devShells.x86_64-linux.default --command just build-once

      - name: Run visual replay regression gate
        env:
          # The CodeTracer dev shell already supplies Nim/Nimble. Build the
          # recorder emulator directly instead of re-entering its freshly
          # cloned, unapproved direnv environment; provide the vendored
          # results/stew paths that build_native_api.sh imports.
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew
          # libs/nim-result LAST: Nim gives the last --path precedence, and
          # without it `import results` finds libs/nim-stew/stew's legacy copy
          # (no `unsafeError`, a `func mapErr` nim-fork 2.3.1 refuses), as in
          # run 44384977215's regression gate. ct-build sets the same three.
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CODETRACER_VISUAL_REPLAY_REPO_PATH: ${{ github.workspace }}/../codetracer-visual-replay
          CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN: ${{ steps.ci_token.outputs.token }}
          PLAYWRIGHT_GLOBAL_TIMEOUT: "10800000"
        run: |
          set -euo pipefail

          # Cargo's default libgit2 transport does not honor the Git URL
          # authentication installed by setup-dev-env. Force the Git CLI and
          # give it a process-scoped HTTP header for the one private dependency
          # used by codetracer-native-backend. Keep the repository URL free of
          # credentials so the token cannot enter git-remote-https argv. No
          # credential file is written; the App token is revoked by its
          # action's post-job hook.
          lldb_sys_url="https://github.com/metacraft-labs/lldb-sys.rs.git"
          cargo_auth_basic="$(
            printf 'x-access-token:%s' "${CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN}" |
              base64 | tr -d '\r\n'
          )"
          cargo_home="${RUNNER_TEMP}/visual-replay-cargo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "${cargo_home}"
          mkdir -p "${cargo_home}"
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          export CARGO_HOME="${cargo_home}"
          export CODETRACER_VISUAL_REPLAY_CLEAN_CARGO_HOME=true
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          export SSH_ASKPASS=/bin/false
          export GIT_CONFIG_GLOBAL=/dev/null
          export GIT_CONFIG_SYSTEM=/dev/null

          # A self-hosted runner may carry process-scoped Git configuration
          # from its launcher. Remove every numbered entry before installing
          # the closed configuration below; entries above GIT_CONFIG_COUNT are
          # ignored by Git today, but must not become active if this list is
          # extended later. GIT_CONFIG_PARAMETERS is a separate inline channel.
          for git_env_name in "${!GIT_CONFIG_KEY_@}" "${!GIT_CONFIG_VALUE_@}"; do
            if [[ "${git_env_name}" =~ ^GIT_CONFIG_(KEY|VALUE)_[0-9]+$ ]]; then
              unset "${git_env_name}"
            fi
          done
          unset GIT_CONFIG_PARAMETERS GIT_CONFIG_NOSYSTEM GIT_ALLOW_PROTOCOL

          # Carry only the header and helper block through Nix shell startup.
          # The gate re-establishes all non-secret policy values after the
          # git-hooks shell hook has finished and before invoking Git/Cargo.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0="http.${lldb_sys_url}.extraHeader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${cargo_auth_basic}"
          export GIT_CONFIG_KEY_1="credential.helper"
          export GIT_CONFIG_VALUE_1=""
          unset CODETRACER_VISUAL_REPLAY_GITHUB_TOKEN cargo_auth_basic

          cleanup_private_cargo_auth() {
            rm -rf "${cargo_home}"
            unset CARGO_NET_GIT_FETCH_WITH_CLI CARGO_HOME
            unset CODETRACER_VISUAL_REPLAY_CLEAN_CARGO_HOME
            unset GIT_TERMINAL_PROMPT GIT_ASKPASS SSH_ASKPASS
            unset GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM
            unset GIT_CONFIG_PARAMETERS GIT_CONFIG_NOSYSTEM GIT_ALLOW_PROTOCOL
            unset GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0
            unset GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1
            unset git_env_name lldb_sys_url cargo_home
          }
          trap cleanup_private_cargo_auth EXIT

          nix develop .#devShells.x86_64-linux.default --command just test-visual-replay-gate

      - name: The desktop's Visual Replay panes are the reference
        if: ${{ !cancelled() && steps.ct.outcome == 'success' }}
        # The desktop column of the Visual Replay panes: the Video Player's
        # frame at three positions on a real `gl_scene` recording, a draw
        # call, a picked pixel's history, the Shader Debug pane and a history
        # row's click — read from the REAL Electron app with this checkout's
        # desktop JavaScript. Here, after the gate, because the gate builds
        # the recorder and the player the recording and the desktop need; the
        # recipe records the recording and starts its own Xvfb.
        run: nix develop .#devShells.x86_64-linux.default --command just plat59-capture-electron

      - name: Stage sibling artifacts into workspace
        # actions/upload-artifact@v5 forbids paths containing ``..``
        # and absolute paths outside the workspace, so the previous
        # config aborted with ``Invalid pattern '../codetracer-visual-replay/...':
        # Relative pathing '.' and '..' is not allowed``.  Copy any
        # sibling and /tmp artifacts into a workspace staging dir so
        # the upload step can reference them via workspace-relative
        # globs.
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          STAGE="visual-replay-regression-staging"
          mkdir -p "${STAGE}/sibling/tests/output" \
                   "${STAGE}/sibling/bench-results" \
                   "${STAGE}/tmp"
          if [ -d ../codetracer-visual-replay/tests/output ]; then
            cp -a ../codetracer-visual-replay/tests/output/. \
                  "${STAGE}/sibling/tests/output/" 2>/dev/null || true
          fi
          if [ -d ../codetracer-visual-replay/bench-results ]; then
            cp -a ../codetracer-visual-replay/bench-results/. \
                  "${STAGE}/sibling/bench-results/" 2>/dev/null || true
          fi
          shopt -s nullglob
          for f in /tmp/*_diff.rgba /tmp/*_sw.rgba /tmp/*_hw.rgba; do
            cp -a "$f" "${STAGE}/tmp/" 2>/dev/null || true
          done

      - name: Upload visual replay artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: visual-replay-regression-artifacts
          path: |
            src/tests/gui/test-results/
            src/tests/gui/playwright-report/
            src/tests/gui/test-stats/
            storybook/storybook-static/
            storybook/dist/
            visual-replay-regression-staging/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # ct-test gates.
  #
  # `ci/test/m16-release-gate.sh` and `ci/test/ct-providers.sh` were real,
  # maintained scripts that NO pipeline invoked: `.gitlab-ci.yml`'s only test
  # jobs are `just test` (test-rust + test-nimsuggest + optional cross-repo) and
  # `ci/test/ui-tests.sh`, and no workflow here named either script. They ran
  # only when a human typed `just test-m16-release-gate` / `just
  # test-ct-providers`. Every suite listed in them — not just the most recently
  # added one — has therefore been in a gate that never gated.
  #
  # They are split across two jobs on purpose, because they have very different
  # prerequisites and mixing them would let the harder one's infrastructure
  # failures mask the easier one's test failures:
  #
  #   * `ct-test-release-gate` needs nothing but the codetracer dev shell. It is
  #     the toolchain-light provider matrix plus the framework contract,
  #     discovery, run-store and worker-pool suites.
  #   * `ct-test-providers` drives real external toolchains AND three recorder
  #     siblings (native/ct-mcr, JavaScript, Ruby), which have to be checked out
  #     and built before the recording assertions can run.
  #
  # Neither job weakens what the scripts check: `CT_PROVIDERS_ALLOW_MISSING` and
  # `CT_PROVIDERS_SKIP_SIBLINGS` are deliberately NOT set, so a recorder that is
  # missing or fails to build fails the job instead of quietly turning the
  # recording assertions into no-ops.
  # ---------------------------------------------------------------------------
  ct-test-release-gate:
    # Moved -g2 -> -g1 as the counterweight to test-ui-tests-rr (22.1 min)
    # landing on -g2 in this same commit; without it the always-on subset skews
    # 103.4 vs 122.2. Lands next to ct-test-providers, which it shares a closure
    # with, so the move is locality-positive as well as arithmetic.
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # 200-run window: 48 green, median 5.5m, max 8.6m -- measured before the
    # job provisioned its siblings through provision-repro-lock-siblings, which
    # realises the dev shell first. Since: the green run on dev 3266ab28aa took
    # 24.3m of the old 25m (11.7m provisioning, 10.9m in the gate), and PR
    # #903's runs, provisioning in up to 15.3m, were cancelled mid-gate, as
    # dev ef129742ac was. 45m covers the slowest provisioning seen plus the
    # gate, with margin.
    timeout-minutes: 45
    name: ct-test release gate (M16 provider matrix)
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility ALL from
        # being readable inside private repos, so we mint per-run installation
        # tokens from the repo-local CI_TOKEN_PROVIDER_APP_ID +
        # CI_TOKEN_PROVIDER_PRIVATE_KEY secrets via the CI Token Provider App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
          # Do not leave the installation token in `.git/config` for the rest
          # of the job: these runners reuse their work tree. Nothing here needs
          # the persisted header -- `submodules:` is fetched by actions/checkout
          # before it strips the credential, and every later step that talks to
          # a remote is handed the token explicitly (`gh-token:`). Same reasoning
          # as the visual-replay gate; the long form is in that job.
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # The gate's last two suites are ViewModel tests under
        # src/frontend/viewmodel/, which build against ../isonim/src et al. via
        # codetracer's top-level config.nims. Same prerequisite as
        # `viewmodel-tests`, and like it this runs after ``Install Nix``
        # because the action reaches ``repro`` through this repo's dev shell.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Run the M16 ct-test release gate
        # The ct_test sources import runquota_process; the dev shell exports
        # RUNQUOTA_SRC (nix/shells/ci-base.nix) and src/ct_test/config.nims
        # turns that into the --path set, so no runquota sibling checkout is
        # needed here.
        run: nix develop .#devShells.x86_64-linux.default --command just test-m16-release-gate

  ct-test-providers:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # NO GREEN SAMPLE: 0 success in 46 records. Failures stop at step 6 of 11
    # (the provider gate itself), so 19.3m is a LOWER bound. 60m is ~3.1x it.
    timeout-minutes: 60
    name: ct-test cross-language provider gate
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs
          skip-token-revoke: false

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup dev env
        # ci/test/ct-providers.sh requires three recorder siblings checked out
        # at ../<repo> and builds each through its own pinned dev shell
        # (scripts/build-siblings.sh -> `direnv exec <repo> just build`). Without
        # them the script aborts in its very first suite, which is why it could
        # never simply be dropped into an existing job.
        #
        # setup-dev-env clones them adjacent to this checkout at
        # pinned `dev` refs — the same mechanism
        # `visual-replay-regression-gate` and `test-non-gui` already use, so
        # this is not new infrastructure. The trace-format / io-mon /
        # stackable-hooks / nim-shm-queue entries are the native recorder's own
        # build dependencies, mirroring the visual gate's sibling list.
        #
        # codetracer-native-backend is listed for the NATIVE RECORDER's sake,
        # not this job's: `build-siblings.sh` runs `just build-ct-mcr`, whose
        # `build-license-ffi` recipe opens with
        # `cd ../codetracer-native-backend && ...` to build `ct_license_ffi` out
        # of the backend checkout. Without it:
        #
        #   sh: line 1: cd: ../codetracer-native-backend: No such file or directory
        #   error: could not find `Cargo.toml` in `.../codetracer-native-recorder`
        #   error: Recipe `build-license-ffi` failed on line 123 with exit code 101
        #
        # The recipe `&&`-chains only its first link and uses `;` after, so the
        # failed `cd` does not abort it -- cargo just runs in the recorder root,
        # which has no root Cargo.toml, and the error names the wrong repo.
        #
        # A gap in this list, not in the lock: the recipe is byte-identical at
        # the last lock-pinned recorder revision (196f95c9, 2026-07-07) and at
        # today's `dev`, and neither revision has a root Cargo.toml, so the
        # lock-pinned build would have failed the same way. It stayed invisible
        # because this job could not get past `Setup dev env` to reach it.
        #
        # codetracer-visual-replay is here for the same reason, one layer on:
        # once the backend is present, `build-license-ffi` succeeds and the
        # build reaches `cd ct_cli && nimble build`, which imports
        # `gfx_stream/ctfs_visual` -- a module that lives in
        # codetracer-visual-replay/src/gfx_stream, not in the recorder:
        #
        #   ct_cli/src/ct_cli/extract_gfx_cmd.nim(39, 18)
        #     Error: cannot open file: gfx_stream/ctfs_visual
        #   error: Recipe `build-ct-mcr` failed on line 43 with exit code 1
        #
        # `visual-replay-regression-gate` already lists it. Same missing-sibling
        # class as the backend above, uncovered only because fixing the first
        # one let the build run far enough to hit the second.
        uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}
          siblings: |
            nim-everywhere=dev
            # codetracer-trace-format{,-nim} BY COMMIT, not `=dev`: the two halves of
            # the FFI pair are `/agents` inputs in flake.nix, and trace-format's `dev`
            # tip (051a298, 2026-09-30) predates the FileTable / PathTableKind API that
            # src/db-backend's ctfs_trace_reader has called since 2026-10-03, so a
            # sibling cloned at `dev` fails to compile. Full account and the refresh
            # rule: .github/actions/setup-db-backend-siblings/action.yml.
            codetracer-trace-format=2f01e602e70f69a04675293f3fa0d5bad9f196a1
            codetracer-trace-format-nim=3e50ca3f2bf6316e8f764952a84078cf59b11023
            io-mon=1365943692eedfb0699ce90e59c4602d90317561
            nim-shm-queue=0d6049997d77421b6e4748f819657cf6042e9508
            nim-shm-gset=803a4faa23f985ad9697437603436f2f784072be
            nim-stackable-hooks=07319306758cf608e664fe9e64ab7e0bed5ca186
            codetracer-native-recorder=95da3c1397cd62b9940ca91ce9109b7a61b228a9
            codetracer-js-recorder=6f699e3112484c6c73f7cf8d654e1f3106e76162
            codetracer-ruby-recorder=dev
            # codetracer-native-backend and codetracer-visual-replay BY COMMIT as well: both are
            # `/agents` inputs in flake.nix (7ab073a22), so `=dev` cloned a different tree than the
            # Nix lane builds. These are the revs flake.lock and repro.lock lock; refresh them with
            # the lock, as for the trace-format pair above.
            codetracer-native-backend=367e7164f43453513681807eeadb8797b6d5bcde
            codetracer-visual-replay=360a8131ec9fc81d0ebd1cdbd1743238218346af
            # nim-entrypoints and reprobuild BY COMMIT, for
            # src/ct_test/cs_m14_ct_test_collects_through_entry_test.nim: its
            # fixtures compile against nim-entrypoints' tests entry (`--run-exact`)
            # and against reprobuild's libs/ct_test_unittest_parallel with the
            # tests entry (reprobuild 72fc7fb8b or later). Both are the revisions
            # repro.lock records; reprobuild is also a flake input, so it is cloned
            # at the rev flake.lock locks (ci/test/sibling-input-branch-test.sh).
            # Move these lines with the lock.
            nim-entrypoints=d7edafaa9df1c7ae77d469754a463d4a512ec928
            reprobuild=37a109c4e1cf650e6eb79b11d9fadf6e49e64614

      - name: Allow direnv in the cloned recorder siblings
        # scripts/build-siblings.sh runs every sibling build as
        # `direnv exec <repo> …` so the repo's own flake pins its toolchain. A
        # freshly cloned .envrc is in direnv's "blocked" state, so without this
        # the build step fails (or silently falls back to the wrong PATH) —
        # the same hazard `test-non-gui` handles for codetracer-beam-recorder.
        run: |
          set -euo pipefail
          for sibling in codetracer-native-recorder codetracer-js-recorder codetracer-ruby-recorder; do
            nix develop .#devShells.x86_64-linux.default -c \
              direnv allow "${{ github.workspace }}/../${sibling}"
          done

      - name: Run the cross-language ct-test provider gate
        # No CT_PROVIDERS_ALLOW_MISSING / CT_PROVIDERS_SKIP_SIBLINGS: a missing
        # or unbuildable recorder must fail this job, not silently degrade the
        # recording assertions into checks of nothing.
        env:
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
          # libs/nim-result LAST: Nim gives the last --path precedence, and
          # without it `import results` finds libs/nim-stew/stew's legacy copy
          # (no `unsafeError`, a `func mapErr` nim-fork 2.3.1 refuses), as in
          # run 44384977215's regression gate. ct-build sets the same three.
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          # codetracer-native-recorder depends on the PRIVATE metacraft-labs/lldb-sys.rs.
          # Cargo's default libgit2 transport does not read gitconfig, so it never
          # presents the org-scoped extraHeader that `Setup dev env` installs job-wide
          # (GIT_CONFIG_KEY_0/VALUE_0/COUNT) and reports the resulting 401 as the
          # misleading "revision ... not found". Forcing the git CLI makes cargo use
          # that credential, exactly as the dmg-build and visual-replay lanes already do.
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: nix develop '.?submodules=1' --command just test-ct-providers

      - name: Upload sibling build logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: ct-test-providers-sibling-logs
          # scripts/build-siblings.sh captures each recorder build into
          # .tools/build-siblings-logs/<repo>.log (LOG_DIR in that script);
          # without them a sibling build failure reports only its exit code.
          path: .tools/build-siblings-logs/
          retention-days: 14
          if-no-files-found: ignore

  ct-test-certificates:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job
    # The bound is dominated by Nix setup and sibling provisioning, the same
    # setup `viewmodel-tests` does; the lane itself compiles and runs six small
    # Nim suites. Measured: the green run on dev 3266ab28aa (job 125610740352)
    # took 26 minutes, 12.5 provisioning and 11 in the lane. Runs on colder
    # runners spent 15.5 and 22 minutes provisioning (jobs 126332982114 and
    # the second run of PR #903) and were cancelled at the old 30m in the lane,
    # as dev's own run on ef129742ac was. 45m covers the slowest provisioning
    # seen plus the lane, with a margin.
    timeout-minutes: 45
    name: ct-test certificates and conformance vectors
    env:
      # A fixed nimcache root so the step after the lane can find the
      # conformance walker it built (ci/lib/run-nim-test-lane.sh, `cache_root`).
      CT_NIM_CACHE_ROOT: ${{ github.workspace }}/../ct-test-certificates-nimcache
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # libs/nim-result and libs/nim-stew are submodules the certificate
          # suites compile against.
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Clone test-certificates-spec sibling
        # The conformance-vector walker reads the standard's vectors at the
        # revision in src/ct_test/certificate_vectors.pin, with `git archive`
        # from this clone's OBJECT STORE -- never from its checkout. So the
        # ref here only has to be one whose history contains the pin: `latest`
        # does, and `clone-repo` makes a full (not shallow) clone. A pin the
        # clone lacks fails the lane by name; it is never skipped.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/test-certificates-spec
          ref: latest
          path: ${{ github.workspace }}/../test-certificates-spec
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-trace-format-nim sibling
        # certificate_issuance_test.nim reaches the CTFS reader through
        # `ct_test`'s incremental engine.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-trace-format-nim
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format-nim
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone runquota sibling
        # src/ct_test/process_exec.nim opens with `import runquota_process`,
        # and every certificate suite reaches it.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone nim-shm-gset sibling
        # io-mon's shim and CLI build on it (io-mon config.nims).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/nim-shm-gset
          ref: dev
          path: ${{ github.workspace }}/../nim-shm-gset
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        # Among them test-certificates-tools, the test-certificate reference
        # library `ct test` links (the local store's prune, HEAD protection and
        # owner check, the native root resolver) and the conformance walker
        # uses for note framing, at the revision repro.lock pins (the same one
        # flake.nix's `test-certificates-tools` input names: `repro lock
        # update test-certificates-tools` moves both).
        # Also io-mon, nim-stackable-hooks and nim-shm-queue:
        # certificate_untracked_reads_test.nim builds the io-mon CLI and interpose
        # shim from these siblings and captures a real read set with them (CTC-3g).
        # Without them the suite fails by name; it never skips.
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Run the ct-test-certificates lane
        # No CT_TEST_CERTIFICATE_VECTORS: setting it would walk an exported
        # tree UNPINNED, which is exactly what this job exists to rule out.
        run: nix develop .#devShells.x86_64-linux.default --command just test-ct-test-certificates

      - name: "`ct test run` from the Nix package's own bin/ (CTC-3i)"
        # The packaged `ct` is built --mm:refc and hands `ct test run` to the
        # ORC `ct-test` installed beside it. `ci/test/nix-package-ct-test-run.sh`
        # builds the package's `bin/` with the package's own build commands,
        # runs `ct test run` through the wrapped `ct` on a committed Go
        # fixture, and requires a published certificate that `ct test verify`
        # from the same `ct` reports as covering the worktree -- the
        # certificate this job's lane issues and verifies from the source
        # tree, issued instead from what a user installs. Needs nix, git, go
        # and python3, all in the default dev shell.
        if: ${{ !cancelled() }}
        run: nix develop .#devShells.x86_64-linux.default --command just test-nix-package-ct-test-run

      - name: Nim tracing from the Nix package and the AppImage layout
        # The desktop's Nim tracing needs a Nim language server and a
        # trace-enabled nimsuggest; the dev shell supplies both, an install
        # must ship them. `ci/test/packaged-nim-tracing.sh` takes the
        # environment the Nix package's `ct` wrapper and the AppImage's AppRun
        # give the desktop, and traces a Nim static block through the language
        # server they name, with no Nim tool on PATH.
        if: ${{ !cancelled() }}
        run: nix develop .#devShells.x86_64-linux.default --command just test-packaged-nim-tracing

      - name: Show the pinned conformance walk
        # The lane prints one headline per suite; this re-runs the walker the
        # lane already built, so the log names the pin it walked and its case
        # count. Runs after a red lane too, where it is the useful half.
        if: always()
        run: |
          set -euo pipefail
          walker="${CT_NIM_CACHE_ROOT}/ct-test-certificates-certificate_vectors_test/certificate_vectors_test"
          if [ ! -x "${walker}" ]; then
            echo "::error::the conformance walker was not built (${walker}); see the lane step"
            exit 1
          fi
          nix develop .#devShells.x86_64-linux.default --command "${walker}"

      - name: A wrong pin turns the walk red (negative control)
        # CTC-3a. A green walk shows the walker agrees with the vectors at the
        # pin; this shows the walk is BOUND to the pin, on every run: with the
        # walker the lane built, an earlier revision of the standard and a
        # revision the sibling lacks must each fail, by name, and the
        # committed pin must pass (the control). The pin file is restored on
        # every exit path. Reproduce locally with
        # `just test-certificate-vectors-wrong-pin <walker>`.
        if: ${{ !cancelled() }}
        run: nix develop .#devShells.x86_64-linux.default --command just test-certificate-vectors-wrong-pin

  docs-scope:
    # Does this run have any documentation to publish?
    #
    # WHY A JOB AND NOT A `paths:` FILTER. `paths:` only exists on the workflow
    # TRIGGER, and this workflow's `pull_request:` trigger drives the entire CI
    # matrix -- Linux, macOS and Windows builds and tests. Narrowing it to
    # `docs/**` would stop all of that from running on every non-docs pull
    # request. GitHub has no per-job `paths:`, so the filter has to be
    # evaluated inside the workflow.
    #
    # WHY A SEPARATE JOB AND NOT A FIRST STEP. A job-level `if:` is evaluated
    # before a runner is allocated; a step-level one is not. Deciding this in a
    # step would have every pull request occupy one of the six self-hosted
    # `eph-linux-x64` slots just to conclude it had nothing to do -- the same
    # waste `cla.yml` documents having had to fix. This job needs no Nix and no
    # checkout, so it runs on the free hosted class.
    runs-on: ubuntu-latest
    # 200-run window: 53 green, median 0.1m, max 0.7m. Pure path filtering.
    # 15m is the floor and is ~20x the slowest green.
    timeout-minutes: 15
    if: ${{ !github.event['codetracer-ci'] }}
    permissions:
      # Read-only: this job only asks which files a pull request touches.
      contents: read
      pull-requests: read
    outputs:
      publish: ${{ steps.scope.outputs.publish }}
    steps:
      - name: Decide whether the docs channel has anything to publish
        id: scope
        uses: actions/github-script@v7
        with:
          script: |
            // A branch deploy republishes its channel unconditionally: the
            // published site must match the branch even when the change that
            // moved it was, say, a theme token in a sibling repo.
            if (context.eventName !== 'pull_request') {
              core.info(`event '${context.eventName}': a branch deploy always publishes its channel`);
              core.setOutput('publish', 'true');
              return;
            }
            // The docs preview is built from `docs/` by `ci/deploy/docs.sh`.
            // A change to the deploy script itself counts: it is the thing
            // that decides what the published tree looks like.
            const isDocs = (name) =>
              name.startsWith('docs/') || /^ci\/deploy\/docs[-.a-z]*\.sh$/.test(name);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const touched = files.map((f) => f.filename).filter(isDocs);
            core.info(`${files.length} changed file(s), ${touched.length} of them documentation`);
            for (const name of touched.slice(0, 20)) core.info(`  ${name}`);
            // `listFiles` is capped at 3000 files per pull request, so beyond
            // that the answer is "we do not know". Fail toward publishing: a
            // preview nobody needed costs a build, a missing one costs a
            // reviewer their only look at the rendered change.
            if (files.length >= 3000 && touched.length === 0) {
              core.warning('the changed-file list is truncated at the API cap; publishing anyway');
              core.setOutput('publish', 'true');
              return;
            }
            core.setOutput('publish', touched.length > 0 ? 'true' : 'false');

  build-and-deploy-docs:
    needs: [ docs-scope ]
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # 200-run window: 14 green, median 4.5m, max 5.3m. 20m is ~3.8x the slowest
    # green; headroom is for the gh-pages push, which contends with its own
    # `docs-gh-pages-*` group below.
    timeout-minutes: 20
    # The docs site is INDEPENDENT content: it is built by its own isonim-docs
    # SSG consumer (docs/book-isonim via ci/deploy/docs.sh) and consumes NO
    # artifact from the app build or the attic-cache push. It must therefore not
    # be chained behind the cache push (which, as push-to-attic, needed the
    # full build/test matrix; it is cache-push.yml now) — otherwise any
    # unrelated app-CI failure silently blocks the docs deploy. Decoupled so the
    # docs publish on every push to a documentation branch regardless of
    # build/test status. The attic substituter set up in "Install Nix" is a
    # read-through cache that works whether or not cache-push.yml has
    # populated it.
    #
    # THREE PUBLISH CHANNELS, one job, chosen by the event and the branch
    # (`ci/deploy/docs.sh` derives the channel; see its header):
    #
    #   stable       -> docs.codetracer.com/          (the released book, plus /old)
    #   dev          -> docs.codetracer.com/nightly   (the integration book)
    #   pull request -> docs.codetracer.com/pr/<N>    (that PR's docs preview)
    #
    # `main` deliberately publishes nothing: the released docs now track
    # `stable`, so a `main` push must not overwrite them.
    #
    # WHY PREVIEWS ARE SAME-REPO ONLY.
    #
    # A `pull_request` run from a FORK gets a read-only `GITHUB_TOKEN` and no
    # secrets, by design, because the code it builds is written by whoever
    # opened the pull request. Publishing a preview from such a run would mean
    # executing attacker-controlled build code with a token that can write to
    # `gh-pages` -- the classic supply-chain hole. `pull_request_target` is NOT
    # the answer: it would hand that write token to exactly the same untrusted
    # code. (`cla.yml` uses `pull_request_target` safely because it never
    # checks out or runs the pull request's code; this job does both.)
    #
    # So fork pull requests get NO preview and NO explanatory comment. The
    # comment is not withheld out of preference -- with a read-only token this
    # job cannot post one either, and the whole job is gated off before a
    # runner is even allocated. Reviewers of a fork PR read the diff, as they
    # did before previews existed.
    #
    # `head.repo.full_name` is the fork test: on a same-repo pull request it
    # equals the repository, and it is the value GitHub itself uses to decide
    # whether to issue a write token.
    #
    # `needs.docs-scope.outputs.publish` is the "only when the docs actually
    # change" gate: on a pull request it is false unless the diff touches
    # `docs/` or the deploy script, so such a run publishes nothing AND
    # comments nothing. On a branch push it is always true.
    if: >-
      ${{ !github.event['codetracer-ci'] &&
          needs.docs-scope.outputs.publish == 'true' && (
            github.ref == 'refs/heads/stable' ||
            github.ref == 'refs/heads/dev' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          ) }}
    # PER-CHANNEL concurrency groups, not one shared group.
    #
    # All channels commit to the same `gh-pages` branch, so a single shared
    # group looks safer at first glance -- no channel could ever race another.
    # It is not, once pull-request previews exist. GitHub keeps at most ONE
    # pending run per concurrency group and CANCELS any older pending one, so
    # with a shared group a `stable` deploy waiting behind a running preview
    # would be silently cancelled the moment a second preview queued behind it.
    # Busy pull-request days would quietly stop publishing the released docs.
    #
    # Per-channel groups keep the guarantee that actually matters -- a channel
    # never races ITSELF, so its own subtree is never written twice at once --
    # and hand the cross-channel case to the mechanism built for it: docs.sh
    # pushes fast-forward only, and re-fetches and re-applies its subtree when
    # it loses. That path is exercised by ci/test/docs-deploy-channels-test.sh.
    #
    # The preview group is keyed by PR NUMBER so the cleanup job in
    # docs-preview-cleanup.yml can join it: a cleanup must not overlap the same
    # PR's last preview publish, or the publish would resurrect the directory
    # the cleanup just removed.
    #
    # Never cancel in progress: a cancelled deploy leaves that channel a
    # release behind.
    concurrency:
      group: >-
        docs-gh-pages-${{
          github.event_name == 'pull_request'
            && format('pr-{0}', github.event.pull_request.number)
            || github.ref_name
        }}
      cancel-in-progress: false
    permissions:
      # `contents: write` publishes gh-pages. `pull-requests: write` posts the
      # single preview comment, and is the narrowest grant that can: GitHub has
      # no finer scope for "edit one comment". It is deliberately NOT a
      # separate job -- splitting one out would duplicate the whole nix +
      # sibling-checkout preamble, and this job already holds `contents:
      # write`, which is strictly the more powerful of the two.
      contents: "write"
      pull-requests: "write"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Check out sibling repos for the isonim-docs SSG build
        # The docs are now built by the isonim-docs SSG consumer at
        # docs/book-isonim/ (see ci/deploy/docs.sh), whose config.nims
        # `--path`-switches to sibling checkouts laid out one level above this
        # repo (book-isonim/../../../<repo>): isonim, isonim-docs,
        # nim-everywhere, nim-faststreams, nim-stew. actions/checkout can only
        # write inside the workspace, so clone each sibling next to the
        # codetracer checkout with the cross-repo installation token minted
        # above. This mirrors isonim-docs/.github/workflows/ci.yml's
        # sibling-checkout layout (adjusted for book-isonim's extra depth).
        #
        # Sibling revisions default to each repo's default branch, matching
        # the isonim-docs CI convention; if/when isonim-docs joins the
        # workspace-lock cross-repo CI, these should move to pinned-lock
        # resolution instead.
        env:
          SIBLING_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          for repo in isonim isonim-docs nim-everywhere nim-faststreams nim-stew codetracer-design-system; do
            dest="${GITHUB_WORKSPACE}/../${repo}"
            rm -rf "$dest"
            git clone --depth 1 \
              "https://x-access-token:${SIBLING_TOKEN}@github.com/metacraft-labs/${repo}.git" \
              "$dest"
          done

      - name: Run the book's suites (just test-book-isonim)
        # The book's own tests -- navigation, the CLI reference's pinned facts
        # (the `ct test` section among them), links -- against the siblings
        # checked out above. Before the publish, so a book whose tests are red
        # is not published, and on every pull request that changes `docs/`
        # (the `docs-scope` gate above), the promotion pull request included.
        # CT_BOOK_ISONIM_REQUIRED makes a missing isonim-docs sibling a
        # failure here rather than the recipe's local "skip".
        env:
          CT_BOOK_ISONIM_REQUIRED: "1"
        run: nix develop .#devShells.x86_64-linux.default --command just test-book-isonim

      - env:
          # docs.sh reads AND pushes gh-pages with this (the job's GITHUB_TOKEN +
          # the contents:write permission above) -- the same reliable mechanism
          # the isonim/isonim-docs docs deploys use. It is now used for both
          # directions: the script fetches the current gh-pages so it can leave
          # the OTHER channel's subtree in place, then pushes its own subtree on
          # top (fast-forward, never `--force`). The old origin+CODETRACER_PUSH_
          # GITHUB_TOKEN path failed auth ("Authentication failed for .../codetracer").
          #
          # `origin` is deliberately NOT re-pointed at a credentialed URL here.
          # docs.sh only reads `origin` in its DEPLOY_TOKEN-absent fallback
          # (`ci/deploy/docs.sh`, the `REMOTE` resolution before the publish
          # step), and DEPLOY_TOKEN is always set on this step -- so the
          # rewrite could never be the credential that pushed, it could only
          # expand a long-lived PAT into `.git/config` on a self-hosted runner
          # that reuses its workspace. This is a category-1 push (the
          # workflow's own public repo), and the policy credential for that is
          # the token Actions already provides.
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # docs.sh derives the channel from the event and the branch; on a
          # pull request it needs the number that names the `/pr/<N>` subtree.
          # Passed explicitly rather than parsed out of GITHUB_REF so the
          # published path comes from the event payload GitHub itself
          # populated.
          DOCS_DEPLOY_PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config init.defaultBranch main

          nix develop .#devShells.x86_64-linux.default --command ./ci/deploy/docs.sh

      - name: Link the preview from the pull request
        # Only on a pull request, and only after the publish above succeeded --
        # a link posted for a preview that was never published is worse than no
        # link, because it looks authoritative and 404s.
        #
        # The comment is edited in place on every subsequent push (see
        # ci/deploy/docs-preview-comment.sh), so a long pull request ends with
        # exactly one preview comment rather than one per push. It names the
        # head commit so a reviewer can tell whether what they are looking at
        # includes the push they just made.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The pull request's own head, NOT `github.sha`: on a `pull_request`
          # event `github.sha` is the ephemeral merge commit, which exists
          # nowhere the reviewer can see it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          nix develop .#devShells.x86_64-linux.default --command \
            ./ci/deploy/docs-preview-comment.sh published \
            "$PR_NUMBER" "https://docs.codetracer.com/pr/${PR_NUMBER}/" "$HEAD_SHA"

  push-tag:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # 200-run window: only 2 green (1.5m, 1.6m) -- a thin sample, but the job is a
    # single annotated-tag push. 15m is ~9x the slower of the two.
    timeout-minutes: 15
    needs: [ dev-build, nix-build, appimage-build, dmg-build ]
    permissions:
      contents: "write"
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix and configure private repository authentication
        # The shared action keeps the Git credential in job-scoped headers,
        # scoped to our organization, and removes stale token-bearing rewrites
        # from reused runner homes. Keep checkout's credentials above: the tag
        # push authenticates through its repository-local header.
        uses: metacraft-labs/metacraft-github-actions/setup-nix@a190f3a8b37c5a239d88b8c964b6d13f64fbaa0d
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}
          token-owner: metacraft-labs
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Create tag
        if: ${{ github.ref == 'refs/heads/main' }}
        id: tag
        run: |
          YEAR=$(bash -c 'grep "CodeTracerYear\*" src/ct/version.nim | sed "s/.*CodeTracerYear\* = //g"')
          MONTH=$(bash -c "printf '%02d' \$(grep \"CodeTracerMonth\*\" src/ct/version.nim | sed \"s/.*CodeTracerMonth\* = //g\")")
          BUILD=$(bash -c 'grep "CodeTracerBuild\*" src/ct/version.nim | sed "s/.*CodeTracerBuild\* = //g"')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config init.defaultBranch main

          # `origin` is deliberately NOT re-pointed at a credentialed URL.
          #
          # It used to be, at `CODETRACER_PUSH_GITHUB_TOKEN` -- a long-lived
          # PAT, and the last rotation-bearing GitHub credential in this
          # workflow. That userinfo could never be the credential that pushed.
          # The `Checkout` step above runs with `persist-credentials` at its
          # default of true, so actions/checkout leaves
          # `http.https://github.com/.extraheader` in `.git/config` carrying
          # the App installation token, and Git prefers a configured
          # Authorization header over userinfo in the remote URL.
          #
          # That preference is total, not merely a first choice, which is what
          # makes deleting the line safe rather than a gamble. Against a server
          # that answers 401, `git push` retries with the SAME header and then
          # gives up; the userinfo is never put on the wire at all, so it is not
          # a fallback either. (Reproducible without any real credential: point
          # a checkout at a local HTTP server with both an `extraHeader` and
          # userinfo configured, and read the `Authorization` it receives.)
          #
          # So the App token was already performing this push, and removing the
          # rewrite changes which credential authenticates not at all -- it only
          # stops expanding a PAT into `.git/config` on a self-hosted runner
          # that reuses its workspace. `persist-credentials` must therefore STAY
          # enabled on the checkout above: here the persisted header is
          # load-bearing, which is the opposite of the situation in most jobs.
          #
          # VERIFIED 2026-08, for whoever runs the next release. The
          # metacraft-labs-ci-token-provider App installation (app id 3115338)
          # carries `contents: write` at the org level -- confirmed against
          # `GET /orgs/metacraft-labs/installations`. `create-github-app-token`
          # is called above with no `permissions:` input, so the minted token
          # inherits the installation's full permission set, contents:write
          # included, and the persisted `extraheader` push below authenticates
          # with it. If the tag push nonetheless 403s, re-check that permission
          # set (it may have been narrowed) rather than reintroducing a PAT --
          # the old PAT was already inert and restoring it would not help.
          git tag -a "$YEAR.$MONTH.$BUILD" -m "Release $YEAR.$MONTH.$BUILD" || echo "Tag already exists"
          (git push origin "$YEAR.$MONTH.$BUILD" && echo "tag=$YEAR.$MONTH.$BUILD" >> $GITHUB_OUTPUT) || echo "Tag already exists"

  create-release:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-002
    # NO SAMPLE OF ANY KIND: 0 success, 0 failure, 7 zero-length cancellations --
    # it is tag-gated and never started in the window. 30m is structural, not
    # measured: `gh release create` plus upload of the artefacts `push-tag`'s
    # ancestors already built.
    timeout-minutes: 30
    needs: [ push-tag ]
    if: ${{ ((startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')) || needs.push-tag.outputs.tag != '') && !github.event['codetracer-ci'] }}
    permissions:
      contents: "write"
    steps:
      - name: Mint installation token for cross-repo sibling access
        # GitHub free plan restricts org-level secrets with visibility
        # ALL from being readable inside private repos, so we mint
        # per-run installation tokens from the repo-local
        # CI_TOKEN_PROVIDER_APP_ID + CI_TOKEN_PROVIDER_PRIVATE_KEY
        # secrets via the CI Token Provider GitHub App.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci_token.outputs.token }}
      - name: Install Nix and configure private repository authentication
        # The shared action keeps the Git credential in job-scoped headers,
        # scoped to our organization, and removes stale token-bearing rewrites
        # from reused runner homes before the release's Nix commands run.
        uses: metacraft-labs/metacraft-github-actions/setup-nix@a190f3a8b37c5a239d88b8c964b6d13f64fbaa0d
        with:
          gh-token: ${{ steps.ci_token.outputs.token }}
          token-owner: metacraft-labs
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: "Import GPG key for signing commits"
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.CODETRACER_AUR_GPG_PRIVATE_KEY_PASS }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: Create resource tarball
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c "tar cfJ resources.tar.xz resources/"
          nix develop .#devShells.x86_64-linux.default --command bash -c "gpg --detach-sign resources.tar.xz"
      - name: Promote the just-built artifacts to the release tag
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CODETRACER_BUCKET_ACCESS_KEY }}
          ENDPOINT: ${{ secrets.R2_CODETRACER_BUCKET_S3_ENDPOINT }}
          BUCKET: ${{ vars.R2_CODETRACER_BUCKET_NAME }}
          TAG: ${{ needs.push-tag.outputs.tag }}
        run: |
          set -euo pipefail

          # PROVENANCE: promote the exact bytes this run's appimage-build and
          # dmg-build just wrote to R2 under the CodeTracer-main-* keys. Earlier
          # this step re-fetched them from the downloads.codetracer.com CDN with
          # wget -- but that CDN is a public cache in front of the bucket: it can
          # still be serving a previous build's bytes when this job runs, or a
          # neighbouring push to `main` can have overwritten the pointer, so the
          # tag could be cut from artifacts that were never built for it. Reading
          # straight from the authenticated bucket removes that gap: the source
          # of truth, not a cache of it.
          aws_cmd() {
            nix develop .#devShells.x86_64-linux.default --command \
              aws --endpoint-url="$ENDPOINT" "$@"
          }

          for f in CodeTracer-main-arm64.dmg CodeTracer-main-arm64.dmg.asc \
                   CodeTracer-main-amd64.AppImage CodeTracer-main-amd64.AppImage.asc; do
            aws_cmd s3 cp "s3://$BUCKET/$f" "$f"
          done

          # A tag artifact must be the SIGNED artifact. The release GPG key was
          # imported above (import-gpg), so its public half is in the keyring;
          # verify each detached signature against the bytes we are about to
          # publish before we publish them. A bad or missing signature fails the
          # release rather than shipping unverifiable bytes under a version tag.
          nix develop .#devShells.x86_64-linux.default --command \
            gpg --verify CodeTracer-main-arm64.dmg.asc CodeTracer-main-arm64.dmg
          nix develop .#devShells.x86_64-linux.default --command \
            gpg --verify CodeTracer-main-amd64.AppImage.asc CodeTracer-main-amd64.AppImage

          promote() { # promote <local-file> <dest-suffix>
            aws_cmd s3 cp "$1" "s3://$BUCKET/CodeTracer-$2" --checksum-algorithm CRC32
          }
          for slot in "$TAG" latest; do
            promote CodeTracer-main-arm64.dmg          "$slot-arm64.dmg"
            promote CodeTracer-main-arm64.dmg.asc      "$slot-arm64.dmg.asc"
            promote CodeTracer-main-amd64.AppImage     "$slot-amd64.AppImage"
            promote CodeTracer-main-amd64.AppImage.asc "$slot-amd64.AppImage.asc"
          done

          # Windows installer (CodeTracer-latest-win-x64.exe, consumed by
          # https://get.codetracer.com/pwsh). windows-installer-build /
          # windows-installer-publish upload CodeTracer-main-win-x64.exe(.asc)
          # when they run on `main`. That leg needs the eph-win-x64 GARM runner;
          # while that fleet is down the key is simply absent, so this promotion
          # is TOLERANT: it publishes the win artifact when present and skips it
          # (without failing the release) when it is not. The moment a Windows
          # build lands the key, the next release promotes it with zero further
          # changes.
          if aws_cmd s3 cp "s3://$BUCKET/CodeTracer-main-win-x64.exe" CodeTracer-main-win-x64.exe \
             && aws_cmd s3 cp "s3://$BUCKET/CodeTracer-main-win-x64.exe.asc" CodeTracer-main-win-x64.exe.asc; then
            nix develop .#devShells.x86_64-linux.default --command \
              gpg --verify CodeTracer-main-win-x64.exe.asc CodeTracer-main-win-x64.exe
            for slot in "$TAG" latest; do
              promote CodeTracer-main-win-x64.exe     "$slot-win-x64.exe"
              promote CodeTracer-main-win-x64.exe.asc "$slot-win-x64.exe.asc"
            done
          else
            echo "::warning::CodeTracer-main-win-x64.exe not found in R2 — skipping the Windows installer for this release (eph-win-x64 build not yet published)."
          fi

      - name: Get changelog text
        id: changelog
        run: |
          nix develop .#devShells.x86_64-linux.default --command bash -c "awk '/^## /{if (p) exit; p=1} p' CHANGELOG.md > release_changelog.md"
          echo "\

          We're actively working on multiple exciting features, which are not fully released yet. Stay tuned!

          Available downloads:

          <a href="https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg"><img width="75px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/1/1b/Apple_logo_grey.svg"></a>
          <a href="https://deb.metacraft-labs.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/9/9e/UbuntuCoF.svg"></a>
          <a href="https://deb.metacraft-labs.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/6/66/Openlogo-debianV2.svg"></a>
          <a href="https://rpm.metacraft-labs.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/d/d8/Red_Hat_logo.svg"></a>
          <a href="https://rpm.metacraft-labs.com/"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/3/3f/Fedora_logo.svg"></a>
          <a href="https://github.com/metacraft-labs/metacraft-overlay"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/4/48/Gentoo_Linux_logo_matte.svg"></a>
          <a href="https://aur.archlinux.org/packages/codetracer"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/1/13/Arch_Linux_%22Crystal%22_icon.svg"></a>
          <a href="https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-amd64.AppImage"><img width="100px" height="100px" src="https://upload.wikimedia.org/wikipedia/commons/7/73/App-image-logo.svg"></a>

          Key signatures:

          [![Download macOS Signature](https://img.shields.io/badge/Download-macOS%20Signature-blue?style=for-the-badge)](https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-arm64.dmg.asc)
          [![Download AppImage Signature](https://img.shields.io/badge/Download-AppImage%20Signature-blue?style=for-the-badge)](https://downloads.codetracer.com/CodeTracer-${{ needs.push-tag.outputs.tag }}-amd64.AppImage.asc)
          [![Download PGP Key](https://img.shields.io/badge/Download-PGP%20key-blue?style=for-the-badge)](https://downloads.codetracer.com/CodeTracer.pub.asc)" >> release_changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: "release_changelog.md"
          draft: true
          prerelease: false
          files: |
            resources.tar.xz
            resources.tar.xz.asc
          generate_release_notes: false
          tag_name: "${{ needs.push-tag.outputs.tag }}"

  queue-watchdog:
    # Alarm, not a gate: is anything actually SERVICING this run?
    #
    # `ci-verdict` below answers "did the required jobs run?", and answers it
    # correctly -- but it cannot answer at all until every job it declares
    # `needs:` on has reached a conclusion. A job that never gets a runner
    # never reaches one: it does not fail and it does not finish, it sits
    # `queued` until GitHub cancels it at the 24-hour ceiling. Neither GitHub
    # timer covers that state -- the 24h limit applies to a job WAITING for a
    # runner, `timeout-minutes` to a job that has STARTED -- so the verdict
    # lands about a day after the push, and for that whole day "nothing is
    # servicing this run" is indistinguishable from "CI is still thinking".
    # The `ci-verdict` header has to warn readers not to read a missing
    # verdict as a passing one; this job is what puts a deadline on that
    # warning.
    #
    # It declares NO `needs:`, so it starts in the first scheduling wave and
    # is watching before there is anything to watch. Nothing declares `needs:`
    # on it and it is deliberately absent from ci/verdict/required-jobs.txt:
    # like `workspace-lock-freshness`, it must be loud and structurally
    # incapable of cascading. An alarm that can skip a test job would be a
    # worse defect than the one it reports.
    #
    # WHAT IT IS NOT. It is NOT a "does a runner exist for label X?" precheck,
    # because that is not implementable against this org:
    # `/orgs/{org}/actions/runner-scale-sets` answers 404, and scale-set
    # runners appear in `/orgs/{org}/actions/runners` with an EMPTY `labels`
    # array -- so comparing `runs-on:` labels against registered runner labels
    # would declare healthy job classes unserviceable and cry wolf on every
    # run. This watches the run's own observed behaviour instead, which needs
    # no runner introspection and no permission beyond reading its own run.
    #
    # Stock ubuntu-latest, bash + jq + the preinstalled gh CLI: a watchdog
    # must not share the
    # failure mode it watches for. If this needed a self-hosted runner, a run
    # starved of self-hosted runners would starve the watchdog too, and it
    # would fall silent at exactly the moment it is meant to speak.
    #
    # PULL REQUESTS ONLY, and this is a deliberate narrowing rather than
    # timidity about the alarm.
    #
    # The fleet is capped hard enough that `RUNNING == 0 && QUEUED > 0` holds
    # for long stretches on `dev` right now -- five of five sampled in-flight
    # `dev` runs satisfied it, the oldest for ~22 hours. Left ungated, this job
    # would go red on every mainline push, 5-6 times a day, reporting the same
    # true fact with no way to acknowledge it and no way to clear it. A red row
    # that is always red stops being read, and then the next genuinely new red
    # row is not read either. That is the failure mode this whole campaign is
    # about, so an alarm must not become an instance of it.
    #
    # On a pull request the same signal is actionable: someone is waiting on
    # the result and can act on "no runner is servicing this". So the alarm
    # keeps its teeth exactly where a human is listening.
    #
    # This does NOT mute it on starved PR runs -- it will still fire there, by
    # design, because that is a report worth making. What it drops is the
    # standing mainline red for a fleet condition that is already known and
    # separately tracked.
    #
    # When fleet capacity is restored, removing this line is the whole of the
    # work needed to put the alarm back on `dev`.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The jobs API of this run. The workflow's top-level grant is
      # `contents: read` only, so this must be named here or every poll 403s
      # and the watchdog retries forever without ever reaching a verdict.
      actions: read
    # Must exceed --deadline-minutes, or the job is killed before it can
    # report. It exits as soon as nothing is queued, so a healthy run releases
    # this runner early rather than holding it for the ceiling.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Self-test the queue watchdog
        # Same rule as `ci-verdict`'s self-tests: a gate is only worth trusting
        # if its own contracts hold, and they are checked on every run against
        # fixtures captured from the real starved runs it was built for.
        run: bash ci/verdict/queue-watchdog-test.sh

      - name: Fail if nothing is servicing this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash ci/verdict/queue-watchdog.sh --poll \
            --deadline-minutes 30 --interval-seconds 30

  ci-contract-suites:
    # The static contract suites that used to sit INSIDE `ci-verdict`, ahead of
    # its verdict step.
    #
    # WHY THEY MOVED. `ci-verdict` answers one question -- "did the required
    # jobs actually run?" -- and that answer is the thing every other gate in
    # this repo is read through. It used to answer it in its FOURTEENTH step,
    # behind thirteen unrelated self-tests. Any one of them exiting non-zero
    # ended the job before the verdict step, and GitHub then showed
    # `ci-verdict` red with no verdict in it at all. A red `ci-verdict` was
    # therefore ambiguous between "a required job did not run" -- the alarm --
    # and "the docs-preview comment suite is broken", which has nothing to do
    # with it. During that window the campaign was reading a missing verdict as
    # an ordinary red, which is precisely the "checks that pass by not running"
    # failure this whole effort exists to eliminate, turned inside out.
    #
    # None of these suites needs the `needs:` list, and none of them informs
    # the verdict. They are static checks over this workflow file and over
    # scripts in `ci/` and `tools/`. Given a job of their own they start in the
    # FIRST scheduling wave rather than after every build and test lane has
    # concluded, so a workflow-shape defect is now reported in about a minute
    # instead of at the end of the run -- or, on a run whose Windows lane
    # queues for hours, not at all.
    #
    # NOTHING declares `needs:` on this job and it is deliberately absent from
    # `ci/verdict/required-jobs.txt`: like `workspace-lock-freshness` and
    # `queue-watchdog`, it must be loud and structurally incapable of cascading
    # into a skipped test job.
    #
    # Stock ubuntu-latest, and that is load-bearing rather than incidental --
    # every suite below is chosen for needing nothing but bash, git, coreutils,
    # node or python3. A watchdog must not share the failure mode it watches
    # for; if these needed the dev shell, the outages they report would take
    # them down too.
    #
    # EVERY SUITE RUNS, AND THE JOB FAILS AT THE END. Each step after the
    # checkout carries `if: !cancelled() && steps.checkout.outcome ==
    # 'success'`, so a failing suite does not skip the ones after it; the job
    # is still red when any step failed. Without it the job stopped at the
    # first red suite: from 2026-09-20 the Windows-runner suite failed on every
    # run (it selected jobs by a retired runner label), and the sibling-
    # provisioning suite behind it went unread while it drifted from the lock
    # (codetracer-pm issues/2026-10-22-ci-contract-suites-recognise-windows-
    # jobs-by-a-retired-runner-label.md). Gated on the checkout, because with
    # no checkout every suite would fail for that one reason. A new step here
    # takes the same `if:`.
    if: always()
    runs-on: ubuntu-latest
    # 200-run window: 20 green, median 0.6m, max 0.8m. Shell self-tests only.
    # 15m is the floor, ~19x the slowest green.
    timeout-minutes: 15
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5
        with:
          # Same reasoning as `ci-verdict`: no step here talks to a git remote
          # after the checkout, and these runners reuse their work tree.
          persist-credentials: false
          submodules: false

      # sibling-provisioning-test.sh checks that the git-auth pin in
      # provision-repro-lock-siblings names a commit of metacraft-github-actions
      # that carries the action, against a checkout beside this one, and fails
      # when there is none. The repository is public, so a plain clone needs no
      # credential; actions/checkout cannot write outside the workspace. A full
      # clone, because the pin need not be on the default branch.
      - name: Clone metacraft-github-actions beside the checkout
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          rm -rf ../metacraft-github-actions
          git clone --quiet https://github.com/metacraft-labs/metacraft-github-actions ../metacraft-github-actions

      - name: Assert the Windows lane provisions its own git and bash
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # The eph-win-x64 image ships neither; five of the six Windows jobs
        # did not run the bootstrap that supplies them, and the lane failed
        # in three places that looked unrelated. This is a static contract
        # over this workflow file, so it can be enforced from a Linux runner
        # -- which matters, because the Windows lane had no signal at all
        # for the months this went unnoticed.
        run: bash ci/test/windows-runner-bootstrap-test.sh

      - name: Assert the Windows dev-deps root degrades to somewhere writable
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # Every eph-win-x64 job died in Ensure-Ttd with "Access to the path
        # 'D:\metacraft-dev-deps\ttd' is denied", because env.ps1 read
        # "D:\ exists" as "there is a writable dev drive here". On these
        # guests D: is the cloudbase-init config drive: a read-only CDFS
        # volume. A runner must not fail for want of an optional performance
        # feature. Static, so a Linux runner can hold the line -- the same
        # reason the git/bash contract above lives here.
        run: bash ci/test/windows-install-root-test.sh

      - name: Assert every job's sibling checkout is self-sufficient
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # Two halves of one contract, both static checks over this workflow
        # file, so they run here from a stock runner where they cannot be
        # taken down by the outages they watch for.
        #
        # WHICH REF: a bare `siblings:` entry resolves its revision from a
        # workspace lock. Until 2026-09-30 that was a per-commit record in
        # metacraft-labs/metacraft-manifests, which stopped receiving records
        # for this repo on 2026-08-02: six jobs died in their first real step
        # for eight days because of it, and nine more were reported `skipped`
        # in consequence -- the state the verdict step below exists to name.
        # Since reprobuild-specs Unified-Locking-And-Hooks.md §14.5 it is this
        # commit's committed `repro.lock`. The contract treats a bare entry as
        # the good shape and holds the branch-tip (`=dev`) entries under a
        # shrink-only ceiling; the `workspace-lock-freshness` job checks that
        # the lock pins every bare one.
        #
        # WHICH CREDENTIAL: one org-scoped installation token per job, minted
        # from the per-repo secret. The org-variable form of the app id
        # resolves only because this repo is public and evaluates to the empty
        # string anywhere else; a job that minted two tokens made it ambiguous
        # which one a step used; and an unresolved `steps.*.outputs.token`
        # silently becomes an empty token rather than an error.
        run: bash ci/test/sibling-provisioning-test.sh

      - name: Assert every sibling on the Nim search path is pinned by repro.lock
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # config.nims put nim-agents-isonim-viewmodels on the search path while
        # repro.nim and repro.lock did not name it, so no lane provisioned it
        # and the StoryBook bundle failed to compile in every fresh checkout.
        # Static over the Nim config files and the lock.
        run: bash ci/test/nim-config-siblings-pinned-test.sh

      - name: Assert the WebAssembly recording fixture lane stays required
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash ci/test/wasm-recordings-ci-test.sh

      - name: Assert every capture lane types through ci/test/wtype-keys.sh
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # A bare `wtype` call can lose its first key while the client is still
        # taking the new virtual keyboard's keymap: the VCS off-loop capture's
        # keys never reached its window. The helper primes the keyboard first.
        run: bash ci/test/wtype-keys-guard-test.sh

      - name: Assert ct-instrument is found wherever cargo put it
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # test-non-gui's build of the instrumenter sibling, and the recording
        # materializer that consumes it, both looked only in the sibling's
        # own target/ while the self-hosted runners' CARGO_TARGET_DIR sent
        # cargo's output elsewhere. Static over the workflow step, plus the
        # real materializer run up to its prerequisite gate.
        run: bash ci/test/ct-instrument-target-dir-test.sh

      - name: Assert every job in this workflow declares a timeout
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # A third static check over this same file, here for the same reason as
        # the two above: it needs no runner and no siblings, so it must not sit
        # behind either.
        #
        # WHAT IT CAUGHT. On 2026-09-06 THIRTY of this file's forty-two jobs
        # declared no `timeout-minutes` and inherited GitHub's 360-minute
        # default. Twenty-five of the thirty ran on SELF-HOSTED runners --
        # every build-artefact job and all four lint lanes -- against a GARM
        # pool measured at fourteen runners, twelve busy, two offline. A hung
        # job there does not idle; it strands a scarce machine for six hours
        # and holds this workflow's concurrency group while doing it.
        #
        # The gap is cheap to reopen, which is why it is checked rather than
        # merely fixed: adding a job requires actively remembering a key that
        # nothing else in the file demands, and the omission is silent until a
        # runner goes missing for an afternoon.
        #
        # The check does NOT judge whether a bound is well chosen -- that needs
        # the job's measured green duration, which is in the run history, not
        # the file. Each bound's reasoning is recorded on the job itself.
        run: python3 ci/verdict/job-timeouts.py .github/workflows/codetracer.yml

      - name: Self-test the job-timeout contract
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: bash ci/test/job-timeouts-test.sh

      - name: Jobs that run a launcher suite build the launcher first
        # `tui-tests` ran two suites that execute `../codetracer-launcher/out/
        # launcher` and neither cloned nor built it, so they judged whatever an
        # earlier job left on a persistent runner and failed on an ephemeral one
        # (codetracer-pm issues/2026-11-09-tui-job-runs-launcher-suites-without-
        # building-the-launcher.md). This suite reads every job's lanes from the
        # justfile and `ci/lib/test-lane-files.sh` and fails a job that runs a
        # launcher suite without a lock-pinned clone and a build before it.
        # python3, PyYAML and bash, like `job-timeouts.py` above.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ci/test/launcher-suites-build-launcher-test.py

      - name: A long build's dev shell is GC-rooted for the job
        # `nix develop --command` roots nothing while the command runs; a host
        # collecting below min-free deleted Nim's lib/ under a build (macOS
        # m3-mcl-001, run 43935388749). python3 and PyYAML, as above.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ci/test/dev-shell-gcroot-test.py

      - name: Late git fetches use a token minted late
        # An installation token lives an hour; clones that followed sibling
        # provisioning or a nix build with the job's first token failed with
        # "Invalid username or token" (run 43996043232). Also: no job that
        # registers the credential helper sets an extraHeader after it.
        # python3 and PyYAML.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ci/test/late-clone-token-test.py

      - name: Jobs that run a native rr-recording suite set rr up and build ct-native-replay first
        # `tui-tests` ran PLAT-60's terminal Low Level Code suite, which records
        # a native program under rr and replays it through `ct-native-replay`,
        # on hosts where rr does not work and with nothing building that binary,
        # so it skipped every case and failed its lane (codetracer-pm
        # issues/2026-11-09-tui-job-runs-plat60-and-plat65-without-their-
        # prerequisites.md). Such suites are now the `tui-native` lane, run by
        # `test-ui-tests-rr`. This suite reads every job's lanes from the
        # justfile and `ci/lib/test-lane-files.sh` and fails a job that runs a
        # suite importing `fixtures/native_recording` without
        # `ci/setup-rr-backend.sh` and a `ct-native-replay` build before it.
        # python3, PyYAML and bash, like the launcher suite above.
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ci/test/native-recording-suites-run-where-rr-is-test.py

      - name: Check every build-once job provisions the workspace the build needs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # The other end of the sibling contract. The suite above asks whether a
        # `siblings:` entry is PINNED reproducibly; this one asks whether the
        # list is COMPLETE for a job that compiles the desktop core.
        #
        # `just build-once` runs `scripts/require-siblings.sh` before anything
        # else and refuses a workspace missing any of nine repos. A workflow can
        # therefore be perfectly pinned and still unable to start a build --
        # which is what `launcher-recorder-e2e` was from the day it was written:
        # it provisions the three repos the GATE spans, asks for a core that
        # needs eleven, and failed on all three matrix arms identically, 0.45
        # seconds in, with no compiler ever started. Nothing there was
        # language-specific and nothing was wrong with the lock.
        #
        # It is a static property of the workflow file, so it belongs in this
        # bash-only lane rather than in a forty-minute queue on a self-hosted
        # runner. The suite also EXECUTES the preflight against a throwaway repo
        # built to reproduce the CI condition, because the same gate's refusal
        # was invisible for a day: a `grep -c` counting zero exits 1, and under
        # `set -euo pipefail` that killed the script before it printed a word.
        run: bash ci/test/build-once-workspace-test.sh

      - name: Assert a workflow lane reaches every recipe that must run in CI
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # `just test-tui` and `just test-tui-real-terminal` are the only routes
        # to the TUI's two Nim lanes, and no workflow called either: every
        # guard stayed green, because none of them has recipes as its subject
        # (codetracer-pm issues/2026-11-01-no-ci-lane-calls-the-test-tui-
        # recipes.md). This suite reads the recipe set `shell-gate-coverage.sh`
        # already walks from the workflows and fails, by name, on any recipe
        # listed in `ci/test/ci-reached-recipes.txt` that is not in it -- with a
        # negative control that deletes the workflow steps from a copy of the
        # tree and requires each listed recipe to be reported unreached.
        # Static, bash and coreutils only, about a minute.
        run: bash ci/test/ci-reached-recipes-test.sh

      - name: Check the launcher<->recorder gate's cross-repo workflow wiring
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # The other half of the same class of defect, reached from the
        # `workflow_call` side. `actionlint` does not check a caller's `with:`
        # against a reusable workflow's declared `inputs:`, so a misspelled key
        # that ALSO leaves a required input unpassed lints clean and only fails
        # when a self-hosted runner eventually picks the job up. This suite is
        # that missing check, and it additionally RUNS the reusable workflow's
        # "Plan the workspace layout" script under each caller's
        # `github.repository` to prove the triggering repo is never handed to
        # `clone-siblings` as its own sibling -- which would `rm -rf` the
        # primary checkout mid-run, a defect this gate has already had once.
        # Stock bash, no network; it checks the three remote callers when their
        # sibling checkouts are present and says so when they are not.
        run: bash ci/test/launcher-recorder-e2e-workflow-test.sh

      - name: Check the PHP recorder downstream lane's workflow wiring
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # php-recorder-downstream.yml is called from codetracer-php-recorder
        # and runs only there, so nothing in this repo's CI would execute it.
        # This RUNS its plan step and its "predates this lane" refusal, checks
        # its single required input against the caller when that checkout is
        # present, and rejects mutations of the file. Stock bash, no network.
        run: bash ci/test/php-recorder-downstream-workflow-test.sh

      - name: Check the image-diff downstream lane's workflow wiring
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # image-diff-downstream.yml is called from codetracer-image-diff and
        # runs only there, so nothing in this repo's CI would execute it. This
        # RUNS its plan step and its "predates this lane" refusal, checks its
        # single required input against the caller when that checkout is
        # present, runs the driver's refusals that need no dev shell, and
        # rejects mutations of the file. Stock bash, no network.
        run: bash ci/test/image-diff-downstream-workflow-test.sh

      - name: Check that a failed sibling build shows its cause
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # scripts/build-siblings.sh and the launcher<->recorder driver used to
        # report a failed sibling build as "build exited 101 — see <log>", with
        # <log> a file on the runner that no step uploads. The ruby arm of run
        # 36013311965 failed with that and nothing else. Both now print the
        # tail of the failed repo's log; this suite runs the real script with a
        # stub `repro`/`just` and pins that, and that the failure stays fatal.
        # Stock bash, no network.
        run: bash ci/test/sibling-build-failure-test.sh

      - name: Check that test-frontend-units provisions the cross-process recording tools
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # cross_process_origin_vm_test replays the `cross-process-three-trace`
        # recording, which scripts/materialize-recording.sh produces from the
        # tree and refuses to produce without ct-instrument, session-manager
        # and a built codetracer-js-recorder. Nothing on the recipe's path
        # built them, and build-siblings.sh had no ct-instrument entry, so the
        # suite failed 3 of 4 cases on every unprovisioned host. This suite
        # runs the real build-siblings.sh and provisioning script with stub
        # `repro`/`cargo`/`npm`/`just`, and pins that a missing or unbuildable
        # sibling fails by name. Stock bash and jq, no network.
        run: bash ci/test/frontend-units-cross-process-provisioning-test.sh

      - name: Check that a stale sibling artifact is rebuilt, not skipped
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # scripts/build-siblings.sh decided "already built" from the artifact
        # merely EXISTING, so a sibling built against an older dependency was
        # reported `SKIP … already built` on every run forever. Observed: a
        # codetracer-js-recorder emitting meta.dat v3 while ct accepted only
        # v4/v5, with every recording spec then dying inside importTraceFolder
        # naming THE TRACE rather than the stale recorder. The script now
        # reuses an artifact only when its build stamp -- the sibling's and its
        # trace-format dependencies' HEADs and tracked modifications, the build
        # command, the artifact's sha256 -- matches. This suite runs the real
        # script against throwaway git repos and pins that a moved dependency,
        # an older checkout, a missing/corrupt stamp, a replaced artifact and
        # a failed build all lead to a rebuild that SAYS WHY -- and that an
        # unchanged one is still skipped, which is the control that stops
        # "always rebuild" passing. Stock bash and git, no network; its
        # builders are stubs.
        run: bash ci/test/sibling-artifact-freshness-test.sh

      - name: Check that a sibling is built with its own Nim, not codetracer's
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # scripts/build-siblings.sh put codetracer's nim/nimble AHEAD of each
        # sibling environment's PATH, so codetracer-native-recorder's ct_cli
        # was compiled by codetracer's Nim fork instead of the recorder's
        # pinned nim-2.2.8 and failed (`cannot export: macros.isCaseObject`).
        # codetracer's toolchain is now a fallback appended after the
        # sibling's. This suite runs the real script with a stub `repro exec`
        # that activates a different stub nim per repo, and pins both that the
        # sibling's own nim wins and that a sibling without one still gets
        # codetracer's. Stock bash and git, no network.
        run: bash ci/test/sibling-toolchain-precedence-test.sh

      - name: Self-test the private-registry credential preflight
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # This suite is also run by `visual-replay-regression-gate`, but that
        # job needs a GPU runner, a workspace lock and eight sibling
        # checkouts, so it is exactly the kind of lane that can stop
        # executing without anyone noticing -- which is what this whole
        # verdict job exists to prevent. The suite itself needs only bash,
        # git and coreutils (its `cargo` is a stub), so running it here as
        # well means the boundary and credential-leak contracts around the
        # private lldb-sys token are checked on every run, from a stock
        # runner, regardless of the state of the heavy lanes.
        run: bash ci/test/visual-replay-private-cargo-preflight-test.sh

      - name: Self-test the docs publish channels
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # `build-and-deploy-docs` writes three channels -- the released site,
        # the nightly book and one preview per open pull request -- into ONE
        # `gh-pages` branch, each run replacing only its own subtree. Nothing
        # in a green CI run would notice if that stopped being true: the
        # damage shows up as somebody else's pages quietly disappearing from
        # docs.codetracer.com, days later.
        #
        # This suite asserts preservation in every direction with `diff -rq`
        # on real trees, and exercises real pushes, a lost race and a
        # permanently rejecting remote against a local bare repository. It
        # needs only bash, git and coreutils -- no Nix, no dev shell, no
        # network -- so it belongs on this stock runner for the same reason
        # the credential preflight above does.
        run: bash ci/test/docs-deploy-channels-test.sh

      - name: Self-test the docs preview comment
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # The preview comment must be posted once and EDITED thereafter. A
        # regression here is invisible in CI -- it looks like a working
        # preview, with one more bot comment per push burying the review
        # conversation. Driven against a fake GitHub API served on localhost
        # (python3 + curl + jq, all stock here).
        run: bash ci/test/docs-preview-comment-test.sh

      - name: Assert the JS ViewModel lane can observe its own failures
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # `test-vm-js` believed it was checking node's exit code. It was not:
        # without `-d:nodejs` std/unittest cannot set a failing exit code on
        # the js backend, so a failing suite exited 0 -- and the compile
        # redirected the compiler warning that says exactly that to
        # /dev/null. The lane went red only when a test printed `[FAILED]`,
        # so a suite that ran zero tests, or died before printing anything,
        # scored `OK`.
        #
        # The shape half of this suite is a static check over the justfile, so
        # it belongs here on a stock runner: the lane it guards runs inside the
        # dev shell on a self-hosted runner, and is therefore exactly the kind
        # of lane that can stop reporting without anyone noticing.
        #
        # This runner has no `nim`, so the three toolchain-dependent contracts
        # skip here and the suite says so with a denominator ("5 of 8 ran, 3
        # skipped") rather than printing an unqualified pass. They are run in
        # full by the `viewmodel-tests` job, which invokes this same script
        # inside the dev shell -- see the step there. That statement was an
        # aspiration when this step first landed, not a fact; the step in
        # `viewmodel-tests` is what makes it true, and if it is ever removed
        # this comment is wrong again.
        run: bash ci/test/vm-js-lane-test.sh

      - name: Assert a crashed test binary cannot be reported as a partial run
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # Contract suite for ci/lib/test-lane-report.sh, the shared verdict the
        # six compile-and-run lanes classify through. Unlike the lane suites
        # above it needs no toolchain at all -- its fixtures are shell scripts
        # that print `[OK]` lines and then SIGSEGV -- so every contract runs
        # here, on this stock runner, on every push and PR.
        run: bash ci/test/test-lane-report-test.sh

      - name: Self-test the DeepReview design-review harness
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # UD-0's visual-design-iteration harness is what every later milestone
        # of the unified-diff campaign is reviewed through, so its failure mode
        # is the worst kind: it keeps producing ratings, for a matrix that has
        # quietly stopped covering what changed, or against a brief that has
        # lost the expected-elements block a reviewer needs to tell a broken
        # capture from a rough design.
        #
        # The suite needs only bash, git, coreutils and node (its `ct`, `node`
        # driver, `Xvfb` and `xdotool` are all stubs, and Electron is never
        # launched), so running it here as well as in `lint-bash` means the
        # contracts are checked on every run from a stock runner, regardless of
        # the state of the dev-shell lanes.
        run: bash tools/visual-review/deepreview-harness-test.sh

      - name: Assert no web bundle is assembled inside a build output directory
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # `just test-web-bundle` defaulted its output to `src/build-debug/web`,
        # inside a build output tree, and the ViewModel job runs it before
        # `build-once`; the build that owned that tree refused the extra
        # directory, so the build step could not pass once the smoke had. Both
        # web-bundle scripts now default to ci/lib/web-bundle-dir.sh's
        # `build/web`; this fails when that default, or a literal one in any
        # script, lies inside a `src/build-*` directory. Pure bash and git.
        run: bash ci/test/web-bundle-default-dir-test.sh

  ci-verdict:
    # Final gate: assert that CI actually RAN the jobs it gates on.
    #
    # GitHub reports a job whose dependency failed as `skipped`, and
    # `skipped` is not `failure`. When `lint-rust` started failing early —
    # in `Setup dev env` for want of a repo-workspaces workspace lock on
    # the pushed commit, or one step later at `direnv: not found` — every
    # job declaring `needs: [lint-bash, lint-nim, lint-nix, lint-rust]`,
    # including `test-non-gui`, the whole non-GUI suite, was silently
    # skipped. The run went red regardless, so for six weeks "the tests
    # are failing" and "the tests never ran" looked identical. On `dev`,
    # `test-non-gui` last actually executed on 2026-06-25.
    #
    # This job exists so those two states never look alike again. It does
    # not suppress or soften any failure: a required job that ran and
    # failed still fails this gate (exit 1). It only ensures that a
    # required job which never ran fails LOUDLY and differently (exit 2).
    #
    # It deliberately runs on a stock GitHub-hosted runner with nothing
    # but checkout + bash + jq — no Nix, no dev shell, no setup-dev-env,
    # no workspace lock, no cross-repo siblings. A watchdog must not share
    # the failure mode it is watching for; if this job needed the dev env,
    # the very outage it reports would take it down too.
    #
    # THE VERDICT PUBLISHES EVEN WHEN A GUARD IS BROKEN.
    #
    # This job used to reach its verdict in its fourteenth step, behind
    # thirteen unrelated static self-tests. Any one of them exiting non-zero
    # ended the job first, and GitHub then showed `ci-verdict` red with NO
    # VERDICT IN IT. That made a red `ci-verdict` ambiguous between the alarm
    # it exists to raise -- "a required job never ran" -- and "an unrelated
    # contract suite is broken", and for as long as that was true the one
    # instrument the rest of this pipeline is read through could be silenced
    # by a defect it does not even watch for.
    #
    # Two changes make that unreachable:
    #
    #   1. The thirteen unrelated suites moved to `ci-contract-suites` above.
    #      They inform nothing here, they need no `needs:` list, and in their
    #      own job they also report in the first scheduling wave instead of
    #      after every build lane has concluded.
    #
    #   2. What remains -- this gate's OWN self-test, which genuinely bears on
    #      whether the verdict can be trusted -- runs `continue-on-error` with
    #      its outcome re-raised in the LAST step. So the verdict is computed
    #      and printed on every run, unconditionally, and a broken self-test
    #      still turns this job red. Neither failure can hide the other.
    #
    # If you add a step to this job, it goes AFTER the verdict step or it does
    # not go here at all. The ordering is the fix.
    #
    # RESOLVED LATENCY — historical note, kept so the failure mode stays
    # recognizable. Two jobs in the needs: list below, `reprobuild-macos-smoke`
    # and `origin-dap-macos`, used to request `runs-on: eph-macos-arm64`, a
    # label no registered runner carried (the org's darwin runners expose
    # `self-hosted`/`macOS`/`ARM64`/`darwin`/`nix-darwin`/`aarch64-darwin`).
    # Those jobs never got scheduled: they sat queued until GitHub's 24-hour
    # ceiling cancelled them, and because this gate waits on them its verdict
    # could not be published until ~24h after the push. They now request
    # `aarch64-darwin`, which the m3-mcl-* runners carry, so the verdict is
    # prompt again. If a macOS job ever queues indefinitely once more, the
    # requested label has drifted from what the darwin runners advertise — do
    # not read a missing verdict as a passing one while that is true, and do
    # not "fix" it by dropping those jobs from needs:, which would remove the
    # delay only by giving up the coverage this gate exists to protect.
    needs:
      - ci-contract-suites
      - wasm-recordings
      - lint-bash
      - lint-nim
      - lint-nix
      - lint-rust
      - dev-build
      - nix-build
      - appimage-build
      - dmg-build
      - appimage-lib-check
      - appimage-cross-distro
      - dmg-lib-check
      - test-non-gui
      - test-ui-tests
      - test-ui-tests-rr
      - cross-process-linux
      - ct-host-container-gate
      - viewmodel-tests
      - viewmodel-tests-wasm
      - viewmodel-tests-wasm-parity
      - tui-tests
      - isonim-editor-smoke
      - visual-replay-regression-gate
      - ct-test-release-gate
      - ct-test-providers
      - ct-test-certificates
      - windows-bootstrap-smoke
      - windows-named-pipe-tests
      - windows-rust-components
      - windows-headless-test
      - origin-dap-windows
      - origin-dap-macos
      - reprobuild-linux-smoke
      - reprobuild-macos-smoke
    if: always()
    runs-on: ubuntu-latest
    # NO GREEN SAMPLE: 0 success in 52 records -- but this is the one job in this
    # group whose failure duration is honest. It is a pure aggregator over `needs:`
    # contexts with no external work, and a red IS its designed output on a red
    # tree, reached after it has done its reading. Median 0.2m, max 0.6m. 15m is
    # ~25x that.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # No later step in this job talks to a git remote, so the token has
          # nothing to do after the checkout and should not outlive it: these
          # runners reuse their work tree, and actions/checkout otherwise
          # leaves the credential in `.git/config` for whatever runs next.
          # (`nix develop` is unaffected either way -- Nix's fetcher does not
          # read gitconfig; its credentials come from netrc/access-tokens.)
          persist-credentials: false
          submodules: false

      - name: Self-test the verdict gate
        # Records its outcome instead of aborting the job, and the LAST step
        # re-raises it. See the header note "THE VERDICT PUBLISHES EVEN WHEN A
        # GUARD IS BROKEN" -- a self-test that halts the job here would take
        # the verdict down with it, which is the exact defect this ordering
        # was changed to remove. `continue-on-error` does not soften anything:
        # the outcome is asserted below and a broken self-test still fails
        # this job.
        id: verdict-selftest
        continue-on-error: true
        run: bash ci/verdict/required-jobs-test.sh

      - name: Assert the required jobs actually ran
        # ALWAYS runs. This is the answer the job exists to produce, and it is
        # produced before anything else in this job is allowed to fail.
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS_JSON" > "${RUNNER_TEMP}/needs.json"
          bash ci/verdict/required-jobs.sh --needs-json "${RUNNER_TEMP}/needs.json"

      - name: Re-raise a failed self-test
        # The self-test above is `continue-on-error` so that a broken guard
        # cannot suppress the verdict. It must still turn this job red, or
        # "the gate's own contracts are broken" would be silent -- trading one
        # invisible failure for another. Runs last so the verdict is already
        # printed and in the log by the time this exits non-zero.
        if: always() && steps.verdict-selftest.outcome == 'failure'
        run: |
          echo "::error::ci/verdict/required-jobs-test.sh failed -- the verdict above was produced by a gate whose own contracts do not hold. Read the verdict, then fix the gate." >&2
          exit 1

  workspace-lock-freshness:
    # Alarm, not a gate: does this commit carry a workspace lock that pins every
    # sibling repo it declares, at revisions CI can actually fetch?
    #
    # WHICH LOCK. reprobuild-specs Unified-Locking-And-Hooks.md §14 (normative
    # since 2026-09-30) made the commit's own committed `repro.lock` the lock
    # `clone-siblings` reads by default (`lock-store: committed`). The per-commit
    # record in metacraft-labs/metacraft-manifests is read only by a project
    # that opts in with `lock-store: record-store`, and no workflow here does.
    # Until 2026-10-14 this job still asserted that a manifests record had been
    # published for the commit. No job reads that record, and on `dev` the
    # assertion could never pass: every `dev` commit is a merge commit GitHub
    # created, which no workspace ever pushed, so none gets a record. (In
    # practice the job went red one step earlier, on a stale contract in its
    # self-test; see the 9g note in workspace-lock-freshness-test.sh.)
    #
    # WHAT IT ASSERTS NOW. The commit's `repro.lock` exists, is readable, and
    # pins every DECLARED sibling (`.github/sibling-repos` plus every bare
    # `siblings:` entry) by a full commit id with a matching integrity. These
    # are the rules `clone-siblings` refuses on (§14.5). Each pinned commit must
    # also be fetchable from the url the lock records. Every job clones only its
    # own subset, so without this job a declared sibling missing from the lock
    # surfaces late, in one job's `Setup dev env`. Freshness against sibling
    # tips is not CI's to check: it is enforced at commit formation and by the
    # pre-push gate (§13.3, §13.5). The store is derived from the `lock-store:`
    # inputs under .github/workflows. If one ever opts into `record-store`, the
    # job checks the manifests record instead (the script's record-store mode,
    # with its grace window for a late-arriving record).
    #
    # NOTHING declares `needs:` on this job, and it is deliberately absent from
    # `ci/verdict/required-jobs.txt`. A red check here must never be able to
    # skip a test job — coupling lock publication to the test suite is exactly
    # the defect being undone, and re-introducing it as a gate would trade an
    # eight-day outage for the next one. Loud, and structurally incapable of
    # cascading.
    #
    # Stock ubuntu-latest, bash + git only: like `ci-verdict`, a watchdog must
    # not share the failure mode it watches for.
    runs-on: ubuntu-latest
    if: always()
    # Committed mode is one shallow fetch per declared sibling. Record-store
    # mode gives a missing record a bounded 300s grace window (see the script
    # header). This ceiling is far above either on purpose: it is the backstop
    # that makes "this alarm can never hold a runner" true even if the window
    # logic were broken, not the mechanism that bounds the wait.
    timeout-minutes: 20
    steps:
      - name: Mint installation token
        # Org-scoped: it fetches the private siblings' pinned commits and, in
        # record-store mode, clones the manifests repo.
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        # depth 2 so HEAD's first parent is present: record-store mode probes
        # it as the second candidate. Committed mode reads only HEAD's tree.
        uses: actions/checkout@v5
        with:
          submodules: false
          fetch-depth: 2

      - name: Which lock store does CI read?
        id: store
        run: |
          set -euo pipefail
          store="$(bash ci/verdict/workspace-lock-freshness.sh --print-lock-store)"
          echo "lock-store: ${store}"
          echo "lock_store=${store}" >> "$GITHUB_OUTPUT"

      - name: Clone the manifests repo (record-store only)
        if: steps.store.outputs.lock_store == 'record-store'
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
        run: |
          set -euo pipefail
          git clone --quiet --branch latest \
            "https://x-access-token:${GH_TOKEN}@github.com/metacraft-labs/metacraft-manifests.git" \
            "${RUNNER_TEMP}/metacraft-manifests"

      - name: Self-test the lock alarm
        # Same rule as `ci-verdict` and `queue-watchdog`: an alarm is only worth
        # trusting if its own contracts hold. Both modes are covered: the
        # committed lock's (a declared repo it does not pin, a pin the remote
        # does not have) and the record store's (a record that arrives WHILE
        # the check is running).
        # Pure bash + git against local repositories; no network, no build.
        run: bash ci/verdict/workspace-lock-freshness-test.sh

      - name: Assert this commit's workspace lock pins every declared sibling
        env:
          GH_TOKEN: ${{ steps.ci_token.outputs.token }}
          LOCK_STORE: ${{ steps.store.outputs.lock_store }}
        run: |
          set -uo pipefail
          if [ "${LOCK_STORE}" = "committed" ]; then
            # The commit's own repro.lock, exactly as clone-siblings reads it.
            # --verify-remote fetches each pinned commit (shallow, treeless)
            # from the url the lock records, with the installation token.
            bash ci/verdict/workspace-lock-freshness.sh \
              --lock-store committed \
              --verify-remote \
              --sha "${GITHUB_SHA}"
            exit $?
          fi
          # record-store: HEAD plus its first parent — the same two candidates
          # clone-siblings probes. `git rev-parse HEAD^` is empty for a root
          # commit or if the fetch depth did not reach the parent; the script
          # ignores empty and all-zero candidates. The record is published
          # asynchronously by the pusher's pre-push gate, so the script
          # re-fetches the clone above until it appears or its grace window
          # expires. `--branch` only names the branch in the report: the PR
          # base (`GITHUB_BASE_REF`) on a pull request, else the pushed branch.
          BRANCH="${GITHUB_BASE_REF:-${GITHUB_REF_NAME:-}}"
          PARENT="$(git rev-parse --verify --quiet HEAD^ || true)"
          bash ci/verdict/workspace-lock-freshness.sh \
            --lock-store record-store \
            --manifest-dir "${RUNNER_TEMP}/metacraft-manifests" \
            --branch "${BRANCH}" \
            --sha "${GITHUB_SHA}" \
            --sha "${PARENT}"
