# =============================================================================
# Desktop -> launcher/recorder end-to-end compatibility gate (THE DESKTOP EDGE).
#
# THIN CALLER.  All of the work lives in the reusable workflow beside this one,
# `./.github/workflows/launcher-recorder-e2e.yml`, which the launcher and the
# recorder repos call too -- one implementation, three trigger directions, so
# the assertions cannot drift.
#
# Design: codetracer-specs/Testing/Launcher-Recorder-Compatibility-Tests.md
#         section 6 "CI wiring: three trigger edges, one reusable workflow".
# Milestone: LRC-3.
#
# WHAT THIS EDGE PINS.  This repository -- the codetracer-desktop core -- is the
# one under test, so it is pinned to `github.sha`.  That happens without this
# caller saying anything: the reusable workflow makes the TRIGGERING repo its
# primary `actions/checkout` at `${{ github.sha }}`, and inside a reusable
# workflow that context is the caller's.  The launcher, the recorder and
# codetracer-trace-format-nim are cloned beside it at the revisions the
# per-commit WORKSPACE LOCK pins for this commit -- metacraft-dev-guidelines/
# policies/ci-shared-dev-env.md section 3.2, migrated to by LRC-6.  Until LRC-6
# this caller passed `codetracer-ref: ${{ github.sha }}` plus a `ref: dev`
# matrix column for the recorder; both are gone, the first because it was
# telling the reusable workflow something it already knew and the second
# because a branch tip is not a pin.
#
# LOCK STATUS: RESOLVES, AND THIS EDGE NOW RUNS.  A lock-resolved sibling
# needs a workspace lock keyed by THIS
# repo's commit, and one now exists.  On 2026-08-22 a workspace lock was
# published for each of this gate's five trigger repos to
# metacraft-labs/metacraft-manifests@latest (commit 5de2a3ae); `dev` here had
# already moved on by then, so a further lock was published for its newer tip
# (commit c43c44b9):
#
#   locks/codetracer/codetracer/
#     f790309a8a009b95351bab722dff0cc0919b970a.toml
#
# That was verified against a FRESH clone of the published manifest -- not the
# working checkout that produced the lock -- using exactly the invocation
# `clone-siblings` makes: `resolve-sibling-rev.sh --repo codetracer --sibling
# <NAME> --sha f790309a --no-walk`.  All five siblings resolve at exit 0 with
# a 40-hex revision, and the three recorder revisions it pins DO contain
# `cross-repo/launcher-compat.yml` -- the pre-fixture pins that used to fail
# the workspace-shape check forty minutes into a run are gone.
#
# THIS EDGE HAS EXECUTED, AND THE "NEVER RUN" NOTE THAT USED TO STAND HERE IS
# RETIRED.  It was written while the gate was blocked on self-hosted runner
# capacity; that block is gone.  Run 33959666015 (push, e8c5141f3) reached
# `Run the launcher <-> recorder end-to-end gate` on all three matrix arms --
# steps 1-10 green, step 11 red -- so the workspace resolves, the core and
# ct-print build, and the driver starts.  What is red is real and specific:
#
#   step 1: building the launcher (.../codetracer-launcher/build.sh)
#   Target: linux-musl-x86_64
#   Wrapper: /nix/store/8ij5fkiran3a8a632r3yd60bgfgpbwg1-\
#            x86_64-unknown-linux-musl-gcc-wrapper-14.3.0/bin/...
#   out/launcher: 54304 bytes
#   FAIL: over 50 KB cap by 3104 bytes
#
# THAT IS A TOOLCHAIN DIFFERENCE, NOT LAUNCHER CODE GROWTH.  Measured both
# ways: with one fixed compiler across both revisions the launcher source has
# grown 328 bytes since the `sizes.md` v0.1.0 baseline (35,280 -> 35,608 via
# `zig cc -target x86_64-linux-musl`), nowhere near 4 KB.  And the launcher's
# OWN size gate builds the SHIPPED linux binary with Debian musl-tools
# (`Wrapper: /usr/bin/musl-gcc`) and passes at 50,328 bytes.  The 54,304 here
# comes from a compiler nothing ships: codetracer-launcher/build.sh probes
# musl-gcc, then `find /nix/store ... -name x86_64-unknown-linux-musl-gcc |
# head -1`, and only THEN $ZIG.  On this NixOS runner there is no musl-gcc on
# PATH, so the scavenge wins -- over the zig that `Provision the musl/zig
# toolchain for the launcher link` deliberately materialised one step earlier
# -- and a nixpkgs cc-wrapper adds its default hardening on top.  An unpinned
# `find | head -1` is not a toolchain declaration, and the number it produces
# is not comparable to the cap, which was calibrated on the shipping one.
#
# THE REPAIR IS IN codetracer-launcher/build.sh (prefer an explicitly provided
# $ZIG over the /nix/store scavenge), not here.  Do NOT raise the 51200-byte
# cap to clear this: on the shipping toolchain the launcher has 872 bytes of
# headroom, so the cap is doing exactly the job it exists for.
#
# AND IT IS ONE PUSH AWAY FROM RED AGAIN.  A lock answers for an EXACT commit.
# `clone-siblings` looks one up with `--no-walk` for `github.sha` (plus
# `github.event.before`, on `push` events only), and for a `pull_request` it
# probes the PR BASE sha alone.  So the lock named above answers for that
# commit and for no other -- including the commit that carries this comment.
# Push to this repo without publishing a lock for the new tip and this edge is
# straight back to failing in `Setup dev env` with "No workspace lock for
# codetracer": one push of grace on a `push` event, because the previous tip
# is probed as a fallback, and none at all on a `pull_request` once the base
# branch moves past the locked commit.  That is inherent to per-commit pinning
# rather than a defect, and it recurs on every mainline commit.
#
# THE REMEDY IS NOT IN THIS REPOSITORY, and that matters when this job goes
# red on a pull request.  Clearing it takes `repro workspace lock
# --trigger-repo=codetracer` in a workspace that contains the commit under
# test, plus a push of the resulting lock to
# metacraft-labs/metacraft-manifests -- not a change here.  `repro check
# --mode=pre-push` does exactly that on its own, but ONLY in a workspace whose
# `.repro/manifests` is a real git CHECKOUT of the manifest repo; where it is
# a plain directory the lock is generated and then silently dropped with `lock
# publish skipped: ... is not a git checkout`, which is precisely what had
# left every edge of this gate unlocked before 2026-08-22.  Do NOT paper over
# a missing lock by reintroducing a `<name>=<ref>` sibling override; that is
# the policy deviation this wiring exists to remove.
#
# The call uses the LOCAL path form (`./.github/workflows/...`), which GitHub
# resolves inside the calling commit, so the desktop edge always runs the
# version of the reusable workflow that ships with the commit under test.  The
# other two edges necessarily reference it by ref (`@dev`).
#
# WHY THIS EDGE EXISTS ALONGSIDE `ct-test-providers`.  The existing
# `ci/test/ct-providers.sh` gate drives the core `ct` binary DIRECTLY against
# each recorder; it proves hops 2 and 3 and never exercises the launcher's
# router.  This edge is the launcher-fronted superset: it additionally covers
# hop 1 -- capability-file routing, the execv hand-off and the
# CODETRACER_COMPONENT_DIR export that the decoded trace is asserted to contain.
#
# NO PATH FILTERS, deliberately.  A capability-file edit, a
# language_detection.nim change and a recorder_dispatch.nim change can each
# break routing, and LRC-3's verification is precisely that a trivial commit
# triggers the edge.
#
# FAN-OUT.  Four rows: python (the LRC-2 pilot), ruby and js (added by LRC-4),
# and beam (added 2026-09-10 once its blocker was fixed).  Each recorder carries
# its own `cross-repo/launcher-compat.yml` contract fixture, without which the
# driver hard-fails rather than skipping, and `fail-fast: false` keeps one broken
# recorder from hiding the state of the others.
#
# THE BEAM ROW'S BLOCKER WAS OURS AS MUCH AS THE RECORDER'S, and it is the
# sharpest thing this gate has caught.  `recorder_dispatch.nim` in THIS repo
# invokes codetracer-beam-recorder as `… -- elixir <program>` /
# `… -- escript <program>`, and that recorder's `is_beam_target()` accepted only
# `mix` / `erl` / `rebar3` -- so `ct record foo.ex` EXITED 0 having written a
# 2-event, 0-function `"mode": "non_beam"` trace.  A silent non-recording; no
# `ct --version` smoke test can see one.  The recorder gained real
# `elixir`/`escript` launch targets on 2026-08-22
# (codetracer-beam-recorder/docs/launch-targets.md), and the recorder-side edge
# has since gone GREEN IN CI -- run 34449303438, 2026-09-10, runner
# garm-eps5ywsqysrc: `scenarios: 4  assertions: 35  passed: 35  failed: 0`,
# 362 decoded events, hop-1 `component-dir=` inside the trace.
#
# ONE EDGE IS STILL DELIBERATELY ABSENT, on a blocker recorded against milestone
# LRC-4 in
# codetracer-specs/Testing/Launcher-Recorder-Compatibility-Tests.milestones.org
# and NTR-4 in
# codetracer-specs/Planned-Features/Native-Target-Recognition.milestones.org:
#
#   native.  UPDATED 2026-09-19, and the reason is no longer the one below.
#     ROUTING was already solved and shipped -- rule NTR-R1's reserved `noext`
#     token on this repo's `record` line carries an extension-less argument, and
#     `resources/codetracer-desktop-capabilities` declares it.  What used to be
#     missing was the CONTRACT, and that is now landed: codetracer-native-recorder
#     carries `cross-repo/launcher-compat.yml` and its compiled extension-less
#     sample, `assert_declared_extension` has a `noext` arm, the
#     empty-recording guard is shape-aware (a native bundle's `counts.steps` /
#     `counts.calls` are hard zeroes and are no longer read as emptiness, while
#     `counts.thread_streams` / `counts.thread_events` are asserted positively),
#     the function assertion is answered from the `functions` array with
#     `expect.event-type` as the native shape's counterpart, and the recorded
#     stdout is found by decoding the event payloads.  All of that is pinned by
#     ci/test/launcher-recorder-decode-test.sh against real ct-print goldens.
#
#     THE ROW IS STILL ABSENT HERE, DELIBERATELY, and this is a judgement rather
#     than an oversight.  The native edge has never executed: no host available
#     to this initiative can build BOTH the desktop core and the launcher, so
#     the two hops between `ct record` and `ct-mcr` -- the launcher's execv, and
#     the core's `ct-native-replay recognize` / `record --backend mcr` dispatch
#     -- are unproven.  The recorder-side caller
#     (codetracer-native-recorder/.github/workflows/launcher-recorder-e2e.yml)
#     is landed so that first execution happens somewhere, in a repo that owns
#     the outcome.  Adding the row HERE before it has gone green once would put
#     a known-unknown arm into a gate that three green arms share, and turn this
#     workflow red on every push to `dev` for a reason that has nothing to do
#     with the commit under test.  Add the row the day the recorder edge passes.
# =============================================================================

name: launcher-recorder-e2e (desktop edge)

on:
  push:
    branches: [main, dev, stable]
  pull_request:
  workflow_dispatch:

# Collapse superseded runs. This block did not exist until now, and its absence
# -- not a mis-keyed group, an outright missing group -- made this caller the
# SECOND-largest contributor to the CI backlog: 13 of 46 queued runs, behind
# only `codetracer.yml`. It triggers on every push to `main`/`dev`/`stable` and
# on every pull request with NO path filter, so it fires on all of them, and
# with no `concurrency` key every single run got its own implicit group and
# queued forever behind the others.
#
# Keyed and paired exactly as `codetracer.yml` is, for the same reasons spelled
# out at length there: group by `head_ref` on pull requests (so PR runs collapse
# per source branch) falling through to `github.ref_name` on pushes (so a burst
# of landings on `dev` leaves one running plus one pending, rather than a run
# per commit). `cancel-in-progress` is an expression rather than a constant so
# that superseded PR runs are still killed outright, while a mainline run that
# has already STARTED is protected -- GitHub allows only one pending run per
# group regardless, so the drainage does not depend on cancelling in-progress
# work, and cancelling a run that holds a self-hosted runner strands it offline
# for ~5 minutes while it is reaped.
#
# When this block was added this gate had never executed in CI.  That is no
# longer true: it has run repeatedly on `garm-*` runners and went GREEN on
# 2026-09-08 (run 34203243463, codetracer@37fe0a75, all three recorder arms of
# the day).  Collapsing superseded runs is still the right tuning -- it destroys
# only runs a newer commit has already superseded.
#
# KEPT IN STEP WITH `codetracer.yml`, which carries the byte-identical block and
# points back here. Retune one and you must retune the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - recorder: codetracer-python-recorder
            lang: python
          - recorder: codetracer-ruby-recorder
            lang: ruby
          - recorder: codetracer-js-recorder
            lang: js
          - recorder: codetracer-beam-recorder
            lang: beam
    name: ${{ matrix.lang }}
    uses: ./.github/workflows/launcher-recorder-e2e.yml
    with:
      edge: codetracer-desktop@${{ github.sha }} -> ${{ matrix.lang }}
      recorder-repo: ${{ matrix.recorder }}
      recorder-lang: ${{ matrix.lang }}
    secrets: inherit
