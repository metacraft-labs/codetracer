name: GPUI shell lane (agents)
# The GPUI shell lane (gpui-shell.yml) on pushes to `agents` that touch the
# GPUI front-end, where codetracer.yml does not run. One job, which builds
# what codetracer.yml's ct-build and visual-replay-tools jobs give the lane on
# pull requests; the `ci/gpui-shell` branch is for proving changes to it.

on:
  push:
    branches: [agents, 'ci/gpui-shell']
    paths:
      - 'src/frontend/gpui/**'
      - 'src/frontend/viewmodel/**'
      - 'ci/lib/test-lane-files.sh'
      - 'ci/lib/run-nim-test-lane.sh'
      - 'flake.lock'
      - '.github/workflows/gpui-shell.yml'
      - '.github/workflows/gpui-shell-agents.yml'
  workflow_dispatch:

# On `agents`, a newer push must not cancel the running run (see zgui.yml):
# GitHub keeps the running run plus one waiting run, and each newer push
# replaces the waiting one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'agents' }}

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  # ONE job: it builds ct, replay-server and the visual replay tools itself
  # (`standalone`), because each extra job pays a runner's 20-40 minutes of
  # provisioning again.
  gpui-shell:
    uses: ./.github/workflows/gpui-shell.yml
    with:
      standalone: true
    secrets: inherit
