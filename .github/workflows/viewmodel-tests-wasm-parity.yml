name: ViewModel headless tests (WASM parity gate)
# Called from codetracer.yml (job `viewmodel-tests-wasm-parity`), which keeps the triggers, the
# concurrency group, the job's `needs:` and ci-verdict's view of it. Split
# out to keep codetracer.yml well under GitHub's 512,000-byte workflow limit
# (ci/test/workflow-file-size-test.sh).
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  viewmodel-tests-wasm-parity:
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job; H4: routed to GPU host gpu-server-001
    # PLAT-17's parity gate, alone: both lanes compile every ViewModel suite.
    # Measured in run 45292632494 inside the WASM job: setup 37 minutes, the
    # gate 84 minutes and not finished (it had reached test_plat70h of the
    # alphabetical list) when the job's 120 minutes ran out. 37 + ~100 for
    # the whole gate, and 1.1x for a slower runner: 150. Its setup is the WASM
    # job's (comments there).
    timeout-minutes: 150
    name: ViewModel headless tests (WASM parity gate)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Clone codetracer-trace-format-nim sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-trace-format-nim
          ref: dev
          path: ${{ github.workspace }}/../codetracer-trace-format-nim
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone runquota sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-pm sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-pm
          ref: latest
          path: ${{ github.workspace }}/../codetracer-pm
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: PLAT-17 gate — the WASM lane's counts EQUAL native's
        # Uniform-WASM-Core.md §2.1.4: per file, the wasm lane's case and
        # assertion counts EQUAL native's, and the files it does not run are
        # exactly the ones ci/lib/test-lane-files.sh documents.
        run: nix develop .#devShells.x86_64-linux.default --command just test-vm-unit-wasm-parity
