name: Build ct for the shards
# Called from codetracer.yml (job `ct-build`). It runs `just build-once` and
# builds isonim-gpui's windowed shim ONCE per run, and hands the products to
# the 10 GPUI and 8 TUI shards (they `needs:` it), which would otherwise each
# spend 24-43 minutes rebuilding the same tree: on a cold garm VM provisioning
# plus build-once plus the window build took 65-90 minutes before a GPUI shard
# ran a scenario (run 43935388749), against that job's 90-minute bound.
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  ct-build:
    runs-on: [self-hosted, linux, x64]
    # First sized at 120 from run 43935388749's slowest cold garm shard:
    # provisioning 1768 s, build-once 2557 s, the windowed shim and front-end
    # 830 s (86 min), plus packing and the upload. Run 44048043714 then spent
    # 94 minutes provisioning on a slow runner and was cancelled at 120 minutes
    # in the shim build, and every GPUI and TUI shard waits on this job, so it
    # skipped both matrices. 180 is headroom for a slow fleet, not a target.
    # Revisit once infra finds the slow host: metacraft-pm issue
    # 2026-11-17-one-garm-runner-ran-the-same-dev-shell-provisioning-eight-to-
    # fifteen-times-slower-than-its-siblings.md (recorded at 4ffa812).
    timeout-minutes: 180
    name: Build ct and the windowed GPUI shim (once per run)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Read the isonim-gpui pin
        # The ONE pin this repo keeps for isonim-gpui is flake.lock's; the
        # clone below takes it from there rather than from a second copy of
        # the SHA in this file.
        #
        # jq, not python3: this step runs before any Nix provisioning, on the
        # runner's own PATH, and the persistent NixOS runners have no python3
        # there -- the step died with `python3: command not found` on every run
        # since the job was added, so nothing after it had ever run in CI. jq
        # is declared on every self-hosted runner. `-e` makes a missing node
        # or a null rev an error rather than the string "null" handed to the
        # clone below. ci/test/sibling-provisioning-test.sh section 5 fails a
        # pre-dev-shell step that reaches for a tool its runner lacks.
        id: gpui_pin
        run: |
          set -euo pipefail
          rev="$(jq -er '.nodes["isonim-gpui"].locked.rev' flake.lock)"
          echo "rev=${rev}" >> "${GITHUB_OUTPUT}"

      # Every authenticated clone near the top: the installation token expires
      # an hour after it is minted (see `viewmodel-tests`).
      - name: Clone isonim-gpui sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/isonim-gpui
          ref: ${{ steps.gpui_pin.outputs.rev }}
          path: ${{ github.workspace }}/../isonim-gpui
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone runquota sibling
        # `just build-once` compiles `ct`, which imports `runquota_process`
        # (see `cross-process-linux`).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # From the test lock, ci/test/siblings/repro.lock: the scenario lane builds
          # its runner and backend from these (ci/test/scenarios.sh).
          test-siblings: DemoVideoScript,DemoVideoScript-GuiAssert,GuiAssert

      - name: Build ct and replay-server
        id: ct
        # `ct record` records the `calc` and `call_pages` fixtures the
        # captures open; `replay-server` replays them.
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          # The trace writer's Nim build reads `results` only from here; a warm
          # runner's ~/.nimble hid its absence (run 43859070538, 6 cold shards:
          # "cannot open file: results").
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        # Without the repro daemon, bounded at 90 minutes, and dumped if the
        # bound is hit (ci/build/bounded-build-once.sh). Under repro 0.2.27 a
        # daemon-hosted build stalls: in run 44612896066 the daemon attempt
        # was killed at 50 minutes with the worker's reprobuild-nix child a
        # zombie and nothing logged, and the REPRO_DAEMON=off retry built the
        # same tree in 24 minutes (32 under 0.2.25). That stall is
        # reprobuild-pm issues/2026-11-19-a-daemon-hosted-build-blocks-its-
        # client-forever-when-the-workers-nix-child-has-died.md. When a
        # pinned reprobuild carries its fix, bring the daemon attempt back by
        # passing a first bound (e.g. 50) instead of 0.
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/build/bounded-build-once.sh "${RUNNER_TEMP}/build-once-diagnostics" 0 90

      - name: Upload the build-once stall diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-once-diagnostics
          path: ${{ runner.temp }}/build-once-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Build isonim-gpui's windowed shim and the virtual pointer
        id: shim
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/test/gpui-window-captures.sh --shim-only

      - name: Pack the products the shards use
        # src/build-debug-repro is build-once's output (ct, replay-server, the
        # db-backend and the front-end bundles); the shim and the virtual
        # pointer are isonim-gpui's. Paths are relative to the workspace's
        # parent, where every sibling checkout sits, so a shard restores them
        # to its own checkout whatever its runner's workspace path.
        run: |
          cd ..
          tar -czf "${RUNNER_TEMP}/ct-build-products.tar.gz" \
            codetracer/src/build-debug-repro \
            isonim-gpui/rust/target/windowed/debug/libgpui_nim_shim.so \
            isonim-gpui/build/virtual-pointer
          ls -la "${RUNNER_TEMP}/ct-build-products.tar.gz"

      - name: Upload the products
        uses: actions/upload-artifact@v4
        with:
          name: ct-build-products
          path: ${{ runner.temp }}/ct-build-products.tar.gz
          retention-days: 2
          compression-level: 0
