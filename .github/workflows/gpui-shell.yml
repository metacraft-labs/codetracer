name: GPUI shell lane
# The `gpui-shell` Nim lane (`just test-gpui-shell`): PLAT-20's GPUI shell
# suites and the plans that drive `codetracer-gpui` through isonim-gpui's
# featureless (headless) shim, against real recordings and a real
# replay-server. Before this job no CI job ran the lane at all
# (ci/test/shell-gate-coverage.known-dark.txt recorded it as BLOCKED).
#
# Called from codetracer.yml (pull requests and dispatches), beside ct-build
# and visual-replay-tools, whose artifacts it restores: ct, replay-server and
# the bundles from ct-build; ct_gfx_player, ct-native-replay, ct-mcr and the
# featureless shim from visual-replay-tools. And from gpui-shell-agents.yml on
# pushes to `agents` with `standalone: true`, where it is the only job and
# builds ct, replay-server and the tools itself: a separate ct-build and tools
# job would each pay a runner's 20-40 minutes of provisioning again. The tools
# come through ./.github/actions/provide-visual-replay-tools either way.
on:
  workflow_call:
    inputs:
      standalone:
        description: >
          true when no ct-build or visual-replay-tools job runs beside this
          one (gpui-shell-agents.yml): the job then builds ct, replay-server
          and the visual replay tools itself.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  gpui-shell:
    runs-on: [self-hosted, linux, x64]
    # Standalone, build-once (24-43 minutes cold) and the tools as well as
    # provisioning as the GPUI window shards (setup-db-backend-siblings and
    # repro.lock's siblings), the wait for the tools artifact, `just
    # build-gpui`, and the lane.
    timeout-minutes: 180
    name: GPUI shell lane (headless shim)
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Read the isonim-gpui pin
        # flake.lock's, as gpui-window-captures reads it; jq because this runs
        # before any Nix provisioning.
        id: gpui_pin
        run: |
          set -euo pipefail
          rev="$(jq -er '.nodes["isonim-gpui"].locked.rev' flake.lock)"
          echo "rev=${rev}" >> "${GITHUB_OUTPUT}"

      # Every authenticated clone near the top: the installation token expires
      # an hour after it is minted (see `viewmodel-tests`).
      - name: Clone isonim-gpui sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/isonim-gpui
          ref: ${{ steps.gpui_pin.outputs.rev }}
          path: ${{ github.workspace }}/../isonim-gpui
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone GuiAssert sibling
        # `test_gpui_window_frame` reads frames through GuiAssert's pixel
        # readers (`--path:../GuiAssert/src`, the lane's declared cross-repo
        # edge), at the branch the GPUI window shards use.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/GuiAssert
          ref: agents
          path: ${{ github.workspace }}/../GuiAssert
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone runquota sibling
        # `codetracer-gpui` and `ct` import `runquota_process`.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Read the private siblings' pins
        # Standalone only: the siblings ct, replay-server and the tools build
        # from, as visual-replay-tools.yml clones them.
        if: ${{ inputs.standalone }}
        id: private_pins
        run: |
          set -euo pipefail
          flake_rev() { jq -er --arg r "$1" '[.nodes[] | .locked? | select(.owner? == "metacraft-labs" and .repo? == $r) | .rev] | unique | if length == 1 then .[0] else error("\($r): \(length) revisions in flake.lock") end' flake.lock; }
          {
            echo "native_backend=$(flake_rev codetracer-native-backend)"
            echo "native_recorder=$(flake_rev codetracer-native-recorder)"
            echo "visual_replay=$(flake_rev codetracer-visual-replay)"
            echo "snapshot_codecs=$(sed -n 's/^PRIVATE_SIBLING_CODETRACER_SNAPSHOT_CODECS=\([0-9a-f]\{40\}\)$/\1/p' ci/toolchain.pin)"
          } | tee -a "$GITHUB_OUTPUT"
          grep -q '^snapshot_codecs=[0-9a-f]\{40\}$' "$GITHUB_OUTPUT"

      - name: Mint a token for the clones below
        if: ${{ inputs.standalone }}
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone codetracer-native-backend
        if: ${{ inputs.standalone }}
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-backend
          ref: ${{ steps.private_pins.outputs.native_backend }}
          path: ${{ github.workspace }}/../codetracer-native-backend
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'true'

      - name: Clone codetracer-native-recorder
        if: ${{ inputs.standalone }}
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-native-recorder
          ref: ${{ steps.private_pins.outputs.native_recorder }}
          path: ${{ github.workspace }}/../codetracer-native-recorder
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-visual-replay
        if: ${{ inputs.standalone }}
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-visual-replay
          ref: ${{ steps.private_pins.outputs.visual_replay }}
          path: ${{ github.workspace }}/../codetracer-visual-replay
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Clone codetracer-snapshot-codecs
        if: ${{ inputs.standalone }}
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/codetracer-snapshot-codecs
          ref: ${{ steps.private_pins.outputs.snapshot_codecs }}
          path: ${{ github.workspace }}/../codetracer-snapshot-codecs
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Build ct and replay-server
        # Standalone only; ct-build's step, verbatim.
        if: ${{ inputs.standalone }}
        id: ct_built
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/build/bounded-build-once.sh "${RUNNER_TEMP}/build-once-diagnostics" 0 90

      - name: Restore ct and replay-server from the ct-build job
        if: ${{ !inputs.standalone }}
        id: ct_restored
        uses: actions/download-artifact@v4
        with:
          name: ct-build-products
          path: ${{ runner.temp }}/ct-build

      - name: Unpack them beside the siblings
        # A short download exits 3 and is fetched again below (see
        # gpui-window-captures).
        if: ${{ !inputs.standalone }}
        id: unpack
        continue-on-error: true
        run: bash ci/unpack-ct-build-products.sh "${RUNNER_TEMP}/ct-build"

      - name: Restore the ct-build products again, the first download being incomplete
        if: ${{ steps.unpack.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: ct-build-products
          path: ${{ runner.temp }}/ct-build-retry

      - name: Unpack the second download
        if: ${{ steps.unpack.outcome == 'failure' }}
        run: bash ci/unpack-ct-build-products.sh "${RUNNER_TEMP}/ct-build-retry"

      - name: ct is here, built or restored
        # The one `steps.ct` the steps that run past a failure wait on
        # (ci/test/ct-build-gate-test.sh).
        if: ${{ steps.ct_built.outcome == 'success' || steps.ct_restored.outcome == 'success' }}
        id: ct
        run: test -x src/build-debug-repro/bin/ct || test -x build/bin/ct || { ls src/build-debug-repro/bin build/bin 2>&1; exit 1; }

      - name: Provide ct_gfx_player and the visual replay tools
        # From this run's visual-replay-tools artifact under codetracer.yml,
        # built here when standalone: the one entry point the TUI and GPUI
        # shards use too.
        uses: ./.github/actions/provide-visual-replay-tools
        with:
          wait-for-artifact: ${{ inputs.standalone && 'false' || 'true' }}

      - name: Restore the headless shim from the cache
        # isonim-gpui's `--features gpui-headless` shim, staged with its build
        # stamps in rust/target/plat37 by its `just plat37-shims`, for PLAT-35's
        # compositor-free pixel capture below. Keyed on the pin.
        id: plat37_cache
        uses: actions/cache/restore@v4
        with:
          path: ../isonim-gpui/rust/target/plat37
          key: gpui-shim-plat37-v1-${{ steps.gpui_pin.outputs.rev }}

      - name: Build the headless shim
        if: ${{ steps.plat37_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          (cd ../isonim-gpui && nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/isonim-gpui-shell" --command just plat37-shims)
          ls -la ../isonim-gpui/rust/target/plat37

      - name: Save the headless shim to the cache
        if: ${{ steps.plat37_cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ../isonim-gpui/rust/target/plat37
          key: gpui-shim-plat37-v1-${{ steps.gpui_pin.outputs.rev }}

      - name: Restore the featureless shim from the cache
        # For when the tools artifact did not bring it; keyed on the pin, so
        # a restored file is the same shim the artifact would carry.
        id: shim_cache
        uses: actions/cache/restore@v4
        with:
          path: ../isonim-gpui/rust/target/debug/libgpui_nim_shim.so
          key: gpui-shim-featureless-v1-${{ steps.gpui_pin.outputs.rev }}

      - name: Build the featureless shim
        id: shim_build
        run: |
          set -euo pipefail
          shim=../isonim-gpui/rust/target/debug/libgpui_nim_shim.so
          if [ -e "$shim" ]; then
            echo "featureless shim present: $(ls -la "$shim")"
            exit 0
          fi
          (cd ../isonim-gpui && nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/isonim-gpui-shell" --command bash -c "cd rust && cargo build")
          ls -la "$shim"
          echo "built=true" >>"$GITHUB_OUTPUT"

      - name: Save the featureless shim to the cache
        if: ${{ steps.shim_build.outputs.built == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ../isonim-gpui/rust/target/debug/libgpui_nim_shim.so
          key: gpui-shim-featureless-v1-${{ steps.gpui_pin.outputs.rev }}

      - name: Build codetracer-gpui against the featureless shim
        run: nix develop .#devShells.x86_64-linux.default --command just build-gpui

      - name: The GPUI shell lane
        run: nix develop .#devShells.x86_64-linux.default --command just test-gpui-shell

      - name: PLAT-35's GPUI pixel capture, through the headless shim
        # `gpui_render_to_pixels`, no compositor; each scenario is graded on
        # the census the binary writes (ci/test/plat35-gpui-capture.sh). Not
        # when there is no ct.
        if: ${{ !cancelled() && steps.ct.outcome == 'success' }}
        run: nix develop .#devShells.x86_64-linux.default --command just plat35-capture-gpui

      - name: Upload the lane's log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gpui-shell-logs
          path: |
            test-logs/test-gpui-shell.log
            test-logs/gpui-shell.timings.tsv
          if-no-files-found: ignore
