name: GPUI window captures
# Called from codetracer.yml (job `gpui-window-captures`), which keeps the trigger, the
# concurrency group and ci-verdict's `needs:`. Split out because codetracer.yml
# reached GitHub's 512,000-byte limit (ci/test/workflow-file-size-test.sh).
on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  # ci/wait-for-run-artifact.sh lists this run's artifacts and jobs.
  actions: read

jobs:
  gpui-window-captures:
    runs-on: [self-hosted, linux, x64]  # the label isonim-gpui's "GUI tests (headless sway)" job runs green on
    # Sized for shard 1, the capture shard, which has never finished inside
    # 90m (cancelled at 90 in runs 43935388749, 44269676398 and 44384977215).
    # Measured on garm in 44384977215: 74m from job start to the capture step
    # (54.5m of it provisioning: ~15m dev-shell substitution, 6m of
    # `tree-sitter generate`, ~10m of uncached git sources, 11m rebuilding
    # cargo-build-sbf after a private-cache timeout disabled the substituter,
    # 11.5m of sibling clones), then 14m of in-step builds (plat45's
    # featureless shim and `just build-gpui`) before the first of its nine
    # fixtures. Those fixtures take 2-5 minutes each here (unmeasured as a
    # whole: the shard never reached the end). 74 + 14 + 9 x 5 = 133m; 150m
    # covers that. The bound is one literal for the whole matrix
    # (ci/verdict/job-timeouts.py), so the other shards, which finish in
    # 22-88m, carry it too. Tighten it from shard 1's first green run.
    # Shard 1 also carried CTF-P1b's story captures and the terminal
    # emulators' lane after those, and was cancelled at 150 inside the
    # captures in runs 45118976975 and 45292632494 (~110m of window lanes
    # before them, then 40 minutes of captures, ~300 of ~1,400). The captures
    # are now dealt over shards 3-20 and judged by `ctf-p1b-gpui-layout`; the
    # emulators run on shard 2.
    timeout-minutes: 150
    # The GPUI scenario lane does not fit one 90-minute job (70 runs at about
    # 6 minutes each, run 43806398582), so it runs as 20 shards: 10 left each
    # shard about 8 runs of 5-11 minutes, about 55 minutes before a cold
    # runner's ~30 of provisioning (run 43935388749, shard 4). Shard 1 also
    # carries the capture steps, and takes a light slice
    # (ci/test/scenario-lane-shard.py; scenario-lane-shard-test.sh holds the
    # shards' union to the lane).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 6]  # PROOF BRANCH ONLY
    name: GPUI window captures (headless sway) (${{ matrix.shard }}/20)
    # WHY THIS JOB EXISTS. The GPUI window suites assert records measured off
    # a real window (`src/tests/visual/plat4{5,7,8}-…json`); until this job
    # nothing re-took them, so a record stopped describing the window the
    # first time the window changed (PLAT-45's and PLAT-47's predated the
    # top bar). Here each capture runs on a headless sway, its frames are
    # measured into the record, and the suite asserts THAT — this commit's
    # window, not the file last committed. The two capabilities the
    # known-dark list recorded as missing — a windowed shim and a
    # compositor — are isonim-gpui's own CI job's, on this runner label
    # (codetracer-specs issues/2026-09-26-window-capture-gates-recorded-
    # blocked-although-ci-can-run-them.md).
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Sample memory in the background
        # The top processes by resident memory every 15 seconds, to a file this
        # job uploads when it does not succeed: a runner that reaches its 20 GiB
        # cap OOM-kills processes and the guard's annotation names none (TUI
        # shard 5/8 of run 43996043232). Best effort; the runner ends it with
        # the job. ci/test/memory-sampler-test.sh holds both steps here.
        run: |
          nohup bash ci/lib/memory-sampler.sh "${{ runner.temp }}/memory-samples.log" 15 >/dev/null 2>&1 &
          echo "memory sampler started (pid $!)"

      - name: Read the isonim-gpui pin
        # The ONE pin this repo keeps for isonim-gpui is flake.lock's; the
        # clone below takes it from there rather than from a second copy of
        # the SHA in this file.
        #
        # jq, not python3: this step runs before any Nix provisioning, on the
        # runner's own PATH, and the persistent NixOS runners have no python3
        # there -- the step died with `python3: command not found` on every run
        # since the job was added, so nothing after it had ever run in CI. jq
        # is declared on every self-hosted runner. `-e` makes a missing node
        # or a null rev an error rather than the string "null" handed to the
        # clone below. ci/test/sibling-provisioning-test.sh section 5 fails a
        # pre-dev-shell step that reaches for a tool its runner lacks.
        id: gpui_pin
        run: |
          set -euo pipefail
          rev="$(jq -er '.nodes["isonim-gpui"].locked.rev' flake.lock)"
          echo "rev=${rev}" >> "${GITHUB_OUTPUT}"

      # Every authenticated clone near the top: the installation token expires
      # an hour after it is minted (see `viewmodel-tests`).
      - name: Clone isonim-gpui sibling
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/isonim-gpui
          ref: ${{ steps.gpui_pin.outputs.rev }}
          path: ${{ github.workspace }}/../isonim-gpui
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone GuiAssert sibling
        # PLAT-45's window record reads the frames through GuiAssert's pixel
        # readers (`--path:../GuiAssert/src`), the declared cross-repo edge
        # the `gpui-shell` and `screen-oracle` lanes carry. PLAT-69's
        # scenarios drive the window on GuiAssert's desktop-environment
        # targets (`gui_assert/desktop_env`), which are on its `agents`
        # branch until they reach `dev`.
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/GuiAssert
          ref: agents
          path: ${{ github.workspace }}/../GuiAssert
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Clone runquota sibling
        # `just build-once` compiles `ct`, which imports `runquota_process`
        # (see `cross-process-linux`).
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/runquota
          ref: dev
          path: ${{ github.workspace }}/../runquota
          gh-token: ${{ steps.ci_token.outputs.token }}
          submodules: 'false'

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}

      - name: Provision dependency siblings from repro.lock
        id: provision
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          # From the test lock, ci/test/siblings/repro.lock: the scenario lane builds
          # its runner and backend from these (ci/test/scenarios.sh).
          test-siblings: DemoVideoScript,DemoVideoScript-GuiAssert,GuiAssert

      - name: Give Vulkan a software driver where the host has none
        # The windowed GPUI front-end draws through wgpu/Vulkan. The GPU hosts
        # carry a driver; an ephemeral garm VM has no Vulkan ICD at all, and
        # every window there aborted with "Failed to create surface for any
        # enabled backend" (run 43935388749, shard 2). Mesa's lavapipe, from
        # this flake's nixpkgs, is the fallback; a host with an ICD keeps its.
        run: |
          if ls /run/opengl-driver/share/vulkan/icd.d/*.json /etc/vulkan/icd.d/*.json /usr/share/vulkan/icd.d/*.json >/dev/null 2>&1; then
            echo "the host has a Vulkan driver; keeping it"
          else
            mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa | head -n 1)"
            icd="${mesa}/share/vulkan/icd.d/lvp_icd.x86_64.json"
            test -f "${icd}"
            echo "no Vulkan driver on this host; using lavapipe (${icd})"
            echo "VK_ICD_FILENAMES=${icd}" >> "${GITHUB_ENV}"
            echo "VK_DRIVER_FILES=${icd}" >> "${GITHUB_ENV}"
          fi
          # GNOME Shell (GuiAssert's gnome target, PLAT-69's second
          # compositor) renders through EGL and GBM, not Vulkan, and on a host
          # with no EGL vendor it does not start: "Unable to initialize the
          # Clutter backend: no available drivers found" (run 45292632494,
          # shard 1). Mesa's EGL vendor, GBM backend and DRI drivers from the
          # same nixpkgs are the fallback (measured on the workstation:
          # gnome-shell --headless fails that way with the host's drivers
          # hidden, and starts with these three set).
          if ls /run/opengl-driver/share/glvnd/egl_vendor.d/*.json /usr/share/glvnd/egl_vendor.d/*.json /etc/glvnd/egl_vendor.d/*.json >/dev/null 2>&1; then
            echo "the host has an EGL vendor; keeping it"
          else
            mesa="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#mesa | head -n 1)"
            vendor="${mesa}/share/glvnd/egl_vendor.d/50_mesa.json"
            test -f "${vendor}"
            test -f "${mesa}/lib/gbm/dri_gbm.so"
            echo "no EGL vendor on this host; using Mesa's (${vendor})"
            {
              echo "__EGL_VENDOR_LIBRARY_FILENAMES=${vendor}"
              echo "GBM_BACKENDS_PATH=${mesa}/lib/gbm"
              echo "LIBGL_DRIVERS_PATH=${mesa}/lib/dri"
            } >> "${GITHUB_ENV}"
          fi

      - name: Give the window a cursor theme where the host has none
        # The scenario binding names the theme the window loads its pointer
        # shapes from; an ephemeral garm VM has none, and gpui/pointer-shapes
        # failed there with "no cursor theme on this machine" (run
        # 43996043232, shard 9). Adwaita, from this flake's nixpkgs, through
        # XCURSOR_PATH, which the binding reads first.
        run: |
          if [ -d /run/current-system/sw/share/icons/Adwaita/cursors ]; then
            echo "the host has the Adwaita cursor theme; keeping it"
          else
            theme="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#adwaita-icon-theme | head -n 1)"
            test -d "${theme}/share/icons/Adwaita/cursors"
            echo "XCURSOR_PATH=${theme}/share/icons" >> "${GITHUB_ENV}"
          fi

      - name: Give dbus-run-session a session bus configuration where the host has none
        # GuiAssert starts sway through nixpkgs' wrapper, which runs it under
        # dbus-run-session; that reads /etc/dbus-1/session.conf, which an
        # ephemeral garm VM does not have, so sway never started and every
        # window-manager capture failed ("Failed to open
        # /etc/dbus-1/session.conf", run 43996043232, shard 1). The host gets
        # the configuration from this flake's nixpkgs dbus; a host that has
        # one keeps its own.
        #
        # It is a COPY without the line that includes /etc/dbus-1/session.conf.
        # nixpkgs' file includes that path for local overrides, so a symlink
        # to it there includes itself and the bus refuses to start ("Circular
        # inclusion of file '/etc/dbus-1/session.conf'", run 44940608244,
        # shard 1: every GuiAssert sway capture failed).
        run: |
          # A reused host may still hold the self-including link an earlier
          # version of this step made; that one is not the host's own.
          if [ -L /etc/dbus-1/session.conf ] &&
            grep -q '^/nix/store/[^/]*-dbus-[^/]*/share/dbus-1/session.conf$' <<<"$(readlink /etc/dbus-1/session.conf)"; then
            sudo rm /etc/dbus-1/session.conf
          fi
          if [ -e /etc/dbus-1/session.conf ]; then
            echo "the host has /etc/dbus-1/session.conf; keeping it"
          else
            dbus="$(nix build --no-link --print-out-paths --inputs-from . nixpkgs#dbus.out)"
            conf="${dbus}/share/dbus-1/session.conf"
            self='<include ignore_missing="yes">/etc/dbus-1/session.conf</include>'
            test -f "${conf}"
            sudo mkdir -p /etc/dbus-1
            grep -vF "${self}" "${conf}" | sudo tee /etc/dbus-1/session.conf >/dev/null
            if grep -qF /etc/dbus-1/session.conf /etc/dbus-1/session.conf; then
              echo "::error::/etc/dbus-1/session.conf still includes itself"
              exit 1
            fi
            # The bus starts on it, before anything depends on that.
            "${dbus}/bin/dbus-run-session" --config-file=/etc/dbus-1/session.conf -- true
          fi

      - name: Restore ct and the windowed shim from the ct-build job
        # ct-build.yml builds them once per run (this job `needs:` it): ct,
        # replay-server and the bundles (src/build-debug-repro), and isonim-gpui's
        # windowed shim and virtual pointer. Each shard used to run
        # build-once itself, 24-43 minutes on a cold garm VM.
        id: ct
        uses: actions/download-artifact@v4
        with:
          name: ct-build-products
          path: ${{ runner.temp }}/ct-build

      - name: Unpack them beside the siblings
        # Tested whole first: download-artifact can finish "successfully" with
        # a short file (GPUI shard 15 and TUI shard 7 of run 44269676398: "gzip:
        # stdin: unexpected end of file" after a 20-minute download). A short
        # one exits 3 and is downloaded again below.
        id: unpack
        continue-on-error: true
        run: bash ci/unpack-ct-build-products.sh "${RUNNER_TEMP}/ct-build"

      - name: Restore the ct-build products again, the first download being incomplete
        if: ${{ steps.unpack.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          name: ct-build-products
          path: ${{ runner.temp }}/ct-build-retry

      - name: Unpack the second download
        if: ${{ steps.unpack.outcome == 'failure' }}
        run: bash ci/unpack-ct-build-products.sh "${RUNNER_TEMP}/ct-build-retry"

      - name: Does this shard's scenario slice need the visual replay player?
        # Decided from the slice, as tui-tests does, not from the shard number:
        # the lane's entries are dealt to shards by position, so adding entries
        # moved gpui/visual-replay-video-player from shard 1 to shard 5, which
        # restored no tools, and it failed "MISSING-PREREQ SKIP: the visual
        # replay player (ct_gfx_player) is not installed" (run 44874859112).
        # Shard 1 still takes the tools for its window captures.
        if: ${{ !cancelled() && steps.ct.outcome == 'success' }}
        id: player
        run: |
          result="$(nix develop .#devShells.x86_64-linux.default --command bash ci/test/scenario-slice-uses-stage.sh gpui "${{ matrix.shard }}/20" visual-recording | tail -n 1)"
          [[ $result =~ ^needed=(true|false)$ ]] || { echo "scenario-slice-uses-stage printed '${result}', not needed=true|false" >&2; exit 1; }
          echo "$result" | tee -a "$GITHUB_OUTPUT"
          if [ "${{ matrix.shard }}" = 1 ]; then echo "tools=true"; else echo "tools=${result#needed=}"; fi | tee -a "$GITHUB_OUTPUT"

      - name: Provide the visual replay tools
        # ct-native-replay, ct_gfx_player and ct-mcr, built once per run in
        # parallel with ct-build (visual-replay-tools.yml), rather than in this
        # job (about 22 minutes for ct-mcr alone in GPUI shard 1 of run
        # 44269676398): the action waits for that job's artifact, which is
        # not a `needs` of this job so that the shards without a visual
        # scenario start when ct-build ends, restores it, and exports the
        # variables the stage reads (CODETRACER_CT_GFX_PLAYER_CMD and the test
        # licence). When the artifact is missing or short it builds the tools
        # here. Shard 1 takes them for its window captures as well (and the
        # featureless shim the artifact carries), so the gate is the helper's
        # `tools`, which includes every shard where
        # steps.player.outputs.needed == 'true'.
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && (steps.player.outputs.tools == 'true' || steps.player.outputs.needed == 'true') }}
        uses: ./.github/actions/provide-visual-replay-tools
        with:
          wait-for-artifact: 'true'

      - name: Build the windowed GPUI front-end the scenario lane opens
        # Linked here, against the restored shim, because the front-end pins
        # the shim's absolute path (-d:gpuiShimPath) and runners differ in
        # theirs. Shard 1's captures step relinks it too.
        id: gpui-window
        env:
          CT_GPUI_SHIM_PREBUILT: "1"
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/test/gpui-window-captures.sh --build-only

      - name: Re-take and assert the GPUI window captures
        if: ${{ matrix.shard == 1 }}
        env:
          CT_GPUI_SHIM_PREBUILT: "1"
        # isonim-gpui's windowed shim and virtual pointer are built in ITS
        # dev shell (the one that declares the X/Wayland libraries and the
        # compositor tools); the recipe enters it itself.
        run: nix develop .#devShells.x86_64-linux.default --command just gpui-window-captures

      - name: PLAT-35's GPUI arm as a real window, one per parity scenario
        # Linux has no headless GPUI renderer, so PLAT-35's GPUI frames on
        # Linux are a real window on GuiAssert's headless sway -- this job's
        # compositor, windowed shim and GuiAssert checkout. One window per
        # scenario in `src/tests/visual/scenarios.json`; a scenario with no
        # settled frame at its declared size fails by name. Runs after the
        # window captures, which build the same windowed shim and record the
        # `calc` trace it opens, and BEFORE the scenario lane, so the frames
        # reach the ViewModel job's screen oracle early; `!cancelled()` so a
        # red capture above does not hide whether this one works.
        id: plat35_gpui
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && matrix.shard == 1 }}
        run: nix develop .#devShells.x86_64-linux.default --command just plat35-capture-gpui-window

      - name: Upload PLAT-35's GPUI window frames for the screen oracle
        # Read by the ViewModel job's screen oracle (PLAT-39) beside its own
        # Electron frames; frames are never committed.
        if: ${{ !cancelled() && steps.plat35_gpui.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: plat35-gpui-window-frames
          path: build/plat35/gpui-window/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Scenarios — the GPUI lane
        # The windowed `build/bin/codetracer-gpui-window` and its shim, built by
        # the step above, on DemoVideoScript-GuiAssert's private Xvfb: read by
        # vision (GuiAssert's capture and OCR), driven by OS-level input.
        # GuiAssert's capture and input helpers are built in GuiAssert's own
        # dev shell, which declares their X and Wayland libraries.
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && steps.gpui-window.outcome != 'failure' }}
        env:
          SCENARIO_LANE_SHARD: ${{ matrix.shard }}/20
        run: |
          (cd ../GuiAssert && nix develop --profile "${CT_GCROOT_DIR:-$RUNNER_TEMP}/GuiAssert-shell" --command bash helpers/linux/build.sh "${{ github.workspace }}/build/gui-assert-helpers")
          nix develop .#devShells.x86_64-linux.default --command bash -c '
            set -e
            export GUI_ASSERT_HELPER_DIR="$PWD/build/gui-assert-helpers"
            just scenario-build dvs stage gpui
            bash ci/test/scenarios.sh lane gpui
            if [ "${SCENARIO_LANE_SHARD%%/*}" = 1 ]; then bash ci/test/scenario-broken-run.sh gpui; fi'

      - name: Upload the failed scenario runs (GPUI)
        if: ${{ failure() }}
        uses: metacraft-labs/DemoVideoScript/.github/actions/upload-failed-runs@b2dd47d345794d53966102b7ee151e46f7d52daf
        with:
          build-dir: build
          name: scenario-runs-gpui-${{ matrix.shard }}

      - name: CTF-P1b's Agent Harbor stories as real windows, this shard's share
        # One `codetracer-gpui-story` window per story, theme and size on
        # GuiAssert's headless sway (the same windowed shim and GuiAssert
        # checkout as above), into `build/ctf-p1b/gpui/`, and CTF-P1c's: each
        # playback story at each named moment of its scenario, into
        # `build/ctf-p1c/gpui/`. The whole set is about 1,400 windows at about
        # 8 s each (run 45292632494: ~300 in 40 minutes), three hours that
        # shard 1 never finished inside the job's bound on top of its window
        # lanes (cancelled at 150m in runs 45118976975 and 45292632494). So
        # every shard from 3 on takes a round-robin share of it, ~76 windows
        # or ~10 minutes, after its scenario slice
        # (ci/test/ctf-p1b-gpui-capture-share.sh), and the
        # `ctf-p1b-gpui-layout` job below judges the union of the shares
        # against the web layout. Bounded here so a slow share fails by name:
        # ~10 minutes of windows plus the story host's and the capture
        # driver's builds; the shards' other steps finish within 88m, which
        # leaves 62 of the job's 150
        # (ci/test/ctf-p1b-gpui-capture-shards-test.sh holds both).
        id: ctf_p1b
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && matrix.shard >= 3 }}
        timeout-minutes: 45
        env:
          CT_GPUI_SHIM_PREBUILT: "1"
        run: |
          share="$(bash ci/test/ctf-p1b-gpui-capture-share.sh "${{ matrix.shard }}/20")"
          echo "CTF-P1b captures: share ${share}"
          nix develop .#devShells.x86_64-linux.default --command just ctf-p1b-gpui-captures-shard "${share}"

      - name: Upload this shard's CTF-P1b captures for the layout judge
        # Frames and regions, whatever the step above managed: one it did
        # not take is missing from the union, and the judge fails it by name.
        if: ${{ !cancelled() && steps.ctf_p1b.outcome != 'skipped' && matrix.shard >= 3 }}
        uses: actions/upload-artifact@v4
        with:
          name: ctf-p1b-gpui-captures-${{ matrix.shard }}
          path: |
            build/ctf-p1b/gpui/
            build/ctf-p1c/gpui/
          if-no-files-found: ignore
          retention-days: 2

      - name: The terminal front-end in real terminal emulators
        # Terminal-Adaptation §13.4's `tui-real-emulators` lane, here because
        # this job has what it needs: GuiAssert's checkout and dev shell (the
        # headless sway foot runs on, Xvfb, tesseract) and the recursive
        # checkout `build-tui`'s grammars come from. kitty, xterm, Ghostty
        # and Alacritty on Xvfb, foot on the headless sway, tmux in kitty,
        # each from this commit's pinned nixpkgs: the committed persona
        # re-captured and compared, the profile, the glyph test card read by
        # OCR and pixels, OSC 52 accepted or refused against the profile. An
        # emulator this runner cannot provide or start is a counted
        # MISSING-PREREQ skip, never a failure; `!cancelled()` so a red GPUI
        # capture does not hide it. On shard 2, not shard 1: shard 1's window
        # lanes leave it no room inside the job's bound (it never ran there,
        # runs 45118976975 and 45292632494).
        id: real_emulators
        if: ${{ !cancelled() && steps.ct.outcome == 'success' && matrix.shard == 2 }}
        run: nix develop .#devShells.x86_64-linux.default --command just test-tui-real-emulators

      - name: Upload the frames
        # Also when cancelled at the job's bound, which is when they are
        # most needed; and every window lane's own output directory, since a
        # lane that fails here is diagnosed from its run log and frames.
        if: ${{ (failure() || cancelled()) && matrix.shard == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: gpui-window-captures
          path: |
            build/plat45/
            build/plat47-gpui/
            build/plat48-gpui/
            build/plat69/
            build/plat59-gpui/
            build/plat68/
            build/plat70b-gpui/
            build/gpui-plugins/
            build/plat35/gpui-window/
            src/tests/visual/plat45-gpui-arrangement.json
            src/tests/visual/plat47-gpui-window.json
            src/tests/visual/plat48-gpui-window.json
          retention-days: 7

      - name: Upload the terminal emulators' captures
        if: ${{ failure() && steps.real_emulators.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: tui-real-emulators
          path: build/real-emulators/out/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the memory samples
        # What held the memory when the job failed or was cancelled; an OOM kill
        # lands as either.
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: memory-samples-gpui-${{ matrix.shard }}
          path: ${{ runner.temp }}/memory-samples.log
          if-no-files-found: ignore
          retention-days: 7

  ctf-p1b-gpui-layout:
    # CTF-P1b and CTF-P1c: the GPUI story captures, taken in shares by
    # shards 3-20 above (`ctf-p1b-gpui-captures-<shard>`), judged together
    # against the committed web layout records by the
    # `agent-harbor-gpui-captures` lane (`just ctf-p1b-gpui-captures`' lane,
    # without its captures). A shard's share is not a lane of its own: the
    # layout tests hold the WHOLE set to the stories' declaration, so a
    # capture a share failed to take, or a share that never uploaded, fails
    # here by name. Runs when a shard failed, so the others' captures are
    # still judged. Needs no window, no ct and no compositor.
    needs: [gpui-window-captures]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, linux, x64]
    # Unmeasured until its first green run: provisioning as screen-oracle's
    # (up to ~55m on a cold garm VM), then the lane's compile and run, a few
    # minutes over its two test files. Tighten from the first green run.
    timeout-minutes: 90
    name: CTF-P1b's GPUI story captures against the web layout
    steps:
      - name: Generate CI token
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.ci_token.outputs.token }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          attic-cache: ${{ vars.ATTIC_CACHE }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Restore every shard's CTF-P1b captures
        uses: actions/download-artifact@v4
        with:
          pattern: ctf-p1b-gpui-captures-*
          merge-multiple: true
          path: build

      - name: The captures lay the stories out as the web does
        run: nix develop .#devShells.x86_64-linux.default --command bash ci/lib/run-nim-test-lane.sh agent-harbor-gpui-captures

      - name: Upload the frames and the parity reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: ctf-p1b-gpui-layout
          path: |
            build/ctf-p1b/
            build/ctf-p1c/
          if-no-files-found: ignore
          retention-days: 7
