name: zgui front-end

# The `zgui` lane (`just test-zgui`): codetracer-zgui and its vocabulary
# binding, headless on zgui's own platform, on Linux (Mesa's software Vulkan
# driver) and on macOS (Metal). The lane builds isonim-zgui's shim from the
# sibling checkout with the dev shell's toolchain, builds codetracer-zgui
# against it, and runs the binding suite and the binary on the `calc`
# recording through a real replay-server.
#
# The Linux job records `calc` with `ct` (`just build-once` of its target) and
# hands the recording to the macOS job, which replays it with a replay-server
# built for macOS with cargo. The macOS job does not use `build-once`, so it
# does not depend on locks/arm64-macosx.lock keeping up with repro.lock
# (darwin-lock-resolve.yml re-solves that file on a macOS runner).
#
# isonim-zgui is private, so the public repro.lock can neither declare nor pin
# it (ci/test/sibling-provisioning-test.sh UNLOCKED_SIBLINGS); its revision is
# ci/toolchain.pin's PRIVATE_SIBLING_ISONIM_ZGUI, which each job reads.

on:
  push:
    branches: [agents, 'zgui-ci-*']
    paths:
      - 'src/frontend/zgui/**'
      - 'src/frontend/view_vocabulary/**'
      - '.github/workflows/zgui.yml'
      - 'ci/toolchain.pin'
      - 'src/frontend/stories/**'
      - 'storybook/stories/lib/**'
      - 'tools/story-parity/**'
      - 'scripts/story-parity.sh'
      - 'src/tests/visual/story-parity-floors.json'
  workflow_dispatch:

# On `agents`, a newer push must not cancel the running run: several agents
# land there every few minutes, so a cancelling group never let this lane
# finish on the mainline (run 45690347094 was cancelled that way). With
# cancel-in-progress off, GitHub keeps the running run plus ONE waiting run
# per branch, and each newer push replaces the waiting one, so the queue
# never grows past one and the run that starts next is always the newest
# commit that touched these paths. That is already the "skip a superseded
# run" behaviour; an in-job check could not do better, because a later push
# outside these paths starts no run of its own. The `zgui-ci-*` proof
# branches keep cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'agents' }}

jobs:
  linux:
    name: zgui lane (x86_64-linux)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 150
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # The token minted at the start can be over an hour old by here: the
      # checkout alone took 64 minutes on a macOS runner (run 44906061572), and
      # the sibling clone below then failed on the expired token.
      - name: Mint a token for the sibling setup
        id: setup_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.setup_token.outputs.token }}
          # The same cache settings as `Install Nix` above. This action
          # installs and configures Nix again, and without them the
          # configuration it writes names no Attic cache: on an ephemeral
          # runner, whose store starts empty, the dev shell the next step
          # realises is then built from source, which ran past the job's
          # whole budget.
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Mint a token for the clone below
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone isonim-zgui
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/isonim-zgui
          ref: agents
          path: ${{ github.workspace }}/../isonim-zgui
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Check out the pinned isonim-zgui revision
        run: |
          set -euo pipefail
          # Bash builtins only: the darwin runner has no sed before the dev shell.
          ISONIM_ZGUI_REV=""
          while IFS= read -r line; do
            [[ "$line" =~ ^PRIVATE_SIBLING_ISONIM_ZGUI=([0-9a-f]{40})$ ]] && ISONIM_ZGUI_REV="${BASH_REMATCH[1]}"
          done <ci/toolchain.pin
          [ -n "$ISONIM_ZGUI_REV" ] || { echo "::error::ci/toolchain.pin has no 40-hex PRIVATE_SIBLING_ISONIM_ZGUI"; exit 1; }
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" fetch --quiet origin "${ISONIM_ZGUI_REV}" || true
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" checkout --quiet --detach "${ISONIM_ZGUI_REV}"
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" log --oneline -1

      - name: Build ct (the calc fixture is recorded with ct)
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
        # Only the targets this lane needs: the whole build also captures the
        # book's screenshots, which needs the native recorder's ct_cli. `ct`
        # reads its default config and layout from the built tree, and
        # build-once refuses a `ct` without them, so they are built first (each
        # of those builds is refused for lacking the other, and that is fine).
        # `ct record` runs `db-backend-record` from the same tree; a persistent
        # runner can hold one from an earlier job, an ephemeral one has none
        # (run 44844246394: "Could not find command: …/db-backend-record").
        run: |
          nix develop . --command bash -c '
            for t in config-default-layout-json config-default-config-yaml; do
              CODETRACER_REPROBUILD_TARGET=".#$t" just build-once || true
            done
            CODETRACER_REPROBUILD_TARGET=".#ct-binary" just build-once
            CODETRACER_REPROBUILD_TARGET=".#db-backend-record" just build-once'

      - name: Build replay-server
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          # The trace writer's Nim build finds `results` only here. A warm
          # runner's ~/.nimble hides its absence; an ephemeral one has none
          # (run 44827340359: "cannot open file: results").
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          CODETRACER_REPROBUILD_TARGET: ".#replay-server"
        run: nix develop . --command just build-once

      - name: The zgui lane
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          # The runner's own nimcache: a shared /tmp/ct-nim-cache can belong to
          # another runner account on the same host.
          CT_NIM_CACHE_ROOT: ${{ runner.temp }}/ct-nim-cache
        run: nix develop . --command just test-zgui

      - name: Hand the calc recording to the macOS job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgui-calc-recording
          path: test-logs/tui-fixtures/calc-2f0db4f45192/
          include-hidden-files: true
          retention-days: 7

      - name: Upload the lane's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgui-lane-x86_64-linux
          path: test-logs/test-zgui.log
          retention-days: 30

  # The story-parity harness in a job of its own. In the lane it came after
  # `ct`, replay-server and the lane itself, which used 139 of the job's 150
  # minutes (run 45704429248: provisioning 25, ct 59, replay-server 11, the
  # lane 44), and was cancelled while it compiled. It needs none of them: it
  # builds the stylesheets, StoryBook's components and the shim itself.
  story-parity:
    name: zgui story parity (x86_64-linux)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 120
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # The token minted at the start can be over an hour old by here: the
      # checkout alone took 64 minutes on a macOS runner (run 44906061572), and
      # the sibling clone below then failed on the expired token.
      - name: Mint a token for the sibling setup
        id: setup_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.setup_token.outputs.token }}
          # The same cache settings as `Install Nix` above. This action
          # installs and configures Nix again, and without them the
          # configuration it writes names no Attic cache: on an ephemeral
          # runner, whose store starts empty, the dev shell the next step
          # realises is then built from source, which ran past the job's
          # whole budget.
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Mint a token for the clone below
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone isonim-zgui
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/isonim-zgui
          ref: agents
          path: ${{ github.workspace }}/../isonim-zgui
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Check out the pinned isonim-zgui revision
        run: |
          set -euo pipefail
          # Bash builtins only: the darwin runner has no sed before the dev shell.
          ISONIM_ZGUI_REV=""
          while IFS= read -r line; do
            [[ "$line" =~ ^PRIVATE_SIBLING_ISONIM_ZGUI=([0-9a-f]{40})$ ]] && ISONIM_ZGUI_REV="${BASH_REMATCH[1]}"
          done <ci/toolchain.pin
          [ -n "$ISONIM_ZGUI_REV" ] || { echo "::error::ci/toolchain.pin has no 40-hex PRIVATE_SIBLING_ISONIM_ZGUI"; exit 1; }
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" fetch --quiet origin "${ISONIM_ZGUI_REV}" || true
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" checkout --quiet --detach "${ISONIM_ZGUI_REV}"
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" log --oneline -1

      # The story-parity harness (scripts/story-parity.sh): every story in
      # tools/story-parity/stories.txt drawn by the DOM arm (CodeTracer's
      # Electron, on its own Xvfb) and by zgui, compared pixel by pixel. It
      # reports for now; `--check` against src/tests/visual/story-parity-floors.json
      # follows once the floors are taken from this job's own captures.
      - name: The story-parity harness
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_NIM_CACHE_ROOT: ${{ runner.temp }}/ct-nim-cache
        run: nix develop . --command just story-parity

      - name: Upload the story-parity captures and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-parity-x86_64-linux
          path: |
            build/story-parity/report.*
            build/story-parity/*/*/*.png
            build/story-parity/*/*/*.json
          retention-days: 30

  macos:
    name: zgui lane (aarch64-darwin)
    needs: linux
    runs-on: aarch64-darwin
    # The setup alone has taken 75 minutes here (a 42-minute checkout in run
    # 44935860183), the post-checkout cleanup up to 25 more, and a cold
    # replay-server build up to the 150 its step allows.
    timeout-minutes: 300
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive
          token: ${{ steps.ci_token.outputs.token }}

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      # The token minted at the start can be over an hour old by here: the
      # checkout alone took 64 minutes on a macOS runner (run 44906061572), and
      # the sibling clone below then failed on the expired token.
      - name: Mint a token for the sibling setup
        id: setup_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Setup db-backend siblings
        uses: ./.github/actions/setup-db-backend-siblings
        with:
          env-flavor: nix
          gh-token: ${{ steps.setup_token.outputs.token }}
          # The same cache settings as `Install Nix` above. This action
          # installs and configures Nix again, and without them the
          # configuration it writes names no Attic cache: on an ephemeral
          # runner, whose store starts empty, the dev shell the next step
          # realises is then built from source, which ran past the job's
          # whole budget.
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}

      - name: Provision dependency siblings from repro.lock
        uses: ./.github/actions/provision-repro-lock-siblings
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Mint a token for the clone below
        id: late_token
        uses: ./.github/actions/refresh-github-token
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}

      - name: Clone isonim-zgui
        uses: metacraft-labs/metacraft-github-actions/clone-repo@dev
        with:
          repo: metacraft-labs/isonim-zgui
          ref: agents
          path: ${{ github.workspace }}/../isonim-zgui
          gh-token: ${{ steps.late_token.outputs.token }}
          submodules: 'false'

      - name: Check out the pinned isonim-zgui revision
        run: |
          set -euo pipefail
          # Bash builtins only: the darwin runner has no sed before the dev shell.
          ISONIM_ZGUI_REV=""
          while IFS= read -r line; do
            [[ "$line" =~ ^PRIVATE_SIBLING_ISONIM_ZGUI=([0-9a-f]{40})$ ]] && ISONIM_ZGUI_REV="${BASH_REMATCH[1]}"
          done <ci/toolchain.pin
          [ -n "$ISONIM_ZGUI_REV" ] || { echo "::error::ci/toolchain.pin has no 40-hex PRIVATE_SIBLING_ISONIM_ZGUI"; exit 1; }
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" fetch --quiet origin "${ISONIM_ZGUI_REV}" || true
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" checkout --quiet --detach "${ISONIM_ZGUI_REV}"
          git -C "${GITHUB_WORKSPACE}/../isonim-zgui" log --oneline -1

      - name: The calc recording, from the Linux job
        uses: actions/download-artifact@v4
        with:
          name: zgui-calc-recording
          path: test-logs/tui-fixtures/calc-2f0db4f45192

      - name: Build replay-server
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          CT_EMULATOR_EXTRA_NIM_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          # The trace writer's Nim build finds `results` only here. A warm
          # runner's ~/.nimble hides its absence; an ephemeral one has none
          # (run 44827340359: "cannot open file: results").
          CODETRACER_TRACE_FORMAT_NIM_EXTRA_PATHS: ${{ github.workspace }}/libs/nim-stew/stew:${{ github.workspace }}/libs/nim-stew:${{ github.workspace }}/libs/nim-result
          # The paths above hold the trace writer's Nim packages, so its build
          # script need not reach the network for them.
          CODETRACER_TRACE_FORMAT_NIM_SKIP_NIMBLE_INSTALL: "1"
        # Run 44884214467 (attempt 2) spent 107 minutes here until the job's
        # budget cancelled it, and a cancelled job keeps no log. A step bound
        # fails the step instead. Run 44935860183 (attempt 3) then reached
        # that bound too, and the post-checkout cleanup ran the job past its
        # budget, so it lost its log all the same. The build therefore writes
        # its own log, with a process listing every five minutes that shows
        # whether cargo is compiling or waiting, and the upload below keeps it.
        #
        # A cold build is the cost: on m3, beside the other runners there,
        # half of the crates took 90 minutes. The checkout cleans the
        # workspace, so target/ under it is cold in every job; the target
        # directory therefore lives in the runner's home, where the next job
        # on this runner finds it warm, and the lane takes the binary from
        # there through REPLAY_SERVER_BIN.
        timeout-minutes: 150
        run: |
          set -euo pipefail
          target="$HOME/.cache/codetracer-zgui/db-backend-target"
          mkdir -p "$target"
          echo "REPLAY_SERVER_BIN=$target/debug/replay-server" >>"$GITHUB_ENV"
          export CARGO_TARGET_DIR="$target"
          mkdir -p test-logs
          # Inside the dev shell as a whole: the darwin runner has no grep,
          # cut or head before it (ci/test/sibling-provisioning-test.sh).
          nix develop . --command bash -c '
            set -euo pipefail
            log="$PWD/test-logs/replay-server-build.log"
            : >"$log"
            (
              while sleep 300; do
                echo "== $(date -u +%H:%M:%S) processes"
                # shellcheck disable=SC2009 # one listing filtered by several names
                ps -axo pid,etime,pcpu,rss,command | grep -E "[c]argo|[r]ustc|[n]ix|[n]im |[c]c |[c]lang|[l]d " | cut -c1-220 | head -25 || true
              done
            ) >>"$log" 2>&1 &
            heartbeat=$!
            trap "kill $heartbeat 2>/dev/null || true" EXIT
            cd src/db-backend
            cargo build --bin replay-server 2>&1 | tee -a "$log"
          '

      - name: The zgui lane
        env:
          CODETRACER_DB_BACKEND_SKIP_DIRENV: "1"
          # The runner's own nimcache: a shared /tmp/ct-nim-cache can belong to
          # another runner account on the same host.
          CT_NIM_CACHE_ROOT: ${{ runner.temp }}/ct-nim-cache
          # No recorder here. `calc` comes from the Linux job of this run, at
          # this commit and the recorder repro.lock pins, but the fixture
          # provider identifies a recorder by the content of its installed
          # package, native extension included, so the macOS build of the same
          # recorder never matches the Linux stamp, and the provider refused
          # the recording because it could not re-record it (run 45151089269).
          # This job records nothing and builds no `ct`; an interpreter that
          # cannot run the identity probe says so, and the provider keeps the
          # recording it was handed. It is set inside the shell: the dev
          # shell's hook points CODETRACER_PYTHON_INTERPRETER at its recorder
          # venv, over any value the step gives it (run 45196362876).
        run: nix develop . --command bash -c 'CODETRACER_PYTHON_INTERPRETER=/usr/bin/false exec just test-zgui'

      - name: Upload the lane's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zgui-lane-aarch64-darwin
          path: |
            test-logs/test-zgui.log
            test-logs/replay-server-build.log
          retention-days: 30
