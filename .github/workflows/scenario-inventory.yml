name: Scenario inventory and lint

# The scenario pack's two cheap whole-tree checks, on every push to `agents`:
#
#   * `ci/test/scenario-inventory.py`: every UI test file is classified in
#     src/tests/scenarios/inventory/inventory.tsv, every ported row names a
#     scenario that exists, and COUNTS matches the rows;
#   * `ci/test/scenarios.sh lint`: every scenario against the pack (no step may
#     reach application code), and the Playwright bindings parse.
#
# WHY A WORKFLOW OF ITS OWN, ON `agents`.
#
# `agents` is landed on directly (a fast-forward `git push --no-verify`), so no
# pull request and no pre-push hook stands between an author's commit and the
# branch. The only other job that runs these checks is tui-tests' scenario
# step, which codetracer.yml reaches on pushes to dev/stable and pull requests
# that are not into `agents`, i.e. only when `agents` is promoted. So a UI test
# landed without an inventory row was found days later, by whoever promoted
# (codetracer-pm issues/2026-11-21-four-new-ui-tests-are-missing-from-the-
# scenario-inventory.md, and nine more two days after it). These checks need
# no build: Python over the tree, and the DemoVideoScript linter compiled from
# its pinned source with a stock Nim. They take minutes, so the author of the
# push sees the red.
#
# The linter's sibling is DemoVideoScript at the revision the test lock pins
# (ci/test/siblings/repro.lock), cloned beside the checkout where
# scenarios.sh looks for it.

on:
  push:
    branches: [agents, dev, stable]
  pull_request:
    branches-ignore: [agents]
  workflow_dispatch:

# A push is checked as itself: `agents` takes several pushes an hour, and a
# group per branch with cancel-in-progress cancelled every run before a runner
# picked it up (the first five runs on agents, 2026-11-22), so no push was
# ever checked. A pull request's newer commit still replaces its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scenario-inventory:
    name: Scenario inventory and lint
    runs-on: [self-hosted, linux, x64]  # CIP-5 nix job: the linter needs Nim and Node from nixpkgs
    timeout-minutes: 20
    steps:
      - name: Mint installation token for cross-repo sibling access
        id: ci_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.CI_TOKEN_PROVIDER_APP_ID }}
          private-key: ${{ secrets.CI_TOKEN_PROVIDER_PRIVATE_KEY }}
          owner: metacraft-labs

      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ steps.ci_token.outputs.token }}
          persist-credentials: false

      - name: Install Nix
        uses: ./.github/actions/setup-nix
        with:
          trusted-public-keys: ${{ vars.ATTIC_TRUSTED_PUBLIC_KEY }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}
          substituters: ${{ vars.ATTIC_SUBSTITUTER }}
          gh-token: ${{ steps.ci_token.outputs.token }}

      - name: Every UI test is classified in the scenario inventory
        # The runner (NixOS) has no python3 of its own.
        run: nix shell nixpkgs#python3 --command python3 ci/test/scenario-inventory.py

      # The two checks report independently: an unclassified test must not
      # hide a scenario that no longer lints.
      - name: DemoVideoScript at the test lock's pin, beside the checkout
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          pin="$(grep -o 'name = "DemoVideoScript", coord_kind = "vcs", url = "[^"]*", revision = "[0-9a-f]*"' \
            ci/test/siblings/repro.lock | sed 's/.*revision = "//; s/"$//' | head -n 1)"
          test -n "${pin}"
          dest="$(dirname "${GITHUB_WORKSPACE}")/DemoVideoScript"
          rm -rf "${dest}"
          git clone --quiet https://github.com/metacraft-labs/DemoVideoScript "${dest}"
          git -C "${dest}" checkout --quiet --detach "${pin}"

      - name: Every scenario lints against the pack
        if: ${{ !cancelled() }}
        run: nix shell nixpkgs#nim nixpkgs#nodejs_22 --command bash ci/test/scenarios.sh lint
