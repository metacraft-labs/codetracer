name: Setup db-backend siblings
description: >
  Clone the sibling repositories required by ``src/db-backend``'s path
  dependencies (codetracer-trace-format, codetracer-trace-format-nim,
  codetracer-native-recorder), each at the revision pinned by the
  repo-workspaces workspace lock. This is a thin wrapper over the shared
  ``setup-dev-env`` action: it clones the three siblings adjacent to the
  host checkout (``../<name>``) and installs the ``dev-exec`` wrapper.

  Sibling cloning happens for every ``env-flavor``; the flavor decides only
  which dev environment is materialised alongside it. Nix itself is installed
  by ``setup-dev-env`` when ``env-flavor: nix``; jobs that already run their
  own ``setup-nix`` step can still call this action — installing Nix twice is
  idempotent.
inputs:
  env-flavor:
    description: >
      Which dev environment ``setup-dev-env`` should materialise alongside the
      sibling clones: ``nix``, ``windows-diy`` or ``reprobuild``.

      THERE IS NO DEFAULT, AND THAT IS THE POINT. This action hard-coded
      ``nix`` for all of its callers, and ``nix`` cannot be installed on a
      Windows runner at all: ``DeterminateSystems/nix-installer-action`` has no
      Windows platform mapping, so the step aborts with "ArchOs (X64-Windows)
      doesn't map to a supported Nix platform" before the calling job runs a
      single step of its own. Windows callers pass ``windows-diy``, which
      sources the repo's ``env.ps1``. A caller that says nothing gets an empty
      value, which ``setup-dev-env``'s own ``Validate env-flavor`` step
      rejects by name — a loud failure rather than a silently wrong platform.

      ``ci/test/windows-runner-bootstrap-test.sh`` fails if a job on a Windows
      runner reaches this action with the ``nix`` flavor.
    required: true
  gh-token:
    description: GitHub token with access to sibling repositories.
    required: true
  substituters:
    description: Optional Nix substituters forwarded to setup-dev-env.
    required: false
    default: ""
  trusted-public-keys:
    description: Optional Nix trusted-public-keys forwarded to setup-dev-env.
    required: false
    default: ""
  extra-siblings:
    description: >
      Additional `siblings:` entries, in `clone-siblings` syntax
      (`[owner/]name[=ref]`, whitespace- or newline-separated), appended to the
      three db-backend siblings this action always provisions.

      THIS EXISTS SO THAT A JOB WHICH NEEDS ONE MORE SIBLING DOES NOT HAND-ROLL
      THE WHOLE LIST. `cross-repo-tests.yml`'s `shell-recorder-tests` did
      exactly that: it needed `codetracer-shell-recorders`, so it called
      `setup-dev-env` directly with a three-entry list derived from the shell
      recorders' own path dependencies -- and omitted
      `codetracer-native-recorder`, which is not a shell-recorder dependency at
      all but an unconditional one of `src/db-backend/build.rs`. The job then
      compiled the entire tree-sitter dependency tree before panicking with
      "db-backend requires the sibling `codetracer-native-recorder` checkout,
      and it was not found" (run 32995543471). Composing with this input keeps
      the db-backend set defined in one place, which is this action's whole
      reason to exist.

      `ci/test/sibling-provisioning-test.sh` asserts that every job running
      cargo against `src/db-backend` provisions `codetracer-native-recorder`.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Setup dev env (clone db-backend siblings + materialise the dev env)
      # setup-dev-env clones each sibling to ../<name> at its pinned `dev`
      # ref. The refs are explicit because a bare entry resolves through a
      # per-commit workspace lock in the shared manifests repo, which has
      # published nothing since 2026-08-02 -- see the note at the top of
      # .github/workflows/codetracer.yml. This composite is used by six jobs,
      # and every one of them died in this step until the refs were pinned.
      # codetracer-native-recorder /
      # codetracer-trace-format / codetracer-trace-format-nim have no
      # .gitmodules; the recursive-submodule update is best-effort and a
      # no-op for them. The bespoke "direnv allow" fixup that used to live
      # here is left to the calling jobs (only the db-backend build.rs path
      # needs it, and those jobs already perform it).
      uses: metacraft-labs/metacraft-github-actions/setup-dev-env@dev
      with:
        env-flavor: ${{ inputs.env-flavor }}
        gh-token: ${{ inputs.gh-token }}
        substituters: ${{ inputs.substituters }}
        trusted-public-keys: ${{ inputs.trusted-public-keys }}
        # `clone-siblings` tokenises this value on whitespace after stripping
        # `#` comments, so an empty `extra-siblings` contributes nothing and a
        # multi-line one needs no particular indentation.
        siblings: |
          codetracer-trace-format=dev
          codetracer-trace-format-nim=dev
          codetracer-native-recorder=dev
          ${{ inputs.extra-siblings }}
