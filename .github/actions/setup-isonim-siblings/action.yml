name: Setup isonim siblings
description: |
  Clone the IsoNim-family sibling repos (isonim, isonim-tui, isonim-gpui,
  nim-everywhere, nim-termctl, nim-pty, nim-acp, nim-agent-harbor,
  nim-agents) next to the codetracer checkout so the Nim builds can
  resolve

    addPathIfDir(workspaceRoot / "isonim/src")   (et al.)

  as declared in codetracer's top-level ``config.nims``. Also seeds an
  empty ``build/tailwind-styles.json`` in the isonim checkout so
  ``isonim/dsl/tailwind.nim``'s compile-time staticRead falls through to
  its ``{}`` fallback instead of erroring out (its ``try/except``
  wrapper cannot catch ``staticRead`` errors).

  In-sandbox Nix derivations stage these inputs through
  ``prepareIsonimSiblings`` in ``nix/packages/default.nix``; this action
  is for workflow steps that run nim *outside* the Nix sandbox
  (dev-build, appimage-build, ...).

  THIS ACTION CLONES NOTHING ITSELF. It is a wrapper: the sibling names
  go to the shared ``clone-siblings`` action, which is the single
  approved mechanism for "what revision of sibling repo X does this
  commit use?" (see the NO SECOND SIBLING-CLONING ACTION note at the top
  of metacraft-github-actions/clone-siblings/action.yml, and
  codetracer-specs/Testing/Cross-Repo-CI-Integration.md). It used to be
  nine hand-rolled clone steps at a hard-coded ``ref: dev`` — a second
  cloning implementation that no lock, no warning and no audit could
  see. ``ci/test/sibling-provisioning-test.sh`` now fails if a composite
  action in this repo grows one again.

  ``clone-siblings`` is called directly rather than through
  ``setup-dev-env`` (the shape ``setup-db-backend-siblings`` uses)
  because most of this action's call sites run it BEFORE their own
  ``Install Nix`` step, and one runs only on the macOS leg.
  ``setup-dev-env`` would install Nix as a side effect of cloning nine
  repos, which is a change to those jobs' setup order rather than to
  their sibling provisioning. ``setup-dev-env`` delegates sibling
  cloning to ``clone-siblings`` anyway, so this is the same mechanism
  with one less side effect.

  WHY BARE NAMES. Each entry below is a bare repo name, so
  ``clone-siblings`` resolves its revision from the per-commit workspace
  lock published for this commit to
  ``metacraft-labs/metacraft-manifests@latest``. That is the whole point
  of routing sibling provisioning through one action: re-running an old
  commit's job clones the siblings THAT commit was built against, and a
  matched set of repos stays matched.

  These entries carried ``=dev`` overrides for a while, and that was a
  branch-tip pin: the revision was whatever ``dev`` happened to point at
  when the job ran, so the same commit built against different siblings
  on every re-run and ``clone-siblings`` emitted a ``::warning::`` per
  entry saying so. The overrides existed because lock publication for
  this repo had lapsed and because the IsoNim-family repos were not yet
  members of codetracer's workspace project, so a bare entry failed the
  job outright. Both are fixed: the project declares them and the lock
  pins all nine.

  ``ci/test/sibling-provisioning-test.sh`` fails if any entry in this
  block regrows a ``=<branch>`` suffix.

inputs:
  gh-token:
    description: GitHub App token used to clone the sibling repos.
    required: true

runs:
  using: composite
  steps:
    - name: Clone isonim siblings
      uses: metacraft-labs/metacraft-github-actions/clone-siblings@dev
      with:
        gh-token: ${{ inputs.gh-token }}
        # A BARE entry resolves its revision from the workspace lock. An entry
        # of the form `name=ref` SKIPS the lock and clones `ref` directly.
        #
        # PIN ONLY WHAT THE LOCK CANNOT ANSWER FOR. Every bare entry below is
        # bare on purpose: the lock pins it, and a lock pin is the reproducible
        # answer. Adding `=dev` to one of those would silently trade a pinned
        # revision for a moving branch tip — a real loss of reproducibility,
        # and invisible, because CI would go on passing.
        #
        # ALL NINE ARE BARE, and that is new. Five of them — isonim,
        # isonim-tui, isonim-gpui, nim-termctl, nim-pty — carried `=dev` until
        # metacraft-manifests@8ddec34f, because they were not members of
        # codetracer's project there, so the lock had nothing to say about them
        # and a bare entry failed the step outright:
        #
        #   The workspace lock for codetracer@<sha> pins no revision for these
        #   sibling(s): isonim isonim-tui isonim-gpui nim-termctl nim-pty
        #
        # That failure took out ~15 jobs on every pull request — dev-build,
        # nix-build, test-non-gui, test-ui-tests, appimage-build and the
        # ct-test gates — because they all reach this action through
        # `Setup dev env`.
        #
        # TWO changes were needed, and only the first had been made. The
        # project declaration (3c625e7) covered isonim and runquota; the other
        # four stayed undeclared, and — the part that made the first look
        # ineffective — declaring a repo does not put it in a lock.
        # `publish-workspace-lock.yml` re-anchors each mainline commit's lock
        # from its PARENT, copying the repo SET verbatim, so the 99-repo
        # lineage in flight simply never grew the new members. The lock for dev
        # HEAD 79275598, published after that declaration, still pinned none of
        # them. metacraft-manifests@8ddec34f declares the remaining four AND
        # seeds that lock with all six, so the carry propagates them from here
        # on.
        siblings: |
          isonim
          isonim-tui
          isonim-gpui
          nim-termctl
          nim-pty
          nim-everywhere
          nim-acp
          nim-agent-harbor
          nim-agents

    - name: Seed isonim tailwind-styles.json placeholder
      shell: bash
      run: |
        mkdir -p "${{ github.workspace }}/../isonim/build"
        if [ ! -f "${{ github.workspace }}/../isonim/build/tailwind-styles.json" ]; then
          echo '{}' > "${{ github.workspace }}/../isonim/build/tailwind-styles.json"
        fi
