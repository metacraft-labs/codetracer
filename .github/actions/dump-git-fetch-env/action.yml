name: Dump the git fetch environment
description: >-
  Print, immediately before a `nix develop`, exactly what git config would be
  applied to a github.com fetch — and probe one public repo with and without
  that config, so a failure to fetch it names its own cause.

inputs:
  gh-token:
    description: >-
      Installation token, used ONLY to send two authenticated probes as paired
      controls against the anonymous one. Never printed. Optional: without it
      the anonymous probe still runs and the controls say they were skipped.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # -----------------------------------------------------------------------
    # WHY THIS EXISTS, AND WHY IT IS UNCONDITIONAL
    #
    # The whole `lint-*` stage dies inside `nix develop`, before a single lint
    # runs, on every run for an unknown period:
    #
    #   error: Failed to fetch git repository https://github.com/anza-xyz/crossbeam
    #   fatal: could not read Username for 'https://github.com': No such device or address
    #
    # `anza-xyz/crossbeam`, `mystenlabs/tidehunter` and `facebook/yoga` are all
    # PUBLIC and fetch anonymously at 200 from a workstation. Three explanations
    # have been proposed and all three were DISPROVEN by measurement:
    #
    #   * `actions/checkout`'s global `http.<url>.extraheader`. It redefines
    #     HOME first ("Temporarily overriding HOME=.../_temp/<uuid>"), so its
    #     `--global` writes land in a throwaway gitconfig this step never reads.
    #   * nix's `access-tokens github.com=`. Tested: `builtins.fetchGit` over an
    #     uncached public repo returns the same rev with and without a foreign
    #     token set, so nix does not inject it into plain `https://` git fetches.
    #   * a pinned rev that no longer exists. Tested: that produces
    #     `Cannot find Git revision …`, a different error entirely.
    #
    # So the cause is something about the RUNNER that no log so far records.
    # Guessing a fourth time is not worth anyone's hour; this measures instead.
    #
    # UNCONDITIONAL, and not behind a `if: runner.debug` or a repo variable. A
    # diagnostic nobody switches on is a diagnostic that reports nothing, which
    # is the defect shape this whole campaign is about. It costs about a second
    # and a screen of log.
    #
    # IT CANNOT REDDEN A JOB. Every command is `|| true` and the step ends in
    # `exit 0`. A diagnostic that fails the thing it is diagnosing would be
    # removed within a day, and then the next person has neither.
    #
    # IT CANNOT LEAK A CREDENTIAL. Values are never printed — only key names,
    # their ORIGIN file, a byte length and a truncated SHA-256. That is enough
    # to tell "the same header as last run" from "a different one" and enough to
    # find the file that carries it, and it stays safe if the credential came
    # from the runner image rather than from a masked secret. GitHub's own
    # masking cannot help there: it only redacts values it was told about.
    # -----------------------------------------------------------------------
    - name: Dump the git fetch environment
      shell: bash
      env:
        # Through the environment, never a command line, and never echoed.
        DGFE_GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set +e

        probe_repo="https://github.com/anza-xyz/crossbeam"

        echo "=== identity ==================================================="
        echo "user           : $(id -un 2>/dev/null) (uid $(id -u 2>/dev/null))"
        echo "HOME           : ${HOME:-<unset>}"
        echo "git            : $(git --version 2>/dev/null)"

        echo
        echo "=== git config files that exist ================================"
        for f in /etc/gitconfig "${HOME}/.gitconfig" "${HOME}/.config/git/config"; do
          if [ -f "${f}" ]; then
            echo "present : ${f}  ($(wc -c <"${f}" | tr -d ' ') bytes)"
          else
            echo "absent  : ${f}"
          fi
        done

        echo
        echo "=== every http.* key git can see, BY NAME AND ORIGIN ==========="
        # `--name-only` so no value is ever printed. The origin is the point:
        # it names the FILE a credential came from, which is what distinguishes
        # "the image ships one" from "a previous step wrote one".
        keys="$(git config --list --show-origin --name-only 2>/dev/null \
          | grep -iE 'http\.|url\.|credential')"
        if [ -n "${keys}" ]; then
          # REDACT CREDENTIALS THAT LIVE IN THE KEY NAME ITSELF.
          #
          # This block deliberately prints names and never values, on the
          # reasoning that a name cannot carry a secret. That reasoning stops
          # holding the moment anyone authenticates git the way nix's fetcher
          # actually honours it. Measured on nix 2.25: the fetcher respects
          # `url.<...>.insteadOf` from the user's git config and IGNORES
          # `http.<...>.extraHeader` -- so the only rewrite that can
          # authenticate a `builtins.fetchGit` is
          #
          #     url."https://x-access-token:<TOKEN>@github.com/".insteadOf
          #
          # which puts the token INSIDE the key name, where this loop would
          # print it in full. Strip any `user:pass@` from the names so that
          # adopting that fix cannot silently turn this diagnostic into the
          # leak. Done here rather than at the call site because the next
          # person to add a `--name-only` dump will copy this block.
          printf '%s\n' "${keys}" \
            | sed -E 's#://[^/@[:space:]]*:[^/@[:space:]]*@#://<redacted>@#g' \
            | sed 's/^/  /'
        else
          echo "  (none — git has no http./url./credential keys from any file)"
        fi

        echo
        echo "=== what git would ACTUALLY apply to ${probe_repo} ============="
        # `--get-urlmatch` is the decisive query: it asks git to resolve its
        # URL-matching rules for this exact URL, rather than us reading config
        # and reasoning about longest-prefix ourselves. Reasoning about that
        # instead of asking is how the last explanation went wrong.
        urlmatch="$(git config --get-urlmatch http "${probe_repo}" 2>/dev/null)"
        if [ -n "${urlmatch}" ]; then
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            key="${line%% *}"
            val="${line#* }"
            # A truncated digest, never the value: enough to compare two runs
            # and to tell two different credentials apart, useless to anyone
            # reading the log. `shasum` is the fallback for images without
            # `sha256sum`.
            digest="$(printf '%s' "${val}" | { sha256sum 2>/dev/null || shasum -a 256 2>/dev/null; } | cut -c1-12)"
            printf '  %s = <%s bytes, sha256:%s>\n' "${key}" "${#val}" "${digest:-?}"
          done <<<"${urlmatch}"
        else
          echo "  (none — git would send no http.* configuration for this URL)"
        fi

        echo
        echo "=== nix's view ================================================="
        # Redacted after the `=`: `access-tokens` carries the token itself.
        nix config show 2>/dev/null \
          | grep -iE 'access-tokens|netrc-file|substituters' \
          | sed -E 's/(access-tokens = ).*/\1<redacted>/' | sed 's/^/  /' || true

        echo
        echo "=== THE COMPARISON THAT DECIDES IT ============================="
        # Two fetches of the same PUBLIC repo, differing ONLY in whether git's
        # own configuration is in play. That is the only variable, so that is
        # the only thing these two can speak about:
        #
        #   config fails, isolated succeeds -> git configuration is sufficient
        #                                      to break it; the origin listing
        #                                      names the candidate files.
        #   BOTH fail                       -> git configuration is NOT what
        #                                      breaks it. Nothing more. In
        #                                      particular this says nothing
        #                                      about whether the host can reach
        #                                      github.com — probes A-E do that,
        #                                      and probe A once returned 200 in
        #                                      the same log where this arm had
        #                                      concluded "egress".
        #   BOTH succeed                    -> git is fine and the fault is
        #                                      inside nix's own fetcher, so look
        #                                      there and not at git config.
        GIT_TERMINAL_PROMPT=0 timeout 60 \
          git ls-remote "${probe_repo}" HEAD >/dev/null 2>/tmp/gfe-a.txt
        rc_config=$?

        GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null timeout 60 \
          git ls-remote "${probe_repo}" HEAD >/dev/null 2>/tmp/gfe-b.txt
        rc_isolated=$?

        if [ "${rc_config}" -eq 0 ]; then
          echo "  with this runner's git config : OK"
        else
          echo "  with this runner's git config : FAILED ($(head -1 /tmp/gfe-a.txt))"
        fi
        if [ "${rc_isolated}" -eq 0 ]; then
          echo "  with NO git config at all     : OK"
        else
          echo "  with NO git config at all     : FAILED ($(head -1 /tmp/gfe-b.txt))"
        fi

        echo
        # AN INSTRUMENT MAY REPORT WHAT IT SAW. THE MOMENT IT REPORTS WHAT THAT
        # IMPLIES, IT CAN BE WRONG IN A WAY A VERDICT LINE MAKES INVISIBLE.
        #
        # This block used to end its `both failed` arm with "This runner cannot
        # fetch a public github.com repo anonymously at all … look at egress:
        # IP-level rate limiting or a blocking proxy." It printed that, in a log
        # that ALSO contained probe A below returning `HTTP/2 200` anonymously
        # for the very same repository, seconds apart on the same host. The
        # observation was right and the inference was wrong: two failing `git`
        # invocations say something about git, and nothing whatever about
        # whether this host can reach github.com. That is what probe A measures,
        # and it disagreed.
        #
        # So these arms now state the OBSERVATION and hand the question on. The
        # temptation is specifically in the arm you expect not to take — it gets
        # the least scrutiny and is the one that fires when your model is
        # already wrong.
        if [ "${rc_config}" -ne 0 ] && [ "${rc_isolated}" -eq 0 ]; then
          echo "  OBSERVED: git fails WITH this runner's config and succeeds"
          echo "            WITHOUT it, so something in git configuration is"
          echo "            sufficient to break it. The origin listing above"
          echo "            names the files it could have come from."
        elif [ "${rc_config}" -ne 0 ] && [ "${rc_isolated}" -ne 0 ]; then
          echo "  OBSERVED: git is refused either way, so git CONFIGURATION is"
          echo "            not what breaks it."
          echo "            Whether this host can reach github.com at all is a"
          echo "            SEPARATE question that these two probes cannot"
          echo "            answer. Probes A-E below answer it. Do not conclude"
          echo "            'egress' from this line; that inference was made"
          echo "            here once and probe A refuted it in the same log."
        elif [ "${rc_config}" -eq 0 ]; then
          echo "  OBSERVED: plain git can fetch this repo from this runner."
          echo "            If nix still cannot, look at nix's own fetcher"
          echo "            rather than at git configuration."
        fi

        echo
        echo "=== WHAT GITHUB ACTUALLY SAYS, AND WHY ========================="
        # `git` reports every refusal as "could not read Username", which is
        # what it does with any 401 — it cannot tell you WHY it was challenged.
        # GitHub says why in the response headers, and git throws them away.
        #
        # 401 vs 403 vs 429 are three different causes with three different
        # remedies (credentials, abuse blocking, per-IP rate limiting), and
        # `x-ratelimit-remaining` / `retry-after` separate the last two.
        # `x-github-request-id` is the value GitHub Support cannot proceed
        # without, so it is captured now rather than after a round trip.
        #
        # THREE PROBES, SAME RUNNER, SAME SECOND. The anonymous one alone
        # cannot distinguish "GitHub refuses us" from "github.com is
        # unreachable from this host", so it is paired with two authenticated
        # controls:
        #
        #   A  anonymous     -> a PUBLIC third-party repo   (the failing case)
        #   B  authenticated -> the SAME public repo         (does an
        #                       authenticated path fix third-party fetches?
        #                       that is one of the two candidate remedies)
        #   C  authenticated -> a metacraft-labs repo        (proves the host
        #                       can reach github.com and the token is good)
        #
        # If A is 401/403/429 while C is 200, github.com is plainly reachable
        # and it is ANONYMOUS access that is being refused. If B is also 200,
        # authenticating third-party fetches is a remedy that would work.
        gh_headers() {
          # $1 = label, $2 = url, $3 = 1 to authenticate, $4 = 1 to present as git
          local label="$1" url="$2" auth="$3" as_git="${4:-0}" out
          local -a ua=()
          if [ "${as_git}" = "1" ]; then
            # PRESENT AS GIT, not as a browser. GitHub can distinguish an
            # ordinary HTTPS GET from a git-protocol operation, and the two do
            # not share a rate-limit budget. `curl` defaulting to its own
            # User-Agent is why probes A-C say nothing about what `git` is
            # subjected to on the same host.
            ua=(-A "git/2.39.5" -H "Git-Protocol: version=2")
          fi
          if [ "${auth}" = "1" ]; then
            if [ -z "${DGFE_GH_TOKEN}" ]; then
              printf '  %-34s SKIPPED (no token supplied to this action)\n' "${label}"
              return 0
            fi
            # `-K -` reads the header from stdin, so the credential never
            # appears in argv where anything reading /proc could see it.
            out="$(printf 'header = "Authorization: Basic %s"\n' \
              "$(printf 'x-access-token:%s' "${DGFE_GH_TOKEN}" | base64 | tr -d '\n')" \
              | curl -sS -K - -o /dev/null -D - -w 'resolved-ip: %{remote_ip}\n' \
                  --max-time 30 ${ua[@]+"${ua[@]}"} "${url}" 2>&1)"
          else
            out="$(curl -sS -o /dev/null -D - -w 'resolved-ip: %{remote_ip}\n' \
              --max-time 30 ${ua[@]+"${ua[@]}"} "${url}" 2>&1)"
          fi
          printf '  %s\n' "${label}"
          printf '%s\n' "${out}" \
            | grep -iE '^HTTP/|^x-ratelimit|^retry-after|^x-github-request-id|^resolved-ip' \
            | tr -d '\r' | sed 's/^/      /'
        }

        refs_path=".git/info/refs?service=git-upload-pack"
        pub="https://github.com/anza-xyz/crossbeam${refs_path}"
        own="https://github.com/metacraft-labs/codetracer${refs_path}"
        if command -v curl >/dev/null 2>&1; then
          gh_headers "A  anon,  browser-UA -> anza-xyz/crossbeam (public)" "${pub}" 0 0
          gh_headers "B  auth,  browser-UA -> anza-xyz/crossbeam (public)" "${pub}" 1 0
          gh_headers "C  auth,  browser-UA -> metacraft-labs/codetracer     " "${own}" 1 0
          gh_headers "D  anon,  GIT-UA     -> anza-xyz/crossbeam (public)" "${pub}" 0 1
          gh_headers "E  auth,  GIT-UA     -> anza-xyz/crossbeam (public)" "${pub}" 1 1
        else
          echo "  SKIPPED — no curl on this runner."
        fi

        echo
        echo "=== THE REQUEST NOBODY HAS MEASURED: THE UPLOAD-PACK POST ======"
        # EVERY PROBE ABOVE ASKS THE WRONG QUESTION, AND THE TRACE BELOW SAYS SO.
        #
        # A smart-HTTP fetch is TWO requests, not one:
        #
        #   1. GET  /<repo>/info/refs?service=git-upload-pack   (ref advertisement)
        #   2. POST /<repo>/git-upload-pack                     (the negotiation)
        #
        # Probes A-E, and the `probe_repo` URL at the top of this action, all
        # exercise ONLY request 1. The `GIT_TRACE_CURL` slice below records
        # `<= Recv header: HTTP/2 200` for request 1 and then shows git sending
        # request 2 -- and the `head` cap on that slice has been cutting the
        # response to request 2 off the end of the dump every single time.
        #
        # So the sentence "five HTTPS requests to this exact info/refs succeed
        # while git is challenged" was never a paradox. Nothing had asked GitHub
        # about the POST. `git` prompts for a username on exactly one trigger --
        # an HTTP 401 -- and since request 1 demonstrably returns 200, the 401
        # can only be on request 2.
        #
        # These two probes send a real protocol-v2 `ls-refs` body, so GitHub
        # answers them the way it answers git rather than rejecting them as
        # malformed. (A wrong packet-line length gets a 400 and means nothing;
        # the lengths below are the byte counts of the lines that follow them.)
        #
        # READINGS FIXED IN ADVANCE:
        #
        #   F 401/403/429 while D is 200
        #       -> CONFIRMED: the refusal is on the negotiation POST, which is
        #          the expensive half and the half a rate limiter would meter.
        #          The headers here name which limit. If G (the same POST with
        #          credentials) is 200, authenticating is the remedy and this
        #          job's own token is enough to implement it.
        #
        #   F 200 as well
        #       -> the POST is NOT refused when curl makes it, so the difference
        #          is between curl and git rather than between GET and POST, and
        #          the next measurement belongs inside git. Say that instead of
        #          reaching for the rate-limit story a second time.
        #
        #   F 200 AND the `git ls-remote` above succeeded
        #       -> nothing was reproduced on this VM at all. Report that; a
        #          green run cannot speak about the red one.
        upload_pack_post() {
          # $1 = label, $2 = repo base url, $3 = 1 to authenticate
          local label="$1" base="$2" auth="$3" out body
          # protocol-v2 `ls-refs`. Each 4-hex prefix counts itself plus the
          # line: 0014 = 20 = 4 + len("command=ls-refs\n").
          body="$(printf '0014command=ls-refs\n0015agent=git/2.39.5\n00010009peel\n0000')"
          if [ "${auth}" = "1" ]; then
            if [ -z "${DGFE_GH_TOKEN}" ]; then
              printf '  %-34s SKIPPED (no token supplied to this action)\n' "${label}"
              return 0
            fi
            out="$(printf 'header = "Authorization: Basic %s"\n' \
              "$(printf 'x-access-token:%s' "${DGFE_GH_TOKEN}" | base64 | tr -d '\n')" \
              | curl -sS -K - -o /dev/null -D - -w 'resolved-ip: %{remote_ip}\n' \
                  --max-time 30 -A 'git/2.39.5' \
                  -H 'Git-Protocol: version=2' \
                  -H 'Content-Type: application/x-git-upload-pack-request' \
                  --data-binary "${body}" \
                  "${base}/git-upload-pack" 2>&1)"
          else
            out="$(curl -sS -o /dev/null -D - -w 'resolved-ip: %{remote_ip}\n' \
              --max-time 30 -A 'git/2.39.5' \
              -H 'Git-Protocol: version=2' \
              -H 'Content-Type: application/x-git-upload-pack-request' \
              --data-binary "${body}" \
              "${base}/git-upload-pack" 2>&1)"
          fi
          printf '  %s\n' "${label}"
          printf '%s\n' "${out}" \
            | grep -iE '^HTTP/|^x-ratelimit|^retry-after|^x-github-request-id|^resolved-ip' \
            | tr -d '\r' | sed 's/^/      /'
        }

        if command -v curl >/dev/null 2>&1; then
          upload_pack_post "F  anon,  POST upload-pack -> anza-xyz/crossbeam" \
            "https://github.com/anza-xyz/crossbeam" 0
          upload_pack_post "G  auth,  POST upload-pack -> anza-xyz/crossbeam" \
            "https://github.com/anza-xyz/crossbeam" 1
        else
          echo "  SKIPPED — no curl on this runner."
        fi

        echo
        echo "=== WHAT EACH OUTCOME MEANS, SAID IN ADVANCE ==================="
        # Written before the run, so the reading cannot be fitted to whatever
        # comes back. D is the discriminator: it is the ONLY probe that differs
        # from A in nothing but presenting as git.
        #
        #   D 401/403/429 while A is 200
        #       -> GitHub is refusing UNAUTHENTICATED GIT specifically. It meters
        #          git-protocol operations separately from ordinary HTTPS GETs
        #          and answers an exhausted budget with a challenge. A saturated
        #          shared-NAT CI pool is exactly the shape that hits it. Then E
        #          decides the remedy: if E is 200, authenticating third-party
        #          fetches works ON GIT'S OWN PATH and is implementable here.
        #
        #   D 200, same as A
        #       -> The difference is NOT what GitHub does with a git-shaped
        #          request, so it is inside this runner's git binary or how it
        #          is invoked. Next step is `GIT_TRACE_CURL=1` on the failing
        #          `git ls-remote`, with `Authorization` filtered out of the
        #          dump, to see the request git actually sends and the response
        #          it actually gets.
        #
        #   D 200 AND the `git ls-remote` above succeeded
        #       -> The failure is intermittent, and every conclusion drawn from
        #          a single observation of it is unsafe. Say so rather than
        #          picking whichever run agrees with you.
        echo "  (see the comment block in this action; the readings were fixed"
        echo "   before the probes ran, so they cannot be fitted afterwards)"

        echo
        echo "=== WHAT GIT ITSELF SENDS AND RECEIVES ========================="
        # THE FIRST MEASUREMENT THAT LOOKS INSIDE GIT RATHER THAN AROUND IT.
        #
        # Four explanations have been proposed for the `could not read
        # Username` failure. THREE are disproven by measurement: checkout's
        # global extraheader (written under a temporary HOME), nix's
        # `access-tokens` (not applied to plain https git fetches), and a rev
        # that no longer exists (a different error entirely).
        #
        # THE FOURTH -- GitHub metering unauthenticated git -- WAS NOT
        # DISPROVEN, AND THIS COMMENT USED TO CLAIM IT WAS. The claim rested on
        # probe D returning 200 "presenting as git", and on the observation that
        # five HTTPS requests to this exact `info/refs` succeed while
        # `git ls-remote` of the same URL on the same host in the same second is
        # challenged. Every one of those requests is the GET half of a fetch.
        # A fetch is a GET *and* a POST to `/git-upload-pack`, git prompts for a
        # username on an HTTP 401 and on nothing else, and the GET is recorded
        # at 200 right here -- so the 401 was always on the POST, which nothing
        # in this action measured until probes F and G above were added.
        #
        # The lesson is the one this file already preaches and then broke: the
        # arm that says "your model is fine" gets the least scrutiny. An
        # instrument that probes the wrong request will keep returning 200
        # forever, and each 200 makes the wrong conclusion feel better supported.
        #
        # So: stop reasoning about what git might be doing and read what it
        # does. `GIT_TRACE_CURL` prints the request line, every request and
        # response header, redirects, and the connection details.
        #
        # READINGS FIXED IN ADVANCE, so the trace cannot be fitted afterwards:
        #
        #   `<= Recv header: HTTP/... 401`
        #       -> GitHub challenged GIT's actual request while answering the
        #          same URL 200 to curl with the same User-Agent. The
        #          `=> Send header` lines then say what differs about it; that
        #          difference is the defect.
        #
        #   `<= Recv header: HTTP/... 200` and git still prompts
        #       -> A DIFFERENT DEFECT. The challenge is not on ref discovery at
        #          all; git got its 200 and something after it asked for
        #          credentials. Look at what follows the 200 in the trace, not
        #          at the request.
        #
        #   a `Connected to github.com (ADDR)` that differs from the
        #   `resolved-ip` curl reported above
        #       -> curl and git are not reaching the same host. Resolution or
        #          routing, and nobody has to theorise about it.
        #
        #   no `Connected to` line at all
        #       -> it never got to HTTP. DNS or TLS, before any of this.
        #
        # `Authorization` and `Cookie` lines are dropped below. Git redacts
        # `Authorization` in this trace itself, but a filter that depends on
        # another tool's redaction is not a filter.
        GIT_TRACE_CURL=1 GIT_TRACE_CURL_NO_DATA=1 GIT_TERMINAL_PROMPT=0 \
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
          timeout 60 git ls-remote "${probe_repo}" HEAD \
          >/dev/null 2>/tmp/gfe-trace.txt
        rc_trace=$?
        echo "  git ls-remote exit status: ${rc_trace}"
        # THREE SLICES WITH THEIR OWN BUDGETS, not one `head` over everything.
        # A TLS handshake is thirty lines of chatter and would push the HTTP
        # exchange — the only part that answers the question — off the end of a
        # single truncated dump. A diagnostic that truncates away its own
        # subject is the shape this file exists to avoid.
        trace_strip() {
          grep -aivE 'authorization|cookie' \
            | sed -E 's/^[0-9:.]+ +[a-z_]+\.c:[0-9]+ +//' | sed 's/^/      /'
        }
        echo "  --- who git connected to (compare with resolved-ip above) ---"
        grep -aE '== Info: (Connected to|Host .* was resolved|Trying |IPv4:|IPv6:)' \
          /tmp/gfe-trace.txt | head -8 | trace_strip
        echo "  --- what git SENT (Authorization/Cookie removed) ---"
        grep -a '=> Send header' /tmp/gfe-trace.txt | head -25 | trace_strip
        echo "  --- what git RECEIVED ---"
        # NOT `head -25`. That cap was the reason this trace never answered the
        # question it was added for: a fetch is a GET followed by a POST, the
        # GET's 200 plus its response headers alone exceed 25 lines, and so the
        # POST's status -- the only line that could explain the credential
        # prompt -- was cut off the end of every dump this action has ever
        # produced. Filter to the status lines and keep ALL of them, so both
        # halves of the exchange are always visible.
        echo "      (status lines from every response, both the GET and the POST)"
        grep -a '<= Recv header' /tmp/gfe-trace.txt \
          | grep -aiE 'HTTP/' | trace_strip
        echo "      --- full headers, first response ---"
        grep -a '<= Recv header' /tmp/gfe-trace.txt | head -25 | trace_strip
        echo "  --- git's own error ---"
        grep -av 'trace:' /tmp/gfe-trace.txt | grep -aiE 'fatal|error|warning' \
          | grep -aivE 'authorization|cookie' | head -5 | sed 's/^/      /'

        echo
        echo "=== IS THERE A BUDGET? N ANONYMOUS GIT FETCHES IN A ROW ========"
        # THE ONLY MEASUREMENT AIMED AT THE SURVIVING HYPOTHESIS RATHER THAN AT
        # A SPECIAL CASE OF IT.
        #
        # Probe D returning 200 killed "EVERY anonymous git request from this
        # runner is refused". It left "anonymous git requests are refused AFTER
        # N" completely untouched — a universal and a threshold are different
        # claims, and every probe above fires five to seven requests from a
        # fresh budget while `nix develop` fetches the whole Cargo git closure
        # of Sui and Solana, which is dozens.
        #
        # Two observations this has to explain, and only a threshold does:
        #   * The failure is INTERMITTENT. The same `git ls-remote` in this same
        #     step returned FAILED on two runs and OK on the next.
        #   * The repository it dies on MOVES: `anza-xyz/crossbeam` three times,
        #     `MystenLabs/mysten-sim.git` once, `mystenlabs/tidehunter` for
        #     lint-nix. It is not attached to a repository at all.
        #
        # READINGS FIXED IN ADVANCE:
        #
        #   first refusal at some N, roughly repeatable across runs
        #       -> the budget is real and named. Its size is the number below,
        #          and the headers captured at the refusal say which limit.
        #   refusal at N = 1
        #       -> the budget was already spent by earlier steps in this job
        #          (checkout, submodules, nine sibling clones). Also a threshold,
        #          and it says the accounting is per job rather than per step.
        #   no refusal in the whole loop
        #       -> at THIS volume the hypothesis is unsupported. It is not yet
        #          dead — nix makes far more requests than this loop — but it
        #          stops being the leading explanation, and the honest report is
        #          "not reproduced at N=<count>", not "disproven".
        #
        # Bounded hard: 40 iterations with a 20s cap each, and it stops at the
        # FIRST refusal, so the normal cost is a few seconds.
        budget_n=0
        budget_fail=0
        for budget_i in $(seq 1 40); do
          if ! GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null \
               GIT_CONFIG_SYSTEM=/dev/null \
               timeout 20 git ls-remote "${probe_repo}" HEAD >/dev/null 2>&1; then
            budget_fail="${budget_i}"
            break
          fi
          budget_n="${budget_i}"
        done
        if [ "${budget_fail}" -ne 0 ]; then
          echo "  FIRST REFUSAL at anonymous git request #${budget_fail}"
          echo "  (${budget_n} succeeded before it)"
          echo "  --- headers on a git-shaped request at that moment ---"
          gh_headers "     refusal-time probe" "${pub}" 0 1
        else
          echo "  NO REFUSAL in ${budget_n} consecutive anonymous git fetches."
          echo "  Not reproduced at this volume. A flake evaluation makes many"
          echo "  more fetches than this loop does,"
          echo "  so this bounds the budget from below rather than disproving it."
        fi

        echo
        echo "(diagnostic only — this step never fails a job)"
        exit 0
