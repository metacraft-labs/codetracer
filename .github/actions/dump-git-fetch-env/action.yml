name: Dump the git fetch environment
description: >-
  Print, immediately before a `nix develop`, exactly what git config would be
  applied to a github.com fetch — and probe one public repo with and without
  that config, so a failure to fetch it names its own cause.

inputs:
  gh-token:
    description: >-
      Installation token, used ONLY to send two authenticated probes as paired
      controls against the anonymous one. Never printed. Optional: without it
      the anonymous probe still runs and the controls say they were skipped.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    # -----------------------------------------------------------------------
    # WHY THIS EXISTS, AND WHY IT IS UNCONDITIONAL
    #
    # The whole `lint-*` stage dies inside `nix develop`, before a single lint
    # runs, on every run for an unknown period:
    #
    #   error: Failed to fetch git repository https://github.com/anza-xyz/crossbeam
    #   fatal: could not read Username for 'https://github.com': No such device or address
    #
    # `anza-xyz/crossbeam`, `mystenlabs/tidehunter` and `facebook/yoga` are all
    # PUBLIC and fetch anonymously at 200 from a workstation. Three explanations
    # have been proposed and all three were DISPROVEN by measurement:
    #
    #   * `actions/checkout`'s global `http.<url>.extraheader`. It redefines
    #     HOME first ("Temporarily overriding HOME=.../_temp/<uuid>"), so its
    #     `--global` writes land in a throwaway gitconfig this step never reads.
    #   * nix's `access-tokens github.com=`. Tested: `builtins.fetchGit` over an
    #     uncached public repo returns the same rev with and without a foreign
    #     token set, so nix does not inject it into plain `https://` git fetches.
    #   * a pinned rev that no longer exists. Tested: that produces
    #     `Cannot find Git revision …`, a different error entirely.
    #
    # So the cause is something about the RUNNER that no log so far records.
    # Guessing a fourth time is not worth anyone's hour; this measures instead.
    #
    # UNCONDITIONAL, and not behind a `if: runner.debug` or a repo variable. A
    # diagnostic nobody switches on is a diagnostic that reports nothing, which
    # is the defect shape this whole campaign is about. It costs about a second
    # and a screen of log.
    #
    # IT CANNOT REDDEN A JOB. Every command is `|| true` and the step ends in
    # `exit 0`. A diagnostic that fails the thing it is diagnosing would be
    # removed within a day, and then the next person has neither.
    #
    # IT CANNOT LEAK A CREDENTIAL. Values are never printed — only key names,
    # their ORIGIN file, a byte length and a truncated SHA-256. That is enough
    # to tell "the same header as last run" from "a different one" and enough to
    # find the file that carries it, and it stays safe if the credential came
    # from the runner image rather than from a masked secret. GitHub's own
    # masking cannot help there: it only redacts values it was told about.
    # -----------------------------------------------------------------------
    - name: Dump the git fetch environment
      shell: bash
      env:
        # Through the environment, never a command line, and never echoed.
        DGFE_GH_TOKEN: ${{ inputs.gh-token }}
      run: |
        set +e

        probe_repo="https://github.com/anza-xyz/crossbeam"

        echo "=== identity ==================================================="
        echo "user           : $(id -un 2>/dev/null) (uid $(id -u 2>/dev/null))"
        echo "HOME           : ${HOME:-<unset>}"
        echo "git            : $(git --version 2>/dev/null)"

        echo
        echo "=== git config files that exist ================================"
        for f in /etc/gitconfig "${HOME}/.gitconfig" "${HOME}/.config/git/config"; do
          if [ -f "${f}" ]; then
            echo "present : ${f}  ($(wc -c <"${f}" | tr -d ' ') bytes)"
          else
            echo "absent  : ${f}"
          fi
        done

        echo
        echo "=== every http.* key git can see, BY NAME AND ORIGIN ==========="
        # `--name-only` so no value is ever printed. The origin is the point:
        # it names the FILE a credential came from, which is what distinguishes
        # "the image ships one" from "a previous step wrote one".
        keys="$(git config --list --show-origin --name-only 2>/dev/null \
          | grep -iE 'http\.|url\.|credential')"
        if [ -n "${keys}" ]; then
          printf '%s\n' "${keys}" | sed 's/^/  /'
        else
          echo "  (none — git has no http./url./credential keys from any file)"
        fi

        echo
        echo "=== what git would ACTUALLY apply to ${probe_repo} ============="
        # `--get-urlmatch` is the decisive query: it asks git to resolve its
        # URL-matching rules for this exact URL, rather than us reading config
        # and reasoning about longest-prefix ourselves. Reasoning about that
        # instead of asking is how the last explanation went wrong.
        urlmatch="$(git config --get-urlmatch http "${probe_repo}" 2>/dev/null)"
        if [ -n "${urlmatch}" ]; then
          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            key="${line%% *}"
            val="${line#* }"
            # A truncated digest, never the value: enough to compare two runs
            # and to tell two different credentials apart, useless to anyone
            # reading the log. `shasum` is the fallback for images without
            # `sha256sum`.
            digest="$(printf '%s' "${val}" | { sha256sum 2>/dev/null || shasum -a 256 2>/dev/null; } | cut -c1-12)"
            printf '  %s = <%s bytes, sha256:%s>\n' "${key}" "${#val}" "${digest:-?}"
          done <<<"${urlmatch}"
        else
          echo "  (none — git would send no http.* configuration for this URL)"
        fi

        echo
        echo "=== nix's view ================================================="
        # Redacted after the `=`: `access-tokens` carries the token itself.
        nix config show 2>/dev/null \
          | grep -iE 'access-tokens|netrc-file|substituters' \
          | sed -E 's/(access-tokens = ).*/\1<redacted>/' | sed 's/^/  /' || true

        echo
        echo "=== THE COMPARISON THAT DECIDES IT ============================="
        # Two fetches of the same PUBLIC repo, differing ONLY in whether git's
        # own configuration is in play. That is the only variable, so that is
        # the only thing these two can speak about:
        #
        #   config fails, isolated succeeds -> git configuration is sufficient
        #                                      to break it; the origin listing
        #                                      names the candidate files.
        #   BOTH fail                       -> git configuration is NOT what
        #                                      breaks it. Nothing more. In
        #                                      particular this says nothing
        #                                      about whether the host can reach
        #                                      github.com — probes A-E do that,
        #                                      and probe A once returned 200 in
        #                                      the same log where this arm had
        #                                      concluded "egress".
        #   BOTH succeed                    -> git is fine and the fault is
        #                                      inside nix's own fetcher, so look
        #                                      there and not at git config.
        GIT_TERMINAL_PROMPT=0 timeout 60 \
          git ls-remote "${probe_repo}" HEAD >/dev/null 2>/tmp/gfe-a.txt
        rc_config=$?

        GIT_TERMINAL_PROMPT=0 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null timeout 60 \
          git ls-remote "${probe_repo}" HEAD >/dev/null 2>/tmp/gfe-b.txt
        rc_isolated=$?

        if [ "${rc_config}" -eq 0 ]; then
          echo "  with this runner's git config : OK"
        else
          echo "  with this runner's git config : FAILED ($(head -1 /tmp/gfe-a.txt))"
        fi
        if [ "${rc_isolated}" -eq 0 ]; then
          echo "  with NO git config at all     : OK"
        else
          echo "  with NO git config at all     : FAILED ($(head -1 /tmp/gfe-b.txt))"
        fi

        echo
        # AN INSTRUMENT MAY REPORT WHAT IT SAW. THE MOMENT IT REPORTS WHAT THAT
        # IMPLIES, IT CAN BE WRONG IN A WAY A VERDICT LINE MAKES INVISIBLE.
        #
        # This block used to end its `both failed` arm with "This runner cannot
        # fetch a public github.com repo anonymously at all … look at egress:
        # IP-level rate limiting or a blocking proxy." It printed that, in a log
        # that ALSO contained probe A below returning `HTTP/2 200` anonymously
        # for the very same repository, seconds apart on the same host. The
        # observation was right and the inference was wrong: two failing `git`
        # invocations say something about git, and nothing whatever about
        # whether this host can reach github.com. That is what probe A measures,
        # and it disagreed.
        #
        # So these arms now state the OBSERVATION and hand the question on. The
        # temptation is specifically in the arm you expect not to take — it gets
        # the least scrutiny and is the one that fires when your model is
        # already wrong.
        if [ "${rc_config}" -ne 0 ] && [ "${rc_isolated}" -eq 0 ]; then
          echo "  OBSERVED: git fails WITH this runner's config and succeeds"
          echo "            WITHOUT it, so something in git configuration is"
          echo "            sufficient to break it. The origin listing above"
          echo "            names the files it could have come from."
        elif [ "${rc_config}" -ne 0 ] && [ "${rc_isolated}" -ne 0 ]; then
          echo "  OBSERVED: git is refused either way, so git CONFIGURATION is"
          echo "            not what breaks it."
          echo "            Whether this host can reach github.com at all is a"
          echo "            SEPARATE question that these two probes cannot"
          echo "            answer. Probes A-E below answer it. Do not conclude"
          echo "            'egress' from this line; that inference was made"
          echo "            here once and probe A refuted it in the same log."
        elif [ "${rc_config}" -eq 0 ]; then
          echo "  OBSERVED: plain git can fetch this repo from this runner."
          echo "            If nix still cannot, look at nix's own fetcher"
          echo "            rather than at git configuration."
        fi

        echo
        echo "=== WHAT GITHUB ACTUALLY SAYS, AND WHY ========================="
        # `git` reports every refusal as "could not read Username", which is
        # what it does with any 401 — it cannot tell you WHY it was challenged.
        # GitHub says why in the response headers, and git throws them away.
        #
        # 401 vs 403 vs 429 are three different causes with three different
        # remedies (credentials, abuse blocking, per-IP rate limiting), and
        # `x-ratelimit-remaining` / `retry-after` separate the last two.
        # `x-github-request-id` is the value GitHub Support cannot proceed
        # without, so it is captured now rather than after a round trip.
        #
        # THREE PROBES, SAME RUNNER, SAME SECOND. The anonymous one alone
        # cannot distinguish "GitHub refuses us" from "github.com is
        # unreachable from this host", so it is paired with two authenticated
        # controls:
        #
        #   A  anonymous     -> a PUBLIC third-party repo   (the failing case)
        #   B  authenticated -> the SAME public repo         (does an
        #                       authenticated path fix third-party fetches?
        #                       that is one of the two candidate remedies)
        #   C  authenticated -> a metacraft-labs repo        (proves the host
        #                       can reach github.com and the token is good)
        #
        # If A is 401/403/429 while C is 200, github.com is plainly reachable
        # and it is ANONYMOUS access that is being refused. If B is also 200,
        # authenticating third-party fetches is a remedy that would work.
        gh_headers() {
          # $1 = label, $2 = url, $3 = 1 to authenticate, $4 = 1 to present as git
          local label="$1" url="$2" auth="$3" as_git="${4:-0}" out
          local -a ua=()
          if [ "${as_git}" = "1" ]; then
            # PRESENT AS GIT, not as a browser. GitHub can distinguish an
            # ordinary HTTPS GET from a git-protocol operation, and the two do
            # not share a rate-limit budget. `curl` defaulting to its own
            # User-Agent is why probes A-C say nothing about what `git` is
            # subjected to on the same host.
            ua=(-A "git/2.39.5" -H "Git-Protocol: version=2")
          fi
          if [ "${auth}" = "1" ]; then
            if [ -z "${DGFE_GH_TOKEN}" ]; then
              printf '  %-34s SKIPPED (no token supplied to this action)\n' "${label}"
              return 0
            fi
            # `-K -` reads the header from stdin, so the credential never
            # appears in argv where anything reading /proc could see it.
            out="$(printf 'header = "Authorization: Basic %s"\n' \
              "$(printf 'x-access-token:%s' "${DGFE_GH_TOKEN}" | base64 | tr -d '\n')" \
              | curl -sS -K - -o /dev/null -D - --max-time 30 ${ua[@]+"${ua[@]}"} "${url}" 2>&1)"
          else
            out="$(curl -sS -o /dev/null -D - --max-time 30 ${ua[@]+"${ua[@]}"} "${url}" 2>&1)"
          fi
          printf '  %s\n' "${label}"
          printf '%s\n' "${out}" \
            | grep -iE '^HTTP/|^x-ratelimit|^retry-after|^x-github-request-id' \
            | tr -d '\r' | sed 's/^/      /'
        }

        refs_path=".git/info/refs?service=git-upload-pack"
        pub="https://github.com/anza-xyz/crossbeam${refs_path}"
        own="https://github.com/metacraft-labs/codetracer${refs_path}"
        if command -v curl >/dev/null 2>&1; then
          gh_headers "A  anon,  browser-UA -> anza-xyz/crossbeam (public)" "${pub}" 0 0
          gh_headers "B  auth,  browser-UA -> anza-xyz/crossbeam (public)" "${pub}" 1 0
          gh_headers "C  auth,  browser-UA -> metacraft-labs/codetracer     " "${own}" 1 0
          gh_headers "D  anon,  GIT-UA     -> anza-xyz/crossbeam (public)" "${pub}" 0 1
          gh_headers "E  auth,  GIT-UA     -> anza-xyz/crossbeam (public)" "${pub}" 1 1
        else
          echo "  SKIPPED — no curl on this runner."
        fi

        echo
        echo "=== WHAT EACH OUTCOME MEANS, SAID IN ADVANCE ==================="
        # Written before the run, so the reading cannot be fitted to whatever
        # comes back. D is the discriminator: it is the ONLY probe that differs
        # from A in nothing but presenting as git.
        #
        #   D 401/403/429 while A is 200
        #       -> GitHub is refusing UNAUTHENTICATED GIT specifically. It meters
        #          git-protocol operations separately from ordinary HTTPS GETs
        #          and answers an exhausted budget with a challenge. A saturated
        #          shared-NAT CI pool is exactly the shape that hits it. Then E
        #          decides the remedy: if E is 200, authenticating third-party
        #          fetches works ON GIT'S OWN PATH and is implementable here.
        #
        #   D 200, same as A
        #       -> The difference is NOT what GitHub does with a git-shaped
        #          request, so it is inside this runner's git binary or how it
        #          is invoked. Next step is `GIT_TRACE_CURL=1` on the failing
        #          `git ls-remote`, with `Authorization` filtered out of the
        #          dump, to see the request git actually sends and the response
        #          it actually gets.
        #
        #   D 200 AND the `git ls-remote` above succeeded
        #       -> The failure is intermittent, and every conclusion drawn from
        #          a single observation of it is unsafe. Say so rather than
        #          picking whichever run agrees with you.
        echo "  (see the comment block in this action; the readings were fixed"
        echo "   before the probes ran, so they cannot be fitted afterwards)"

        echo
        echo "(diagnostic only — this step never fails a job)"
        exit 0
