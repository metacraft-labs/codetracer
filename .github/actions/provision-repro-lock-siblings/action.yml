name: Provision dependency siblings from repro.lock
description: |
  Clone this commit's from-source dependency siblings next to the codetracer
  checkout, at the revisions THIS REPO'S OWN ``repro.lock`` pins, so the Nim
  builds resolve

    addPathIfDir(workspaceRoot / "isonim/src")   (et al.)

  as declared in codetracer's top-level ``config.nims``. Also seeds an empty
  ``build/tailwind-styles.json`` in the isonim checkout so
  ``isonim/dsl/tailwind.nim``'s compile-time staticRead falls through to its
  ``{}`` fallback instead of erroring out (its ``try/except`` wrapper cannot
  catch ``staticRead`` errors).

  In-sandbox Nix derivations stage these inputs through
  ``prepareIsonimSiblings`` in ``nix/packages/default.nix``, out of flake
  inputs rather than out of the workspace; this action is for workflow steps
  that run nim *outside* the Nix sandbox (dev-build, appimage-build, ...) and
  for the dev-shell test lanes that compile against the sibling sources.

  WHY THE LOCK IN THIS REPO, AND NOT THE WORKSPACE LOCK

  This action replaces ``setup-isonim-siblings``, which hand-wrote NINE repo
  names and handed them to ``clone-siblings``. That resolves a bare name
  against the per-commit WORKSPACE lock published to
  ``metacraft-labs/metacraft-manifests``, and a workspace lock is a snapshot
  of the repo SET a developer happened to have checked out -- a convenience
  for standing a workspace up, deliberately a superset of what a build needs.
  It is not this repo's statement of what this repo depends on.

  Two things followed from asking the wrong lock:

    * Four of the nine -- isonim-tui, isonim-gpui, nim-termctl, nim-pty --
      are IsoNim's siblings, not codetracer's. They are members of the
      `isonim` workspace project, not the `codetracer` one
      (metacraft-manifests/projects/codetracer.toml does not include them),
      so a codetracer commit could not pin them and the entries failed
      resolution outright, taking down every job that reached this action.
      They only ever appeared in a codetracer lock when the pusher's
      workspace happened to also carry the isonim project -- an accident of
      someone's checkout, recorded as if it were a dependency.

    * The workaround for that -- pinning the entries to ``=dev`` -- is a
      branch TIP: re-running last month's job clones this month's sibling,
      and the same commit builds against different sources on every run.

  ``repro.lock`` is committed HERE, next to the source it describes, and it
  answers the question the build actually asks. Its ``depends`` field is the
  develop set -- every sibling this commit is built AND tested against -- and
  it carries a 40-hex revision for each, resolved offline from a file in this
  commit: no manifest repo, no publication lag, no branch tip, and no
  fifth-hand guess about which extra checkouts a developer had lying around.

  WHICH OF THEM THIS ACTION CLONES. The develop set also names the siblings
  the test lanes run against (recorders, the native backend, the trace
  format), which ``clone-siblings`` resolves by bare name from the same lock.
  No Nim build compiles them. This action clones only the BUILD INPUTS: the
  members of the develop set that are also solved packages in the lock, i.e.
  what ``repro.nim`` ``uses`` from source --

      isonim, isonim-tui, codetracer-trace-format-nim, nim-everywhere,
      nim-agent-harbor, nim-agents, nim-acp, test-certificates-tools, io-mon,
      nim-stackable-hooks, codetracer-image-diff, isonim-render-serve,
      nim-termctl, nim-pty, nim-shm-queue, isonim-gpui, isonim-freya,
      isonim-cocoa   (repro.lock, 2026-10-31)

  ``ci/repro-lock-build-input-siblings.sh`` derives that list from the lock
  and the step passes it as ``--only=``, so the lock stays the only answer
  (declare a from-source dependency in ``repro.nim``, relock, and it is
  cloned here with no list to edit).

  THE CREDENTIAL. Not every build input is public: ``codetracer-image-diff``
  is a private repository, and ``repro.nim`` uses it, so the clone needs a
  token. The action mints that token itself, from the ``app-id`` and
  ``private-key`` inputs (the per-repo App secrets), and only AFTER it has
  realised the ``.#ci`` dev shell in a step of its own. An installation token
  expires one hour after it is minted, and a cold realisation of that shell
  can take most of one: the release build, which was handed the ``ci_token``
  its first step minted, spent 45 minutes realising the shell inside the
  credential window and reported its clones failed 63 minutes after the
  mint, every clone and fetch answered with the same "could not read
  Username" an absent credential gets (codetracer-pm
  issues/2026-11-04-release-build-provisioning-clones-private-siblings-
  without-a-credential.md). Minting here, right before the clone, keeps the
  realisation and whatever the caller's job did first out of the token's
  hour. The clone does not authenticate through the job-wide
  numbered git configuration that ``setup-nix`` exports (``GIT_CONFIG_COUNT``
  and ``GIT_CONFIG_KEY_n`` / ``GIT_CONFIG_VALUE_n``), because reprobuild
  deliberately scrubs numbered configuration from the git commands it runs on
  another repository's behalf. ``git ls-remote`` in the same job succeeds,
  and ``repro develop`` dies with "could not read Username for
  'https://github.com': terminal prompts disabled". The clone therefore runs
  through ``metacraft-github-actions/git-auth``, which writes the same
  owner-scoped header into a private ``GIT_CONFIG_GLOBAL`` file for the
  duration of the command. That is the channel reprobuild documents for its
  git calls, and the one ``setup-dev-env`` uses for ``repro develop --all``.

  The lock cannot tell public from private. Each ``deps`` entry carries a
  ``visibility`` field, but it names a reprobuild configuration TIER, not
  whether GitHub lets an anonymous client read the repository: every entry
  in this lock says ``public``, ``codetracer-image-diff`` included. So
  ``ci/test/sibling-provisioning-test.sh`` asserts that a credential is
  passed, not that the build inputs are public.

  ``repro develop --all`` is the documented consumer path for exactly this
  (see the header of ``metacraft-labs/reprobuild``'s
  ``.github/actions/reprobuild-provision``: "A CONSUMER project's from-source
  dependency siblings ... `repro develop --all` (run in the project root),
  which clones/adopts each"). Reprobuild's own CI provisions this repo the
  same way, with the same flags.

  ``--reset``: the self-hosted runners reuse their work tree, so ``../isonim``
  may already exist at some other revision from an earlier job. Without
  ``--reset``, ``develop --all`` REFUSES to overwrite a checkout that drifted
  off the lock (the fleet-safe default); with it, each drifted sibling is
  reconciled back to the locked SHA.

  ``--into``: names the ``../<name>`` adjacency ``config.nims`` expects
  explicitly, rather than leaving it to be inferred.

  THE FOUR REPOS THAT WENT AWAY are not silently dropped. (``isonim-tui`` has
  since come back, DECLARED this time: the editor model imports
  ``isonim_tui/text/width``, so it is in ``repro.nim`` and pinned by
  ``repro.lock`` -- exactly the route the next paragraph asks for. What follows
  was written about the other three. Since then the lock has also come to solve
  ``isonim-gpui``, ``nim-termctl`` and ``nim-pty`` as packages, so the
  selector lists them among the build inputs above and this action clones
  them at their locked revisions; that is the lock speaking, not a list
  written here, and the paragraph below is the history of why that is the
  only acceptable route.) Today the GPUI and TUI frontends import them
  (``just build-gpui``, ``just build-tui``, ``just test-tui``) and the plat37
  shim gate reads ``isonim-gpui/tools``; ``just build-once`` compiles none of
  that, so ``scripts/require-siblings.sh`` keeps them ADVISORY. When this was
  written nothing compiled against them. If a sibling ever does become a real
  dependency, the fix is to declare it in ``repro.nim``/``repro.lock`` so the
  lock pins it -- not to clone it here off a branch tip.

  WHY NOT ``env-flavor: reprobuild``. ``setup-dev-env`` has a reprobuild
  flavor, and it is not this. That flavor installs the ``repro`` CLI and a
  ``dev-exec`` wrapper and provisions REPROBUILD's OWN build inputs; it never
  runs ``repro develop`` for the calling project, and it does not install Nix
  (``setup-reprobuild`` pulls Nix in only on its source-build fallback).
  Every job here needs Nix and drives its work through ``nix develop``, so
  switching flavor would be a change to those jobs' whole dev env rather than
  to their sibling provisioning.

  WHERE ``repro`` COMES FROM. codetracer's own flake pins reprobuild
  (``flake.nix``: ``reprobuild.url = github:metacraft-labs/reprobuild/<sha>``)
  and ``nix/shells/ci-base.nix`` puts ``reprobuildPkgs.reprobuild`` in both
  dev shells, so the CLI is already part of the closure these jobs realise.
  Taking it from there keeps ONE pin for the tool -- the flake's -- and costs
  no download. ``setup-reprobuild@dev`` would be the other route, but its
  prebuilt-release path is not usable yet: the latest release publishes no
  SHA256SUMS (so the default ``require-checksum`` rejects it) and no
  darwin-aarch64 archive at all, and both misses fall through to building the
  CLI from source -- "minutes-to-hours slower", in nine jobs.

  ``devShells.ci`` rather than ``devShells.default``: same package closure
  (both compose ``nix/shells/ci-base.nix``), without ``main.nix``'s
  interactive shellHook -- which regenerates the tree-sitter grammar, builds
  a Python venv and probes for siblings that this step has not cloned yet.

  ``ci/test/sibling-provisioning-test.sh`` holds the line that made the old
  shape possible: no composite action in this repo may clone cross-repo
  siblings itself.

inputs:
  app-id:
    description: >
      The GitHub App id (the CI_TOKEN_PROVIDER_APP_ID secret). The action
      mints the clone's installation token itself, after it has realised the
      dev shell, so the token is fresh when git uses it (see "THE CREDENTIAL"
      above). A composite action cannot read secrets, so it arrives as an
      input. Required: codetracer-image-diff, a build input, is a private
      repository, and an empty value fails the mint rather than clone
      anonymously.
    required: true
  private-key:
    description: >
      The GitHub App private key (the CI_TOKEN_PROVIDER_PRIVATE_KEY secret).
      See app-id.
    required: true

runs:
  using: composite
  steps:
    # Realise the dev shell BEFORE the token is minted. On a cold runner this
    # can take most of an hour (45 minutes in release job 126333283602), and
    # an installation token lives exactly one. Done inside the credential window,
    # it let the token expire before `repro develop` ran its first clone. The
    # shell needs no git credential of its own here: Nix fetches the flake's
    # private inputs with the job-wide `access-tokens` and netrc that
    # setup-nix wrote, exactly as this step did before the clone took a token.
    - name: Realise the CI dev shell
      shell: bash
      working-directory: ${{ github.workspace }}
      run: nix develop .#ci --command true

    # The clone's own token, minted only now, so that its hour starts after
    # the slow part. The caller's job token cannot be used: it was minted in
    # the job's first step, before Nix was installed, and has been ageing
    # through all of the setup since. The next step is the clone itself, and
    # nothing may be put between the two
    # (ci/test/sibling-provisioning-test.sh holds that order).
    - name: Mint the clone's installation token
      id: sibling_token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: metacraft-labs

    # The credential goes through `metacraft-github-actions/git-auth`, not
    # through the job's numbered GIT_CONFIG_* configuration: reprobuild scrubs
    # that from its clones, and codetracer-image-diff is a private build input
    # (see "THE CREDENTIAL" in the description). The action reads a private
    # GIT_CONFIG_GLOBAL file, writes it only for this command, and refuses an
    # empty token instead of cloning anonymously. It is pinned to a commit:
    # this is the job's credential, so its handling changes only by an edit
    # here. `nix develop .#ci` below enters the shell the first step realised.
    #
    # The build-input list is computed inside the script rather than in an
    # earlier step and handed over through this step's `env:`. Whether a
    # `uses:` step's `env:` reaches a composite action's own steps is not
    # something the workflow syntax reference states, and the script runs in
    # the same working directory either way.
    - name: Clone the lock-pinned dependency siblings
      uses: metacraft-labs/metacraft-github-actions/git-auth@a190f3a8b37c5a239d88b8c964b6d13f64fbaa0d
      with:
        gh-token: ${{ steps.sibling_token.outputs.token }}
        working-directory: ${{ github.workspace }}
        run: |
          # The selector uses bash builtins only: it runs outside the dev
          # shell, and a nix-darwin runner has no grep or sed on its PATH
          # here.
          build_inputs="$(ci/repro-lock-build-input-siblings.sh repro.lock)"
          echo "Provisioning the lock's build-input siblings: ${build_inputs}"
          siblings_root="$(cd .. && pwd)"
          nix develop .#ci --command \
            repro develop --all --only="${build_inputs}" --reset --into="${siblings_root}"

    # Hand the clone's fresh token to the rest of the job. Every store the
    # job's setup filled (nix.conf, NIX_CONFIG, the Nix netrc, the exported
    # git extraHeader, the checkout's persisted credential) still holds the
    # token minted in the job's first step, and after a cold dev shell that one
    # has expired: TUI job 127318265290 realised the shell for 77 minutes,
    # cloned fine, and its next step's `nix develop` got "401 Bad credentials".
    # refresh.sh runs inside the dev shell because a nix-darwin runner has no
    # grep or sed on its PATH outside it; the first step realised that shell.
    - name: Give later steps the fresh token
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        NEW_TOKEN: ${{ steps.sibling_token.outputs.token }}
      run: |
        nix develop .#ci --command \
          bash "${GITHUB_WORKSPACE}/.github/actions/refresh-github-token/refresh.sh"

    # And keep it fresh. The step after this one is often longer than the
    # token's hour on a cold runner (the TUI job's `just build-once` ran 85
    # minutes), and a build script inside it can still start Nix fetches late
    # in the step: the release build got "401 Bad credentials" from
    # db-backend's build.rs 49 minutes into its AppImage step. refresh-github-
    # token's keep-refreshing.sh re-mints every 40 minutes and rewrites every
    # store refresh.sh knows, the job's credential files included, which every
    # new `nix` process reads. The runner ends it with the job. grep, sed and
    # awk come from the shell below because a nix-darwin runner has none on
    # its PATH outside the dev shell.
    - name: Keep the token fresh for the rest of the job
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        APP_ID: ${{ inputs.app-id }}
        APP_PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        log="$RUNNER_TEMP/keep-refreshing-github-token.log"
        nohup nix shell nixpkgs#openssl nixpkgs#curl nixpkgs#jq \
          nixpkgs#gnugrep nixpkgs#gnused nixpkgs#gawk nixpkgs#coreutils -c \
          bash "${GITHUB_WORKSPACE}/.github/actions/refresh-github-token/keep-refreshing.sh" \
          >"$log" 2>&1 &
        echo "token refresher started (pid $!); log: $log"

    - name: Seed isonim tailwind-styles.json placeholder
      # Still required after the switch. `scripts/build-tailwind.sh` PRODUCES
      # this file (isonim's tailwind-extract.mjs writes it), and
      # `scripts/build-once.sh` runs that before it builds -- but the lanes
      # that compile Nim without going through build-once.sh (the ViewModel
      # suites, test-nimsuggest) never run the extractor, and a freshly cloned
      # isonim has no build/ at all. `isonim/dsl/tailwind.nim` reaches the file
      # with a compile-time staticRead, which its try/except cannot catch, so
      # absence is a compile ERROR rather than the `{}` fallback. The in-Nix
      # path seeds the same placeholder for the same reason
      # (`nix/packages/default.nix`, prepareIsonimSiblings).
      shell: bash
      run: |
        set -euo pipefail
        isonim_build="${GITHUB_WORKSPACE}/../isonim/build"
        mkdir -p "${isonim_build}"
        if [ ! -f "${isonim_build}/tailwind-styles.json" ]; then
          echo '{}' > "${isonim_build}/tailwind-styles.json"
        fi
