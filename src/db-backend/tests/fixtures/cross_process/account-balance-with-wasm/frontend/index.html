<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Account Balance (cross-process origin demo)</title>
  </head>
  <body>
    <!--
      Cross-process origin demo, browser tier.

      Loading ./app.js as a module starts the whole flow: the CodeTracer
      browser runtime attaches, the instrumented WebAssembly module is
      instantiated against its own recorder, the balance is computed and
      POSTed to the Node backend, and both browser-side recordings are
      finalised.

      The single observable side-effect is #status flipping to "stored".
      The recording harness waits on that before closing the page, which
      is what guarantees the trace covers the complete exchange.
    -->
    <main>
      <h1>Account Balance</h1>
      <p>Status: <span id="status">pending</span></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
