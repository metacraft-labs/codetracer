# Cross-process origin demo — WebAssembly compute tier.
#
# Built by `regenerate.sh` with a plain
# `cargo build --target wasm32-unknown-unknown --release`; the resulting
# `.wasm` is then rewritten by `ct-instrument` and loaded by the page
# with a bare `WebAssembly.instantiate`.
#
# No wasm-bindgen: see the header comment in `lib.rs` for why. That also
# means **no dependencies at all**, so the build works in an offline dev
# shell and finishes in seconds on a cold cache.
[package]
name = "balance-calc"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]

# The demo is built with the `dev` profile on purpose.
#
# `ct-instrument` reads DWARF `.debug_line` to give recorded WASM frames
# real source locations. A release build with LTO discards the per-unit
# line programs — the sections survive but carry no rows — so the
# recording would name functions and nothing finer.
#
# For a module this small the size cost is irrelevant, and being able to
# point at a line is the whole point.
[profile.dev]
debug = true
strip = false
