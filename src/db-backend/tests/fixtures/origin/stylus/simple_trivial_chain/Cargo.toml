# NOT-A-TEST-CRATE: a Stylus contract CodeTracer RECORDS during the origin
# tests, not a test of this repository.
[package]
name = "stylus-origin-trivial-chain"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
stylus-sdk = "0.9.0"
alloy-primitives = "=0.8.20"
alloy-sol-types = "=0.8.20"

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
mini-alloc = ["stylus-sdk/mini-alloc"]

[[bin]]
name = "stylus-origin-trivial-chain"
path = "src/main.rs"

[lib]
crate-type = ["lib", "cdylib"]

# The debug build replayed by the recorder keeps the DWARF that maps each
# wasm instruction back to a line of `src/lib.rs` and locates the locals.
[profile.dev]
debug = true
strip = false

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = 3

# Standalone: not a member of the db-backend workspace above it.
[workspace]
