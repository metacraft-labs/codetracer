# Stylus activation rejects wasm that uses reference types, which current
# rustc enables by default for wasm32-unknown-unknown.
[target.wasm32-unknown-unknown]
rustflags = [
  "-C",
  "link-arg=-zstack-size=32768",
  "-C",
  "target-feature=-reference-types",
  "-C",
  "target-feature=+bulk-memory",
]
