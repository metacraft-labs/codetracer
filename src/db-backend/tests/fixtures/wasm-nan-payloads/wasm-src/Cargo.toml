# NaN-payload demo (M52) — WebAssembly tier.
#
# Built by `regenerate.sh` with
#
#     cargo build --target wasm32-unknown-unknown
#
# No dependencies and no wasm-bindgen: the page calls
# `WebAssembly.instantiate` itself and hands the recorder's
# `__codetracer` namespace straight in, so the recording is produced by
# the instrumenter's own `browser_session.js` rather than by a bundler's
# copy of it.
[package]
name = "nan-payloads"
version = "0.0.1"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[lib]
path = "lib.rs"
crate-type = ["cdylib"]

[dependencies]

# The dev profile keeps the DWARF line programs `ct-instrument` reads and
# the offline replay turns into per-line steps.  A release build with LTO
# drops the per-unit line tables and the materialised trace would name
# functions and nothing finer.
#
# `opt-level = 0` matters for a second reason here: at higher levels LLVM
# is entitled to fold `f32::from_bits(k).copysign(..)` into a constant,
# and the fixture would then no longer *compute* the value it is about.
[profile.dev]
opt-level = 0
debug = true
strip = false
