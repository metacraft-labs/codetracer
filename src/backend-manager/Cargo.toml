[package]
name = "session-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
# Every per-user location (and its CODETRACER_HOME override) resolves here.
ct-home = { path = "../../libs/ct-home" }
# The admission rules for DAP data breakpoints (watchpoints), shared
# with `src/db-backend` — the REAL replay backend this crate's mock DAP
# backend stands in for.
#
# This dependency exists because of a specific defect: the mock used to
# answer `setDataBreakpoints` with `verified: true` unconditionally,
# while the real backend had no arm for the command at all and refused
# every request.  The test double was more capable than the component
# it stood in for, so every test of the watchpoint path passed against
# a mock that could do something the product could not, and watchpoints
# were broken for the whole life of the feature without one test going
# red.  The mock now asks the same function the real backend asks.
ct-data-breakpoints = { path = "../../libs/ct-data-breakpoints" }
clap = { version = "4.5.42", features = ["derive"] }
libc = "0.2"
# Chunk-size lines of chunked gateway responses (already in the tree via
# tungstenite; observability_fetch.rs decodes the framing around it).
httparse = "1.10"
log = "0.4.27"
flexi_logger = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# M26: WebSocket host process for the browser-recorder receiver.
# `tokio-tungstenite` brings in `tungstenite` + the futures glue we need to
# accept connections, read text frames, and dispatch them line-by-line to
# `browser_stream_receiver::StreamReceiver`.  Default features are enough
# (we do not need TLS — `ws://` is the documented endpoint for the dev
# loop; production deployments terminate TLS at a reverse proxy).
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
] }
futures-util = { version = "0.3", default-features = false, features = [
  "sink",
  "std",
] }
# `record-web` writes a browser session as a CTFS `.ct` through the pure-Rust
# trace writer (no Nim toolchain).  Path dependencies on the sibling
# `codetracer-trace-format` checkout, like db-backend's, so the writer here and
# the reader there always come from the same revision.
codetracer_trace_types = { path = "../../../codetracer-trace-format/codetracer_trace_types" }
codetracer_trace_writer = { path = "../../../codetracer-trace-format/codetracer_trace_writer" }
codetracer_ctfs = { path = "../../../codetracer-trace-format/codetracer_ctfs" }

[dev-dependencies]
# Used by the `record_web` smoke test to exercise the receiver from a real
# WebSocket client without spinning up a browser.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
  "handshake",
  "connect",
] }
tempfile = "3"
# The gateway test uploads a recording to codetracer-ci and creates its
# share link (already in the tree via codetracer_ctfs, same features).
ureq = { version = "2.12", features = ["json"] }
# Reads `record-web`'s recordings back the way any CTFS consumer does.
codetracer_trace_reader = { path = "../../../codetracer-trace-format/codetracer_trace_reader" }
