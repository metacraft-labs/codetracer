# PLAT-34. Same mechanism and same reason as
# `test_editor_decoration_examples.nim.cfg`, which PLAT-28 added:
# `frontend/view_vocabulary/editor_surface.nim` — the derivation BOTH media's
# editors go through, and therefore this suite's second arm — imports
# `codetracer_embed` by BARE MODULE NAME, and every `vm-*` lane supplies it
# with `--path:src/frontend/viewmodel` (`ci/lib/test-lane-files.sh`).
# `ci/test/editor-model-case-floor.sh` runs `nim c -r` directly and carries no
# lane flags, so the switch travels with the file instead.
#
# A per-FILE `.nim.cfg` and not a `nim.cfg` in this directory: a directory
# config changes the compile of every suite in `viewmodel/tests/unit/` at once,
# which is a lane-wide decision and not a milestone's to take.
--path:"$config/../.."
