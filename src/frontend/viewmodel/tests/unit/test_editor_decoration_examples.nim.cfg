# — imports `codetracer_embed` by BARE MODULE NAME, and every `vm-*` lane
# supplies it with `--path:src/frontend/viewmodel`
# (`ci/lib/test-lane-files.sh`). `ci/test/editor-model-case-floor.sh` runs
# `nim c -r` directly and carries no lane flags, so the switch travels with the
# file instead.
