# A per-FILE `.nim.cfg` and not a `nim.cfg` in this directory: a directory
# config changes the compile of every suite in `viewmodel/tests/unit/` at once,
# which is a lane-wide decision and not a milestone's to take. `src/frontend/
# lsp.nim.cfg` is the same mechanism already in this tree.
