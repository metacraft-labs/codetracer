# NOT-A-TEST-CRATE: a fixture for ct-test's rust-libtest provider. Its tests
# are the DATA that provider is driven over (src/ct_test/rust_libtest_provider_test.nim,
# run by the required ct-test-release-gate job); running them with cargo here
# would change the very thing the fixture fixes.

[package]
name = "ct-test-rust-fixture"
version = "0.1.0"
edition = "2021"

[lib]
name = "ct_test_rust_fixture"
path = "src/lib.rs"

[[test]]
name = "integration_sample"
path = "tests/integration_sample.rs"

[dev-dependencies]
async-std = { version = "1", features = ["attributes"] }
tokio = { version = "1", features = ["macros", "rt"] }
