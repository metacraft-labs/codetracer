# Applies to `trace_index_migration_test.nim` only (Nim reads
# `$projectDir/$projectName.nim.cfg`), not to the other tests in this folder.
#
# `db_connector/sqlite3.nim` reaches SQLite through `dynlib: "libsqlite3.so(|.0)"`,
# which Nim resolves with `dlopen` in the module's init section — before any
# line of the test runs.  In the Nix dev shell `libsqlite3.so` is on
# `CT_LD_LIBRARY_PATH` and deliberately *not* on `LD_LIBRARY_PATH` (see
# `nix/shells/ci-base.nix`), and glibc reads `LD_LIBRARY_PATH` once at process
# start, so nothing the test itself can do fixes the load.
#
# The lane that runs this file (`just test-cli-record`) compiles every
# `src/tests/cli/*_test.nim` with one shared command line, so per-test flags
# cannot come from there, and exporting `LD_LIBRARY_PATH` for the whole lane
# would push seven Nix store lib directories in front of every sibling recorder
# the e2e tests spawn.  Linking this one binary against SQLite instead keeps
# the change to the file that needs it: the Nix ld wrapper bakes the store path
# into the binary's RUNPATH, so it resolves with no environment at all.
@if not windows:
  --dynlibOverride:sqlite3
  --passL:"-lsqlite3"
@end
