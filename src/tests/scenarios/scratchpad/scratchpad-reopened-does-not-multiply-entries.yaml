scenario: 1
name: scratchpad/scratchpad-reopened-does-not-multiply-entries
pack: codetracer
summary: >-
  Closing the Scratchpad panel and adding a value with Ctrl+click (which
  opens the panel again), three times over, leaves the last panel with one
  entry: a value is added once, however many panels have been opened and
  closed before.

stage:
  - use: record-program
    with: { program: noir_space_ship }
  - use: open-recording
    # Wide enough that the values drawn beside the code are on screen.
    with: { width: 2400, height: 1300 }

steps:
  - wait: { until: replay-idle, timeout: 180s }
  # Into iterate_asteroids, whose loop body draws short values on screen,
  # then step so the values beside the code are drawn again.
  - wait: { until: { at: 'call-trace/call[name="iterate_asteroids"]', present: true }, timeout: 60s }
  - click: { at: 'call-trace/call[name="iterate_asteroids"]', anchor: name }
  - wait: replay-idle
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: replay-idle
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: replay-idle
  - wait: { until: { at: 'editor[file="shield.nr"]/flow-value[name="mass", line="5"]', shown: true }, timeout: 60s }
  - click: { at: 'pane-tab[label="SCRATCHPAD"]', anchor: close }
  - wait: { until: { at: window, assert: 'lacks-pane("SCRATCHPAD")' }, timeout: 10s }
  - click: { at: 'editor[file="shield.nr"]/flow-value[name="mass", line="5"]', modifiers: [Ctrl] }
  - wait: { until: { at: window, assert: 'has-pane("SCRATCHPAD")' }, timeout: 10s }
  - click: { at: 'pane-tab[label="SCRATCHPAD"]', anchor: close }
  - wait: { until: { at: window, assert: 'lacks-pane("SCRATCHPAD")' }, timeout: 10s }
  - click: { at: 'editor[file="shield.nr"]/flow-value[name="mass", line="5"]', modifiers: [Ctrl] }
  - wait: { until: { at: window, assert: 'has-pane("SCRATCHPAD")' }, timeout: 10s }
  - click: { at: 'pane-tab[label="SCRATCHPAD"]', anchor: close }
  - wait: { until: { at: window, assert: 'lacks-pane("SCRATCHPAD")' }, timeout: 10s }
  - click: { at: 'editor[file="shield.nr"]/flow-value[name="mass", line="5"]', modifiers: [Ctrl] }
  - wait: { until: { at: window, assert: 'has-pane("SCRATCHPAD")' }, timeout: 10s }
  - click: 'pane-tab[label="SCRATCHPAD"]'
  # A closed panel takes its entries with it, so the panel opened by the
  # last click holds that click's entry, once: a panel from an earlier
  # generation still listening would add it again.
  - wait: { until: { at: scratchpad, count: 1 }, timeout: 20s }
  - wait: settled
  - expect: { at: scratchpad, count: 1 }
