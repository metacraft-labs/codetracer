scenario: 1
name: layout/layout-resilience-index-out-of-range
pack: codetracer
summary: >-
  A saved Edit-mode layout whose stack names a tab that is not there (activeItemIndex 3 of one) is repaired: the window comes up whole, with the panel beside it.

stage:
  - use: plant-config
    with:
      file: default_edit_layout.json
      content: |
        { "settings": { "constrainDragToContainer": true, "reorderEnabled": true },
          "dimensions": { "borderWidth": 4, "headerHeight": 32 },
          "root": { "type": "row", "content": [
            { "type": "stack", "size": "20%", "activeItemIndex": 0, "content": [
              { "type": "component", "componentType": "genericUiComponent",
                "componentState": { "id": 0, "label": "filesystemComponent-0", "content": 9 }, "title": "FILES" } ] },
            { "type": "stack", "size": "80%", "activeItemIndex": 3, "content": [
              { "type": "component", "componentType": "genericUiComponent",
                "componentState": { "id": 0, "label": "calltraceEditorComponent-0", "content": 23 }, "title": "CALLS" } ] } ] } }
  - use: open-project
    with: { folder: test-programs }

steps:
  - wait: { until: { at: layout, present: true }, timeout: 120s }
  - wait: { until: settled, timeout: 60s }
  - expect: { at: layout, stacks: { gt: 0 } }
  - expect: { at: 'pane-tab[label="FILES"]', present: true }

  - expect: { at: 'pane-tab[label="CALLS"]', present: true }
  - expect: { at: 'pane-tab[label="TESTS"]', absent: true }
