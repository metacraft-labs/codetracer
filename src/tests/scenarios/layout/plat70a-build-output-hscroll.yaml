scenario: 1
name: layout/plat70a-build-output-hscroll
pack: codetracer
summary: >-
  Build Output does not wrap: a build that prints a line far wider than the
  pane draws it as one row with a horizontal bar; Shift+wheel scrolls it
  sideways, and a press at the track's end shows the line's end.

stage:
  - use: write-project
    with:
      files:
        README: "wide build output\n"
        .codetracer/build.yaml: |
          tasks:
            wide:
              command: "printf '<<BUILD-LEFT>>012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789012345678901234567890123456789<<BUILD-RIGHT>>\\n'"
              default: true
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: { at: 'strip-tab[label="BUILD"]', present: true }, timeout: 60s }
  - wait: { until: settled, timeout: 30s }
  - click: { at: 'strip-tab[label="BUILD"]' }
  - wait: { until: { at: build-panel, present: true }, timeout: 30s }
  - chord: { bound: build.run }
  - wait: { until: { at: omnibox, present: true }, timeout: 15s }
  - key: Enter
    settle: false
  - wait: { until: { at: build-panel, state: succeeded }, timeout: 120s }
  - wait: { until: { at: 'h-scrubber[pane="buildOutput"]', overflows: true }, timeout: 30s }
  - expect: { at: build-panel, assert: 'shows("<<BUILD-RIGHT>>")' }
  - expect: { at: 'h-scrubber[pane="buildOutput"]', left: 0, at-end: false }
  - press: Shift
  - wheel: { at: build-panel, direction: down, amount: 1 }
  - release: Shift
  - expect: { at: 'h-scrubber[pane="buildOutput"]', left: { gt: 0 } }
  - click: { at: 'h-scrubber[pane="buildOutput"]', anchor: track(0.999) }
  - expect: { at: 'h-scrubber[pane="buildOutput"]', at-end: true }
