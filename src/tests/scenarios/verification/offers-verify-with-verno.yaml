scenario: 1
name: verification/offers-verify-with-verno
pack: codetracer
summary: >-
  The palette's Verification on a Verno package opens the Verification pane, idle,
  offering the project's declared "Verify with Verno" and no Stop.

stage:
  - use: fixture-project
    with: { name: verno-run }
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: { at: window, mode: edit }, timeout: 120s }
  - wait: { until: settled, timeout: 30s }
  - chord: Ctrl+p
  - type: ":Verification"
  - wait: { until: { at: omnibox, assert: "offers(command, Verification)" }, timeout: 15s }
  - key: Enter
  - wait: { until: { at: verification-panel, present: true }, timeout: 30s }
  - expect: { at: verification-panel, phase: idle, run: Verify with Verno, stop: false }
