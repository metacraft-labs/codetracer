# ports: src/frontend/gpui/tests/test_plat63_gpui_verification.nim
scenario: 1
name: gpui/verification-run-lists-findings
pack: codetracer
summary: >-
  `:verify` opens the Verification pane; Run runs the package's task, which fails before reaching the prover, and the pane lists the type error with its place.

stage:
  - use: fixture-project
    with: { name: verno-type-error }
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: ready, timeout: 60s }
  # View › Verification through the palette, which runs the menu's commands
  # by name (a pointer's way through the menu crosses the other folders)
  - chord: Ctrl+P
  - type: ":verification"
  - key: Enter
  - wait: { until: { at: 'pane[title="Verification"]', present: true }, timeout: 30s }
  # the pane's own Run control (▶ at the header's right end)
  - click: { at: 'pane[title="Verification"]/row[#1]', anchor: row-end }
    settle: false
  # the run's verdict, then its findings (the pane cuts their messages at its
  # width; the file each names is read)
  - wait: { until: { at: 'pane[title="Verification"]', assert: 'has-row("Nothing was proved")' }, timeout: 180s }
  - expect: { at: 'pane[title="Verification"]', assert: 'has-row("typeerr/src/main.nr")' }
