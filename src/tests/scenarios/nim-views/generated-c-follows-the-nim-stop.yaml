scenario: 1
name: nim-views/generated-c-follows-the-nim-stop
pack: codetracer
summary: >-
  On an MCR recording of the Nim sudoku solver, the editor shows main.nim at
  the stop (line 60); View › View Generated C Source opens the generated C in
  the Low Level Code pane with the row of line 60 (`nimln_(60)`) marked, and
  a Next moves the Nim stop and the marked C row together (line 72). (Reverse
  Next back is not here: MCR's stage0 replay answers reverse execution with E0C, codetracer-pm
  milestones/MCR-Debug-Server.status.org, Linux row; on rr it is
  nim-views/reverse-next-returns-to-the-nim-line.yaml.)

stage:
  - use: record-program
    with: { program: nim_sudoku_solver/main.nim, backend: mcr }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 300s }
  - wait: { until: { at: window, front-tabs: { contains: "main.nim" } }, timeout: 120s }
  - wait: { until: { at: status-line, location: { matches: "main.nim:60#" } }, timeout: 60s }
  - click: menu-bar
  - wait: { until: { at: 'menu-bar/menu[label="View"]', present: true }, timeout: 10s }
  - hover: { at: 'menu-bar/menu[label="View"]', for: 300ms }
  - wait: { until: { at: 'menu-bar/menu-item[label="View Generated C Source"]', present: true }, timeout: 10s }
  # Across into View's entries along its own row first, as a user does: a
  # diagonal path over Build and Reset would open their folders instead.
  - hover: { at: 'menu-bar/menu-item[label="Filesystem"]', for: 200ms }
  - wait: settled
  - click: 'menu-bar/menu-item[label="View Generated C Source"]'
    # the pane loads the listing after the click; the next wait covers it
    settle: false
  - wait: { until: { at: low-level-code, count: { gt: 10 } }, timeout: 120s }
  - wait: { until: { at: low-level-code, assert: 'active-row-shows("nimln_\\(60\\)")' }, timeout: 60s }
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: { until: { at: status-line, location: { matches: "main.nim:72#" } }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: { at: low-level-code, assert: 'active-row-shows("nimln_\\(72\\)")' }, timeout: 60s }
  - expect: { at: window, front-tabs: { contains: "main.nim" } }
