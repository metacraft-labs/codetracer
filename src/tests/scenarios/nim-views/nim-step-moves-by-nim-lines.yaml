scenario: 1
name: nim-views/nim-step-moves-by-nim-lines
pack: codetracer
summary: >-
  On an rr recording of the Nim sudoku solver, the Nim source view steps by
  Nim lines: from line 60 (the board literal spanning lines 60-70) Next stops
  at line 72, the next statement, in main.nim. (Reverse Next back to 60 is
  not here: it never completes on this recording; codetracer-pm issue
  2026-11-15-reverse-next-never-completes-on-an-rr-nim-recording.)

stage:
  - use: record-program
    with: { program: nim_sudoku_solver/main.nim, backend: rr }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 300s }
  - wait: { until: { at: 'editor[file="main.nim"]', current-line: 60 }, timeout: 120s }
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: { until: { at: 'editor[file="main.nim"]', current-line: 72 }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: status-line, location: { matches: "main.nim:72#" } }
