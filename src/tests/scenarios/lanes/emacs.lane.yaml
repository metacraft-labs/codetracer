# The emacs flavour: Emacs (emacs -nw) with codetracer.el, the real editor in a real pty
# under TermAssert, its plugin driving CodeTracer's pane server
# (`codetracer-tui --pane-server`); the editor binding is linked into
# `dvs-termassert-codetracer` (`--backend termassert-emacs`). Run from the
# repository root: `ci/test/scenarios.sh lane emacs`. Needs the editor
# (CT_SCENARIO_EMACS or on PATH) and the plugin (the workspace sibling, or
# CODETRACER_EL_PLUGIN).
lane: 1
name: emacs
pack: ../pack/codetracer.pack.yaml
backend: termassert-emacs
modes: [fast, realistic]
settle-timeout: 15000
stage-timeout: 300000
retention: { runs: 5, failure-days: 7 }
applicable:
  # a whole debugging session, the one every front-end renders into a video
  - ../tour/calc-debugging-session.yaml
  # Nim compile-time tracing: a macro from a session on a recording, and the
  # static block from Edit mode (below)
  - ../tracing/trace-macro-at-caret.yaml
  # the editor-hosted front-ends' own features
  - ../editor-hosted/debugger-controls.yaml
  - ../editor-hosted/generated-c-in-edit-mode.yaml
  - ../editor-hosted/tests-from-the-source.yaml
  - ../editor-hosted/nim-static-block-tracing.yaml
  - ../editor-hosted/generated-c-of-a-native-recording.yaml
