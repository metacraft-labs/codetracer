scenario: 1
name: multi-window/tab-menus-offer-no-second-window
pack: codetracer
summary: >-
  While a second desktop window cannot show its session (it opens blank and
  inert until codetracer-pm milestone PLAT-74), neither a pane tab's menu nor
  a session tab's offers one: the pane menu keeps its pin entries without
  Send to New Window, and a session tab has no Open in New Window.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'pane-tab[label="EVENT LOG"]', present: true }, timeout: 30s }

  - beat: pane-menu
    steps:
      - click: { at: 'pane-tab[label="EVENT LOG"]', button: right }
      - wait: { until: { at: 'context-menu/menu-item[label="Pin to Left"]', present: true }, timeout: 15s }
      - expect: { at: 'context-menu/menu-item[label="Send to New Window"]', absent: true, holds: 1s }
      - key: Esc
      - wait: { until: { at: context-menu, absent: true }, timeout: 10s }

  - beat: session-tab
    steps:
      - click: session-strip/session-add
      - wait: { until: { at: session-strip, count: 2 }, timeout: 30s }
      - click: { at: 'session-strip/session-tab[title="main.py"]', button: right }
      - expect: { at: 'context-menu/menu-item[label="Open in New Window"]', absent: true, holds: 2s }
