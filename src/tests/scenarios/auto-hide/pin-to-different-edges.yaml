scenario: 1
name: auto-hide/pin-to-different-edges
pack: codetracer
summary: >-
  Two panes pinned to different edges — FILES to the bottom, VARIABLES to
  the left — each get a strip tab on their own edge and leave the layout.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: window, strip-tabs: { count: 4 } }, timeout: 30s }
  - click: { at: 'pane-tab[label="FILES"]' }
  - click: { at: 'pane-tab[label="FILES"]', button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Pin to Bottom"]', present: true }, timeout: 15s }
  - click: { at: 'context-menu/menu-item[label="Pin to Bottom"]' }
  - wait: { until: { at: 'strip-tab[label="FILES"]', present: true }, timeout: 15s }
  - click: { at: 'pane-tab[label="VARIABLES"]' }
  - click: { at: 'pane-tab[label="VARIABLES"]', button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Pin to Left"]', present: true }, timeout: 15s }
  - click: { at: 'context-menu/menu-item[label="Pin to Left"]' }
  - wait: { until: { at: 'strip-tab[label="VARIABLES"]', present: true }, timeout: 15s }
  - expect: { at: 'strip-tab[label="FILES"]', edge: bottom }
  - expect: { at: 'strip-tab[label="VARIABLES"]', edge: left }
  - expect: { at: window, strip-tabs: { count: 6 } }
  - expect: { at: window, assert: 'lacks-pane("FILES")' }
  - expect: { at: window, assert: 'lacks-pane("VARIABLES")' }
