scenario: 1
name: auto-hide/hover-on-docked-edge
pack: codetracer
summary: >-
  While a status-bar panel is docked, resting on another status-bar tab
  opens nothing (that edge's tabs open on a click); a tab on another edge
  still opens its overlay on hover, with the status-bar panel still docked.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: window, strip-tabs: { count: 4 } }, timeout: 30s }
  - click: { at: 'strip-tab[label="BUILD"]' }
  - wait: { until: { at: 'docked-panel[edge="bottom"]', present: true }, timeout: 15s }
  - hover: { at: 'strip-tab[label="PROBLEMS"]', for: 1500ms }
  - expect: { at: auto-hide-overlay, absent: true }
  - click: { at: 'pane-tab[label="EVENT LOG"]' }
  - click: { at: 'pane-tab[label="EVENT LOG"]', button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Pin to Left"]', present: true }, timeout: 15s }
  - click: { at: 'context-menu/menu-item[label="Pin to Left"]' }
  - wait: { until: { at: 'strip-tab[label="EVENT LOG"]', edge: left }, timeout: 15s }
  - expect: { at: 'docked-panel[edge="bottom"]', present: true }
  - hover: { at: 'strip-tab[label="EVENT LOG"]', for: 500ms }
  - wait: { until: { at: auto-hide-overlay, edge: left }, timeout: 15s }
