# CodeTracer's scenario pack: the backend-neutral part.
#
# The page objects a user perceives in CodeTracer — the window, its session
# tabs, the panes and what is in them — declared once, for every front-end:
# the desktop (Playwright), the VS Code extension (WebDriverIO, in
# codetracer-vscode-extension), the terminal (TermAssert) and the GPUI window
# (GuiAssert). How each front-end shows them is that front-end's binding
# (`../bindings/`); what a scenario may do to them is DemoVideoScript's format.
#
# Property shapes follow the domain models the screen oracle and the desktop's
# page objects already share (`src/tests/gui/page-objects/layout_models.ts`,
# `src/tests/visual/screen_oracle/domain_models.nim`): a variable is a name, a
# type and a value; an event is its console output; a call is its name; an
# editor knows the line it is stopped on. They are not defined a second time:
# a binding reads them into these properties.
#
# A property a binding cannot read on its front-end is declared unreadable by
# that binding, so a scenario that needs it is `unsupported` there rather than
# answered from somewhere else.
pack: 1
name: codetracer
summary: CodeTracer — the time-travelling debugger's windows, panes and controls.
root: window

roles:
  window:
    properties:
      title: text
      # `debug` while a recording is replayed, `edit` while files are edited.
      mode: "enum{debug,edit}"
    children:
      session-strip: optional
      toolbar: optional
      editor: many
      call-trace: optional
      event-log: optional
      variables: optional
      filesystem: optional
      terminal-output: optional
      scratchpad: optional
      breakpoints: optional
      status-line: optional
      omnibox: optional
      context-menu: optional
      dialog: optional
      welcome: optional
      menu-bar: optional
      pane-tab: many
      # --- pw2 ---
      vcs: optional
      diff-view: many
      # --- terminal ---
      pane: many
      popup: many
      dropdown: many
      dock-label: many
      replay-position: optional

  # The strip of session tabs: one tab per open recording or editing session.
  session-strip:
    properties: { count: int, active: text }
    children: { session-tab: many }
    assertions:
      has-tab(title): "some session-tab: session-tab.title contains title"
      has-tab-matching(pattern): "some session-tab: session-tab.title matches pattern"
      active-is(title): "active contains title"
      at-least(n): "count >= n"

  session-tab:
    keys: [title]
    properties: { title: text, active: bool }
    affordances: [click, context-click]

  # A pane's tab in the layout (Editor, Call Trace, Event Log, …): what a user
  # clicks to bring a pane forward.
  pane-tab:
    keys: [label]
    properties: { label: text, active: bool }
    affordances: [click, context-click, drag-source]
    # `close`: the tab's close button.
    anchors: [close]

  # The transport controls of a replay session (step, continue, reverse, …)
  # and the edit-mode toolbar.
  toolbar:
    children: { toolbar-button: many }
    assertions:
      # Exactly one tooltip is on screen, and it is this control's.
      only-tooltip-of(label): "(some b of toolbar-button: b.label == label and b.tooltip-shown) and (none c of toolbar-button: c.label != label and c.tooltip-shown)"
      no-tooltip: "none b of toolbar-button: b.tooltip-shown"
      # No tooltip is left on screen on any control but this one.
      no-tooltip-but(label): "none b of toolbar-button: b.label != label and b.tooltip-shown"

  toolbar-button:
    keys: [label]
    # `tooltip`: the control's tooltip text (`Next (F10)`); `tooltip-chord`:
    # the chord it names (`F10`), "" when it names none; `tooltip-shown`: the
    # tooltip is on screen.
    properties: { label: text, enabled: bool, tooltip: text, tooltip-chord: text, tooltip-shown: bool }
    affordances: [click]

  # One source editor: a file, shown in its own editor tab.
  editor:
    keys: [file]
    properties:
      file: text
      # The editor whose tab is in front.
      active: bool
      focused: bool
      read-only: bool
      # The line the replay is stopped on (the execution pointer); 0 when the
      # stop is not in this file.
      current-line: int
      # The line the caret is on; 0 when the editor shows no caret.
      caret-line: int
      first-visible: int
      last-visible: int
      # The text of every line on screen, in order.
      text: lines
      # --- pw2 ---
      # The selected text of each cursor ("" for a bare caret), the first
      # one's, and how many cursors there are.
      selections: lines
      selected-text: text
      selection-count: int
      # The code font, as drawn.
      font-family: text
      font-size: int
      # The editor's find widget: shown, its query, its "n of m" count.
      find-shown: bool
      find-query: text
      find-matches: text
    children: { line: many }
    affordances: [click, context-click, wheel, focusable, text-entry]
    assertions:
      stopped-at(n): "current-line == n"
      stopped-within(first, last): "current-line >= first and current-line <= last"
      caret-at(n): "caret-line == n"
      shows-line(n): "first-visible <= n and last-visible >= n"
      shows-text(t): "some line: line.text contains t"
      # Exactly one of two lines is dimmed as a branch the run did not take.
      dims-one-of(a, b): "(some x of line: x.number == a and x.dimmed) != (some y of line: y.number == b and y.dimmed)"
      # --- terminal ---
      lacks-text(t): "none line: line.text contains t"
    sync:
      # The editor has a document and has drawn it.
      loaded: "count(line) > 0"

  # One line of an editor, as it is on screen.
  line:
    keys: [number]
    properties:
      number: int
      text: text
      # The replay is stopped on this line.
      current: bool
      # The caret is on this line.
      caret: bool
      breakpoint: bool
      tracepoint: bool
      # --- pw2 ---
      # The marks in the line's glyph cell, space-separated, sorted:
      # `breakpoint`, `breakpoint-disabled`, `breakpoint-tracepoint`, `hint`.
      glyph: text
      # The line is dimmed as part of a branch the run did not take.
      dimmed: bool
      # The columns (1-based) of the line's inline breakpoints.
      inline-breakpoints: lines
    affordances: [click, double-click, context-click]
    # `gutter`: the breakpoint lane; `text-start` / `text-end`: the first and
    # last character of the line's text; `column(c)`: the c-th character
    # (1-based) of the line's text; `glyph`: the glyph cell left of the line
    # number; `line-number`: the line's number; `caret(c)`: where a press
    # puts the caret before the c-th character (column c).
    anchors: [gutter, text-start, text-end, column(c), glyph, line-number, caret(c)]

  # The call trace: the recording's calls, nested.
  call-trace:
    properties: { count: int, focused: bool }
    children: { call: many }
    affordances: [wheel, focusable]
    assertions:
      has-call(name): "some call: call.name == name"
      has-call-containing(text): "some call: call.name contains text"
      # A row is marked selected.
      has-selected-call: "some call: call.selected"
    sync:
      loaded: "count(call) > 0"

  call:
    keys: [name]
    properties:
      name: text
      # The call the replay is in.
      current: bool
      selected: bool
      depth: int
      # The call's arguments as drawn (`a=1, b=2`).
      arguments: text
    affordances: [click, double-click, context-click]
    # `name`: the call's name (terminal batch)
    anchors: [expander, name]

  # The event log: the recording's output and events, in order.
  event-log:
    properties:
      # Rows on screen.
      count: int
      # Rows in the log, as its footer reports them.
      total: int
      search: text
      focused: bool
      # The last row shown, as the footer reports it (`… to <n> of <total>`).
      last-shown: int
      # The visible column titles, in order.
      columns: lines
    children: { event: many, columns-button: optional, columns-menu: optional }
    affordances: [wheel, focusable]
    assertions:
      has-output(text): "some event: event.text contains text"
    sync:
      loaded: "count(event) > 0"

  event:
    keys: [text]
    properties:
      # The event's console output (or its description), as drawn.
      text: text
      kind: text
      # The event the replay is at.
      current: bool
      # A row past the replay's position (drawn dimmed).
      future: bool
    affordances: [click, double-click, context-click]

  # The state pane: the variables at the replay's position.
  variables:
    properties:
      count: int
      watch: text
      focused: bool
    children: { variable: many }
    affordances: [wheel, focusable]
    assertions:
      has-variable(name): "some variable: variable.name == name"
      value-of(name, value): "some variable: variable.name == name and variable.value contains value"
    sync:
      loaded: "count(variable) > 0"

  variable:
    keys: [name]
    properties: { name: text, type: text, value: text, expanded: bool }
    affordances: [click, double-click, context-click]
    # `name`: the call's name (terminal batch)
    anchors: [expander, name]

  # The breakpoints and tracepoints list.
  breakpoints:
    properties: { count: int }
    children: { point: many }

  point:
    keys: [location]
    properties: { location: text, kind: "enum{breakpoint,tracepoint}", enabled: bool }
    affordances: [click, context-click]

  # The files pane.
  filesystem:
    # `loading`: the pane shows its loading state instead of a tree.
    properties: { count: int, focused: bool, loading: bool }
    children: { file-node: many }
    affordances: [wheel, focusable]

  file-node:
    keys: [name]
    properties: { name: text, kind: "enum{file,folder}", expanded: bool, selected: bool }
    affordances: [click, double-click, context-click]

  # The program's terminal output.
  terminal-output:
    properties: { text: lines, count: int }
    affordances: [wheel, focusable]
    assertions:
      shows(t): "text contains t"

  # The scratchpad: values the user pinned.
  scratchpad:
    properties: { count: int }
    children: { scratch-entry: many }

  scratch-entry:
    keys: [expression]
    properties: { expression: text, value: text }
    affordances: [click, context-click]

  # The status line at the bottom of the window.
  status-line:
    properties:
      message: text
      # Where the replay is, as the status line says it (`file:line`).
      location: text
      # The editing keymap's mode indicator, when there is one.
      mode: text
    # --- terminal ---
    assertions:
      says(t): "message contains t"
      lacks(t): "not (message contains t)"

  # The command palette / omnibox: a query field and its results.
  omnibox:
    properties: { query: text, focused: bool, count: int }
    children: { option: many }
    affordances: [click, text-entry, focusable]
    assertions:
      offers(kind, text): "some option: option.kind == kind and option.label contains text"

  option:
    keys: [label]
    # `kind`: file, command, symbol, … (what choosing it opens or runs).
    properties: { label: text, detail: text, selected: bool, kind: text }
    affordances: [click]

  # A context menu, opened by a right press or its key.
  context-menu:
    properties: { count: int }
    children: { menu-item: many }
    assertions:
      offers(label): "some menu-item: menu-item.label == label"
      lacks(label): "none menu-item: menu-item.label == label"
      # Every disabled row says why (its hint column is not empty).
      disabled-rows-say-why: "every menu-item: menu-item.enabled or menu-item.hint != \"\""
      # No row prints an HTML entity instead of the character.
      no-raw-entities: "none menu-item: menu-item.label matches \"&(lt|gt|amp);\" or menu-item.hint matches \"&(lt|gt|amp);\""

  menu-item:
    keys: [label]
    # `hint`: the row's second column — a hint, or why a disabled row is
    # disabled.
    properties: { label: text, enabled: bool, shortcut: text, hint: text }
    affordances: [click]

  # The application menu (the desktop's in-window menu, the terminal's and
  # the GPUI window's top-bar menus).
  menu-bar:
    children: { menu: many }

  menu:
    keys: [label]
    properties: { label: text, open: bool }
    affordances: [click]

  # A dialog or notification asking the user something, or telling them.
  dialog:
    keys: [title]
    properties: { title: text, message: text }
    children: { dialog-button: many, text-field: many }

  dialog-button:
    keys: [label]
    properties: { label: text, enabled: bool }
    affordances: [click]

  text-field:
    keys: [label]
    properties: { label: text, value: text, focused: bool }
    affordances: [click, text-entry, focusable]

  # The welcome screen a window shows before a recording or project is open.
  welcome:
    properties:
      heading: text
      # --- terminal --- what the screen says, row by row
      text: lines
    children: { welcome-action: many, recent: many }
    assertions:
      shows(t): "text contains t"

  welcome-action:
    keys: [label]
    properties: { label: text }
    affordances: [click]

  recent:
    keys: [name]
    properties: { name: text, detail: text }
    affordances: [click, double-click]


  # --- pw2 ---
  # The event log's Columns button and the menu it opens: one option per
  # column, shown or hidden by its check box, reordered by its handle.
  columns-button:
    properties: { label: text }
    affordances: [click]

  columns-menu:
    children: { column-option: many }

  column-option:
    keys: [name]
    properties: { name: text, shown: bool }
    affordances: [click, drag-source, drop-target]
    anchors: [check, handle]


  # The VCS panel as a review shows it: the changeset header (`commit`: the
  # abbreviated commit and the file count), its stats (`+16 -10`), the
  # Unified Diff / Open File toggle, and the changed files.
  vcs:
    properties: { commit: text, stats: text, count: int, unified-diff: bool, error: text }
    children: { changed-file: many, diff-toggle: optional }

  changed-file:
    keys: [name]
    # `status`: M, A, D…; `status-kind`: modified, added, deleted…;
    # `stats`: the added/removed line counts; `coverage`: its badge.
    properties: { name: text, status: text, status-kind: text, stats: text, coverage: text, selected: bool }
    affordances: [click]

  diff-toggle:
    properties: { unified: bool }
    affordances: [click]

  # A unified-diff view a review opened, headed by its file's path.
  diff-view:
    keys: [file]
    properties: { file: text, text: lines }

  # --- terminal ---
  # Any pane of the layout, by the label of its tab in front: what it shows,
  # row by row. The panes no other role reads (Problems, Find in Files,
  # Build, VCS, Constraints, Requests, …) are read through it.
  pane:
    keys: [title]
    properties:
      title: text
      # Its rows' text, in order, as drawn.
      text: lines
      count: int
      # The labels of the tabs on its strip.
      tabs: lines
      # A horizontal scrollbar is drawn across it.
      hbar: bool
    children: { row: many }
    affordances: [click, wheel, context-click, drop-target]
    assertions:
      shows(t): "text contains t"
      has-row(t): "some row: row.text contains t"
      lacks-row(t): "none row: row.text contains t"
      rows-match(re): "every row: row.text matches re"
      has-tab(t): "tabs contains t"
      lacks-tab(t): "not (tabs contains t)"

  # One row of a pane, by its whole text or by its first column.
  row:
    keys: [text, first]
    properties: { text: text, first: text, selected: bool }
    children: { cell: many }
    affordances: [click, double-click, context-click]
    anchors: [text-start, text-end]

  # One column of a row: a run of text set two or more blanks apart from the
  # next (a button, a name, a count).
  cell:
    keys: [text]
    properties: { text: text }
    affordances: [click, double-click, context-click]

  # A box shown over the window that is not a menu: an event's whole content,
  # a value's history, a detail row, a tooltip.
  popup:
    properties: { title: text, text: lines }
    affordances: [click]
    assertions:
      shows(t): "text contains t"

  # One level of the program menu, open: the first under the menu button,
  # every entered folder to its right.
  dropdown:
    keys: [level]
    properties: { level: int, count: int }
    children: { dropdown-item: many }
    assertions:
      offers(label): "some dropdown-item: dropdown-item.label == label"

  dropdown-item:
    keys: [label]
    properties: { label: text, shortcut: text, folder: bool, selected: bool }
    affordances: [click]

  # A label of the footer's auto-hide panels (Build, Problems, …): a click
  # docks its pane.
  dock-label:
    keys: [label]
    properties: { label: text }
    affordances: [click, context-click]

  # Where the replay is in the recording: its tick, of how many.
  replay-position:
    properties: { tick: int, total: int, paused: bool }
    assertions:
      at-tick(n): "tick == n"
      past(n): "tick > n"
      before(n): "tick < n"

sync:
  # The implicit condition after every input: the window handled it and the
  # screen stopped changing.
  settled: ~
  # The replay engine has answered everything asked of it and the window shows
  # where the replay is.
  replay-idle: ~
  # --- terminal ---
  # The front-end has drawn its first frame (a replay or Edit mode).
  ready: ~

stages:
  record-program:
    summary: >-
      Record a test program (a path under the repository's test-programs, or
      a named fixture) once, kept for the lane, and remember it as the
      recording the next `open-recording` opens.
    params: { program: text, backend: text }
  nim-project:
    summary: >-
      Write the Nim compile-time tracing project (a macro, a static block, a
      constant section and a NimScript file) into a fresh folder and record a
      trace of its static block with the product's own route; that trace is the
      recording the next `open-recording` opens, with the project folder as
      its working directory.
    params: {}
  open-recording:
    summary: >-
      Start the front-end on the recording the stage prepared (or on
      `recording`, a recording folder), in a window of the given size, with
      the replay at its entry or at `tick`. `deployment: web` serves it with
      `ct host` and opens its page in a browser instead (front-ends that
      have one).
    params: { recording: text, tick: int, width: int, height: int, deployment: text }
  open-project:
    summary: Start the front-end in Edit mode on a project folder (a path under test-programs, or `$project` for the stage's own).
    params: { folder: text, file: text, width: int, height: int }
  open-review:
    summary: >-
      Start the front-end on a DeepReview dataset (`ct review <dataset>`; a
      path relative to the repository), in the review layout.
    params: { dataset: text, width: int, height: int }
  select-keymap:
    summary: Choose the base keymap the front-end starts with (cua, emacs, vim, kakoune).
    params: { preset: text }
  plant-config:
    summary: Write a file into the front-end's configuration directory before it starts (keybindings.json, a layout, settings).
    params: { file: text, content: text }
  start-from-layout:
    summary: Start from a saved layout (a file under the pack's fixtures).
    params: { layout: text }
  # --- terminal ---
  write-project:
    summary: >-
      Write a project folder from `files` (a relative path to its content; a
      path ending in `/` is an empty folder). The next `open-project` with
      `folder: $project` edits it, and the next `open-recording` runs in it.
    params: { files: record }
  front-end-options:
    summary: >-
      Start the front-end with these command-line options (`name: value` is
      `--name=value`), on a terminal of type `term` (the terminal flavour's
      `TERM`), with these environment variables (`$project` in a value is
      the stage's project folder).
    params: { options: record, term: text, env: record }
  drop-recorded-file:
    summary: >-
      Copy the prepared recording into the run's root without its recorded
      source file `name`, and open that copy: a recording that lacks a file.
    params: { name: text }
  fixture-project:
    summary: >-
      Write one of the repository's fixture projects into the run's project
      folder (`c-build`: a C project whose src/main.c fails to build;
      `noir-build-errors`: a Noir crate with two type errors; `noir-tests`: a
      Noir crate with a passing and a failing test; `noir-constraints`: a
      Noir circuit for the Constraints pane; `vcs-repo`: a git repository
      with a modified, an added and an untracked file; `verno-type-error`,
      `verno-counterexample`: a Verno package with a recorded verifier run).
      `write-project` may add
      files to it.
    params: { name: text }
  request-session:
    summary: >-
      Write the demo request session (a recording whose program served eight
      HTTP requests) and make it the recording the next `open-recording` opens.
    params: {}
  plant-state:
    summary: >-
      Write a file into the front-end's state directory before it starts (a
      saved layout document, the stored keymap preference).
    params: { file: text, content: text }
  visual-recording:
    summary: >-
      The visual fixture's GL scene recording (a program that drew frames),
      as the recording the next `open-recording` opens; it needs the visual
      replay player.
    params: {}
