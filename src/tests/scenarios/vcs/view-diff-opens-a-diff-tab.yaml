scenario: 1
name: vcs/view-diff-opens-a-diff-tab
pack: codetracer
summary: >-
  In a git repository's VCS pane, the newest commit expanded and its
  main.nim's View Diff pressed (shown on hover) opens a "Diff: main.nim" tab
  in front, with two hunks, added and removed lines marked, and `+` / `-`
  in the new and the old revision's gutters; the VCS pane still shows the
  commit history.

stage:
  - use: project-fixture
    with: { name: vcs-two-hunks }
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: { at: 'pane-tab[label="VCS"]', present: true }, timeout: 120s }
  - wait: { until: settled, timeout: 30s }
  - click: 'pane-tab[label="VCS"]'
  - wait: { until: { at: 'vcs/commit[message="change the greeting"]', present: true }, timeout: 60s }
  - click: { at: 'vcs/commit[message="change the greeting"]', anchor: toggle }
  - wait: { until: { at: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]', present: true }, timeout: 30s }
  - hover: { at: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]', for: 300ms }
  - wait: { until: { at: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]/panel-button[label="View Diff"]', present: true }, timeout: 15s }
  - click: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]/panel-button[label="View Diff"]'
  - wait: { until: { at: 'diff-view[file="src/main.nim"]', hunks: 2 }, timeout: 30s }
  - expect: { at: window, front-tabs: { contains: "Diff: main.nim (" }, diff-tabs: 1 }
  - expect: { at: 'diff-view[file="src/main.nim"]', added: { gt: 0 }, removed: { gt: 0 }, text: { contains: "@@ -" } }
  - expect: { at: 'diff-view[file="src/main.nim"]', line-numbers: { contains: "+" }, old-line-numbers: { contains: "-" } }
  - expect: { at: 'vcs/commit[message="initial"]', present: true }
