scenario: 1
name: vcs/hunks-select-and-copy-as-patch
pack: codetracer
summary: >-
  In a diff tab, a click on the first hunk's @@ divider selects it ("1 hunk
  selected") and a Shift-click on the second extends it ("2 hunks selected",
  marked on the lines); "Copy as patch" says "Copied!", and Clear puts the
  toolbar away.

stage:
  - use: project-fixture
    with: { name: vcs-two-hunks }
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: { at: 'pane-tab[label="VCS"]', present: true }, timeout: 120s }
  - wait: { until: settled, timeout: 30s }
  - click: 'pane-tab[label="VCS"]'
  - wait: { until: { at: 'vcs/commit[message="change the greeting"]', present: true }, timeout: 60s }
  - click: { at: 'vcs/commit[message="change the greeting"]', anchor: toggle }
  - wait: { until: { at: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]', present: true }, timeout: 30s }
  - hover: { at: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]', for: 300ms }
  - wait: { until: { at: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]/panel-button[label="View Diff"]', present: true }, timeout: 15s }
  - click: 'vcs/commit[message="change the greeting"]/commit-file[name="main.nim"]/panel-button[label="View Diff"]'
  - wait: { until: { at: 'diff-view[file="src/main.nim"]', hunks: 2 }, timeout: 30s }
  - expect: { at: 'diff-view[file="src/main.nim"]', toolbar: "" }
  - click: 'diff-view[file="src/main.nim"]/hunk[number="1"]'
  - wait: { until: { at: 'diff-view[file="src/main.nim"]', toolbar: 1 hunk selected }, timeout: 15s }
  - click: { at: 'diff-view[file="src/main.nim"]/hunk[number="2"]', modifiers: [Shift] }
  - wait: { until: { at: 'diff-view[file="src/main.nim"]', toolbar: 2 hunks selected }, timeout: 15s }
  - expect: { at: 'diff-view[file="src/main.nim"]', selected-hunks: { gt: 0 } }
  - click: 'diff-view[file="src/main.nim"]/panel-button[label="Copy as patch"]'
    settle: false
  - wait: { until: { at: 'diff-view[file="src/main.nim"]/panel-button[label="Copied!"]', present: true }, timeout: 15s }
  - click: 'diff-view[file="src/main.nim"]/panel-button[label="Clear"]'
  - wait: { until: { at: 'diff-view[file="src/main.nim"]', toolbar: "" }, timeout: 15s }
