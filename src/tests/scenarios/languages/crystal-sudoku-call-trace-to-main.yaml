scenario: 1
name: languages/crystal-sudoku-call-trace-to-main
pack: codetracer
summary: >-
  In a Crystal Sudoku solver recording, activating `main` in the call trace shows
  Crystal's own main.cr (the runtime's entry, which runs the program) in the
  editor, with its `status` value drawn beside the code.

stage:
  - use: record-program
    with: { program: crystal_sudoku_solver/sudoku.cr }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 240s }
  - click: 'pane-tab[label="CALLTRACE"]'
  - wait: { until: { at: 'call-trace/call[name="main"]', present: true }, timeout: 120s }
  - click: { at: 'call-trace/call[name="main"]', anchor: name }
    settle: false
  - wait: { until: { at: 'editor[file="main.cr"]', active: true }, timeout: 60s }
  - wait: replay-idle
  - wait: { until: { at: 'editor[file="main.cr"]/flow-value[name="status", line="8"]', present: true }, timeout: 60s }
