scenario: 1
name: languages/d-sudoku-call-trace-to-main
pack: codetracer
summary: >-
  In a D Sudoku solver recording, activating `main` in the call trace shows
  sudoku.d in the editor, with the `testBoards` value drawn beside its line.

stage:
  - use: record-program
    with: { program: d_sudoku_solver/sudoku.d }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 240s }
  - click: 'pane-tab[label="CALLTRACE"]'
  - wait: { until: { at: 'call-trace/call[name="main"]', present: true }, timeout: 120s }
  - click: { at: 'call-trace/call[name="main"]', anchor: name }
    settle: false
  - wait: { until: { at: 'editor[file="sudoku.d"]', active: true }, timeout: 60s }
  - wait: replay-idle
  - wait: { until: { at: 'editor[file="sudoku.d"]/flow-value[name="testBoards"]', present: true }, timeout: 60s }
