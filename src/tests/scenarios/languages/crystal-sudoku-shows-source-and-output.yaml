scenario: 1
name: languages/crystal-sudoku-shows-source-and-output
pack: codetracer
summary: >-
  A Crystal Sudoku solver recording opens on Crystal's own main.cr (the runtime's entry) and its event log
  holds the program's output, "Solved" among it.

stage:
  - use: record-program
    with: { program: crystal_sudoku_solver/sudoku.cr }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 240s }
  - wait: { until: { at: 'editor[file="main.cr"]', present: true }, timeout: 120s }
  - click: 'pane-tab[label="EVENT LOG"]'
  - wait: { until: event-log.loaded, timeout: 120s }
  # The program's output comes after the loader's reads: find it.
  - click: 'search-box[pane="event-log"]'
  - type: Solved
  - wait: { until: { at: event-log, assert: 'has-output("Solved")' }, timeout: 120s }
