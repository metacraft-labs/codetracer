scenario: 1
name: languages/cadence-column-breakpoint
pack: codetracer
summary: >-
  In a Cadence recording, a click at line 4, column 5 then Shift+F9 sets a
  column breakpoint there (its marker drawn at that column), and Continue from the
  entry stops on line 4.

stage:
  - use: record-program
    with: { program: ../codetracer-flow-recorder/test-programs/cadence/flow_test.cdc }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: { at: 'editor[file="flow_test.cdc"]/line[number="4"]', present: true }, timeout: 60s }
  - click: { at: 'editor[file="flow_test.cdc"]/line[number="4"]', anchor: caret(5) }
  - chord: Shift+F9
  - wait: { until: { at: 'editor[file="flow_test.cdc"]/line[number="4"]', inline-breakpoints: ["5"] }, timeout: 30s }
  - click: 'toolbar/toolbar-button[label="continue-image"]'
    settle: false
  - wait: { until: { at: 'editor[file="flow_test.cdc"]', current-line: 4 }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: status-line, location: { matches: "flow_test.cdc:4#" } }
