scenario: 1
name: languages/cairo-recording-smoke
pack: codetracer
summary: >-
  A Cairo recording opens at its entry in flow_test.cairo, with its variables in the state pane and the compute call in the call trace;
  Continue and Next move the replay.

stage:
  - use: record-program
    with: { program: ../codetracer-cairo-recorder/test-programs/cairo/flow_test.cairo }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - expect: { at: window, title: { contains: CodeTracer } }
  - wait: { until: { at: status-line, location: { matches: "flow_test.cairo:[0-9]+#" } }, timeout: 60s }
  - wait: { until: { at: 'editor[file="flow_test.cairo"]', present: true }, timeout: 60s }
  - click: 'pane-tab[label="CALLTRACE"]'
  - wait: { until: call-trace.loaded, timeout: 60s }
  - wait: { until: { at: 'call-trace/call[name="flow_test::flow_test::compute"]', present: true }, timeout: 60s }
  - click: { at: 'call-trace/call[name="flow_test::flow_test::compute"]', anchor: name }
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: variables.loaded, timeout: 60s }
  - expect: { at: status-line, location: { matches: "flow_test.cairo:[0-9]+#" } }
  - click: 'toolbar/toolbar-button[label="continue-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: status-line, location: { matches: "flow_test.cairo:[0-9]+#" } }
