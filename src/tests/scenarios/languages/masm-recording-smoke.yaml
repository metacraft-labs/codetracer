scenario: 1
name: languages/masm-recording-smoke
pack: codetracer
summary: >-
  A Miden assembly recording opens at its entry in compute.masm, with its stack and locals in the state pane and the double_val call in the call trace;
  Continue and Next move the replay.

stage:
  - use: record-program
    with: { program: masm_example/compute.masm }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - expect: { at: window, title: { contains: CodeTracer } }
  - wait: { until: { at: status-line, location: { matches: "compute.masm:[0-9]+#" } }, timeout: 60s }
  - wait: { until: { at: 'editor[file="compute.masm"]', present: true }, timeout: 60s }
  - click: 'pane-tab[label="CALLTRACE"]'
  - wait: { until: call-trace.loaded, timeout: 60s }
  - wait: { until: { at: 'call-trace/call[name="#exec::double_val"]', present: true }, timeout: 60s }
  - click: { at: 'call-trace/call[name="#exec::double_val"]', anchor: name }
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: variables.loaded, timeout: 60s }
  - expect: { at: status-line, location: { matches: "compute.masm:[0-9]+#" } }
  - click: 'toolbar/toolbar-button[label="continue-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: status-line, location: { matches: "compute.masm:[0-9]+#" } }
