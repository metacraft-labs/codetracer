scenario: 1
name: languages/stylus-opens-at-entry
pack: codetracer
summary: >-
  A Stylus contract transaction (the fund tracker, replayed against its
  recorded EVM trace) opens at its entry in the contract's Rust source, lib.rs line 49: the
  status line names the file, the state pane shows the line it stopped on,
  and the event log has the transaction's events.

stage:
  - use: record-program
    with: { program: stylus_fund_tracker, stylus-trace: evm_trace.json }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 240s }
  - expect: { at: window, title: { contains: CodeTracer } }
  - wait: { until: { at: status-line, location: { matches: "lib\\.rs:49#" } }, timeout: 60s }
  - wait: { until: { at: variables, code-line: { contains: " | " } }, timeout: 60s }
  - click: 'pane-tab[label="EVENT LOG"]'
  - wait: { until: event-log.loaded, timeout: 60s }
