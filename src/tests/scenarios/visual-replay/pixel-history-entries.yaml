scenario: 1
name: visual-replay/pixel-history-entries
pack: codetracer
summary: >-
  A click in the middle of frame 2 picks that pixel: Pixel History lists the
  two draw calls that touched it, the second GEID 220, titled as a jump to
  its source line; clicking it selects it.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: visual-replay-capable
  - use: front-end-options
    with: { env: { CODETRACER_VISUAL_REPLAY_FAKE_PLAYER: ready } }
  - use: open-recording
    with: { deployment: web }

steps:
  - wait: { until: replay-idle, timeout: 360s }
  - wait: { until: editor.loaded, timeout: 300s }
  - wait: { until: call-trace.loaded, timeout: 120s }
  - wait: { until: { at: 'pane-tab[label="VIDEO PLAYER"]', present: true }, timeout: 60s }
  - click: { at: 'pane-tab[label="VIDEO PLAYER"]', anchor: title }
  - wait: { until: { at: video-player/frame-image, present: true }, timeout: 60s }
  - click: { at: video-player, anchor: label }
  - wait: { until: { at: video-player, focused: true }, timeout: 10s }
  - key: Home
  - key: Right
  - key: Right
  - wait: { until: { at: video-player/frame-image, frame: 2 }, timeout: 30s }
  - click: video-player/frame-image
  - click: { at: 'pane-tab[label="PIXEL HISTORY"]', anchor: title }
  - wait: { until: { at: pixel-history, count: 2 }, timeout: 30s }
  - expect: { at: 'pixel-history/history-entry[geid="220"]', title: { matches: "[Jj]ump to the source line" } }
  - click: 'pixel-history/history-entry[geid="220"]'
  - wait: { until: replay-idle, timeout: 60s }
