scenario: 1
name: noir-space-ship/loop-iteration-jump
pack: codetracer
summary: >-
  Typing 4 into iterate_asteroids' loop control and pressing Enter jumps the
  replay into that iteration: the debugger stops on the loop body's first
  line, 5, and the loop's values are the fourth pass's.

stage:
  - use: record-program
    with: { program: noir_space_ship }
  - use: open-recording
    with: { width: 2400, height: 1300 }

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - click: 'pane-tab[label="CALLTRACE"]'
  - wait: { until: call-trace.loaded, timeout: 60s }
  - wait: { until: { at: 'call-trace/call[name="iterate_asteroids"]', present: true }, timeout: 60s }
  - click: { at: 'call-trace/call[name="iterate_asteroids"]', anchor: name }
    settle: false
  - wait: { until: { at: 'editor[file="shield.nr"]', active: true }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: { at: 'editor[file="shield.nr"]/loop-control', present: true }, timeout: 60s }
  - click: { at: 'editor[file="shield.nr"]/loop-control', anchor: field }
  - chord: Ctrl+a
  - type: "4"
  - key: Enter
    settle: false
  - wait: { until: { at: 'editor[file="shield.nr"]/loop-control', iteration: 4 }, timeout: 60s }
  - wait: { until: { at: 'editor[file="shield.nr"]', current-line: 5 }, timeout: 60s }
  - wait: { until: { at: 'editor[file="shield.nr"]/flow-value[line="5", name="mass"]', iteration: 4 }, timeout: 60s }
