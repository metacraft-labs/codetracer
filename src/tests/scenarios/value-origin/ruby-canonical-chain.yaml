scenario: 1
name: value-origin/ruby-canonical-chain
pack: codetracer
summary: >-
  Stopped at the line that prints `c` in the Ruby trivial chain, the row
  menu's "Show value origin" on `c` expands its chain under the row:
  `c = b`, `b = a`, `a = 10`, ending at 10.

stage:
  - use: record-program
    with: { program: src/db-backend/tests/fixtures/origin/ruby/simple_trivial_chain/main.rb }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: 'toolbar/toolbar-button[label="run-to-entry-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: { at: 'editor[file="main.rb"]', current-line: { gt: 0 } }, timeout: 60s }
  - click: { at: 'editor[file="main.rb"]/line[number="6"]', anchor: glyph }
  - click: 'toolbar/toolbar-button[label="continue-image"]'
    settle: false
  - wait: { until: { at: 'editor[file="main.rb"]', current-line: 6 }, timeout: 60s }
  - wait: { until: { at: variables, assert: 'value-of("c", "10")' }, timeout: 60s }

  - click: { at: 'variables/variable[name="c"]', anchor: name, button: right }
  - wait: { until: { at: context-menu, assert: 'offers("Show value origin")' }, timeout: 15s }
  - click: 'context-menu/menu-item[label="Show value origin"]'
  - wait: { until: { at: 'variables/variable[name="c"]/origin-chain', hops: [c = b, b = a, a = 10] }, timeout: 30s }
  - expect: { at: 'variables/variable[name="c"]/origin-chain', terminator: "10" }
