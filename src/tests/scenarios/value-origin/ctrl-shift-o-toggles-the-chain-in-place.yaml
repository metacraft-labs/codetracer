scenario: 1
name: value-origin/ctrl-shift-o-toggles-the-chain-in-place
pack: codetracer
summary: >-
  With `c`'s value pressed (the row focused), Ctrl+Shift+O expands its chain
  under the row without opening the side panel, and again folds it; the
  replay stays at `print(c)`.

stage:
  - use: record-program
    with: { program: src/db-backend/tests/fixtures/origin/python/simple_trivial_chain/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: 'toolbar/toolbar-button[label="run-to-entry-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: { at: 'editor[file="main.py"]', current-line: { gt: 0 } }, timeout: 60s }
  - click: { at: 'editor[file="main.py"]/line[number="12"]', anchor: glyph }
  - click: 'toolbar/toolbar-button[label="continue-image"]'
    settle: false
  - wait: { until: { at: 'editor[file="main.py"]', current-line: 12 }, timeout: 60s }
  - wait: { until: { at: variables, assert: 'value-of("c", "10")' }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }

  - click: { at: 'variables/variable[name="c"]', anchor: value }
  - chord: Ctrl+Shift+O
  - wait: { until: { at: 'variables/variable[name="c"]/origin-chain', count: 3 }, timeout: 30s }
  - expect: { at: origin-panel, present: false }
  - click: { at: 'variables/variable[name="c"]', anchor: value }
  - chord: Ctrl+Shift+O
  - wait: { until: { at: 'variables/variable[name="c"]/origin-chain', present: false }, timeout: 15s }
  - expect: { at: 'editor[file="main.py"]', current-line: 12 }
  - expect: { at: status-line, location: { contains: "main.py:12" } }
