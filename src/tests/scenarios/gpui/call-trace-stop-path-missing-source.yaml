scenario: 1
name: gpui/call-trace-stop-path-missing-source
pack: codetracer
summary: >-
  A stop in a file the recording does not hold says so, naming the path the
  recorder reported (`…/multi_root/app/../shared/helpers.py`), and draws none
  of another file's lines in its place: helpers.py is taken out of the
  recording's source store, while extra.py, its neighbour, is still there.

stage:
  - use: record-program
    with: { program: multi_root/app/main.py }
  - use: drop-recorded-file
    with: { name: helpers.py }
  - use: open-recording
    with: { width: 1440, height: 1400 }

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: call-trace.loaded, timeout: 60s }
  - click: { at: 'call-trace/call[name="add"]' }
  - wait: { until: { at: 'pane-tab[label="shared/helpers.py"]', present: true }, timeout: 60s }
  - wait:
      until:
        at: 'pane[title="shared/helpers.py"]'
        text: { contains: "/multi_root/app/../shared/helpers.py in this recording." }
      timeout: 60s
  - expect: { at: 'pane[title="shared/helpers.py"]', assert: 'lacks-row("No verified source")' }
  - expect: { at: 'pane[title="shared/helpers.py"]', assert: 'lacks-row("def scale(value, factor):")' }
