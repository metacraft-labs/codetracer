scenario: 1
name: gpui/top-bar-ctrl-o-reveals-docked
pack: codetracer
summary: >-
  Under the Vim keymap, Ctrl+O reveals the first docked pane (Build Output) itself over the panes,
  and Esc hides it again.

stage:
  - use: record-program
    with: { program: calc }
  # Ctrl+O is the Vim and Kakoune bases' reveal (CUA's opens a file)
  - use: select-keymap
    with: { preset: vim }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - expect: { at: 'pane[title="Build Output"]', absent: true }
  - chord: Ctrl+O
  - wait: { until: { at: 'pane[title="Build Output"]', present: true }, timeout: 30s }
  - key: Esc
  - wait: { until: { at: 'pane[title="Build Output"]', absent: true }, timeout: 30s }
