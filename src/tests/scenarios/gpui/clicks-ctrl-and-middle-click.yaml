scenario: 1
name: gpui/clicks-ctrl-and-middle-click
pack: codetracer
summary: >-
  Ctrl+click on a line of the editor goes to it, and so does a middle click;
  the status line says where the replay is.

stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "shows-line(36)" }, timeout: 60s }
  - click: { at: 'editor[file="main.py"]/line[number="31"]', anchor: text-start, modifiers: [Ctrl] }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(31)" }, timeout: 60s }
  - expect: { at: status-line, location: { contains: "main.py:31" } }
  - click: { at: 'editor[file="main.py"]/line[number="36"]', anchor: text-start, button: middle }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(36)" }, timeout: 60s }
  - expect: { at: status-line, location: { contains: "main.py:36" } }
