scenario: 1
name: gpui/constraints-pane-in-edit-mode
pack: codetracer
summary: >-
  In an Edit window on a Noir circuit, `:constraints` measures it and the Constraints pane lists the opcodes by the lines that declare them.

stage:
  - use: fixture-project
    with: { name: noir-constraints }
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: ready, timeout: 60s }
  # Edit mode's shared default places the pane (beside Build Output)
  - wait: { until: { at: 'pane-tab[label="Constraints"]', present: true }, timeout: 30s }
  - click: { at: 'pane-tab[label="Constraints"]' }
  - wait: { until: { at: 'pane[title="Constraints"]', assert: 'has-row("ACIR opcodes")' }, timeout: 180s }
  - wait: { until: settled, timeout: 60s }
  # opcode rows name their source line (`main`'s own row is cut at the
  # pane's width, so its `:3` is not drawn)
  - expect: { at: 'pane[title="Constraints"]', assert: ['has-row("src/main.nr:4")', 'has-row("src/checks.nr:2")'] }
