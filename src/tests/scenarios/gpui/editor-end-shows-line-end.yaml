scenario: 1
name: gpui/editor-end-shows-line-end
pack: codetracer
summary: >-
  The caret follows sideways: on the wide line, End puts the caret after its
  last character and the view scrolls to show the line's end.

stage:
  - use: record-program
    with: { program: wide_lines/main.py }
  - use: open-recording
    with: { width: 1440, height: 900 }

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: editor.loaded, timeout: 60s }
  - click: { at: 'editor[file="main.py"]/line[number="26"]', anchor: text-start }
  - expect: { at: 'editor[file="main.py"]', assert: "caret-at(26)" }
  - expect:
      at: 'editor[file="main.py"]/line[number="26"]'
      text: { contains: "WIDE_SOURCE" }
  - key: End
  - expect:
      at: 'editor[file="main.py"]/line[number="26"]'
      text: { contains: "RIGHT-EDGE" }
  - expect: { at: 'editor[file="main.py"]', assert: "caret-at(26)" }
