scenario: 1
name: gpui/keys-edit-mode-step-refused
pack: codetracer
summary: >-
  F12 (step out) in an Edit window steps nothing and the window says why —
  stepping needs a replay session — and the document takes no key.

stage:
  - use: copy-project
    with: { folder: calc/main.py }
  - use: open-project
    with: { folder: $project, file: main.py }

steps:
  - wait: { until: editor.loaded, timeout: 60s }
  - expect:
      at: 'editor[file="main.py"]/line[number="1"]'
      text: { contains: "#!/usr/bin/env python3" }
  - key: F12
  - wait: { until: { at: 'pane[title="project/main.py"]', assert: 'has-row("replay session")' }, timeout: 30s }
  - expect:
      at: 'editor[file="main.py"]/line[number="1"]'
      text: { contains: "#!/usr/bin/env python3" }
