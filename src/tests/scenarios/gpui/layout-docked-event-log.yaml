scenario: 1
name: gpui/layout-docked-event-log
pack: codetracer
summary: >-
  A saved layout that docks the Event Log at the bottom opens with the Event
  Log as a label in the window's bottom strip, not a pane of the centre, and
  every other pane in the centre.

stage:
  - use: record-program
    with: { program: calc }
  - use: saved-layout
    with: { file: gpui-layout.json, ops: "dock:eventLog:bottom" }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - expect: { at: 'pane-tab[label="Event Log"]', absent: true }
  - expect: { at: 'dock-label[label="EVENT LOG"]', present: true }
  - expect: { at: 'pane[title="Terminal Output"]', present: true }
  - expect: { at: 'pane[title="Call Trace"]', present: true }
  - expect: { at: 'pane[title="Files"]', present: true }
