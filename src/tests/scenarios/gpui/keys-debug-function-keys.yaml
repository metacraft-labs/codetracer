scenario: 1
name: gpui/keys-debug-function-keys
pack: codetracer
summary: >-
  In a replay the function keys step as on the desktop (the CUA keymap): F10
  steps over, Shift+F10 steps back over, F11 steps in — each moving the
  execution line the editor draws.

stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', current-line: 1 }, timeout: 60s }
  - key: F10
  - wait: { until: { at: 'editor[file="main.py"]', current-line: 2 }, timeout: 60s }
  - chord: Shift+F10
  - wait: { until: { at: 'editor[file="main.py"]', current-line: 1 }, timeout: 60s }
  - key: F11
  - wait: { until: { at: 'editor[file="main.py"]', current-line: 2 }, timeout: 60s }
