scenario: 1
name: multi-replay/two-tabs-choosing-at-once-each-load-their-own
pack: codetracer
summary: >-
  With two "+" tabs, an rr recording chosen in one and, at once, another
  chosen in the second tab: each tab loads the recording it asked for
  (main.c in the first, data_model.py in the second), and neither takes the
  other's.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: add-recording
    with: { program: c_sudoku_solver/main.c, backend: rr }
  - use: add-recording
    with: { program: py_checklist/data_model.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: { at: 'editor[file="main.py"]', present: true }, timeout: 60s }
  - click: session-strip/session-add
  - wait: { until: { at: session-strip, count: 2 }, timeout: 30s }
  - click: session-strip/session-add
  - wait: { until: { at: session-strip, count: 3 }, timeout: 30s }
  - wait: { until: { at: 'welcome/recent[name="main.c"]', present: true }, timeout: 30s }
  - click: 'session-strip/session-tab[title="Trace 2"]'
  - wait: { until: { at: 'welcome/recent[name="main.c"]', present: true }, timeout: 30s }
  - click: 'welcome/recent[name="main.c"]'
    settle: false
  - click: 'session-strip/session-tab[title="Trace 3"]'
    settle: false
  - wait: { until: { at: 'welcome/recent[name="data_model.py"]', present: true }, timeout: 30s }
  - click: 'welcome/recent[name="data_model.py"]'
    settle: false
  - wait: { until: { at: 'session-strip/session-tab[title="data_model.py"]', active: true }, timeout: 120s }
  - wait: { until: { at: 'editor[file="data_model.py"]', present: true }, timeout: 120s }
  - wait: { until: { at: session-strip, assert: 'has-tab("main.c")' }, timeout: 300s }
  - wait: { until: replay-idle, timeout: 120s }
  - click: 'session-strip/session-tab[title="main.c"]'
  - wait: { until: { at: 'editor[file="main.c"]', present: true }, timeout: 120s }
  - expect: { at: 'editor[file="data_model.py"]', absent: true }
  - click: 'session-strip/session-tab[title="main.py"]'
  - wait: { until: { at: 'editor[file="main.py"]', present: true }, timeout: 60s }
