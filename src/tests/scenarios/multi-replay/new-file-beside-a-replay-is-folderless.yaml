scenario: 1
name: multi-replay/new-file-beside-a-replay-is-folderless
pack: codetracer
summary: >-
  New file in a "+" tab beside a replay opens, as it does alone, a session with no project folder:
  Files shows no tree and is not loading, VCS says there is no repository
  and lists no commits, and Test Results says no project folder is open.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: { at: 'editor[file="main.py"]', present: true }, timeout: 60s }
  - click: session-strip/session-add
  - wait: { until: { at: 'welcome/welcome-action[label="New file"]', present: true }, timeout: 60s }
  - click: 'welcome/welcome-action[label="New file"]'
  - wait: { until: { at: welcome, absent: true }, timeout: 60s }
  - wait: { until: settled, timeout: 60s }
  - click: 'pane-tab[label="FILES"]'
  - wait: { until: { at: filesystem, loading: false }, timeout: 60s }
  - expect: { at: filesystem, count: 0 }
  - click: 'pane-tab[label="VCS"]'
  - wait: { until: { at: vcs, no-repo: true }, timeout: 60s }
  - expect: { at: vcs, commits: 0 }
  - click: 'pane-tab[label="TESTS"]'
  - wait: { until: { at: test-results, absence: { matches: "[Nn]o project folder is open" } }, timeout: 60s }
