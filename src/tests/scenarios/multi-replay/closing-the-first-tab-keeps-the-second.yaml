scenario: 1
name: multi-replay/closing-the-first-tab-keeps-the-second
pack: codetracer
summary: >-
  Closing the first tab (its replay) next to a second tab removes it: the
  strip is left with the second tab, shown.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', present: true }, timeout: 60s }
  - click: session-strip/session-add
  - wait: { until: { at: session-strip, count: 2 }, timeout: 30s }
  - click: { at: 'session-strip/session-tab[title="main.py"]', anchor: close }
  - wait: { until: { at: session-strip, count: 1 }, timeout: 30s }
  - expect: { at: 'session-strip/session-tab[title="main.py"]', absent: true }
  - expect: { at: 'editor[file="main.py"]', absent: true }
  - expect: { at: welcome, present: true }
