scenario: 1
name: multi-replay/stepping-one-tab-moves-only-it
pack: codetracer
summary: >-
  With two recordings in two tabs, a step in one moves that tab's replay
  only: the other tab is where it was left when shown again.

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: add-recording
    with: { program: py_checklist/basics.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', present: true }, timeout: 60s }
  - wait: { until: { at: status-line, location: { matches: "main.py:1#" } }, timeout: 60s }
  - click: session-strip/session-add
  - wait: { until: { at: 'welcome/recent[name="basics.py"]', present: true }, timeout: 30s }
  - click: 'welcome/recent[name="basics.py"]'
    settle: false
  - wait: { until: { at: 'editor[file="basics.py"]', present: true }, timeout: 120s }
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: status-line, location: { matches: "basics.py:1#" } }, timeout: 60s }
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: { until: { at: status-line, location: { matches: "basics.py:([2-9]|[1-9][0-9])#" } }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - click: 'session-strip/session-tab[title="main.py"]'
  - wait: { until: { at: 'editor[file="main.py"]', present: true }, timeout: 60s }
  - wait: { until: { at: status-line, location: { matches: "main.py:1#" } }, timeout: 60s }
  - click: 'toolbar/toolbar-button[label="next-image"]'
    settle: false
  - wait: { until: { at: status-line, location: { matches: "main.py:8#" } }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - click: 'session-strip/session-tab[title="basics.py"]'
  - wait: { until: { at: 'editor[file="basics.py"]', present: true }, timeout: 60s }
  - wait: { until: { at: status-line, location: { matches: "basics.py:([2-9]|[1-9][0-9])#" } }, timeout: 60s }
