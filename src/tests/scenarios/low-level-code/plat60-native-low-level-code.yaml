scenario: 1
name: low-level-code/plat60-native-low-level-code
pack: codetracer
summary: >-
  On an rr recording of the native sudoku solver, Alt+1 shows the function's
  machine code at numeric offsets under "Originating address: 0x…", the
  header says a step goes by instruction. The replay is at the function's
  entry, the listing's first row; with the listing focused, F10 steps one
  instruction, to the second row, and Shift+F10 steps back to the first. The rows, not the
  offsets: where the program is loaded moves the offsets from one recording
  and machine to the next.

stage:
  - use: record-program
    with: { program: ../codetracer-native-test-programs/c/sudoku_solver/main.c, backend: rr }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 300s }
  - chord: Alt+1
    settle: false
  - wait: { until: { at: low-level-code, count: { gt: 10 } }, timeout: 120s }
  - expect: { at: low-level-code, address: { matches: "^Originating address: 0x[0-9A-Fa-f]+$" } }
  - wait: { until: { at: low-level-code, stepping: "steps by instruction" }, timeout: 30s }
  - expect: { at: low-level-code, assert: "all-offsets-match(\"^[0-9]+$\")" }
  - expect: { at: low-level-code, pointer: { matches: "^[0-9]+$" }, pointer-index: 0 }
  # A press on the header focuses the listing without moving the replay, so
  # its steps go by instruction. Each step rebuilds rows; the focus stays in
  # the listing, so the step after it goes by instruction too
  # (codetracer-pm issue 2026-11-14: Shift+F10 went by line and left the
  # function).
  - click: { at: low-level-code, anchor: header }
  - wait: { until: { at: low-level-code, focused: true }, timeout: 10s }
  - key: F10
    settle: false
  - wait: { until: { at: low-level-code, pointer-index: 1 }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: low-level-code, stepping: "steps by instruction" }
  - wait: { until: { at: low-level-code, focused: true }, timeout: 10s }
  - chord: Shift+F10
    settle: false
  - wait: { until: { at: low-level-code, pointer-index: 0 }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
