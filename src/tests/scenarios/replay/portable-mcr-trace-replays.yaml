scenario: 1
name: replay/portable-mcr-trace-replays
pack: codetracer
summary: >-
  The portable MCR recording made on this platform (linux-x86_64, from
  codetracer-example-recordings) ends the way debugserver.md prescribes for a
  Linux x86-64 interpose recording in trace mode: the stage0 emulator serves
  one recorded thread from a stage0 boundary, and this fixture records four
  threads, so the user is told the replay could not start and why, by
  ct-mcr's own words ("trace mode ..."). The same rule as
  expectedMcrPortableOutcome in src/tests/gui/lib/mcr-portable-replay.ts.

stage:
  - use: open-recording
    with: { recording: ../codetracer-example-recordings/mcr/linux-x86_64 }

steps:
  - wait: { until: { at: status-line, notifications: { contains: "The replay could not start: ct-mcr debugserver did not serve" } }, timeout: 300s }
  - expect: { at: status-line, notifications: { contains: "trace mode" } }
