scenario: 1
name: replay/portable-windows-recording-replays
pack: codetracer
summary: >-
  A portable MCR recording made on Windows x86-64 (codetracer-example-recordings),
  opened through `ct host` in a browser on another platform, replays: the
  status bar shows a location in the recorded program's source,
  `ct_fixture_prog.c` (the name its PDB gives it). The replay starts from the
  recording's START boundary, at the program's entry point (codetracer-pm
  MCR-Portable-Trace-Format.md M14h), so it reaches `main` well within the
  budget.

stage:
  - use: portable-recording
    with: { platform: windows-x86_64 }
  - use: open-recording
    with: { deployment: web }

steps:
  - wait: { until: { at: status-line, location: { contains: "ct_fixture_prog.c:" } }, timeout: 300s }
