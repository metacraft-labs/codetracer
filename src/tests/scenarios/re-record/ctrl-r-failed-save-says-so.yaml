scenario: 1
name: re-record/ctrl-r-failed-save-says-so
pack: codetracer
summary: >-
  When the edited file cannot be written, Ctrl+R fails visibly — an error
  is notified — and no recording starts: the replay stays the original
  one.

stage:
  - use: write-project
    with: { files: { main.py: "print(\"initial\")\n" } }
  - use: record-program
    with: { program: $project/main.py }
  - use: read-only-file
    with: { file: main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', assert: 'shows-text("initial")' }, timeout: 60s }
  - chord: Ctrl+E
  - wait: { until: { at: 'editor[file="main.py"]', read-only: false }, timeout: 30s }
  - click: { at: 'editor[file="main.py"]/line[number="1"]', anchor: text-start }
  - chord: Ctrl+A
  - type: "print(\"never reaches disk\")"
  - wait: { until: { at: 'editor[file="main.py"]', assert: 'shows-text("never reaches disk")' }, timeout: 15s }
  - chord: Ctrl+R
    settle: false
  - wait: { until: { at: status-line, notifications: { matches: "(could not|cannot|failed|rror|denied)" } }, timeout: 60s }
  - expect: { at: status-line, assert: 'lacks("Building/recording a new trace")' }
