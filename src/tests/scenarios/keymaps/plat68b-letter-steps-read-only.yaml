scenario: 1
name: keymaps/plat68b-letter-steps-read-only
pack: codetracer
summary: >-
  In the read-only editor the letter n steps over, and types nothing into the file.

stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: call-trace.loaded, timeout: 120s }
  - expect: { at: 'editor[file="main.py"]', assert: "stopped-at(1)" }
  - click: { at: 'editor[file="main.py"]/line[number="1"]', anchor: text-start }
  - expect: { at: 'editor[file="main.py"]', focused: true }
  - key: n
    settle: false
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(2)" }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: 'editor[file="main.py"]/line[number="1"]', text: "#!/usr/bin/env python3" }
  - expect: { at: 'editor[file="main.py"]', read-only: true }
