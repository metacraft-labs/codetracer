scenario: 1
name: keymaps/plat68c-f12-inert-in-edit-mode
pack: codetracer
summary: >-
  A key inert in this product mode says so: F12 (Step Out) in Edit mode puts
  its reason — it needs a replay session — on the status bar.

stage:
  - use: open-project
    with: { folder: calc, file: main.py }

steps:
  - wait: { until: editor.loaded, timeout: 120s }
  - click: { at: 'editor[file="main.py"]/line[number="1"]', anchor: text-start }
  # The notice leaves the status bar by itself after a few seconds: read it
  # while it is up (no settle after the key), its words and that it is the
  # only one in one observation.
  - key: F12
    settle: false
  - wait: { until: { at: status-line, notifications: { count: 1 }, assert: "notifies(\"needs a replay session\")" }, timeout: 10s }
