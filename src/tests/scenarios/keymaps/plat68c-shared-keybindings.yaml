scenario: 1
name: keymaps/plat68c-shared-keybindings
pack: codetracer
summary: >-
  One keybindings.json for every front-end: Step Over bound to Ctrl+Alt+J only
  while a list pane has the focus, and F10 removed. With the caret in the
  editor Ctrl+Alt+J does nothing; after Alt+C focuses the call trace, the
  removed F10 does nothing and Ctrl+Alt+J steps over.

stage:
  - use: record-program
    with: { program: calc }
  - use: plant-config
    with:
      file: keybindings.json
      content: |
        // one keymap for every front-end
        [
          { "key": "ctrl+alt+j", "command": "debugger.step-over", "when": "listFocus" },
          { "key": "f10", "command": "-debugger.step-over" },
        ]
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: call-trace.loaded, timeout: 120s }
  - expect: { at: 'editor[file="main.py"]', assert: "stopped-at(1)" }
  - click: { at: 'editor[file="main.py"]/line[number="1"]', anchor: text-start }
  - expect: { at: 'editor[file="main.py"]', focused: true }
  - chord: Ctrl+Alt+J
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: 'editor[file="main.py"]', assert: "stopped-at(1)" }
  - chord: Alt+C
  - expect: { at: call-trace, focused: true }
  - key: F10
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: 'editor[file="main.py"]', assert: "stopped-at(1)" }
  - chord: Ctrl+Alt+J
    settle: false
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(2)" }, timeout: 60s }
