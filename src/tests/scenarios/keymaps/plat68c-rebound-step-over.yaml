scenario: 1
name: keymaps/plat68c-rebound-step-over
pack: codetracer
summary: >-
  A user row rebinds Step Over to Ctrl+Alt+N and removes F10: F10 does
  nothing, Ctrl+Alt+N steps, and every surface that shows the chord says
  Ctrl+Alt+N — the Debug menu, the toolbar's tooltip, the shortcuts dialog's
  stepping row and its reference (where the removed F10 row is not listed).

stage:
  - use: record-program
    with: { program: calc }
  - use: plant-config
    with:
      file: keybindings.json
      content: |
        [
          { "key": "ctrl+alt+n", "command": "debugger.step-over" },
          { "key": "f10", "command": "-debugger.step-over" },
        ]
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: call-trace.loaded, timeout: 120s }
  - click: { at: 'editor[file="main.py"]/line[number="1"]', anchor: text-start }
  - key: F10
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: 'editor[file="main.py"]', assert: "stopped-at(1)" }
  - chord: Ctrl+Alt+N
    settle: false
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(2)" }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - click: { at: menu-bar }
  - hover: { at: 'menu-bar/menu[label="Debug"]', for: 500ms }
  - wait: { until: { at: 'menu-bar/menu-item[label="Step Over"]', present: true }, timeout: 10s }
  - expect: { at: menu-bar, assert: 'shows-chord("Step Over", "Ctrl+Alt+N")' }
  - key: Esc
  - key: Esc
  - hover: { at: 'toolbar/toolbar-button[label="next-image"]', for: 1s }
  - expect: { at: 'toolbar/toolbar-button[label="next-image"]', tooltip: "Next (Ctrl+Alt+N)", tooltip-shown: true }
  - click: { at: 'editor[file="main.py"]/line[number="2"]', anchor: text-start }
  - chord: Ctrl+K Ctrl+S
  - wait: { until: { at: shortcuts-dialog, present: true }, timeout: 20s }
  - expect: { at: 'shortcuts-dialog/shortcut-row[action="forwardNext"]', chord: Ctrl+Alt+N }
  - expect: { at: 'shortcuts-dialog/binding-row[operation="debugger.step-over", key="ctrl+alt+n"]', layer: { matches: "^user:" } }
  - expect: { at: 'shortcuts-dialog/binding-row[operation="debugger.step-over", key="F10"]', absent: true }
  - click: { at: 'shortcuts-dialog/dialog-button[label="Close"]' }
  - expect: { at: shortcuts-dialog, absent: true }
