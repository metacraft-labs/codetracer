scenario: 1
name: keymaps/plat68c-escape-layer-stack
pack: codetracer
summary: >-
  The layer stack through input: with the find widget open, Escape pressed
  in the call trace leaves it open; back in the editor (Alt+V), Escape closes
  it.

stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 180s }
  - wait: { until: call-trace.loaded, timeout: 120s }
  - click: { at: 'editor[file="main.py"]/line[number="1"]', anchor: text-start }
  - chord: Ctrl+F
  - wait: { until: { at: 'editor[file="main.py"]', find-shown: true }, timeout: 20s }
  - click: { at: 'call-trace/call[name="main"]' }
  - wait: { until: replay-idle, timeout: 60s }
  - expect: { at: call-trace, focused: true }
  - key: Esc
  - expect: { at: 'editor[file="main.py"]', find-shown: true }
  - chord: Alt+V
  - expect: { at: 'editor[file="main.py"]', focused: true }
  - key: Esc
  - wait: { until: { at: 'editor[file="main.py"]', find-shown: false }, timeout: 10s }
