scenario: 1
name: terminal/panes-footer-dock-label
pack: codetracer
summary: >-
  The footer's auto-hide panels are labels on the status row; a click on
  BUILD docks the Build pane open in the arrangement ("No build has run."), it
  stays when the pointer leaves, and a second click closes it again.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - expect: { at: 'dock-label[label="BUILD"]', present: true }
  - expect: { at: 'dock-label[label="PROBLEMS"]', present: true }
  - expect: { at: 'dock-label[label="FIND IN FILES"]', present: true }
  - expect: { at: 'dock-label[label="REQUESTS"]', present: true }
  - expect: { at: 'pane[title="BUILD"]', absent: true }
  - click: { at: 'dock-label[label="BUILD"]' }
  - wait: { until: { at: 'pane[title="BUILD"]', present: true }, timeout: 10s }
  - expect: { at: 'pane[title="BUILD"]', assert: 'shows("No build has run.")' }
  - expect: { at: status-line, assert: 'lacks("openDocked")' }
  - move: { at: 'editor[file="main.py"]' }
  - expect: { at: 'pane[title="BUILD"]', present: true }
  - click: { at: 'dock-label[label="BUILD"]' }
  - wait: { until: { at: 'pane[title="BUILD"]', absent: true }, timeout: 10s }
