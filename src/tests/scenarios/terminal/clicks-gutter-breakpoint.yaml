scenario: 1
name: terminal/clicks-gutter-breakpoint
pack: codetracer
summary: >-
  A click in the gutter sets a breakpoint the replay then stops at (Continue
  lands on line 31); a right click on it disables it, and Continue then runs
  to the end of the recording.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "shows-line(31)" }, timeout: 30s }
  - click: { at: 'editor[file="main.py"]/line[number="31"]', anchor: gutter }
  - wait: { until: { at: 'editor[file="main.py"]/line[number="31"]', breakpoint: true }, timeout: 10s }
  - key: c
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(31)" }, timeout: 30s }
  - click: { at: 'editor[file="main.py"]/line[number="31"]', anchor: gutter, button: right }
  - wait: { until: { at: status-line, assert: 'says("disabled the breakpoint at line 31")' }, timeout: 10s }
  - key: c
  - wait: { until: { at: replay-position, tick: 171 }, timeout: 30s }
