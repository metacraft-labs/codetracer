scenario: 1
name: terminal/agent-activity-open-recording-in-this-tab
pack: codetracer
summary: >-
  A review's `ct test` run card, opened, offers [Open recording]: it
  replaces this tab's session (one tab still, the status line says "in this
  tab"), and Agent Activity still holds the run card.
stage:
  - use: record-program
    with: { program: calc }
  - use: review-session
    with: { run: test-run }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: { at: 'pane-tab[label="Agent Activity"]' }
  - wait: { until: { at: 'pane[title="Agent Activity"]', assert: 'has-row("▌ ▸")' }, timeout: 60s }
  - click: { at: 'pane[title="Agent Activity"]/row[first="▌ ▸ ct-mcr record --source tests/calc.c"]', anchor: text-start }
  - wait: { until: { at: 'pane[title="Agent Activity"]', assert: 'has-row("[Open recording]")' }, timeout: 30s }
  - click: { at: 'pane[title="Agent Activity"]/row[first="passed test_add"]/cell[text="[Open recording]"]' }
    settle: false
  - wait: { until: { at: status-line, assert: 'says("in this tab")' }, timeout: 120s }
  - expect: { at: session-strip, count: 1 }
  - wait: { until: replay-idle, timeout: 120s }
  - click: { at: 'pane-tab[label="Agent Activity"]' }
  - wait: { until: { at: 'pane[title="Agent Activity"]', assert: 'has-row("ct test record")' }, timeout: 60s }
  - expect: { at: 'pane[title="Agent Activity"]', assert: 'has-row("[Open recording]")' }
