scenario: 1
name: terminal/clicks-dock-label-menu-unpin
pack: codetracer
summary: >-
  A right click on the BUILD dock label opens the desktop's strip menu (Pin
  to Left, Right, Top, Unpin, Close — no Pin to Bottom, where it already is);
  Unpin takes it off the footer.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: { at: 'dock-label[label="BUILD"]', button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Unpin"]', present: true }, timeout: 10s }
  - expect: { at: 'context-menu/menu-item[label="Pin to Right"]', geometry: { below: 'context-menu/menu-item[label="Pin to Left"]' } }
  - expect: { at: 'context-menu/menu-item[label="Pin to Top"]', geometry: { below: 'context-menu/menu-item[label="Pin to Right"]' } }
  - expect: { at: 'context-menu/menu-item[label="Unpin"]', geometry: { below: 'context-menu/menu-item[label="Pin to Top"]' } }
  - expect: { at: 'context-menu/menu-item[label="Close"]', geometry: { below: 'context-menu/menu-item[label="Unpin"]' } }
  - expect: { at: context-menu, assert: 'lacks("Pin to Bottom")' }
  - click: { at: 'context-menu/menu-item[label="Unpin"]' }
  - wait: { until: { at: 'dock-label[label="BUILD"]', absent: true }, timeout: 10s }
