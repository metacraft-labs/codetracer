scenario: 1
name: terminal/keys-enter-opens-the-tracepoint-editor
pack: codetracer
summary: >-
  In the read-only editor Enter opens the tracepoint editor on the caret's
  line, and the expression typed there runs on that line (main.py:11).
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: { at: 'editor[file="main.py"]/line[number="11"]', anchor: "column(5)" }
  - key: Enter
  - wait: { until: { at: status-line, assert: 'says(":tracepoint")' }, timeout: 10s }
  - type: "left"
  - key: Enter
  - wait: { until: { at: status-line, assert: 'says("tracepoint `left` at ")' }, timeout: 60s }
  - expect: { at: status-line, assert: 'says("main.py:11")' }
