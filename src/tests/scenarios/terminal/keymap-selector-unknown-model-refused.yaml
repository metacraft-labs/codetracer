scenario: 1
name: terminal/keymap-selector-unknown-model-refused
pack: codetracer
summary: >-
  An unknown keymap model is refused by name: a stored `nano` preference is
  named on the status line at start, and `:keymap default` typed is refused
  naming 'default'.
stage:
  - use: write-project
    with: { files: { doc.txt: "alpha beta\ngamma delta\n" } }
  - use: plant-state
    with: { file: keymap, content: "nano\n" }
  - use: open-project
    with: { folder: $project, file: doc.txt, width: 160, height: 40 }
steps:
  - wait: { until: ready, timeout: 60s }
  - wait: { until: { at: status-line, assert: "says(\"'nano'\")" }, timeout: 20s }
  - key: F1
  - wait: { until: { at: status-line, assert: 'says("PALETTE ")' }, timeout: 10s }
  - type: ":keymap default"
  - key: Enter
  - wait: { until: { at: status-line, assert: "says(\"'default'\")" }, timeout: 10s }
