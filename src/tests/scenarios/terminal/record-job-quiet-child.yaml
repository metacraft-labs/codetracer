scenario: 1
name: terminal/record-job-quiet-child
pack: codetracer
summary: >-
  While a welcome tab's Record new trace job runs a program that has gone
  quiet (it sleeps without writing), the window keeps answering: Alt+F opens
  the File menu at once; and once the program wakes and exits, the recording
  still opens in the tab.
stage:
  - use: record-program
    with: { program: calc }
  - use: write-project
    with:
      files:
        napper.py: |
          import time
          def nap(seconds):
              print("going quiet", flush=True)
              time.sleep(seconds)
              return seconds

          nap(20)
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - chord: Alt+f
  - wait: { until: { at: 'dropdown[level="2"]/dropdown-item[label="New Trace Tab"]', present: true }, timeout: 10s }
  - click: { at: 'dropdown[level="2"]/dropdown-item[label="New Trace Tab"]' }
  - wait: { until: { at: welcome, present: true }, timeout: 10s }
  - click: { at: 'welcome/welcome-action[label="Record new trace"]' }
  - wait: { until: { at: welcome, assert: 'shows("Program to record")' }, timeout: 10s }
  - type: "napper.py"
  - key: Enter
  - wait: { until: { at: welcome, assert: 'shows("recording napper.py")' }, timeout: 60s }
  - chord: Alt+f
    settle: false
  - wait: { until: { at: 'dropdown[level="2"]/dropdown-item[label="New Trace Tab"]', present: true }, timeout: 4s }
  - key: Esc
  - wait: { until: { at: 'dropdown[level="2"]', absent: true }, timeout: 10s }
  - expect: { at: welcome, assert: 'shows("recording napper.py")' }
  - key: Esc
  - wait: { until: { at: session-strip, assert: 'has-tab-matching("napper")' }, timeout: 240s }
  - wait: { until: { at: welcome, absent: true }, timeout: 60s }
