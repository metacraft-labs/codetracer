scenario: 1
name: terminal/low-level-code-beside-the-source
pack: codetracer
summary: >-
  Alt+1 opens the Low Level Code pane beside the source (and says so), its
  header `sync on` and `steps by line`, listing instructions under their
  source lines; a right press on an instruction opens the four-entry menu
  (Go to Source Line, Show Source Line, Copy Instruction, Copy Source
  Location).
stage:
  - use: record-program
    with: { program: noir_space_ship }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 180s }
  - expect: { at: 'pane-tab[label="Low Level Code"]', absent: true }
  - chord: Alt+1
  - wait: { until: { at: status-line, assert: 'says("Low Level Code beside the source")' }, timeout: 30s }
  - wait: { until: { at: 'pane[title="Low Level Code"]', assert: 'has-row("sync on")' }, timeout: 30s }
  - expect: { at: 'pane[title="Low Level Code"]', assert: ['has-row("steps by line")', 'has-row("StepId(")'] }
  - click: { at: 'pane[title="Low Level Code"]/row[text="StepId(1)     <no instructions>"]', anchor: text-start, button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - expect: { at: context-menu, assert: ['offers("Go to Source Line")', 'offers("Show Source Line")', 'offers("Copy Instruction")', 'offers("Copy Source Location")'] }
  - key: Esc
