scenario: 1
name: terminal/keys-status-label-vim
pack: codetracer
summary: "A base with modes shows its mode on the status line (Vim: NORMAL [DEBUG])."
stage:
  - use: record-program
    with: { program: calc }
  - use: select-keymap
    with: { preset: vim }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - expect: { at: status-line, assert: 'says("NORMAL [DEBUG]")' }
