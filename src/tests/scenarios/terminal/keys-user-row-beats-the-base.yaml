scenario: 1
name: terminal/keys-user-row-beats-the-base
pack: codetracer
summary: >-
  A user's keybindings.json row (JSONC, as VS Code writes it) beats the base
  row for the same key: F10 continues to the end instead of stepping over.
stage:
  - use: record-program
    with: { program: calc }
  - use: plant-config
    with:
      file: keybindings.json
      content: |
        // JSONC, as VS Code writes it
        [
          { "key": "f10", "command": "debugger.continue" },
        ]
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - key: F10
  - wait: { until: { at: replay-position, tick: 171 }, timeout: 30s }
