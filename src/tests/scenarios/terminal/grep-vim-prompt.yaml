scenario: 1
name: terminal/grep-vim-prompt
pack: codetracer
summary: >-
  Under Vim, `:grep scale` at Vim's own `:` prompt lists the sources' matches
  without moving the replay; `:grep` alone opens the field on the pane's
  query, and typing over the selected query searches the new word.
stage:
  - use: record-program
    with: { program: multi_root/app/main.py }
  - use: select-keymap
    with: { preset: vim }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - type: ":grep scale"
  - key: Enter
  - wait: { until: { at: 'pane[title="FIND IN FILES"]', assert: 'has-row("4 results in 2 files")' }, timeout: 30s }
  - expect: { at: replay-position, tick: 1 }
  - type: ":grep"
  - key: Enter
  - wait: { until: { at: omnibox, query: ":grep scale" }, timeout: 10s }
  - type: "result"
  - key: Enter
  - wait: { until: { at: 'pane[title="FIND IN FILES"]', assert: 'has-row("result")' }, timeout: 30s }
  - expect: { at: 'pane[title="FIND IN FILES"]', assert: 'lacks-row("4 results in 2 files")' }
  - expect: { at: replay-position, tick: 1 }
