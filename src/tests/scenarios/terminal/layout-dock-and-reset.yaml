scenario: 1
name: terminal/layout-dock-and-reset
pack: codetracer
summary: >-
  `:dock bottom` on the focused Files pane docks it (its strip no longer
  holds Files beside VCS) and `:reset-layout` restores the shared default (Files back beside VCS, its label cut to `VC`
  at 120 columns).
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 120, height: 40 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: { at: 'pane-tab[label="Files"]' }
  - chord: Ctrl+P
  - type: ":dock bottom"
  - key: Enter
  - wait: { until: { at: status-line, assert: 'says("applied")' }, timeout: 10s }
  - expect: { at: 'pane[title="VCS"]', present: true }
  - chord: Ctrl+P
  - type: ":reset-layout"
  - key: Enter
  - wait: { until: { at: 'pane[title="Files"]', tabs: { subsequence: ["Files", "VC"] } }, timeout: 10s }
