scenario: 1
name: terminal/parity-shift-right-click-is-the-terminals
pack: codetracer
summary: >-
  Shift + right-click is left to the terminal: it opens no menu. A plain
  right click opens the editor's menu, whose last row is the inert hint
  naming Shift + right-click, below Add tracepoint.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "shows-line(29)" }, timeout: 30s }
  - click: { at: 'editor[file="main.py"]/line[number="29"]', anchor: text-start, button: right, modifiers: [Shift] }
  - expect: { at: context-menu, absent: true }
  - click: { at: 'editor[file="main.py"]/line[number="29"]', anchor: text-start, button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - expect: { at: context-menu, assert: 'offers("Add tracepoint")' }
  - expect: { at: context-menu, geometry: { below: 'editor[file="main.py"]/line[number="29"]' } }
  - key: Esc
  - wait: { until: { at: context-menu, absent: true }, timeout: 10s }
