scenario: 1
name: terminal/screen-reader-hover-says-nothing
pack: codetracer
summary: >-
  In the screen-reader mode the pointer resting on a top-bar control (Next)
  says nothing: the status line still says where focus is.
stage:
  - use: record-program
    with: { program: calc }
  - use: front-end-options
    with: { options: { screen-reader: "on" } }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: status-line, assert: 'says("Source: 1 > #!/usr/bin/env python3")' }, timeout: 30s }
  - hover: { at: 'toolbar/toolbar-button[label="Next"]', for: 800ms }
  - expect: { at: status-line, assert: ['says("Source: 1 > #!/usr/bin/env python3")', 'lacks("Next")'] }
