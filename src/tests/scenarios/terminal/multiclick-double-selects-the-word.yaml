scenario: 1
name: terminal/multiclick-double-selects-the-word
pack: codetracer
summary: >-
  In Edit mode two presses select the word under the pointer: typing then
  replaces exactly `snake_case_name`, leaving the rest of the line.
stage:
  - use: write-project
    with:
      files:
        fixture.txt: "snake_case_name = other.attr(x)\n    leading indentation\na == b and p->q\na.b\n\nprice λx 3€ end\nlast line no terminator"
  - use: open-project
    with: { folder: $project, file: fixture.txt, width: 160, height: 40 }
steps:
  - wait: { until: ready, timeout: 60s }
  - wait: { until: { at: 'editor[file="fixture.txt"]', assert: 'shows-text("snake_case_name")' }, timeout: 20s }
  - click: { at: 'editor[file="fixture.txt"]/line[number="1"]', anchor: "column(3)", count: 2 }
  - type: "Z"
  - wait: { until: { at: 'editor[file="fixture.txt"]/line[number="1"]', text: "Z = other.attr(x)" }, timeout: 10s }
