scenario: 1
name: terminal/find-in-files-match-case-toggle
pack: codetracer
summary: >-
  The Find in Files toggles rerun the search: `:grep Scale` (case-blind by
  default) finds the 4 results; with the field open again, Alt+C turns Match
  Case on and the rerun finds none; Alt+C again finds the 4 again; Alt+R turns
  regular expressions on — each toggle says so on the status line.
stage:
  - use: record-program
    with: { program: multi_root/app/main.py }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - chord: Ctrl+P
  - type: ":grep Scale"
  - key: Enter
  - wait: { until: { at: 'pane[title="FIND IN FILES"]', assert: 'has-row("4 results in 2 files")' }, timeout: 30s }
  - chord: Ctrl+P
  - type: ":grep Scale"
  - chord: Alt+c
  - wait: { until: { at: status-line, assert: 'says("Match Case on")' }, timeout: 20s }
  - wait: { until: { at: 'pane[title="FIND IN FILES"]', assert: "has-row(\"No results for \\\"Scale\\\"\")" }, timeout: 20s }
  - chord: Alt+c
  - wait: { until: { at: status-line, assert: 'says("Match Case off")' }, timeout: 20s }
  - wait: { until: { at: 'pane[title="FIND IN FILES"]', assert: 'has-row("4 results in 2 files")' }, timeout: 20s }
  - chord: Alt+r
  - wait: { until: { at: status-line, assert: 'says("Use Regular Expression on")' }, timeout: 20s }
