scenario: 1
name: terminal/constraints-pane-in-edit-mode
pack: codetracer
summary: >-
  In Edit mode over a Noir circuit, the Constraints pane shows the desktop's
  headline (18 ACIR opcodes, 33 unconstrained) and rows — each function and
  opcode with its count and where it is declared (main at src/main.nr:3,
  halve at src/main.nr:11, the range checks in src/checks.nr:2); a press on
  halve opens its line, a right press on main opens the desktop's menu (Go to
  Source, Copy Name, Copy Source Location), and a press on a directive says
  the compiler generated it.
stage:
  - use: fixture-project
    with: { name: noir-constraints }
  - use: open-project
    with: { folder: $project, width: 200, height: 50 }
steps:
  - wait: { until: ready, timeout: 60s }
  - chord: Ctrl+P
  - type: ":constraints"
  - key: Enter
  - wait: { until: { at: 'pane[title="Constraints"]', assert: 'has-row("18 ACIR opcodes, 33 unconstrained")' }, timeout: 120s }
  - click: { at: 'pane-tab[label="Constraints"]', button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Maximise container"]', present: true }, timeout: 10s }
  - click: { at: 'context-menu/menu-item[label="Maximise container"]' }
  - wait: { until: { at: 'pane[title="Constraints"]/row[first="halve"]', present: true }, timeout: 10s }
  - expect: { at: 'pane[title="Constraints"]', assert: ['has-row("src/main.nr:3")', 'has-row("BLACKBOX::RANGE")', 'has-row("src/checks.nr:2")', 'has-row("src/main.nr:11")'] }
  - click: { at: 'pane[title="Constraints"]/row[first="halve"]', anchor: text-start }
  - wait: { until: { at: status-line, assert: 'says("opened src/main.nr:11")' }, timeout: 20s }
  - click: { at: 'pane[title="Constraints"]/row[first="main"]', anchor: text-start, button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Copy Source Location"]', present: true }, timeout: 10s }
  - expect: { at: 'context-menu/menu-item[label="Go to Source"]', present: true }
  - expect: { at: 'context-menu/menu-item[label="Copy Name"]', present: true }
  - key: Esc
  - wait: { until: { at: context-menu, absent: true }, timeout: 10s }
  - click: { at: 'pane[title="Constraints"]/row[first="directive_invert"]', anchor: text-start }
  - wait: { until: { at: status-line, assert: 'says("the compiler generated this function")' }, timeout: 20s }
