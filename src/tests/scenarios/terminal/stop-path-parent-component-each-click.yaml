scenario: 1
name: terminal/stop-path-parent-component-each-click
pack: codetracer
summary: >-
  add, then scale, then add again: each call-trace click shows its own call's
  file (helpers.py, extra.py, helpers.py), never the previous one's.
stage:
  - use: record-program
    with: { program: multi_root/app/main.py }
  - use: open-recording
    with: { width: 280, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: call-trace.loaded
  - click: { at: 'call-trace/call[name="add"]' }
  - wait: { until: { at: 'editor[file="helpers.py"]', assert: 'shows-text("return left + right")' }, timeout: 30s }
  - expect: { at: status-line, message: { contains: "helpers.py" } }
  - click: { at: 'call-trace/call[name="scale"]' }
  - wait: { until: { at: 'editor[file="extra.py"]', assert: 'shows-text("result = value * factor")' }, timeout: 30s }
  - expect: { at: 'editor[file="helpers.py"]', absent: true }
  - expect: { at: status-line, message: { contains: "extra.py" } }
  - click: { at: 'call-trace/call[name="add"]' }
  - wait: { until: { at: 'editor[file="helpers.py"]', assert: 'shows-text("return left + right")' }, timeout: 30s }
  - expect: { at: 'editor[file="extra.py"]', absent: true }
  - expect: { at: status-line, message: { contains: "helpers.py" } }
