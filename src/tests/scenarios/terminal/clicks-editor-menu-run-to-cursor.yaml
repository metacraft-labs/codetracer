scenario: 1
name: terminal/clicks-editor-menu-run-to-cursor
pack: codetracer
summary: >-
  A right click in the editor's text opens the desktop's editor menu (Copy,
  Find, Jump to line, Run to Cursor, the call jumps, the breakpoint and
  tracepoint entries), every entry enabled; Run to Cursor runs the replay to
  that line and closes the menu.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "shows-line(31)" }, timeout: 30s }
  - click: { at: 'editor[file="main.py"]/line[number="31"]', anchor: text-end, button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - expect: { at: 'context-menu/menu-item[label="Copy"]', enabled: true }
  - expect: { at: 'context-menu/menu-item[label="Find"]', geometry: { below: 'context-menu/menu-item[label="Copy"]' } }
  - expect: { at: 'context-menu/menu-item[label="Jump to line"]', geometry: { below: 'context-menu/menu-item[label="Find"]' } }
  - expect: { at: 'context-menu/menu-item[label="Run to Cursor"]', enabled: true, geometry: { below: 'context-menu/menu-item[label="Jump to line"]' } }
  - expect: { at: 'context-menu/menu-item[label="Jump backward to line"]', geometry: { below: 'context-menu/menu-item[label="Run to Cursor"]' } }
  - expect: { at: 'context-menu/menu-item[label="Jump to call"]', enabled: true, geometry: { below: 'context-menu/menu-item[label="Jump backward to line"]' } }
  - expect: { at: 'context-menu/menu-item[label="Jump forward to call"]', geometry: { below: 'context-menu/menu-item[label="Jump to call"]' } }
  - expect: { at: 'context-menu/menu-item[label="Jump backward to call"]', geometry: { below: 'context-menu/menu-item[label="Jump forward to call"]' } }
  - expect: { at: 'context-menu/menu-item[label="Add breakpoint"]', geometry: { below: 'context-menu/menu-item[label="Jump backward to call"]' } }
  - expect: { at: 'context-menu/menu-item[label="Add Inline Breakpoint"]', geometry: { below: 'context-menu/menu-item[label="Add breakpoint"]' } }
  - expect: { at: 'context-menu/menu-item[label="Add tracepoint"]', enabled: true, geometry: { below: 'context-menu/menu-item[label="Add Inline Breakpoint"]' } }
  - click: { at: 'context-menu/menu-item[label="Run to Cursor"]' }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(31)" }, timeout: 30s }
  - expect: { at: context-menu, absent: true }
