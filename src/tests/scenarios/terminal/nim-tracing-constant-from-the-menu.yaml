scenario: 1
name: terminal/nim-tracing-constant-from-the-menu
pack: codetracer
summary: >-
  A right click on the `const` section's `cubes` entry offers Trace Constant
  Initializer; choosing it traces the initializer into a new session tab
  (`tracing-constant`) beside the first, stopped in the initializer or the
  `compute` it calls.
stage:
  - use: nim-project
  - use: open-recording
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: editor.loaded, timeout: 60s }
  - expect: { at: session-strip, count: 1 }
  - click: { at: 'editor[file="tracing.nim"]/line[number="15"]', anchor: text-start, button: right }
  - wait: { until: { at: 'context-menu/menu-item[label="Trace Constant Initializer"]', present: true }, timeout: 10s }
  - click: { at: 'context-menu/menu-item[label="Trace Constant Initializer"]' }
    settle: false
  - wait: { until: { at: session-strip, count: 2 }, timeout: 180s }
  - expect: { at: session-strip, assert: 'has-tab-matching("tracing-constant")' }
  - wait: { until: { at: 'editor[file="tracing.nim"]', assert: "stopped-within(6, 15)" }, timeout: 120s }
