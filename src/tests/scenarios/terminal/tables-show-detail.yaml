scenario: 1
name: terminal/tables-show-detail
pack: codetracer
summary: >-
  Under Vim, with the wide event selected in the Event Log, Shift+K opens its
  detail row (the event's whole output, to `RIGHT-EDGE>>`) and a second K
  closes it; the palette's Show Detail opens it again — none of them moves
  the replay.
stage:
  - use: record-program
    with: { program: wide_lines/main.py }
  - use: select-keymap
    with: { preset: vim }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'pane[title="Event Log"]', assert: 'has-row("<<LEFT-EDGE>>")' }, timeout: 30s }
  - expect: { at: 'pane[title="Event Log"]', assert: 'lacks-row("RIGHT-EDGE>>")' }
  - click: { at: 'event-log/event[#1]' }
  - wait: { until: { at: replay-position, tick: 11 }, timeout: 30s }
  - key: K
  - wait: { until: { at: 'pane[title="Event Log"]', assert: 'has-row("RIGHT-EDGE>>")' }, timeout: 10s }
  - expect: { at: replay-position, tick: 11 }
  - key: K
  - wait: { until: { at: 'pane[title="Event Log"]', assert: 'lacks-row("RIGHT-EDGE>>")' }, timeout: 10s }
  - chord: Ctrl+P
  - type: ":Show Detail"
  - key: Enter
  - wait: { until: { at: 'pane[title="Event Log"]', assert: 'has-row("RIGHT-EDGE>>")' }, timeout: 10s }
  - expect: { at: replay-position, tick: 11 }
