scenario: 1
name: terminal/keys-shift-end-selects-and-ctrl-c-copies
pack: codetracer
summary: >-
  In the read-only Debug editor Shift+End selects from the caret to the
  line's end, scrolling its tail into view; Ctrl+C copies it and says so; a
  letter typed afterwards changes nothing in the read-only text.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: { at: 'editor[file="main.py"]/line[number="11"]', anchor: "column(3)" }
  - chord: Shift+End
  - wait: { until: { at: 'editor[file="main.py"]/line[number="11"]', text: { contains: "the Tier-1" } }, timeout: 10s }
  - chord: Ctrl+C
  - wait: { until: { at: status-line, assert: 'says("copied")' }, timeout: 10s }
  - key: x
  - expect: { at: 'editor[file="main.py"]/line[number="11"]', text: { contains: "the Tier-1" } }
