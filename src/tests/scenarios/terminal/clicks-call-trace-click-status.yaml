scenario: 1
name: terminal/clicks-call-trace-click-status
pack: codetracer
summary: >-
  After a call-trace click moves the replay, the status line says where it
  landed (the new tick) instead of the old location.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: call-trace.loaded
  - expect: { at: status-line, assert: 'says("main.py:1 ")' }
  - click: { at: 'call-trace/call[#6]' }
  - wait: { until: { at: replay-position, assert: "past(1)" }, timeout: 30s }
  - wait: { until: { at: status-line, assert: 'lacks("main.py:1 ")' }, timeout: 10s }
  - expect: { at: status-line, assert: 'says("tick ")' }
