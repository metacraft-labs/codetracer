scenario: 1
name: terminal/clicks-ctrl-and-middle-click-go-to-a-line
pack: codetracer
summary: >-
  Ctrl+click on a line of the editor goes to it, and so does a middle click;
  the status line says where the replay is.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "shows-line(36)" }, timeout: 30s }
  - click: { at: 'editor[file="main.py"]/line[number="31"]', anchor: text-end, modifiers: [Ctrl] }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(31)" }, timeout: 30s }
  - expect: { at: status-line, assert: 'says("main.py:31")' }
  - expect: { at: replay-position, assert: "past(0)" }
  - click: { at: 'editor[file="main.py"]/line[number="36"]', anchor: text-end, button: middle }
  - wait: { until: { at: 'editor[file="main.py"]', assert: "stopped-at(36)" }, timeout: 30s }
  - expect: { at: status-line, assert: 'says("main.py:36")' }
