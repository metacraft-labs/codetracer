scenario: 1
name: terminal/layout-default-at-200x50
pack: codetracer
summary: >-
  At 200x50 the shared default layout is shown whole, nothing folded:
  Files, the Call Trace, Variables and the Event Log, and no Constraints pane.
stage:
  - use: record-program
    with: { program: calc }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - expect: { at: status-line, assert: 'lacks("[folded")' }
  - expect: { at: 'pane-tab[label="Variables"]', present: true }
  - expect: { at: 'pane-tab[label="Event Log"]', present: true }
  - expect: { at: 'pane-tab[label="Files"]', present: true }
  - expect: { at: 'pane-tab[label="Call Trace"]', present: true }
  - expect: { at: 'pane-tab[label="Constraints"]', absent: true }
