scenario: 1
name: terminal/drop-overlay-release-commits-undo-reverts
pack: codetracer
summary: >-
  Dragging the Variables tab and releasing it over the Call Trace pane
  applies the drop (the Variables tab joins the Call Trace's stack), and
  `:undo-layout` reverts it (Variables is back beside Scratchpad).
stage:
  - use: record-program
    with: { program: calc }
  - use: front-end-options
    with: { options: { scrollbar-fade: "off" } }
  - use: open-recording
    with: { width: 200, height: 50 }
steps:
  - wait: { until: replay-idle, timeout: 120s }
  - expect: { at: 'pane[title="Variables"]', tabs: { subsequence: ["Variables", "Scratchpad"] } }
  - drag:
      from: 'pane-tab[label="Variables"]'
      to: 'pane[title="Call Trace"]'
  - wait: { until: { at: status-line, assert: 'says("applied")' }, timeout: 10s }
  - expect: { at: 'pane[title="Variables"]', tabs: { contains: "Call Trace" } }
  - chord: Ctrl+P
  - type: ":undo-layout"
  - key: Enter
  - wait: { until: { at: 'pane[title="Call Trace"]', assert: 'lacks-tab("Variables")' }, timeout: 10s }
  - expect: { at: 'pane-tab[label="Scratchpad"]', geometry: { right-of: 'pane-tab[label="Variables"]' } }
