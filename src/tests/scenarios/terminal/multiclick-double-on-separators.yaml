scenario: 1
name: terminal/multiclick-double-on-separators
pack: codetracer
summary: >-
  A double press inside `==` selects the separator run `==` (the word is the
  separators'), so typing replaces only it.
stage:
  - use: write-project
    with:
      files:
        fixture.txt: "snake_case_name = other.attr(x)\n    leading indentation\na == b and p->q\na.b\n\nprice λx 3€ end\nlast line no terminator"
  - use: open-project
    with: { folder: $project, file: fixture.txt, width: 160, height: 40 }
steps:
  - wait: { until: ready, timeout: 60s }
  - wait: { until: { at: 'editor[file="fixture.txt"]', assert: 'shows-text("a == b and p->q")' }, timeout: 20s }
  - click: { at: 'editor[file="fixture.txt"]/line[number="3"]', anchor: "column(4)", count: 2 }
  - type: "!"
  - wait: { until: { at: 'editor[file="fixture.txt"]/line[number="3"]', text: "a ! b and p->q" }, timeout: 10s }
