scenario: 1
name: agent-activity-deepreview/review-over-saved-edit-layout
pack: codetracer
summary: >-
  A review over an edit layout a previous session saved without AGENT
  ACTIVITY materialises the panel once, beside FILES and VCS, keeps the VCS
  panel in front, and brings back none of the replay-only panels.

stage:
  - use: review-dataset
    with: { variant: plain }
  - use: plant-edit-layout
    with: { fixture: edit-layout-without-agent-activity }
  - use: open-review

steps:
  - wait: { until: { at: vcs, present: true }, timeout: 60s }
  # the window has finished loading the review
  - wait: { until: settled, timeout: 30s }
  - wait: { until: { at: window, assert: 'has-pane("AGENT ACTIVITY")' }, timeout: 30s }
  - expect: { at: window, assert: 'has-pane("FILES")' }
  - expect: { at: window, assert: 'has-pane("VCS")' }
  # materialised once (one tab resolves) and in front
  - expect: { at: 'pane-tab[label="AGENT ACTIVITY"]', active: true }
  - expect: { at: window, assert: 'in-front("VCS")' }
  - expect: { at: vcs, stats: { contains: "3 files" } }
  - expect: { at: agent-activity, roll-up: 0 }
  - expect: { at: window, assert: 'lacks-pane("CALLTRACE")' }
  - expect: { at: window, assert: 'lacks-pane("EVENT LOG")' }
  - expect: { at: window, assert: 'lacks-pane("TIMELINE")' }
  - expect: { at: window, assert: 'lacks-pane("TERMINAL OUTPUT")' }
