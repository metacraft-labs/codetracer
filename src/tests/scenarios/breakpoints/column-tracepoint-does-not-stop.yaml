scenario: 1
name: breakpoints/column-tracepoint-does-not-stop
pack: codetracer
summary: >-
  A tracepoint added from the editor's context menu at a mid-line caret
  (`var b`, line 1 column 12), with `log(a)` run by its Run button, logs a's
  value into the Event Log, and Continue does not stop at it: the replay
  goes on past line 1.

stage:
  - use: record-program
    with: { program: js_column_breakpoints/program.js }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - click: 'toolbar/toolbar-button[label="run-to-entry-image"]'
    settle: false
  - wait: { until: { at: 'editor[file="program.js"]', current-line: 1 }, timeout: 60s }
  - wait: { until: replay-idle, timeout: 60s }
  - click: { at: 'editor[file="program.js"]/line[number="1"]', anchor: caret(12), button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - click: 'context-menu/menu-item[label="Add tracepoint"]'
  - wait: { until: { at: 'tracepoint-editor[line="1"]', focused: true }, timeout: 20s }
  - type: "log(a)"
  - click: { at: 'tracepoint-editor[line="1"]', anchor: run }
    settle: false
  - wait: { until: event-log.loaded, timeout: 60s }
  - expect: { at: event-log, assert: 'has-output("a=1")' }
  - click: 'toolbar/toolbar-button[label="continue-image"]'
    settle: false
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: { at: 'editor[file="program.js"]', current-line: { gt: 1 } }, timeout: 60s }
