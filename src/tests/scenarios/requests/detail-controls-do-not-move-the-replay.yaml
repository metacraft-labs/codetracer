scenario: 1
name: requests/detail-controls-do-not-move-the-replay
pack: codetracer
summary: >-
  A single click on a request opens its detail without moving the replay;
  the detail's tabs answer at once (Response comes to the front), a click on
  another row selects it, and dragging the handle between list and detail
  resizes them — none of them moves the replay.

stage:
  - use: request-session
  - use: open-recording
    with: { width: 1900, height: 1400 }

steps:
  - wait: { until: { at: requests, present: true }, timeout: 120s }
  - wait: settled
  - wait: { until: { at: requests, count: 8 }, timeout: 120s }
  - wait: replay-idle
  - expect: { at: status-line, location: { matches: ":13#6$" } }
  - click: 'requests/request-row[id="04"]'
  - wait: { until: { at: requests/request-detail, present: true }, timeout: 10s }
  - click: 'requests/request-detail/detail-tab[label="Response"]'
  - expect: { at: 'requests/request-detail/detail-tab[label="Response"]', active: true }
  - expect: { at: status-line, location: { matches: ":13#6$" } }
  - click: 'requests/request-row[id="03"]'
  - expect: { at: 'requests/request-row[id="03"]', selected: true }
  - expect: { at: status-line, location: { matches: ":13#6$" } }
  - drag: { from: requests/resize-handle, to: 'requests/request-row[id="03"]' }
  - expect: { at: requests/request-detail, present: true }
  - expect: { at: status-line, location: { matches: ":13#6$" } }
