scenario: 1
name: ct-host/value-history-loads-on-a-host-page
pack: codetracer
summary: >-
  On a `ct host` page, stopped in iterate_asteroids after its first pass,
  the state pane's "Toggle history value" on remaining_shield opens the
  variable's value history, one row per value it held.

stage:
  - use: record-program
    with: { program: noir_space_ship }
  - use: open-recording
    with: { deployment: web }

steps:
  - wait: { until: call-trace.loaded, timeout: 360s }
  - wait: { until: replay-idle, timeout: 120s }
  - click: 'pane-tab[label="EVENT LOG"]'
  - wait: { until: event-log.loaded, timeout: 60s }
  - wait: { until: settled, timeout: 30s }
  # the first "Damage:" line stops in status_report; a step out returns to
  # its call in iterate_asteroids, after the first pass computed damage
  - click: 'event-log/event[text="stdout: Damage: 100"]'
    settle: false
  - wait: { until: { at: status-line, location: { matches: "shield.nr:(5[0-9]|6[0-9])#" } }, timeout: 120s }
  - wait: { until: replay-idle, timeout: 60s }
  - click: 'toolbar/toolbar-button[label="step-out-image"]'
    settle: false
  - wait: { until: { at: status-line, location: { matches: "shield.nr:14#" } }, timeout: 120s }
  - wait: { until: replay-idle, timeout: 60s }
  - wait: { until: { at: 'variables/variable[name="remaining_shield"]', present: true }, timeout: 60s }
  - click: { at: 'variables/variable[name="remaining_shield"]', anchor: history }
  - wait: { until: { at: 'variables/variable[name="remaining_shield"]', history: { count: { gt: 0 } } }, timeout: 120s }
