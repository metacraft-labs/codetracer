scenario: 1
name: editor/context-menu-is-mode-dependent
pack: codetracer
summary: >-
  The editor's right-click menu is the mode's: in Edit mode it offers Cut,
  Paste and Replace and no replay command; after Ctrl+F5 into Debug mode, on
  the same line, it offers the line jumps and no edit-only entry; Copy, Find
  and the breakpoint row are in both; every disabled row says why; and after
  Stop the Edit-mode menu is back without a replay command.

stage:
  - use: open-project
    with: { folder: test-programs }

steps:
  - wait: { until: { at: 'editor[file="main.nr"]/line[number="3"]', present: true }, timeout: 90s }
  - expect: { at: window, mode: edit }
  # ---- Edit ----
  - click: { at: 'editor[file="main.nr"]/line[number="3"]', anchor: text-start, button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - expect: { at: context-menu, count: { gt: 2 }, assert: disabled-rows-say-why }
  - expect: { at: context-menu, assert: no-raw-entities }
  - expect: { at: context-menu, assert: 'offers("Cut")' }
  - expect: { at: context-menu, assert: 'offers("Paste")' }
  - expect: { at: context-menu, assert: 'offers("Replace")' }
  - expect: { at: context-menu, assert: 'offers("Copy")' }
  - expect: { at: context-menu, assert: 'offers("Find")' }
  - expect: { at: context-menu, assert: 'lacks("Jump to line")' }
  - expect: { at: context-menu, assert: 'lacks("Run to Cursor")' }
  - expect: { at: context-menu, assert: 'lacks("Jump backward to line")' }
  - expect: { at: context-menu, assert: 'lacks("Jump to call")' }
  - expect: { at: context-menu, assert: 'lacks("Jump forward to call")' }
  - expect: { at: context-menu, assert: 'lacks("Jump backward to call")' }
  - expect: { at: context-menu, assert: 'lacks("Add tracepoint")' }
  - expect: { at: context-menu, assert: 'lacks("Delete tracepoint")' }
  - expect: { at: context-menu, assert: 'lacks("Enable tracepoint")' }
  - expect: { at: context-menu, assert: 'lacks("Disable tracepoint")' }
  - expect: { at: context-menu, assert: 'offers("Add breakpoint")' }
  - key: Esc
  - expect: { at: context-menu, absent: true }
  # ---- Debug ----
  - chord: Ctrl+F5
    settle: false
  - wait: { until: { at: window, mode: debug }, timeout: 60s }
  - wait: { until: { at: 'toolbar/toolbar-button[label="stop-image"]', present: true }, timeout: 60s }
  - wait: { until: { at: 'editor[file="main.nr"]/line[number="3"]', present: true }, timeout: 60s }
  - click: { at: 'editor[file="main.nr"]/line[number="3"]', anchor: text-start, button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - expect: { at: context-menu, count: { gt: 2 }, assert: disabled-rows-say-why }
  - expect: { at: context-menu, assert: no-raw-entities }
  - expect: { at: context-menu, assert: 'offers("Jump to line")' }
  - expect: { at: context-menu, assert: 'offers("Run to Cursor")' }
  - expect: { at: context-menu, assert: 'offers("Jump backward to line")' }
  - expect: { at: context-menu, assert: 'offers("Copy")' }
  - expect: { at: context-menu, assert: 'offers("Find")' }
  - expect: { at: context-menu, assert: 'lacks("Cut")' }
  - expect: { at: context-menu, assert: 'lacks("Paste")' }
  - expect: { at: context-menu, assert: 'lacks("Replace")' }
  - expect: { at: context-menu, assert: 'offers("Add breakpoint")' }
  - key: Esc
  - expect: { at: context-menu, absent: true }
  # ---- back to Edit ----
  - click: 'toolbar/toolbar-button[label="stop-image"]'
    settle: false
  - wait: { until: { at: window, mode: edit }, timeout: 60s }
  - wait: { until: { at: 'editor[file="main.nr"]/line[number="3"]', present: true }, timeout: 60s }
  - click: { at: 'editor[file="main.nr"]/line[number="3"]', anchor: text-start, button: right }
  - wait: { until: { at: context-menu, present: true }, timeout: 10s }
  - expect: { at: context-menu, count: { gt: 2 }, assert: disabled-rows-say-why }
  - expect: { at: context-menu, assert: no-raw-entities }
  - expect: { at: context-menu, assert: 'offers("Cut")' }
  - expect: { at: context-menu, assert: 'offers("Paste")' }
  - expect: { at: context-menu, assert: 'offers("Replace")' }
  - expect: { at: context-menu, assert: 'offers("Copy")' }
  - expect: { at: context-menu, assert: 'offers("Find")' }
  - expect: { at: context-menu, assert: 'lacks("Jump to line")' }
  - expect: { at: context-menu, assert: 'lacks("Run to Cursor")' }
  - expect: { at: context-menu, assert: 'lacks("Jump backward to line")' }
  - expect: { at: context-menu, assert: 'lacks("Jump to call")' }
  - expect: { at: context-menu, assert: 'lacks("Jump forward to call")' }
  - expect: { at: context-menu, assert: 'lacks("Jump backward to call")' }
  - expect: { at: context-menu, assert: 'lacks("Add tracepoint")' }
  - expect: { at: context-menu, assert: 'lacks("Delete tracepoint")' }
  - expect: { at: context-menu, assert: 'lacks("Enable tracepoint")' }
  - expect: { at: context-menu, assert: 'lacks("Disable tracepoint")' }
  - expect: { at: context-menu, assert: 'offers("Add breakpoint")' }
  - key: Esc
  - expect: { at: context-menu, absent: true }
