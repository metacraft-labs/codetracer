scenario: 1
name: deepreview/diff-lines-are-classified
pack: codetracer
summary: >-
  A review's diff tabs mark every line: main.rs 8 added and 3 removed lines
  with 2 to 25 context lines on each side, utils.rs 8 added and nothing else,
  config.rs 7 removed; each side has one `@@` divider, and the gutter marks
  each added line on the new side and each removed line on the old side.

stage:
  - use: open-review
    with: { dataset: src/tests/gui/tests/deepreview/fixtures/sample-review.json }

steps:
  - wait: { until: { at: vcs, present: true }, timeout: 120s }
  - wait: { until: { at: 'review-diff[file="src/main.rs"]', present: true }, timeout: 60s }
  - wait: { until: settled, timeout: 30s }
  - wait: { until: { at: 'review-diff[file="src/main.rs"]', added: 8 }, timeout: 30s }
  - expect: { at: 'review-diff[file="src/main.rs"]', removed: 3, context-new: { ge: 2 }, context-old: { ge: 2 } }
  - expect: { at: 'review-diff[file="src/main.rs"]', context-new: { le: 25 }, context-old: { le: 25 } }
  - expect: { at: 'review-diff[file="src/main.rs"]', hunk-headers: 1, hunk-headers-old: 1, gutter-added: 8, gutter-removed: 3 }
  - click: 'vcs/changed-file[name="utils.rs"]'
  - wait: { until: { at: 'review-diff[file="src/utils.rs"]', added: 8 }, timeout: 30s }
  - expect: { at: 'review-diff[file="src/utils.rs"]', removed: 0, context-new: 0, context-old: 0 }
  - expect: { at: 'review-diff[file="src/utils.rs"]', hunk-headers: 1, hunk-headers-old: 1, gutter-added: 8, gutter-removed: 0 }
  - click: 'vcs/changed-file[name="config.rs"]'
  - wait: { until: { at: 'review-diff[file="src/config.rs"]', removed: 7 }, timeout: 30s }
  - expect: { at: 'review-diff[file="src/config.rs"]', added: 0, context-new: 0, context-old: 0 }
  - expect: { at: 'review-diff[file="src/config.rs"]', hunk-headers: 1, hunk-headers-old: 1, gutter-added: 0, gutter-removed: 7 }
