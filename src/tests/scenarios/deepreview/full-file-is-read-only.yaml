scenario: 1
name: deepreview/full-file-is-read-only
pack: codetracer
summary: >-
  In Open File mode a review's file opens in an editor that cannot be edited:
  typing into it changes nothing.

stage:
  - use: open-review
    with: { dataset: src/tests/gui/tests/deepreview/fixtures/sample-review.json }

steps:
  - wait: { until: { at: vcs, present: true }, timeout: 120s }
  - click: vcs/diff-toggle
  - expect: { at: vcs, unified-diff: false }
  - click: 'vcs/changed-file[name="main.rs"]'
  - wait: { until: { at: 'editor[file="main.rs"]', present: true }, timeout: 30s }
  - wait: { until: { at: 'editor[file="main.rs"]/line[number="1"]', text: "fn main() {" }, timeout: 30s }
  - expect: { at: 'editor[file="main.rs"]', read-only: true }
  - click: { at: 'editor[file="main.rs"]/line[number="1"]', anchor: text-start }
  - type: EDITEDBYTEST
  - expect: { at: 'editor[file="main.rs"]/line[number="1"]', text: "fn main() {" }
  - expect: { at: 'editor[file="main.rs"]/line[number="2"]', text: { contains: "let x = 10;" } }
  - expect: { at: review-state, unsaved: 0 }
