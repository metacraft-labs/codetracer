scenario: 1
name: deepreview/materialized-review
pack: codetracer
summary: >-
  A review collected from a materialized (Noir) recording opens like any
  other: main.nr, modified, with its coverage (10/10), no replay panels; the
  trace-context selector names the recording's runs (run-1, run-2); and the
  Agent Activity panel claims nothing about tests it never saw.

stage:
  - use: open-review
    with: { dataset: src/tests/gui/tests/deepreview/fixtures/materialized-review.json }

steps:
  - wait: { until: { at: vcs, present: true }, timeout: 120s }
  - wait: { until: settled, timeout: 30s }
  - expect: { at: vcs, count: 1, error: "" }
  - expect: { at: 'vcs/changed-file[name="main.nr"]', status: M, coverage: { contains: "10/10" } }
  - expect: { at: window, assert: 'has-pane("VCS")' }
  - expect: { at: window, assert: 'lacks-pane("CALLTRACE")' }
  - expect: { at: window, assert: 'lacks-pane("EVENT LOG")' }
  - expect: { at: trace-context, options: ["run-1", "run-2"] }
  - expect: { at: agent-activity, roll-up: 0 }
  - expect: { at: agent-activity, assert: 'never-says("all passing")' }
  - expect: { at: agent-activity, assert: 'never-says("0/0")' }
  - expect: { at: agent-activity, assert: 'never-says(" 0 passed")' }
