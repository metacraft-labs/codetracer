scenario: 1
name: deepreview/boundary-is-operable-from-the-keyboard
pack: codetracer
summary: >-
  A collapsed region's handle is a button in the tab order, named for what it
  does ("Show 10 more lines above"). Reached with Tab from the diff (past the
  call selector), Enter reveals ten lines (2 still hidden), and Shift+Enter
  reveals the rest: the region is gone and line 25 is shown.

stage:
  - use: open-review
    with: { dataset: src/tests/gui/tests/deepreview/fixtures/sample-review.json }

steps:
  - wait: { until: { at: vcs, present: true }, timeout: 120s }
  - wait: { until: { at: 'review-diff[file="src/main.rs"]', present: true }, timeout: 60s }
  - wait: { until: settled, timeout: 30s }
  - wait: { until: { at: 'review-diff[file="src/main.rs"]', boundaries: 2 }, timeout: 30s }
  - expect: { at: 'review-diff[file="src/main.rs"]/review-boundary[direction="above"]', keyboard: true, label: { contains: "Show 10 more lines above" } }
  - click: 'review-diff[file="src/main.rs"]/hunk-divider'
  - key: Tab
  - key: Tab
  - wait: { until: { at: 'review-diff[file="src/main.rs"]/review-boundary[direction="above"]', focused: true }, timeout: 10s }
  - key: Enter
  - wait: { until: { at: 'review-diff[file="src/main.rs"]/review-boundary[direction="above"]', hidden: 2 }, timeout: 30s }
