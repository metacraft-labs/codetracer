scenario: 1
name: build/output-streams
pack: codetracer
summary: >-
  A build's stdout and stderr lines appear in the BUILD panel with their
  text and in their order, stderr drawn italic and in a different colour
  from stdout. (The project's task prints the lines; the desktop's main
  process runs it, as for any build.)

stage:
  - use: project-fixture
    with: { name: build-streams }
  - use: open-project
    with: { folder: $project }

steps:
  - wait: { until: { at: 'strip-tab[label="BUILD"]', present: true }, timeout: 60s }
  - wait: { until: settled, timeout: 30s }
  - click: { at: 'strip-tab[label="BUILD"]' }
  - wait: { until: { at: build-panel, present: true }, timeout: 30s }

  - beat: run-build
    narration: { text: "Ctrl+Shift+B lists the project's tasks; Enter runs the default one." }
    steps:
      - chord: { bound: build.run }
      - wait: { until: { at: omnibox, present: true }, timeout: 15s }
      - expect: { at: omnibox, query: ":build: " }
      - key: Enter
      - wait: { until: { at: build-panel, state: succeeded }, timeout: 120s }

  - beat: streams
    steps:
      - wait: { until: { at: 'build-panel/build-line[text="progress: 2 of 2 units done"]', present: true }, timeout: 15s }
      - expect: { at: build-panel, text: { subsequence: ["Compiling main", "Linking main"] } }
      - expect: { at: 'build-panel/build-line[text="Compiling main"]', stream: stdout, italic: false }
      - expect: { at: 'build-panel/build-line[text="Linking main"]', stream: stdout, italic: false }
      - expect: { at: 'build-panel/build-line[text="progress: 2 of 2 units done"]', stream: stderr, italic: true }
      - expect: { at: build-panel, assert: "streams-coloured-apart" }
      - capture: { name: streams }
