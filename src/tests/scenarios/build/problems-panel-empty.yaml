scenario: 1
name: build/problems-panel-empty
pack: codetracer
summary: >-
  A recording opens with a PROBLEMS tab on the footer's strip; docking it
  shows the problems panel with no rows (no build has run).

stage:
  - use: record-program
    with: { program: py_console_logs/main.py }
  - use: open-recording

steps:
  - wait: { until: replay-idle, timeout: 120s }
  - wait: { until: { at: 'strip-tab[label="PROBLEMS"]', present: true }, timeout: 30s }
  - click: { at: 'strip-tab[label="PROBLEMS"]' }
  - wait: { until: { at: problems-panel, present: true }, timeout: 30s }
  - expect: { at: problems-panel, where: docked, count: 0, errors: 0, warnings: 0, empty: true }
  - expect: { at: 'problems-panel/panel-button[label="All"]', active: true }
